<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2329; margin: 0; padding: 24px 24px 96px; line-height: 1.65; }
  .container { max-width: 880px; margin: 0 auto; }

    box-shadow: 0 1px 3px rgba(0,0,0,.06); font-size: 14px; color: #41464b; }

  .backlink { display:inline-block; margin: 4px 0 10px; color:#1664ff; text-decoration:none; font-size:14px; }
  .backlink:hover { text-decoration: underline; }
  .section { margin-top: 28px; }

  .tag-single { background: #e8f3ff; color: #1664ff; }
  .tag-multi  { background: #fff3e0; color: #d4860b; }

  .tag-fill   { background: #e9f9ee; color: #1a9e4b; }
  .kaodian { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; background: #f0f2f5; color: #646a73; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-badge { font-size:12px; padding:2px 9px; border-radius:4px; font-weight:700; margin-left:auto; }

    font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; overflow-x: auto; margin: 10px 0; white-space: pre; }
  .options { margin: 8px 0 4px; }
  .opt { display: flex; align-items:flex-start; gap:8px; padding: 9px 12px; border-radius: 8px; margin: 6px 0;
    background: #f7f8fa; border: 1.5px solid transparent; font-size: 14px; cursor: pointer; transition: all .12s; }
  .opt:hover { background: #eef2f7; }
  .opt .k { font-weight:700; color:#1664ff; min-width: 16px; }

  .opt.correct { background: #f0f9eb; border-color: #52c41a; }

  .opt.wrong { background: #fff1f0; border-color: #ff4d4f; }
  .opt.wrong .k { color:#ff4d4f; }

  .q-actions { margin-top: 10px; }

  .q-check:hover { background:#0e4fd8; }

  .blank { border:none; border-bottom: 1.5px solid #1664ff; background:#f7f8fa; padding: 3px 8px; margin: 0 4px;

  .blank.correct { border-bottom-color:#52c41a; background:#f0f9eb; }
  .blank.wrong { border-bottom-color:#ff4d4f; background:#fff1f0; }
  .answer { display: none; margin-top: 14px; padding: 14px; background: #f0f9eb;
    border-left: 4px solid #67c23a; border-radius: 6px; font-size: 14px; }
  .answer.show { display: block; }
  .answer .ans { font-weight: 700; color: #1a9e4b; margin-bottom: 8px; font-size: 15px; }
  .answer .label { font-weight: 700; }
  .answer .android { margin-top: 10px; padding: 10px 12px; background: #eef4ff; border-radius: 6px; color: #2a3a55; font-size: 13px; }
  .answer .android .label { color: #1664ff; }
  .footer { text-align: center; color: #9aa0a6; font-size: 13px; margin: 30px 0 10px; }
  .bar { position: fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #e5e6eb;
    box-shadow: 0 -2px 10px rgba(0,0,0,.05); padding: 10px 16px; display:flex; gap:10px; align-items:center; justify-content:center; z-index: 50; }
  .bar .prog { font-size: 14px; color:#41464b; margin-right: auto; }
  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }
  .bar .userbox a { color:#1664ff; cursor:pointer; text-decoration:none; }
  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }
  .result-panel.show { display:block; }
  .result-panel .score { font-size:30px; font-weight:800; color:#1664ff; }
  .result-panel .score small { font-size:15px; color:#646a73; font-weight:500; }
  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }
  .result-panel .wrongs a { display:inline-block; margin:3px 6px 3px 0; padding:2px 8px; background:#fff1f0; color:#ff4d4f; border-radius:4px; text-decoration:none; font-weight:600; }
  @media (max-width:600px) {
    body { padding: 12px 12px 100px; }
    .container { max-width: 100%; }
    h1 { font-size: 20px; }
    .meta { padding: 10px 12px; font-size: 13px; }
    .card { padding: 14px 12px; margin-bottom: 10px; }
    .q-body { font-size: 14px; }
    .code { font-size: 11px; padding: 10px 10px; }
    .opt { padding: 8px 10px; font-size: 13px; }
    .bar { padding: 8px 10px; gap: 6px; }
    .bar .prog { font-size: 12px; }
    .btn { padding: 7px 12px; font-size: 13px; }

    .answer { font-size: 13px; }
    .answer .android { font-size: 12px; }
  }

<script type="application/json" id="quizData">{"id": "vol04", "title": "全栈转型模拟自测卷", "sub": "依据自如 AI 平台笔试认证模拟题范围命题：后端 Java（Spring Boot / MyBatis-Plus / Redis / RabbitMQ / Kafka / MySQL）、前端 H5（Vue3 / Axios / DevTools / CSS 布局）、质量保障（接口测试 / 回归测试 / 自动化 / CI）。每题含答案、知识点讲解与 Android 开发类比。", "meta": "题型：单选 20 题 x 3 分 + 多选 7 题 x 4 分 + 判断 6 题 x 2 分 = 100 分。无填空题。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "Spring AOP 中，@Around 环绕通知的特点，正确的是？", "code": "@Around(\"pointcut()\")\npublic Object around(ProceedingJoinPoint pjp) throws Throwable {\n  // before\n  Object r = pjp.proceed();\n  // after\n  return r;\n}", "options": [{"k": "A", "t": "必须调用 pjp.proceed() 才能执行目标方法，可控制是否执行与返回值"}, {"k": "B", "t": "@Around 不能修改目标方法返回值"}, {"k": "C", "t": "@Around 比 @Before 先注册但后执行"}, {"k": "D", "t": "@Around 只能用于字段"}], "answer": "A", "explain": "@Around 是最强通知：通过 ProceedingJoinPoint.proceed() 决定是否、何时执行目标方法，可在前后织入逻辑、修改入参/返回值、捕获异常。不调用 proceed() 则目标方法不执行。其余通知（@Before/@After 等）无法阻止目标执行或改返回值。", "android": "类比 Android：类似 OkHttp Interceptor 的 chain.proceed()，可控制是否放行与改写响应。", "kaodian": "AI 后端能力 - 框架与容器层 - AOP 环绕通知"}, {"no": 2, "type": "single", "body": "MyBatis-Plus 条件构造器，下列写法正确的是？", "code": "new LambdaQueryWrapper<User>()\n  .eq(User::getAge, 18)\n  .like(User::getName, \"张\")\n  .in(User::getStatus, 1, 2);", "options": [{"k": "A", "t": "链式调用 eq/like/in 拼接 WHERE 条件，类型安全"}, {"k": "B", "t": "需手写 XML 才能用条件构造器"}, {"k": "C", "t": "in 只能传单个值"}, {"k": "D", "t": "Lambda 形式无法避免字段名拼写错误"}], "answer": "A", "explain": "LambdaQueryWrapper 用方法引用（User::getAge）指定列，编译期类型安全、避免字符串字段名拼错；支持 eq/ne/like/between/in/orderBy/last 等链式组合。普通 QueryWrapper 用字符串列名。", "android": "类比 Android：类似用属性引用（KProperty）构造查询条件，比字符串列名更安全。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis-Plus Wrapper"}, {"no": 3, "type": "single", "body": "Redis 持久化方式中，RDB 与 AOF 的主要区别是？", "code": "save 900 1  /  appendonly yes", "options": [{"k": "A", "t": "RDB 是快照（定时全量），AOF 是追加命令日志（更耐丢数据）"}, {"k": "B", "t": "AOF 是定时全量快照"}, {"k": "C", "t": "RDB 比 AOF 更不易丢数据"}, {"k": "D", "t": "二者完全一样"}], "answer": "A", "explain": "RDB 按策略生成内存快照（紧凑、恢复快，但两次快照间宕机丢数据）；AOF 记录每一条写命令（appendfsync everysec 默认每秒刷，最多丢约 1 秒，数据更完整但文件大、恢复慢）。生产常二者结合。", "android": "类比 Android：类似定期全量备份（RDB）+ 操作日志（AOF），恢复时优先日志更全。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 持久化"}, {"no": 4, "type": "single", "body": "MySQL 存储 emoji 表情应使用哪种字符集？", "code": "utf8mb4", "options": [{"k": "A", "t": "utf8（MySQL 的 utf8 实为 3 字节，存不了 emoji）"}, {"k": "B", "t": "utf8mb4（4 字节，支持 emoji 与补充字符）"}, {"k": "C", "t": "latin1"}, {"k": "D", "t": "gbk"}], "answer": "B", "explain": "MySQL 的 utf8 是阉割版（最多 3 字节），emoji 需 4 字节会被截断报错；utf8mb4 才是完整 UTF-8。新库表应统一 utf8mb4 + utf8mb4_0900_ai_ci（或 utf8mb4_general_ci）。", "android": "类比 Android：类似 String 默认 UTF-16 能存 emoji，后端库字符集要匹配否则写入报错。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 字符集"}, {"no": 5, "type": "single", "body": "Kafka 生产者指定 key 的主要作用是？", "code": "producer.send(new ProducerRecord<>(\"t\", key, value));", "options": [{"k": "A", "t": "key 仅用于日志，不影响分区"}, {"k": "B", "t": "默认按 key 的 hash 决定分区，相同 key 落到同一分区（保序）"}, {"k": "C", "t": "key 决定了消费组数量"}, {"k": "D", "t": "key 决定消息过期时间"}], "answer": "B", "explain": "默认分区器对 key 做 hash（murmur2）% 分区数，相同 key 始终进同一分区，从而在该分区内保序；key=null 时轮询。需要\"同一业务实体消息有序\"时务必设 key。", "android": "类比 Android：类似按 userId 取模路由到固定线程/队列，保证该用户事件有序。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 分区与保序"}, {"no": 6, "type": "single", "body": "SpringBoot 用 @Validated 校验 Controller 入参，下列能触发校验的是？", "code": "public R save(@Validated @RequestBody UserDTO u) {...}", "options": [{"k": "A", "t": "DTO 字段加 @NotBlank/@NotNull 等注解，并在参数前加 @Validated/@Valid"}, {"k": "B", "t": "只在方法上加 @Validated 即可，字段无需注解"}, {"k": "C", "t": "校验需手动 if 判断，注解无效"}, {"k": "D", "t": "@Validated 只能用于 Service 不能用于 Controller"}], "answer": "A", "explain": "JSR-303 校验：DTO 字段标 @NotNull/@NotBlank/@Size 等，方法参数加 @Valid（或类上 @Validated 开启方法级校验），框架在绑定/调用前校验，失败抛 MethodArgumentNotValidException（400）。@Validated 还支持分组校验。", "android": "类比 Android：类似用注解（如 @NonNull）配合 lint/运行时校验，而非手写一堆 if。", "kaodian": "AI 后端能力 - 框架与容器层 - 参数校验"}, {"no": 7, "type": "single", "body": "Redis 中，需要\"一个发布者，多个订阅者都收到同一条消息\"（Pub/Sub），其特点与局限是？", "code": "PUBLISH channel msg  /  SUBSCRIBE channel", "options": [{"k": "A", "t": "发布订阅广播给所有在线订阅者，但不持久化、离线丢消息"}, {"k": "B", "t": "Pub/Sub 保证消息可靠不丢"}, {"k": "C", "t": "一个消息只能被一个订阅者消费"}, {"k": "D", "t": "Pub/Sub 等同于 Kafka，支持消费位点"}], "answer": "A", "explain": "Redis Pub/Sub 是广播模型：所有在线订阅者都收到；但不持久化、无 ACK、订阅者离线期间的消息会丢失，不适合要求可靠的场景。需要持久化/消费组用 Redis Stream 或专业 MQ。", "android": "类比 Android：类似 EventBus 的 sticky=false 广播，接收者不在就漏掉。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 发布订阅"}, {"no": 8, "type": "single", "body": "MySQL 表列 phone 是 VARCHAR 且建了索引，但 WHERE phone = 13800138000（数字）导致索引失效，原因是？", "code": "SELECT * FROM t WHERE phone = 13800138000;", "options": [{"k": "A", "t": "数字与字符串列比较发生隐式类型转换，索引失效走全表扫描"}, {"k": "B", "t": "VARCHAR 不能建索引"}, {"k": "C", "t": "查询走覆盖索引所以快"}, {"k": "D", "t": "索引对数字比较天然失效"}], "answer": "A", "explain": "当字符串列与数字比较时，MySQL 会对列做隐式类型转换（相当于 CAST(phone AS UNSIGNED)），对索引列使用函数导致索引失效，退化为全表扫描。应写成 WHERE phone = '13800138000'（字符串字面量）。", "android": "类比 Android：类似用 String 字段与 int 比较，框架会做类型转换使索引/比较语义变掉。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 隐式转换导致索引失效"}, {"no": 9, "type": "single", "body": "Vue3 跨层级组件通信，祖先向后代直接传值且不通过逐层 props，可用？", "code": "// 祖先\nprovide('token', ref('abc'))\n// 后代\nconst token = inject('token')", "options": [{"k": "A", "t": "provide / inject 依赖注入"}, {"k": "B", "t": "只能用 props 一层层传"}, {"k": "C", "t": "只能用 v-model"}, {"k": "D", "t": "必须用 EventBus 全局事件"}], "answer": "A", "explain": "provide/inject 是 Vue 跨层级依赖注入：祖先 provide(key, value)，任意后代 inject(key) 直接取值，避免 props 逐层透传（prop drilling）。适合主题、locale、当前用户等全局/近全局数据；也可配合 Pinia 做状态管理。", "android": "类比 Android：类似用 Dagger/Hilt 在组件树中注入同一实例，无需每层传递。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 组件通信"}, {"no": 10, "type": "single", "body": "CSS 选择器优先级（权重）从高到低，正确的是？", "code": ".btn vs #submit vs div vs style=", "options": [{"k": "A", "t": "内联 style > id > class > 元素（标签）"}, {"k": "B", "t": "class > id > 内联 > 元素"}, {"k": "C", "t": "元素 > class > id > 内联"}, {"k": "D", "t": "id > 内联 > class > 元素"}], "answer": "A", "explain": "优先级：!important（最高，但破坏维护）> 内联 style > id(#) > class/属性/伪类(.) > 元素/伪元素(div)。同权重后者覆盖前者；继承样式最低。", "android": "类比 Android：类似布局中 inline 属性覆盖 style.xml，style 覆盖 theme 的层级。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 选择器优先级"}, {"no": 11, "type": "single", "body": "下列 JavaScript 表达式，结果为 true 的是？", "code": "[] == ![]", "options": [{"k": "A", "t": "[] == ![]（true）"}, {"k": "B", "t": "[] === ![]"}, {"k": "C", "t": "null == undefined 为 false"}, {"k": "D", "t": "'0' == 0 为 false"}], "answer": "A", "explain": "== 做隐式转换：![] 为 false；[] 转原始值为 ''（空字符串）；'' == false → 0==0 → true。=== 不做转换所以 [] === ![] 为 false。null==undefined 为 true（特例）。'0'==0 为 true（字符串转数字）。经典坑：比较用 === 更安全。", "android": "类比 Android：类似 Kotlin 的 ==（值）与 ===（引用）区别，弱等会有隐式转换坑。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 类型转换"}, {"no": 12, "type": "single", "body": "RESTful API 中，删除一个资源（如删除 id=10 的用户）应使用？", "code": "DELETE /api/users/10", "options": [{"k": "A", "t": "DELETE /api/users/10（资源+ID，语义清晰）"}, {"k": "B", "t": "POST /api/deleteUser"}, {"k": "C", "t": "GET /api/users/10/delete"}, {"k": "D", "t": "PUT /api/users/10/delete"}], "answer": "A", "explain": "REST 用 HTTP 方法表操作：GET 查、POST 新建、PUT 全量更新、PATCH 部分更新、DELETE 删除；URL 用名词资源（/users/10），不用动词（/deleteUser）。GET 应安全且幂等，不能用于删除。", "android": "类比 Android：类似 Retrofit 接口用 @DELETE(\"users/{id}\") 表达删除语义。", "kaodian": "AI 前端能力 - 工程化与网络 - RESTful 设计"}, {"no": 13, "type": "single", "body": "Axios 响应拦截器中，遇到 401（token 过期）自动刷新 token 并重试原请求，关键点是？", "code": "axios.interceptors.response.use(r=>r, async err=>{\n  if(err.response.status===401){ const ok=await refresh(); return ok? axios(err.config): Promise.reject(err);}\n});", "options": [{"k": "A", "t": "用原请求的 config 重新发起，并需防同一时刻多次刷新（加锁/队列）"}, {"k": "B", "t": "401 直接 reject，无需处理"}, {"k": "C", "t": "刷新 token 后丢弃原请求"}, {"k": "D", "t": "只能刷新不能重试"}], "answer": "A", "explain": "401 刷新重试要点：①拦截响应错误，401 时调刷新接口拿新 token 更新；②用 err.config（原配置）重新 axios 请求实现重试；③并发多个 401 时要加\"刷新锁/等待队列\"，避免重复刷新。否则会雪崩式刷新。", "android": "类比 Android：类似 OkHttp 认证拦截器：401 时刷新 token 并用原 request 重试，且加同步避免并发刷新。", "kaodian": "AI 前端能力 - 工程化与网络 - Axios 拦截器重试"}, {"no": 14, "type": "single", "body": "前端路由 history 模式（HTML5 History API）相比 hash 模式，部署时需要注意？", "code": "/user/123 直接访问", "options": [{"k": "A", "t": "需服务端对所有前端路由做 fallback 到 index.html，否则刷新 404"}, {"k": "B", "t": "hash 模式也需要服务端 fallback"}, {"k": "C", "t": "history 模式 URL 一定带 # 号"}, {"k": "D", "t": "history 模式无法刷新"}], "answer": "A", "explain": "history 模式用真实路径（/user/123），直接访问/刷新时浏览器向服务端请求该路径，若服务端无对应资源则返回 404，故需服务端把所有非静态路由 fallback 到 index.html（Nginx try_files / devServer historyApiFallback）。hash 模式路径在 # 后不发请求，无需 fallback。", "android": "类比 Android：类似深链接路由需要在 Manifest 里配 path 兜底，否则直接打开 URL 找不到页面。", "kaodian": "AI 前端能力 - 工程化与网络 - 前端路由模式"}, {"no": 15, "type": "single", "body": "单元测试中，用\"测试工厂/Builder\"构造测试数据（Test Fixture）的好处是？", "code": "UserBuilder.aUser().withName(\"Tom\").build();", "options": [{"k": "A", "t": "集中构造逻辑、用例可读、易维护，避免到处 new 并手写字段"}, {"k": "B", "t": "会让测试变慢必须避免"}, {"k": "C", "t": "只能用于集成测试"}, {"k": "D", "t": "必须用反射才能构造"}], "answer": "A", "explain": "测试数据构造用 Builder/工厂方法（如 aUser().withName(\"Tom\")）把\"造数据\"与\"断言\"分离，用例更易读、改字段只改一处、便于生成边界数据。属于可测试性设计的一部分。", "android": "类比 Android：类似用测试用的 Seam/Fake 构造 ViewModel 输入，而非在用例里堆 new。", "kaodian": "AI 质量保障 - 自动化测试与工具 - 测试数据构造"}, {"no": 16, "type": "single", "body": "Mockito 中，需要\"让某方法抛异常\"或\"每次返回动态计算值\"，应分别用？", "code": "doThrow(new RuntimeException()).when(m).save(any());\nwhen(m).find(any()).thenAnswer(inv -> inv.getArgument(0));", "options": [{"k": "A", "t": "抛异常用 doThrow；动态返回值用 thenAnswer"}, {"k": "B", "t": "都用 when().thenReturn()"}, {"k": "C", "t": "抛异常用 thenReturn"}, {"k": "D", "t": "Mockito 不能模拟异常"}], "answer": "A", "explain": "doThrow().when(m).method() 用于让桩方法抛异常（注意 doThrow 语法不同于 when().thenThrow）；thenAnswer(invocation -> ...) 可在调用时动态计算返回值（如原样返回入参、计数）。thenReturn 只返回固定值。", "android": "类比 Android：类似 mock 时指定某方法抛异常或根据入参动态返回，验证异常分支。", "kaodian": "AI 质量保障 - 自动化测试与工具 - Mock 高级用法"}, {"no": 17, "type": "single", "body": "Java 线程池 ThreadPoolTaskExecutor 的核心参数关系，正确的是？", "code": "core=5, max=10, queue=100", "options": [{"k": "A", "t": "先满核心线程→任务进队列→队列满→扩到最大线程→再满则走拒绝策略"}, {"k": "B", "t": "先扩到最大线程再入队列"}, {"k": "C", "t": "队列大小永远不为 0"}, {"k": "D", "t": "拒绝策略只在核心线程满时触发"}], "answer": "A", "explain": "标准流程：提交任务→核心线程未满则建核心线程→满了进阻塞队列→队列满且未达最大线程则建非核心线程→达最大且队列满才触发拒绝策略（Abort/CallerRuns/Discard 等）。注意：队列未满前不会扩到最大线程（这是常见误解）。", "android": "类比 Android：类似 Executor 的 core/max/queue，饱和时才拒绝或调用者执行。", "kaodian": "AI 后端能力 - 语言基础层 - 线程池参数"}, {"no": 18, "type": "single", "body": "产生死锁的四个必要条件，错误的是（下列有一项不是必要条件）？", "code": "互斥 / 占有且等待 / 不可剥夺 / 循环等待", "options": [{"k": "A", "t": "高并发本身就足以产生死锁（无需其他条件）"}, {"k": "B", "t": "互斥：资源不可共享"}, {"k": "C", "t": "占有且等待：持有资源并等待新资源"}, {"k": "D", "t": "循环等待：形成资源等待环"}], "answer": "A", "explain": "死锁四要素：①互斥②占有且等待③不可剥夺④循环等待。破坏任一即可避免死锁（如一次性申请全部资源破坏\"占有等待\"、按固定顺序加锁破坏\"循环等待\"）。高并发只是增大概率，不是必要条件——A 错。", "android": "类比 Android：类似两个线程各持一把锁等对方，破坏加锁顺序即可避免。", "kaodian": "AI 后端能力 - 语言基础层 - 死锁条件"}, {"no": 19, "type": "single", "body": "SQL 中 LEFT JOIN 与 INNER JOIN 的区别，正确的是？", "code": "SELECT * FROM a LEFT JOIN b ON a.id=b.aid;", "options": [{"k": "A", "t": "LEFT JOIN 保留左表全部行，右表无匹配补 NULL；INNER JOIN 只保留两表都匹配的行"}, {"k": "B", "t": "二者结果完全相同"}, {"k": "C", "t": "LEFT JOIN 只保留右表行"}, {"k": "D", "t": "INNER JOIN 会补 NULL"}], "answer": "A", "explain": "LEFT JOIN 以左表为基准，右表无匹配时补 NULL 行（常用于\"主表+可选附属\"）；INNER JOIN 只返回两表连接条件都成立的行。RIGHT JOIN 反之。FULL JOIN 取并集（MySQL 不直接支持，需 UNION）。", "android": "类比 Android：类似两个 List 关联，left join 保留左表所有项、右表缺失置空。", "kaodian": "AI 后端能力 - 数据库与ORM层 - JOIN 语义"}, {"no": 20, "type": "single", "body": "微服务\"可观测性三大支柱\"通常指？", "code": "日志 / 指标 / 链路", "options": [{"k": "A", "t": "日志（Logging）、指标（Metrics）、链路追踪（Tracing）"}, {"k": "B", "t": "日志、缓存、消息队列"}, {"k": "C", "t": "CPU、内存、磁盘"}, {"k": "D", "t": "测试、部署、监控"}], "answer": "A", "explain": "可观测性三支柱：Logging（离散事件日志）、Metrics（聚合指标如 QPS/错误率/延迟）、Tracing（一次请求跨服务调用链，定位慢/错环节）。三者互补，是排障与 SLO 保障基础（如 Prometheus+Grafana+Loki+Jaeger）。", "android": "类比 Android：类似用 Logcat（日志）+ Perfdog/Profiler 指标 + 自研链路埋点定位卡顿与崩溃。", "kaodian": "AI 质量保障 - 缺陷定位与可观测性 - 可观测性三支柱"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于 RESTful API 设计规范，下列做法正确的是？（多选）", "code": "资源用名词，操作用 HTTP 方法", "options": [{"k": "A", "t": "URL 用名词资源（/users），不用动词（/getUser）"}, {"k": "B", "t": "用 HTTP 方法表达操作：GET 查 / POST 建 / PUT 改 / DELETE 删"}, {"k": "C", "t": "用合适的状态码（200/201/400/401/404/500）表达结果"}, {"k": "D", "t": "每个接口都用 POST，URL 里写 action=delete 表达删除"}], "answer": ["A", "B", "C"], "explain": "REST 核心：资源用名词、操作靠 HTTP 方法、结果靠状态码、无状态、可寻址。D 违反\"用方法表操作\"，所有动作塞 POST+action 参数属于 RPC 风格而非 REST。", "android": "类比 Android：类似 Retrofit 接口语义化（@GET/@POST），而非所有请求都用 POST 再传 method 字段。", "kaodian": "AI 前端能力 - 工程化与网络 - RESTful 设计"}, {"no": 2, "type": "multi", "body": "MySQL 事务的 ACID 特性，分别主要由什么保障？（多选）", "code": "原子性 / 一致性 / 隔离性 / 持久性", "options": [{"k": "A", "t": "原子性(A) 由 undo log 回滚保障"}, {"k": "B", "t": "持久性(D) 由 redo log + 刷盘保障"}, {"k": "C", "t": "隔离性(I) 由 MVCC + 锁保障"}, {"k": "D", "t": "一致性(C) 由唯一/外键等约束 + 应用逻辑保障"}], "answer": ["A", "B", "C", "D"], "explain": "A：undo log 记录前镜像，回滚用；D：redo log 保证提交后落盘不丢；I：MVCC（读不加锁、快照）与锁实现隔离级别；C：由约束（唯一/外键/类型）与应用层保证业务一致。四条都对，是经典考题。", "android": "类比 Android：类似事务要么全成功要么全回滚（原子），且提交后持久（落库）。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 事务 ACID"}, {"no": 3, "type": "multi", "body": "前端性能优化手段，下列有效的有？（多选）", "code": "首屏慢 / 包体积大", "options": [{"k": "A", "t": "路由级懒加载 + 代码分割（code splitting）减小首包"}, {"k": "B", "t": "开启 gzip/brotli 压缩、资源加缓存（强缓存/协商缓存）"}, {"k": "C", "t": "图片懒加载、用合适格式（webp）、减少重排重绘"}, {"k": "D", "t": "把所有 JS 塞进一个文件、关闭压缩以省事"}], "answer": ["A", "B", "C"], "explain": "A 减小首屏 JS；B 压缩+缓存降低传输与重复请求；C 图片与渲染优化。D 反其道而行：单文件无分割导致首屏加载巨量 JS、关闭压缩更慢。", "android": "类比 Android：类似按需加载模块、图片压缩与缓存、避免主线程重布局卡顿。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - 前端性能优化"}, {"no": 4, "type": "multi", "body": "常见 Web 安全攻击与对应防护，正确的有？（多选）", "code": "XSS / CSRF / SQL 注入", "options": [{"k": "A", "t": "XSS：对用户输入做转义/编码，不上文盲插 HTML；可用 CSP 限制"}, {"k": "B", "t": "CSRF：用同源 Cookie + 校验 Referer/Origin + CSRF Token 防护"}, {"k": "C", "t": "SQL 注入：用预编译参数化（PreparedStatement / MP Wrapper），不拼 SQL"}, {"k": "D", "t": "SQL 注入只需前端 JS 过滤即可根治"}], "answer": ["A", "B", "C"], "explain": "XSS 靠输出编码+CSP；CSRF 靠 Token/同源校验；SQL 注入靠参数化查询（后端），前端过滤可被绕过，不能根治。三者都需后端配合。", "android": "类比 Android：类似 WebView 注入、深链接校验，前端过滤不可信，必须后端校验。", "kaodian": "AI 后端能力 - 框架与容器层 - Web 安全"}, {"no": 5, "type": "multi", "body": "消息队列（MQ）的典型使用场景有？（多选）", "code": "异步 / 削峰 / 解耦", "options": [{"k": "A", "t": "异步处理：下单后发短信/通知异步化，快速返回"}, {"k": "B", "t": "流量削峰：秒杀时请求入队，后端按能力消费"}, {"k": "C", "t": "系统解耦：服务间通过事件通信，互不硬依赖"}, {"k": "D", "t": "用 MQ 替代数据库做持久主存，保证强一致记账"}], "answer": ["A", "B", "C"], "explain": "MQ 三大价值：异步（提升响应）、削峰（保护后端）、解耦（事件驱动）。D 错误：MQ 不是持久主存，强一致记账仍在数据库，MQ 负责\"通知/最终一致\"。", "android": "类比 Android：类似用消息总线解耦模块，点击下单后发事件，短信模块异步消费。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息队列场景"}, {"no": 6, "type": "multi", "body": "好的单元测试应遵循 FIRST 原则，其中含义正确的有？（多选）", "code": "Fast / Isolated / Repeatable / Self-validating / Timely", "options": [{"k": "A", "t": "Fast：运行快，不依赖慢资源"}, {"k": "B", "t": "Isolated：用例间独立、不共享可变状态"}, {"k": "C", "t": "Repeatable：可重复执行，结果稳定（不受顺序/环境随机影响）"}, {"k": "D", "t": "用例之间必须共享同一个数据库才能算集成正确"}], "answer": ["A", "B", "C"], "explain": "FIRST：Fast（快）、Independent/Isolated（独立）、Repeatable（可重复）、Self-validating（自带断言、不靠人工看）、Timely（及时写，最好 TDD）。D 错：单元应隔离外部依赖，共享库会破坏独立与可重复。", "android": "类比 Android：类似单测用 Robolectric/in-memory DB，独立可重复，不依赖真机网络。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 单元测试原则"}, {"no": 7, "type": "multi", "body": "排查线上接口变慢，下列排查手段合理的有？（多选）", "code": "P99 延迟升高，偶发 500", "options": [{"k": "A", "t": "看监控指标（QPS/延迟/错误率）+ 链路追踪定位慢调用链"}, {"k": "B", "t": "查 DB 慢查询日志 / EXPLAIN 是否有全表扫描"}, {"k": "C", "t": "看 JVM/GC 与线程池是否打满、有无慢外部调用"}, {"k": "D", "t": "直接重启服务器，不看任何日志"}], "answer": ["A", "B", "C"], "explain": "排障三板斧：可观测（指标+日志+链路）定位→DB/慢 SQL→资源（GC/线程池/外部依赖）。D 盲目重启会丢失现场、问题复发。", "android": "类比 Android：类似用 Profiler 看主线程卡顿、Logcat 看 ANR 现场，而非直接清数据。", "kaodian": "AI 质量保障 - 缺陷定位与可观测性 - 线上排障"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "Spring AOP 的 @Around 通知可以通过 ProceedingJoinPoint 控制目标方法是否执行，并可修改其返回值。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "正确", "explain": "@Around 是能力最强的通知：调用 pjp.proceed() 决定执行时机，可在前后加逻辑、不调用则不执行、并可返回包装后的值。其余通知做不到改返回值/阻止执行。", "android": "类比 Android：类似拦截器 chain.proceed() 控制放行与改写响应。", "kaodian": "AI 后端能力 - 框架与容器层 - AOP 环绕通知"}, {"no": 2, "type": "judge", "body": "Redis AOF 持久化默认 appendfsync everysec，最坏情况下宕机只丢失约 1 秒数据。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "正确", "explain": "AOF 的 everysec 模式每秒批量刷盘一次，最多丢失约 1 秒写命令；always 每次刷（最安全最慢），no 由 OS 决定（可能丢多）。相比 RDB 按分钟级快照，AOF everysec 数据更完整。", "android": "类比 Android：类似日志按秒落盘，崩溃最多丢最近一秒操作。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 持久化"}, {"no": 3, "type": "judge", "body": "Vue3 中 v-if 与 v-for 可以安全地写在同一元素上，二者会按预期协作。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "错误", "explain": "Vue3 中 v-if 优先级高于 v-for，当同元素使用时 v-if 无法访问 v-for 的变量，且语义混乱易出错，官方明确不推荐。需要条件渲染列表项应在外层 wrapper 用 v-if，或先 computed 过滤列表再用 v-for。", "android": "类比 Android：类似 RecyclerView 的 item 类型判断与列表循环应分开，别在同一层混用。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 v-if 与 v-for"}, {"no": 4, "type": "judge", "body": "LEFT JOIN 中，把过滤条件写在 ON 与写在 WHERE 中，查询结果总是相同。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "错误", "explain": "LEFT JOIN 时：条件放 ON 会在连接前过滤\"被驱动表\"，但左表行仍全部保留（右表无匹配补 NULL）；放 WHERE 会在连接后过滤，会把左表无匹配的行也删掉。二者结果不同——想\"保左表全量\"用 ON，想\"过滤最终结果\"用 WHERE。", "android": "类比 Android：类似左连接后筛选时机不同，结果集不同。", "kaodian": "AI 后端能力 - 数据库与ORM层 - JOIN ON 与 WHERE"}, {"no": 5, "type": "judge", "body": "单元测试应尽量避免访问真实数据库、网络等外部依赖，改用 mock/内存替身，保证快且独立。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "正确", "explain": "单元测\"单元逻辑\"，应隔离慢/不稳定的外部依赖（DB/网络/时间），用 mock 或内存实现（H2/in-memory），保证快、可重复、不依赖环境。访问真实的属于集成/端到端测试范畴。", "android": "类比 Android：类似单测 ViewModel 用 Fake Repository 而非真网络，快速可重复。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 单元测试隔离"}, {"no": 6, "type": "judge", "body": "浏览器 Cookie 设 SameSite=Strict 时，跨站请求（如从别的网站跳转过来）完全不会携带该 Cookie。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "正确", "explain": "SameSite=Strict：完全禁止跨站请求携带 Cookie（最严，防 CSRF 但可能导致从外部跳转回来丢失登录态）；Lax（默认）：允许安全方法（GET 导航）跨站携带；None：跨站携带但须配合 Secure。SameSite 是 CSRF 防护的重要手段。", "android": "类比 Android：类似 WebView 对第三方跳转的 Cookie 策略，Strict 下跨站不带。", "kaodian": "AI 前端能力 - 工程化与网络 - Cookie SameSite"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+q.no+'" data-no="'+q.no+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+q.no+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q.no==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=document.querySelector('.card[data-no="'+btn.dataset.no+'"]'); gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  ans.querySelector('.ans').textContent='答案：'+(q.type==='fill'? q.answerText : q.answer.join('、'));
  ans.classList.add('show');
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  if(!isAnswered(card)){ if(!confirm('本题还没作答，将按答错处理并展示答案。')) return; }
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
