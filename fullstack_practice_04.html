<script type="application/json" id="quizData">{"id": "vol04", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11。覆盖布隆过滤器、@Transactional NESTED/AFTER_COMMIT、MyBatis-Plus 逻辑删除+分页、RabbitMQ 死信触发、Kafka rebalance、COUNT 语义、provide/inject、Flex stretch/sticky、Axios 取消请求、toRefs、TS 泛型、接口 401 无感刷新、Playwright beforeEach、Redis 数据结构、Bean 生命周期、ICP、路由守卫、浏览器存储、覆盖率等。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "为拦截「查不存在的 id」的缓存穿透，下列使用布隆过滤器的做法是？", "code": "BloomFilter<String> bf = BloomFilter.create(Funnels.stringFunnel(), 1000000);\nbf.put(id);\nif (!bf.mightContain(id)) return; // 一定不存在，直接返回", "options": [{"k": "A", "t": "先查布隆过滤器，若判定不存在则直接返回，避免穿透到 DB"}, {"k": "B", "t": "布隆过滤器能精确判断元素一定存在"}, {"k": "C", "t": "布隆过滤器会误判存在为不存在"}, {"k": "D", "t": "布隆过滤器已淘汰，应用 Redis 空值替代"}], "answer": "A", "explain": "布隆过滤器用位数组+多哈希，判定「不存在」是准确的（无假阴性），「存在」可能有假阳性。用它前置拦截，能挡掉绝大多数不存在的 key 穿透。", "kaodian": "AI后端能力-高并发与中间件层-缓存穿透"}, {"no": 2, "type": "single", "body": "关于 @Transactional 传播行为 NESTED，下列说法正确的是？", "code": "@Transactional(propagation=Propagation.NESTED) // 内层", "options": [{"k": "A", "t": "NESTED 在外部事务中创建保存点，内层回滚只回退到保存点，不影响外部其他操作"}, {"k": "B", "t": "NESTED 与 REQUIRES_NEW 等价，都开独立事务"}, {"k": "C", "t": "NESTED 内层失败会导致整个外部事务必然回滚"}, {"k": "D", "t": "NESTED 不需要数据库支持"}], "answer": "A", "explain": "NESTED 利用 JDBC 保存点实现嵌套：内层异常回滚到保存点，外层可捕获后继续；区别于 REQUIRES_NEW（挂起外层开全新事务）。需数据库支持保存点。", "kaodian": "AI后端能力-应用框架层-Spring事务管理"}, {"no": 3, "type": "single", "body": "实体开启逻辑删除(@TableLogic) 后配合分页查询，下列说法正确的是？", "code": "@TableLogic private Integer deleted;\nPage<User> p = userMapper.selectPage(new Page<>(1,10), wrapper);", "options": [{"k": "A", "t": "分页 SQL 会自动附加 deleted=0 条件，只查未删除数据"}, {"k": "B", "t": "逻辑删除与分页冲突，必须手写 SQL"}, {"k": "C", "t": "分页会查出已逻辑删除的数据"}, {"k": "D", "t": "逻辑删除只对 update 生效，不影响 select"}], "answer": "A", "explain": "MP 逻辑删除会透明地给所有查询附加 deleted=0 过滤条件，分页查询同样生效，无需手动加条件。", "kaodian": "AI后端能力-数据存储与ORM层-MyBatis-Plus基础"}, {"no": 4, "type": "single", "body": "RabbitMQ 中，消息进入死信队列的触发条件不包括？", "code": "队列参数: x-message-ttl=10000, x-dead-letter-exchange=dlx, x-max-length=1000", "options": [{"k": "A", "t": "消息被成功消费并 basicAck 后也会进死信"}, {"k": "B", "t": "消息 TTL 过期"}, {"k": "C", "t": "队列达到最大长度被丢弃的老消息"}, {"k": "D", "t": "消费者 basicNack/reject 且 requeue=false"}], "answer": "A", "explain": "死信触发条件：① 消息 TTL 过期；② 队列满溢出；③ 被拒绝且不重投。正常 ack 消费的消息不会进死信。", "kaodian": "AI后端能力-高并发与中间件层-MQ基础概念"}, {"no": 5, "type": "single", "body": "Kafka 消费组发生 rebalance 期间，最可能出现的问题是？", "code": "group rebalance -> 分区重新分配 -> 消费者暂停拉取", "options": [{"k": "A", "t": "消费暂停且若 offset 未及时提交可能产生重复消费或漏消费"}, {"k": "B", "t": "消息永久丢失"}, {"k": "C", "t": "分区数量自动翻倍"}, {"k": "D", "t": "消费者实例被销毁"}], "answer": "A", "explain": "rebalance 期间消费者停止拉取并重新分配分区。若上一次消费的 offset 未提交，重新分配后可能从旧 offset 重复消费。", "kaodian": "AI后端能力-高并发与中间件层-MQ基础概念"}, {"no": 6, "type": "single", "body": "关于 MySQL 的 COUNT 语义，下列描述正确的是？", "code": "SELECT COUNT(*) FROM t;      -- 统计行数\nSELECT COUNT(col) FROM t;    -- 统计 col 非 NULL 的行\nSELECT COUNT(1) FROM t;      -- 统计行数", "options": [{"k": "A", "t": "COUNT(*) 与 COUNT(1) 统计行数；COUNT(列) 忽略该列为 NULL 的行"}, {"k": "B", "t": "三者完全等价"}, {"k": "C", "t": "COUNT(*) 忽略 NULL 行"}, {"k": "D", "t": "COUNT(列) 统计所有行"}], "answer": "A", "explain": "COUNT(*) 统计所有行（含 NULL），COUNT(列) 只计该列非 NULL 的行，COUNT(1) 等价于 COUNT(*)。用 COUNT(列) 统计行数会漏掉 NULL。", "kaodian": "AI后端能力-数据存储与ORM层-索引与SQL优化"}, {"no": 7, "type": "single", "body": "下列用 @TransactionalEventListener 保证「事务提交后再发通知」的写法是？", "code": "@TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)\npublic void onOrderCreated(OrderEvent e) { sendMsg(e); }", "options": [{"k": "A", "t": "AFTER_COMMIT 阶段触发，确保主事务提交成功后才执行通知，避免通知发出但事务回滚"}, {"k": "B", "t": "该注解与事务无关，随时触发"}, {"k": "C", "t": "必须在方法上加 @Async"}, {"k": "D", "t": "只在事务回滚时触发"}], "answer": "A", "explain": "@TransactionalEventListener 可绑定事务阶段：AFTER_COMMIT 在主事务提交后触发，适合发消息/清缓存等副作用，避免事务回滚却已外发。", "kaodian": "AI后端能力-应用框架层-Spring事务管理"}, {"no": 8, "type": "single", "body": "在 Vue3 中，跨多层组件传递数据而不通过逐层 props，可用？", "code": "// 祖先\nprovide('key', value);\n// 后代\nconst v = inject('key');", "options": [{"k": "A", "t": "provide / inject 实现跨层依赖注入，避免 props 逐层透传"}, {"k": "B", "t": "必须用 vuex/pinia 全局状态"}, {"k": "C", "t": "只能用 props 逐层传"}, {"k": "D", "t": "provide 只能在 App 根组件"}], "answer": "A", "explain": "provide/inject 适合跨多层的非响应式或配置型数据传递，比逐层 props 更简洁；响应式数据需用 ref/reactive 包装。", "kaodian": "AI前端能力-语言与运行时-Vue3指令与组件"}, {"no": 9, "type": "single", "body": "父容器 display:flex; align-items:stretch（默认），子项未设高度时表现为？", "code": ".box{display:flex;height:200px}.item{ }", "options": [{"k": "A", "t": "子项沿交叉轴被拉伸填满容器高度"}, {"k": "B", "t": "子项高度由内容决定，顶部对齐"}, {"k": "C", "t": "子项宽度被拉伸"}, {"k": "D", "t": "不生效"}], "answer": "A", "explain": "align-items 默认 stretch：子项在交叉轴方向拉伸以填满容器（前提是子项未显式设该轴尺寸）。常用于等高卡片布局。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS布局"}, {"no": 10, "type": "single", "body": "实现元素在滚动到视口附近时「吸顶」，应使用的 CSS 是？", "code": ".header{ position: sticky; top: 0; }", "options": [{"k": "A", "t": "position:sticky 结合 top 实现滚动吸顶"}, {"k": "B", "t": "position:fixed 永远固定"}, {"k": "C", "t": "position:absolute 相对父定位"}, {"k": "D", "t": "position:relative"}], "answer": "A", "explain": "sticky 是相对滚动容器的「粘性」定位：在 top:0 之前正常流，到达阈值后表现为固定，常用于表头/导航吸顶。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS布局"}, {"no": 11, "type": "single", "body": "需要取消一个进行中的 Axios 请求，正确做法是？", "code": "const c = new AbortController();\naxios.get('/api', { signal: c.signal });\nc.abort(); // 取消", "options": [{"k": "A", "t": "用 AbortController 的 signal 传给请求，调用 abort() 取消"}, {"k": "B", "t": "Axios 不支持取消，只能等超时"}, {"k": "C", "t": "用 clearTimeout 取消"}, {"k": "D", "t": "只能关闭页面"}], "answer": "A", "explain": "Axios 支持 AbortController（与 fetch 一致）：把 signal 传入请求配置，abort() 即可取消进行中的请求，常用于组件卸载时清理。", "kaodian": "AI前端能力-网络与BFF架构-Axios请求配置"}, {"no": 12, "type": "single", "body": "希望从 reactive 对象中解构出属性且保持响应，应使用？", "code": "const state = reactive({ name:'a', age:1 });\nconst { name, age } = toRefs(state);", "options": [{"k": "A", "t": "toRefs 把每个属性转为 ref，解构后仍为响应式"}, {"k": "B", "t": "直接解构即可保持响应"}, {"k": "C", "t": "toRef 只能用于单个且会丢失响应"}, {"k": "D", "t": "解构后用 watch 监听无效"}], "answer": "A", "explain": "直接解构 reactive 会丢失响应；toRefs 将每个属性包装成 ref，解构后通过 .value 访问仍响应。toRef 用于单个属性。", "kaodian": "AI前端能力-语言与运行时-Vue3响应式"}, {"no": 13, "type": "single", "body": "下列 async/await 中，能正确捕获错误的是？", "code": "try { const r = await fetchData(); } catch(e) { console.error(e); }", "options": [{"k": "A", "t": "用 try/catch 包裹 await，rejected promise 会被 catch 捕获"}, {"k": "B", "t": "await 永远不会抛错"}, {"k": "C", "t": "只能靠 .then 捕获"}, {"k": "D", "t": "错误需在外层全局捕获，try 无效"}], "answer": "A", "explain": "await 后若 promise rejected，会像同步代码一样在 try/catch 中抛出并被捕获。这是 async/await 处理错误的主要方式。", "kaodian": "AI前端能力-语言与运行时-异步与事件循环"}, {"no": 14, "type": "single", "body": "下列 TypeScript 泛型函数写法正确的是？", "code": "function identity<T>(arg: T): T { return arg; }\nconst r = identity<string>('hi');", "options": [{"k": "A", "t": "用 <T> 声明类型参数，调用时可显式指定或自动推断"}, {"k": "B", "t": "泛型只能用 any 替代"}, {"k": "C", "t": "T 必须在运行时存在"}, {"k": "D", "t": "泛型函数不能指定返回类型"}], "answer": "A", "explain": "泛型 <T> 提供类型参数化，既保持类型安全又复用逻辑；多数情况可由实参自动推断，无需手写。", "kaodian": "AI前端能力-语言与运行时-TypeScript基础"}, {"no": 15, "type": "single", "body": "接口返回 401 时，前端 Axios 响应拦截器无感刷新 Token 的正确流程是？", "code": "if (status===401 && !originalRequest._retry) {\n  originalRequest._retry = true;\n  await refreshToken();\n  return axios(originalRequest);\n}", "options": [{"k": "A", "t": "拦截 401，标记已重试，刷新 Token 后用原配置重发请求"}, {"k": "B", "t": "401 直接跳转登录，不重试"}, {"k": "C", "t": "刷新 Token 不需要重发原请求"}, {"k": "D", "t": "_retry 标记可有可无"}], "answer": "A", "explain": "无感刷新：遇到 401 且未重试过时，刷新 Token 后以原 config 重发请求；_retry 防止刷新链自身 401 造成无限循环。", "kaodian": "AI质量保障-接口测试-APITesting&Integration"}, {"no": 16, "type": "single", "body": "在有限的回归测试时间内，应优先执行哪些用例？", "code": "", "options": [{"k": "A", "t": "按风险（核心/高频）+ 历史缺陷 + 变更影响排序，优先高价值用例"}, {"k": "B", "t": "随机挑选"}, {"k": "C", "t": "只跑最老用例"}, {"k": "D", "t": "只跑最简单的用例"}], "answer": "A", "explain": "回归测试时间受限时，应基于风险与影响分析做优先级排序，先覆盖核心路径与易错模块，最大化缺陷发现率。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归测试"}, {"no": 17, "type": "single", "body": "Playwright 中，希望每个测试用例前都先登录，应放在？", "code": "test.beforeEach(async ({page}) => { await login(page); });", "options": [{"k": "A", "t": "beforeEach 钩子，每个用例执行前运行登录"}, {"k": "B", "t": "afterEach"}, {"k": "C", "t": "只能写在用例内部开头"}, {"k": "D", "t": "beforeAll 只登录一次但所有用例共享同一页状态易污染"}], "answer": "A", "explain": "beforeEach 适合每用例独立前置（如登录）；若要共享且隔离，常用全局 setup 生成已登录状态（storageState）以提速。", "kaodian": "AI质量保障-自动化测试-Playwright"}, {"no": 18, "type": "single", "body": "关于持续集成(CI)，下列说法正确的是？", "code": "", "options": [{"k": "A", "t": "开发者频繁提交，每次提交自动触发构建与测试，尽早暴露集成问题"}, {"k": "B", "t": "只有发布时才集成"}, {"k": "C", "t": "CI 不需要自动化测试"}, {"k": "D", "t": "CI 只做代码打包"}], "answer": "A", "explain": "CI 的核心是频繁集成 + 自动化构建/测试，让集成问题尽早暴露、降低修复成本，是 DevOps 基础实践。", "kaodian": "AI质量保障-CI/CD与质量门禁-CI/CD流水线"}, {"no": 19, "type": "single", "body": "AI 辅助生成了某接口的测试用例及预期结果，正确的是？", "code": "", "options": [{"k": "A", "t": "生成数据可用，但预期结果必须由人工/已有契约复核，AI 可能给出错误预期"}, {"k": "B", "t": "AI 给出的预期结果一定正确，直接用"}, {"k": "C", "t": "完全不能用 AI 生成"}, {"k": "D", "t": "只需 AI 生成，不需测试"}], "answer": "A", "explain": "AI 生成测试数据/用例效率高，但预期结果需人工或基于接口契约复核，否则可能把错误预期固化进断言。", "kaodian": "AI质量保障-软件测试理论与质量体系-AI辅助测试数据分类"}, {"no": 20, "type": "single", "body": "关于缺陷严重级别(Severity)对修复优先级的影响，下列说法正确的是？", "code": "", "options": [{"k": "A", "t": "Severity 高通常 Priority 高，但也要结合业务场景（如仅内部工具的低频崩溃可能优先级较低）"}, {"k": "B", "t": "Severity 与 Priority 永远一一对应"}, {"k": "C", "t": "只看 Severity 即可决定何时修"}, {"k": "D", "t": "Priority 由开发随意定"}], "answer": "A", "explain": "Severity 是技术影响，Priority 是修复时机，二者相关但不等价；业务上下文（上线节点、用户面）共同决定优先级。", "kaodian": "AI质量保障-软件测试理论与质量体系-缺陷管理"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于 Redis 数据结构选型，下列说法正确的有？（多选、少选、错选均不得分）", "code": "String / Hash / List / Set / ZSet / Bitmap / HyperLogLog / Geo", "options": [{"k": "A", "t": "计数器/ e / sessionStorage / cookie / IndexedDB", "options": [{"k": "A", "t": "localStorage 持久、同源共享、无过期"}, {"k": "B", "t": "sessionStorage 仅当前标签页会话"}, {"k": "C", "t": "cookie 可随请求自动携带、可设 HttpOnly"}, {"k": "D", "t": "三者容量都约 5MB 且无差别"}], "answer": ["A", "B", "C"], "explain": "localStorage 持久、sessionStorage 会话级、cookie 随请求发送且可标记 HttpOnly 防 XSS 读取、IndexedDB 存大量结构化数据。容量与特性差异明显。", "kaodian": "AI前端能力-前端生态-浏览器存储"}, {"no": 6, "type": "multi", "body": "关于黑盒/白盒/灰盒测试，下列说法正确的有？（多选、少选、错选均不得分）", "code": "", "options": [{"k": "A", "t": "黑盒：不关心内部实现，按需求/规格验证输入输出"}, {"k": "B", "t": "白盒：基于代码逻辑（语句/分支/路径覆盖）设计用例"}, {"k": "C", "t": "灰盒：结合部分内部结构与外部行为"}, {"k": "D", "t": "三者互相排斥不可组合"}], "answer": ["A", "B", "C"], "explain": "黑盒看功能、白盒看代码逻辑、灰盒折中。实际项目常组合使用（如接口测试偏灰盒）。D 错：可组合。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试基础概念"}, {"no": 7, "type": "multi", "body": "关于测试覆盖率指标，下列说法正确的有？（多选、少选、错选均不得分）", "code": "行覆盖 / 分支覆盖 / 路径覆盖 / 条件覆盖", "options": [{"k": "A", "t": "行覆盖统计被执行到的代码行比例"}, {"k": "B", "t": "分支覆盖关注 if/else 各分支是否都走到"}, {"k": "C", "t": "路径覆盖最强但用例爆炸难以穷尽"}, {"k": "D", "t": "覆盖率 100% 即代表无 bug"}], "answer": ["A", "B", "C"], "explain": "覆盖率有多个维度，分支/路径覆盖比行覆盖更强；但 100% 覆盖率不等于无缺陷（未覆盖的逻辑错误与未测场景仍可能存在）。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试基础概念"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "判断：@Async 方法抛出的异常无法被调用方的 try/catch 捕获，因为方法在独立线程执行。", "code": "try { svc.task(); } catch (e) { /* 捕获不到异步异常 */ }", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "@Async 在另一线程执行，调用方 try/catch 只能捕获同步部分；异步异常需通过返回的 Future/CompletableFuture 或异步异常处理器(AsyncUncaughtExceptionHandler)捕获。", "kaodian": "AI后端能力-应用框架层-Spring异步与调度"}, {"no": 2, "type": "judge", "body": "判断：对元素使用 transform（如 translate/scale）或 opacity 改变时，不会触发回流(reflow)，只可能触发重绘或合成。", "code": "el.style.transform = 'translateX(10px)';", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "transform 与 opacity 通常由合成器处理（独立图层），不触发布局回流，动画性能更好；这是「用 transform 做动画」优于改   QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
