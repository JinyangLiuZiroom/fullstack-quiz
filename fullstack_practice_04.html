<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>全栈转型模拟自测卷</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2329; margin: 0; padding: 24px 24px 96px; line-height: 1.65; }
  .container { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: #646a73; font-size: 14px; margin-bottom: 4px; }
  .meta { background: #fff; border-radius: 10px; padding: 14px 18px; margin: 16px 0 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); font-size: 14px; color: #41464b; }
  .meta b { color: #1664ff; }
  .backlink { display:inline-block; margin: 4px 0 10px; color:#1664ff; text-decoration:none; font-size:14px; }
  .backlink:hover { text-decoration: underline; }
  .section { margin-top: 28px; }
  .section h2 { font-size: 18px; margin: 0 0 12px; padding-left: 10px; border-left: 4px solid #1664ff; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card.correct { box-shadow: 0 0 0 2px #52c41a inset, 0 1px 3px rgba(0,0,0,.06); }
  .card.wrong { box-shadow: 0 0 0 2px #ff4d4f inset, 0 1px 3px rgba(0,0,0,.06); }
  .q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .q-no { font-weight: 700; font-size: 15px; }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: 4px; font-weight: 600; }
  .tag-single { background: #e8f3ff; color: #1664ff; }
  .tag-multi  { background: #fff3e0; color: #d4860b; }
  .tag-judge  { background: #fde8f3; color: #c41d7f; }
  .tag-fill   { background: #e9f9ee; color: #1a9e4b; }
  .kaodian { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; background: #f0f2f5; color: #646a73; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-badge { font-size:12px; padding:2px 9px; border-radius:4px; font-weight:700; margin-left:auto; }
  .res-badge.ok { background:#e9f9ee; color:#1a9e4b; }
  .res-badge.no { background:#fff1f0; color:#ff4d4f; }
  .q-body { font-size: 15px; margin-bottom: 10px; }
  .code { background: #2b2f36; color: #e6e6e6; border-radius: 8px; padding: 12px 14px;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; overflow-x: auto; margin: 10px 0; white-space: pre; }
  .options { margin: 8px 0 4px; }
  .opt { display: flex; align-items:flex-start; gap:8px; padding: 9px 12px; border-radius: 8px; margin: 6px 0;
    background: #f7f8fa; border: 1.5px solid transparent; font-size: 14px; cursor: pointer; transition: all .12s; }
  .opt:hover { background: #eef2f7; }
  .opt .k { font-weight:700; color:#1664ff; min-width: 16px; }
  .opt.sel { background: #e8f3ff; border-color: #1664ff; }
  .opt.correct { background: #f0f9eb; border-color: #52c41a; }
  .opt.correct .k { color:#52c41a; }
  .opt.wrong { background: #fff1f0; border-color: #ff4d4f; }
  .opt.wrong .k { color:#ff4d4f; }
  .opt.locked { cursor: default; }
  .q-actions { margin-top: 10px; }
  .q-check { background:#1664ff; color:#fff; border:none; border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; font-weight:600; }
  .q-check:hover { background:#0e4fd8; }
  .card.graded .q-check { display:none; }
  .blank { border:none; border-bottom: 1.5px solid #1664ff; background:#f7f8fa; padding: 3px 8px; margin: 0 4px;
    font-size:14px; min-width: 120px; border-radius:4px 4px 0 0; }
  .blank.correct { border-bottom-color:#52c41a; background:#f0f9eb; }
  .blank.wrong { border-bottom-color:#ff4d4f; background:#fff1f0; }
  .answer { display: none; margin-top: 14px; padding: 14px; background: #f0f9eb;
    border-left: 4px solid #67c23a; border-radius: 6px; font-size: 14px; }
  .answer.show { display: block; }
  .answer .ans { font-weight: 700; color: #1a9e4b; margin-bottom: 8px; font-size: 15px; }
  .answer .label { font-weight: 700; }
  .answer .android { margin-top: 10px; padding: 10px 12px; background: #eef4ff; border-radius: 6px; color: #2a3a55; font-size: 13px; }
  .answer .android .label { color: #1664ff; }
  .footer { text-align: center; color: #9aa0a6; font-size: 13px; margin: 30px 0 10px; }
  .bar { position: fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #e5e6eb;
    box-shadow: 0 -2px 10px rgba(0,0,0,.05); padding: 10px 16px; display:flex; gap:10px; align-items:center; justify-content:center; z-index: 50; }
  .bar .prog { font-size: 14px; color:#41464b; margin-right: auto; }
  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }
  .bar .userbox a { color:#1664ff; cursor:pointer; text-decoration:none; }
  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }
  .result-panel.show { display:block; }
  .result-panel .score { font-size:30px; font-weight:800; color:#1664ff; }
  .result-panel .score small { font-size:15px; color:#646a73; font-weight:500; }
  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }
  .result-panel .wrongs a { display:inline-block; margin:3px 6px 3px 0; padding:2px 8px; background:#fff1f0; color:#ff4d4f; border-radius:4px; text-decoration:none; font-weight:600; }
  @media (max-width:600px) {
    body { padding: 12px 12px 100px; }
    .container { max-width: 100%; }
    h1 { font-size: 20px; }
    .meta { padding: 10px 12px; font-size: 13px; }
    .card { padding: 14px 12px; margin-bottom: 10px; }
    .q-body { font-size: 14px; }
    .code { font-size: 11px; padding: 10px 10px; }
    .opt { padding: 8px 10px; font-size: 13px; }
    .bar { padding: 8px 10px; gap: 6px; }
    .bar .prog { font-size: 12px; }
    .btn { padding: 7px 12px; font-size: 13px; }
    .section h2 { font-size: 16px; }
    .answer { font-size: 13px; }
    .answer .android { font-size: 12px; }
  }
</style>

<script type="application/json" id="quizData">{"id": "vol04", "title": "全栈转型模拟自测卷", "sub": "可答题 · 交卷判分 · 自动记录错题", "meta": "对齐公司真实考法：<b>单选 / 多选 / 判断</b>，每题包含完整代码场景，问执行结果、补全代码、判断框架用法正误。<br>本卷共 <b>33 题</b>：单选 20（60 分）+ 多选 7（28 分）+ 判断 6（12 分）= 100 分。<br>难度：<b>实战细节型</b>，考点标签采用公司标准层级命名。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "以下是 RabbitMQ <code>Headers</code> 交换机的绑定参数与生产者发送代码。消息发出后，Q1 与 Q2 的接收情况是？", "code": "// 交换机：biz.headers（type = headers）\n\n// Q1 的绑定 arguments\n{ \"x-match\": \"all\", \"type\": \"order\", \"level\": \"vip\" }\n\n// Q2 的绑定 arguments\n{ \"x-match\": \"any\", \"type\": \"order\", \"level\": \"vip\" }\n\n// 生产者\nMessageProperties props = new MessageProperties();\nprops.setHeader(\"type\", \"order\");        // 只带了一个 header\nrabbitTemplate.send(\"biz.headers\", \"order.vip\",\n        new Message(\"hello\".getBytes(), props));", "options": [{"k": "A", "t": "Q1、Q2 都能收到，routingKey \"order.vip\" 同时命中两条绑定"}, {"k": "B", "t": "只有 Q1 收到，x-match=all 表示只要命中任意一个 header 即可"}, {"k": "C", "t": "只有 Q2 收到：Headers 交换机忽略 routingKey，x-match=all 要求绑定中所有 header 全部匹配，any 只需匹配任意一个"}, {"k": "D", "t": "都收不到，Headers 交换机要求 routingKey 与 header 同时匹配才路由"}], "answer": ["C"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - RabbitMQ Headers 交换机。Headers 交换机完全<b>不看 routingKey</b>，只按 arguments 里的键值对匹配，性能低于 Direct/Topic，故实际项目用得少。x-match 有两种取值：all = 绑定里除 x-match 外的所有 header 都必须在消息中出现且值相等（逻辑与）；any = 命中任意一个即可（逻辑或）。本题消息只带了 type=order，缺少 level=vip，所以 all 的 Q1 不匹配、any 的 Q2 匹配。A 错在把 routingKey 当作匹配依据；B 把 all 与 any 的语义弄反；D 错误，Headers 交换机根本不参与 routingKey 匹配。", "android": "类似 Android 里的 IntentFilter：Headers 交换机像同时校验多个 category（必须全部匹配才放行），而 Direct 交换机更像只比对单个 action 字符串。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RabbitMQ Headers 交换机"}, {"no": 2, "type": "single", "body": "Direct 交换机下同一队列被两个 routingKey 绑定，另一队列绑定其中一个 key。执行下面的发送代码后，各队列的收消息情况是？", "code": "DirectExchange ex = new DirectExchange(\"order.direct\");\n\n// Q_ORDER 用两个 routingKey 绑定到同一个交换机\nBindingBuilder.bind(qOrder).to(ex).with(\"order.pay\");\nBindingBuilder.bind(qOrder).to(ex).with(\"order.refund\");\n// Q_AUDIT 只绑定一个\nBindingBuilder.bind(qAudit).to(ex).with(\"order.pay\");\n\n// Q_ORDER 上启动了 3 个消费者实例（监听同一个队列）\nrabbitTemplate.convertAndSend(\"order.direct\", \"order.pay\",\n        \"{\\\"orderId\\\":1001}\");", "options": [{"k": "A", "t": "Q_ORDER 收到 2 条（两条绑定各投递一次），Q_AUDIT 收到 1 条"}, {"k": "B", "t": "只有 Q_AUDIT 收到，Direct 交换机下一个队列只允许绑定一个 routingKey"}, {"k": "C", "t": "Q_ORDER 收到 1 条、Q_AUDIT 收到 1 条；Q_ORDER 的 3 个消费者会各消费 1 次，共处理 3 次"}, {"k": "D", "t": "Q_ORDER 收到 1 条、Q_AUDIT 收到 1 条；Q_ORDER 的 3 个消费者按轮询只有 1 个真正消费到这条消息"}], "answer": ["D"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - RabbitMQ 绑定与投递模型。两条规则要分清：①<b>交换机 → 队列</b>是「按绑定匹配、每个匹配到的队列各得一份副本」，但同一队列即使命中多条绑定也<b>只入队一次</b>（Broker 会去重，不会因为绑了两个 key 就投两条）；②<b>队列 → 消费者</b>是「竞争消费（work queue）」，同一队列的多个消费者轮询分配，一条消息只会交给其中一个。所以 Q_ORDER、Q_AUDIT 各 1 条，Q_ORDER 侧只有 1 个消费者处理。A 误以为多绑定会重复投递；C 把队列的竞争消费当成了 Fanout 的广播语义（要广播必须每个消费者一个独立队列）；B 与 AMQP 规范不符，一个队列可以绑定任意多个 routingKey。", "android": "像 Android 的广播：多队列 = 多个不同进程各收一份（有序/全局广播），而同队列多消费者 = 同一个进程内的线程池抢任务，任务只会被一个线程执行。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RabbitMQ 绑定与竞争消费"}, {"no": 3, "type": "single", "body": "下面用「消息级 TTL + 死信交换机」实现延迟任务。队列上<strong>没有</strong>消费者，先后发送 A、B 两条消息。B 会在什么时候进入死信队列？", "code": "// 队列未设置 x-message-ttl，只配置了死信交换机\nMap<String,Object> args = new HashMap<>();\nargs.put(\"x-dead-letter-exchange\", \"dlx.exchange\");\n// new Queue(\"delay.queue\", true, false, false, args)\n\n// t=0s  发 A，单条消息 TTL = 60000ms\nrabbitTemplate.convertAndSend(\"\", \"delay.queue\", \"A\", m -> {\n    m.getMessageProperties().setExpiration(\"60000\");\n    return m;\n});\n\n// t=1s  发 B，单条消息 TTL = 5000ms\nrabbitTemplate.convertAndSend(\"\", \"delay.queue\", \"B\", m -> {\n    m.getMessageProperties().setExpiration(\"5000\");\n    return m;\n});", "options": [{"k": "A", "t": "B 在第 6 秒进入死信队列，A 在第 60 秒进入，互不影响"}, {"k": "B", "t": "A、B 都要等到第 60 秒左右才进入死信队列：RabbitMQ 只扫描队头消息是否过期，B 被队头的 A 阻塞（队头阻塞）"}, {"k": "C", "t": "消息级 expiration 无效，必须在队列上声明 x-message-ttl，两条消息都不会成为死信"}, {"k": "D", "t": "B 立即进入死信队列，因为它的 TTL 小于队列中已存在消息的 TTL"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - RabbitMQ TTL 与队头阻塞。RabbitMQ 判定消息过期是<b>惰性</b>的：只有当消息处于队头、即将被投递或被扫描时才检查是否超过 TTL。队列级 x-message-ttl 因为所有消息 TTL 一致，队头先到期天然有序；而<b>消息级 expiration 允许每条不同</b>，一旦队头是个「长 TTL」消息，后面的短 TTL 消息即使已经过期也不会被提前搬走，必须等队头出队 —— 这就是延迟队列方案里著名的「队头阻塞」坑。A 是不了解惰性检查的直觉答案；C 错误，消息级 expiration 是合法且生效的（与队列 TTL 同时存在时取二者较小值）；D 无此机制。生产上要支持任意延迟，应改用 rabbitmq_delayed_message_exchange 插件，或按延迟档位拆分多个固定 TTL 队列。", "android": "类比 Android 的 Handler 消息队列：MessageQueue 是按 when 排序的，所以延迟消息能准时；而 RabbitMQ 队列是严格 FIFO 不重排，硬塞不同 TTL 就会被队头卡住。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RabbitMQ TTL 与死信队列"}, {"no": 4, "type": "single", "body": "已开启发布确认与消息回退，向<strong>存在的交换机</strong>发送一条<strong>没有任何队列能匹配</strong>的消息。两个回调的触发情况是？", "code": "# application.yml\nspring:\n  rabbitmq:\n    publisher-confirm-type: correlated\n    publisher-returns: true\n    template:\n      mandatory: true\n\n// Java\nrabbitTemplate.setConfirmCallback((corr, ack, cause) ->\n        log.info(\"confirm ack={} cause={}\", ack, cause));\nrabbitTemplate.setReturnsCallback(returned ->\n        log.info(\"returned replyText={}\", returned.getReplyText()));\n\n// order.direct 存在，但没有任何队列绑定 routingKey = \"not.exist\"\nrabbitTemplate.convertAndSend(\"order.direct\", \"not.exist\", \"hello\");", "options": [{"k": "A", "t": "先触发 ReturnsCallback（replyText=NO_ROUTE），随后 ConfirmCallback 收到 ack=true —— 消息成功到达交换机即算确认成功"}, {"k": "B", "t": "只打印 confirm ack=false cause=NO_ROUTE，不会触发 ReturnsCallback"}, {"k": "C", "t": "只触发 ReturnsCallback，ConfirmCallback 完全不会被调用"}, {"k": "D", "t": "两个回调都不触发，Broker 静默丢弃不可路由的消息"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - RabbitMQ 发布确认与消息回退。这是最容易混淆的一组机制，要分清两段链路：<b>Producer → Exchange</b> 由 publisher-confirm 负责，只要交换机收下消息就回 ack=true（交换机不存在才 ack=false）；<b>Exchange → Queue</b> 由 mandatory + ReturnsCallback 负责，路由不到队列时把消息「退还」给生产者，replyText 为 NO_ROUTE。顺序上 Broker 先发 basic.return 再发 basic.ack，所以日志是先 returned 后 confirm。B 把两段链路混为一谈；C 错，confirm 一定会回调；D 错，若未开 mandatory 才会被静默丢弃 —— 这正是线上「消息不见了却查不到异常」的常见原因。", "android": "像 Android 发送短信：运营商网关收下了（confirm ack）不代表对方号码存在，号码是空号时会有一条「发送失败回执」退回来（return），两个回执要分开处理。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RabbitMQ 发布确认与 Return 回退"}, {"no": 5, "type": "single", "body": "Kafka 生产者在下述配置与运行期状态下调用 <code>send().get()</code>，结果是？", "code": "# topic 配置\nreplication.factor  = 3\nmin.insync.replicas = 2\n\n# 生产者配置\nacks    = all\nretries = 3\n\n# 运行期：3 个副本所在 broker 挂了 2 个，该分区 ISR 只剩 leader 一个\n$ kafka-topics.sh --describe --topic order-topic\nTopic: order-topic  Partition: 0  Leader: 1  Replicas: 1,2,3  Isr: 1\n\nproducer.send(new ProducerRecord<>(\"order-topic\", \"k\", \"v\")).get();", "options": [{"k": "A", "t": "正常写入成功，只要 leader 存活就能接收写入"}, {"k": "B", "t": "写入成功但只有 leader 有数据，其余副本恢复后自动补齐，不影响生产"}, {"k": "C", "t": "重试耗尽后抛出 NotEnoughReplicasException：当前 ISR 数量(1) 小于 min.insync.replicas(2)，acks=all 时 Broker 拒绝写入"}, {"k": "D", "t": "生产者会一直阻塞等待副本恢复，不会抛异常"}], "answer": ["C"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Kafka min.insync.replicas。min.insync.replicas 只在 <b>acks=all(-1)</b> 时生效，含义是「一次写入至少要有 N 个副本（含 leader）在 ISR 中确认」。当 ISR 收缩到小于该值，Broker 直接返回 NotEnoughReplicasException（可重试异常），retries 用尽后由 send 的 Future/回调抛出。这是典型的 <b>CAP 取舍</b>：宁可写失败也不接受「只写进 leader、leader 再挂就丢数据」。经典配置是 replication.factor=3 + min.insync.replicas=2 + acks=all，可容忍 1 个 broker 故障。A 描述的是 acks=1 的行为；B 忽略了「未同步期间 leader 再宕机就永久丢数据」；D 错，这是有限重试后失败而非无限阻塞。", "android": "类似 Android 的多端数据同步：只写本地缓存就回调成功（acks=1）风险大；要求至少两台设备确认落库才算成功（acks=all + minISR=2），确认不够就直接报错给业务层。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka ISR 与 acks 语义"}, {"no": 6, "type": "single", "body": "下面是 Kafka「消费-处理-生产」（consume-transform-produce）的代码。要实现真正的 <strong>Exactly-Once</strong>，正确的修改是？", "code": "props.put(\"transactional.id\", \"tx-order-1\");\nprops.put(\"enable.idempotence\", true);\nproducer.initTransactions();\n\nwhile (true) {\n    ConsumerRecords<String,String> records = consumer.poll(Duration.ofMillis(500));\n    producer.beginTransaction();\n    for (ConsumerRecord<String,String> r : records) {\n        producer.send(new ProducerRecord<>(\"out-topic\", transform(r)));\n    }\n    // ① 这里缺少一步\n    producer.commitTransaction();\n    consumer.commitSync();          // ②\n}\n\n// 上游消费者配置：enable.auto.commit = false\n// 下游消费者配置：isolation.level = read_uncommitted", "options": [{"k": "A", "t": "无需修改，配置了 transactional.id 后 Kafka 自动提供端到端 Exactly-Once"}, {"k": "B", "t": "只需把下游 isolation.level 改为 read_committed，位移用哪种方式提交都不影响一致性"}, {"k": "C", "t": "只需把 ② 的 commitSync() 换成 commitAsync() 提高性能即可"}, {"k": "D", "t": "在 ① 处调用 producer.sendOffsetsToTransaction(offsets, consumer.groupMetadata()) 把位移提交纳入事务，删除 ② 处独立的 commitSync，并把下游 isolation.level 改为 read_committed"}], "answer": ["D"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Kafka 事务与 Exactly-Once。EOS 要求「写下游」和「提交上游位移」是<b>同一个原子操作</b>。原代码把位移提交放在事务之外，若 commitTransaction 成功而 commitSync 之前进程崩溃，重启后会重新消费这批消息并再次写下游 → 下游重复。正确做法是用 sendOffsetsToTransaction 把位移写入内部 topic __consumer_offsets 的同一个事务中，两者要么都成功要么都回滚，因此 ② 必须删掉（否则语义混乱）。另外事务只是给消息打上「已提交/已中止」标记，下游必须设置 <b>isolation.level=read_committed</b> 才会过滤掉未提交与已中止的消息，默认 read_uncommitted 会读到脏数据。A 错，transactional.id 只是开启事务能力；C 与原子性无关且 commitAsync 更不可靠；B 漏掉了位移原子性这一半。", "android": "类似 Android 里「上传成功后再删本地草稿」：必须放进同一个数据库事务，否则上传完但删除失败，下次启动又会重传一份。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 事务与 Exactly-Once"}, {"no": 7, "type": "single", "body": "某 Kafka 消费者上线后频繁报错、消息大量重复。结合配置与处理耗时，最准确的分析是？", "code": "# 消费者配置（其余默认）\nmax.poll.records     = 500\nmax.poll.interval.ms = 300000     # 5 分钟\nsession.timeout.ms   = 45000\nheartbeat.interval.ms= 3000\nenable.auto.commit   = false\n\n// 消费逻辑：每条消息调用一次外部接口，平均耗时约 800ms\nConsumerRecords<String,String> records = consumer.poll(Duration.ofMillis(1000));\nfor (ConsumerRecord<String,String> r : records) {\n    remoteService.handle(r.value());   // ≈ 800ms\n}\nconsumer.commitSync();\n\n// 错误日志\nCommitFailedException: Commit cannot be completed since the group has\nalready rebalanced and assigned the partitions to another member.", "options": [{"k": "A", "t": "心跳线程独立于业务线程，session.timeout.ms=45s 内心跳正常，所以不会有问题，异常是网络抖动导致的"}, {"k": "B", "t": "单批 500 条 × 800ms ≈ 400 秒，超过 max.poll.interval.ms(300s)，协调者认为该消费者已「假死」并触发再均衡把分区分走，commitSync 因此失败，这批消息被其他消费者重复消费；应调小 max.poll.records 或调大 max.poll.interval.ms、并把耗时操作异步化"}, {"k": "C", "t": "poll 的超时参数是 1000ms，所以每次最多只能拉到 1 条记录，不可能超时"}, {"k": "D", "t": "只要设置 enable.auto.commit=false，消费者就不会被踢出消费组"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Kafka 消费组再均衡。Kafka 0.10.1 之后把「存活检测」拆成两条独立通道：<b>session.timeout.ms</b> 由后台心跳线程保障，代表进程还活着；<b>max.poll.interval.ms</b> 由两次 poll 的间隔保障，代表业务还在正常推进。本题心跳一直正常（所以 A 的前半句是对的，但结论错），真正超标的是处理耗时 400s > 300s，协调者判定该成员「活着但卡死」，将其移出组并触发再均衡，此后 commitSync 提交的分区已不归它管，抛 CommitFailedException；由于位移没提交成功，新 owner 会从旧位移重新消费 → 重复。修复方向：减小 max.poll.records、提高 max.poll.interval.ms、或把远程调用改为批量/并行处理。C 混淆了 poll 的等待超时与单批条数；D 与心跳、poll 间隔机制无关。", "android": "像 Android 的 ANR：主线程还在（心跳正常），但 5 秒没响应输入事件（poll 间隔超时），系统照样判你无响应并回收 —— 解法同样是把耗时任务拆小或挪到子线程。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 再均衡与 poll 超时"}, {"no": 8, "type": "single", "body": "下面是手动指定位移提交的消费代码。本批从该分区拉到 offset = 100、101、102 三条，处理完 102 并提交后进程重启，会从哪条开始消费？", "code": "ConsumerRecords<String,String> records = consumer.poll(Duration.ofMillis(500));\nfor (ConsumerRecord<String,String> r : records) {\n    handle(r);\n    Map<TopicPartition, OffsetAndMetadata> offsets = new HashMap<>();\n    offsets.put(new TopicPartition(r.topic(), r.partition()),\n                new OffsetAndMetadata(r.offset()));   // ← 注意这里\n    consumer.commitSync(offsets);\n}\n\n// 本批记录：offset = 100, 101, 102", "options": [{"k": "A", "t": "从 102 开始，102 会被重复消费一次；提交的位移语义是「下一条要读取的位置」，应写成 new OffsetAndMetadata(r.offset() + 1)"}, {"k": "B", "t": "从 103 开始，位移已经正确提交，不会重复"}, {"k": "C", "t": "从 100 开始，手动指定 offsets 会覆盖整批，导致整批重复"}, {"k": "D", "t": "抛出 IllegalArgumentException，commitSync 不允许手动传入 offsets"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Kafka 位移提交语义。Kafka 中<b>提交的 offset 表示「下一次要读取的位置」，而不是「最后一条已处理的位置」</b>。所以正确写法恒为 lastProcessedOffset + 1。本题提交了 102，重启后消费者从 102 开始拉取，最后一条被重复处理一次 —— 这类「每次重启都固定重复一条」的现象正是该 bug 的典型特征。注意无参的 commitSync() 内部会自动用 position()（即 last+1），所以只有手动构造 OffsetAndMetadata 时才会踩坑。另外该代码逐条提交性能极差，生产上应整批处理完提交一次。C 错，指定 offsets 只覆盖 map 中的分区，值是多少就是多少；D 错，commitSync(Map) 是合法重载。", "android": "类似分页加载记录 lastId：如果把「已加载到的最后一条 id」直接当成下次请求的起始游标，而接口是闭区间，那每次续传都会重复出现一条 —— 差一错误（off-by-one）。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 位移提交语义"}, {"no": 9, "type": "single", "body": "下单方法在事务中发布领域事件，监听器负责发 MQ。当金额校验失败导致事务回滚时，MQ 消息会被发出吗？应如何修正？", "code": "@Service\npublic class OrderService {\n    @Autowired ApplicationEventPublisher publisher;\n\n    @Transactional\n    public void createOrder(Order o) {\n        orderMapper.insert(o);\n        publisher.publishEvent(new OrderCreatedEvent(o.getId()));\n        if (o.getAmount() < 0) {\n            throw new IllegalArgumentException(\"金额非法\");   // 触发回滚\n        }\n    }\n}\n\n@Component\npublic class MqSender {\n    @EventListener\n    public void onCreated(OrderCreatedEvent e) {\n        rabbitTemplate.convertAndSend(\"order.ex\", \"order.created\", e.getId());\n    }\n}", "options": [{"k": "A", "t": "不会发出，Spring 事件默认参与当前事务，回滚时事件会被一并撤销"}, {"k": "B", "t": "会发出，但只要在监听器上再加一个 @Async 注解就能保证与事务一致"}, {"k": "C", "t": "会发出：@EventListener 默认同步执行，在 publishEvent 调用处就已经把消息投递出去，而后订单回滚，造成「库里没订单、下游却收到了消息」；应改用 @TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)"}, {"k": "D", "t": "是否发出取决于 RabbitMQ 是否开启 publisher-confirm"}], "answer": ["C"], "explain": "考点：AI 后端能力 - 框架与容器层 - Spring 事件与事务边界。ApplicationEventPublisher.publishEvent 默认是<b>同步阻塞</b>的：调用处直接进入监听器方法，执行完才返回，此时事务尚未提交。因此监听器里做的任何外部动作（发 MQ、调三方、发短信）都会「先于事务提交」发生，一旦后续回滚就产生数据不一致。正确做法是 @TransactionalEventListener(phase = AFTER_COMMIT)，Spring 会把事件挂到事务同步器上，事务真正提交后再回调；若事务回滚则默认不触发。A 是对 Spring 事件的常见误解，它本身不感知事务；B 更糟 —— 加 @Async 只是换个线程发，事务回滚照样发出去，而且异步线程还可能读不到未提交数据；D 与是否发送无关，confirm 只影响投递可靠性。若要求「事务提交了消息就一定发出去」，还需配合本地消息表或事务消息。", "android": "类似 Android 里在 SQLite 事务内部就 post 了 EventBus 事件：UI 收到通知去查库，结果事务还没提交甚至已回滚，界面就出现了幽灵数据。", "kaodian": "AI 后端能力 - 框架与容器层 - Spring 事件与事务边界"}, {"no": 10, "type": "single", "body": "下面的线程池瞬间被提交 50 个耗时 2 秒的任务。任务执行期间，线程池中实际的工作线程数是多少？", "code": "@Bean(\"bizExecutor\")\npublic ThreadPoolTaskExecutor bizExecutor() {\n    ThreadPoolTaskExecutor e = new ThreadPoolTaskExecutor();\n    e.setCorePoolSize(2);\n    e.setMaxPoolSize(10);\n    e.setQueueCapacity(100);\n    e.setKeepAliveSeconds(60);\n    e.setThreadNamePrefix(\"biz-\");\n    e.initialize();\n    return e;\n}\n\n// 瞬间提交 50 个耗时 2 秒的任务\nfor (int i = 0; i < 50; i++) {\n    bizExecutor.execute(() -> sleep(2000));\n}", "options": [{"k": "A", "t": "10 个，任务数超过核心线程数后会立即扩容到 maxPoolSize"}, {"k": "B", "t": "50 个，每个任务分配一个线程并发执行"}, {"k": "C", "t": "12 个，等于核心线程数加上超出核心的任务数"}, {"k": "D", "t": "2 个：核心线程占满后新任务先进入阻塞队列，只有队列被塞满才会扩容到 maxPoolSize，而 100 的队列足以容纳剩余 48 个任务"}], "answer": ["D"], "explain": "考点：AI 后端能力 - 框架与容器层 - 线程池参数与扩容顺序。ThreadPoolExecutor 的调度顺序是固定的三步：①线程数 &lt; corePoolSize → 新建核心线程；②核心已满 → <b>任务入队</b>；③队列已满且线程数 &lt; maxPoolSize → 才新建非核心线程；④都满 → 走拒绝策略。本题 queueCapacity=100 远大于剩余的 48 个任务，所以永远走不到第③步，maxPoolSize=10 形同虚设，实际并发度只有 2，50 个任务串行跑约 50 秒。这是「线程池配了很大 max 却毫无提速」的最常见原因。想让扩容真正生效，要么把队列容量调小（如 SynchronousQueue 或几十），要么直接调大核心线程数。A、C 都是对扩容时机的误解；B 是无界线程池（CachedThreadPool）的行为，正是它容易把机器打爆才需要用有界池。", "android": "类似 Android 的 AsyncTask 串行执行器：你以为并发跑了一堆任务，其实底层只有一个执行序列在排队 —— 想真并发必须显式换成 THREAD_POOL_EXECUTOR。", "kaodian": "AI 后端能力 - 框架与容器层 - 线程池参数与隔离"}, {"no": 11, "type": "single", "body": "阅读下面的 Kafka 集群配置与故障日志，对结果的判断正确的是？", "code": "# broker / topic 配置\nunclean.leader.election.enable = true\nmin.insync.replicas            = 1\nacks                           = 1\n\n# 故障时间线\n[Broker-1] Leader for order-0, LEO=15000, HW=15000\n[Broker-2] Follower for order-0, LEO=12000  (落后过久，已被移出 ISR)\n[Broker-1] shutting down ...\n[Controller] No live replica in ISR, electing UNCLEAN leader: Broker-2\n[Broker-1] restarted -> becomes follower, truncating log to leader HW (12000)", "options": [{"k": "A", "t": "Broker-1 重启后会把新 leader 缺失的 12000~14999 补回去，最终不丢数据"}, {"k": "B", "t": "约 3000 条消息（offset 12000~14999）永久丢失：允许非 ISR 副本当选 leader 是「可用性优先」的取舍；设为 false 可避免丢数据，代价是 ISR 全挂时该分区不可用"}, {"k": "C", "t": "只要把 acks 改成 all，无论 unclean.leader.election.enable 取什么值都不会丢数据"}, {"k": "D", "t": "日志截断只会发生在 follower 上，原 leader 的本地数据不会被删除，因此不丢"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Kafka 副本选举与数据一致性。unclean.leader.election.enable=true 允许「落后于 ISR 的副本」在无可用 ISR 时当选 leader。新 leader 的 LEO 只有 12000，而 Kafka 规定<b>所有 follower 必须与 leader 保持日志一致</b>，因此老 leader 重启后会按 leader epoch 对比并把自己多出来的 12000~14999 直接截断（truncate）丢弃，这部分数据永久消失。这是 Kafka 里典型的可用性 vs 一致性取舍，金融/订单类场景应设为 false（新版本默认即 false），并配合 replication.factor=3 + min.insync.replicas=2 + acks=all。A 与截断机制相反；C 错，本题 min.insync.replicas=1，即使 acks=all 也只需 leader 一个副本确认，unclean 选举照样丢数据 —— 三个参数必须配套；D 说反了，被截断的恰恰是重启后降级为 follower 的原 leader。", "android": "像多设备笔记同步时选了一台「很久没联网」的旧设备作为权威副本：它一上线，其它设备上更新的内容会被强制回滚成旧版本，新写的内容直接消失。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 副本选举与日志截断"}, {"no": 12, "type": "single", "body": "下面是 RabbitMQ 手动确认的消费者代码，<code>prefetch=50</code>、消费者并发处理，处理 deliveryTag=30 的消息时抛出异常。这行 <code>basicNack</code> 的实际影响是？", "code": "@RabbitListener(queues = \"order.queue\", ackMode = \"MANUAL\", concurrency = \"10\")\npublic void onMessage(Message msg, Channel channel) throws IOException {\n    long tag = msg.getMessageProperties().getDeliveryTag();\n    try {\n        biz.handle(msg);\n        channel.basicAck(tag, false);\n    } catch (Exception e) {\n        channel.basicNack(tag, true, false);   // ← multiple=true, requeue=false\n    }\n}\n\n// 该 Channel 上已投递 deliveryTag = 1..50，队列配置了死信交换机\n// 处理 tag=30 时抛异常，此时 1..29 中仍有若干条正在处理、尚未 ack", "options": [{"k": "A", "t": "multiple=true 表示批量拒绝该 Channel 上 deliveryTag ≤ 30 且尚未确认的<b>所有</b>消息；requeue=false 使它们全部进入死信交换机（无 DLX 则丢弃），会误伤同批仍在处理中的消息，应改为 basicNack(tag, false, false)"}, {"k": "B", "t": "只有 tag=30 这一条被拒绝，multiple 参数只对批量 ack 生效，对 nack 无效"}, {"k": "C", "t": "requeue=false 表示暂不确认，消息会保留在队列中稍后自动重新投递"}, {"k": "D", "t": "该写法直接抛出 IOException，basicNack 不支持 multiple 参数"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - RabbitMQ 手动确认参数语义。basicAck/basicNack 的第二个参数 multiple 语义完全一致：true = 对<b>同一 Channel 上所有 deliveryTag 小于等于当前值且未确认</b>的消息批量操作。在 concurrency &gt; 1 的并发消费场景下，deliveryTag 的顺序与处理完成顺序不一致，multiple=true 会把还在别的线程里正常处理的消息一并 nack 掉，造成「一条失败、牵连一片」的数据丢失事故。第三个参数 requeue：true = 重新入队（失败消息会立刻被再次投递，易造成死循环刷屏）；false = 不重回队列，有 DLX 则进死信、否则直接丢弃。所以本题正确写法是 basicNack(tag, false, false) 配合死信队列做兜底。B 错，multiple 对 nack 同样生效；C 把 requeue=false 理解反了；D 无此限制。", "android": "类似 RecyclerView 里想删一条却调了 notifyItemRangeRemoved(0, 30)：一次误操作把前面 30 条全清了，而它们本来还在正常展示。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RabbitMQ 手动确认与死信"}, {"no": 13, "type": "single", "body": "Vue3 中子组件用 <code>Teleport</code> 把弹层挂载到 body。点击 <code>.modal</code> 后，父组件的 <code>onPageClick</code> 与 <code>close</code> 事件的触发情况是？", "code": "<!-- Child.vue -->\n<template>\n  <Teleport to=\"body\">\n    <div class=\"modal\" @click=\"$emit('close')\">\n      <slot />\n    </div>\n  </Teleport>\n</template>\n\n<!-- Parent.vue -->\n<template>\n  <div class=\"page\" @click=\"onPageClick\">\n    <Child @close=\"visible = false\" />\n  </div>\n</template>\n\n<!-- 运行后的真实 DOM -->\n<body>\n  <div id=\"app\"><div class=\"page\"><!--teleport start--><!--teleport end--></div></div>\n  <div class=\"modal\">...</div>\n</body>", "options": [{"k": "A", "t": "onPageClick 与 close 都会触发，Teleport 只改变视觉位置、不改变真实 DOM 结构"}, {"k": "B", "t": "两者都不会触发，Teleport 会切断父子组件的通信链路"}, {"k": "C", "t": "close 会触发（组件自定义事件沿<b>组件树</b>传递，与 DOM 位置无关），onPageClick 不会触发（真实 DOM 已移出 .page，原生 click 不再冒泡到父元素）"}, {"k": "D", "t": "onPageClick 会触发，close 不会触发，因为跨 DOM 层级后 emit 失效"}], "answer": ["C"], "explain": "考点：AI 前端能力 - 框架与组件 - Teleport 与事件传递。Teleport 的核心是「<b>逻辑上仍属于父组件、物理上渲染到别处</b>」：组件树父子关系、props / emit / provide-inject / 响应式作用域全部保留，原位置只留下一对注释节点作占位。但<b>原生 DOM 事件冒泡走的是真实 DOM 树</b>，弹层已经被搬到 body 下，不再是 .page 的后代，因此 click 冒泡到 body 就结束了，onPageClick 收不到。这正是用 Teleport 解决弹层被父级 overflow:hidden 裁剪、z-index 层叠上下文受限问题的同时，必须留意的副作用（例如「点击外部关闭」的判断逻辑要改用弹层自身的遮罩层，而不是依赖父级捕获）。A 说反了 DOM 结构；B、D 与 Teleport 的设计目标矛盾。", "android": "类似把一个 View 从当前布局挪到 WindowManager 的悬浮窗：它还是原来那个业务模块在控制（回调照常回来），但触摸事件不再经过原来的父 ViewGroup 分发。", "kaodian": "AI 前端能力 - 框架与组件 - Teleport 与事件传递"}, {"no": 14, "type": "single", "body": "下面用 <code>&lt;Suspense&gt;</code> 承载一个 <code>async setup</code> 的异步组件。关于其渲染与错误处理，说法正确的是？", "code": "<!-- AsyncUser.vue -->\n<script setup>\nconst data = await fetch('/api/user').then(r => r.json())\n<\/script>\n<template><div>{{ data.name }}</div></template>\n\n<!-- Parent.vue -->\n<template>\n  <Suspense>\n    <AsyncUser />\n    <template #fallback>\n      <Spinner />\n    </template>\n  </Suspense>\n</template>\n\n<script setup>\nimport { onErrorCaptured } from 'vue'\nonErrorCaptured(err => { console.log('caught', err); return false })\n<\/script>", "options": [{"k": "A", "t": "请求失败时 Suspense 会自动继续渲染 #fallback 作为兜底，无需额外错误处理"}, {"k": "B", "t": "Vue3 中任意组件都可以直接使用 async setup，不被 Suspense 包裹也能正常渲染"}, {"k": "C", "t": "#fallback 插槽必须写在默认插槽<b>之前</b>，否则不会生效"}, {"k": "D", "t": "AsyncUser 的 async setup 返回一个 Promise，Suspense 在其 resolve 前渲染 #fallback 插槽、resolve 后切换为默认插槽；若 Promise reject，错误会沿组件树向上传播，需由父级 onErrorCaptured（或错误边界组件）捕获"}], "answer": ["D"], "explain": "考点：AI 前端能力 - 框架与组件 - Suspense 异步组件。&lt;script setup&gt; 中出现顶层 await，编译产物的 setup 就变成 async 函数、返回 Promise，该组件必须有 Suspense 祖先来「等待」它，否则会警告且无法正常挂载（B 错）。Suspense 只有两个具名插槽 default 与 fallback，<b>顺序无要求</b>（C 错），等待期间渲染 fallback，全部异步依赖 resolve 后一次性切换。关键点在于 <b>Suspense 只管 loading、不管 error</b>：Promise reject 时错误会向上冒泡，必须由父组件的 onErrorCaptured 或包一层 ErrorBoundary 处理，返回 false 可阻止继续向上传播（A 错，失败时不会退回 fallback，界面会一直卡在 loading 或直接抛错）。生产实践中常用 loading + error + retry 三态封装。", "android": "类似 Android 里 Fragment 加载数据的三态视图：Suspense 只帮你自动切了「骨架屏 ↔ 内容」，异常态还得自己写 error 布局和重试按钮。", "kaodian": "AI 前端能力 - 框架与组件 - Suspense 与异步渲染"}, {"no": 15, "type": "single", "body": "下面注册了两个请求拦截器和两个响应拦截器，发起一次成功的请求，控制台的输出顺序是？", "code": "axios.interceptors.request.use(c => { console.log('req A'); return c })\naxios.interceptors.request.use(c => { console.log('req B'); return c })\n\naxios.interceptors.response.use(r => { console.log('res C'); return r })\naxios.interceptors.response.use(r => { console.log('res D'); return r })\n\nawait axios.get('/api/list')   // 服务端返回 200", "options": [{"k": "A", "t": "req A → req B → res C → res D"}, {"k": "B", "t": "req B → req A → res C → res D：请求拦截器按注册顺序<b>逆序</b>执行，响应拦截器按注册顺序<b>正序</b>执行"}, {"k": "C", "t": "req B → req A → res D → res C，请求与响应拦截器都是逆序"}, {"k": "D", "t": "req A → req B → res D → res C"}], "answer": ["B"], "explain": "考点：AI 前端能力 - 工程化与网络 - Axios 拦截器执行顺序。Axios 内部把整条链拼成一个 Promise 链：dispatchRequest 位于中间，<b>请求拦截器用 unshift 加到链头</b>，所以后注册的排在更靠前的位置、先执行（B → A）；<b>响应拦截器用 push 加到链尾</b>，按注册顺序依次执行（C → D）。这个「请求逆序、响应正序」的特性在实际项目里很关键：例如既要加 token 又要加签名，签名必须基于最终参数计算，就得注意注册次序；同理，响应侧的解密拦截器必须<b>先</b>注册，才能保证在业务错误码拦截器之前拿到明文。若把 options.synchronous 设为 true 还可让请求拦截器同步执行以避免额外微任务。A、C、D 均记反了其中一侧的顺序。", "android": "类似 OkHttp 的 Interceptor 链：拦截器的添加顺序直接决定了「谁先包裹谁」，加签名和加 Header 的先后写反，服务端验签就会失败。", "kaodian": "AI 前端能力 - 工程化与网络 - Axios 拦截器执行顺序"}, {"no": 16, "type": "single", "body": "阅读 Vite 构建配置与源码，关于最终 <code>npm run build</code> 产物的描述，正确的是？", "code": "// vite.config.js\nexport default defineConfig({\n  build: {\n    rollupOptions: {\n      output: { manualChunks: { vendor: ['vue', 'vue-router'] } }\n    }\n  }\n})\n\n// package.json\n{ \"sideEffects\": [\"*.css\"] }\n\n// src/utils/index.js\nimport './polyfill.css'\nexport const add = (a, b) => a + b\nexport const heavyReport = () => { /* 内部引用了体积很大的 echarts */ }\n\n// src/main.js\nimport { add } from './utils'\nconsole.log(add(1, 2))", "options": [{"k": "A", "t": "heavyReport 未被引用，Rollup 基于 ESM 静态分析可将其及其依赖摇除；而 import './polyfill.css' 属于副作用导入（sideEffects 已声明）会被保留；manualChunks 把 vue/vue-router 拆成独立 vendor chunk，业务代码变更时该 chunk 的哈希不变，利于浏览器长期缓存"}, {"k": "B", "t": "dev 环境同样会执行 tree-shaking，所以开发时看到的模块列表就等于最终产物内容"}, {"k": "C", "t": "tree-shaking 对 export const 声明的箭头函数无效，heavyReport 一定会被打进产物"}, {"k": "D", "t": "配置 manualChunks 后所有第三方依赖都会自动合并进 vendor，业务代码不再拆分出任何 chunk"}], "answer": ["A"], "explain": "考点：AI 前端能力 - 工程化与网络 - Vite 构建优化。三个要点：①<b>tree-shaking 依赖 ESM 的静态结构</b>，具名导出且未被引用的 heavyReport 会被 Rollup 标记为 dead code 移除，连带其内部 import 的 echarts 也不会进包（若改用 CommonJS 或动态 require 则无法摇除）；②<b>副作用文件不能摇</b>，CSS 导入没有导出物却会影响样式，因此要在 package.json 的 sideEffects 中声明保留，否则可能被误删导致样式丢失；③<b>manualChunks</b> 把长期不变的框架代码单独成块，业务代码迭代时 vendor 的内容哈希保持稳定，命中强缓存，是首屏优化的常规手段。B 错，Vite dev 走原生 ESM 按需转译，不打包不摇树；C 错，箭头函数常量导出完全可被摇除；D 错，manualChunks 只影响列出的模块，其余依赖仍按默认策略与动态 import 拆分。", "android": "类似 Android 的 R8/ProGuard 压缩：没被引用的类会被裁掉，但反射调用（相当于副作用/动态引用）必须写 keep 规则，否则运行时崩溃。", "kaodian": "AI 前端能力 - 工程化与网络 - Vite 打包与 tree-shaking"}, {"no": 17, "type": "single", "body": "下面的 Flex 布局中，右侧长文本没有出现省略号，反而把容器撑破导致横向滚动。原因与最小修复是？", "code": ".container { display: flex; width: 400px; }\n.left  { flex: 0 0 120px; }\n.right { flex: 1; }\n.right .text {\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n<div class=\"container\">\n  <div class=\"left\">头像</div>\n  <div class=\"right\">\n    <p class=\"text\">这是一段非常非常长的商品标题文字……</p>\n  </div>\n</div>", "options": [{"k": "A", "t": "flex:1 只设置了 flex-grow，需要补全为 flex: 1 1 auto 才能收缩"}, {"k": "B", "t": "因为 .text 是块级元素，必须改成 display: inline-block 才能触发 ellipsis"}, {"k": "C", "t": "Flex 子项的 min-width 默认值是 auto（即内容的最小尺寸），使 .right 无法收缩到比文本更窄，overflow 便失去作用；给 .right 补上 min-width: 0（或 overflow: hidden）即可让省略号生效"}, {"k": "D", "t": "因为父容器没有写 flex-wrap: nowrap，子项换行导致溢出"}], "answer": ["C"], "explain": "考点：AI 前端能力 - 前端基础与渲染引擎 - Flex 布局收缩规则。CSS 规范规定：<b>Flex 子项的 min-width / min-height 初始值为 auto</b>（而非 0），意味着它「最小也不能小于内容的固有最小尺寸」。文本 nowrap 时内容最小宽度就是整行文字的宽度，因此 .right 虽然写了 flex:1（等价 flex: 1 1 0%），flex-shrink 也没法把它压到 400-120=280px，最终撑破容器。加 <b>min-width: 0</b> 解除这个下限，或加 overflow: hidden（会让 min-width 的 auto 计算为 0）即可。这是 Flex 里最高频的实战坑，嵌套多层 flex 时往往每一层都要加。A 错，flex:1 的完整展开是 1 1 0%，flex-shrink 本来就是 1；B 错，text-overflow 恰恰要求块级/inline-block 且有确定宽度，改成 inline-block 反而更难约束；D 错，flex-wrap 默认就是 nowrap，本题也没有换行现象。", "android": "类似 LinearLayout 里子 View 设了 weight 却被 wrap_content 的最小宽度顶住：必须把 width 设成 0dp（相当于 min-width:0）让权重真正接管尺寸分配。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - Flex 收缩与 min-width"}, {"no": 18, "type": "single", "body": "Playwright 用例报错 <code>strict mode violation</code>。四种修改方案中，工程上最优的是？", "code": "// 页面上有两个「删除」按钮：订单行内一个、底部批量操作栏一个\nawait page.locator('text=删除').click();\n// Error: strict mode violation: locator('text=删除') resolved to 2 elements\n\n// 候选修改方案\n// ① await page.locator('text=删除').first().click();\n// ② await page.getByRole('row', { name: '订单 1001' })\n//          .getByRole('button', { name: '删除' }).click();\n// ③ const el = await page.$('text=删除'); await el.click();\n// ④ await page.waitForTimeout(2000);\n//    await page.locator('text=删除').click();", "options": [{"k": "A", "t": "选 ①，用 .first() 兜底，改动最小且总能选中元素"}, {"k": "B", "t": "选 ②，先用 getByRole('row') 把作用域收敛到目标行再定位按钮：既满足严格模式的唯一性要求，又基于语义角色和可见文本而非 DOM 顺序，重构页面后依然稳定"}, {"k": "C", "t": "选 ③，page.$ 返回 ElementHandle 不受严格模式约束，是官方推荐的规避方式"}, {"k": "D", "t": "选 ④，加固定等待让页面渲染完成后，多元素匹配问题会自动消失"}], "answer": ["B"], "explain": "考点：AI 质量保障 - 自动化测试与工具 - Playwright 定位器与严格模式。Playwright 的 Locator 默认开启 strict mode：一个定位器解析到多个元素就直接报错，目的是<b>逼迫用例表达明确意图</b>，避免「误点到另一个按钮却仍然通过」的假阳性。正确解法是缩小作用域（locator 链式过滤、filter({hasText})、getByRole 等语义定位器），②同时满足唯一性、可读性和抗重构性，也符合官方推荐的「用用户可感知的角色/文本定位」原则。①用 .first() 把断言意图变成了「随便点第一个」，一旦列表排序变化就点错行，属于掩盖问题；③page.$ / ElementHandle 已被官方标记为不推荐，它绕过了严格模式，也失去了 Locator 的自动重试与自动等待能力；④waitForTimeout 是硬等待，既拖慢用例又完全无法解决「有两个匹配元素」这个本质问题。", "android": "类似 Espresso 的 AmbiguousViewMatcherException：页面上有多个相同文案的控件时，正确做法是用 allOf(withText, isDescendantOfA(父容器)) 缩小范围，而不是随手取第一个。", "kaodian": "AI 质量保障 - 自动化测试与工具 - Playwright 定位器与严格模式"}, {"no": 19, "type": "single", "body": "下单接口同步返回 200，真正的库存扣减由 MQ 异步消费完成。下面这条自动化用例在 CI 上偶发失败（flaky），最合理的修复是？", "code": "@Test\nvoid createOrder_shouldDeductStock() {\n    int before = stockApi.get(SKU);              // 100\n\n    var resp = api.post(\"/api/orders\", body);    // 同步 200，MQ 异步扣库存\n    assertEquals(200, resp.statusCode());\n\n    int after = stockApi.get(SKU);               // 期望 99\n    assertEquals(before - 1, after);             // ❌ 本地常过，CI 偶发失败\n}\n\n// CI 日志\nexpected: <99> but was: <100>", "options": [{"k": "A", "t": "在最后一次查询前加 Thread.sleep(5000)，固定等待最稳妥"}, {"k": "B", "t": "异步链路无法自动化验证，该场景应从回归集移除，改由人工抽查"}, {"k": "C", "t": "把断言放宽为 assertTrue(after <= before)，让用例不再失败即可"}, {"k": "D", "t": "改用带超时上限的<b>轮询断言</b>（如 Awaitility.await().atMost(5, SECONDS).pollInterval(200, MILLISECONDS).untilAsserted(() -> assertEquals(before - 1, stockApi.get(SKU)))），对最终一致的异步结果做条件等待：既消除 flaky，也不会无谓拉长用例时长；同时补一条「消费失败进入死信」的负向用例"}], "answer": ["D"], "explain": "考点：AI 质量保障 - 软件测试理论与质量体系 - 异步接口测试与用例稳定性。同步接口返回 200 只代表「请求已受理」，MQ 异步链路的结果是<b>最终一致</b>的，用例必须表达「在可接受时间内达到期望状态」而不是「立刻达到」。轮询断言（Awaitility / awaitUntil）在超时上限内按固定间隔重试，机器快时立即通过、机器慢时也能等到，是消除这类 flaky 的标准手段。A 的固定 sleep 有双重问题：CI 机器更慢时 5 秒仍可能不够（flaky 依旧），机器快时又白白浪费时间，全套回归叠加起来非常可观。C 属于「为了让用例变绿而放弃断言价值」，改完之后即使库存完全没扣也会通过，是典型的假阳性用例。B 直接放弃自动化，与持续交付的质量门禁目标相悖 —— 异步结果同样可以断言，只是需要正确的等待模型；此外还应覆盖消费失败、重复消费（幂等）等负向场景。", "android": "类似测试 Android 里「点击后台上传成功再刷新 UI」：用 IdlingResource 等待空闲状态，而不是死等 sleep(5000)。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 异步接口测试与用例稳定性"}, {"no": 20, "type": "single", "body": "线上排查时发现：网关入口日志有 traceId，但异步导出任务的日志 traceId 为空，链路断在了这里。根因与修复方案是？", "code": "// 网关过滤器：入口写入 MDC\nMDC.put(\"traceId\", request.getHeader(\"X-Trace-Id\"));\n\n@Service\npublic class ReportService {\n    @Async(\"bizExecutor\")\n    public void export(Long id) {\n        log.info(\"start export id={}\", id);\n    }\n}\n\n# logback pattern: %d [%thread] [traceId=%X{traceId}] %-5level %msg%n\n\n# 实际日志\n10:00:00 [http-nio-8080-exec-1] [traceId=abc123] INFO  收到导出请求\n10:00:00 [biz-1]                [traceId=]       INFO  start export id=9", "options": [{"k": "A", "t": "MDC 底层基于 ThreadLocal，@Async 把任务提交给线程池后运行在另一个线程，上下文不会自动继承；应为线程池配置 TaskDecorator，在提交时把父线程 MDC 复制到子线程并在任务结束后清理（或改用 TransmittableThreadLocal）"}, {"k": "B", "t": "日志格式写错了，把 %X{traceId} 改成 %traceId 即可正常输出"}, {"k": "C", "t": "因为 @Async 方法返回值是 void，必须改成返回 Future 才能携带调用方上下文"}, {"k": "D", "t": "把线程池核心线程数设为 1，复用同一个线程即可保证 traceId 不丢失"}], "answer": ["A"], "explain": "考点：AI 质量保障 - 缺陷定位与可观测性 - 链路追踪与日志上下文。SLF4J 的 MDC 默认实现是 ThreadLocal（InheritableThreadLocal 也只在 new Thread 时继承一次，对<b>复用线程</b>的线程池无效），所以 @Async、CompletableFuture、MQ 消费线程都会出现 traceId 断链。标准修复是给 ThreadPoolTaskExecutor 设置 TaskDecorator：提交时用 MDC.getCopyOfContextMap() 抓取父线程上下文，在 run 前 setContextMap、finally 里 clear（必须清理，否则线程复用会串号，把上一个请求的 traceId 带给下一个任务）。同理，跨 MQ 时要把 traceId 显式放进消息头并在消费端还原。B 错，%X{key} 正是 logback 读取 MDC 的正确语法；C 错，返回值类型与上下文传递无关；D 错，即使只有一个线程，它也不是发起请求的那个线程，MDC 依然为空，而且并发度降为 1 完全不可接受。", "android": "类似 Android 里在子线程读不到 Looper.myLooper() 或主线程的 ThreadLocal 变量：跨线程必须显式把上下文（如埋点 sessionId）通过参数或 Handler 传过去。", "kaodian": "AI 质量保障 - 缺陷定位与可观测性 - 链路追踪与日志上下文"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "下面开启了 RabbitMQ 的发布确认与消息回退机制。关于 ConfirmCallback / ReturnsCallback，说法正确的有？（多选、少选、错选均不得分）", "code": "spring:\n  rabbitmq:\n    publisher-confirm-type: correlated   # simple / correlated / none\n    publisher-returns: true\n    template:\n      mandatory: true\n\nrabbitTemplate.setConfirmCallback((correlationData, ack, cause) -> {\n    if (!ack) log.error(\"confirm 失败 id={} cause={}\",\n            correlationData.getId(), cause);\n});\nrabbitTemplate.setReturnsCallback(returned ->\n    log.error(\"路由失败 exchange={} rk={} replyText={}\",\n            returned.getExchange(), returned.getRoutingKey(),\n            returned.getReplyText()));\n\nCorrelationData cd = new CorrelationData(\"msg-1001\");\nrabbitTemplate.convertAndSend(\"order.ex\", \"order.pay\", payload, cd);", "options": [{"k": "A", "t": "只要开启了发布确认，消息就一定不会丢失，无需再声明持久化交换机、持久化队列和 deliveryMode=2"}, {"k": "B", "t": "交换机存在但没有队列匹配 routingKey 时，会触发 ReturnsCallback（replyText=NO_ROUTE），而 ConfirmCallback 仍然收到 ack=true"}, {"k": "C", "t": "publisher-confirm-type 设为 simple 时是同步等待确认（waitForConfirms），会阻塞发送线程，吞吐低于 correlated 的异步回调模式"}, {"k": "D", "t": "ConfirmCallback 返回 ack=true 仅代表消息已被 Broker 的<b>交换机</b>接收，并不代表已成功入队，更不代表消费者已消费"}], "answer": ["B", "C", "D"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - RabbitMQ 发布确认机制。D 正确：confirm 只覆盖「生产者 → 交换机」这一段，交换机不存在才会 ack=false；至于有没有队列收下，要靠 mandatory + return 感知。B 正确：Broker 对不可路由消息先发 basic.return 再发 basic.ack，所以两个回调都会触发且顺序固定；若没开 mandatory，消息会被静默丢弃，线上极难排查。C 正确：simple 模式在每次发送后同步 waitForConfirms 阻塞等待，逻辑简单但吞吐低；correlated 通过 CorrelationData 关联异步回调，适合高吞吐场景。A 错误：可靠投递需要「三段保障」协同 —— 生产端 confirm+return、Broker 端交换机/队列/消息三者都持久化（deliveryMode=2）、消费端手动 ack；只做 confirm 时若 Broker 未持久化，重启仍会丢消息，且持久化也只是「大概率」不丢（写盘存在短暂缓冲窗口），强一致场景还需本地消息表兜底。", "android": "类似 Android 上传文件：服务端返回 200 只说明请求被网关收下了（confirm），文件有没有真正落到对象存储（入队+持久化）、业务方有没有处理（消费 ack），是三件必须分别确认的事。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RabbitMQ 发布确认与可靠投递"}, {"no": 22, "type": "multi", "body": "某 Kafka 消费组频繁再均衡导致消费抖动。结合下列配置与日志，说法正确的有？（多选、少选、错选均不得分）", "code": "# 消费组 order-group 订阅 order-topic（12 分区），组内 4 个消费者\npartition.assignment.strategy = org.apache.kafka.clients.consumer.RangeAssignor\nsession.timeout.ms            = 45000\nheartbeat.interval.ms         = 3000\nmax.poll.interval.ms          = 300000\n\n# 协调者日志\n[order-group] Member consumer-3-xxxx has left the group\n[order-group] Preparing to rebalance: removing member consumer-3-xxxx\n[order-group] (Re-)joining group\n[order-group] Successfully joined group with generation 18\n[order-group] Setting newly assigned partitions: order-0, order-1, order-2", "options": [{"k": "A", "t": "组内消费者数量变化（新实例加入、实例宕机、主动 leave、心跳超时被踢）都会触发再均衡"}, {"k": "B", "t": "再均衡期间消费者仍可以照常拉取消息并提交位移，业务完全无感知"}, {"k": "C", "t": "改用 CooperativeStickyAssignor 可实现增量式协作再均衡：只迁移必要的分区、其余分区继续消费，避免 Eager 协议下「全部撤销再重新分配」造成的 Stop-The-World"}, {"k": "D", "t": "订阅的 Topic 分区数发生变化（如 12 扩容到 16），同样会触发该消费组的再均衡"}], "answer": ["A", "C", "D"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Kafka 消费组再均衡。再均衡的三大触发条件：①组成员变化（A，含滚动发布时的下线上线、GC/处理超时被踢）；②订阅的 Topic 分区数变化（D，只增不减）；③订阅关系变化（正则订阅匹配到新 Topic）。C 正确：Kafka 2.4+ 引入 Cooperative Rebalance 协议，配合 CooperativeStickyAssignor 分两轮完成，只回收需要迁移的分区，未受影响的分区不中断消费，能显著降低滚动发布期间的消费停顿。B 错误：Eager 协议下再均衡开始时<b>所有</b>消费者都要先 revoke 全部分区、停止消费，直到新分配方案生效，这段时间整个组不可用（即 STW）；并且在 revoke 之后提交位移会抛 CommitFailedException，所以必须在 ConsumerRebalanceListener.onPartitionsRevoked 里提前提交位移，否则会造成重复消费。", "android": "类似 Android 应用进程被系统回收后重建：Eager 相当于所有页面全部销毁重来（白屏一段时间），Cooperative 相当于只重建受影响的那个 Fragment，其余界面照常可用。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 再均衡触发条件与协作协议"}, {"no": 23, "type": "multi", "body": "阅读下面的 Kafka 分区副本状态，关于 ISR / HW / LEO 的描述，正确的有？（多选、少选、错选均不得分）", "code": "$ kafka-topics.sh --describe --topic order-topic\nTopic: order-topic  Partition: 0  Leader: 1  Replicas: 1,2,3  Isr: 1,2\n\n# 副本水位状态（broker-3 因长时间 GC 停顿落后，已被移出 ISR）\nleader(broker-1)   LEO = 20000   HW = 19800\nfollower(broker-2) LEO = 19800\nfollower(broker-3) LEO = 17000\n\n# 相关配置\nreplica.lag.time.max.ms        = 30000\nunclean.leader.election.enable = false", "options": [{"k": "A", "t": "消费者最多只能读取到 HW（19800）之前的消息，19800~19999 这段虽已写入 leader 但对消费者不可见"}, {"k": "B", "t": "ISR 是与 leader 保持同步的副本集合，判定依据是 replica.lag.time.max.ms（落后<b>时间</b>），而不是落后的消息条数"}, {"k": "C", "t": "HW 取 ISR 中所有副本 LEO 的<b>最大值</b>，因此本例 HW 理论上应等于 leader 的 LEO（20000），图中显示 19800 只是监控采集延迟"}, {"k": "D", "t": "Kafka 默认允许生产者写入任意副本、消费者从最近的 follower 读取，以此分摊 leader 的读写压力"}], "answer": ["A", "B"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Kafka 副本机制。A 正确：LEO 是副本日志末端位移，HW（High Watermark）取 ISR 中所有副本 LEO 的最小值，<b>只有低于 HW 的消息才被认为“已提交”并对消费者可见</b>，这保证了 leader 切换后消费者不会读到「可能丢失」的数据。B 正确：早期版本用 replica.lag.max.messages（条数）判定，会因流量突增导致副本频繁进出 ISR，0.9 之后统一改为按落后时间判定，更稳定。C 错误：HW 取的是 ISR 内所有副本 LEO 的<b>最小值</b>，本例 min(20000, 19800) = 19800，与监控延迟无关；注意计算时只看 ISR 成员，已被移出 ISR 的 broker-3（LEO=17000）不参与，否则一个慢副本就能把整个分区的可见进度拖死。D 错误：Kafka 的<b>生产者只能写 leader，消费者默认也只从 leader 读</b>，follower 仅做冗余备份；2.4 版本起虽然提供了 KIP-392「就近读 follower」的能力，但需要显式配置机架感知与 replica.selector.class，并非默认行为，且生产写入永远只走 leader。另外补充一点：在 unclean.leader.election.enable=false 时，只有 ISR 中的副本才有资格被选为新 leader。", "android": "类似多副本本地数据库：只有「多数副本都已落盘」的那部分数据才对外可见（HW），否则主节点一挂就会出现界面上看得到、重启后又消失的幽灵数据。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka ISR 与 HW 水位"}, {"no": 24, "type": "multi", "body": "下面是异步任务的线程池隔离配置与使用。说法正确的有？（多选、少选、错选均不得分）", "code": "@Configuration\n@EnableAsync\npublic class AsyncConfig {\n    @Bean(\"mqExecutor\")\n    public Executor mqExecutor() { /* core 4 / queue 200 */ }\n\n    @Bean(\"reportExecutor\")\n    public Executor reportExecutor() { /* core 2 / queue 20 */ }\n}\n\n@Service\npublic class NotifyService {\n\n    @Async                                  // ① 未指定线程池名\n    public void push(Long id) { ... }\n\n    @Async(\"reportExecutor\")                // ② 返回 void\n    public void export(Long id) {\n        throw new RuntimeException(\"boom\");\n    }\n}", "options": [{"k": "A", "t": "① 未指定 beanName 时，容器中存在多个 Executor 且没有实现 AsyncConfigurer#getAsyncExecutor、也没有名为 taskExecutor 的候选 Bean，Spring 无法唯一确定线程池，会退化为 SimpleAsyncTaskExecutor（每次新建线程、不复用），高并发下有耗尽资源的风险"}, {"k": "B", "t": "② 的方法返回 void，抛出的异常不会传播给调用方，需要实现 AsyncUncaughtExceptionHandler 才能统一捕获；若把返回值改为 Future/CompletableFuture，则异常会在调用 get() 时抛出"}, {"k": "C", "t": "只要方法上加了 @Async，方法内部抛出的异常就会被 @RestControllerAdvice 全局异常处理器捕获并返回给前端"}, {"k": "D", "t": "把「耗时长、易堆积」的报表导出与「实时性要求高」的消息推送放在两个独立线程池，属于线程池隔离，可避免慢任务占满线程导致快任务饥饿（舱壁模式）"}], "answer": ["A", "B", "D"], "explain": "考点：AI 后端能力 - 框架与容器层 - @Async 线程池隔离。A 正确：@Async 不带参数时按「AsyncConfigurer 提供的执行器 → 唯一的 TaskExecutor Bean → 名为 taskExecutor 的 Bean」顺序查找，都找不到唯一候选就回退到 SimpleAsyncTaskExecutor，它<b>根本不是池</b>，每个任务起一个新线程，流量一大就会 OOM 或线程数爆炸 —— 这也是要求「@Async 必须显式指定线程池」的原因。B 正确：void 返回值的异步方法异常只会被内部吞掉并打日志，要统一治理必须实现 AsyncConfigurer#getAsyncUncaughtExceptionHandler；返回 Future 时异常被包装成 ExecutionException 在 get() 处抛出。D 正确：这就是舱壁隔离（Bulkhead），也是生产环境按业务域拆分线程池的核心动机。C 错误：@RestControllerAdvice 只能拦截<b>同一请求线程</b>内、经由 DispatcherServlet 处理链抛出的异常；异步任务运行在另一个线程且 HTTP 响应早已返回，全局异常处理器完全不会介入。", "android": "类似 Android 里给「图片压缩」和「网络回调」各配独立的 Executor：一旦共用一个池，几张大图压缩就把回调全卡住，界面直接假死。", "kaodian": "AI 后端能力 - 框架与容器层 - @Async 线程池隔离"}, {"no": 25, "type": "multi", "body": "新集群准备用 Quorum 队列替换旧的镜像队列。关于下面的配置与选型，说法正确的有？（多选、少选、错选均不得分）", "code": "// 新集群：声明 Quorum 队列\nMap<String,Object> args = new HashMap<>();\nargs.put(\"x-queue-type\", \"quorum\");\nargs.put(\"x-delivery-limit\", 5);\nargs.put(\"x-dead-letter-exchange\", \"dlx.ex\");\nQueue q = new Queue(\"order.quorum\", true, false, false, args);\n\n# 旧集群的镜像队列策略（准备下线）\n$ rabbitmqctl set_policy ha-all \"^order\" '{\"ha-mode\":\"all\"}'", "options": [{"k": "A", "t": "Quorum 队列完整支持经典队列的所有特性，包括排他队列（exclusive）、消息优先级和队列级 TTL 的全部语义，可以无脑平移"}, {"k": "B", "t": "经典镜像队列（ha-mode 策略）自 RabbitMQ 3.8 起已被官方标记为废弃，在新版本中被移除，新建集群应优先使用 Quorum 队列"}, {"k": "C", "t": "x-delivery-limit 可限制同一条消息的最大投递次数，超过后自动丢弃或投递到死信交换机，可用于治理反复失败的「毒消息」无限重投"}, {"k": "D", "t": "Quorum 队列基于 Raft 共识协议复制，写入需多数派（quorum）确认，相比经典镜像队列具有更可预期的故障切换行为和更强的数据安全性"}], "answer": ["B", "C", "D"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - RabbitMQ 队列类型与高可用。D 正确：Quorum 队列用 Raft 保证多数派复制，脑裂与「镜像同步长时间阻塞」这类经典队列顽疾得到根治，代价是内存/磁盘开销更高、写入延迟略增。B 正确：镜像队列在 3.8 被标记 deprecated 并在后续大版本中移除，官方明确推荐迁移到 Quorum 队列。C 正确：经典队列没有原生投递次数上限，requeue=true 的失败消息会无限循环重投打爆日志和 CPU；Quorum 队列的 x-delivery-limit 天然解决毒消息问题，超限后按 DLX 配置进死信队列，便于人工介入。A 错误：Quorum 队列<b>不支持</b>排他队列、非持久化队列，早期版本也不支持优先级和惰性模式，队列级 TTL 与 max-length 的行为也有差异，迁移前必须逐项核对特性矩阵，不能无脑平移。", "android": "类似 Android 里把自研的「主从备份」方案换成基于 Raft 的强一致存储：可靠性显著提升，但要先确认旧方案里用到的一些「非标能力」新方案是否还提供。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RabbitMQ 队列类型与高可用"}, {"no": 26, "type": "multi", "body": "某后台管理页面反复进入/离开「实时监控」路由后越来越卡。用 Chrome DevTools 排查内存泄漏，做法正确的有？（多选、少选、错选均不得分）", "code": "// Monitor.vue\nlet timer = null\nonMounted(() => {\n  timer = setInterval(fetchData, 1000)\n  window.addEventListener('resize', onResize)\n  bus.on('refresh', onRefresh)\n  chart = echarts.init(chartRef.value)\n})\n// ⚠️ 没有写 onUnmounted，未做任何清理\n\n// 现象：进入/离开该路由 10 次后，JS Heap 从 30MB 涨到 260MB 且 GC 后不回落", "options": [{"k": "A", "t": "只要在 Console 里执行一次 window.gc() 后 JS Heap 有所回落，就可以判定不存在内存泄漏，无需再做后续分析"}, {"k": "B", "t": "在 Memory 面板对操作前后各拍一次 Heap snapshot，用 Comparison 视图对比增量，重点看 Detached HTMLElement 和组件实例的数量是否持续增长，并顺着 Retainers 链找到持有它的引用"}, {"k": "C", "t": "根因是 onUnmounted 缺失：定时器、window 事件监听、事件总线订阅和 echarts 实例都会通过闭包持有组件实例与 DOM，使其无法被回收；应在 onUnmounted 中 clearInterval、removeEventListener、bus.off、chart.dispose()"}, {"k": "D", "t": "Performance 面板中 FPS 曲线下降就一定是内存泄漏造成的，看到掉帧即可下结论，无需再拍堆快照"}], "answer": ["B", "C"], "explain": "考点：AI 前端能力 - 工程化与网络 - DevTools 内存分析。A 错误：window.gc() 需要以 --js-flags=--expose-gc 启动 Chrome 才可用，普通环境根本调不到；更关键的是「回落了一点」不等于「全部回收」，判定泄漏必须看<b>反复执行同一操作后基线是否持续抬高</b>，单次 GC 结果没有结论价值。正确的定性手段是在 Performance 面板勾选 Memory 录制多轮「进入/离开」操作，观察 JS Heap 是否呈阶梯式上升且 GC 后不回到基线。B 正确：定量定位要靠 Heap snapshot 的 Comparison（或 Allocation instrumentation on timeline），<b>Detached HTMLElement</b> 表示 DOM 已从文档树移除但仍被 JS 引用，是最常见的泄漏证据；Retainers 面板可回溯持有链直到具体变量。C 正确：本题四个资源都是「组件外部持有组件内部回调」的引用方向，组件卸载后引用仍在，导致整个组件实例及其 DOM 无法回收；Vue3 中 watch/computed 会自动随作用域销毁，但原生定时器、addEventListener、第三方库实例、EventBus 订阅必须手动清理。D 错误：掉帧原因很多（长任务、频繁重排重绘、大量同步计算、动画未走合成层），不能仅凭 FPS 曲线断定内存问题，必须用堆快照证据链闭环。", "android": "完全对应 Android 的内存泄漏排查：Profiler 看 Java Heap 阶梯上涨 → dump hprof → 用 LeakCanary/MAT 看 GC Root 引用链，根因往往也是 Handler、匿名监听器持有了已销毁的 Activity。", "kaodian": "AI 前端能力 - 工程化与网络 - DevTools 内存快照与泄漏定位"}, {"no": 27, "type": "multi", "body": "下面这条流水线「一路绿灯却总把 bug 带到线上」。针对标注处的问题，说法正确的有？（多选、少选、错选均不得分）", "code": "# .gitlab-ci.yml\nstages: [build, test, quality, deploy]\n\nunit-test:\n  stage: test\n  script: [\"mvn -B test\"]\n  allow_failure: true              # ①\n\nsonar-scan:\n  stage: quality\n  script: [\"mvn sonar:sonar\"]      # ② 未设置质量阈，扫描完即通过\n\ndeploy-prod:\n  stage: deploy\n  script: [\"./deploy.sh prod\"]\n  when: always                     # ③", "options": [{"k": "A", "t": "① allow_failure: true 会让单元测试失败也不阻断后续阶段，质量门禁形同虚设；除非是「观察期」的新增检查项，否则应去掉，让测试失败即红灯"}, {"k": "B", "t": "只要流水线里包含了自动化测试阶段，就可以取消发布前的冒烟验证和回滚预案，实现全自动无人值守发布"}, {"k": "C", "t": "② 应开启 Quality Gate 阻断（如 sonar.qualitygate.wait=true），并针对<b>新增代码</b>设定覆盖率、重复率、严重级别漏洞的阈值，否则扫描结果只是「报告」而不是「门禁」"}, {"k": "D", "t": "③ when: always 会在前置阶段失败时仍然执行生产部署，应改为 on_success，并对生产环境增加 when: manual 人工确认或审批环节"}], "answer": ["A", "C", "D"], "explain": "考点：AI 质量保障 - 软件测试理论与质量体系 - CI/CD 质量门禁。质量门禁的本质是「<b>不达标就必须阻断</b>」，A、C、D 三处恰好是门禁失效的三种典型姿势：A 把强制检查降级成可选检查（allow_failure 只适合灰度引入的新规则，且应设定摘帽期限）；C 只扫描不设阈值，报告没人看等于没做，业界通行做法是对增量代码（new code）设门槛而非要求存量代码一次性达标，避免历史包袱阻塞交付；D 的 when: always 让部署脱离前序结果，是「测试全红照样上线」的直接元凶，生产环境还应叠加人工审批与灰度。B 错误：自动化测试只能覆盖已知的、可断言的场景，无法替代发布后的冒烟验证（验证真实环境的配置、依赖、网络与数据），更不能取消回滚预案 —— 成熟的交付体系强调「快速发现 + 快速回滚」，MTTR 与缺陷拦截率同等重要。", "android": "类似 Android 的发版流程：单元测试和 Lint 通过只是最低门槛，还需要真机冒烟、灰度分发观察崩溃率，并随时准备停止放量回滚版本。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - CI/CD 质量门禁"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 28, "type": "judge", "body": "Kafka 生产者设置 <code>acks=all</code> 后，必须等待该分区<strong>全部副本（AR）</strong>都写入成功才会返回；因此只要有任意一个 follower 宕机，发送就会失败。", "code": "props.put(ProducerConfig.ACKS_CONFIG, \"all\");\n\n# topic: replication.factor = 3, min.insync.replicas = 2\n$ kafka-topics.sh --describe --topic order-topic\nTopic: order-topic  Partition: 0  Leader: 1  Replicas: 1,2,3  Isr: 1,2\n# broker-3 已宕机\n\nRecordMetadata md = producer.send(record).get();   // 结果？", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Kafka acks 与 ISR。acks=all（等价于 -1）等待的是 <b>ISR 集合中的所有副本</b>确认，而不是全部副本 AR。本例 broker-3 宕机后已被移出 ISR，当前 Isr=[1,2]，数量 2 ≥ min.insync.replicas=2，因此写入正常成功、send().get() 返回 RecordMetadata。只有当 ISR 数量跌破 min.insync.replicas 时，Broker 才会返回 NotEnoughReplicasException。若 acks=all 真的要求全部 AR 确认，那么任何一台 broker 抖动都会导致集群不可写，可用性完全无法接受 —— ISR 机制的价值正是「用动态同步副本集合在一致性与可用性之间取得平衡」。生产上的黄金组合是 replication.factor=3 + min.insync.replicas=2 + acks=all，可容忍 1 台 broker 故障。", "android": "类似多设备数据同步策略：要求「至少两台在线设备确认」即可提交，而不是「所有注册过的设备都必须在线确认」，否则一台设备关机整个功能就瘫痪了。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka acks 与 ISR"}, {"no": 29, "type": "judge", "body": "RabbitMQ 队列声明 <code>x-max-length=1000</code> 后，队列达到上限时<strong>默认</strong>会从队头丢弃最早的消息以容纳新消息；若该队列配置了死信交换机，被丢弃的消息会进入死信队列。", "code": "Map<String,Object> args = new HashMap<>();\nargs.put(\"x-max-length\", 1000);\nargs.put(\"x-overflow\", \"drop-head\");       // 默认值即 drop-head\nargs.put(\"x-dead-letter-exchange\", \"dlx.ex\");\nnew Queue(\"limit.queue\", true, false, false, args);\n\n// 第 1001 条消息入队时会发生什么？", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - RabbitMQ 队列长度限制与溢出策略。x-max-length（按条数）与 x-max-length-bytes（按字节）用于给队列设上限，防止消费端故障时消息无限堆积拖垮 Broker 内存/磁盘。溢出行为由 <b>x-overflow</b> 决定，默认是 drop-head：从队头（最老的消息）开始丢弃，被丢弃的消息属于死信的一种成因（另两种是 TTL 过期和被 basicNack/basicReject 且 requeue=false），因此配置了 DLX 时会进入死信队列，可用于事后补偿或告警。另外两种取值需要区分：reject-publish 会拒绝新消息并让开启 publisher-confirm 的生产者收到 nack（相当于把背压传导给生产端）；reject-publish-dlx 则在拒绝的同时把被拒消息投递到 DLX。选型上，「宁可丢老数据也要保新数据」用 drop-head，「一条都不能丢、宁可生产失败」用 reject-publish。", "android": "类似 Android 里有界的日志缓冲区（如 logcat 环形缓冲）：满了默认冲掉最旧的记录以保留最新的，但若开了「持久化到文件」，被冲掉的部分仍能落盘留档。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RabbitMQ 队列限长与溢出策略"}, {"no": 30, "type": "judge", "body": "Vite 开发服务器基于原生 ESM 按需转译（esbuild），生产构建走 Rollup；由于二者都基于同一套源码，因此 <code>npm run dev</code> 跑通就等价于 <code>npm run build</code> 的产物没问题，无需单独验证生产包。", "code": "$ npm run dev     # esbuild 转译单文件，不打包、不 tree-shaking、不压缩\n$ npm run build   # rollup 打包 + tree-shaking + 压缩 + 分包 + 资源内联\n\n// 典型「dev 正常、build 白屏」的诱因\nimport Comp from './components/userCard.vue'  // 实际文件名是 UserCard.vue\nconsole.log(process.env.API_URL)              // 应为 import.meta.env.VITE_API_URL\nconst mod = await import(`./pages/${name}.vue`) // 动态路径无法被静态分析", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：AI 前端能力 - 工程化与网络 - Vite 构建与产物验证。dev 与 build 是<b>两条不同的链路</b>：dev 用 esbuild 做单文件转译、依赖预构建后直接由浏览器按 ESM 加载，不打包、不做 tree-shaking 和压缩；build 用 Rollup 全量打包并执行摇树、代码分割、压缩混淆、静态资源哈希与内联。因此存在大量「dev 绿灯、build 翻车」的经典场景：①路径大小写在 Windows/macOS 上不敏感但 Linux 构建机敏感，导致模块找不到；②误用 process.env 等仅 dev 生效的写法；③模板字符串动态 import 无法被静态分析，产物中缺少对应 chunk；④副作用代码被 tree-shaking 误删（sideEffects 配置不当）；⑤压缩混淆暴露出依赖全局变量名的隐患；⑥base / publicPath 配置错误导致资源 404 白屏。所以 CI 中必须有 build 阶段，并对构建产物做 preview 冒烟验证，端到端用例也应跑在生产构建包上。", "android": "完全对应 Android 的 debug 与 release 包差异：debug 跑得好好的，release 开了 R8 混淆压缩后反射失效、Gson 解析字段全空 —— 所以发版前必须单独测 release 包。", "kaodian": "AI 前端能力 - 工程化与网络 - Vite 构建与产物验证"}, {"no": 31, "type": "judge", "body": "默认配置下，服务端返回 HTTP 404 时，Axios 会进入响应拦截器的<strong>错误分支</strong>（Promise reject），而不是成功分支。", "code": "axios.interceptors.response.use(\n  res => { console.log('success', res.status); return res },\n  err => { console.log('error', err.response?.status); return Promise.reject(err) }\n)\n\naxios.get('/api/not-exist')     // 服务端返回 404\n\n// 对照：原生 fetch 的行为\nfetch('/api/not-exist')\n  .then(r => console.log('fetch then', r.status, r.ok))\n  .catch(e => console.log('fetch catch', e))", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：AI 前端能力 - 工程化与网络 - Axios 状态码处理。Axios 通过 <b>validateStatus</b> 判定成功与否，默认实现是 <code>status >= 200 && status < 300</code>，落在区间外（含 3xx 未自动跟随、4xx、5xx）都会 reject，进入响应拦截器的第二个回调，错误对象上带有 err.response（含 status、data、headers），可据此做 401 跳登录、403 提示无权限、5xx 统一告警。若业务方把错误码放在 HTTP 层但希望自行处理，可自定义 validateStatus: () => true 让所有状态码都进成功分支。注意与原生 <b>fetch</b> 的关键差异：fetch 只有网络层失败（断网、CORS 阻断、DNS 失败）才 reject，404/500 依然进入 then，必须手动检查 response.ok —— 这是很多「接口报错却没弹提示」的根因。另外要区分 err.response 存在（服务端有响应）与不存在（超时/网络中断/请求被取消）两种错误形态，拦截器里应分别处理。", "android": "类似 Retrofit + OkHttp：onResponse 回调里 404 也会走「成功」通道，必须判断 response.isSuccessful()；而 Axios 更贴近「直接把非 2xx 抛成异常」的风格。", "kaodian": "AI 前端能力 - 工程化与网络 - Axios 状态码与错误处理"}, {"no": 32, "type": "judge", "body": "分布式链路追踪中，同步 HTTP 调用可由 Agent 或拦截器自动透传 traceId；但走 MQ 异步解耦时，必须把 traceId <strong>显式写入消息头</strong>（如 RabbitMQ MessageProperties / Kafka Headers）并在消费端还原到 MDC，否则生产端与消费端的日志无法串联成一条链路。", "code": "// 生产端：把 traceId 塞进消息头\nMessage msg = MessageBuilder.withBody(body)\n        .setHeader(\"X-Trace-Id\", MDC.get(\"traceId\"))\n        .build();\nrabbitTemplate.send(\"order.ex\", \"order.pay\", msg);\n\n// 消费端：还原上下文\n@RabbitListener(queues = \"order.queue\")\npublic void on(Message m) {\n    MDC.put(\"traceId\", (String) m.getMessageProperties().getHeader(\"X-Trace-Id\"));\n    try { biz.handle(m); } finally { MDC.clear(); }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：AI 质量保障 - 缺陷定位与可观测性 - 异步链路追踪。链路追踪的本质是「上下文在调用链上的持续传播」。同步 HTTP/RPC 因为有明确的请求头载体，Sleuth / SkyWalking / OpenTelemetry 的探针可自动注入与提取；而 MQ 打断了线程与进程的直接调用关系，消息进入 Broker 后原线程已返回，消费端是完全独立的线程，<b>ThreadLocal 形态的 MDC 不可能自动跨越</b>。因此必须把 traceId（以及 spanId、采样标记）作为消息头随消息一起投递，消费端在处理入口还原到 MDC，并在 finally 中 clear —— 不清理会因线程池复用导致 traceId 串号，把 A 请求的链路挂到 B 请求上，排查时更加误导。成熟框架（Spring Cloud Sleuth、OTel 的 messaging instrumentation）已内置该能力，但自研消息封装或使用原生客户端时需要手动补齐。此外消费端一般会新建一个 span 并通过 parentId 关联生产端，从而在链路图上呈现异步分支。", "android": "类似 Android 埋点里的会话串联：主线程发起的事件带着 sessionId，交给 WorkManager 异步执行时必须把 sessionId 写进 inputData，否则后台任务上报的埋点就成了「孤儿事件」。", "kaodian": "AI 质量保障 - 缺陷定位与可观测性 - 异步链路追踪"}, {"no": 33, "type": "judge", "body": "Playwright 用例出现偶发失败时，推荐的稳定化做法是在关键断言前插入 <code>await page.waitForTimeout(3000)</code> 做固定等待。", "code": "// 写法 A\nawait page.click('#submit')\nawait page.waitForTimeout(3000)\nawait expect(page.locator('.toast')).toHaveText('提交成功')\n\n// 写法 B\nawait page.click('#submit')\nawait expect(page.locator('.toast')).toHaveText('提交成功', { timeout: 5000 })", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：AI 质量保障 - 自动化测试与工具 - Playwright 等待策略。写法 B 才是推荐做法。Playwright 的 <b>expect(locator) 是可重试断言（auto-retrying assertion）</b>：它会在 timeout 上限内以极短间隔反复求值，条件一满足立即通过。这带来两个好处：慢机器（CI 容器、资源竞争）下不会假失败，快机器下也不会白等固定时长，全套用例累计能节省大量时间。同时 Locator 的操作类 API（click、fill 等）本身内置<b>可操作性检查</b>（元素存在、可见、稳定不动、可接收事件、未被遮挡），大多数场景根本不需要显式等待。而 waitForTimeout 是纯硬等待，官方文档明确标注「不要在生产用例中使用，仅用于调试」：它既治不了根因（网络更慢时照样 flaky），又让用例越加越慢，属于典型的「用 sleep 掩盖竞态」。真正需要显式等待时，应使用语义化的 waitForResponse / waitForURL / waitForLoadState 或 expect 的 timeout 参数。", "android": "和 Android UI 测试同理：Espresso 用 IdlingResource 等待真实空闲状态，随手 Thread.sleep(3000) 只会让用例又慢又不稳。", "kaodian": "AI 质量保障 - 自动化测试与工具 - Playwright 等待策略"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+q.no+'" data-no="'+q.no+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+q.no+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q.no==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=document.querySelector('.card[data-no="'+btn.dataset.no+'"]'); gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  ans.querySelector('.ans').textContent='答案：'+(q.type==='fill'? q.answerText : q.answer.join('、'));
  ans.classList.add('show');
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  if(!isAnswered(card)){ if(!confirm('本题还没作答，将按答错处理并展示答案。')) return; }
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
