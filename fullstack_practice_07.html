<style>
  * { box-sizing: border-box; }

  .footer { text-align: center; color: #9aa0a6; font-size: 13px; margin: 30px 0 10px; }

  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }

  .btn-primary:hover { background:#0e4fd8; }

  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }

  @media (max-width:600px) {

<script type="application/json" id="quizData">{"id": "vol07", "title": "全栈转型模拟自测卷", "sub": "可答题 · 交卷判分 · 自动记录错题", "meta": "对齐公司真实考法：<b>单选 / 多选 / 判断</b>，每题包含完整代码场景，问执行结果、补全代码、判断框架用法正误。<br>本卷共 <b>33 题</b>：单选 20（60 分）+ 多选 7（28 分）+ 判断 6（12 分）= 100 分。<br>难度：<b>实战细节型</b>，考点标签采用公司标准层级命名。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "以下代码执行后的结果是？", "code": "List<Integer> list = Arrays.asList(1, 2, 3);\nlist.add(4);\nSystem.out.println(list.size());", "options": [{"k": "A", "t": "输出 4"}, {"k": "B", "t": "输出 3"}, {"k": "C", "t": "编译错误"}, {"k": "D", "t": "运行时抛 UnsupportedOperationException"}], "answer": ["D"], "explain": "<code>Arrays.asList()</code> 返回的是 Arrays 内部的一个<b>固定大小</b>的 ArrayList（并非 java.util.ArrayList），它没有实现 add/remove，调用会抛 <code>UnsupportedOperationException</code>。要可增删需 <code>new ArrayList<>(Arrays.asList(...))</code> 包一层。", "android": "类似把 Kotlin 的只读 <code>listOf()</code> 当 <code>MutableList</code> 用，调 add 直接崩。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 单位与字体"}, {"no": 2, "type": "single", "body": "以下代码的输出是？", "code": "Object obj = true ? Integer.valueOf(1) : Double.valueOf(2);\nSystem.out.println(obj);", "options": [{"k": "A", "t": "1"}, {"k": "B", "t": "1.0"}, {"k": "C", "t": "2.0"}, {"k": "D", "t": "抛异常"}], "answer": ["B"], "explain": "三元表达式两分支类型不同（Integer 与 Double）时会发生<b>二元数值提升</b>：Integer 被拆箱并提升为 double，整个表达式类型是 double。即使走 true 分支，结果也是 <code>1.0</code>（再自动装箱为 Double）。", "android": "类似 Java/Kotlin 里混合数值类型运算自动向更大的类型（double）提升。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 响应式"}, {"no": 3, "type": "single", "body": "字段声明如下，1000 个线程各调用一次 inc()，最终 count 一定等于 1000 吗？", "code": "private volatile int count = 0;\npublic void inc() { count++; }", "options": [{"k": "A", "t": "一定等于 1000，volatile 保证原子性"}, {"k": "B", "t": "不一定，volatile 不保证复合操作的原子性"}, {"k": "C", "t": "一定等于 1000，count++ 本身是原子操作"}, {"k": "D", "t": "编译错误"}], "answer": ["B"], "explain": "volatile 只保证<b>可见性</b>和<b>禁止指令重排</b>，不保证原子性。<code>count++</code> 是「读-改-写」三步复合操作，多线程下会丢失更新，结果可能小于 1000。应改用 <code>AtomicInteger</code> 或 synchronized。", "android": "类似给字段加 <code>@Volatile</code> 不能替代 synchronized，计数器要用 AtomicInteger。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 事务 ACID"}, {"no": 4, "type": "single", "body": "以下排序代码的输出是？", "code": "List<String> list = new ArrayList<>(List.of(\"bb\", \"a\", \"ccc\", \"dd\"));\nlist.sort(Comparator.comparingInt(String::length)\n        .thenComparing(Comparator.naturalOrder()));\nSystem.out.println(list);", "options": [{"k": "A", "t": "[a, bb, dd, ccc]"}, {"k": "B", "t": "[a, dd, bb, ccc]"}, {"k": "C", "t": "[ccc, dd, bb, a]"}, {"k": "D", "t": "[a, bb, ccc, dd]"}], "answer": ["A"], "explain": "先按 <code>comparingInt(length)</code> 长度升序：a(1) < bb/dd(2) < ccc(3)；长度相同的 bb、dd 再用 <code>thenComparing(naturalOrder)</code> 按字典序 bb < dd。最终 <code>[a, bb, dd, ccc]</code>。", "android": "等价于 Kotlin 的 <code>sortedWith(compareBy({it.length}, {it}))</code>。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 执行结果"}, {"no": 5, "type": "single", "body": "以下代码执行结果是？", "code": "Map<String, Integer> map = new HashMap<>();\nint v = map.getOrDefault(\"x\", 0) + map.get(\"y\");\nSystem.out.println(v);", "options": [{"k": "A", "t": "输出 0"}, {"k": "B", "t": "输出 null"}, {"k": "C", "t": "抛 NullPointerException"}, {"k": "D", "t": "编译错误"}], "answer": ["C"], "explain": "<code>map.get(\"y\")</code> 键不存在返回 <code>null</code>，参与 int 算术运算时需<b>自动拆箱</b>，对 null 拆箱抛 NPE。<code>getOrDefault</code> 只保护了 \"x\"，没保护 \"y\"。", "android": "类似 Kotlin 可空 <code>Int?</code> 直接参与运算触发 NPE，需先判空或给默认值。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 数据结构选型"}, {"no": 6, "type": "single", "body": "以下事务方法抛出检查型异常 IOException，默认行为是？", "code": "@Transactional\npublic void save() throws IOException {\n    insertOrder();            // 已执行入库\n    throw new IOException();   // 检查型异常\n}", "options": [{"k": "A", "t": "事务回滚，订单不入库"}, {"k": "B", "t": "默认不回滚，订单已入库"}, {"k": "C", "t": "编译错误"}, {"k": "D", "t": "无论什么异常都回滚"}], "answer": ["B"], "explain": "<code>@Transactional</code> 默认只对 <b>RuntimeException 和 Error</b> 回滚，检查型异常（IOException）默认<b>不回滚</b>。需显式配置 <code>@Transactional(rollbackFor = Exception.class)</code>。", "android": "类似 checked exception 若不特意处理，之前的状态变更不会自动撤销。", "kaodian": "AI 后端能力 - 数据库与ORM层 - SQL 优化-EXPLAIN"}, {"no": 7, "type": "single", "body": "以下注入会得到哪个实现？", "code": "@Service @Primary\nclass AliPay implements Pay {}\n\n@Service(\"wx\")\nclass WxPay implements Pay {}\n\n@Autowired @Qualifier(\"wx\")\nprivate Pay pay;", "options": [{"k": "A", "t": "AliPay（因为有 @Primary）"}, {"k": "B", "t": "WxPay（@Qualifier 优先）"}, {"k": "C", "t": "抛 NoUniqueBeanDefinitionException"}, {"k": "D", "t": "启动报错，两个候选冲突"}], "answer": ["B"], "explain": "<code>@Qualifier</code> 显式指定 bean 名称，优先级<b>高于</b> <code>@Primary</code>，因此注入 WxPay。@Primary 仅在没有 @Qualifier 时作为默认首选。", "android": "类似 Hilt/Dagger 用 @Named/@Qualifier 精确指定实现，覆盖默认绑定。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 选择器优先级"}, {"no": 8, "type": "single", "body": "实体含 @Version 且配置了乐观锁插件。两个线程都读到 version=1 后各自 updateById，结果是？", "code": "@Version\nprivate Integer version;  // 数据库当前 version = 1\n// 线程A、线程B 都读到 version=1，随后各自 updateById(entity)", "options": [{"k": "A", "t": "两次都更新成功"}, {"k": "B", "t": "第一次成功(version→2)，第二次影响 0 行更新失败"}, {"k": "C", "t": "抛数据库死锁异常"}, {"k": "D", "t": "两次都失败"}], "answer": ["B"], "explain": "乐观锁 update 的 SQL 带 <code>where version = 1</code>：第一次成功并把 version 改成 2；第二次仍用 <code>where version = 1</code> 已匹配不到（现为 2），影响行数为 0，更新失败。业务需判断返回值并重试。", "android": "类似用字段版本号做并发控制，本质是 CAS——比较预期值再更新。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 事务与锁"}, {"no": 9, "type": "single", "body": "RR（可重复读）隔离级别下：事务A普通 select 得到某行，随后事务B更新该行并提交，事务A再次普通 select，读到的是？", "code": "-- 隔离级别 REPEATABLE READ\n-- 事务A: SELECT ... ;   (第一次读，建立快照)\n-- 事务B: UPDATE ... ; COMMIT;\n-- 事务A: SELECT ... ;   (再次普通读)", "options": [{"k": "A", "t": "读到 B 提交的新值（不可重复读）"}, {"k": "B", "t": "仍读到旧值（快照读，可重复读）"}, {"k": "C", "t": "查询报错"}, {"k": "D", "t": "读到 null"}], "answer": ["B"], "explain": "RR 下普通 SELECT 是<b>快照读（MVCC）</b>，事务首次快照建立后一直读同一版本，故可重复读，看不到 B 的提交。若用 <code>SELECT ... FOR UPDATE</code>（当前读）则会读到最新值。", "android": "类比一次性拿到数据快照，之后都读这份，不受他人修改影响。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 事务与锁"}, {"no": 10, "type": "single", "body": "关于 Redis 的两种持久化方式，正确的是？", "code": null, "options": [{"k": "A", "t": "RDB 记录每条写命令，AOF 生成快照"}, {"k": "B", "t": "RDB 快照恢复快、体积小，但可能丢失最后一次快照后的数据；AOF 记录写命令更安全，但文件大、恢复慢"}, {"k": "C", "t": "AOF 一定比 RDB 丢更多数据"}, {"k": "D", "t": "RDB 和 AOF 不能同时开启"}], "answer": ["B"], "explain": "RDB 定时生成内存快照，体积小恢复快，宕机会丢最后一次快照后的数据；AOF 追加写命令日志（appendfsync everysec 最多丢约 1 秒），更安全但文件大、恢复较慢。二者可<b>同时开启</b>（4.0+ 支持混合持久化）。", "android": "类似 App 数据备份——全量快照(RDB) vs 增量操作日志(AOF)。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 持久化"}, {"no": 11, "type": "single", "body": "Kafka 生产者要做到「不丢消息且不因重试产生重复」，正确的配置是？", "code": null, "options": [{"k": "A", "t": "acks=0"}, {"k": "B", "t": "acks=1 即可保证不丢"}, {"k": "C", "t": "acks=all + enable.idempotence=true（配合 min.insync.replicas>1）"}, {"k": "D", "t": "retries=0"}], "answer": ["C"], "explain": "<code>acks=all</code> 保证消息被所有 ISR 副本确认（不丢），配合 <code>min.insync.replicas>1</code> 提升可靠性；<code>enable.idempotence=true</code> 让生产者用 PID+序列号去重，避免重试导致的重复。acks=0/1 都可能丢消息。", "android": "类似埋点上报带幂等号 + 等服务端全部确认后才算成功。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息可靠性-Kafka"}, {"no": 12, "type": "single", "body": "JDK 8 中，类的元数据（方法区的实现）存放在哪里？", "code": null, "options": [{"k": "A", "t": "永久代 PermGen，位于堆内"}, {"k": "B", "t": "元空间 Metaspace，使用本地（堆外）内存"}, {"k": "C", "t": "虚拟机栈"}, {"k": "D", "t": "新生代 Eden 区"}], "answer": ["B"], "explain": "JDK 8 移除了永久代，用 <b>Metaspace（元空间）</b>替代来存类元数据，默认使用<b>本地内存</b>（不受堆大小限制，受 MaxMetaspaceSize 限制），避免了 PermGen 常见的 <code>OutOfMemoryError: PermGen space</code>。", "android": "类比运行时类信息从固定分区搬到系统内存，扩展更灵活。", "kaodian": "AI 后端能力 - 语言基础层 - JVM 内存模型"}, {"no": 13, "type": "single", "body": "以下 CompletableFuture 代码输出的类型/值是？", "code": "CompletableFuture<Integer> cf = CompletableFuture\n    .supplyAsync(() -> 1)\n    .thenCompose(x -> CompletableFuture.supplyAsync(() -> x + 1));\nSystem.out.println(cf.get());", "options": [{"k": "A", "t": "2"}, {"k": "B", "t": "一个 CompletableFuture<CompletableFuture<Integer>>"}, {"k": "C", "t": "1"}, {"k": "D", "t": "编译错误"}], "answer": ["A"], "explain": "<code>thenCompose</code> 用于<b>扁平化</b>嵌套的 CompletableFuture（类似 flatMap），返回 <code>CompletableFuture&lt;Integer&gt;</code>，<code>get()</code> 得到 2。若换成 thenApply，返回的会是 <code>CompletableFuture&lt;CompletableFuture&lt;Integer&gt;&gt;</code>，还得再解一层。", "android": "类似 RxJava 的 <code>flatMap</code>（展开内层流） vs <code>map</code>（仅变换值）。", "kaodian": "AI 后端能力 - 框架与容器层 - 异步与线程池"}, {"no": 14, "type": "single", "body": "以下 JS 代码的输出顺序是？", "code": "console.log('A');\nsetTimeout(() => console.log('B'), 0);\nPromise.resolve().then(() => console.log('C'));\nconsole.log('D');", "options": [{"k": "A", "t": "A B C D"}, {"k": "B", "t": "A D C B"}, {"k": "C", "t": "A D B C"}, {"k": "D", "t": "A B D C"}], "answer": ["B"], "explain": "同步代码先执行 A、D；一轮同步结束后先清空<b>微任务队列</b>（Promise.then → C），再执行<b>宏任务</b>（setTimeout → B）。故顺序为 <code>A D C B</code>。", "android": "类似 Handler——微任务像插到队头优先处理，setTimeout 像普通 post 排到下一轮。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 事件循环"}, {"no": 15, "type": "single", "body": "以下 JS 代码的输出是？", "code": "console.log(['1', '2', '3'].map(parseInt));", "options": [{"k": "A", "t": "[1, 2, 3]"}, {"k": "B", "t": "[1, NaN, NaN]"}, {"k": "C", "t": "[NaN, NaN, NaN]"}, {"k": "D", "t": "[1, 2, NaN]"}], "answer": ["B"], "explain": "map 回调接收 <code>(value, index)</code>，parseInt 第二个参数是进制(radix)。<code>parseInt('1',0)</code> 按 10 进制 = 1；<code>parseInt('2',1)</code> 进制 1 非法 = NaN；<code>parseInt('3',2)</code> 二进制里 '3' 非法 = NaN。结果 <code>[1, NaN, NaN]</code>。", "android": "类似把带索引的高阶函数误传给只想接收单参的方法，多出的参数产生副作用。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 执行结果"}, {"no": 16, "type": "single", "body": "关于 Vue 的 v-if 与 v-show，正确的是？", "code": null, "options": [{"k": "A", "t": "v-if 用 display:none 隐藏，元素始终在 DOM 中"}, {"k": "B", "t": "v-show 通过销毁/重建 DOM 来切换"}, {"k": "C", "t": "v-if 是真正的条件渲染（false 时不渲染/销毁元素），v-show 只切换 display:none（元素保留）"}, {"k": "D", "t": "两者完全等价，可随意替换"}], "answer": ["C"], "explain": "<code>v-if</code> 是真正的条件渲染，false 时不渲染/销毁 DOM，切换开销大，适合不频繁切换；<code>v-show</code> 只是 CSS <code>display</code> 切换，元素始终存在，适合频繁切换。", "android": "v-if 类似 addView/removeView，v-show 类似 View.setVisibility(GONE)。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 v-if 与 v-for"}, {"no": 17, "type": "single", "body": "CSS 中 flex: 1 等价于以下哪组写法？", "code": ".item { flex: 1; }", "options": [{"k": "A", "t": "flex-grow:1; flex-shrink:0; flex-basis:auto"}, {"k": "B", "t": "flex-grow:1; flex-shrink:1; flex-basis:0%"}, {"k": "C", "t": "flex-grow:0; flex-shrink:1; flex-basis:auto"}, {"k": "D", "t": "flex-grow:1; flex-shrink:1; flex-basis:auto"}], "answer": ["B"], "explain": "<code>flex:1</code> 是简写，等于 <code>flex-grow:1; flex-shrink:1; flex-basis:0%</code>。即可放大、可缩小、基准为 0，多个 flex:1 的子项会<b>等分</b>父容器空间。注意 basis 是 0% 而非 auto。", "android": "类似 LinearLayout 里给多个子 View 设 <code>layout_weight=1</code> 等分空间。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS Flex 布局"}, {"no": 18, "type": "single", "body": "下列关于 HTTP 方法「幂等性」（多次请求与一次效果相同）的说法，正确的是？", "code": null, "options": [{"k": "A", "t": "POST 是幂等的"}, {"k": "B", "t": "GET、PUT、DELETE 幂等，POST 不幂等"}, {"k": "C", "t": "所有方法都幂等"}, {"k": "D", "t": "只有 GET 幂等"}], "answer": ["B"], "explain": "GET（只读）、PUT（整体覆盖同一资源）、DELETE（删除同一资源）都是幂等的；POST（新建资源）每次调用都可能产生新资源，<b>不幂等</b>。", "android": "类似网络重试——幂等接口可安全重试，POST 重试需加幂等号防重复下单。", "kaodian": "AI 后端能力 - 框架与容器层 - 接口幂等"}, {"no": 19, "type": "single", "body": "以下 JS 代码的输出是？", "code": "const obj = Object.freeze({ a: 1, b: { c: 2 } });\nobj.a = 10;\nobj.b.c = 20;\nconsole.log(obj.a, obj.b.c);", "options": [{"k": "A", "t": "10 20"}, {"k": "B", "t": "1 2"}, {"k": "C", "t": "1 20"}, {"k": "D", "t": "10 2"}], "answer": ["C"], "explain": "<code>Object.freeze</code> 是<b>浅冻结</b>，只冻结第一层属性。<code>obj.a=10</code> 无效（仍为 1）；<code>obj.b</code> 引用不可变，但其指向的对象内部仍可改，<code>obj.b.c=20</code> 生效。深冻结需递归处理。", "android": "类似 immutable 只做浅层保护，嵌套对象仍然可变。", "kaodian": "AI 后端能力 - 语言基础层 - Java 基础"}, {"no": 20, "type": "single", "body": "Vue3 中要把祖先组件的数据传给深层（跨多级）后代组件，最合适的内置方案是？", "code": null, "options": [{"k": "A", "t": "逐层 props 透传"}, {"k": "B", "t": "provide / inject"}, {"k": "C", "t": "只能引入 Vuex/Pinia"}, {"k": "D", "t": "用全局事件总线 $emit"}], "answer": ["B"], "explain": "<code>provide/inject</code> 是 Vue 内置的依赖注入：祖先 provide 数据，任意深度的后代 inject 获取，避免逐层 props 透传（prop drilling）。要保持响应式，provide 一个 ref/reactive 即可。", "android": "类似依赖注入（Hilt）把对象注入到深层组件，无需层层手动传递。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 响应式"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "下列哪些情况会导致 Spring 的 @Transactional 失效？（多选、少选、错选均不得分）", "code": "@Service\npublic class OrderService {\n    public void outer() { this.inner(); }      // 自调用\n    @Transactional private void inner() { ... } // 非 public\n}", "options": [{"k": "A", "t": "被 @Transactional 标注的方法不是 public（如 private）"}, {"k": "B", "t": "同类内部方法自调用（this 调用，未走代理对象）"}, {"k": "C", "t": "方法内用 try-catch 吞掉了异常，未继续抛出"}, {"k": "D", "t": "抛出的是检查型异常且未配置 rollbackFor"}], "answer": ["A", "B", "C", "D"], "explain": "@Transactional 基于 AOP 代理：①非 public 方法代理不拦截；②自调用走的是原始对象而非代理对象，切面不生效；③异常被吞没就触发不了回滚；④默认只回滚运行时异常，检查异常需 rollbackFor。四项都会导致失效。", "android": "类似动态代理/切面只对「外部经代理的调用」生效，内部直调会绕过增强。", "kaodian": "AI 后端能力 - 框架与容器层 - 事务失效场景"}, {"no": 22, "type": "multi", "body": "关于 JVM 垃圾回收，下列说法正确的有？（多选、少选、错选均不得分）", "code": null, "options": [{"k": "A", "t": "采用可达性分析，以 GC Roots 为起点，不可达对象才可被回收"}, {"k": "B", "t": "新生代常用复制算法（Eden + 两个 Survivor 区）"}, {"k": "C", "t": "Full GC 通常比 Minor GC 慢，应尽量减少其发生"}, {"k": "D", "t": "G1 收集器面向大堆，可预测停顿时间，按 Region 回收"}], "answer": ["A", "B", "C", "D"], "explain": "①现代 JVM 用可达性分析而非引用计数（能处理循环引用）；②新生代对象朝生夕死，复制算法高效；③Full GC 涉及老年代/整堆，STW 时间长；④G1 把堆划分为 Region，优先回收垃圾多的区域，可设停顿目标。全部正确。", "android": "类似 ART 的 GC——分代、并发回收，尽量减少卡顿（STW）。", "kaodian": "AI 后端能力 - 语言基础层 - JVM 内存模型"}, {"no": 23, "type": "multi", "body": "关于分布式全局唯一 ID 方案，下列说法正确的有？（多选、少选、错选均不得分）", "code": null, "options": [{"k": "A", "t": "UUID 全局唯一但无序，作 MySQL 主键会导致页分裂、索引效率下降"}, {"k": "B", "t": "雪花算法(Snowflake)生成 64 位趋势递增 ID，含时间戳+机器ID+序列号"}, {"k": "C", "t": "雪花算法依赖系统时钟，时钟回拨可能导致 ID 重复"}, {"k": "D", "t": "数据库号段模式（一次取一段 ID 缓存到内存）可减少 DB 访问"}], "answer": ["A", "B", "C", "D"], "explain": "①UUID 无序，作聚簇索引主键会频繁页分裂；②Snowflake 结构为「时间戳+workerId+序列号」，趋势递增；③时钟回拨是 Snowflake 的经典坑，需特殊处理；④号段模式一次取一批，减少 DB 压力。全部正确。", "android": "类似给离线数据生成唯一 ID——UUID 简单但无序，自增号段/雪花更利于同步与排序。", "kaodian": "AI 后端能力 - 框架与容器层 - 全局唯一 ID"}, {"no": 24, "type": "multi", "body": "关于 Redis 高可用与扩展方案，下列说法正确的有？（多选、少选、错选均不得分）", "code": null, "options": [{"k": "A", "t": "主从复制实现数据冗余与读写分离，但主节点故障需人工切换"}, {"k": "B", "t": "哨兵(Sentinel)可监控主节点，在故障时自动选主并完成故障转移"}, {"k": "C", "t": "Redis Cluster 通过 16384 个哈希槽分片，支持横向扩展"}, {"k": "D", "t": "单机 Redis 也能保证宕机后不丢任何数据"}], "answer": ["A", "B", "C"], "explain": "①主从提供冗余，但默认不会自动切换；②哨兵负责监控 + 自动故障转移；③Cluster 用 16384 个槽分片，数据分布到多个主节点实现水平扩展。D 错：单机宕机会丢失内存中未持久化的数据，即使开 AOF 也可能丢最多约 1 秒。", "android": "类比多副本 + 监控自动切换，保障服务不中断。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 持久化"}, {"no": 25, "type": "multi", "body": "关于 JavaScript 深拷贝，下列说法正确的有？（多选、少选、错选均不得分）", "code": null, "options": [{"k": "A", "t": "JSON.parse(JSON.stringify(obj)) 简单，但会丢失函数、undefined、Symbol，且无法处理循环引用"}, {"k": "B", "t": "{...obj} 与 Object.assign 都是浅拷贝"}, {"k": "C", "t": "structuredClone() 可深拷贝并支持循环引用（现代浏览器）"}, {"k": "D", "t": "深拷贝后修改副本的嵌套属性不会影响原对象"}], "answer": ["A", "B", "C", "D"], "explain": "①JSON 方式会丢失不可序列化的值，遇循环引用会报错；②扩展运算符/assign 只拷贝第一层；③structuredClone 是原生深拷贝，支持循环引用；④深拷贝彻底断开引用，副本与原对象互不影响。全部正确。", "android": "类似对象克隆——浅拷贝共享内部引用，深拷贝递归复制所有层级。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 序列化"}, {"no": 26, "type": "multi", "body": "关于 JUnit 5 单元测试，下列说法正确的有？（多选、少选、错选均不得分）", "code": "@ParameterizedTest\n@ValueSource(ints = {2, 4, 6})\nvoid isEven(int n) { assertTrue(n % 2 == 0); }", "options": [{"k": "A", "t": "@BeforeEach 在每个测试方法执行前运行，用于初始化"}, {"k": "B", "t": "@ParameterizedTest 配合 @ValueSource 可用多组数据驱动同一测试"}, {"k": "C", "t": "assertThrows 用于断言代码抛出了指定异常"}, {"k": "D", "t": "@DisplayName 可为测试自定义可读名称"}], "answer": ["A", "B", "C", "D"], "ex -bottom:20px、下元素 margin-top:30px，它们之间的实际间距是 50px。", "code": ".top    { margin-bottom: 20px; }\n.bottom { margin-top: 30px; }", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "垂直方向会发生<b>外边距合并（margin collapse）</b>，取两者中的<b>较大值</b>而非相加，实际间距是 30px（不是 50px）。合并只发生在垂直方向的普通流块级元素之间。", "android": "这是 CSS 特有的间距塌陷规则，与 Android 直接相加不同。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 盒模型"}, {"no": 32, "type": "judge", "body": "只要代码覆盖率达到 100%，就能保证程序没有 bug。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "100% 覆盖率只说明所有代码行/分支被执行过，并不代表所有输入组合、边界情况和业务逻辑都正确。高覆盖率能降低风险，但不等于无缺陷。", "android": "类似把每个页面都点开过，不代表每个交互逻辑都对。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 单元测试原则"}, {"no": 33, "type": "judge", "body": "一个典型的缺陷生命周期是：新建(New) → 指派(Assigned) → 修复(Fixed) → 验证(Verified) → 关闭(Closed)，其中验证不通过可以被重新打开(Reopen)。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "这是标准的缺陷流转流程：测试验证通过后才关闭；若未修复好，缺陷会被 <b>Reopen</b> 回到开发。它是缺陷管理工具（JIRA/禅道 等）常见的状态机。", "android": "类似 bug 在协作平台按状态流转，回归验证不过会被打回。", "kaodian": "AI 后端能力 - 框架与容器层 - Bean 生命周期"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+q.no+'" data-no="'+q.no+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+q.no+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q.no==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=document.querySelector('.card[data-no="'+btn.dataset.no+'"]'); gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  ans.querySelector('.ans').textContent='答案：'+(q.type==='fill'? q.answerText : q.answer.join('、'));
  ans.classList.add('show');
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  if(!isAnswered(card)){ if(!confirm('本题还没作答，将按答错处理并展示答案。')) return; }
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
