<script type="application/json" id="quizData">{"id": "vol26", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按「自如大学 7月认证考（均分 11/11/11）+ 全栈认证大纲 + AI时代全栈工程实战能力认证大纲」出题：后端≈33% / 前端≈33% / 测试≈33%。每题给真实可运行代码/配置/日志片段，考\"读代码判行为/找坑/补全\"，对齐真卷出题思路。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "下面消费者组首次拉取未 ACK 消息后，再次用 '>' 读取返回什么？", "code": "redisTemplate.opsForStream().createGroup('order:stream', 'g1');\n// 消费者 c1 首次拉取新消息（'>' 表示尚未投递过的新消息）\nList<MapRecord<String,Object,Object>> r1 =\n  redisTemplate.opsForStream().read(Consumer.from('g1','c1'),\n    StreamReadOptions.empty(), StreamOffset.create('order:stream', ReadOffset.latest()));\n// c1 未 ACK，再次用 '>' 拉取\nList<MapRecord<String,Object,Object>> r2 =\n  redisTemplate.opsForStream().read(Consumer.from('g1','c1'),\n    StreamReadOptions.empty(), StreamOffset.create('order:stream', ReadOffset.latest()));", "options": [{"k": "A", "t": "第二次返回空（'>' 只给新消息，历史未 ACK 需用具体 ID 才能重投）"}, {"k": "B", "t": "抛异常（组已存在）"}, {"k": "C", "t": "第二次返回全部历史消息"}, {"k": "D", "t": "第二次仍返回 r1 那批消息（未 ACK 会被再次投递）"}], "answer": ["A"], "explain": "Stream 消费组中，读取偏移 '>' 只取该消费者尚未投递过的新消息；已投递但未 ACK 的消息不会通过 '>' 再次返回，需用具体 ID（如 '0'）才能重投。所以未 ACK 时再次用 '>' 读取返回空。", "kaodian": "AI后端能力-高并发与中间件层-RedisStream消费组"}, {"no": 2, "type": "single", "body": "下面窗口函数，第 2 行（id=2）的 prev_name 列值是多少？", "code": "SELECT id, name,\n       LAG(name, 1) OVER (ORDER BY id) AS prev_name\nFROM user;\n-- 数据：id=1 name='a'; id=2 name='b'; id=3 name='c'", "options": [{"k": "A", "t": "'c'"}, {"k": "B", "t": "'a'（取按 id 排序的前一行 name）"}, {"k": "C", "t": "'b'"}, {"k": "D", "t": "NULL（第一行无前一行，但第二行前一行是 id=1）"}], "answer": ["B"], "explain": "LAG(name,1) OVER (ORDER BY id) 取按 id 升序排序的前一行 name；id=2 的前一行是 id=1 → 'a'。只有第一行（无前一行）才为 NULL。", "kaodian": "AI后端能力-数据存储与ORM层-MySQL窗口函数LAG"}, {"no": 3, "type": "single", "body": "下面回调在 Spring 容器启动的哪个阶段执行？", "code": "@Component\npublic class Init implements SmartInitializingSingleton {\n  public void afterSingletonsInstantiated() {\n    System.out.println('all singletons ready');\n  }\n}", "options": [{"k": "A", "t": "每次 HTTP 请求到来前"}, {"k": "B", "t": "每个 Bean 实例化之前"}, {"k": "C", "t": "所有非懒加载单例 Bean 创建完成后、Context 刷新完成前"}, {"k": "D", "t": "容器完全关闭时"}], "answer": ["C"], "explain": "SmartInitializingSingleton.afterSingletonsInstantiated 在所有非懒加载单例初始化完毕后、refresh 结束前回调，常用于依赖全部 Bean 都已就绪的初始化（如注册监听、预加载缓存）。", "kaodian": "AI后端能力-应用框架层-SmartInitializingSingleton回调"}, {"no": 4, "type": "single", "body": "下面队列配置下，消息为何在 5 秒后被路由到死信队列？", "code": "Map<String,Object> args = new HashMap<>();\nargs.put('x-message-ttl', 5000);          // 队列级消息 TTL\nargs.put('x-dead-letter-exchange', 'dlx');\nchannel.queueDeclare('order', true, false, false, args);\n// 消费者正常，但单条业务处理耗时 30s", "options": [{"k": "A", "t": "消费者处理慢导致消息超时进死信"}, {"k": "B", "t": "交换机绑定错误"}, {"k": "C", "t": "通道被关闭"}, {"k": "D", "t": "队列级 TTL 让未消费消息到点进死信，与消费者是否在处理无关（配置缺陷：误用消息过期代替业务超时）"}], "answer": ["D"], "explain": "x-message-ttl 是队列级消息过期时间；消息在队列中存活超过 5s 即过期，被投到 x-dead-letter-exchange（dlx）对应的死信队列，不管消费者是否正在处理。把“业务处理超时”误用队列 TTL 是典型配置缺陷，应区分业务超时与消息过期（如用消费端超时+重试）。", "kaodian": "AI后端能力-高并发与中间件层-RabbitMQ队列TTL与死信"}, {"no": 5, "type": "single", "body": "热点 key 失效瞬间大量并发击穿到 DB，正确做法是？", "code": "public User get(Long id) {\n  User u = redis.get('u:' + id);\n  if (u == null) {\n    __BLANK__;                 // 防击穿\n    u = db.load(id);\n    redis.set('u:' + id, u, 30, SECONDS);\n  }\n  return u;\n}", "options": [{"k": "A", "t": "加互斥锁（synchronized / Redis SET NX / 分布式锁），只放一个线程回源，其余等待复用结果"}, {"k": "B", "t": "每个线程都直接查 DB 再写缓存"}, {"k": "C", "t": "直接返回 null"}, {"k": "D", "t": "把 key 过期时间设为 -1 永不丢失"}], "answer": ["A"], "explain": "缓存击穿指热点 key 失效瞬间高并发压到 DB；正确做法是用互斥锁保证仅一个线程回源，其余线程等待并重用缓存结果。B 把压力全给 DB；D 治标不治本且内存不回收。", "kaodian": "AI后端能力-高并发与中间件层-缓存击穿双重检查"}, {"no": 6, "type": "single", "body": "下面要把用户邮箱更新为 NULL，缺哪一行？", "code": "LambdaUpdateWrapper<User> uw = Wrappers.lambdaUpdate();\nuw.eq(User::getId, 1L)\n  __BLANK__;            // 置 NULL\nuserMapper.update(null, uw);", "options": [{"k": "A", "t": ".isNull(User::getEmail)"}, {"k": "B", "t": ".set(User::getEmail, null)"}, {"k": "C", "t": ".eq(User::getEmail, null)"}, {"k": "D", "t": ".setSql('email is null')"}], "answer": ["B"], "explain": "LambdaUpdateWrapper 用 .set(字段, null) 显式把列更新为 NULL；若用实体对象 update()，MP 默认忽略 null 字段（FieldStrategy）不会写 NULL。C 是条件不是赋值，A 是条件判空，D 的 SQL 片段写错。", "kaodian": "AI后端能力-数据存储与ORM层-MP更新置NULL"}, {"no": 7, "type": "single", "body": "主题 6 个分区，启动 10 个消费者实例（同组），实际并行消费消息的分区数是？", "code": "// topic: partitions = 6\n// consumer group: 10 consumers\nprops.put('group.id', 'g1');", "options": [{"k": "A", "t": "60"}, {"k": "B", "t": "10"}, {"k": "C", "t": "6（分区数即并行上限，多余消费者分配不到分区而空闲）"}, {"k": "D", "t": "16"}], "answer": ["C"], "explain": "消费组内一个分区同一时刻只被一个消费者消费；分区数 6 < 消费者 10，故最多 6 个消费者各自消费 1 个分区并行工作，其余 4 个空闲（Rebalance 分配不到分区）。并行度上限 = 分区数。", "kaodian": "AI后端能力-高并发与中间件层-Kafka分区并行度计算"}, {"no": 8, "type": "single", "body": "点击后 total 会重新计算吗？", "code": "const base = ref(1);\nlet extra = 10;            // 普通变量，非响应式\nconst total = computed(() => base.value + extra);\nfunction onClick(){ extra = 20; }  // 只改 extra", "options": [{"k": "A", "t": "抛异常"}, {"k": "B", "t": "每次访问都重新计算"}, {"k": "C", "t": "会重新计算（extra 变化触发）"}, {"k": "D", "t": "不会（extra 非响应式，computed 只追踪 base）"}], "answer": ["D"], "explain": "computed 只收集其执行期间访问的响应式依赖（base.value）；extra 是普通变量，修改不触发依赖，total 保持不变。改 base.value 才会重算。", "kaodian": "AI前端能力-前端基础与渲染引擎-Vue3computed依赖追踪"}, {"no": 9, "type": "single", "body": "容器 400px，子项 flex-basis:120px 且显式 width:200px，最终主轴尺寸？", "code": ".box{display:flex; width:400px;}\n.item{flex:0 1 120px; width:200px;}", "options": [{"k": "A", "t": "120px（flex-basis 优先级高于 width）"}, {"k": "B", "t": "400px"}, {"k": "C", "t": "由内容决定"}, {"k": "D", "t": "200px（width 优先）"}], "answer": ["A"], "explain": "flex 布局中 flex-basis 优先级高于 width（主轴为水平时），basis=120 决定主轴初始尺寸，width 被忽略（除非 basis=auto 才回落到 width）。", "kaodian": "AI前端能力-前端基础与渲染引擎-Flexbasis与width优先级"}, {"no": 10, "type": "single", "body": "下面两个响应拦截器，执行顺序是？", "code": "axios.interceptors.response.use(r => { console.log('A'); return r; });\naxios.interceptors.response.use(r => { console.log('B'); return r; });\n// 发起一次请求", "options": [{"k": "A", "t": "A 然后 B（按注册顺序）"}, {"k": "B", "t": "B 然后 A（响应拦截器逆序执行）"}, {"k": "C", "t": "同时执行"}, {"k": "D", "t": "只执行最后注册的"}], "answer": ["B"], "explain": "响应拦截器与请求拦截器相反：请求正序、响应逆序。后注册的响应拦截器先执行，故 B 先打印，再 A。这是 Axios 洋葱模型的体现。", "kaodian": "AI前端能力-网络与BFF架构-Axios响应拦截器顺序"}, {"no": 11, "type": "single", "body": "下面代码输出顺序是？", "code": "console.log('1');\nPromise.resolve().then(() => console.log('2'));\nconsole.log('3');", "options": [{"k": "A", "t": "3 1 2"}, {"k": "B", "t": "1 2 3"}, {"k": "C", "t": "1 3 2"}, {"k": "D", "t": "2 1 3"}], "answer": ["C"], "explain": "同步代码先打印 1、3；.then 回调进入微任务队列，同步栈清空后执行，打印 2。故顺序为 1 3 2。", "kaodian": "AI前端能力-语言与运行时-Promise微任务调度"}, {"no": 12, "type": "single", "body": "下面提交校验为何可能放过‘全空格’用户名？", "code": "function valid(name){\n  if (name.length === 0) return '必填';   // 仅判长度\n  return '';\n}\n// 用户输入 '   '（多个空格）", "options": [{"k": "A", "t": "正则写错"}, {"k": "B", "t": "name 不是字符串类型"}, {"k": "C", "t": "必填判断多余"}, {"k": "D", "t": "没先 trim 就判长度（全空格 length>0 直接通过）"}], "answer": ["D"], "explain": "'   ' 的 length 为 3 > 0，仅判 length 会放过；应先 name.trim().length === 0 再报必填。属表单校验典型缺陷（空格绕过）。", "kaodian": "AI前端能力-前端基础与渲染引擎-表单校验逻辑缺陷"}, {"no": 13, "type": "single", "body": "前端 a.com 调用 b.com/api 跨域，正确做法是？", "code": "// 前端直接请求\naxios.get('https://b.com/api');", "options": [{"k": "A", "t": "后端 b.com 在响应加 CORS 头 Access-Control-Allow-Origin=a.com"}, {"k": "B", "t": "前端设 document.domain 解决"}, {"k": "C", "t": "让浏览器关闭同源策略"}, {"k": "D", "t": "把请求改成 file:// 协议"}], "answer": ["A"], "explain": "跨域由浏览器执行拦截，服务端须在响应加 Access-Control-Allow-Origin 等头放行；或用同源代理（Vite proxy / Nginx）。B 仅限同后缀子域，C/D 无效。", "kaodian": "AI前端能力-网络与BFF架构-CORS服务端放行"}, {"no": 14, "type": "single", "body": "下面在模板中直接显示 count，缺哪一步让它响应式？", "code": "import { ref } from 'vue';\nconst count = 1;          // 普通值\n// 模板: {{ count }}", "options": [{"k": "A", "t": "用 v-model 双向绑定"}, {"k": "B", "t": "用 ref(1) 包裹，模板中自动解包显示"}, {"k": "C", "t": "用 reactive 包裹基本类型"}, {"k": "D", "t": "用 Object.freeze 冻结"}], "answer": ["B"], "explain": "基本类型需用 ref() 转为响应式对象；在模板中 ref 自动解包显示 .value 的值。reactive 不能包裹基本类型（需对象）。", "kaodian": "AI前端能力-前端基础与渲染引擎-Vue3模板ref解包"}, {"no": 15, "type": "single", "body": "下面测试在 sleep 6s 时结果是？", "code": "@Test\n@Timeout(value = 3, unit = TimeUnit.SECONDS)\nvoid slow() throws Exception { Thread.sleep(6000); }", "options": [{"k": "A", "t": "编译错误"}, {"k": "B", "t": "通过"}, {"k": "C", "t": "超时失败（抛出 TimeoutException）"}, {"k": "D", "t": "跳过"}], "answer": ["C"], "explain": "@Timeout 限制测试执行 3s，sleep 6s 触发超时，测试以失败结束。用于防止单个用例卡死拖垮整套。", "kaodian": "AI质量保障-自动化测试-JUnit5超时"}, {"no": 16, "type": "single", "body": "下面点击操作，Playwright 在按钮 2 秒后才渲染出来时会？", "code": "await page.getByRole('button', { name: '提交' }).click();\n// 按钮 2s 后才渲染出来", "options": [{"k": "A", "t": "直接跳过该步"}, {"k": "B", "t": "无限期等待"}, {"k": "C", "t": "立即抛错（元素不存在）"}, {"k": "D", "t": "在默认 action 超时（30s）内自动轮询等待至可点击再点"}], "answer": ["D"], "explain": "Playwright 的 action 默认自动等待元素出现并满足可点击等条件，在超时内轮询；按钮 2s 后出现即被点击，无需手写 sleep。", "kaodian": "AI质量保障-自动化测试-Playwright自动等待"}, {"no": 17, "type": "single", "body": "下面应用日志，AI 助手定位的根因是？", "code": "ERROR c.z.OrderSvc - NullPointerException at OrderSvc.buildNo(OrderSvc.java:88)\n  caused by: shopId is null from request param\nWARN  c.z.OrderSvc - fallback used default shop", "options": [{"k": "A", "t": "请求参数 shopId 为 null 导致空指针（入参校验缺失）"}, {"k": "B", "t": "数据库连不上"}, {"k": "C", "t": "线程池已满"}, {"k": "D", "t": "缓存击穿"}], "answer": ["A"], "explain": "堆栈显示 shopId 来自请求参数为 null，buildNo 解引用抛 NPE；AI 辅助缺陷分析应定位到入参校验缺失，而非数据库或线程池。", "kaodian": "AI质量保障-AI辅助测试-AI日志根因分析"}, {"no": 18, "type": "single", "body": "下面 CI 脚本为何类型错误没拦住合并？", "code": "\"test:types\": \"tsc --noEmit || true\"\n// 或 npm run test:types", "options": [{"k": "A", "t": "文件未保存"}, {"k": "B", "t": "tsc 报错被 '|| true' 吞掉退出码，门禁形同虚设"}, {"k": "C", "t": "tsc 不支持 --noEmit"}, {"k": "D", "t": "Node 版本过低"}], "answer": ["B"], "explain": "'|| true' 让命令无论 tsc 是否报错都返回 0，CI 视为通过；类型门禁需 tsc --noEmit 直接作为失败步骤（非零退出），才能真正拦住类型错误。", "kaodian": "AI质量保障-CI/CD与质量门禁-类型门禁误用"}, {"no": 19, "type": "single", "body": "下面参数化测试缺哪一行导致只跑一次？", "code": "@ParameterizedTest\n__BLANK__\nvoid test(int n){ assertTrue(n > 0); }\n// 期望用 {1,2,3} 各跑一遍", "options": [{"k": "A", "t": "@RepeatedTest(3)"}, {"k": "B", "t": "@Tag('p')"}, {"k": "C", "t": "@ValueSource(ints = {1, 2, 3})"}, {"k": "D", "t": "@Test"}], "answer": ["C"], "explain": "@ParameterizedTest 需配合 @ValueSource / @MethodSource 等参数源才会按参数多次执行；缺 @ValueSource 只按单参数跑一次（或报错）。@Test 与 @ParameterizedTest 互斥。", "kaodian": "AI质量保障-自动化测试-JUnit5参数化补全"}, {"no": 20, "type": "single", "body": "本版本共发现缺陷 40 个，其中上线后被用户发现的逃逸缺陷 4 个，缺陷逃逸率是？", "code": "// 总缺陷 = 40，逃逸缺陷 = 4", "options": [{"k": "A", "t": "4%"}, {"k": "B", "t": "40%"}, {"k": "C", "t": "90%"}, {"k": "D", "t": "10%"}], "answer": ["D"], "explain": "缺陷逃逸率 = 逃逸缺陷 / 总缺陷 = 4 / 40 = 10%，衡量漏到生产的缺陷比例，越低越好。", "kaodian": "AI质量保障-质量工程-缺陷逃逸率度量"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于 @RestControllerAdvice 统一异常处理，下列论断正确的是（多选）？", "code": "@RestControllerAdvice\npublic class GlobalEx {\n  @ExceptionHandler(NullPointerException.class)\n  public R handleNPE(NullPointerException e){ return R.fail('npe'); }\n  @ExceptionHandler(Exception.class)\n  public R handleAll(Exception e){ return R.fail('all'); }\n}", "options": [{"k": "A", "t": "局部 Controller 内的 @ExceptionHandler 优先级高于全局 @RestControllerAdvice"}, {"k": "B", "t": "多个 @ExceptionHandler 并存时，按异常类型最具体者匹配"}, {"k": "C", "t": "@RestControllerAdvice 返回值自动 JSON 序列化（含 @ResponseBody 语义）"}, {"k": "D", "t": "异常一旦被业务 try-catch 吞掉，就不再进入 @ExceptionHandler"}], "answer": ["B", "C"], "explain": "1. A 正确：局部 Controller 内的 handler 优先于全局增强。2. B 正确：多个 handler 按最具体异常类型匹配（NPE 命中 NPE 而非 Exception）。3. C 正确：@RestControllerAdvice = @ControllerAdvice + @ResponseBody，返回自动序列化 JSON。4. D 正确：被 try-catch 吞掉的异常不会抛到框架，自然不进 handler（描述成立）。", "kaodian": "AI后端能力-应用框架层-统一异常处理"}, {"no": 2, "type": "multi", "body": "关于下面 EXPLAIN 结果，下列论断正确的是（多选）？", "code": "EXPLAIN SELECT * FROM order o\nWHERE o.user_id = 100 AND o.status = 1\nORDER BY o.create_time DESC LIMIT 10;\n-- type=ref, key=user_id_idx, rows=320\n-- Extra=Using index condition; Using filesort", "options": [{"k": "A", "t": "type=ref 表示使用了非唯一索引等值匹配，优于全表 ALL"}, {"k": "B", "t": "key=user_id_idx 说明优化器实际选用了 user_id 上的索引"}, {"k": "C", "t": "Extra 出现 Using filesort 表示排序利用了索引有序性，无需额外排序"}, {"k": "D", "t": "rows=320 是优化器估算的扫描行数（非精确值）"}], "answer": ["A", "B", "D"], "explain": "1. A 正确：ref 为非唯一索引等值，比全表扫描 ALL 好。2. B 正确：key 显示实际使用的索引。3. C 错误：Using filesort 表示无法利用索引顺序，需在内存/磁盘额外排序，是性能信号。4. D 正确：rows 是估算值。", "kaodian": "AI后端能力-数据存储与ORM层-EXPLAIN执行计划解读"}, {"no": 3, "type": "multi", "body": "关于 Kafka 位移提交语义，下列论断正确的是（多选）？", "code": "props.put('enable.auto.commit', 'true');\nprops.put('auto.commit.interval.ms', '5000');\n// 消费者 poll 后处理，未手动 commit", "options": [{"k": "A", "t": "自动提交下，消息被 poll 到即按间隔提交位移，处理前崩溃会丢失/重复"}, {"k": "B", "t": "自动提交保证‘处理成功才提交’，不会重复消费"}, {"k": "C", "t": "手动 commitSync 在处理完成后提交，最稳，可避免处理中崩溃导致的重复"}, {"k": "D", "t": "处理抛异常未提交，Rebalance 后从已提交位移重投，可能重复消费"}], "answer": ["A", "C", "D"], "explain": "1. A 正确：自动提交在 poll 后即按间隔提交位移，处理前崩溃会丢/重。2. B 错误：自动提交不保证处理成功，崩溃会重复/丢失。3. C 正确：手动 commitSync 在处理后提交最稳。4. D 正确：处理异常未提交，Rebalance 后从已提交位移重投，可能重复。", "kaodian": "AI后端能力-高并发与中间件层-Kafka位移提交语义"}, {"no": 4, "type": "multi", "body": "关于 Vue3 组件通信，下列论断正确的是（多选）？", "code": "<Child :title='t' @ok='onOk' v-model='name' />\n// 子：defineProps(['title']); defineEmits(['ok']);\n// 父用 v-model 等价于 :modelValue + @update:modelValue", "options": [{"k": "A", "t": "父传子用 props（title），子不应直接修改 props（单向数据流）"}, {"k": "B", "t": "子向父通信用 emit 触发自定义事件（ok）"}, {"k": "C", "t": "v-model 是 :modelValue + @update:modelValue 的语法糖"}, {"k": "D", "t": "子组件可直接修改父传入的 prop 对象属性并自动同步回父"}], "answer": ["A", "B", "C"], "explain": "1. A 正确：props 只读，子不应直接改。2. B 正确：子通过 emit 通知父。3. C 正确：v-model 是 modelValue + update:modelValue 语法糖。4. D 错误：直接改 prop 违反单向数据流（对象属性虽能改但不推荐，且非‘同步’机制）。", "kaodian": "AI前端能力-前端基础与渲染引擎-Vue3组件通信"}, {"no": 5, "type": "multi", "body": "关于浏览器渲染与重排重绘，下列论断正确的是（多选）？", "code": "// 修改 el.style.width 触发；添加 el.style.transform 触发\nel.style.width = '200px';\nel.style.transform = 'translateX(10px)';", "options": [{"k": "A", "t": "仅修改 color 就会引发重排（reflow）"}, {"k": "B", "t": "transform / opacity 变更走合成层，不触发重排与重绘"}, {"k": "C", "t": "读取 offsetHeight 等布局属性会强制同步布局（flush）引发 reflow"}, {"k": "D", "t": "频繁改样式应批量或使用 requestAnimationFrame 减少抖动"}], "answer": ["B", "C", "D"], "explain": "1. A 错误：color 改变只触发重绘（repaint），不重排。2. B 正确：transform/opacity 由合成器处理，不重排不重绘。3. C 正确：读布局属性强制浏览器 flush pending 布局，触发 reflow。4. D 正确：批量/RAF 合并样式变更可减少 reflow 次数。", "kaodian": "AI前端能力-前端基础与渲染引擎-渲染管线reflow-repaint"}, {"no": 6, "type": "multi", "body": "关于回归测试影响分析，下列论断正确的是（多选）？", "code": "// 修改了支付回调模块，决定回归范围", "options": [{"k": "A", "t": "应基于变更影响分析（调用链 / 接口依赖）圈定回归集"}, {"k": "B", "t": "回归范围需覆盖被改模块的上下游调用方，而非仅改文件本身"}, {"k": "C", "t": "低风险模块永远不需要回归"}, {"k": "D", "t": "每次发版必须全量回归所有历史用例"}], "answer": ["A", "B"], "explain": "1. A 正确：由变更影响分析（调用链/依赖）确定受影响回归集。2. B 正确：被改模块的上下游调用方可能受影响，应纳入。3. C 错误：是否回归看影响而非风险标签，关键低频模块也需。4. D 错误：全量回归成本过高，应按风险筛选。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归影响圈定"}, {"no": 7, "type": "multi", "body": "关于 AI 辅助测试数据分类与生成，下列论断正确的是（多选）？", "code": "// 用 AI 对接口用例做分类：正向 / 边界 / 异常 / 性能", "options": [{"k": "A", "t": "AI 可按语义把用例分为正向 / 边界 / 异常等类别"}, {"k": "B", "t": "AI 生成的预期结果应人工复核后才入库"}, {"k": "C", "t": "AI 适合快速扩充边界与异常场景，减轻人工铺数据负担"}, {"k": "D", "t": "异常类用例应覆盖超时 / 鉴权失效 / 参数畸形等"}], "answer": ["A", "B", "C", "D"], "explain": "1. A 正确：AI 擅长按语义对用例分类。2. B 正确：AI 编造的预期常错，必须人工复核。3. C 正确：AI 可快速铺边界/异常数据，但测试设计仍需人。4. D 正确：异常类应覆盖超时、鉴权失效、参数畸形等。", "kaodian": "AI质量保障-AI辅助测试-AI测试数据分类评审"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "同一消费组内，一个分区在同一时刻只会被一个消费者消费。", "code": "// 同组 group.id=g1，topic t1 有 3 个分区\nprops.put('group.id', 'g1');", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "消费组 Rebalance 把分区分配给组内消费者，一个分区同一时刻只归属一个消费者；一条消息只被组内一个消费者处理。广播需用不同 group.id 各自独立消费。", "kaodian": "AI后端能力-高并发与中间件层-Kafka消费组分配"}, {"no": 2, "type": "judge", "body": "Vite 构建产物若 base 设为 '/'，部署到 GitHub Pages 子路径 /fullstack-quiz/ 也能正确加载资源。", "code": "export default defineConfig({ base: '/' });", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "绝对路径 /assets/... 在子路径下会请求域名根，导致 404；应设 base:'./'（相对路径）或 'fullstack-quiz/' 才能正确加载。", "kaodian": "AI前端能力-前端生态-Vite构建路径"}, {"no": 3, "type": "judge", "body": "fetch 同源请求默认会携带 cookie。", "code": "// 同源页面内\nfetch('/api/x');", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "fetch 默认 credentials:'same-origin'，同源请求会带 cookie；跨域则需显式 credentials:'include' 且服务端允许，否则不带。", "kaodian": "AI前端能力-网络与BFF架构-fetch凭证默认"}, {"no": 4, "type": "judge", "body": "Playwright 用例之间应相互独立，各自通过 fixture 准备环境。", "code": "// 每个用例用 beforeEach 重建 page 与登录态", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "用例独立可避免顺序依赖与状态污染，减少 flaky；应各自用 fixture 准备（登录态、数据），而非跨用例共享。", "kaodian": "AI质量保障-自动化测试-用例状态隔离"}, {"no": 5, "type": "judge", "body": "下面 CI 把测试通过但覆盖率仅 60% 的代码合并了，是合理的。", "code": "- run: npm test          # 通过\n# 未配置覆盖率门禁\n- run: merge", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "缺少覆盖率门禁，低覆盖代码可合入；应配置覆盖率阈值（如 <80% 失败）。属质量门禁缺失，需补门禁而非仅跑单测。", "kaodian": "AI质量保障-CI/CD与质量门禁-覆盖率门禁缺失"}, {"no": 6, "type": "judge", "body": "冒烟测试应当覆盖系统的全部功能细节以保证质量。", "code": "// 冒烟用例集包含了所有模块的详细边界场景", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "冒烟测试是核心路径最小验证集，快速确认主流程可用；详细场景属回归/SIT。贪全会让冒烟变慢、失去“快速健康扫描”意义。", "kaodian": "AI质量保障-软件测试理论与质量体系-冒烟测试最小集"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
