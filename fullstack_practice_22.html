<script type="application/json" id="quizData">{"id": "vol22", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按「自如大学 7月认证考（均分 11/11/11）+ 全栈认证大纲 + AI时代全栈工程实战能力认证大纲」出题：后端≈33% / 前端≈33% / 测试≈33%。每题给真实可运行代码/配置/日志片段，考『读代码判行为/找坑/补全』，对齐真卷出题思路。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "下面代码在不同 JDK 下执行，关于 s1 与 s2 的相等性，哪个说法正确？", "code": "String s1 = new String(\"ziroom\");\nString s2 = s1.intern();\nSystem.out.println(s1 == s2);\nSystem.out.println(s2 == \"ziroom\");", "options": [{"k": "A", "t": "第一行打印 false、第二行打印 true（字面量 ziroom 已在常量池，intern 返回池中已有引用，与 s1 堆对象不同）"}, {"k": "B", "t": "两行都打印 true（intern 会把 s1 放进常量池并返回 s1 本身）"}, {"k": "C", "t": "两行都打印 false（intern 永远返回新对象）"}, {"k": "D", "t": "编译报错，intern 不是 String 的方法"}], "answer": ["A"], "explain": "字面量 \"ziroom\" 在类加载时进入字符串常量池。s1 是 new 出来的独立堆对象。s1.intern() 发现池中已有 \"ziroom\"，返回池中已有引用（不是 s1），所以 s1==s2 为 false；而 \"ziroom\" 字面量本身取的就是池中引用，故 s2==\"ziroom\" 为 true。B 错（仅当池中尚无该字符串时 intern 才把入参对象入池）；C/D 错。", "kaodian": "AI后端能力-语言与计算层-Stringintern常量池"}, {"no": 2, "type": "single", "body": "对键 uv:2026-08-15 依次执行下列位图操作，最终 BITCOUNT 返回多少？", "code": "SETBIT uv:2026-08-15 0 1\nSETBIT uv:2026-08-15 7 1\nSETBIT uv:2026-08-15 15 1\nSETBIT uv:2026-08-15 7 0\nBITCOUNT uv:2026-08-15", "options": [{"k": "A", "t": "4"}, {"k": "B", "t": "2"}, {"k": "C", "t": "3"}, {"k": "D", "t": "1"}], "answer": ["B"], "explain": "SETBIT 第二个参数是「位偏移」不是字节。依次置 0、7、15 为 1，再把 7 置 0，最终只有 offset 0 和 15 为 1，故 BITCOUNT=2。A 错（误算 4）；C 错（没扣除 7 被清）；D 错。", "kaodian": "AI后端能力-高并发与中间件层-BITCOUNT位统计"}, {"no": 3, "type": "single", "body": "下面代码的输出是？", "code": "static String expensive() {\n    System.out.print(\"call \");\n    return \"default\";\n}\nOptional<String> o = Optional.empty();\nString r = o.orElse(expensive());\nSystem.out.println(r);", "options": [{"k": "A", "t": "不打印 \"call \"，直接打印 \"default\"（参数被惰性延迟，只有空时才求值）"}, {"k": "B", "t": "两行都打印 true（Intern 把入参对象入池）"}, {"k": "C", "t": "先打印 \"call \" 再打印 \"default\"（orElse 的参数无论 Optional 是否有值都会先求值）"}, {"k": "D", "t": "抛出异常，因为 o 为空"}], "answer": ["C"], "explain": "orElse(T) 的参数是普通方法实参，在调用 orElse 之前就必须求值（急切求值），所以 expensive() 一定执行。只有 orElseGet(Supplier) 才是惰性。B 是 orElseGet 的行为。A/D 错。", "kaodian": "AI后端能力-语言与计算层-OptionalorElse惰性"}, {"no": 4, "type": "single", "body": "执行下面 MyBatis-Plus 代码后，实际执行的 UPDATE 语句 WHERE 条件与 SET 子句是？", "code": "UpdateWrapper<User> uw = new UpdateWrapper<>();\nuw.set(\"age\", 18).set(\"name\", \"tom\")\n  .eq(\"id\", 1)\n  .and(w -> w.gt(\"score\", 60).or().lt(\"level\", 3));\nuserMapper.update(null, uw);", "options": [{"k": "A", "t": "SET age=18,name='tom' WHERE id=1 OR (score>60 AND level<3)"}, {"k": "B", "t": "SET age=18,name='tom' WHERE id=1 AND score>60 OR level<3（括号被忽略）"}, {"k": "C", "t": "编译报错，update 第一个参数不能为 null"}, {"k": "D", "t": "SET age=18,name='tom' WHERE id=1 AND (score>60 OR level<3)"}], "answer": ["D"], "explain": ".set 拼接 SET；.eq 生成 id=1；.and(Consumer) 把内部 gt/or 用括号包成 (score>60 OR level<3)，与前面 AND 连接。第一个参数为 null 表示「不根据实体更新，只使用 UpdateWrapper」，完全合法。A/B 错（括号与连接符错误）；C 错。", "kaodian": "AI后端能力-数据存储与ORM层-UpdateWrapper条件更新"}, {"no": 5, "type": "single", "body": "线上一条慢 SQL：user 表 phone 是 VARCHAR(20) 且有索引，但下面查询全表扫描。根因是？", "code": "-- phone 列类型为 VARCHAR(20)，建有普通索引\nSELECT * FROM user WHERE phone = 13800138000;", "options": [{"k": "A", "t": "传入的是数字 13800138000，MySQL 会把 phone 列做「隐式类型转换」转为数字再比较，导致索引失效走全表扫描"}, {"k": "B", "t": "VARCHAR 列不能用等号比较，必须 LIKE"}, {"k": "C", "t": "索引建在 phone 上但查询用了 *，所以失效"}, {"k": "D", "t": "数字过长超过 BIGINT 范围导致索引失效"}], "answer": ["A"], "explain": "当字符串列与数字比较时，MySQL 会把字符串列转换为数字（而非把数字转字符串），列上的函数式转换使索引不可用，触发全表扫描。正确写法应传字符串 '13800138000'。B/C/D 均错误。", "kaodian": "AI后端能力-数据存储与ORM层-隐式类型转换索引失效"}, {"no": 6, "type": "single", "body": "向 geo 集合添加两个门店坐标后查询距离，下面说法正确的？", "code": "GEOADD shops 116.397 39.908 \"A\"\nGEOADD shops 121.473 31.230 \"B\"\nGEODIST shops A B km", "options": [{"k": "A", "t": "返回两点的直线平面直角距离（未做球面换算）"}, {"k": "B", "t": "返回 A、B 两点的球面大圆距离（公里），约 1000+ km"}, {"k": "C", "t": "报错，GEO 只能存不能算距离"}, {"k": "D", "t": "返回两点的经纬度差值之和"}], "answer": ["B"], "explain": "GEOADD 以经纬度存储为 sorted set（geohash），GEODIST 默认返回米，指定 km 返回公里，按球面大圆距离计算。A/C/D 错。", "kaodian": "AI后端能力-高并发与中间件层-RedisGeo距离计算"}, {"no": 7, "type": "single", "body": "下面要分页查询「状态=1 且昵称含 'zi'」的用户，横线处应填哪一行让分页与条件都生效？（前提：已注册分页插件）", "code": "Page<User> page = new Page<>(1, 10);\nLambdaQueryWrapper<User> w = Wrappers.lambdaQuery();\nw.eq(User::getStatus, 1)\n .like(User::getNickname, \"zi\");\n// ______ 横线处\nuserMapper.selectPage(page, w);", "options": [{"k": "A", "t": "userMapper.selectPage(page, w); 且无需接收返回值（page 已被自动填充）"}, {"k": "B", "t": "w.page(page);  // 调用 wrapper 上的 page 方法"}, {"k": "C", "t": "page = userMapper.selectPage(page, w);  // 把返回值写回 page，records/total 才完整"}, {"k": "D", "t": "必须 new 一个 Page 接收：Page<User> r = userMapper.selectPage(page, w);"}], "answer": ["C"], "explain": "MyBatis-Plus 的 selectPage 会把分页结果（records、total 等）写入传入的 page 对象并返回同一个引用，标准稳妥写法是接收返回值再使用。关键前提：必须先注册 PaginationInnerInterceptor，否则不会分页。A 不严谨；B 的 w.page 不存在；D 不必要。", "kaodian": "AI后端能力-数据存储与ORM层-分页查询条件构造"}, {"no": 8, "type": "single", "body": "下面 Vue3 代码中，点击按钮修改数据后页面会更新吗？", "code": "const state = reactive({ count: 0 });\nfunction add() {\n  state = reactive({ count: state.count + 1 }); // 重新赋值\n}", "options": [{"k": "A", "t": "会更新，reactive 对象可以随意整体替换"}, {"k": "B", "t": "会更新，Vue 自动追踪所有赋值"}, {"k": "C", "t": "编译报错"}, {"k": "D", "t": "不会更新，因为 reactive 返回的是代理对象，对 state 整体重新赋值丢失了原代理的响应式引用"}], "answer": ["D"], "explain": "state 是用 let 声明、模板收集依赖的是「最初的那个代理」。函数内 state = reactive(...) 只是把局部变量指向新对象，模板仍引用旧代理且旧代理未变，故视图不更新。正确做法用 ref 或 Object.assign(state, {count:...}) 原地修改。A/B 错（整体替换无效）；C 错（语法合法）。", "kaodian": "AI前端能力-语言与运行时-reactive重新赋值"}, {"no": 9, "type": "single", "body": "容器宽 600px，三个子项 flex-basis 均为 0，flex-grow 分别为 1/2/3，无 gap，子项实际宽度为？", "code": ".container { width: 600px; display: flex; }\n.a { flex: 1 1 0; }   /* grow 1 */\n.b { flex: 2 1 0; }   /* grow 2 */\n.c { flex: 3 1 0; }   /* grow 3 */", "options": [{"k": "A", "t": "100 / 200 / 300"}, {"k": "B", "t": "200 / 200 / 200"}, {"k": "C", "t": "150 / 300 / 150"}, {"k": "D", "t": "600 全给 .c，其余 0"}], "answer": ["A"], "explain": "剩余空间 = 600 - (0+0+0) = 600，按 grow 比例 1:2:3 分配，每份 100，故 100/200/300。B 未加权；C/D 错。", "kaodian": "AI前端能力-前端基础与渲染引擎-Flex分配计算"}, {"no": 10, "type": "single", "body": "下面 GET 请求中，希望以 ids=1&ids=2&ids=3 形式发送，实际默认序列化结果是？", "code": "axios.get('/api', { params: { ids: [1, 2, 3] } });", "options": [{"k": "A", "t": "ids=1&ids=2&ids=3（默认就展开成同名多值）"}, {"k": "B", "t": "ids[]=1&ids[]=2&ids[]=3（Axios 默认用方括号形式）"}, {"k": "C", "t": "ids=1,2,3（默认逗号拼接）"}, {"k": "D", "t": "ids=%5B1%2C2%2C3%5D（整个数组 JSON 化）"}], "answer": ["B"], "explain": "Axios 默认使用 paramsSerializer 把数组序列化为 ids[]=1&ids[]=2&ids[]=3（方括号风格）。要得到 ids=1&ids=2&ids=3 需自定义 paramsSerializer（如 qs.stringify 的 arrayFormat:'repeat'）。A/C/D 均非默认行为。", "kaodian": "AI前端能力-网络与BFF架构-Axios数组参数序列化"}, {"no": 11, "type": "single", "body": "下面代码打印结果是？", "code": "Promise.all([\n  Promise.resolve(1),\n  Promise.reject('err'),\n  Promise.resolve(3)\n]).then(r => console.log('ok', r))\n  .catch(e => console.log('catch', e));", "options": [{"k": "A", "t": "ok [1, undefined, 3]（忽略 reject 继续聚合）"}, {"k": "B", "t": "先 ok 再 catch"}, {"k": "C", "t": "catch err（任意一个 reject 立即导致 Promise.all 整体 reject，不会等其它完成）"}, {"k": "D", "t": "不打印任何内容"}], "answer": ["C"], "explain": "Promise.all 是「快速失败」语义：只要有一个 reject，整体立刻 reject 并走 catch，已 resolve 的值不会汇聚成数组。A 是 Promise.allSettled 的行为。B/C 错。", "kaodian": "AI前端能力-语言与运行时-Promiseall失败语义"}, {"no": 12, "type": "single", "body": "前端请求 /api/user 想代理到 http://backend:8080/user，配置如下却不生效（后端返回 404），问题在？", "code": "// vite.config.ts\n server: {\n   proxy: {\n     '/api': {\n       target: 'http://backend:8080',\n       changeOrigin: true\n       // 没有 rewrite\n     }\n   }\n }\n// 前端 axios.get('/api/user')", "options": [{"k": "A", "t": "缺少 changeOrigin，必须删除该配置"}, {"k": "B", "t": "target 应为相对路径而非完整 URL"}, {"k": "C", "t": "配置正确，是后端路由问题，与代理无关"}, {"k": "D", "t": "缺少 rewrite，请求被原样代理为 http://backend:8080/api/user，后端无 /api 前缀路由导致 404"}], "answer": ["D"], "explain": "仅匹配前缀 /api 但不重写路径时，代理会把完整 /api/user 转发到后端，后端没有 /api 前缀路由就会 404。需加 rewrite: (p) => p.replace(/^\\/api/, '') 去掉前缀。A/B/C 错。", "kaodian": "AI前端能力-网络与BFF架构-Vite代理路径重写"}, {"no": 13, "type": "single", "body": "下面两个规则作用在同一元素，最终文字颜色是？", "code": "<div id=\"box\" class=\"a b\">hi</div>\n<style>\n  #box.a    { color: red; }      /* 特异性 (1,1,0) */\n  div.b     { color: blue; }     /* 特异性 (0,0,2) */\n</style>", "options": [{"k": "A", "t": "red（#box.a 特异性 1,1,0 高于 div.b 的 0,0,2）"}, {"k": "B", "t": "blue（class 选择器优先）"}, {"k": "C", "t": "黑色（都未生效）"}, {"k": "D", "t": "随机，取决于书写顺序"}], "answer": ["A"], "explain": "特异性按 (id, class, element) 三元组逐位比较：#box.a = (1,1,0)，div.b = (0,0,2)，前者 id 位 1 > 0 直接胜出，颜色 red。B/C/D 错。", "kaodian": "AI前端能力-前端基础与渲染引擎-选择器权重计算"}, {"no": 14, "type": "single", "body": "下面 TS 函数，参数 x 在 if 分支内的类型推断是？", "code": "function f(x: string | number) {\n  if (typeof x === 'string') {\n    return x.length;   // x 在此处类型\n  }\n  return x + 1;\n}", "options": [{"k": "A", "t": "TS 不会做任何收窄，x 始终是 string | number"}, {"k": "B", "t": "在 if 内 x 被收窄为 string，可安全访问 .length；else 分支 x 为 number"}, {"k": "C", "t": "在 if 内 x 是 number"}, {"k": "D", "t": "编译报错，typeof 不能用于联合类型"}], "answer": ["B"], "explain": "TS 的 typeof 类型守卫会在 if 块内把 x 收窄为 string，else 处收窄为 number，无需类型断言。A/C/D 错。", "kaodian": "AI前端能力-语言与运行时-TS类型收窄typeof"}, {"no": 15, "type": "single", "body": "下面 JUnit5 用法，关于 @ParameterizedTest 的说法正确的是？", "code": "@ParameterizedTest\n@ValueSource(ints = {2, 4, 6})\nvoid isEven(int n) {\n    assertTrue(n % 2 == 0);\n}", "options": [{"k": "A", "t": "只运行一次，n 取数组第一个值 2"}, {"k": "B", "t": "编译报错，参数化测试不能有参数"}, {"k": "C", "t": "该方法会用 2、4、6 三个参数分别运行三次，每次注入一个 int"}, {"k": "D", "t": "需要 @RepeatedTest 才能多次运行"}], "answer": ["C"], "explain": "@ParameterizedTest + @ValueSource 会让测试按数据源每个元素各执行一次（共 3 次），每次把元素注入方法参数。A/B/D 错。", "kaodian": "AI质量保障-自动化测试-JUnit5参数化测试"}, {"no": 16, "type": "single", "body": "对「创建订单」接口做接口测试，为防止网络重试导致重复下单，正确的测试与防护做法是？", "code": "POST /orders\nHeader: Idempotency-Key: <uuid>\nBody: { \"sku\": \"X\", \"qty\": 1 }", "options": [{"k": "A", "t": "每次随机换 key 发送，认为重试由客户端保证"}, {"k": "B", "t": "只测一次成功即可，无需测重试"}, {"k": "C", "t": "用同一个 key 但期望第二次报错 500"}, {"k": "D", "t": "用同一 Idempotency-Key 重复发送两次，断言第二次返回与第一次相同的订单号（服务端按 key 幂等）"}], "answer": ["D"], "explain": "幂等设计靠客户端携带唯一 Idempotency-Key，服务端对相同 key 返回首次结果。测试应验证「同 key 重复请求得到同一结果且不重复创建」。A/B/C 都违背幂等测试原则。", "kaodian": "AI质量保障-接口测试-幂等键设计"}, {"no": 17, "type": "single", "body": "下面要等待「提交按钮可点击」后再点击，横线处应填哪一行最稳妥？", "code": "// ______ 横线处\nawait page.getByRole('button', { name: '提交' }).click();", "options": [{"k": "A", "t": "无需额外等待，直接写 await page.getByRole('button', { name: '提交' }).click();（Playwright 的 click 自带自动等待可操作状态）"}, {"k": "B", "t": "先 await page.waitForTimeout(3000); 再 click（硬等待 3 秒）"}, {"k": "C", "t": "必须先 await page.waitForSelector(...) 再 click"}, {"k": "D", "t": "直接 click 会报错，必须 sleep 后重试"}], "answer": ["A"], "explain": "Playwright 的 click 等操作自带「自动等待可操作状态（可见、稳定、可接收事件）」，无需手写 sleep 或额外 waitForSelector（它内部已包含）。B 是反模式（脆弱硬等待）；C 多余；D 错。", "kaodian": "AI质量保障-自动化测试-Playwright自动等待补全"}, {"no": 18, "type": "single", "body": "下面 Playwright 断言，关于其等待行为的说法正确的是？", "code": "await expect(page.getByText('欢迎')).toBeVisible();", "options": [{"k": "A", "t": "立即判断一次，元素不在就失败"}, {"k": "B", "t": "expect 会自动轮询，直到元素在超时（默认 5s）内可见才通过，无需手写 sleep"}, {"k": "C", "t": "必须配合 page.waitForTimeout(5000) 使用"}, {"k": "D", "t": "只在网络空闲时检查一次"}], "answer": ["B"], "explain": "Playwright 的 expect 内置「自动等待 + 重试」(auto-waiting)，会周期性检查直到条件满足或超时报错，避免脆弱的硬等待。A/C/D 错。", "kaodian": "AI质量保障-自动化测试-Playwright期望等待"}, {"no": 19, "type": "single", "body": "界面上一个按钮文字拼写错误（如「登入」写成「登陆」），其缺陷严重度与优先级通常是？", "code": "缺陷：登录页「登入」按钮文案错误", "options": [{"k": "A", "t": "严重度高（功能不可用），优先级低"}, {"k": "B", "t": "严重度与优先级一定相同"}, {"k": "C", "t": "严重度低（不影响功能），但优先级可能高（影响用户体验/品牌，需尽快修）"}, {"k": "D", "t": "严重度由修复成本决定"}], "answer": ["C"], "explain": "严重度衡量「对系统功能/质量的破坏程度」（文案错属低），优先级衡量「修复紧迫度」（影响用户感知可高）。二者独立，不必然相等。A/B/D 错。", "kaodian": "AI质量保障-软件测试理论与质量体系-严重度优先级判定"}, {"no": 20, "type": "single", "body": "用 AI 生成一段登录接口的测试用例，下面做法正确的是？", "code": "prompt: \"为 POST /login 生成测试用例\"", "options": [{"k": "A", "t": "直接信任 AI 生成的「预期结果」，不加复核"}, {"k": "B", "t": "只让 AI 生成一条成功用例即可"}, {"k": "C", "t": "AI 无法生成接口测试用例"}, {"k": "D", "t": "让 AI 同时覆盖正常登录、空密码、错误密码、SQL 注入、超长输入等边界，并人工复核预期结果"}], "answer": ["D"], "explain": "AI 擅长批量生成边界/异常用例，但生成的「预期结果」可能不准，必须人工复核（尤其错误码、安全类）。A 是 AI 辅助测试的典型风险；B/C 错。", "kaodian": "AI质量保障-AI辅助测试-AI生成边界用例"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于 Redis 持久化，判断下列说法是否成立：", "code": "# redis.conf\nsave 900 1          # RDB 触发\nappendonly yes      # AOF 开启", "options": [{"k": "A", "t": "A 成立：RDB 是某一时刻的内存快照，恢复速度快但可能丢失最后一次快照后的数据"}, {"k": "B", "t": "B 成立：AOF 以追加命令日志方式持久化，通常比 RDB 数据更安全（丢失更少），但文件更大、恢复更慢"}, {"k": "C", "t": "C 成立：AOF 重写（rewrite）把历史命令压缩成最小命令集，避免文件无限膨胀"}, {"k": "D", "t": "D 成立：开启 AOF 后 RDB 自动失效，两者不能同时存在"}], "answer": ["A", "B", "C"], "explain": "1. A 正确：RDB 快照恢复快但有丢失窗口。2. B 正确：AOF 默认每秒刷盘，丢失少但体积大、重放慢。3. C 正确：AOF rewrite 用当前数据集生成等效最小命令。4. D 错误：RDB 与 AOF 可共存，Redis 7 默认采用混合持久化，重启优先用 AOF 恢复。", "kaodian": "AI后端能力-高并发与中间件层-持久化机制论断"}, {"no": 2, "type": "multi", "body": "关于 Kafka 消费者位移（offset）提交，判断下列说法是否成立：", "code": "props.put(\"enable.auto.commit\", \"true\");\nprops.put(\"auto.commit.interval.ms\", \"5000\");", "options": [{"k": "A", "t": "A 成立：自动提交会在后台周期性把「已拉取到」的位移提交，若消费逻辑还未处理完就提交，可能导致消息丢失"}, {"k": "B", "t": "B 成立：手动同步提交 commitSync 会在提交成功前阻塞，失败会抛出异常便于重试"}, {"k": "C", "t": "C 成立：手动异步提交 commitAsync 非阻塞，无需任何处理即可安全使用"}, {"k": "D", "t": "D 成立：先处理消息再手动提交（enable.auto.commit=false + commitSync），配合幂等消费可做到至少一次语义"}], "answer": ["A", "B", "D"], "explain": "1. A 正确：自动提交按拉取位移而非处理完成，崩溃会丢。2. B 正确：commitSync 同步阻塞、异常可重试。3. C 错误：commitAsync 非阻塞，重试需注意位移顺序（可能新位移先到、旧位移后到造成覆盖）。4. D 正确：处理后提交 + 幂等消费实现 at-least-once。", "kaodian": "AI后端能力-高并发与中间件层-位移提交方式论断"}, {"no": 3, "type": "multi", "body": "关于 @Transactional 传播行为，判断下列说法是否成立：", "code": "@Transactional(propagation = Propagation.REQUIRES_NEW)\nvoid inner() { ... }\n\n@Transactional\nvoid outer() {\n    repo.save(a);\n    inner();   // 内部 REQUIRES_NEW\n}", "options": [{"k": "A", "t": "A 成立：inner 以 REQUIRES_NEW 运行，会挂起 outer 的事务，inner 自己开启新事务"}, {"k": "B", "t": "B 成立：若 inner 抛异常回滚，outer 的事务一定会跟着回滚"}, {"k": "C", "t": "C 成立：若 outer 回滚，已提交的 inner 新事务不会跟着回滚（各自独立）"}, {"k": "D", "t": "D 成立：REQUIRED 与 REQUIRES_NEW 等价，都会加入已有事务"}], "answer": ["A", "C", "D"], "explain": "1. A 正确：REQUIRES_NEW 挂起外围事务，自建新事务。2. B 错误：inner 回滚后异常若被 outer catch，outer 可继续提交，不必然回滚。3. C 正确：inner 是独立已提交事务，outer 回滚不影响它。4. D 错误：REQUIRED 加入已有事务（共用），REQUIRES_NEW 总是新开，二者不等价。", "kaodian": "AI后端能力-应用框架层-事务传播行为论断"}, {"no": 4, "type": "multi", "body": "关于 Vue3 响应式，判断下列说法是否成立：", "code": "const state = reactive({ n: 0 });\nconst count = ref(0);", "options": [{"k": "A", "t": "A 成立：reactive 只能用于对象/数组，不能用于基本类型（number/string）作为根值"}, {"k": "B", "t": "B 成立：ref 包裹基本类型后，模板中直接写 count 即可，无需 .value（模板自动解包）"}, {"k": "C", "t": "C 成立：解构 reactive 对象 const { n } = state 会丢失响应式，n 不再随 state.n 变化"}, {"k": "D", "t": "D 成立：shallowRef 只跟踪 .value 替换，不深度响应内部属性变化"}], "answer": ["A", "B", "C", "D"], "explain": "1. A 正确：reactive 基于 Proxy，基本类型无对象可代理。2. B 正确：模板中 ref 自动解包。3. C 正确：解构会断开引用。4. D 正确：shallowRef 浅层，只响应整体替换。四条全部成立。", "kaodian": "AI前端能力-语言与运行时-响应式API正误论断"}, {"no": 5, "type": "multi", "body": "关于浏览器跨域（CORS），判断下列说法是否成立：", "code": "Access-Control-Allow-Origin: https://a.com\nAccess-Control-Allow-Credentials: true", "options": [{"k": "A", "t": "A 成立：跨域时服务端返回 Allow-Origin 即可，浏览器会自动带上 cookie"}, {"k": "B", "t": "B 成立：当请求带凭证（cookie）时，Allow-Origin 不能是 *，必须明确指定具体源"}, {"k": "C", "t": "C 成立：简单请求（GET/POST 表单型）不会触发预检（OPTIONS），非简单请求才会"}, {"k": "D", "t": "D 成立：跨域是浏览器的同源策略限制，服务端本身不受同源约束，可正常收发"}], "answer": ["B", "C", "D"], "explain": "1. A 错误：带 cookie 还需服务端返回 Access-Control-Allow-Credentials: true，且 Allow-Origin 不能是 *。2. B 正确：凭证请求下 * 非法。3. C 正确：预检仅非简单请求触发。4. D 正确：同源策略是浏览器端限制，服务端无此约束。", "kaodian": "AI前端能力-网络与BFF架构-跨域机制论断"}, {"no": 6, "type": "multi", "body": "关于测试金字塔，判断下列说法是否成立：", "code": "测试金字塔（自底向上）：\n  单元测试 ▲\n  集成测试 ▢\n  端到端测试 ▽（最宽）", "options": [{"k": "A", "t": "A 成立：单元测试数量应最多、执行最快、成本最低，位于金字塔底层"}, {"k": "B", "t": "B 成立：端到端测试最慢、最脆弱、维护成本最高，应最少"}, {"k": "C", "t": "C 成立：集成测试可以完全替代单元测试，所以单测不重要"}, {"k": "D", "t": "D 成立：金字塔倒置（大量 E2E、极少单测）是最优实践"}], "answer": ["A", "B"], "explain": "1. A 正确。2. B 正确。3. C 错误：集成/UI 测试无法替代单测的快速反馈与精准定位，各层职责不同。4. D 错误：倒置是反模式，会导致反馈慢、定位难、维护重。", "kaodian": "AI质量保障-自动化测试-金字塔分层论断"}, {"no": 7, "type": "multi", "body": "关于回归测试，判断下列说法是否成立（变更：订单服务新增「优惠券叠加」逻辑）：", "code": "变更：订单服务新增「优惠券叠加」逻辑", "options": [{"k": "A", "t": "A 成立：回归测试应优先覆盖受变更直接影响及有依赖/调用关系的模块"}, {"k": "B", "t": "B 成立：回归测试就是把所有历史用例全量重跑一遍最稳妥"}, {"k": "C", "t": "C 成立：历史高频缺陷模块、核心交易链路应纳入必跑回归集"}, {"k": "D", "t": "D 成立：只要新功能自测通过，就不需要做回归测试"}], "answer": ["A", "C"], "explain": "1. A 正确：影响分析驱动回归范围。2. B 错误：应精准筛选而非盲目全量，全量成本高且收益递减。3. C 正确：风险模块优先。4. D 错误：新功能通过不代表未破坏既有功能，回归必要。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归测试论断"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "判断下列说法是否正确：「消息被消费者 basicReject 且 requeue=false 时，会进入已配置的死信队列。」", "code": "args.put(\"x-dead-letter-exchange\", \"dlx\");\nargs.put(\"x-dead-letter-routing-key\", \"dlq.key\");\nchannel.queueDeclare(\"order.queue\", true, false, false, args);\nchannel.basicReject(deliveryTag, false);  // requeue=false", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "RabbitMQ 死信触发条件：① 消息被 reject/nack 且 requeue=false；② 消息 TTL 过期；③ 队列达最大长度被丢弃。本题 basicReject(tag,false) 即 requeue=false，满足条件①，按 x-dead-letter-* 路由到死信队列。说法正确。", "kaodian": "AI后端能力-高并发与中间件层-死信队列触发判定"}, {"no": 2, "type": "judge", "body": "判断下列说法是否正确：「对不常变的静态资源（如带 hash 的文件名 app.3a2b.js），服务端应设置 Cache-Control: max-age=31536000, immutable，实现强缓存，期间浏览器不再发请求。」", "code": "Cache-Control: max-age=31536000, immutable", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "带内容 hash 的文件名意味着内容不变则 URL 不变，设置长 max-age + immutable 是标准强缓存做法，浏览器在过期前直接读本地缓存不发起请求，命中率高且不破坏更新（改名即变 URL）。说法正确。", "kaodian": "AI前端能力-网络与BFF架构-强缓存策略判定"}, {"no": 3, "type": "judge", "body": "判断下列说法是否正确：「下面 fetch 返回 404 的根因是 fetch 默认不带 cookie，导致后端鉴权失败返回 404。」", "code": "fetch('/api/user')\n  .then(r => r.json())\n  .then(console.log);", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "fetch 默认 credentials 为 same-origin，同域下仍会带 cookie，不会因不带 cookie 而 404；且 404 表示资源未找到而非鉴权失败（鉴权失败通常 401）。更可能的根因是路径/路由问题。故说法错误。", "kaodian": "AI前端能力-网络与BFF架构-fetch默认凭证判定"}, {"no": 4, "type": "judge", "body": "判断下列说法是否正确：「自动化测试应连接独立测试数据库，严禁直连生产库，且测试产生的数据应在用例结束后清理，避免相互污染。」", "code": "spring.datasource.url=jdbc:mysql://test-db:3306/app_test", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "测试环境应与生产隔离，使用独立数据库/数据，并在用例间做好数据清理（如 @Transactional 回滚或 tearDown），保证用例独立可重复。直连生产库是严重违规。说法正确。", "kaodian": "AI质量保障-自动化测试-测试环境隔离原则"}, {"no": 5, "type": "judge", "body": "判断下列说法是否正确：「已关闭的缺陷若在新版本中复现，应新建一条缺陷来跟踪，不要去动已关闭的那条，以免影响历史数据。」", "code": "缺陷状态：New → Open → Fixed → Closed → (复现) 新建 New", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "关闭后复现应 reopen 原缺陷并补充复现信息，保持同一缺陷生命周期可追溯，避免重复建档与历史割裂。新建反而丢失上下文。故说法错误。", "kaodian": "AI质量保障-软件测试理论与质量体系-缺陷重开流程"}, {"no": 6, "type": "judge", "body": "判断下列说法是否正确：「缺陷可以直接从 New 跳到 Closed，跳过 Open/Fixed/Verified 阶段，只要测试人员认为无需修复。」", "code": "New → Closed（直接关闭，未经过 Open/Fixed/Verified）", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "标准缺陷生命周期需经 New→Open→Fixed→Verified→Closed（或走 reject/duplicate 流程），直接 New→Closed 会丢失修复与验证记录，且「认为无需修复」应走 reject/duplicate 而非随意关闭。故说法错误。", "kaodian": "AI质量保障-软件测试理论与质量体系-缺陷状态流转"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
const esc = s => (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+esc(o.t)+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+esc(sec.name)+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+esc(q.kaodian)+'">'+esc(q.kaodian)+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):esc(q.body))+'</div>';
      if(q.code) html += '<div class="code">'+esc(q.code)+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+esc(q.explain)+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
