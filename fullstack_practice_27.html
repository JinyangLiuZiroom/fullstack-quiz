<script type="application/json" id="quizData">{"id": "vol27", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按「自如大学 7月认证考（均分 11/11/11）+ 全栈认证大纲 + AI时代全栈工程实战能力认证大纲」出题：后端≈33% / 前端≈33% / 测试≈33%。针对转型薄弱点（Redis/MQ/MySQL/MyBatis-Plus 等后端中间件）加权，每题给真实可运行代码/配置/日志片段，考读代码判行为/找坑/补全，且正确选项不再明显长于干扰项。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "上述 Cache-Aside 读路径，第一次请求 id=1 且缓存为空时，会发生什么？", "code": "// 第一次请求 id=1\nString v = redisTemplate.opsForValue().get(\"user:1\");\nif (v == null) {\n    v = userMapper.selectById(1).getName();   // 回源 DB\n    redisTemplate.opsForValue().set(\"user:1\", v, 60, TimeUnit.SECONDS);\n}", "options": [{"k": "A", "t": "先查缓存为空，再查 DB 取 name 并写回缓存"}, {"k": "B", "t": "同时查缓存和数据库，取较早返回的那个结果"}, {"k": "C", "t": "抛空指针，因为 get 返回 null 后没有判空"}, {"k": "D", "t": "直接返回 null，因为缓存未命中就不再查库"}], "answer": ["A"], "explain": "Cache-Aside 读策略：先读缓存，未命中再读 DB，并把结果写回缓存供后续命中。代码已对 v==null 判空，不会 NPE，也不会跳过查库。", "kaodian": "AI后端能力-高并发与中间件层-CacheAside读路径"}, {"no": 2, "type": "single", "body": "关于 increment 与 setIfAbsent（SETNX 语义），哪项正确？", "code": "// 计数器自增\nLong n = redisTemplate.opsForValue().increment(\"cnt\");\n// 分布式锁尝试获取\nBoolean ok = redisTemplate.opsForValue().setIfAbsent(\"lock\", \"1\", 30, TimeUnit.SECONDS);", "options": [{"k": "A", "t": "两者都会把已存在的 key 数值重置为 1"}, {"k": "B", "t": "increment 返回自增值；setIfAbsent 仅 key 不存在才写入"}, {"k": "C", "t": "increment 在 key 不存在时返回 null，需要手动初始化"}, {"k": "D", "t": "setIfAbsent 不管 key 是否存在都会覆盖旧值"}], "answer": ["B"], "explain": "increment 原子自增并返回新值（不存在则按 0 自增为 1）；setIfAbsent 即 SETNX 语义，仅当 key 不存在时写入成功返回 true，存在则返回 false，是分布式锁的常用写法。", "kaodian": "AI后端能力-高并发与中间件层-Redis原子自增与锁"}, {"no": 3, "type": "single", "body": "消费者处理 order.q 消息失败并拒绝（requeue=false）后，消息会怎样？", "code": "// 队列配置\nQueueBuilder.durable(\"order.q\")\n    .withArgument(\"x-dead-letter-exchange\", \"dlx\")\n    .withArgument(\"x-dead-letter-routing-key\", \"dlx.key\")\n// 消费者处理失败抛异常，且 requeue=false", "options": [{"k": "A", "t": "停留在原队列里，等待人工手动处理"}, {"k": "B", "t": "被直接丢弃，既不进死信也不留任何记录"}, {"k": "C", "t": "进入死信交换机 dlx，再路由到对应的死信队列"}, {"k": "D", "t": "重新回到原队列队首被立即消费一次"}], "answer": ["C"], "explain": "队列声明时设置了 x-dead-letter-exchange / routing-key，消息被拒绝且 requeue=false 时，RabbitMQ 将其投递到死信交换机，再由死信队列消费，用于隔离异常消息、避免阻塞主队列。", "kaodian": "AI后端能力-高并发与中间件层-RabbitMQ死信队列路由"}, {"no": 4, "type": "single", "body": "report-group 是全新消费组，首次 poll 时从哪个位移开始消费？", "code": "props.put(\"group.id\", \"report-group\");   // 全新组，从未提交过位移\nprops.put(\"auto.offset.reset\", \"earliest\");\nconsumer.subscribe(List.of(\"orders\"));\nconsumer.poll(Duration.ofMillis(100));", "options": [{"k": "A", "t": "从最后一次提交的位移继续，没有则报错退出"}, {"k": "B", "t": "从分区约一半的位置开始消费数据"}, {"k": "C", "t": "从最新位移 latest 开始，只消费启动后的新消息"}, {"k": "D", "t": "因配置 earliest，从分区最早位移开始消费全量历史"}], "answer": ["D"], "explain": "全新消费组在 broker 侧没有已提交位移，此时 auto.offset.reset 生效；earliest 表示从头（最早）消费，latest 表示从最新；本例配置 earliest，故消费全量历史。", "kaodian": "AI后端能力-高并发与中间件层-Kafka新组位移重置"}, {"no": 5, "type": "single", "body": "该查询的 Extra 最可能显示什么？", "code": "-- idx_user 为 (city, age) 联合索引\nSELECT city, age FROM user WHERE city='北京' AND age>30;", "options": [{"k": "A", "t": "Using index，覆盖索引命中无需回表"}, {"k": "B", "t": "Using where; Using temporary，会使用临时表"}, {"k": "C", "t": "没有任何额外信息（Extra 为 NULL）"}, {"k": "D", "t": "Using filesort，表示需要额外做一次排序"}], "answer": ["A"], "explain": "查询列 city、age 都包含在联合索引 (city,age) 中，且 WHERE 命中索引前缀，存储引擎可在索引内完成过滤与取值，无需回表，Extra 显示 Using index（覆盖索引）。", "kaodian": "AI后端能力-数据存储与ORM层-覆盖索引避免回表"}, {"no": 6, "type": "single", "body": "上述加锁语句在 RR 下，会对 amount 索引加什么范围的锁？", "code": "-- 事务隔离级别 RR\nBEGIN;\nSELECT * FROM orders WHERE amount > 100 FOR UPDATE;\n-- amount 上有普通索引，现有值 50,120,200\nCOMMIT;", "options": [{"k": "A", "t": "仅锁定 amount=120 与 200 两行记录，不含间隙"}, {"k": "B", "t": "加 next-key 锁（行锁+间隙锁），覆盖上述区间与间隙"}, {"k": "C", "t": "只锁住大于 100 的记录行，不锁任何间隙"}, {"k": "D", "t": "完全不加锁，因为 FOR UPDATE 只锁主键"}], "answer": ["B"], "explain": "RR 下 amount>100 FOR UPDATE 走普通索引范围查询，加 next-key lock = 行锁+间隙锁，覆盖 (100,120]、(120,200]、(200,+∞)，防止幻读；不仅锁已有行，也锁间隙。", "kaodian": "AI后端能力-数据存储与ORM层-NextKeyLock间隙锁范围"}, {"no": 7, "type": "single", "body": "importData 抛出 IOException（受检异常）后，已执行的 dao.save(a) 会回滚吗？", "code": "@Transactional\npublic void importData() throws IOException {\n    dao.save(a);\n    readFile(); // 抛出 IOException（受检异常）\n}", "options": [{"k": "A", "t": "取决于文件是否读取成功，与异常类型无关"}, {"k": "B", "t": "会回滚，因为 @Transactional 会捕获并处理所有异常"}, {"k": "C", "t": "不会回滚，默认仅对 RuntimeException/Error 回滚"}, {"k": "D", "t": "会回滚，受检异常同样会触发事务的回滚"}], "answer": ["C"], "explain": "Spring @Transactional 默认回滚规则：仅对 RuntimeException 及其子类、Error 回滚；受检异常（如 IOException）默认不回滚，除非显式 @Transactional(rollbackFor=Exception.class)。", "kaodian": "AI后端能力-应用框架层-Transactional回滚异常类型"}, {"no": 8, "type": "single", "body": "对 state 重新整体赋值为新 reactive 后，模板会更新吗？", "code": "const state = reactive({ count: 0 });\nstate = reactive({ count: 1 }); // 重新整体赋值\n// 模板使用 {{ state.count }}", "options": [{"k": "A", "t": "会抛运行时错误，reactive 不可重复调用"}, {"k": "B", "t": "只在首次渲染时更新，之后状态被冻结"}, {"k": "C", "t": "会更新，因为新赋值的对象同样是响应式的"}, {"k": "D", "t": "不会更新：重新赋值指向新对象，视图仍绑旧引用"}], "answer": ["D"], "explain": "reactive 返回的是代理对象，模板依赖的是该代理的引用；用 state = reactive(...) 重新赋值只是让变量指向新对象，原模板绑定仍是旧引用，不会触发更新。应改用 ref 或 Object.assign 修改原对象。", "kaodian": "AI前端能力-前端基础与渲染引擎-Vue3响应式引用绑定"}, {"no": 9, "type": "single", "body": "想让 fullName 可写（赋值后拆回 first/last），缺哪一行？", "code": "const first = ref('张'); const last = ref('三');\nconst fullName = computed({\n  get: () => first.value + last.value,\n  // TODO 缺：set 时反向拆分成两个 ref\n});", "options": [{"k": "A", "t": "set: (v) => { first.value = v[0]; last.value = v.slice(1); }"}, {"k": "B", "t": "set: (v) => { first.value = v[0]; }"}, {"k": "C", "t": "set: (v) => { last.value = v.slice(1); }"}, {"k": "D", "t": "set: (v) => { [first.value, last.value] = v.split(''); }"}], "answer": ["A"], "explain": "computed 带 get/set 才能实现双向：set 接收新值并拆分写回依赖的 ref。A 把字符串拆成首字给 first、其余给 last，符合 fullName=first+last 的反向逻辑；D 用 split('') 会把多字姓拆散，不符。", "kaodian": "AI前端能力-前端基础与渲染引擎-Vue3computedsetter"}, {"no": 10, "type": "single", "body": "在模板里正确读取 user 的 name 应写哪种？", "code": "const user = ref({ name: '李' });\n// 模板中\n// <p>{{ user.name }}</p>   还是   <p>{{ user.value.name }}</p>", "options": [{"k": "A", "t": "{{ user.value.name }}"}, {"k": "B", "t": "{{ user.name }}"}, {"k": "C", "t": "两者完全等价，都能正确读到"}, {"k": "D", "t": "必须写成 {{ user.ref.name }}"}], "answer": ["B"], "explain": "ref 在模板的顶层会被自动解包（unwrapping），直接访问 .name 即可；.value 是脚本里的写法，模板里写 .value 反而取不到。仅当 ref 嵌套在响应式对象内时才需 .value。", "kaodian": "AI前端能力-前端基础与渲染引擎-Vue3ref模板自动解包"}, {"no": 11, "type": "single", "body": "这里 align-items 与 align-content 分别影响什么？", "code": ".box { display:flex; flex-wrap:wrap; height:300px;\n       align-items:center; align-content:space-between; }\n// 子项高度不一，且换行成多行", "options": [{"k": "A", "t": "两者都只控制单行内对齐，多行情况不生效"}, {"k": "B", "t": "两者其实是同一个属性，只是不同别名"}, {"k": "C", "t": "align-items 控制单行内对齐；align-content 控制多行间距分布"}, {"k": "D", "t": "align-items 负责多行间距；align-content 负责单行对齐"}], "answer": ["C"], "explain": "align-items 作用于交叉轴上的单行对齐（每行内子项如何对齐）；align-content 仅在 flex-wrap 产生多行时生效，控制多行整体的间距/分布。单行时 align-content 无效。", "kaodian": "AI前端能力-前端基础与渲染引擎-Flex对齐属性区分"}, {"no": 12, "type": "single", "body": "两个 flex:1 1 auto 与 flex:1 1 0 的元素，在 600px 容器中结果如何？", "code": ".item  { flex: 1 1 auto; }   /* basis=auto 取 width */\n.item2 { flex: 1 1 0; }       /* basis=0 */\n/* 容器宽 600，两元素 width 均为 100 */", "options": [{"k": "A", "t": "auto 下保持 100 不放大，0 下被压缩成 0"}, {"k": "B", "t": "auto 下按内容撑开，0 下才做等比放大"}, {"k": "C", "t": "两者都忽略 grow，宽度固定保持在 100"}, {"k": "D", "t": "两者最终都约 300，因 grow 相同且 width 相等"}], "answer": ["D"], "explain": "flex-basis:auto 以元素 width(100) 为基准，0 以 0 为基准；两者 grow 都是 1:1，故剩余空间均分。auto：用掉 200，剩余 400 各+200→300/300；0：用掉 0，剩余 600 各+300→300/300。结果一致，差别只在起点。", "kaodian": "AI前端能力-前端基础与渲染引擎-FlexBasis取值影响"}, {"no": 13, "type": "single", "body": "关于下面两次请求的传参位置，正确的是？", "code": "axios.get('/api/users', { params: { page: 1, size: 20 } });\naxios.post('/api/login', { username, password });", "options": [{"k": "A", "t": "GET 参数用 params 拼 URL；POST 体用 data 放请求体"}, {"k": "B", "t": "GET 的参数同样放在请求体，由 data 控制"}, {"k": "C", "t": "POST 参数经 params 拼到 URL，GET 放请求体"}, {"k": "D", "t": "两者参数都拼到 URL，并不使用请求体"}], "answer": ["A"], "explain": "axios 中 params 用于 GET 查询参数（拼到 URL ?key=val）；data 用于 POST/PUT 等请求体（如 JSON）。混淆二者会导致后端收不到参数。", "kaodian": "AI前端能力-网络与BFF架构-Axios参数位置"}, {"no": 14, "type": "single", "body": "下载二进制文件需补哪一行配置？", "code": "// 导出 Excel\naxios({\n  method: 'get',\n  url: '/api/export',\n  // TODO 缺：声明响应为二进制流，否则被当 JSON 解析乱码\n}).then(r => {\n  const url = URL.createObjectURL(new Blob([r.data]));\n  // 触发下载...\n});", "options": [{"k": "A", "t": "transformResponse: (d) => d"}, {"k": "B", "t": "responseType: 'blob'"}, {"k": "C", "t": "dataType: 'stream'"}, {"k": "D", "t": "headers: { 'Accept': 'file' }"}], "answer": ["B"], "explain": "下载文件必须设置 responseType:'blob'，让 axios 把响应作为 Blob 二进制处理；否则默认按 JSON 解析二进制，产生乱码或报错。", "kaodian": "AI前端能力-网络与BFF架构-Axios二进制下载配置"}, {"no": 15, "type": "single", "body": "断言只校验了 status===200，该接口测试结论可靠吗？", "code": "// 响应\nHTTP/1.1 200 OK\n{ \"code\": 500, \"msg\": \"库存不足\", \"data\": null }\nexpect(res.status).toBe(200);", "options": [{"k": "A", "t": "不可靠，但原因只是字段命名不规范"}, {"k": "B", "t": "可靠，HTTP 200 状态码即表示业务成功"}, {"k": "C", "t": "不可靠，code=500 是失败，仅看状态码会假绿"}, {"k": "D", "t": "可靠，因为响应返回的是合法 JSON"}], "answer": ["C"], "explain": "HTTP 200 只代表传输层成功；业务正确性要看 code/msg，本例 code=500 是失败。只断言状态码会造成假绿，应同时校验业务 code 与关键字段。", "kaodian": "AI质量保障-接口测试-状态码与业务码区分"}, {"no": 16, "type": "single", "body": "下列哪组最该作为该接口的边界用例？", "code": "// 分页接口 GET /list?page=1&size=20，约定 size∈[1,100]", "options": [{"k": "A", "t": "只测 size=100 这一个最大值的情况"}, {"k": "B", "t": "只测 page 从 1 递增到 10 的情况"}, {"k": "C", "t": "仅测 page=1&size=20 这一种正常返回情况"}, {"k": "D", "t": "size 取 1/100 边界与 0/101 越界，加 page 极大"}], "answer": ["D"], "explain": "边界值测试应覆盖有效边界（最小/最大）与越界（低于下界、超过上界），暴露参数校验缺失或越界返回异常，D 最全面；只测正常值属典型假绿。", "kaodian": "AI质量保障-接口测试-接口边界值用例"}, {"no": 17, "type": "single", "body": "这段手机号校验逻辑缺了什么关键检查？", "code": "function validate(form) {\n  if (!form.phone) return '手机号必填';\n  if (form.phone.length !== 11) return '手机号需11位';\n  // 提交\n}", "options": [{"k": "A", "t": "未校验手机号是否全为数字（字母可蒙混）"}, {"k": "B", "t": "缺少对密码强度做相关的校验内容项"}, {"k": "C", "t": "未对表单的提交频率做相关限制项"}, {"k": "D", "t": "缺少对邮箱格式的正则校验规则"}], "answer": ["A"], "explain": "校验只判断非空与长度，未校验字符组成（是否全为数字）。如 'abc12345678'（11位）能通过，却非合法手机号。功能测试要覆盖格式/类型/边界/必填多维度。", "kaodian": "AI质量保障-软件测试理论与质量体系-功能测试校验完整性"}, {"no": 18, "type": "single", "body": "回归测试应优先覆盖哪些范围？", "code": "// 变更：支付回调通知的签名算法由 MD5 换成 HMAC-SHA256", "options": [{"k": "A", "t": "仅覆盖支付回调这一个单独的接口用例"}, {"k": "B", "t": "直接受影响 + 共用签名模块 + 历史高频区"}, {"k": "C", "t": "全量回归所有接口但不做影响区分"}, {"k": "D", "t": "只覆盖未被修改过的那部分模块"}], "answer": ["B"], "explain": "回归基于变更影响分析：直接受影响功能 + 共享组件（签名工具）的间接影响 + 历史高频缺陷区，按风险排序优先，而非单点或全量。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归测试影响分析"}, {"no": 19, "type": "single", "body": "AI 辅助测试数据分类的主要作用是？", "code": "// 用 AI 对已采集的 1 万条用户行为日志做测试数据分类\n// 期望：分出 正常/边界/异常 三类供用例设计", "options": [{"k": "A", "t": "压缩日志体积以方便转储"}, {"k": "B", "t": "完全替代手工编写所有的测试用例"}, {"k": "C", "t": "聚类标注样本，识别边界与异常，提升覆盖"}, {"k": "D", "t": "直接生成可执行的测试脚本文件"}], "answer": ["C"], "explain": "AI 数据分类可在大量样本中自动聚类/标注正常、边界、异常，辅助测试人员聚焦高风险样本设计用例，提高覆盖效率；它不替代用例设计，也不直接生成脚本。", "kaodian": "AI质量保障-AI辅助测试-AI测试数据分类"}, {"no": 20, "type": "single", "body": "上述流水线阶段顺序有何问题？", "code": "jobs:\n  build: { steps: [npm run build] }\n  test:  { steps: [npm test], needs: build }", "options": [{"k": "A", "t": "有问题，test 本就不该依赖 build"}, {"k": "B", "t": "无问题，测试放在构建之后更准"}, {"k": "C", "t": "无问题，先构建再测试是常规的顺序"}, {"k": "D", "t": "应在 build 前先跑单测/类型检查，尽早暴露"}], "answer": ["D"], "explain": "健康 CI 应在构建/打包前先执行单元与类型检查（fail-fast），尽早发现错误，减少无效构建与等待；把测试放到最后会延迟反馈。", "kaodian": "AI质量保障-CICD与质量门禁-流水线阶段顺序"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于 ZSET 排行榜实现，判断下列论断：", "code": "// 排行榜：score 为积分\nredisTemplate.opsForZSet().add(\"rank\", \"u1\", 100);\nredisTemplate.opsForZSet().reverseRange(\"rank\", 0, 9); // Top10", "options": [{"k": "A", "t": "ZADD 按 score 排序，reverseRange 可取最高分一段"}, {"k": "B", "t": "ZSET 的 score 必须唯一，重复会直接报错"}, {"k": "C", "t": "取 Top10 用 reverseRange(0,9) 即可，不用自排序"}, {"k": "D", "t": "ZSET 只能存字符串 member，对象需序列化后存"}], "answer": ["A", "C"], "explain": "1. A 正确：ZSET 按 score 有序，reverseRange 取高分区。\n2. B 错误：member 唯一，但不同 member 可同分；同 member 更新 score 不报错。\n3. C 正确：reverseRange(0,9) 直接返回前 10 名。\n4. D 正确：member 是字符串，对象需序列化后存。", "kaodian": "AI后端能力-高并发与中间件层-RedisZSET排行榜"}, {"no": 2, "type": "multi", "body": "关于 MP 分页插件配置，判断下列论断：", "code": "@Configuration\npublic class MpCfg {\n  @Bean\n  public MybatisPlusInterceptor mp() {\n    MybatisPlusInterceptor i = new MybatisPlusInterceptor();\n    i.addInnerInterceptor(new PaginationInnerInterceptor(DbType.MYSQL));\n    return i;\n  }\n}", "options": [{"k": "A", "t": "必须注册拦截器并加入分页插件才生效"}, {"k": "B", "t": "分页只在单表生效，自定义 XML 同样不生效"}, {"k": "C", "t": "分页插件需指定数据库类型以生成分页 SQL"}, {"k": "D", "t": "不配置插件也能分页，只是执行更慢一点"}], "answer": ["A", "C"], "explain": "1. A 正确：MP3+ 通过 MybatisPlusInterceptor 加 PaginationInnerInterceptor 启用分页。\n2. B 错误：自定义 XML 分页同样会被插件拦截追加 limit。\n3. C 正确：需指定 DbType 生成对应方言分页 SQL。\n4. D 错误：不配置则 selectPage 不会自动分页（total 为 0 或不分页）。", "kaodian": "AI后端能力-数据存储与ORM层-MP分页插件配置"}, {"no": 3, "type": "multi", "body": "关于 @ConfigurationProperties 与 @Value，判断下列论断：", "code": "@ConfigurationProperties(prefix=\"app\")\npublic class AppProps { private int timeout; private List<String> hosts; }\n// 配置 app.timeout=3000   app.hosts[0]=a", "options": [{"k": "A", "t": "支持批量绑定（集合、嵌套对象），@Value 更适合单个字面量"}, {"k": "B", "t": "@ConfigurationProperties 绑定失败默认抛 BindException"}, {"k": "C", "t": "@Value 能直接把字符串列表绑定为 List 而无需额外处理"}, {"k": "D", "t": "二者都必须写 @PropertySource 指定配置文件位置"}], "answer": ["A", "B"], "explain": "1. A 正确：@ConfigurationProperties 擅长结构化批量绑定（集合/嵌套），@Value 适合单个值。\n2. B 正确：绑定失败抛 BindException，且可加 @Validated 做校验。\n3. C 错误：@Value 绑定 List 需 SpEL 如 @Value(\"#{'${app.hosts}'.split(',')}\")。\n4. D 错误：二者默认读 environment（含 application.yml），不必 @PropertySource。", "kaodian": "AI后端能力-应用框架层-配置绑定方式对比"}, {"no": 4, "type": "multi", "body": "该请求是否会触发浏览器 CORS 预检（OPTIONS）？判断：", "code": "fetch('/api', {\n  method: 'POST',\n  headers: { 'Content-Type': 'application/json', 'X-Token': 'abc' },\n  body: JSON.stringify({ a: 1 })\n});", "options": [{"k": "A", "t": "会，因为带了 X-Token 这类自定义请求头"}, {"k": "B", "t": "会，因其 Content-Type 非简单请求头值"}, {"k": "C", "t": "不会，因为 POST 加 JSON 属于简单请求"}, {"k": "D", "t": "不会，因为该请求是同源发起而非跨域"}], "answer": ["A", "B"], "explain": "1. A 正确：自定义请求头（非 CORS-safelisted）触发预检。\n2. B 正确：Content-Type 取 application/json 不在简单集合（text/plain、multipart/form-data、application/x-www-form-urlencoded）中，也触发预检。\n3. C 错误：JSON 非简单请求。\n4. D 错误：题干未声明同源，且带自定义头即触发预检。", "kaodian": "AI前端能力-网络与BFF架构-CORS预检触发条件"}, {"no": 5, "type": "multi", "body": "关于下面三种改法能否触发视图更新，判断：", "code": "const obj = reactive({ list: [] });\n// 场景1: obj.list = [1,2,3]\n// 场景2: obj.list.push(3)\n// 场景3: Object.assign(obj, {list:[4,5]})", "options": [{"k": "A", "t": "场景1 因整体替换 list 属性，响应式生效"}, {"k": "B", "t": "场景2 的 push 是数组变异方法，被 Vue 拦截，生效"}, {"k": "C", "t": "场景3 的 Object.assign 直接改根对象属性，生效"}, {"k": "D", "t": "三种都不生效，因为 reactive 对象不可变"}], "answer": ["A", "B", "C"], "explain": "1. A 正确：给响应式对象的属性赋新值（含数组）会触发。\n2. B 正确：push 等数组变异方法被 Vue 代理拦截，触发更新。\n3. C 正确：Object.assign 修改响应式对象自身属性亦触发。三者都生效（误以为都失效是常见误解）。", "kaodian": "AI前端能力-前端基础与渲染引擎-Vue3响应式更新触发"}, {"no": 6, "type": "multi", "body": "上述哪些应属于冒烟测试（最小核心路径）？判断：", "code": "# 冒烟用例集合\n- 应用可启动且首页可打开\n- 用户能登录\n- 核心下单流程可走通\n- 所有报表导出格式正确", "options": [{"k": "A", "t": "应用启动与首页打开（阻断性基础）"}, {"k": "B", "t": "用户登录这一核心业务入口"}, {"k": "C", "t": "核心下单流程这一关键业务"}, {"k": "D", "t": "所有报表导出格式的正确性校验"}], "answer": ["A", "B", "C"], "explain": "1-3. A/B/C 正确：冒烟是最小核心路径，快速验证可测性，覆盖启动、登录、核心流程。\n4. D 错误：报表格式详尽校验属于功能/回归测试，过重，不应放进冒烟。", "kaodian": "AI质量保障-AI测试能力-冒烟测试最小集合"}, {"no": 7, "type": "multi", "body": "关于缺陷严重度（Severity）与优先级（Priority），判断：", "code": "缺陷：支付金额显示多了一个零（ 入，不能完全信任。", "kaodian": "AI质量保障-AI辅助测试-AI生成用例人工复核"}, {"no": 6, "type": "judge", "body": "健康的自动化测试比例通常是端到端（E2E）用例最多、单元测试最少。", "code": "// 测试金字塔被倒置：E2E >> 单元", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "测试金字塔倡导单元测试最多、E2E 最少；倒置（E2E 最多）会导致慢、脆、难维护，是反模式。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试金字塔比例"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
