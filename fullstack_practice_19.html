<script type="application/json" id="quizData">{"id": "vol19", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "使用 Redisson 分布式锁，未指定 leaseTime 时，下面关于锁自动续期的说法正确的是？", "code": "RLock lock = redisson.getLock(\"order:\" + orderId);\nlock.lock();   // 未指定 leaseTime\ntry { /* 扣库存 30s */ } finally { lock.unlock(); }", "options": [{"k": "A", "t": "锁 30 秒后一定过期，业务未执行完也会被其他线程抢到"}, {"k": "B", "t": "Redisson 启动看门狗，每 10s 续期到 30s，业务未结束不会过期"}, {"k": "C", "t": "未指定 leaseTime 等于不超时，锁永远不过期只能手动 unlock"}, {"k": "D", "t": "只有显式 lock(30, TimeUnit.SECONDS) 才会触发续期"}], "answer": "B", "explain": "Redisson 在 lock() 未指定 leaseTime 时默认加锁 30s 并启动看门狗，每隔 lockWatchdogTimeout/3（默认 10s）把有效期续到 30s，直到 unlock。显式指定 leaseTime 反而不再自动续期，需自己管理过期。", "kaodian": "AI后端能力-高并发与中间件层-Redis分布式锁看门狗续期"}, {"no": 2, "type": "single", "body": "下表含逻辑删除字段 deleted 与业务联合唯一索引，已逻辑删除 order_no='A0001' 的行后，再插入 order_no='A0001' 会怎样？", "code": "CREATE TABLE t_order (\n  id BIGINT,\n  order_no VARCHAR(32),\n  deleted TINYINT DEFAULT 0,\n  UNIQUE KEY uk_order_no (order_no, deleted)\n);\nUPDATE t_order SET deleted=1 WHERE order_no='A0001';  -- 逻辑删除\nINSERT INTO t_order(order_no,deleted) VALUES('A0001',0);", "options": [{"k": "A", "t": "MyBatis-Plus 会自动把唯一索引改为普通索引"}, {"k": "B", "t": "插入成功，唯一索引含 deleted，两行 (A0001,0) 与 (A0001,1) 不冲突"}, {"k": "C", "t": "插入失败，唯一索引只认 order_no 导致与已删除行冲突"}, {"k": "D", "t": "逻辑删除字段必须排除在唯一索引外否则框架报错"}], "answer": "B", "explain": "把 deleted 纳入联合唯一索引 (order_no, deleted) 后，已删除行是 (B0001,1)、新插入是 (B0001,0)，两行不同故不冲突，这是逻辑删除+唯一约束的常见兼容写法。若只用 (order_no) 单列唯一索引则会冲突。", "kaodian": "AI后端能力-数据存储与ORM层-MP逻辑删除与唯一索引共存"}, {"no": 3, "type": "single", "body": "消费者组首次启动且 __consumer_offsets 中无该 group 位移时，auto.offset.reset=earliest 与 latest 的行为差异是？", "code": "props.put(\"auto.offset.reset\", \"earliest\"); // 或 latest\nKafkaConsumer<String,String> c = new KafkaConsumer<>(props);\nc.subscribe(Collections.singletonList(\"topicA\"));\nc.poll(Duration.ofMillis(100));", "options": [{"k": "A", "t": "两者无区别，都从最后一次提交的位移开始"}, {"k": "B", "t": "仅 latest 会触发 Rebalance，earliest 不会"}, {"k": "C", "t": "earliest 从最新位点开始，latest 从最旧位点开始"}, {"k": "D", "t": "earliest 从分区最早消息开始消费，latest 从启动后新产生的消息开始"}], "answer": "D", "explain": "auto.offset.reset 仅在『组位移不存在』时生效：earliest=从分区头部（最早未过期消息）消费，latest=只消费启动之后新写入的消息。一旦提交过位移，重置参数不再起作用。", "kaodian": "AI后端能力-高并发与中间件层-Kafka位移重置与重复消费"}, {"no": 4, "type": "single", "body": "下面两个 @Async 方法，未指定线程池名时它们分别运行在哪个线程池？", "code": "@Configuration\n@EnableAsync\npublic class AsyncConfig {\n  @Bean(\"bizExecutor\") public Executor biz() { return ...; }\n}\n@Service\npublic class S {\n  @Async public void a() {}             // 未指定\n  @Async(\"bizExecutor\") public void b() {}  // 指定\n}", "options": [{"k": "A", "t": "a 和 b 都用默认 ThreadPoolTaskExecutor 名为 taskExecutor 的池"}, {"k": "B", "t": "a 直接在当前调用线程同步执行，b 用 bizExecutor"}, {"k": "C", "t": "两个都因无默认池而抛 NoSuchBeanDefinitionException"}, {"k": "D", "t": "a 用 SimpleAsyncTaskExecutor（每次 new 线程），b 用 bizExecutor"}], "answer": "D", "explain": "未指定线程池名时，Spring 找名为 taskExecutor 的 Bean；若不存在则用 SimpleAsyncTaskExecutor（每次调用 new 一个线程，无界、易 OOM）。b 显式用 bizExecutor。生产务必自定义并给 Bean 起名 taskExecutor。", "kaodian": "AI后端能力-应用框架层-@Async自定义线程池隔离"}, {"no": 5, "type": "single", "body": "下面代码的依次输出顺序是？", "code": "console.log(1);\nPromise.resolve().then(() => console.log(2));\nsetTimeout(() => console.log(3), 0);\nconsole.log(4);", "options": [{"k": "A", "t": "1 2 3 4"}, {"k": "B", "t": "1 4 2 3"}, {"k": "C", "t": "1 4 3 2"}, {"k": "D", "t": "1 2 4 3"}], "answer": "B", "explain": "同步代码先执行：1、4；then 回调进微任务队列，setTimeout 进宏任务队列；当前宏任务结束后先清空微任务（2），再取下一个宏任务（3）。顺序 1→4→2→3。", "kaodian": "AI前端能力-语言与运行时-Promise微任务执行顺序"}, {"no": 6, "type": "single", "body": "用 reactive 包裹嵌套对象，直接给深层属性赋值能否触发响应式更新？", "code": "const state = reactive({ user: { name: 'a' } });\nstate.user.name = 'b';  // 直接改深层", "options": [{"k": "A", "t": "需要 Vue.set(state.user, 'name', 'b')"}, {"k": "B", "t": "能，reactive 是深层代理，深层属性变更同样触发更新"}, {"k": "C", "t": "不能，必须 state.user = { name: 'b' } 整体替换"}, {"k": "D", "t": "不能，reactive 只代理第一层"}], "answer": "B", "explain": "reactive 通过 Proxy 递归代理整个对象树，深层属性读取时会被惰性转成响应式，直接 state.user.name='b' 能触发更新。Vue2 才需要 Vue.set，Vue3 不需要。", "kaodian": "AI前端能力-语言与运行时-Proxy深层对象响应式"}, {"no": 7, "type": "single", "body": "容器宽度 300px，下面三个子项（flex:1 1 0）的最终宽度分别是？", "code": ".box{display:flex;width:300px}\n.a{width:100px;flex:1 1 0}\n.b{width:100px;flex:1 1 0}\n.c{width:100px;flex:1 1 0}", "options": [{"k": "A", "t": "各 100px，flex-basis:0 使其平分 300px → 各 100px"}, {"k": "B", "t": "a=150 b=100 c=50"}, {"k": "C", "t": "各 100px（宽度由 width 决定）"}, {"k": "D", "t": "各 100px，因无溢出也无剩余 grow 不生效"}], "answer": "A", "explain": "flex-basis:0 让基准尺寸为 0，剩余 300px 由三者 flex-grow:1 等量分配，最终各 100px。注意 grow 只在『容器有剩余空间』时分配，此处总 basis=0<300 故有剩余。", "kaodian": "AI前端能力-前端基础与渲染引擎-Flex收缩因子计算"}, {"no": 8, "type": "single", "body": "用 AbortController 取消 Axios 请求，取消后 promise 的状态与错误是？", "code": "const ctrl = new AbortController();\naxios.get('/api', { signal: ctrl.signal })\n  .catch(e => console.log(e.name));\nctrl.abort();", "options": [{"k": "A", "t": "promise reject，e.name === 'CanceledError'（Axios 包装）"}, {"k": "B", "t": "promise 永远 pending"}, {"k": "C", "t": "请求被浏览器缓存，不再发出"}, {"k": "D", "t": "请求照常返回，e 为 undefined"}], "answer": "A", "explain": "调用 ctrl.abort() 后，绑定 signal 的请求会被取消，Axios 把原生 AbortError 包装为 CanceledError（旧版 CancelToken 为 Cancel），catch 中 e.name 为 'CanceledError'。", "kaodian": "AI前端能力-网络与BFF架构-Axios请求取消AbortController"}, {"no": 9, "type": "single", "body": "在 Playwright 中，下列哪种定位器最稳健、最不易因文案/结构微调而失效？", "code": "page.getByText('提交订单');\npage.locator('#btn-submit');\npage.getByRole('button', { name: '提交订单' });\npage.locator('div > div > button:nth-child(3)');", "options": [{"k": "A", "t": "getByText('提交订单')"}, {"k": "B", "t": "locator('#btn-submit') 依赖 id"}, {"k": "C", "t": "getByRole('button',{name}) 基于可访问性角色"}, {"k": "D", "t": "div>div>button:nth-child(3) 层级路径最精确"}], "answer": "C", "explain": "基于可访问性角色的 getByRole 同时校验语义与可见性，对文案/样式微调更鲁棒。纯文本依赖文案，CSS 层级路径最脆（DOM 结构一变就断），id 依赖前端约定。", "kaodian": "AI质量保障-自动化测试-Playwright语义化定位器"}, {"no": 10, "type": "single", "body": "接口测试中对鉴权 Token 的校验，最该覆盖的是？", "code": "GET /api/orders\nAuthorization: Bearer <JWT>\n// 返回 200 + 数据", "options": [{"k": "A", "t": "验证响应体字段个数"}, {"k": "B", "t": "只验证带 Token 时返回 200"}, {"k": "C", "t": "验证带 Token 200、缺失 401、过期 401、越权访问他人数据 403"}, {"k": "D", "t": "验证 Token 的字符串长度"}], "answer": "C", "explain": "鉴权接口测试需覆盖正常（带有效 Token 200）、异常（缺失/过期/伪造 Token 401）与越权（B 用户 Token 访问 C 数据应 403）。只验 200 属于假阳性用例。", "kaodian": "AI质量保障-接口测试-接口鉴权Token测试"}, {"no": 11, "type": "single", "body": "某输入框允许 1~20 个字符，下列用例设计最符合边界值分析法的是？", "code": "规则：用户名长度 1~20 字符", "options": [{"k": "A", "t": "测 'a' 与 20 个 a 两个极值"}, {"k": "B", "t": "随机生成 100 个字符串"}, {"k": "C", "t": "测 5、10、15 三个中间值"}, {"k": "D", "t": "测 0、1、20、21 四个边界及越界值"}], "answer": "D", "explain": "边界值法聚焦边界及其邻域：上点 1、20，离点 0（下溢）、21（上溢），共 0/1/20/21。选项 C 是典型值法，A 缺越界，B 是随机法。", "kaodian": "AI质量保障-软件测试理论与质量体系-边界值与等价类设计"}, {"no": 12, "type": "single", "body": "事务回滚后，AUTO_INCREMENT 自增主键会出现什么现象？", "code": "CREATE TABLE t(id BIGINT AUTO_INCREMENT PRIMARY KEY, ...);\n-- 事务1: INSERT 拿到 id=10，回滚\n-- 事务2: INSERT 拿到 id=11 并提交\nSELECT id FROM t;  -- 结果？", "options": [{"k": "A", "t": "id=11，自增计数器不随回滚回退，出现空洞 10"}, {"k": "B", "t": "id=10，回滚会把计数器也退回 9"}, {"k": "C", "t": "数据库报错，自增与事务冲突"}, {"k": "D", "t": "id 从 10 重新开始，连续无空洞"}], "answer": "A", "explain": "AUTO_INCREMENT 计数器是实例/表级别的，INSERT 一旦分配 id 就会推进，事务回滚不会回退它，因此回滚的 id 永久成空洞。这是正常现象，不影响功能与唯一性。", "kaodian": "AI后端能力-数据存储与ORM层-自增主键空洞与回滚"}, {"no": 13, "type": "single", "body": "下面配置中，在 Nacos 上修改 timeout 配置后，哪个字段会被动态刷新？", "code": "@RefreshScope\n@Component\npublic class Cfg {\n  @Value(\"${app.timeout:1000}\") private int timeout; // 字段A\n  private final int fixed = 2000;                    // 字段B\n}", "options": [{"k": "A", "t": "字段A被刷新，字段B是常量不刷新"}, {"k": "B", "t": "字段A和字段B都被刷新"}, {"k": "C", "t": "都不刷新，@RefreshScope 只刷新 @ConfigurationProperties 绑定的 Bean"}, {"k": "D", "t": "只有重新部署才能生效"}], "answer": "A", "explain": "@RefreshScope 让 Bean 在配置刷新时重建，@Value 注入的 timeout 会随 Nacos 变更更新；fixed 是 final 常量，编译期确定，与配置无关。@RefreshScope 对 @ConfigurationProperties 同样生效。", "kaodian": "AI后端能力-微服务与云原生层-Nacos@RefreshScope刷新粒度"}, {"no": 14, "type": "single", "body": "下面统计偶数的代码在并行流下会出问题，原因是？", "code": "List<Integer> src = Arrays.asList(1,2,3,4,5,6);\nList<Integer> even = new ArrayList<>();\nsrc.parallelStream().forEach(x -> {\n  if (x % 2 == 0) even.add(x);  // 共享 ArrayList\n});\nSystem.out.println(even.size());", "options": [{"k": "A", "t": "lambda 内不能修改外部集合"}, {"k": "B", "t": "parallelStream 一定串行执行，结果恒为 0"}, {"k": "C", "t": "ArrayList 非线程安全，多线程 add 会丢数据或抛异常"}, {"k": "D", "t": "parallelStream 不支持 filter"}], "answer": "C", "explain": "parallelStream 多线程并发操作非线程安全的 ArrayList，会出现数据丢失甚至 ConcurrentModificationException/数组越界。应改用 collect(toList()) 或加同步，或使用线程安全容器。", "kaodian": "AI后端能力-语言与计算层-parallelStream共享变量线程安全"}, {"no": 15, "type": "single", "body": "下面 TS 函数调用 fun(['a','b']) 的返回类型推断为？", "code": "function fun<T>(arr: T[]): T { return arr[0]; }\nconst r = fun(['a', 'b']);", "options": [{"k": "A", "t": "'a' | 'b'"}, {"k": "B", "t": "any"}, {"k": "C", "t": "string"}, {"k": "D", "t": "string[]"}], "answer": "C", "explain": "泛型 T 由实参 ['a','b']（string[]）推断为 string，返回类型 T 即 string。arr[0] 是 string 元素类型，不是数组本身。", "kaodian": "AI前端能力-语言与运行时-TypeScript泛型约束推断"}, {"no": 16, "type": "single", "body": "下面组合式函数返回计数，在组件中使用时是否响应式？", "code": "export function useCounter() {\n  const count = ref(0);\n  const inc = () => count.value++;\n  return { count, inc };\n}\n// 组件\nsetup() { const { count, inc } = useCounter(); }", "options": [{"k": "A", "t": "否，函数返回后 ref 失去响应式"}, {"k": "B", "t": "否，需要 return reactive 才行"}, {"k": "C", "t": "仅 inc 响应式，count 不是"}, {"k": "D", "t": "是，count 是 ref 且被原样返回，模板中 count 自动解包并响应式"}], "answer": "D", "explain": "组合式函数返回 ref 对象，组件 setup 解构后 count 仍是同一个 ref，模板自动解包且保持响应式。这是 composable 复用状态的标准写法。", "kaodian": "AI前端能力-前端生态-Vue3组合式函数composable"}, {"no": 17, "type": "single", "body": "父元素设 overflow:hidden 后，内部浮动子元素造成高度塌陷的问题会？", "code": ".parent{overflow:hidden}\n.child{float:left;height:50px}", "options": [{"k": "A", "t": "依然塌陷，overflow 与浮动无关"}, {"k": "B", "t": "被解决，overflow 非 visible 会触发 BFC 包含浮动"}, {"k": "C", "t": "子元素不再浮动"}, {"k": "D", "t": "父元素高度变 0"}], "answer": "B", "explain": "overflow 取值非 visible（hidden/auto/scroll）会使元素建立 BFC，BFC 会包含其内部浮动，从而撑开父高度、清除浮动塌陷。这是经典 clearfix 替代方案。", "kaodian": "AI前端能力-前端基础与渲染引擎-BFC清除浮动"}, {"no": 18, "type": "single", "body": "缺陷从『新建』流转，下列状态迁移正确的是？", "code": "缺陷状态：新建 → 打开 → 修复 → 关闭", "options": [{"k": "A", "t": "修复 → 新建"}, {"k": "B", "t": "新建 → 直接关闭（未修复）"}, {"k": "C", "t": "新建 → 打开(指派) → 修复(开发) → 关闭(验证通过)"}, {"k": "D", "t": "打开 → 新建（回退）"}], "answer": "C", "explain": "标准生命周期：新建(提交)→打开(确认并指派)→修复(开发解决)→关闭(测试验证通过)。直接关闭未修复、或修复后回到新建都是错误流转。", "kaodian": "AI质量保障-软件测试理论与质量体系-缺陷生命周期状态流转"}, {"no": 19, "type": "single", "body": "团队想把 UI 自动化、接口自动化、单元测试分层投入，最符合测试金字塔的是？", "code": "资源有限，需分配自动化投入", "options": [{"k": "A", "t": "三者等量"}, {"k": "B", "t": "只做 UI 自动化"}, {"k": "C", "t": "UI 最多、接口次之、单元最少"}, {"k": "D", "t": "单元最多、接口居中、UI 最少"}], "answer": "D", "explain": "测试金字塔要求底层单元测试数量最多、成本最低、最快；接口层居中；UI 层最少（最慢最脆）。倒金字塔（UI 为主）维护成本高、易 flaky。", "kaodian": "AI质量保障-自动化测试-自动化测试金字塔分层"}, {"no": 20, "type": "single", "body": "下列做法中属于『测试左移』的是？", "code": "研发流程：需求 → 设计 → 编码 → 测试 → 上线", "options": [{"k": "A", "t": "在需求评审阶段测试参与写验收标准/用例"}, {"k": "B", "t": "只做生产环境监控"}, {"k": "C", "t": "把测试全交给外包"}, {"k": "D", "t": "上线后做全量回归"}], "answer": "A", "explain": "测试左移=把测试活动前移到需求/设计阶段，如测试早期参与需求评审、写可测试验收标准、做静态扫描。D/B 是右移，C 不解决质量内建。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试左移实践"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "保证『数据库与缓存一致性』的常见方案有哪些？（多选、少选、错选均不得分）", "code": "Cache-Aside：先更新 DB，再删缓存\n延迟双删：更新前删、更新后延迟再删\nCanal：监听 binlog 异步删缓存", "options": [{"k": "A", "t": "Cache-Aside（更新 DB 后删缓存）"}, {"k": "B", "t": "延迟双删（更新前后各删一次，中间延迟）"}, {"k": "C", "t": "Canal 订阅 binlog 异步淘汰缓存"}, {"k": "D", "t": "Read-Through：缓存未命中由缓存层自动回源"}], "answer": ["A", "B", "C"], "explain": "三者都是业界常用的一致性手段：Cache-Aside 最直接；延迟双删降低并发读写导致的脏数据窗口；Canal 基于 binlog 解耦、近实时。Read-Through 是缓存访问模式，不解决写一致性，故不选。", "kaodian": "AI后端能力-高并发与中间件层-缓存与数据库一致性方案"}, {"no": 2, "type": "multi", "body": "多实例部署下，避免定时任务被重复执行的互斥方案有哪些？（多选、少选、错选均不得分）", "code": "@Scheduled(cron = \"0 0 * * * ?\")  // 每实例都会触发", "options": [{"k": "A", "t": "XXL-JOB / PowerJob 等调度中心统一派发"}, {"k": "B", "t": "Redis SET NX 抢占执行权"}, {"k": "C", "t": "给每个实例配不同 cron 时间错开"}, {"k": "D", "t": "ShedLock（DB/Redis 分布式锁）"}], "answer": ["A", "B", "D"], "explain": "ShedLock、调度中心（XXL-JOB）、Redis 锁都是标准互斥方案。C 配不同 cron 只是规避、非真正互斥，且破坏统一节奏，不推荐作为方案。", "kaodian": "AI后端能力-微服务与云原生层-分布式定时任务互斥"}, {"no": 3, "type": "multi", "body": "实现消息『不丢』需覆盖的三个环节是？（多选、少选、错选均不得分）", "code": "Producer → Broker → Consumer", "options": [{"k": "A", "t": "消费者手动 ack 且处理完再提交位移"}, {"k": "B", "t": "生产者发送后立刻关闭连接省资源"}, {"k": "C", "t": "生产者确认（acks=all + 重试）"}, {"k": "D", "t": "Broker 持久化（副本同步/队列落盘）"}], "answer": ["A", "C", "D"], "explain": "可靠投递三环节：①生产者收到 ack（acks=all、开启重试）；②Broker 多副本持久化；③消费者处理成功后再手动提交位移（避免提前 commit 导致宕机丢消息）。B 关闭连接会导致未确认消息丢失。", "kaodian": "AI后端能力-高并发与中间件层-消息可靠投递三环节"}, {"no": 4, "type": "multi", "body": "下列前端跨域（CORS）相关说法正确的有？（多选、少选、错选均不得分）", "code": "浏览器同源策略限制跨域请求", "options": [{"k": "A", "t": "JSONP 只支持 POST 跨域"}, {"k": "B", "t": "服务端设 Access-Control-Allow-Origin 放行指定源"}, {"k": "C", "t": "开发环境可用 Vite/devServer proxy 反向代理规避"}, {"k": "D", "t": "带凭证的请求 Allow-Origin 不能为 *，须显式指定源"}], "answer": ["B", "C", "D"], "explain": "B/C/D 正确：CORS 由服务端响应头放行；proxy 在开发期把跨域变同源；带 Cookie 的凭证请求 Allow-Origin 必须具体源、不能为 *。A 错，JSONP 只能用 GET。", "kaodian": "AI前端能力-网络与BFF架构-跨域解决方案对比"}, {"no": 5, "type": "multi", "body": "下列哪些情况会导致 Vue3 响应式『失效』？（多选、少选、错选均不得分）", "code": "const state = reactive({...})", "options": [{"k": "A", "t": "reactive 包裹基础类型（如 reactive(0)）"}, {"k": "B", "t": "解构 reactive 对象丢失响应式"}, {"k": "C", "t": "ref 数组在模板中不解包直接当普通数组用"}, {"k": "D", "t": "直接给 reactive 对象新增未在初始声明的属性"}], "answer": ["A", "B"], "explain": "A：reactive 只接受对象，基础类型用 ref；B：解构会断开响应链接，应用 toRefs。C 错，模板中 ref 数组会自动解包；D 错，Vue3 Proxy 能拦截新增属性并保持响应式。", "kaodian": "AI前端能力-语言与运行时-Vue3响应式丢失陷阱"}, {"no": 6, "type": "multi", "body": "回归测试范围筛选可依据哪些维度？（多选、少选、错选均不得分）", "code": "需求变更后需确定回归集", "options": [{"k": "A", "t": "历史缺陷高发模块优先"}, {"k": "B", "t": "需求风险等级与业务重要性"}, {"k": "C", "t": "只跑本次新增功能的用例"}, {"k": "D", "t": "变更代码的影响面/调用链分析"}], "answer": ["A", "B", "D"], "explain": "回归集应综合影响面（代码/接口依赖）、风险（核心链路、历史易错点）、业务重要性来圈定。C 只跑新增用例会漏掉受影响的老功能，不是回归。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归测试范围筛选"}, {"no": 7, "type": "multi", "body": "CI/CD 流水线中的『质量门禁』通常包含哪些？（多选、少选、错选均不得分）", "code": "门禁不达标则阻断合并/发布", "options": [{"k": "A", "t": "接口/契约自动化用例通过"}, {"k": "B", "t": "人工代码评审已通过（Required Reviewers）"}, {"k": "C", "t": "单元测试覆盖率阈值"}, {"k": "D", "t": "静态扫描（SonarQube）严重问题数为 0"}], "answer": ["A", "B", "C", "D"], "explain": "质量门禁是自动+人工的组合闸口：单测覆盖率、静态扫描阻断、自动化接口用例通过、Required Reviewers 评审通过，任一不达标即卡住流水线。", "kaodian": "AI质量保障-CI/CD与质量门禁-流水线质量门禁构成"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "@Transactional 标注在 private 方法上，事务依然会生效。", "code": "@Service\npublic class S {\n  @Transactional\n  private void p() { /* ... */ }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "Spring 事务基于 AOP 代理，只能拦截 public 方法；private 方法不会被代理增强，@Transactional 失效，方法内异常也不会回滚。", "kaodian": "AI后端能力-应用框架层-@Transactional代理仅拦截public"}, {"no": 2, "type": "judge", "body": "在 Vue3 中，同一元素上 v-for 的优先级高于 v-if。", "code": "<li v-for=\"u in users\" v-if=\"u.active\" :key=\"u.id\">{{u.name}}</li>", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Vue3 中 v-for 优先级高于 v-if（与 Vue2 相反），二者同元素时应避免混用，改用 template 包裹或 computed 过滤。", "kaodian": "AI前端能力-语言与运行时-Vue3 v-if与v-for优先级"}, {"no": 3, "type": "judge", "body": "对元素从 display:none 切到 display:block，同时加 transition 也能平滑过渡。", "code": ".x{display:none;transition:opacity .3s}\n.x.show{display:block;opacity:1}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "display 不在可过渡属性之列，none↔block 是离散切换、无法过渡。应先 display:block 再在下一帧改 opacity/transform（用 requestAnimationFrame 或过渡 class 延迟）才能有动画。", "kaodian": "AI前端能力-前端基础与渲染引擎-display切换transition失效"}, {"no": 4, "type": "judge", "body": "在自动化测试中，必须用断言(expect/assert)来判定用例是否通过，不能只靠 console.log 打印结果。", "code": "console.log(res.status === 200);", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "断言由测试框架驱动，失败时让用例标红并计入失败数；console.log 只是输出，不阻断、不统计，CI 下无人看。", "kaodian": "AI质量保障-自动化测试-console.log不能代替断言"}, {"no": 5, "type": "judge", "body": "自动化测试用例之间应当相互独立，不依赖执行顺序与共享状态。", "code": "testA(); testB();  // 各自前置/清理", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "用例独立性是可重复、可并行、易定位失败的前提。应各自准备前置数据并在结束后清理，避免用例间通过数据库/全局变量形成隐性依赖。", "kaodian": "AI质量保障-自动化测试-自动化用例独立性"}, {"no": 6, "type": "judge", "body": "代码覆盖率达到 100% 就说明程序没有缺陷。", "code": "coverage = 100%", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "覆盖率只表示代码被执行过，不保证分支逻辑正确、边界处理无误、业务语义正确。100% 行覆盖仍可能有逻辑/边界/集成缺陷。", "kaodian": "AI质量保障-软件测试理论与质量体系-覆盖率局限"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
