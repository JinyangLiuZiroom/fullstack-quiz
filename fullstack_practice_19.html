<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2329; margin: 0; padding: 24px 24px 96px; line-height: 1.65; }
  .container { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }

    box-shadow: 0 1px 3px rgba(0,0,0,.06); font-size: 14px; color: #41464b; }
  .meta b { color: #1664ff; }
  .backlink { display:inline-block; margin: 4px 0 10px; color:#1664ff; text-decoration:none; font-size:14px; }
  .backlink:hover { text-decoration: underline; }
  .section { margin-top: 28px; }
  .section h2 { font-size: 18px; margin: 0 0 12px; padding-left: 10px; border-left: 4px solid #1664ff; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

  .card.wrong { box-shadow: 0 0 0 2px #ff4d4f inset, 0 1px 3px rgba(0,0,0,.06); }

  .q-no { font-weight: 700; font-size: 15px; }

  .tag-judge  { background: #fde8f3; color: #c41d7f; }
  .tag-fill   { background: #e9f9ee; color: #1a9e4b; }
  .kaodian { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; background: #f0f2f5; color: #646a73; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-badge { font-size:12px; padding:2px 9px; border-radius:4px; font-weight:700; margin-left:auto; }

  .code { background: #2b2f36; color: #e6e6e6; border-radius: 8px; padding: 12px 14px;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; overflow-x: auto; margin: 10px 0; white-space: pre; }

  .opt { display: flex; align-items:flex-start; gap:8px; padding: 9px 12px; border-radius: 8px; margin: 6px 0;
    background: #f7f8fa; border: 1.5px solid transparent; font-size: 14px; cursor: pointer; transition: all .12s; }
  .opt:hover { background: #eef2f7; }
  .opt .k { font-weight:700; color:#1664ff; min-width: 16px; }
  .opt.sel { background: #e8f3ff; border-color: #1664ff; }
  .opt.correct { background: #f0f9eb; border-color: #52c41a; }
  .opt.correct .k { color:#52c41a; }
  .opt.wrong { background: #fff1f0; border-color: #ff4d4f; }
  .opt.wrong .k { color:#ff4d4f; }
  .opt.locked { cursor: default; }
  .q-actions { margin-top: 10px; }
  .q-check { background:#1664ff; color:#fff; border:none; border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; font-weight:600; }
  .q-check:hover { background:#0e4fd8; }
  .card.graded .q-check { display:none; }
  .blank { border:none; border-bottom: 1.5px solid #1664ff; background:#f7f8fa; padding: 3px 8px; margin: 0 4px;
    font-size:14px; min-width: 120px; border-radius:4px 4px 0 0; }
  .blank.correct { border-bottom-color:#52c41a; background:#f0f9eb; }
  .blank.wrong { border-bottom-color:#ff4d4f; background:#fff1f0; }
  .answer { display: none; margin-top: 14px; padding: 14px; background: #f0f9eb;
    border-left: 4px solid #67c23a; border-radius: 6px; font-size: 14px; }
  .answer.show { display: block; }
  .answer .ans { font-weight: 700; color: #1a9e4b; margin-bottom: 8px; font-size: 15px; }
  .answer .label { font-weight: 700; }
  .footer { text-align: center; color: #9aa0a6; font-size: 13px; margin: 30px 0 10px; }
  .bar { position: fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #e5e6eb;
    box-shadow: 0 -2px 10px rgba(0,0,0,.05); padding: 10px 16px; display:flex; gap:10px; align-items:center; justify-content:center; z-index: 50; }
  .bar .prog { font-size: 14px; color:#41464b; margin-right: auto; }
  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }
  .bar .userbox a { color:#1664ff; cursor:pointer; text-decoration:none; }
  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }
  .result-panel.show { display:block; }
  .result-panel .score { font-size:30px; font-weight:800; color:#1664ff; }
  .result-panel .score small { font-size:15px; color:#646a73; font-weight:500; }
  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }
  .result-panel .wrongs a { display:inline-block; margin:3px 6px 3px 0; padding:2px 8px; background:#fff1f0; color:#ff4d4f; border-radius:4px; text-decoration:none; font-weight:600; }
  @media (max-width:600px) {
    body { padding: 12px 12px 100px; }
    .container { max-width: 100%; }
    h1 { font-size: 20px; }
    .meta { padding: 10px 12px; font-size: 13px; }
    .card { padding: 14px 12px; margin-bottom: 10px; }
    .q-body { font-size: 14px; }
    .code { font-size: 11px; padding: 10px 10px; }
    .opt { padding: 8px 10px; font-size: 13px; }
    .bar { padding: 8px 10px; gap: 6px; }
    .bar .prog { font-size: 12px; }
    .btn { padding: 7px 12px; font-size: 13px; }
    .section h2 { font-size: 16px; }
    .answer { font-size: 13px; }
  }

<script type="application/json" id="quizData">{"id": "vol19", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷为「自如大学 7月认证考」弱项专项：对齐认证考均分权重（后端≈33% / 前端≈33% / 测试≈33%），全部 33 题针对真题错题与未覆盖考点（MQ基础、集合错误排查、多表关联、RedisTemplate、LambdaQueryWrapper、缓存流程、Spring MVC、Axios配置/拦截器、Vue模板/响应式、DevTools、CSS布局、表单验证、AI辅助测试/缺陷分析、接口类型、冒烟测试、质量门禁、JUnit5）。每题给代码/配置/日志片段，问执行结果 / 补全缺失代码 / 判断框架用法或架构规范正误。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "在 RabbitMQ 中，某 Topic 交换机绑定队列时使用的路由键（binding key）如下。生产者发送消息携带的 routing key 为 order.payment.success，请问哪些队列能收到该消息？", "code": "队列Q1 binding key: order.#\n队列Q2 binding key: *.payment.*\n队列Q3 binding key: order.payment.*\n队列Q4 binding key: #", "options": [{"k": "A", "t": "仅 Q1、Q3、Q4"}, {"k": "B", "t": "仅 Q2、Q3、Q4"}, {"k": "C", "t": "Q1、Q2、Q3、Q4 全部"}, {"k": "D", "t": "仅 Q3、Q4"}], "answer": ["C"], "explain": "Topic 中 # 匹配零个或多个词，* 匹配恰好一个词，词以点分隔。routing key = order.payment.success（3 个词）。Q1 order.#：# 匹配 payment.success，命中；Q2 *.payment.*：第一词任意、第二词 payment、第三词任意，命中；Q3 order.payment.*：order.payment + 任意第三词，命中；Q4 #：匹配任意，命中。故全部收到。", "kaodian": "AI后端能力-高并发与中间件层-MQ基础概念"}, {"no": 2, "type": "single", "body": "某同事写下如下代码对用户 ID 列表去重并保持插入顺序，运行时却抛出了 ConcurrentModificationException。问题根源是？", "code": "List<String> ids = new ArrayList<>(Arrays.asList(\"a\",\"b\",\"a\",\"c\"));\nfor (String id : ids) {\n    if (id.equals(\"a\")) {\n        ids.remove(id); // 在增强 for 循环中直接修改集合\n    }\n}", "options": [{"k": "A", "t": "ArrayList 不支持存储重复元素，应改用 Set"}, {"k": "B", "t": "增强 for 循环底层使用 Iterator，循环中直接调用集合自身的 remove 会触发 fail-fast 抛出 ConcurrentModificationException"}, {"k": "C", "t": "remove 只能删除首个匹配元素，第二次遇到 \"a\" 时会抛异常"}, {"k": "D", "t": "Arrays.asList 返回的是定长列表，不能调用 remove"}], "answer": ["B"], "explain": "ArrayList 的增强 for 循环实际由 Iterator 遍历，Iterator 每次 next() 会检查 modCount。循环中调用 list.remove 直接改了 modCount 却未同步给 Iterator 的 expectedModCount，下次 next() 即抛 ConcurrentModificationException（fail-fast）。正确做法是用 Iterator.remove() 或 removeIf。A/C 错；D 虽定长不能 remove 是另一问题，并非此处异常根因。", "kaodian": "AI后端能力-语言与计算层-常见集合错误排查"}, {"no": 3, "type": "single", "body": "现有订单表 orders 与用户表 users，需查询「已支付且金额大于 100 的订单及其下单用户姓名」。下列 SQL 写法中，在正确性与性能上最合理的是？", "code": "-- 方案A\nSELECT o.order_id, u.name FROM orders o, users u\nWHERE o.user_id = u.id AND o.status='PAID' AND o.amount > 100;\n-- 方案B\nSELECT o.order_id, u.name FROM orders o\nJOIN users u ON o.user_id = u.id\nWHERE o.status='PAID' AND o.amount > 100;\n-- 方案C\nSELECT o.order_id, (SELECT u.name FROM users u WHERE u.id=o.user_id) name\nFROM orders o WHERE o.status='PAID' AND o.amount>100;", "options": [{"k": "A", "t": "方案A，隐式内连接最简洁"}, {"k": "B", "t": "方案B，显式 JOIN 语义清晰且优化器易生成最优执行计划，是推荐写法"}, {"k": "C", "t": "方案C，子查询一定比 JOIN 快"}, {"k": "D", "t": "三者等价，任选其一即可"}], "answer": ["B"], "explain": "显式 INNER JOIN（方案B）语义明确，优化器能更好地选择连接顺序与索引（应在 orders.status、orders.amount、orders.user_id 及 users.id 上建索引）。方案A 是 SQL-89 隐式连接，可读性差且易误写成笛卡尔积。方案C 的相关子查询对 orders 每行都执行一次子查询，大表下性能通常更差。", "kaodian": "AI后端能力-数据存储与持久化层-多表关联基础"}, {"no": 4, "type": "single", "body": "使用 Spring Data Redis 的 StringRedisTemplate 实现「查看余量并扣减」逻辑。下列实现存在什么隐患？", "code": "public boolean deduct(String key, int count) {\n    String val = stringRedisTemplate.opsForValue().get(key);\n    if (val == null) return false;\n    int left = Integer.parseInt(val);\n    if (left < count) return false;\n    stringRedisTemplate.opsForValue().set(key, String.valueOf(left - count));\n    return true;\n}", "options": [{"k": "A", "t": "get 返回字符串可能为 null，应做空指针保护"}, {"k": "B", "t": "这是典型的「先读后写」非原子操作，并发下会出现超卖（竞态条件），应使用 decrement 或 Lua 脚本保证原子性"}, {"k": "C", "t": "StringRedisTemplate 只能存字符串，不能直接存数字，需改用 RedisTemplate"}, {"k": "D", "t": "set 方法默认不持久化，应加 EXPIRE"}], "answer": ["B"], "explain": "get→判断→set 三步非原子，多个线程同时读到相同 left 后各自减 1 写回，结果只减了 1 而非并发数，导致超卖。应使用 opsForValue().decrement(key, count)（原子自减，注意返回值是否为负）或在 Lua 脚本中完成「判断+扣减」，或用分布式锁。A 的空指针已处理；C 错（StringRedisTemplate 存数字字符串正确）；D 的过期与本题竞态无关。", "kaodian": "AI后端能力-高并发与中间件层-RedisTemplate基础使用"}, {"no": 5, "type": "single", "body": "使用 MyBatis-Plus 查询「状态为 ENABLED 且创建时间在近 7 天内」的用户，并只返回 id 与 username 两列。下列写法正确的是？", "code": "new LambdaQueryWrapper<User>()\n  .eq(User::getStatus, \"ENABLED\")\n  .ge(User::getCreateTime, LocalDate.now().minusDays(7))\n  .select(User::getId, User::getUsername);", "options": [{"k": "A", "t": "写法正确：LambdaQueryWrapper 用方法引用避免字段名硬编码，select 指定返回列"}, {"k": "B", "t": "必须改用 QueryWrapper 才能用 select"}, {"k": "C", "t": "LambdaQueryWrapper 不支持时间范围查询 ge"}, {"k": "D", "t": "select 只能写在最后，且必须配合 last 使用"}], "answer": ["A"], "explain": "LambdaQueryWrapper 的 select(方法引用...) 可类型安全地指定返回列，避免字符串硬编码字段名，编译期即可发现字段错误；eq/ge 等条件方法均受支持。B/C/D 均错。注意 create_time 比较建议用 LocalDateTime 或确保数据库日期类型匹配。", "kaodian": "AI后端能力-数据存储与持久化层-LambdaQueryWrapper/LambdaUpdateWrapper"}, {"no": 6, "type": "single", "body": "某读多写少场景采用 Cache-Aside 模式。下列「更新数据」的操作顺序，哪种在绝大多数并发下最不易产生长期脏数据？", "code": "方案1：先更新数据库，再删除缓存\n方案2：先删除缓存，再更新数据库\n方案3：先更新数据库，再更新缓存", "options": [{"k": "A", "t": "方案1（更新 DB→删缓存），配合「读时回填」可接受极小概率脏数据，是业界常用做法"}, {"k": "B", "t": "方案2（删缓存→更新 DB）更优，因为能确保缓存一定为空"}, {"k": "C", "t": "方案3（更新 DB→更新缓存）最安全，能完全避免一致性问题"}, {"k": "D", "t": "三种方案一致性等价"}], "answer": ["A"], "explain": "Cache-Aside 标准做法：写时更新数据库并删除缓存（方案1）。方案2 在并发下，读请求可能在「删缓存」与「更新 DB」之间未命中而回填旧值，造成长期脏数据。方案3 直接更新缓存易因并发写乱序覆盖产生不一致，且缓存里放的是旧计算结果。故方案1 最稳妥。", "kaodian": "AI后端能力-高并发与中间件层-缓存使用流程"}, {"no": 7, "type": "single", "body": "下列 Spring MVC Controller 写法中，符合规范且能正确接收表单格式（application/x-www-form-urlencoded）的多个同名参数的是？", "code": "@PostMapping(\"/orders\")\npublic Result create(@RequestParam(\"tag\") List<String> tags,\n                     @RequestParam(\"name\") String name) { ... }", "options": [{"k": "A", "t": "用 @RequestParam(\"tag\") List<String> 可接收一个参数名的多个值，符合规范"}, {"k": "B", "t": "必须写成 @RequestParam Map<String,String> 才能接收多个同名参数"}, {"k": "C", "t": "@RequestParam 不能用于 List，需改为 @RequestBody"}, {"k": "D", "t": "表单提交无法传递数组，应一律用 JSON + @RequestBody"}], "answer": ["A"], "explain": "表单（x-www-form-urlencoded）中同一 name 出现多次时，@RequestParam(\"tag\") List<String> 即可收集全部值，是标准用法。B 的 Map 也能用但不是必须；C 错（RequestParam 支持集合）；D 错（表单完全可传多值，JSON 才用 @RequestBody）。", "kaodian": "AI后端能力-应用框架层-Spring MVC 接口模板"}, {"no": 8, "type": "single", "body": "某前端需调用导出接口并下载文件流，下列 Axios 请求配置正确的是？", "code": "// A\naxios.get('/api/export', { responseType: 'blob' }).then(r => download(r.data));\n// B\naxios.get('/api/export', { responseType: 'json' })\n// C\naxios.post('/api/export', { responseType: 'blob' })", "options": [{"k": "A", "t": "写法 A 正确：下载二进制需 responseType:'blob'，且 GET 即可（导出通常无请求体）"}, {"k": "B", "t": "必须 responseType:'json' 才能拿到文件"}, {"k": "C", "t": "下载必须用 POST"}, {"k": "D", "t": "blob 只能在 fetch 中使用，Axios 不支持"}], "answer": ["A"], "explain": "文件下载需 responseType: 'blob' 让 Axios 以 Blob 形式接收响应体，再借 URL.createObjectURL 触发下载。导出类接口多为 GET（参数走 query）。B 默认 json 会把二进制当 JSON 解析失败；C 错（POST 非必须）；D 错（Axios 完全支持 blob）。", "kaodian": "AI前端能力-网络与BFF架构-Axios请求配置"}, {"no": 9, "type": "single", "body": "在 Vue3 中，下面哪段模板语法能正确根据 isAdmin 显示不同内容？", "code": "A. <p v-if=\"isAdmin\">管理员</p><p v-else>普通用户</p>\nB. <p if=\"isAdmin\">管理员</p>\nC. <p {{ isAdmin ? '管理员':'普通用户' }} </p>\nD. <p v-show=\"isAdmin\">管理员</p>", "options": [{"k": "A", "t": "写法 A 正确：v-if/v-else 是 Vue 内置条件指令"}, {"k": "B", "t": "用 if 属性即可"}, {"k": "C", "t": "双花括号可直接放在标签内作为条件"}, {"k": "D", "t": "v-show 必须配合 v-else"}], "answer": ["A"], "explain": "Vue 的条件渲染用 v-if 与 v-else（需相邻），A 正确。B 的 if 不是指令；C 双花括号只能用于文本插值，不能当控制结构；D v-show 只是切换 display，没有 v-else 语法。", "kaodian": "AI前端能力-语言与运行时-Vue基础模板"}, {"no": 10, "type": "single", "body": "联调时发现某接口返回 500，使用浏览器 DevTools 排查时，最应该先看哪个面板确认「请求是否真的发出、返回了什么」？", "code": "", "options": [{"k": "A", "t": "Console 面板，看是否有 JS 报错"}, {"k": "B", "t": "Network 面板，查看该请求的 Status、Response、Request Headers"}, {"k": "C", "t": "Elements 面板，检查 DOM 结构"}, {"k": "D", "t": "Sources 面板，打断点调试"}], "answer": ["B"], "explain": "接口返回 500 属于网络/服务端问题，应优先在 Network 面板找到该请求，查看 Status（500）、Response（错误体）、Request Headers（鉴权/Content-Type 是否正确），定位是前端传参问题还是后端报错。Console 多为前端 JS 错误，Elements/Sources 与接口响应无直接关系。", "kaodian": "AI前端能力-前端生态-浏览器DevTools"}, {"no": 11, "type": "single", "body": "在 Axios 响应拦截器中实现 Token 过期无感刷新，originalRequest._retry = true 的核心作用是？", "code": "axios.interceptors.response.use(\n  r => r,\n  async error => {\n    const originalRequest = error.config;\n    if (error.response.status === 401 && !originalRequest._retry) {\n      originalRequest._retry = true;\n      await refreshToken();\n      return axios(originalRequest);\n    }\n    return Promise.reject(error);\n  });", "options": [{"k": "A", "t": "标识当前请求是否发送成功，用于数据监控"}, {"k": "B", "t": "缓存请求参数，确保重试时数据不丢失"}, {"k": "C", "t": "防止刷新 Token 的请求本身也返回 401 时拦截器再次触发刷新，陷入无限循环"}, {"k": "D", "t": "强制刷新浏览器以拉取最新静态资源"}], "answer": ["C"], "explain": "无感刷新时，若 refreshToken 失败或新 Token 仍 401，重试请求会再次进入该拦截器。_retry 标记确保「同一请求只重试一次」，避免无限递归刷新。A/B/D 均非其用途。", "kaodian": "AI前端能力-网络与BFF架构-Axios响应拦截器"}, {"no": 12, "type": "single", "body": "下列代码中，点击按钮后页面姓名不更新的原因是？", "code": "let state = reactive({ name: '张三' });\nfunction change() {\n  state = reactive({ name: '李四' }); // 对整个变量重新赋值\n}", "options": [{"k": "A", "t": "姓名会成功更新为「李四」"}, {"k": "B", "t": "重新给 state 赋值导致丢失了与模板的响应式连接，页面不更新"}, {"k": "C", "t": "会抛出 Cannot reassign reactive object 运行时异常"}, {"k": "D", "t": "姓名会变「李四」，但再次点击时报错"}], "answer": ["B"], "explain": "reactive 返回的是代理对象，模板绑定的是「最初的那个代理」。对用 let 声明的 state 整体重新赋值会切断原代理与模板的关联，新对象虽也是响应式但模板不感知，故页面不更新。正确做法是用 ref 或保持对象引用直接改属性（state.name='李四'）。", "kaodian": "AI前端能力-语言与运行时-Vue3响应式"}, {"no": 13, "type": "single", "body": "父容器 display:flex; justify-content:center; align-items:center; 内部三个子元素，结果如何？", "code": ".container { display: flex; justify-content: center; align-items: center; height: 200px; }\n<div class=\"container\"><span>1</span><span>2</span><span>3</span></div>", "options": [{"k": "A", "t": "三个元素水平排列，并在容器内水平、垂直都居中"}, {"k": "B", "t": "三个元素垂直排列并居中"}, {"k": "C", "t": "三个元素水平排列并贴容器顶部"}, {"k": "D", "t": "三个元素水平排列并平均分布两侧"}], "answer": ["A"], "explain": "默认 flex-direction:row → 子项水平排列；justify-content:center 主轴（水平）居中；align-items:center 交叉轴（垂直）居中。故三元素水平且整体居中。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS布局"}, {"no": 14, "type": "single", "body": "在 Vue3 中，实现「输入框内容实时同步到数据」的正确写法是？", "code": "A. <input v-model=\"keyword\">\nB. <input :value=\"keyword\">\nC. <input @input=\"keyword = $event.target.value\" v-model=\"keyword\">\nD. <input model=\"keyword\">", "options": [{"k": "A", "t": "v-model 是语法糖，自动完成 value 绑定与 input 事件更新，正确"}, {"k": "B", "t": ":value 只是单向绑定，输入不会回写数据"}, {"k": "C", "t": "同时写 v-model 和 @input 会冲突报错"}, {"k": "D", "t": "model 不是 Vue 指令"}], "answer": ["A"], "explain": "v-model 是 :value + @input 的语法糖，实现双向绑定；B 仅单向（视图←数据），输入不回写；C 重复绑定会冲突；D model 非指令。", "kaodian": "AI前端能力-语言与运行时-数据绑定"}, {"no": 15, "type": "single", "body": "以下是 Vue3 表单验证代码片段。当 username 输入多个空格 '   '、email 输入 'admin@test.com' 时，submitForm 的 isValid 值为？", "code": "const validateField = (field) => {\n  const value = form[field];\n  if (!value?.trim()) { errors[field]='必填'; return false; }\n  return true;\n};", "options": [{"k": "A", "t": "true，因为 email 格式正确即通过"}, {"k": "B", "t": "false，因为 username 为全空格，trim() 后为空触发必填校验返回 false"}, {"k": "C", "t": "true，空格不影响校验"}, {"k": "D", "t": "false，因为 email 必填"}], "answer": ["B"], "explain": "value?.trim() 对 '   ' 去空格后为 ''，!'' 为 true，触发必填校验并返回 false，导致 every 短路、isValid=false。A/C 忽略了 trim 对空格的处理；D 错因 email 有值。", "kaodian": "AI质量保障-Web/App 功能测试-表单验证：必填、格式、长度、重复提交、错误提示"}, {"no": 16, "type": "single", "body": "关于「AI 辅助理解测试需求」的作用，下列说法正确的是？", "code": "", "options": [{"k": "A", "t": "AI 只能生成测试用例，不能帮助理解需求"}, {"k": "B", "t": "AI 可基于需求文档自动提取测试点、识别边界与异常场景，辅助测试人员建立测试理解"}, {"k": "C", "t": "AI 理解测试会取代测试工程师的设计职责"}, {"k": "D", "t": "AI 辅助理解测试仅适用于性能测试"}], "answer": ["B"], "explain": "AI 辅助理解测试的核心价值是：从需求/接口文档中提炼测试点、补充边界与异常路径、降低人工阅读成本，是「辅助」而非「取代」。A/C/D 均过度或错误。", "kaodian": "AI质量保障-软件测试理论与质量体系-AI辅助理解测试"}, {"no": 17, "type": "single", "body": "AI 辅助缺陷分析主要用于？", "code": "", "options": [{"k": "A", "t": "自动修复所有代码缺陷"}, {"k": "B", "t": "基于失败日志、堆栈与上下文，聚类根因、推荐排查路径，提升缺陷定位效率"}, {"k": "C", "t": "替代开发人员写代码"}, {"k": "D", "t": "仅用于生成缺陷报告模板"}], "answer": ["B"], "explain": "AI 辅助缺陷分析利用历史缺陷、日志、堆栈聚类似问题根因，给出排查建议，加速定位；它不自动修复（A/C 错），也不限于模板（D 错）。", "kaodian": "AI质量保障-AI测试能力-AI辅助缺陷分析"}, {"no": 18, "type": "single", "body": "关于 HTTP 请求方法在接口测试中的语义，下列对应正确的是？", "code": "", "options": [{"k": "A", "t": "GET 用于创建资源，POST 用于查询"}, {"k": "B", "t": "GET 安全且幂等，用于查询；POST 用于新增且不保证幂等；PUT 用于整体更新且幂等"}, {"k": "C", "t": "PUT 与 POST 完全等价"}, {"k": "D", "t": "DELETE 不幂等"}], "answer": ["B"], "explain": "GET 安全/幂等（查询）；POST 新增、通常不幂等；PUT 整体替换、幂等；DELETE 通常幂等。A 颠倒 GET/POST；C PUT/POST 语义不同；D DELETE 一般幂等。", "kaodian": "AI质量保障-接口测试能力-API Testing & Integration-常见请求类型"}, {"no": 19, "type": "single", "body": "「购物车结算」模块的冒烟测试，下列哪组最符合「最小验证集合」原则？", "code": "集合3：{正常路径结算成功, 生成订单, 返回订单号}", "options": [{"k": "A", "t": "覆盖所有功能检查点的一组"}, {"k": "B", "t": "覆盖正常和异常场景的一组"}, {"k": "C", "t": "仅覆盖核心成功路径且用例最少的一组（如集合3）"}, {"k": "D", "t": "覆盖性能/并发/超时的最全面一组"}], "answer": ["C"], "explain": "冒烟测试核心是验证「核心路径」且用例最少。集合3 只覆盖核心成功路径（结算成功→生成订单→返回订单号），符合最小验证集合。A/B/D 都超出冒烟范围（属全量/异常/非核心）。", "kaodian": "AI质量保障-AI测试能力-冒烟测试设计"}, {"no": 20, "type": "single", "body": "在 CI 流水线中配置「质量门禁」（如单元测试覆盖率 < 80% 则构建失败），其主要目的是？", "code": "", "options": [{"k": "A", "t": "拖慢交付速度"}, {"k": "B", "t": "在合入前自动拦截质量不达标代码，保障主干质量"}, {"k": "C", "t": "仅用于生成覆盖率报告"}, {"k": "D", "t": "替代人工 Code Review"}], "answer": ["B"], "explain": "质量门禁是在流水线的关键节点设置量化阈值（覆盖率、重复率、严重漏洞数等），未达标即阻断合并/发布，把质量问题拦截在合入前。A 是副作用而非目的；C/D 错（它不替代 review，也不仅出报告）。", "kaodian": "AI质量保障-质量工程-质量度量与质量门禁执行"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于 RabbitMQ 消费者与消息确认，下列说法正确的有？（多选、少选、错选均不得分）", "code": "// 消费者手动 ACK\nchannel.basicConsume(queue, false, (tag, msg) -> {\n    try { process(msg); channel.basicAck(tag, false); }\n    catch (Exception e) { channel.basicNack(tag, false, true); }\n});", "options": [{"k": "A", "t": "autoAck=false 时需手动调用 basicAck，否则消息会一直留在队列（Unacked）"}, {"k": "B", "t": "basicNack 的 requeue=true 会把消息重新入队，可能被其他消费者消费"}, {"k": "C", "t": "若处理抛异常后 basicNack(requeue=false)，消息会进入死信队列（若配置了 DLX）"}, {"k": "D", "t": "消费者越多，单条消息处理一定越快（线性加速）"}], "answer": ["A", "B", "C"], "explain": "A autoAck=false 须手动 ack，否则消息处于 Unacked 不释放；B basicNack requeue=true 重新入队；C requeue=false 且无正常消费时进入死信（需配置 x-dead-letter-exchange）。D 错：消费者受限于 CPU/IO 与消息依赖，并非线性加速，还可能因锁竞争变慢。", "kaodian": "AI后端能力-高并发与中间件层-MQ基础概念"}, {"no": 2, "type": "multi", "body": "关于 Cache-Aside 缓存一致性，下列说法正确的有？（多选、少选、错选均不得分）", "code": "// 更新时：先更新数据库，再删除缓存", "options": [{"k": "A", "t": "即使先更新 DB 再删缓存，在极高并发读写下仍有微小概率出现脏数据"}, {"k": "B", "t": "若先删缓存再更新 DB，并发读可能把旧值回填缓存导致长期脏数据"}, {"k": "C", "t": "直接 set 更新缓存比删除缓存更好，能完全避免一致性问题"}, {"k": "D", "t": "当事务方法内提前 delete 缓存、事务尚未提交时，并发读会读旧值回填缓存"}], "answer": ["A", "B", "D"], "explain": "A 极端并发下仍可能读写交叉产生脏数据；B 先删后更，并发读回填旧值→长期脏；D @Transactional 内提前删缓存，并发读在 commit 前读到旧库值回填→脏。C 错：直接 set 更新缓存在并发写下易乱序覆盖，删除缓存是更通用做法。", "kaodian": "AI后端能力-高并发与中间件层-缓存使用流程"}, {"no": 3, "type": "multi", "body": "关于 MyBatis-Plus 的 Wrapper，下列说法正确的有？（多选、少选、错选均不得分）", "code": "// 更新 userName 为 null\nupdate(new User(), new LambdaUpdateWrapper<User>()\n  .eq(User::getId, 1).set(User::getUserName, null));", "options": [{"k": "A", "t": "LambdaUpdateWrapper 可用方法引用指定更新字段，避免硬编码列名"}, {"k": "B", "t": "默认 updateStrategy 下 set 为 null 会被忽略（不更新该列），需显式允许"}, {"k": "C", "t": "LambdaQueryWrapper 的 select(方法引用) 可指定返回列，类型安全"}, {"k": "D", "t": "Wrapper 只能用于单表，无法拼接自定义 SQL 片段"}], "answer": ["A", "B", "C"], "explain": "A Lambda 方法引用避免字段名写错；B MP 默认策略（NOT_NULL）会忽略 null 更新，要置 NULL 需 @TableField(updateStrategy=IGNORED) 或 .set(...).isNull(...)；C select 方法引用类型安全；D 错：可用 .last() 或 apply() 拼接自定义片段。", "kaodian": "AI后端能力-数据存储与持久化层-LambdaQueryWrapper/LambdaUpdateWrapper"}, {"no": 4, "type": "multi", "body": "关于 Vue3 响应式，下列说法正确的有？（多选、少选、错选均不得分）", "code": "const state = reactive({ list: [] });\nstate.list.push(1);          // ①\nlet plain = reactive({});\nplain = { a: 1 };            // ② 重新赋值", "options": [{"k": "A", "t": "对 reactive 对象的属性（含数组 push）修改是响应式的，① 会触发更新"}, {"k": "B", "t": "用 let 声明的变量整体重新赋值为新 reactive 会丢失原响应式 能被同一个消费者组内的一个消费者消费，因此分区数决定了该消费组的最大并行度。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Kafka 的分配机制保证同一消费组内一个分区只分配给一个消费者，消费组并行度上限 = 分区数。这也是真题中容易判错的核心概念。", "kaodian": "AI后端能力-高并发与中间件层-MQ基础概念"}, {"no": 2, "type": "judge", "body": "判断：在 Flex 布局中，align-items:center 控制的是子项在「交叉轴」上的对齐方式。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "align-items 作用于交叉轴（默认垂直方向），justify-content 作用于主轴（水平）。真题中该题易被误判为错误。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS布局"}, {"no": 3, "type": "judge", "body": "判断：浏览器同源策略下，前端直接请求不同域的接口会被 CORS 拦截，这是浏览器的安全限制而非服务端限制。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "跨域限制由浏览器执行（同源策略），服务端可通过返回正确的 CORS 响应头允许跨域。真题中该题易被误判为错误。", "kaodian": "AI前端能力-网络与BFF架构-Axios/Fetch请求"}, {"no": 4, "type": "judge", "body": "判断：回归测试的目的是验证新变更没有破坏已有功能，因此只需运行受影响的用例即可，无需关注依赖模块。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "变更的影响常波及依赖模块（如改 CouponService 会影响 OrderService、CheckoutController）。回归测试必须基于影响评估把上下游依赖纳入范围，否则漏测高危区。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试基础概念"}, {"no": 5, "type": "judge", "body": "判断：HTTP 429 状态码表示「请求过多（Too Many Requests）」，通常用于限流场景。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "429 是标准限流状态码，客户端应退避重试。这是接口测试常见请求类型中的基础语义。", "kaodian": "AI质量保障-接口测试能力-API Testing & Integration-常见请求类型"}, {"no": 6, "type": "judge", "body": "判断：AI 辅助理解测试可以帮助测试人员从需求文档中自动提取测试点并识别边界场景。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "这正是 AI 辅助理解测试的核心能力：从需求/接口文档提炼测试点、补充边界与异常路径。", "kaodian": "AI质量保障-软件测试理论与质量体系-AI辅助理解测试"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>

</body>
</html>
