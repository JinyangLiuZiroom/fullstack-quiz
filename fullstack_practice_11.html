<script type="application/json" id="quizData">{"id": "vol11", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "对齐公司真实考法：<b>单选 / 多选 / 判断</b>，每题给出完整代码场景，问执行结果、补全代码或判断框架用法正误。<br>本卷共 <b>33 题</b>：单选 20（60 分）+ 多选 7（28 分）+ 判断 6（12 分）= 100 分。<br>难度：<b>实战细节型</b>，覆盖 Java 集合与 JVM、并发与线程池、Spring 事务/AOP/缓存、MyBatis 与 MySQL 深分页、Redis 穿透防护、Kafka 日志压缩、Vue3/JS 执行结果、HTTP 与浏览器存储、JUnit5 与 Mockito。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "缓存中已存在 key=\"a\"（值为 cached-a）。调用 <code>load(\"a\")</code> 后，控制台输出与返回值分别是？", "code": "public String load(String key) {\n    return Optional.ofNullable(cache.get(key))\n            .orElse(queryFromDb(key));          // ①\n}\n\nprivate String queryFromDb(String key) {\n    System.out.println(\"查库: \" + key);\n    return \"db-\" + key;\n}", "options": [{"k": "A", "t": "不打印任何内容，返回 cached-a"}, {"k": "B", "t": "打印「查库: a」，返回 cached-a"}, {"k": "C", "t": "打印「查库: a」，返回 db-a"}, {"k": "D", "t": "编译错误，orElse 不能接受方法调用"}], "answer": ["B"], "explain": "orElse(X) 的参数 X 是一个普通表达式，在调用 orElse 之前就必须先求值——无论 Optional 里有没有值，queryFromDb 都会被真实执行（副作用发生、日志打印、DB 被查），只是返回值最后被丢弃。因为 Optional 有值，最终返回的仍是 cached-a。要做到「有值就不执行兜底逻辑」必须用惰性求值的 orElseGet(() -> queryFromDb(key))。同理 orElseThrow(SomeException::new) 也是惰性的，而 orElse(new SomeException()) 会每次都构造对象。", "android": "类比 Kotlin 的 elvis：cache[key] ?: expensiveLoad() 是短路的，而写成 orElse(expensiveLoad()) 相当于每次都无条件调用了 expensiveLoad()，等于在主线程白跑一次磁盘/网络读取。", "kaodian": "AI 后端能力 - 语言基础层 - Optional 与惰性求值"}, {"no": 2, "type": "single", "body": "以下代码执行后，控制台输出是？", "code": "Map<String, Integer> stock = new HashMap<>();\nstock.put(\"A\", 0);\n\nstock.computeIfAbsent(\"A\", k -> 10);\nstock.computeIfPresent(\"B\", (k, v) -> 5);\nstock.merge(\"A\", 3, Integer::sum);\nstock.merge(\"C\", 7, Integer::sum);\n\nSystem.out.println(stock);", "options": [{"k": "A", "t": "{A=10, B=5, C=7}"}, {"k": "B", "t": "{A=3, C=7}"}, {"k": "C", "t": "{A=13, C=7}"}, {"k": "D", "t": "{A=0, C=7}"}], "answer": ["B"], "explain": "逐行分析：① computeIfAbsent(\"A\", ...) —— key A 已存在且值非 null，映射函数根本不执行，A 仍为 0；注意「值为 null」也被视为 absent，此时函数会执行。② computeIfPresent(\"B\", ...) —— key B 不存在，什么都不做，不会新增 B。③ merge(\"A\", 3, Integer::sum) —— key 存在，用重映射函数合并：0 + 3 = 3。④ merge(\"C\", 7, Integer::sum) —— key 不存在时直接放入给定值 7，不调用重映射函数（这点最容易记错）。所以结果是 {A=3, C=7}。这三个方法用来替代「先 get 判空再 put」的样板代码；补充两个坑：compute/merge 的函数返回 null 会删除该 key；在 ConcurrentHashMap 上 computeIfAbsent 的函数里不能再操作同一个 map，可能触发死锁或 IllegalStateException。", "android": "类比 Kotlin 的 map.getOrPut(key) { computeExpensive() } —— 只在缺失时才计算；写成 map[key] = computeExpensive() 就会每次都跑一遍耗时逻辑，和 computeIfAbsent 与 put 的差别一模一样。", "kaodian": "AI 后端能力 - 语言基础层 - Map 原子更新方法"}, {"no": 3, "type": "single", "body": "订单列表中有一条记录的 status 为 null（服务端未返回该字段）。以下代码执行结果是？", "code": "List<Order> orders = List.of(\n        new Order(\"A\", \"PAID\"),\n        new Order(\"B\", null),\n        new Order(\"C\", \"PAID\"));\n\nMap<String, List<Order>> m = orders.stream()\n        .collect(Collectors.groupingBy(Order::getStatus));\n\nSystem.out.println(m.size());", "options": [{"k": "A", "t": "输出 2，null 单独成一组"}, {"k": "B", "t": "输出 1，null 的那条被自动跳过"}, {"k": "C", "t": "抛出 NullPointerException"}, {"k": "D", "t": "输出 3"}], "answer": ["C"], "explain": "groupingBy 底层用 HashMap 收集，虽然 HashMap 本身允许 null 作为 key，但 Collectors.groupingBy 在实现里对分类函数的结果做了 Objects.requireNonNull 校验，分类键为 null 直接抛 NPE。同理 Collectors.toMap 在 value 为 null 时也会 NPE（因为内部走 map.merge）。防御写法：groupingBy(o -> Optional.ofNullable(o.getStatus()).orElse(\"UNKNOWN\"))，或先 filter 掉脏数据。注意 List.of(...) 本身也不允许 null 元素，只是这里 null 在对象字段上。", "android": "类比拿接口返回的列表按 type 分组渲染，服务端某条数据少给了 type 字段就整页崩溃——后端聚合同样要对分组键做兜底，不能假设字段一定有值。", "kaodian": "AI 后端能力 - 语言基础层 - Stream 收集器"}, {"no": 4, "type": "single", "body": "main 线程连续提交 3 个各耗时 500ms 的任务，第 3 个任务由哪个线程执行？", "code": "ThreadPoolExecutor pool = new ThreadPoolExecutor(\n        1, 1, 0L, TimeUnit.SECONDS,\n        new ArrayBlockingQueue<>(1),\n        new ThreadPoolExecutor.CallerRunsPolicy());\n\nfor (int i = 1; i <= 3; i++) {\n    int id = i;\n    pool.execute(() -> {\n        System.out.println(Thread.currentThread().getName() + \" -> task\" + id);\n        sleep(500);\n    });\n}", "options": [{"k": "A", "t": "pool-1-thread-1，线程池会自动扩容"}, {"k": "B", "t": "main 线程，由提交者自己同步执行"}, {"k": "C", "t": "被静默丢弃，不会执行"}, {"k": "D", "t": "抛出 RejectedExecutionException"}], "answer": ["B"], "explain": "core=max=1、队列容量 1：task1 被唯一的工作线程执行，task2 入队，task3 到来时线程数已达 maximumPoolSize 且队列已满，触发拒绝策略。CallerRunsPolicy 的行为是把任务「退回」给调用 execute 的线程直接 run()，形成负反馈从而减缓提交速度，代价是提交线程（线上常是 Tomcat 请求线程）被阻塞。其余三种：AbortPolicy（默认，抛 RejectedExecutionException）、DiscardPolicy（静默丢弃）、DiscardOldestPolicy（丢弃队首最老任务后再提交）。", "android": "类比在主线程往一个已满的线程池提交任务，若用 CallerRuns，活儿会甩回 UI 线程执行造成掉帧甚至 ANR——所以关键路径上要么扩容、要么明确快速失败。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 线程池拒绝策略"}, {"no": 5, "type": "single", "body": "在「tryLock 超时、没有拿到锁」的那个线程上，① 行会发生什么？", "code": "private final ReentrantLock lock = new ReentrantLock();\n\npublic void handle() {\n    try {\n        if (lock.tryLock(200, TimeUnit.MILLISECONDS)) {\n            doBiz();\n        }\n    } catch (InterruptedException e) {\n        Thread.currentThread().interrupt();\n    } finally {\n        lock.unlock();            // ①\n    }\n}", "options": [{"k": "A", "t": "正常返回，unlock 对未持锁线程是空操作"}, {"k": "B", "t": "抛出 IllegalMonitorStateException"}, {"k": "C", "t": "阻塞直到拿到锁再释放"}, {"k": "D", "t": "编译错误，tryLock 必须配合 lockInterruptibly"}], "answer": ["B"], "explain": "ReentrantLock 的 unlock 要求调用线程必须是当前持有者（state 的 exclusiveOwnerThread 校验），否则抛 IllegalMonitorStateException。这里超时线程没拿到锁却在 finally 中无条件 unlock，不仅报错，还会把真正的业务异常掩盖掉。正确写法：boolean locked = lock.tryLock(...); try { if (locked) {...} } finally { if (locked) lock.unlock(); }。另外 lock() 的调用必须紧挨在 try 之前（不能写在 try 里面），否则加锁本身失败时同样会误 unlock。", "android": "类比 finally 里对根本没成功打开的 Cursor / InputStream 无脑 close()，抛出的二次异常会盖住首因异常，排查时看到的堆栈全是误导。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 显式锁使用规范"}, {"no": 6, "type": "single", "body": "在以下 JVM 参数（Serial/ParNew 收集器）下，执行 <code>byte[] data = new byte[6 * 1024 * 1024];</code> 时该数组分配在哪里？", "code": "-Xms64m -Xmx64m -Xmn32m\n-XX:SurvivorRatio=8\n-XX:MaxTenuringThreshold=15\n-XX:PretenureSizeThreshold=4m", "options": [{"k": "A", "t": "Eden 区，等 Minor GC 时再决定去留"}, {"k": "B", "t": "Survivor(S0) 区"}, {"k": "C", "t": "老年代（Old）"}, {"k": "D", "t": "元空间（Metaspace）"}], "answer": ["C"], "explain": "大对象（超过 PretenureSizeThreshold=4m）会跳过新生代直接在老年代分配，目的是避免在 Eden 与两个 Survivor 之间反复复制造成的内存拷贝开销。数值上也印证：新生代 32m、SurvivorRatio=8 → Eden≈25.6m、S0/S1 各≈3.2m，6MB 根本放不进 Survivor，即使先进 Eden，Minor GC 后也会因「Survivor 放不下」通过分配担保直接晋升。其他晋升途径：对象年龄达到 MaxTenuringThreshold，或动态年龄判定（同龄对象累计大小超过 Survivor 的一半）。元空间只存类元数据，不存对象实例。", "android": "类比大 Bitmap：Android 3.0 后像素数据放在 Java 堆，一张大图直接吃掉大块内存并快速晋升老年代，所以要用 inSampleSize 采样压缩——「大对象别在新生代来回搬」是同一个思路。", "kaodian": "AI 后端能力 - 语言基础层 - JVM 内存分配与晋升"}, {"no": 7, "type": "single", "body": "MySQL + InnoDB，Spring Boot 默认配置下，调用 <code>syncUser(1L)</code> 会发生什么？", "code": "@Transactional(readOnly = true)\npublic void syncUser(Long id) {\n    User u = userMapper.selectById(id);\n    u.setName(\"new-\" + id);\n    userMapper.updateById(u);      // ①\n}", "options": [{"k": "A", "t": "正常更新并提交"}, {"k": "B", "t": "抛出异常：Connection is read-only. Queries leading to data modification are not allowed"}, {"k": "C", "t": "不报错，但更新被静默丢弃"}, {"k": "D", "t": "更新成功，只是事务不提交"}], "answer": ["B"], "explain": "readOnly = true 会让事务管理器把 Connection 设置为只读（Connection.setReadOnly(true)）并向数据库发出只读提示，MySQL 驱动在只读连接上执行 INSERT/UPDATE/DELETE 会直接抛 SQLException，Spring 包装成 TransactionSystemException/InvalidDataAccessApiUsageException。readOnly 的正确用途是纯查询方法：可以让 MySQL 省去 undo 记录开销、便于读写分离组件把请求路由到从库。注意它同样依赖 AOP 代理，自调用（this.xxx()）时不生效。", "android": "类比 SQLiteDatabase.openDatabase(..., OPEN_READONLY) 之后执行 insert，会抛 SQLiteReadOnlyDatabaseException——只读标记是连接级别的约束，不是「写了不生效」而是「直接报错」。", "kaodian": "AI 后端能力 - 框架与容器层 - Spring 事务属性"}, {"no": 8, "type": "single", "body": "Spring Boot 2.x 未做任何额外配置（无 @DateTimeFormat、无自定义 Converter）时，以下请求的结果是？", "code": "@GetMapping(\"/orders\")\npublic List<Order> list(@RequestParam LocalDateTime start) {\n    return orderService.listAfter(start);\n}\n\n// 请求（URL 编码后发出）\nGET /orders?start=2026-08-06 10:00:00", "options": [{"k": "A", "t": "正常绑定为 2026-08-06T10:00"}, {"k": "B", "t": "返回 400，参数类型转换失败，需要 @DateTimeFormat(pattern = \"yyyy-MM-dd HH:mm:ss\")"}, {"k": "C", "t": "绑定为 null，方法照常执行"}, {"k": "D", "t": "自动截断为 2026-08-06T00:00"}], "answer": ["B"], "explain": "Spring Boot 默认为 java.time 类型注册的是 ISO-8601 格式转换器：LocalDate 认 yyyy-MM-dd，LocalDateTime 认 yyyy-MM-ddTHH:mm:ss（中间是字母 T）。用空格分隔不符合 ISO，转换器抛 MethodArgumentTypeMismatchException，被默认异常处理器转成 400 Bad Request。三种修法：① 参数上加 @DateTimeFormat(pattern=...)；② 全局配置 spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss；③ 注册全局 Converter<String, LocalDateTime>。关键区分：@DateTimeFormat 管的是 URL 查询参数/表单绑定，@JsonFormat 管的是 @RequestBody 的 JSON 反序列化，两套机制互不覆盖。", "android": "类比 Retrofit：@Query 参数的日期靠自定义 Converter 序列化，而 body 的日期靠 Gson 的 setDateFormat——两边格式要各配一次，只配一边线上就会出现「列表能查、详情报错」。", "kaodian": "AI 后端能力 - 框架与容器层 - Spring MVC 参数绑定"}, {"no": 9, "type": "single", "body": "以下方法执行到 throw 抛出异常后，缓存 <code>user::1</code> 的状态是？", "code": "@CacheEvict(cacheNames = \"user\", key = \"#id\")   // beforeInvocation 默认 false\npublic void updateUser(Long id) {\n    userMapper.updateById(buildUser(id));       // 已写库成功\n    throw new RuntimeException(\"下游通知失败\");\n}", "options": [{"k": "A", "t": "缓存已被清除"}, {"k": "B", "t": "缓存未被清除，仍是更新前的旧数据"}, {"k": "C", "t": "缓存被清除后又写入了新值"}, {"k": "D", "t": "整个 user 缓存区被清空"}], "answer": ["B"], "explain": "@CacheEvict 默认 beforeInvocation = false，即「方法正常返回后」才执行清除；一旦方法抛异常，清除动作被跳过。此时 DB 已经改了、缓存还留着旧值，产生了典型的缓存不一致。设置 beforeInvocation = true 可以在方法执行前先清（方法失败最多白清一次，只会多一次回源，是可接受的代价）。另需注意它与事务的配合：缓存操作发生在方法返回时刻，若外层事务随后回滚，@CacheEvict 顶多多清一次（安全），而 @CachePut 则可能把回滚掉的脏数据写进缓存（危险）。", "android": "类比本地内存缓存 + Room 双写：网络更新失败却没同步清掉内存缓存，用户返回上一页看到的还是旧数据，必须让「失效」这一步足够激进。", "kaodian": "AI 后端能力 - 框架与容器层 - Spring Cache 抽象"}, {"no": 10, "type": "single", "body": "关于下面这段 MyBatis 映射，说法正确的是？", "code": "<select id=\"list\" resultType=\"Order\">\n  SELECT * FROM t_order\n  WHERE status = #{status}\n  ORDER BY ${orderBy}\n</select>\n\n<!-- 调用：list(\"PAID\", request.getOrderBy()) -->", "options": [{"k": "A", "t": "#{} 与 ${} 都会编译成占位符 ?，都能防注入"}, {"k": "B", "t": "#{} 走预编译占位符，${} 是字符串直接拼接，orderBy 必须做白名单校验"}, {"k": "C", "t": "status 也应改用 ${}，因为拼接后性能更好"}, {"k": "D", "t": "ORDER BY 可以写成 #{orderBy}，效果与 ${} 完全一致"}], "answer": ["B"], "explain": "#{} 会被替换成 JDBC 占位符 ?，参数通过 PreparedStatement 传值，既能防 SQL 注入，也利于服务端复用执行计划；${} 是在 SQL 文本层面做字符串替换，只能用于表名、列名、排序字段/方向等无法参数化的位置，必须配白名单（如只允许 create_time/amount 与 asc/desc），否则 orderBy 传入 \"id; DROP TABLE t_order\" 或子查询就会造成注入。D 错在：ORDER BY #{orderBy} 生成的是 ORDER BY 'create_time' 这样的字符串常量，MySQL 会认为所有行排序键相同，排序直接失效（并不报错，属于最难查的静默 bug）。", "android": "类比 SQLiteDatabase.rawQuery(sql, selectionArgs) 用 ? 占位，与自己用字符串拼 SQL 的差别——后者同样可被本地注入，而且拼错了通常不报错、只是查出脏数据。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis 参数映射"}, {"no": 11, "type": "single", "body": "t_order 共 500 万行，已有联合索引 idx_uid_ctime(user_id, create_time)。下面这条 SQL 执行需要 3 秒，根因与最优解是？", "code": "SELECT * FROM t_order\nWHERE user_id = 88\nORDER BY create_time DESC\nLIMIT 500000, 10;", "options": [{"k": "A", "t": "没有走索引，加 FORCE INDEX(idx_uid_ctime) 即可"}, {"k": "B", "t": "引擎要先定位并回表取出 500010 行再丢弃前 50 万行；应改用「延迟关联」或「游标翻页」"}, {"k": "C", "t": "LIMIT 偏移量与性能无关，慢是因为 SELECT 的列太多"}, {"k": "D", "t": "改写成 LIMIT 10 OFFSET 500000 就能变快"}], "answer": ["B"], "explain": "LIMIT m, n 的语义是「取出 m+n 行、丢弃前 m 行」。走二级索引时，每命中一行都要拿主键回表读取 SELECT * 的其余列，于是白白回表 50 万次，offset 越大越慢。两种优化：① 延迟关联——SELECT o.* FROM t_order o JOIN (SELECT id FROM t_order WHERE user_id=88 ORDER BY create_time DESC LIMIT 500000,10) t ON o.id=t.id，子查询只取 id，可走覆盖索引不回表，只对最终 10 行回表；② 游标/键集翻页——WHERE user_id=88 AND create_time < ? ORDER BY create_time DESC LIMIT 10，把 offset 变成 WHERE 条件，无论翻到多少页都是常数级，缺点是不能随机跳页。D 错：LIMIT 10 OFFSET 500000 与 LIMIT 500000,10 完全等价。", "android": "类比列表分页：从「页码 offset 分页」改成「以上一页最后一条的时间戳为游标」，既避免深翻页越翻越慢，也避免期间插入新数据导致的重复项和漏项。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 深分页优化"}, {"no": 12, "type": "single", "body": "线上出现大量查询不存在商品 id 的请求（随机 id），缓存全部 miss 直接打到 DB。关于用布隆过滤器（Bloom Filter）解决该问题，描述正确的是？", "code": "public Product get(Long id) {\n    Product p = redis.get(\"prod:\" + id);\n    if (p != null) return p;\n    p = productMapper.selectById(id);   // 不存在的 id 每次都打 DB\n    if (p != null) redis.set(\"prod:\" + id, p, 30, TimeUnit.MINUTES);\n    return p;\n}", "options": [{"k": "A", "t": "判断「存在」则一定存在，判断「不存在」可能误判"}, {"k": "B", "t": "判断「不存在」则一定不存在，判断「存在」可能误判（假阳性），且标准实现不支持删除元素"}, {"k": "C", "t": "可以完全替代缓存，命中后直接返回商品数据"}, {"k": "D", "t": "内存占用比存全量 key 的 HashSet 更大，只适合小数据量"}], "answer": ["B"], "explain": "布隆过滤器是「位数组 + k 个哈希函数」，写入时把 k 个位置置 1、只置位不清位。查询时若任一位为 0，说明该元素一定没被写入过（不存在是确定的，可以直接拦截，正是防穿透要的能力）；若全为 1，可能是别的元素把这些位置 1 的，即假阳性，需要回源确认。标准布隆不支持删除（清位会误伤共享该位的其他元素），要删除得用 Counting Bloom Filter 或 Cuckoo Filter。它只存位不存值，所以内存远小于 HashSet，但也无法返回原始数据。另一种更轻的兜底方案是「缓存空值」：查不到时写一个短 TTL（如 60s）的空标记。", "android": "类比本地做「已读消息 ID」去重：用 BitSet/布隆位图代替 HashSet<Long>，内存省一大截，代价是接受极小概率把未读误判成已读——工程上用「误判方向可接受」来换空间。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存穿透防护"}, {"no": 13, "type": "single", "body": "某 topic 配置 <code>cleanup.policy = compact</code>，同一分区按顺序写入下列消息。日志压缩执行完成、且墓碑保留期已过后，分区中保留的数据是？", "code": "# 依次写入（key -> value）\nuser1 -> {\"name\":\"A\"}\nuser2 -> {\"name\":\"B\"}\nuser1 -> {\"name\":\"A2\"}\nuser2 -> null            # 墓碑消息 tombstone\nuser3 -> {\"name\":\"C\"}", "options": [{"k": "A", "t": "全部 5 条都保留，压缩只影响磁盘占用"}, {"k": "B", "t": "user1 -> A2、user3 -> C"}, {"k": "C", "t": "user1 -> A、user2 -> B、user3 -> C"}, {"k": "D", "t": "全部清空，compact 会删除所有历史消息"}], "answer": ["B"], "explain": "日志压缩（Log Compaction）保证每个 key 至少保留最后一条记录：user1 的旧值 A 被清理、只留最新的 A2；user2 的最后一条是 null 墓碑，代表「删除该 key」，墓碑本身会在 delete.retention.ms 之后连同旧值一起被清除，因此最终 user2 完全消失；user3 只有一条自然保留。典型用途是「以 key 为维度的最新状态快照」：__consumer_offsets、CDC 变更流、配置分发流。它与 cleanup.policy=delete（按 retention.ms/retention.bytes 整段删除）是不同策略，也可组合成 compact,delete。注意：压缩由 Log Cleaner 后台异步执行，且不会压缩 active segment，所以短时间内仍能读到旧值。", "android": "类比本地 KV 存储的合并落盘（LSM-Tree / SharedPreferences 的 apply 合并）：只保留每个 key 的最后一次写入，删除键写一个墓碑标记，等合并时统一清理。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 存储与日志压缩"}, {"no": 14, "type": "single", "body": "接口返回的订单列表为空数组时，以下代码执行结果是？", "code": "const orders = [];   // 接口暂无数据\nconst total = orders.reduce((sum, o) => sum + o.amount);\nconsole.log(total);", "options": [{"k": "A", "t": "输出 0"}, {"k": "B", "t": "输出 undefined"}, {"k": "C", "t": "抛出 TypeError: Reduce of empty array with no initial value"}, {"k": "D", "t": "输出 NaN"}], "answer": ["C"], "explain": "reduce 未提供第二个参数 initialValue 时，会取数组第 0 项作为初始值、从第 1 项开始迭代；空数组既没有初始值也没有第 0 项，直接抛 TypeError。还有一个更隐蔽的坑：当数组恰好只有 1 个元素且没给初始值时，回调函数一次都不会执行，reduce 直接返回那个元素本身——这里会返回订单对象而不是数字，后面接 .toFixed(2) 就崩了。所以求和一律写 reduce((s, o) => s + o.amount, 0)，既处理空数组也保证返回类型稳定。", "android": "类比 Kotlin：空集合调用 reduce 抛 UnsupportedOperationException，而 fold(0) 安全返回初始值——同一个坑，只是 JS 里更容易被空接口数据触发。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - 数组方法与边界"}, {"no": 15, "type": "single", "body": "以下 JS 代码依次输出什么？", "code": "const config = { pageSize: 0, keyword: '', retry: null };\n\nconsole.log(config.pageSize || 10);\nconsole.log(config.pageSize ?? 10);\nconsole.log(config.keyword  || '默认词');\nconsole.log(config.retry    ?? 3);", "options": [{"k": "A", "t": "10 / 0 / 默认词 / 3"}, {"k": "B", "t": "0 / 0 / '' / null"}, {"k": "C", "t": "10 / 10 / 默认词 / 3"}, {"k": "D", "t": "0 / 10 / '' / 3"}], "answer": ["A"], "explain": "|| 判断的是「假值」：0、''、NaN、false、null、undefined 全都会走兜底分支，所以 pageSize=0 被错误地改成 10、keyword='' 被改成默认词——这是配置类代码里最常见的 bug。?? 是空值合并运算符，只有 null / undefined 才兜底，所以 0 原样保留、null 兜底为 3。补充语法细节：?? 不能与 || 或 && 直接混写（SyntaxError），必须用括号显式分组；?? 与可选链 ?. 是天生一对：obj?.count ?? 0。", "android": "类比 Kotlin 的 elvis 运算符 ?:，它只对 null 生效，语义等价于 JS 的 ??；而 JS 的 || 更像「if (!value)」，直接套用在数值/开关配置上就会把合法的 0 和 false 吞掉。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - 运算符与默认值"}, {"no": 16, "type": "single", "body": "以下 Vue3 父子组件，控制台输出顺序是？", "code": "<!-- Parent.vue -->\n<script setup>\nimport Child from './Child.vue'\nimport { onMounted } from 'vue'\nconsole.log('parent setup')\nonMounted(() => console.log('parent mounted'))\n<\/script>\n<template><Child /></template>\n\n<!-- Child.vue -->\n<script setup>\nimport { onMounted } from 'vue'\nconsole.log('child setup')\nonMounted(() => console.log('child mounted'))\n<\/script>", "options": [{"k": "A", "t": "parent setup → parent mounted → child setup → child mounted"}, {"k": "B", "t": "parent setup → child setup → child mounted → parent mounted"}, {"k": "C", "t": "parent setup → child setup → parent mounted → child mounted"}, {"k": "D", "t": "child setup → parent setup → child mounted → parent mounted"}], "answer": ["B"], "explain": "组件树的创建阶段是自上而下的：父组件先执行 setup（相当于 beforeCreate+created），渲染时遇到子组件才去创建并执行子组件的 setup；而挂载完成的回调是自下而上的：父组件必须等所有子组件都挂载完毕，自己才算挂载完成，所以 child mounted 先于 parent mounted。卸载同理，unmounted 也是子先父后。实践结论：想在父组件里通过 ref 拿到子组件实例或其真实 DOM，必须写在父的 onMounted 里（此时子已挂载完成），写在 setup 中一定是 null。", "android": "类比 Activity 与 Fragment 的嵌套生命周期：宿主先 onCreate 再创建子 Fragment，而「完成态」回调是子先完成、宿主后完成；想操作子视图必须等子创建完，直接在 onCreate 里拿子 View 就是空指针。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 生命周期"}, {"no": 17, "type": "single", "body": "关于下面 Vue3 子组件代码中 ①②③ 三处，说法正确的是？", "code": "// Child.vue\nconst props = defineProps({\n  filter: {\n    type: Object,\n    default: { status: 'ALL' }        // ①\n  }\n})\n\nfunction reset() {\n  props.filter.status = 'ALL'          // ②\n  props.filter = { status: 'ALL' }     // ③\n}", "options": [{"k": "A", "t": "① 写法正确；② ③ 都会直接报错"}, {"k": "B", "t": "① 错误，对象/数组的 default 必须用工厂函数；② 能改动但违反单向数据流；③ 报错，props 顶层只读"}, {"k": "C", "t": "三处写法都没有问题"}, {"k": "D", "t": "① 错误，② ③ 都是官方推荐的修改方式"}], "answer": ["B"], "explain": "① Object / Array 类型的 default 必须写成工厂函数 default: () => ({ status: 'ALL' })，否则该对象在模块作用域只创建一次、被所有组件实例共享，一个实例改了别的实例跟着变，Vue 开发模式下会直接给出警告。② props 对象是 shallowReadonly：顶层属性只读，但嵌套对象的内部属性仍能改——改得动不代表该改，它会绕过 emit 直接污染父组件的数据源，属于典型反模式，出问题时数据流无法追溯。③ 给 props 顶层属性赋值会触发只读拦截报错（Set operation on key \"filter\" failed: target is readonly）。正确做法：emit 事件让父组件改，或用 defineModel / 本地副本 ref(structuredClone(props.filter))。", "android": "类比 Adapter 里直接修改 item 对象却不通知数据源，或给 Fragment 的默认参数用了静态可变对象导致多个实例串数据——共享可变默认值和越权改数据源，两个坑一次踩全。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 组件通信与单向数据流"}, {"no": 18, "type": "single", "body": "以下 HTML/CSS 渲染后，哪些元素被命中？", "code": "<div class=\"list\">\n  <h3>标题</h3>\n  <p>段落1</p>\n  <p>段落2</p>\n  <p>段落3</p>\n</div>\n\n<style>\n  .list p:nth-child(2)   { color: red; }\n  .list p:nth-of-type(2) { font-weight: bold; }\n</style>", "options": [{"k": "A", "t": "段落1 变红，段落2 加粗"}, {"k": "B", "t": "段落2 既变红又加粗"}, {"k": "C", "t": "段落1 既变红又加粗"}, {"k": "D", "t": "段落2 变红，段落3 加粗"}], "answer": ["A"], "explain": ":nth-child(n) 的判定顺序是「先看它在所有兄弟节点中排第几，再判断是否满足前面的选择器」——段落1 在父容器里是第 2 个子元素（h3 占了第 1 个），且它是 p，所以命中变红。:nth-of-type(n) 只在「同标签类型」的兄弟中计数——p 里的第 2 个是段落2，所以段落2 加粗。典型踩坑：列表容器里插入了一个标题、提示条或注释节点后，用 nth-child 写的斑马纹/隔行样式会整体错位，此时应改用 nth-of-type，或给内容项统一包一层。", "android": "类比 RecyclerView 混排 Header 之后，直接拿 position 当数据下标就会错位，必须减去 headerCount——nth-child 与 nth-of-type 的差别就是「视图位置」和「同类型数据位置」的差别。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 选择器"}, {"no": 19, "type": "single", "body": "搜索关键词为 <code>a+b c&d</code>，以下两种写法后端 <code>@RequestParam String kw</code> 分别收到什么？", "code": "const keyword = 'a+b c&d';\n\n// 写法一：手动拼接\naxios.get('/api/search?kw=' + keyword);\n\n// 写法二：交给 params\naxios.get('/api/search', { params: { kw: keyword } });", "options": [{"k": "A", "t": "两种写法后端都能拿到完整的 a+b c&d"}, {"k": "B", "t": "写法一拿到 a b c（+ 被解码成空格、& 之后被截断），写法二拿到完整的 a+b c&d"}, {"k": "C", "t": "两种写法都会返回 400"}, {"k": "D", "t": "写法二会把空格丢掉"}], "answer": ["B"], "explain": "查询字符串必须做百分号编码（percent-encoding）。在 query 中，+ 会被服务端按 application/x-www-form-urlencoded 规则解码成空格，& 是参数分隔符，# 之后的内容属于 fragment 根本不会发给服务端。所以写法一实际发出的是 kw=a+b c&d，后端解析成 kw=\"a b c\" 外加一个名为 d 的空参数。写法二中 Axios 会用 encodeURIComponent 序列化参数，+ 编码为 %2B、空格编码为 %20、& 编码为 %26，后端解码后拿到完整原文。结论：永远不要手工拼 URL，用 params / URLSearchParams / encodeURIComponent。", "android": "类比 OkHttp 的 HttpUrl.Builder.addQueryParameter 会自动做编码，而自己用字符串拼 URL 就会踩 + 和 & 的坑——搜索带特殊字符时线上才暴露。", "kaodian": "AI 前端能力 - 工程化与网络 - HTTP 请求参数编码"}, {"no": 20, "type": "single", "body": "以下 Mockito 单元测试中，① 行会输出什么？（getDiscount 返回 int，PriceCalculator.total 真实实现返回 200）", "code": "@ExtendWith(MockitoExtension.class)\nclass OrderServiceTest {\n\n    @Mock  CouponClient couponClient;                       // 未做任何 stub\n    @Spy   PriceCalculator calculator = new PriceCalculator();\n    @InjectMocks OrderService orderService;\n\n    @Test\n    void test() {\n        System.out.println(couponClient.getDiscount(1L));   // ①\n        System.out.println(calculator.total(100, 2));       // ②\n    }\n}", "options": [{"k": "A", "t": "① 抛出 NullPointerException"}, {"k": "B", "t": "① 输出 0（未打桩方法返回类型默认值），② 走真实实现输出 200"}, {"k": "C", "t": "① 调用真实的 CouponClient，输出真实折扣"}, {"k": "D", "t": "① 输出 null，② 输出 null"}], "answer": ["B"], "explain": "@Mock 创建的是完全替身：所有方法都被拦截，未打桩时返回「零值」——对象返回 null、int/long 返回 0、boolean 返回 false、集合返回空集合，绝不会执行真实代码。@Spy 是包裹真实对象的部分模拟：未打桩的方法走真实实现（所以 ② 输出 200），需要打桩时要用 doReturn(x).when(spy).m()，若写成 when(spy.m()).thenReturn(x) 会先真实调用一次 m()（有副作用时就出事）。@InjectMocks 会把上面这些替身按构造器 > setter > 字段的顺序注入被测对象。补充：MockitoExtension 默认开启 STRICT_STUBS，声明了却没用到的 stub 会让用例失败。", "android": "类比单测里用「全部返回空的假 Repository」（mock）和「真实 Repository 只替换网络层」（spy）——前者用来验证交互，后者用来保留真实业务逻辑，选错就会测了个寂寞。", "kaodian": "AI 质量保障 - 自动化测试与工具 - Mockito 替身类型"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "线上排查发现异步任务里的租户/用户上下文时有时无，甚至出现「串号」。关于下面代码，说法<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "private static final ThreadLocal<String> TENANT = new ThreadLocal<>();\nprivate static final InheritableThreadLocal<String> USER = new InheritableThreadLocal<>();\n\n@GetMapping(\"/report\")\npublic String report() {\n    TENANT.set(\"bj\");\n    USER.set(\"u1001\");\n    CompletableFuture.runAsync(() -> {\n        log.info(\"tenant={}, user={}\", TENANT.get(), USER.get());   // ①\n    }, bizExecutor);          // bizExecutor 为独立的复用线程池\n    return \"ok\";\n}", "options": [{"k": "A", "t": "① 处 TENANT.get() 为 null，普通 ThreadLocal 的值只属于设置它的那个线程"}, {"k": "B", "t": "InheritableThreadLocal 只在「新建子线程」的那一刻复制一次；线程池线程被复用时会残留上一次请求的值，导致数据串号"}, {"k": "C", "t": "要在线程池间可靠透传上下文，可用 TransmittableThreadLocal（TTL）包装线程池，或在提交任务前把值取到局部变量再作为参数传入"}, {"k": "D", "t": "只要在 Web 请求线程的 finally 里调用 remove()，就能保证线程池场景下不会串号"}], "answer": ["A", "B", "C"], "explain": "A 对：ThreadLocal 的值存放在每个 Thread 自己的 threadLocals 里，bizExecutor 的工作线程从未 set 过，自然是 null。B 对：InheritableThreadLocal 的复制发生在 Thread 构造方法中（从父线程的 inheritableThreadLocals 拷贝引用），线程池的线程只在创建时复制一次，之后被反复复用，第二个请求提交的任务会读到第一个请求残留的值——这正是「用户 A 看到用户 B 数据」这类事故的根因。C 对：TTL 通过装饰 Runnable/Executor，在任务「提交时捕获、执行前回放、执行后复原」，这才是线程池场景的正解；显式传参则是最朴素也最可靠的办法。D 错：remove() 只清理调用它的那个线程（Web 请求线程）的副本，池中工作线程持有的那份不受影响，必须在池线程内部执行完清理（或由 TTL 装饰器负责）。", "android": "类比主线程与子线程各有一份 Looper/ThreadLocal：主线程 set 的值子线程读不到；而线程池复用就像复用同一个 HandlerThread，上一个任务留下的状态没清干净，下一个任务就会读到脏数据。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 线程上下文传递"}, {"no": 22, "type": "multi", "body": "表 t_order(id, user_id, city, amount, status) 中 amount 与 city 均可能为 NULL。关于下面这条 SQL，说法<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "SELECT city, COUNT(*) AS c, SUM(amount) AS s, AVG(amount) AS a, user_id\nFROM t_order\nGROUP BY city\nHAVING SUM(amount) > 1000;", "options": [{"k": "A", "t": "AVG(amount) 会忽略 amount 为 NULL 的行，分母是非 NULL 的行数，因此通常不等于 SUM(amount)/COUNT(*)"}, {"k": "B", "t": "city 为 NULL 的行会被聚成单独一组（GROUP BY 中多个 NULL 被视为同一个分组键）"}, {"k": "C", "t": "MySQL 5.7+ 默认开启 only_full_group_by，SELECT 中出现既不在 GROUP BY 里、也未被聚合的 user_id 会直接报错"}, {"k": "D", "t": "把 HAVING SUM(amount) > 1000 改写成 WHERE SUM(amount) > 1000 效果完全相同"}], "answer": ["A", "B", "C"], "explain": "A 对：除 COUNT(*) 外的聚合函数（SUM/AVG/MAX/MIN/COUNT(列)）都会跳过 NULL，AVG 的分母是该列非 NULL 的行数，所以「平均值 ≠ 总和 ÷ 总行数」是常见的对账差异来源。B 对：虽然在 WHERE 比较中 NULL = NULL 结果是 UNKNOWN，但 GROUP BY / DISTINCT / UNION 采用的是「NULL 之间彼此相等」的分组语义，所有 NULL 归为一组。C 对：ONLY_FULL_GROUP_BY 是 5.7 之后的默认 sql_mode，select 列表里的非聚合列必须出现在 GROUP BY 中，否则报 Expression #5 of SELECT list is not in GROUP BY clause...；想拿组内某一行的值应使用 ANY_VALUE() 或明确的聚合函数。D 错：执行顺序是 FROM → WHERE → GROUP BY → 聚合 → HAVING → SELECT → ORDER BY，WHERE 在分组之前执行，此时聚合结果还不存在，写聚合函数会报 Invalid use of group function。", "android": "类比本地 Room 做统计：把「平均评分」写成 sum/总条数，遇到没打分（NULL）的记录就会把平均值算低——聚合口径必须和 NULL 处理规则对齐。", "kaodian": "AI 后端能力 - 数据库与ORM层 - SQL 聚合与分组语义"}, {"no": 23, "type": "multi", "body": "关于下面这个 Bean 的初始化过程，说法<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "@Component\npublic class InitDemo implements InitializingBean, ApplicationRunner, CommandLineRunner {\n\n    @Value(\"${app.name}\") private String name;\n\n    public InitDemo() { System.out.println(\"1-构造: \" + name); }\n\n    @PostConstruct public void post() { System.out.println(\"2-PostConstruct: \" + name); }\n\n    @Override public void afterPropertiesSet() { System.out.println(\"3-afterPropertiesSet\"); }\n\n    @Override public void run(ApplicationArguments args) { System.out.println(\"4-ApplicationRunner\"); }\n\n    @Override public void run(String... args) { System.out.println(\"5-CommandLineRunner\"); }\n}", "options": [{"k": "A", "t": "构造方法里 name 一定是 null，字段注入发生在实例化之后"}, {"k": "B", "t": "多个 Bean 之间的初始化先后顺序不由 @Order 决定（@Order 只影响集合注入排序、AOP 与过滤器顺序），要控制依赖顺序应使用 @DependsOn 或直接建立依赖注入关系"}, {"k": "C", "t": "ApplicationRunner / CommandLineRunner 在容器刷新完成、Web 容器已启动后才执行，多个 Runner 之间可用 @Order 控制顺序"}, {"k": "D", "t": "@PostConstruct 中抛出异常不影响应用启动，容器会跳过该 Bean 继续对外提供服务"}], "answer": ["A", "B", "C"], "explain": "A 对：Spring 先通过构造器实例化对象，之后才做属性填充（populateBean），所以构造方法里读 @Value/@Autowired 字段必然是 null；需要在构造期就用到依赖，应改用构造器注入。B 对：@Order/Ordered 影响的是「同类型 Bean 被注入成 List/数组时的排序」「多个切面的织入顺序」「Filter/Interceptor 的执行顺序」，它并不决定容器实例化 Bean 的先后；要保证 A 在 B 之前初始化，得用 @DependsOn(\"a\") 或干脆让 B 依赖注入 A。C 对：两个 Runner 都在 SpringApplication.run 的最后阶段被调用（此时 Web 端口已就绪），ApplicationRunner 拿到解析后的 ApplicationArguments，CommandLineRunner 拿到原始 String[]；多个 Runner 之间的相对顺序才是用 @Order 控制的。D 错：初始化阶段抛异常会被包装成 BeanCreationException 导致 ApplicationContext 刷新失败，应用直接启动失败退出——这种「起不来」比「带病降级运行」更安全，也是启动期做配置校验的价值所在。", "android": "类比 Application.attachBaseContext → onCreate → 首个 Activity onCreate 的顺序：在 attachBaseContext 里访问还没初始化的单例必然为空；而 Application.onCreate 抛异常时 App 直接闪退，不会带着半初始化状态继续跑。", "kaodian": "AI 后端能力 - 框架与容器层 - Bean 生命周期与启动流程"}, {"no": 24, "type": "multi", "body": "线上偶发报错 <code>HikariPool-1 - Connection is not available, request timed out after 30001ms</code>。结合下面配置，说法<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "spring:\n  datasource:\n    hikari:\n      maximum-pool-size: 10\n      minimum-idle: 10\n      connection-timeout: 30000     # 30s 借不到连接就报错\n      max-lifetime: 1800000         # 30min\n      idle-timeout: 600000", "options": [{"k": "A", "t": "该异常表示 30 秒内没能从池中借到连接，常见根因是连接泄漏（借了不还）、慢 SQL 长时间占用、池大小与并发不匹配"}, {"k": "B", "t": "事务方法里夹杂 RPC/HTTP 远程调用会长时间占着数据库连接，应把远程调用移出事务边界"}, {"k": "C", "t": "max-lifetime 应小于数据库侧 wait_timeout 与中间件（LVS/防火墙）的空闲断连时间，否则可能借到已被服务端单方面关闭的连接，报 broken pipe / CommunicationsException"}, {"k": "D", "t": "把 maximum-pool-size 调到 500 一定能解决问题，连接数越大吞吐越高"}], "answer": ["A", "B", "C"], "explain": "A 对：这是「借连接超时」而非「连不上数据库」，要先看是不是有连接没归还（未关闭的 Connection/SqlSession、手动 getConnection 后异常路径没 close）、有没有几秒级慢 SQL 长期占用，再看池容量。B 对：@Transactional 从方法进入就占用连接直到提交，中间调第三方接口一旦对方变慢，连接会被成倍放大占用，正确做法是「先本地事务提交，再发起远程调用」或把远程调用挪到事务外/异步化。C 对：数据库和中间设备会主动断掉空闲太久的连接，池里却仍认为可用，于是拿到「已死连接」；经验值是 max-lifetime 比 wait_timeout 小几十秒。D 错：连接数超过数据库的处理能力后，上下文切换与锁竞争会让 RT 更差、吞吐反降，经验公式约为「CPU 核数 × 2 + 有效磁盘数」，绝大多数服务几十个连接足矣；真正的解法是压缩单次持有连接的时间。", "android": "类比 OkHttp 的连接池与线程池：Response.body 忘了 close 就会一直占着连接直到耗尽——数据库连接泄漏和 HTTP 连接泄漏，现象（超时等待）和排查思路完全一致。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 连接池与线上排障"}, {"no": 25, "type": "multi", "body": "关于浏览器端的三种存储方式，说法<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "localStorage.setItem('token', 't1');\nsessionStorage.setItem('step', '2');\ndocument.cookie = 'sid=abc; Max-Age=3600; Path=/';", "options": [{"k": "A", "t": "localStorage 长期保存直到手动清理；sessionStorage 仅在当前标签页会话内有效，同源的新标签页读不到"}, {"k": "B", "t": "Cookie 会被浏览器自动附加到符合作用域的请求头上，而 localStorage / sessionStorage 不会自动发送，需要手动放进请求头"}, {"k": "C", "t": "localStorage / sessionStorage 是同步 API，读写大量数据会阻塞主线程；大容量、结构化数据应改用 IndexedDB"}, {"k": "D", "t": "Cookie 的作用域与 Storage 的同源策略完全一致，都严格区分协议、域名和端口"}], "answer": ["A", "B", "C"], "explain": "A 对：sessionStorage 以「标签页 + 源」为粒度，关闭标签页即清空，新开的同源标签页是独立的一份（通过 window.open 打开的新页会复制一份初始快照，之后互不影响）。B 对：这正是 Cookie 用于会话保持、而 Token 方案需要在拦截器里手动加 Authorization 头的原因；也因此 Cookie 天然面临 CSRF 风险，需要 SameSite 属性配合。C 对：两者都是同步阻塞 API 且容量约 5–10MB，存大 JSON 会造成明显卡顿；IndexedDB 是异步、事务型、容量大得多，适合离线数据。D 错：Cookie 的作用域由 Domain + Path 决定，不区分端口，并且可以通过 Domain=.demo.com 在父域与子域间共享；而 Storage 遵循严格同源（协议 + 域名 + 端口三者全同）。", "android": "类比：SharedPreferences（持久、同步 IO、易卡主线程）≈ localStorage；进程内内存缓存 ≈ sessionStorage；Room/SQLite ≈ IndexedDB；OkHttp 的 CookieJar 自动带 Cookie ≈ 浏览器自动附加行为。", "kaodian": "AI 前端能力 - 工程化与网络 - 浏览器存储"}, {"no": 26, "type": "multi", "body": "关于下面这两个高频事件优化函数，说法<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "function debounce(fn, delay) {\n  let timer = null;\n  return function (...args) {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn.apply(this, args), delay);\n  };\n}\n\nfunction throttle(fn, interval) {\n  let last = 0;\n  return function (...args) {\n    const now = Date.now();\n    if (now - last >= interval) { last = now; fn.apply(this, args); }\n  };\n}", "options": [{"k": "A", "t": "防抖：持续触发时不断重置定时器，只有停止触发超过 delay 才执行一次，适合搜索联想、表单实时校验"}, {"k": "B", "t": "节流：单位时间内最多执行一次，适合 scroll / resize / mousemove 等高频事件和按钮防连点"}, {"k": "C", "t": "debounce 内用箭头函数包住 fn.apply(this, args)，使 this 继承自返回函数的调用者，能正确保留 DOM 事件处理器中的 this"}, {"k": "D", "t": "把 debounce(handler, 300) 写在组件的 methods / 模块顶层被多个实例共用时，各实例天然拥有独立的 timer，互不影响"}], "answer": ["A", "B", "C"], "explain": "A、B 是两者的标准定义与适用场景：防抖关注「最后一次」，节流关注「均匀执行」。C 对：箭头函数不绑定自己的 this，它捕获的是外层 function(...args) 执行时的 this，也就是事件处理器里的 DOM 元素；如果这里写成普通 function，this 会变成 undefined 或 window。D 错：debounce 返回的闭包里只有一个 timer 变量，写在 methods 选项或模块顶层意味着这份闭包被所有组件实例共享，A 实例的输入会把 B 实例的定时器 clear 掉；正确做法是在 setup/created 中为每个实例单独创建（const onSearch = debounce(fn, 300) 放进 setup 内），并在组件卸载时清理定时器防止内存泄漏。", "android": "类比 Handler.removeCallbacks + postDelayed 实现搜索防抖，和用 SystemClock 时间差做按钮防连点（节流）；而把 Handler 声明成 static 让多个页面共用，同样会互相取消消息。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - 事件优化与闭包"}, {"no": 27, "type": "multi", "body": "关于下面这个 Spring Boot 集成测试，说法<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "@SpringBootTest\n@AutoConfigureMockMvc\nclass OrderApiTest {\n\n    @Autowired MockMvc mockMvc;\n    @MockBean  PayClient payClient;        // 替换容器中的真实 Bean\n\n    @Test\n    @Transactional\n    void createOrder() throws Exception {\n        given(payClient.pay(any())).willReturn(\"SUCCESS\");\n        mockMvc.perform(post(\"/orders\").contentType(APPLICATION_JSON).content(\"{...}\"))\n               .andExpect(status().isOk());\n    }\n}", "options": [{"k": "A", "t": "@MockBean 会用 Mockito 替身替换容器中同类型的 Bean，从而隔离掉真实的第三方调用"}, {"k": "B", "t": "测试方法上的 @Transactional 会让用例结束后自动回滚，保证用例可重复执行、互不污染数据"}, {"k": "C", "t": "@SpringBootTest 会加载完整应用上下文、启动较慢；若只想验证 Web 层可改用 @WebMvcTest 做切片测试"}, {"k": "D", "t": "使用 @MockBean 不影响 Spring TestContext 的上下文缓存，所有测试类始终复用同一个上下文"}], "answer": ["A", "B", "C"], "explain": "A 对：@MockBean 在上下文里注册/替换一个 Mockito mock，适合屏蔽支付、短信这类外部依赖；它与 @Mock 的区别是「进容器」，因此被测 Bean 拿到的就是这个替身。B 对：Spring TestContext 框架对测试方法上的 @Transactional 默认在方法结束后回滚（等价于 @Rollback(true)），需要真正落库时才加 @Commit；但要注意异步线程、独立事务（REQUIRES_NEW）以及真实 HTTP 端口（webEnvironment=RANDOM_PORT）场景下回滚不生效，因为它们不在同一个事务里。C 对：@WebMvcTest 只加载 MVC 相关组件（Controller、转换器、过滤器），配合 @MockBean 模拟 Service，启动速度快很多。D 错：@MockBean/@SpyBean 会改变上下文的配置签名，Spring 会为不同的 mock 组合创建并缓存不同的上下文，这正是「测试类一多，跑一遍要好几分钟」的主要原因——应尽量统一 mock 组合以提升上下文复用率。", "android": "类比 Hilt 测试里用 @BindValue / @UninstallModules 替换依赖（≈ @MockBean），以及用 in-memory Room 数据库保证用例之间数据干净（≈ 事务回滚）。", "kaodian": "AI 质量保障 - 自动化测试与工具 - Spring Boot 集成测试"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 28, "type": "judge", "body": "判断：下面这段 SQL 中，第二条 INSERT 得到的 id 是 <b>1</b>，因为前一个事务回滚后自增值会被归还。", "code": "CREATE TABLE t (id BIGINT AUTO_INCREMENT PRIMARY KEY, v INT) ENGINE=InnoDB;\n\nBEGIN;\nINSERT INTO t(v) VALUES (1);   -- 分配到 id = 1\nROLLBACK;\n\nINSERT INTO t(v) VALUES (2);   -- 这条拿到的 id 是多少？", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "第二条拿到的是 id = 2。InnoDB 的自增计数器在「分配」那一刻就已推进，且不随事务回滚而回退——因为回退需要长时间持有自增锁，会严重影响并发插入性能。因此主键出现空洞（1 被浪费掉）是完全正常的，业务绝不能依赖主键连续或用它当计数器。补充版本差异：MySQL 5.7 及以前自增计数器只存在内存中，实例重启后会用 max(id)+1 重新初始化（可能出现主键复用）；MySQL 8.0 起自增值会持久化到 redo log，重启后也不回退。批量插入时还受 innodb_autoinc_lock_mode 影响，可能出现更大的跳号。", "android": "类比 SQLite 的 AUTOINCREMENT：删除记录后 rowid 同样不复用，本地库里 id 跳号是常态，拿 id 当条数统计一定会算错。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 自增主键语义"}, {"no": 29, "type": "judge", "body": "判断：Spring Boot 2.x 默认使用 JDK 动态代理——只要目标类实现了接口就一定生成 JDK 代理；因此把 <code>@Transactional</code> 标注在<b>没有实现任何接口</b>的类上会失效。", "code": "@Service                      // 没有实现任何接口\npublic class OrderService {\n    @Transactional\n    public void createOrder(Order o) { ... }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "两个论断都不成立。Spring Boot 2.x 起 AopAutoConfiguration 默认设置 spring.aop.proxy-target-class=true，即无论目标类是否实现接口，一律使用 CGLIB 生成子类代理（「有接口就用 JDK 代理」是原生 Spring Framework 的默认行为，Boot 把它改掉了，目的是避免注入时按接口类型/实现类类型混用报错）。所以没有接口的类同样能被代理，@Transactional 正常生效。CGLIB 真正的限制是：不能代理 final 类、final 方法、private 方法和 static 方法。@Transactional 失效的常见真实原因是：同类内部自调用（this 调用绕过代理）、方法非 public、异常被 try-catch 吞掉、抛出检查型异常却没配 rollbackFor、以及方法所在类根本没被 Spring 管理。", "android": "类比运行时接口代理（Proxy.newProxyInstance）与编译期字节码增强（ASM/AspectJ 插桩）：Android 上的埋点、耗时统计走的是后者，因为它不要求目标类实现接口——CGLIB 子类代理属于同一类思路。", "kaodian": "AI 后端能力 - 框架与容器层 - AOP 代理机制"}, {"no": 30, "type": "judge", "body": "判断：下面代码中，异步方法抛出的异常可以被调用方的 try-catch 捕获并打印日志。", "code": "@Async\npublic void sendSms(Long id) {\n    throw new RuntimeException(\"短信网关超时\");\n}\n\n// 调用方\ntry {\n    notifyService.sendSms(1L);\n} catch (Exception e) {\n    log.error(\"捕获到异常\", e);        // 会打印吗？\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "捕获不到。@Async 方法被代理后立即提交给线程池并直接返回，异常发生在工作线程的调用栈里，与调用方已经不在同一个栈上，try-catch 自然拦不住。返回值为 void 时，异常由 AsyncUncaughtExceptionHandler 处理，默认实现 SimpleAsyncUncaughtExceptionHandler 只打一行错误日志，业务侧毫无感知——线上「短信没发出去也没人知道」的典型来源。三种处理方式：① 把返回值改为 CompletableFuture<T>/Future<T>，异常会被封装，调用方通过 get()（抛 ExecutionException）或 exceptionally/handle 感知；② 实现 AsyncConfigurer#getAsyncUncaughtExceptionHandler 做统一兜底告警；③ 在异步方法内部自行 try-catch 并落库/重试。另注意 @Async 同样受代理限制，自调用无效。", "android": "类比子线程或协程里抛异常：主线程的 try-catch 捕获不到，必须靠 CoroutineExceptionHandler / Thread.setUncaughtExceptionHandler 兜底，否则崩溃或静默丢失。", "kaodian": "AI 后端能力 - 框架与容器层 - 异步任务异常处理"}, {"no": 31, "type": "judge", "body": "判断：下面 Vue3 代码中，① 与 ② 两处都能正确打印出 100。", "code": "const price = ref(100)\n\nconst state = reactive({ price })       // ref 作为对象属性\nconst list  = reactive([ref(100)])      // ref 作为数组元素\n\nconsole.log(state.price)   // ①\nconsole.log(list[0])       // ②", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "① 输出 100（正确），② 输出的是 RefImpl 对象而不是 100。规则是：reactive 对象的「属性」上的 ref 会自动解包（访问 state.price 等价于 price.value，赋值也会写回 ref）；但数组元素以及 Map/Set 等集合类型中的 ref 不会自动解包，必须写 list[0].value。模板中同理：{{ price }} 顶层 ref 自动解包，而 {{ list[0] }} 会渲染出对象。相关易错点还有：reactive 对整数、字符串等原始类型无效；解构 reactive 对象会丢失响应性，需要 toRefs；ref 包裹对象时内部会自动转成 reactive 代理。", "android": "类比 LiveData/StateFlow：DataBinding 里绑定单个 LiveData 会自动取 value，但一旦把它塞进 List 里，就得自己 .value 取值——容器不会替你拆箱。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 响应式解包规则"}, {"no": 32, "type": "judge", "body": "判断：后端通过 <code>Set-Cookie: sid=xxx; HttpOnly; Secure</code> 下发的会话 Cookie，前端可以用 <code>document.cookie</code> 读到它并手动放进请求头；同时浏览器里的 Axios 也能通过 <code>response.headers['set-cookie']</code> 读到该响应头。", "code": "// 登录响应\nHTTP/1.1 200 OK\nSet-Cookie: sid=abc123; Path=/; HttpOnly; Secure; SameSite=Lax\n\n// 前端尝试\nconsole.log(document.cookie);                    // 能读到 sid 吗？\naxios.post('/login').then(r => console.log(r.headers['set-cookie']));", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "两处都错。① HttpOnly 的作用就是禁止 JavaScript 通过 document.cookie 访问该 Cookie，正是为了在 XSS 发生时保护会话凭证不被窃取，所以 document.cookie 里根本看不到 sid。② Set-Cookie 属于「禁止访问的响应头（forbidden response header name）」，浏览器环境下 XHR/fetch/Axios 都读不到；跨域时还叠加 CORS 限制——只有后端在 Access-Control-Expose-Headers 中显式暴露的自定义响应头（如 Content-Disposition）才能被前端读取。这类 Cookie 由浏览器自动携带：同站请求自动带上，跨域请求需要前端 withCredentials: true + 后端 Access-Control-Allow-Credentials: true 且 Allow-Origin 不能为 *。Secure 表示仅通过 HTTPS 发送，SameSite 用于限制跨站携带以防 CSRF。", "android": "类比 OkHttp 的 CookieJar 自动存取 Cookie，业务代码不直接读写；WebView 里也要通过 CookieManager 而不是注入 JS 去拿 HttpOnly Cookie。", "kaodian": "AI 前端能力 - 工程化与网络 - Cookie 与安全属性"}, {"no": 33, "type": "judge", "body": "判断：Mockito 3.4 之前的核心库无法直接 mock 静态方法；现在可以借助 mockito-inline 提供的 <code>Mockito.mockStatic()</code> 在 try-with-resources 作用域内模拟静态方法，且该模拟只对当前线程生效。", "code": "try (MockedStatic<DateUtil> mocked = Mockito.mockStatic(DateUtil.class)) {\n    mocked.when(DateUtil::now).thenReturn(LocalDate.of(2026, 8, 6));\n    assertEquals(\"2026-08-06\", service.todayLabel());\n}   // 作用域结束自动还原", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "描述正确。早期 Mockito 基于「创建子类/代理」的机制无法拦截 static 方法，只能借助 PowerMock 修改字节码，或者把静态调用包装成可注入的接口。Mockito 3.4+ 引入 mockito-inline（内联 Mock Maker，5.x 已成为默认）后，提供 mockStatic / mockConstruction 支持静态方法与构造函数的模拟。三个关键约束：① MockedStatic 必须在 try-with-resources 中使用或手动 close，否则会污染同一线程后续用例（报 static mocking is already registered）；② 其作用域是线程级的，多线程测试中其他线程看到的仍是真实实现；③ 它是「补救手段」而非首选，更好的做法是可测试性设计——例如用注入的 Clock 替代 System.currentTimeMillis()、把工具类静态方法改为可注入的组件。", "android": "类比单测里要 mock TextUtils.isEmpty、Log.d 这类 Android 静态方法：要么用 Robolectric/mockStatic，要么把它们封装成可注入的工具接口——后者才是长期可维护的选择。", "kaodian": "AI 质量保障 - 自动化测试与工具 - 静态方法模拟"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+q.no+'" data-no="'+q.no+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+q.no+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q.no==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=document.querySelector('.card[data-no="'+btn.dataset.no+'"]'); gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
