<script type="application/json" id="quizData">{"id": "vol11", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "MySQL 索引下推（ICP）的作用是？", "code": "-- 联合索引 idx_age_city(age, city)\nSELECT * FROM user WHERE age>20 AND city LIKE 'B%';\n-- 开启 ICP 后", "options": [{"k": "A", "t": "在存储引擎层用索引中『city』列提前过滤，减少回表次数"}, {"k": "B", "t": "把排序下推到客户端"}, {"k": "C", "t": "把 LIMIT 下推到存储引擎"}, {"k": "D", "t": "把 JOIN 下推到存储引擎"}], "answer": "A", "explain": "索引下推（Index Condition Pushdown）：当 WHERE 中部分条件可用索引列判断时，存储引擎在取索引阶段就先过滤（如本例用 city LIKE 在引擎层筛），减少回表与server层负担。B/C/D 都不是 ICP 语义。", "kaodian": "AI后端能力-数据存储与ORM层-SQL索引下推"}, {"no": 2, "type": "single", "body": "MySQL 默认隔离级别（REPEATABLE READ）下，下列描述正确的是？", "code": "-- RR 下\n-- 事务A: SELECT 两次得到一致快照（MVCC）\n-- 事务B: 插入新行并提交\n-- A 再 SELECT 仍看不到 B 的插入（防幻读靠间隙锁）", "options": [{"k": "A", "t": "RR 通过 MVCC 快照读保证可重复读，并靠间隙锁/Next-Key Lock 防幻读"}, {"k": "B", "t": "RR 完全不能防止幻读"}, {"k": "C", "t": "RR 下每次 SELECT 都加表锁"}, {"k": "D", "t": "RR 是最低的隔离级别"}], "answer": "A", "explain": "InnoDB 的 RR：快照读（普通 SELECT）基于 MVCC 保证同一事务内多次读一致；当前读（加锁读）用 Next-Key Lock（间隙+记录锁）防止幻读插入。RR 不是最低（最低是 READ UNCOMMITTED），也不是每次加表锁。", "kaodian": "AI后端能力-数据存储与ORM层-数据库事务隔离"}, {"no": 3, "type": "single", "body": "Spring AOP 中下列切点表达式匹配的是？", "code": "@Pointcut(\"execution(* com.x.service..*Service.*(..))\")", "options": [{"k": "A", "t": "com.x.service 包及其子包下，类名以 Service 结尾的所有类的所有方法"}, {"k": "B", "t": "仅匹配 com.x.service 包（不含子包）下的类"}, {"k": "C", "t": "只匹配返回值为 void 的方法"}, {"k": "D", "t": "只匹配带参数的方法"}], "answer": "A", "explain": "execution 表达式：第一个 * 是返回类型任意；com.x.service..*Service 表示 com.x.service 及其子包下类名以 Service 结尾；*(..) 是任意方法名、任意参数。.. 表示多级包，* 通配。B 错在漏了子包。", "kaodian": "AI后端能力-应用框架层-SpringAOP切点"}, {"no": 4, "type": "single", "body": "Redis Stream 作为消息队列，消费者读取未消费消息用？", "code": "// 创建消费者组并从最新/开头读\nXGROUP CREATE mystream mygrp $ \nXREADGROUP GROUP mygrp c1 COUNT 1 STREAMS mystream >", "options": [{"k": "A", "t": "XREADGROUP 配合消费者组，用 > 读取尚未投递给本消费者的新消息"}, {"k": "B", "t": "用 LPOP 从左边弹出"}, {"k": "C", "t": "用 BRPOP 阻塞弹出"}, {"k": "D", "t": "用 SUBSCRIBE 订阅"}], "answer": "A", "explain": "Redis Stream 是持久化、可消费的队列：用 XGROUP CREATE 建消费者组，XREADGROUP GROUP g c > 读取『尚未投递给该消费者』的新消息（> 表示新消息）。LPOP/BRPOP 是 List 队列；SUBSCRIBE 是 Pub/Sub 无持久。", "kaodian": "AI后端能力-高并发与中间件层-RedisStream"}, {"no": 5, "type": "single", "body": "synchronized 与 ReentrantLock 的区别，正确的是？", "code": "ReentrantLock lock = new ReentrantLock();\nlock.lock();\ntry { ... } finally { lock.unlock(); }\n// synchronized 无需手动释放", "options": [{"k": "A", "t": "synchronized 自动释放锁；ReentrantLock 需手动 unlock（通常放 finally）"}, {"k": "B", "t": "ReentrantLock 不支持可重入"}, {"k": "C", "t": "synchronized 可以中断等待"}, {"k": "D", "t": "两者都不支持公平锁"}], "answer": "A", "explain": "synchronized JVM 自动加解锁、不可中断、非公平；ReentrantLock 需手动 unlock（放 finally 防死锁），支持可中断(lockInterruptibly)、公平/非公平、多条件Condition。B 错（都可重入）；C/D 反了。", "kaodian": "AI后端能力-语言与计算层-锁机制"}, {"no": 6, "type": "single", "body": "微服务中服务注册发现的作用是？", "code": "// 启动时注册\nDiscoveryClient.register(\"order-service\", ip, port);\n// 调用时从注册中心拉取可用实例列表并负载均衡", "options": [{"k": "A", "t": "服务实例启动时向注册中心登记，调用方动态发现实例并做客户端负载均衡"}, {"k": "B", "t": "服务注册发现用于数据库分库"}, {"k": "C", "t": "注册中心只在编译期起作用"}, {"k": "D", "t": "调用方必须写死目标 IP"}], "answer": "A", "explain": "注册发现（Nacos/Eureka/Consul）：实例启动上报地址到注册中心，调用方从中心获取健康实例列表并负载均衡，实现解耦与弹性扩缩容。避免写死 IP，与数据库分库无关。", "kaodian": "AI后端能力-微服务与云原生层-服务注册发现"}, {"no": 7, "type": "single", "body": "MyBatis-Plus 自动填充（如 create_time/update_time）需配合？", "code": "@TableField(fill = FieldFill.INSERT)\nprivate LocalDateTime createTime;\n// 并实现\n@Component\npublic class MyMetaObjectHandler implements MetaObjectHandler {\n  public void insertFill(MetaObject o){ setFieldValByName(\"createTime\", now(), o); }\n}", "options": [{"k": "A", "t": "实体字段标 @TableField(fill) + 实现 MetaObjectHandler 自动写入"}, {"k": "B", "t": "只需在 SQL 里手写默认值"}, {"k": "C", "t": "自动填充由数据库触发器完成"}, {"k": "D", "t": "MP 默认会自动填充所有时间字段"}], "answer": "A", "explain": "MP 自动填充：① 字段注解 @TableField(fill=INSERT/UPDATE) 声明时机；② 实现 MetaObjectHandler 的 insertFill/updateFill 用 setFieldValByName 赋值。框架在持久化时自动调用，免去每处手写。B/C/D 错。", "kaodian": "AI后端能力-数据存储与ORM层-MP自动填充"}, {"no": 8, "type": "single", "body": "Vue3 组件生命周期中，onMounted 的触发时机是？", "code": "onMounted(() => { console.log('挂载完成，DOM 可用'); });\n// setup 中调用", "options": [{"k": "A", "t": "组件挂载到 DOM 后、可安全访问 DOM/子组件时触发"}, {"k": "B", "t": "组件创建前触发"}, {"k": "C", "t": "组件销毁时触发"}, {"k": "D", "t": "每次数据更新都触发"}], "answer": "A", "explain": "onMounted 在组件完成初始渲染、挂载到真实 DOM 后调用，此时可访问 DOM、ref、子组件实例（适合初始化第三方库、发首屏请求）。创建前是 setup 本身；销毁是 onUnmounted；数据更新是 onUpdated。", "kaodian": "AI前端能力-语言与运行时-Vue3生命周期"}, {"no": 9, "type": "single", "body": "CSS box-sizing: border-box 的效果是？", "code": "* { box-sizing: border-box; }\n.box { width: 100px; padding: 10px; border: 2px; }", "options": [{"k": "A", "t": "width 包含 content+padding+border，元素总宽仍为 100px"}, {"k": "B", "t": "width 仅指 content，总宽变成 100+20+4=124px"}, {"k": "C", "t": "border-box 会忽略 padding"}, {"k": "D", "t": "box-sizing 只对行内元素生效"}], "answer": "A", "explain": "border-box：设定的 width/height 包含 content+padding+border，便于布局计算（总宽=100px，content 被压缩）。content-box（默认）下总宽=100+20+4。现代项目常全局重置为 border-box。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS盒模型"}, {"no": 10, "type": "single", "body": "下列 HTTP 状态码含义正确的是？", "code": "200 OK\n301 永久重定向\n400 请求参数错误\n401 未认证\n403 无权限\n404 资源不存在\n500 服务端错误", "options": [{"k": "A", "t": "401=未认证（未登录），403=已认证但无权限"}, {"k": "B", "t": "401 与 403 含义完全相同"}, {"k": "C", "t": "404 表示服务端内部错误"}, {"k": "D", "t": "500 是客户端错误"}], "answer": "A", "explain": "401 Unauthorized = 未认证（需要登录/凭证）；403 Forbidden = 已认证但权限不足。两者不同（A 正确）。404 是资源不存在（非服务端错）；5xx 才是服务端错误。", "kaodian": "AI前端能力-网络与BFF架构-HTTP状态码语义"}, {"no": 11, "type": "single", "body": "TypeScript 类型守卫（type guard）的作用是？", "code": "function isFish(x: Fish | Bird): x is Fish {\n  return (x as Fish).swim !== undefined;\n}\nif (isFish(animal)) animal.swim();  // 收窄为 Fish", "options": [{"k": "A", "t": "用『x is T』返回值类型谓词，在 if 块内把联合类型收窄为具体类型"}, {"k": "B", "t": "类型守卫只能用于数字类型"}, {"k": "C", "t": "isFish 返回 boolean 但不影响类型推断"}, {"k": "D", "t": "类型守卫必须写 throw"}], "answer": "A", "explain": "类型守卫函数返回 `x is T` 类型谓词，调用后 TypeScript 在 true 分支把变量收窄为该具体类型，获得对应成员提示与校验。它不限于数字；返回 boolean 但带谓词才收窄（C 错）。", "kaodian": "AI前端能力-语言与运行时-TS类型守卫"}, {"no": 12, "type": "single", "body": "Vue3 响应式基于 Proxy，下列描述正确的是？", "code": "const state = reactive({ count: 0 });\n// 读取 state.count 时收集依赖；修改时触发更新", "options": [{"k": "A", "t": "Proxy 拦截对象的 get/set，读取时收集依赖、写入时触发依赖更新"}, {"k": "B", "t": "Vue3 响应式仍用 Object.defineProperty"}, {"k": "C", "t": "Proxy 只能拦截数组不能拦截对象"}, {"k": "D", "t": "修改 state 不会触发任何更新"}], "answer": "A", "explain": "Vue3 用 Proxy 包裹对象，拦截 get（依赖收集 track）与 set（派发更新 trigger），实现精准响应式且能监听新增/删除属性与数组索引。Vue2 才用 Object.defineProperty。B/C/D 均错。", "kaodian": "AI前端能力-语言与运行时-Proxy与响应式"}, {"no": 13, "type": "single", "body": "前端全局错误捕获，下列能捕获『未处理的 Promise 拒绝』的是？", "code": "window.addEventListener('unhandledrejection', e => report(e.reason));\nwindow.onerror = (msg, src, line) => report(msg);", "options": [{"k": "A", "t": "window 的 unhandledrejection 事件专门捕获未处理的 Promise 拒绝"}, {"k": "B", "t": "window.onerror 能捕获所有 Promise 拒绝"}, {"k": "C", "t": "只能靠 try/catch 包裹每个 Promise"}, {"k": "D", "t": "Promise 错误无法被任何机制捕获"}], "answer": "A", "explain": "未处理的 Promise 拒绝触发 window 的 unhandledrejection 事件（A 正确），是前端监控必接的钩子。window.onerror 主要捕获运行时错误/资源加载错误，不覆盖 Promise 拒绝（B 错）。", "kaodian": "AI前端能力-前端生态-前端错误捕获"}, {"no": 14, "type": "single", "body": "长列表（上万条）渲染卡顿，最优解是？", "code": "// 只渲染可视区\nvisibleItems = items.slice(scrollTop / rowH, count);", "options": [{"k": "A", "t": "虚拟列表：仅渲染可视区域及缓冲的少量节点，大幅减少 DOM 数量"}, {"k": "B", "t": "一次渲染全部 DOM，浏览器会自己优化"}, {"k": "C", "t": "用 display:none 隐藏所有项"}, {"k": "D", "t": "把数据分成多个页面，用户翻页"}], "answer": "A", "explain": "虚拟列表（virtual scrolling）只渲染可视区+少量缓冲的 DOM 节点，用占位撑起总高度，滚动时复用节点，把上万 DOM 降到几十个，彻底解决卡顿。B 全量 DOM 必卡；C/D 体验差。", "kaodian": "AI前端能力-前端生态-虚拟列表"}, {"no": 15, "type": "single", "body": "单元测试的 AAA 模式指？", "code": "// Arrange 准备\nUser u = new User(\"a\");\n// Act 执行\nString r = svc.normalize(u);\n// Assert 断言\nassertEquals(\"A\", r);", "options": [{"k": "A", "t": "Arrange（准备）- Act（执行）- Assert（断言）三段式结构"}, {"k": "B", "t": "Always-Auto-Assert 自动断言"}, {"k": "C", "t": "Add-Adapt-Assert"}, {"k": "D", "t": "三个 A 指三个测试用例"}], "answer": "A", "explain": "AAA 是单元测试通用结构：Arrange 准备被测对象与依赖、Act 调用被测方法、Assert 校验结果。结构清晰、可读、易维护，是单测写作基本纪律。", "kaodian": "AI质量保障-自动化测试-单元测试AAA"}, {"no": 16, "type": "single", "body": "TDD（测试驱动开发）的核心节奏是？", "code": "// 1. 先写失败测试（红）\n// 2. 写最小实现让它通过（绿）\n// 3. 重构优化", "options": [{"k": "A", "t": "红（写失败测试）→ 绿（最小实现通过）→ 重构 的短循环"}, {"k": "B", "t": "先写实现再补测试"}, {"k": "C", "t": "只重构不写测试"}, {"k": "D", "t": "测试在发布前一次性补全"}], "answer": "A", "explain": "TDD 三步循环：先写会失败的测试（红）、再写刚好让测试通过的最小代码（绿）、最后重构改善设计而不破坏测试。强调『测试先行』驱动设计，而非先实现后补测。", "kaodian": "AI质量保障-自动化测试-TDD"}, {"no": 17, "type": "single", "body": "Mockito 中 mock 与 spy 的区别是？", "code": "List mock = mock(ArrayList.class);   // 全假，方法默认返回空\nList spy  = spy(new ArrayList());      // 真对象，未打桩调用真实方法", "options": [{"k": "A", "t": "mock 创建全假对象、方法默认返回空值；spy 包裹真实对象、未打桩走真实逻辑"}, {"k": "B", "t": "mock 调用真实方法，spy 全假"}, {"k": "C", "t": "两者完全一样"}, {"k": "D", "t": "spy 不能打桩"}], "answer": "A", "explain": "mock 生成假对象，所有方法默认返回默认值（0/null/false），适合纯隔离依赖；spy 基于真实实例，未 stub 的方法执行真实逻辑，适合部分替换。B 反了；spy 也可以打桩。", "kaodian": "AI质量保障-自动化测试-Mock框架Mockito"}, {"no": 18, "type": "single", "body": "测试计划（Test Plan）通常不包含？", "code": "// 测试计划内容\n- 测试范围与目标\n- 资源/进度/风险\n- 测试策略与准入准出", "options": [{"k": "A", "t": "具体每行业务代码的实现算法"}, {"k": "B", "t": "测试范围与覆盖目标"}, {"k": "C", "t": "测试资源与进度安排"}, {"k": "D", "t": "风险与应对策略"}], "answer": "A", "explain": "测试计划是管理文档：定义范围、目标、策略、资源、进度、风险、准入准出准则。它不写『业务代码实现算法』（那是开发/设计文档范畴）。B/C/D 都是计划要素。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试计划"}, {"no": 19, "type": "single", "body": "接口测试中用 Mock 替代未就绪的下游服务，目的是？", "code": "// 用 WireMock 模拟支付服务返回\nstubFor(get(\"/pay/status\").willReturn(okJson(\"{\"paid\":true}\")));", "options": [{"k": "A", "t": "解耦依赖，在未就绪/不稳定的下游下也能独立测当前接口"}, {"k": "B", "t": "用 Mock 替代数据库"}, {"k": "C", "t": "Mock 能验证下游内部逻辑"}, {"k": "D", "t": "Mock 让测试永远通过"}], "answer": "A", "explain": "接口 Mock（WireMock 等）在下游未开发完/不稳定时，模拟其响应，使被测接口可独立测试、构造异常场景，且稳定快速。它替代的是外部依赖而非数据库（B）；Mock 不验证下游自身逻辑（C）；不当使用会假绿（D 是风险非目的）。", "kaodian": "AI质量保障-接口测试-接口Mock"}, {"no": 20, "type": "single", "body": "用 AI 辅助评审测试用例时，合理的做法是？", "code": "review = ai.review(test_cases, spec)\n// AI 指出遗漏/歧义/重复", "options": [{"k": "A", "t": "让 AI 对照需求规格评审用例的覆盖缺口、歧义与重复，人工确认后补强"}, {"k": "B", "t": "AI 评审结果直接替代人工评审结论"}, {"k": "C", "t": "AI 只能统计用例数量不能评审质量"}, {"k": "D", "t": "AI 评审会拖慢流程应禁用"}], "answer": "A", "explain": "AI 可高效对照规格指出用例的覆盖缺口、歧义、重复，辅助测试工程师补全，但结论需人工把关（AI 可能误判需求）。B 越权；AI 能评质量（C 错）；合理使用提效而非拖慢（D 错）。", "kaodian": "AI质量保障-AI辅助测试-AI辅助用例评审"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "缓存『穿透 / 击穿 / 雪崩』三者的区别，正确的有？", "code": "// 穿透：查不存在的数据，缓存和DB都没有，请求直击DB\n// 击穿：热点key过期瞬间高并发穿DB\n// 雪崩：大量key同时失效/Redis宕机，DB被打垮", "options": [{"k": "A", "t": "穿透：查询根本不存在的数据，缓存无法命中且DB也无，需布隆过滤器/空值缓存"}, {"k": "B", "t": "击穿：单个热点 key 过期瞬间被高并发击穿到 DB，需互斥锁/逻辑过期"}, {"k": "C", "t": "雪崩：大量 key 同时失效或 Redis 宕机，请求洪峰打垮 DB，需错峰 TTL/高可用"}, {"k": "D", "t": "三者本质相同，解法也完全相同"}], "answer": ["A", "B", "C"], "explain": "三者诱因与解法不同：穿透是查不存在数据（布隆过滤器/空值缓存，A）；击穿是单热点过期瞬间并发（互斥锁/逻辑过期，B）；雪崩是批量失效/宕机（错峰 TTL/集群高可用，C）。D 错。", "kaodian": "AI后端能力-高并发与中间件层-缓存三兄弟辨析"}, {"no": 2, "type": "multi", "body": "Spring AOP 的通知（Advice）类型包括？", "code": "@Before     前置\n@After      最终（类似 finally）\n@AfterReturning 返回后\n@AfterThrowing  异常后\n@Around     环绕（最强大）", "options": [{"k": "A", "t": "前置通知 @Before：目标方法前执行"}, {"k": "B", "t": "环绕通知 @Around：可控制是否执行目标、前后都织入"}, {"k": "C", "t": "异常通知 @AfterThrowing：目标抛异常后执行"}, {"k": "D", "t": "返回通知 @AfterReturning：正常返回后执行"}], "answer": ["A", "B", "C", "D"], "explain": "Spring AOP 五类通知：@Before 前置、@After 最终（无论成败）、@AfterReturning 正常返回后、@AfterThrowing 异常后、@Around 环绕（可决定是否调用目标、前后织入，最灵活）。全选。", "kaodian": "AI后端能力-应用框架层-SpringAOP通知"}, {"no": 3, "type": "multi", "body": "常见限流算法有？", "code": "// 计数器：单位时间计数，超阈拒绝\n// 漏桶：恒定速率流出\n// 令牌桶：恒定速率发令牌，有桶容量可突发", "options": [{"k": "A", "t": "计数器/滑动窗口：统计时间窗内请求数"}, {"k": "B", "t": "漏桶算法：以恒定速率处理，平滑突发"}, {"k": "C", "t": "令牌桶算法：恒定发令牌，允许一定程度突发"}, {"k": "D", "t": "限流只能靠硬件负载均衡实现"}], "answer": ["A", "B", "C"], "explain": "主流限流：计数器/滑动窗口（A）、漏桶（恒定速率、平滑，B）、令牌桶（恒定发令牌、允许突发、更常用，C）。限流在应用/网关层即可实现（如 Sentinel/Guava RateLimiter），非只能靠硬件（D 错）。", "kaodian": "AI后端能力-微服务与云原生层-限流"}, {"no": 4, "type": "multi", "body": "实现响应式布局的常用技术有？", "code": "// 媒体查询\n@media (max-width: 768px) { ... }\n// 相对单位 + Flex/Grid\nwidth: 50%; font-size: 2vw;", "options": [{"k": "A", "t": "媒体查询 @media 按断点切换样式"}, {"k": "B", "t": "相对单位（%、vw/vh、rem）让尺寸随视口缩放"}, {"k": "C", "t": "Flex/Grid 弹性布局自适应剩余空间"}, {"k": "D", "t": "固定 px 写死宽度最响应式"}], "answer": ["A", "B", "C"], "explain": "响应式布局：媒体查询按视口断点套不同样式（A）；相对单位（%、vw、rem）随视口缩放（B）；Flex/Grid 弹性自适应（C）。固定 px 写死宽度恰恰不响应式（D 错）。", "kaodian": "AI前端能力-前端基础与渲染引擎-响应式布局"}, {"no": 5, "type": "multi", "body": "关于 WebSocket 正确的有？", "code": "const ws = new WebSocket('wss://x.com/push');\nws.onmessage = e => console.log(e.data);\nws.send('hello');", "options": [{"k": "A", "t": "WebSocket 是全双工长连接，服务端可主动推送消息给客户端"}, {"k": "B", "t": "基于单次 HTTP 握手升级协议，之后复用同一连接"}, {"k": "C", "t": "相比轮询，省去频繁建连与空响应开销"}, {"k": "D", "t": "WebSocket 只能传文本不能传二进制"}], "answer": ["A", "B", "C"], "explain": "WebSocket：通过一次 HTTP 握手升级为全双工长连接（A、B），服务端可主动推、省去轮询开销（C）。D 错：WebSocket 支持文本与二进制帧。", "kaodian": "AI前端能力-网络与BFF架构-WebSocket"}, {"no": 6, "type": "multi", "body": "测试报告与覆盖率指标通常关注？", "code": "// 报告含：通过率、失败分布、耗时\n// 覆盖率：行覆盖/分支覆盖/方法覆盖", "options": [{"k": "A", "t": "用例通过率与失败分布"}, {"k": "B", "t": "执行耗时与趋势（是否变慢）"}, {"k": "C", "t": "行覆盖、分支覆盖、方法/类覆盖率"}, {"k": "D", "t": "只看用例总数，数量多就代表质量高"}], "answer": ["A", "B", "C"], "explain": "测试报告/覆盖率度量：通过率与失败分布（A）、耗时与趋势（B）、行/分支/方法覆盖率（C）。D 错：用例数量多≠质量高，高覆盖也可能漏关键路径，需结合有效断言。", "kaodian": "AI质量保障-自动化测试-测试报告与覆盖率"}, {"no": 7, "type": "multi", "body": "风险驱动测试（Risk-based Testing）的做法有？", "code": "// 按业务影响 × 失败概率 排优先级\nhigh_risk = impact * probability", "options": [{"k": "A", "t": "按『业务影响 × 失败概率』评估风险，优先测高风险模块"}, {"k": "B", "t": "把有限测试资源投入到最易出事、最关键的路径"}, {"k": "C", "t": "所有功能平均分配测试时间"}, {"k": "D", "t": "高风险模块增加边界与异常用例密度"}], "answer": ["A", "B", "D"], "explain": "风险驱动测试：用 影响×概率 量化风险，优先保障高风险的『关键且易错』模块（A、B），并在其上加密边界/异常用例（D）。平均分配（C）效率低，不聚焦风险。", "kaodian": "AI质量保障-软件测试理论与质量体系-风险驱动测试"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "使用二级索引查询但 SELECT 包含非索引列时，InnoDB 会先通过二级索引找到主键，再回主键索引取完整行，这一步称为『回表』。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "二级索引叶子节点只存索引列+主键值。当查询需要索引外的列时，InnoDB 用主键回到聚簇索引（主键索引）取完整行，即回表。能用覆盖索引（所需列都在索引中）则避免回表。描述正确。", "kaodian": "AI后端能力-数据存储与ORM层-SQL回表"}, {"no": 2, "type": "judge", "body": "z-index 仅对定位元素（position 非 static）或 flex/grid 子项生效，且受层叠上下文（stacking context）约束。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "z-index 控制同一层叠上下文内元素的叠放顺序，只对定位元素（relative/absolute/fixed/sticky）及 flex/grid 直接子项有效；且父级建立新的层叠上下文会限制子元素 z-index 的作用范围。描述正确。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS层叠上下文"}, {"no": 3, "type": "judge", "body": "HTTP 中 GET、PUT、DELETE 通常被视为幂等（多次调用效果相同），而 POST 一般非幂等。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "语义上 GET/PUT/DELETE 幂等：GET 只读、PUT 覆盖同结果、DELETE 删一次与多次结果一致；POST 用于新建，多次提交可能产生多个资源，非幂等。这是 REST 设计基础，也影响重试安全性。", "kaodian": "AI前端能力-网络与BFF架构-HTTP幂等性"}, {"no": 4, "type": "judge", "body": "数据驱动测试（Data-Driven Testing）是把测试逻辑与测试数据分离，用多组输入数据驱动同一测试逻辑。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "数据驱动测试：测试脚本只写一次逻辑，数据（多组入参/期望）外置（Excel/JSON/DB），框架遍历数据执行，减少重复代码、便于扩充边界。是自动化测试核心模式。", "kaodian": "AI质量保障-自动化测试-数据驱动测试"}, {"no": 5, "type": "judge", "body": "质量模型（如 ISO/IEC 25010）从功能性、性能效率、兼容性、易用性、可靠性、安全性、可维护性、可移植性等多维度定义软件质量。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "ISO/IEC 25010 质量模型从八大特性（功能适合性、性能效率、兼容性、易用性、可靠性、安全性、可维护性、可移植性）刻画质量，是测试覆盖与质量评估的参考框架。描述正确。", "kaodian": "AI质量保障-软件测试理论与质量体系-质量模型"}, {"no": 6, "type": "judge", "body": "生产环境可观测性通常依赖日志、指标（Metrics）、链路追踪（Tracing）三大支柱，配合监控告警及时发现异常。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "可观测性三支柱：日志（事件细节）、指标（聚合数值如 QPS/错误率）、链路追踪（请求跨服务调用链）。三者结合 + 监控告警，才能在故障发生时快速定位。描述正确。", "kaodian": "AI质量保障-CI/CD与质量门禁-监控告警"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
