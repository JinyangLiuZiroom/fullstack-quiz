<script type="application/json" id="quizData">{"id": "vol17", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按「自如真卷 + 全栈认证大纲 + AI时代全栈工程实战能力认证大纲」出题：后端≈52%（缓存/Redis/MQ/MySQL/MyBatis-Plus/Spring/微服务）、前端≈24%、测试≈24%。每题给代码/配置/日志片段，问执行结果 / 补全缺失代码 / 判断框架用法或架构规范正误。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "下面代码往 Redis 写入一个字符串 key，写完后运维在 redis-cli 里执行 KEYS * 却看到 \"\\xac\\xed\\x00\\x05t\\x00\\x08user:1\" 这样的乱码 key。要让 key 在 redis-cli 中显示为可读的 user:1，应该怎么改？", "code": "@Configuration\npublic class RedisConfig {\n  @Bean\n  public RedisTemplate<String, Object> redisTemplate(RedisConnectionFactory cf) {\n    RedisTemplate<String, Object> t = new RedisTemplate<>();\n    t.setConnectionFactory(cf);\n    // 这里没有设置任何 Serializer\n    t.afterPropertiesSet();\n    return t;\n  }\n}\n\n// 业务代码\nredisTemplate.opsForValue().set(\"user:1\", user);", "options": [{"k": "A", "t": "不用改，RedisTemplate 默认就是字符串序列化，乱码是 redis-cli 编码问题"}, {"k": "B", "t": "调用 t.setKeySerializer(new StringRedisSerializer()) 显式指定 key 序列化器（或直接注入 StringRedisTemplate）"}, {"k": "C", "t": "在业务代码上加 @Cacheable 注解，Spring Cache 会自动修正 key 编码"}, {"k": "D", "t": "把 key 改成纯英文小写即可，中文字符才会出现 \\xac\\xed 前缀"}], "answer": ["B"], "explain": "RedisTemplate 的默认序列化器是 JdkSerializationRedisSerializer，它会把 String 也走 JDK 对象序列化，产生带类型头的二进制，头部固定是 0xAC 0xED（Java 序列化魔数），所以 redis-cli 看到乱码。解决办法是显式 setKeySerializer(new StringRedisSerializer())（value 一般配 GenericJackson2JsonRedisSerializer），或者直接用 Spring Boot 已经默认配好 String 序列化的 StringRedisTemplate。A 错：默认不是字符串序列化。C 错：@Cacheable 走的是 CacheManager，和 RedisTemplate 的序列化器是两套配置，且它自身默认也是 JDK 序列化。D 错：与是否中文无关，纯英文 key 一样会带 0xAC 0xED 头。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 序列化配置"}, {"no": 2, "type": "single", "body": "实体开启了 MyBatis-Plus 逻辑删除，执行 userMapper.selectById(1L) 时，框架真正发给 MySQL 的 SQL 是哪一条？", "code": "// 实体\n@Data\n@TableName(\"t_user\")\npublic class User {\n  @TableId private Long id;\n  private String name;\n  @TableLogic          // 逻辑删除标记\n  private Integer deleted;\n}\n\n# application.yml\nmybatis-plus:\n  global-config:\n    db-config:\n      logic-delete-value: 1\n      logic-not-delete-value: 0\n\n// 调用\nUser u = userMapper.selectById(1L);", "options": [{"k": "A", "t": "SELECT id,name,deleted FROM t_user WHERE id = 1"}, {"k": "B", "t": "SELECT id,name,deleted FROM t_user WHERE id = 1 AND deleted = 0"}, {"k": "C", "t": "SELECT id,name,deleted FROM t_user WHERE id = 1 AND deleted = 1"}, {"k": "D", "t": "DELETE FROM t_user WHERE id = 1"}], "answer": ["B"], "explain": "@TableLogic 生效后，MyBatis-Plus 会在所有自动生成的查询语句上追加「未删除」条件，即 AND deleted = 0（logic-not-delete-value）；而 deleteById 会被改写成 UPDATE t_user SET deleted = 1 WHERE id = 1，不是物理 DELETE。C 错：deleted = 1 是已删除值，会查不到正常数据。D 错：selectById 不会变成 DELETE。注意：自己写在 XML 里的自定义 SQL 不会被自动拼这个条件，需要手动加。", "kaodian": "AI 后端能力 - 数据存储与ORM层 - MyBatis-Plus 逻辑删除"}, {"no": 3, "type": "single", "body": "下面这段配置绑定，启动后 orderProps.getMaxRetryCount() 的值是多少？", "code": "@Component\n@ConfigurationProperties(prefix = \"app.order\")\npublic class OrderProps {\n  private int maxRetryCount;\n  private Duration timeout;\n  // getter / setter 省略\n}\n\n# application.yml\napp:\n  order:\n    max-retry-count: 5\n    timeout: 3s", "options": [{"k": "A", "t": "0，配置里是 max-retry-count 而字段是 maxRetryCount，名字不一致绑定失败"}, {"k": "B", "t": "5，@ConfigurationProperties 支持松散绑定（kebab-case 自动映射到 camelCase）"}, {"k": "C", "t": "启动直接报错 Binding to target failed"}, {"k": "D", "t": "必须写成 app.order.maxRetryCount 才能绑定成 5"}], "answer": ["B"], "explain": "@ConfigurationProperties 支持 Relaxed Binding（松散绑定）：max-retry-count、max_retry_count、maxRetryCount、MAX_RETRY_COUNT 都能绑定到 maxRetryCount，所以结果是 5；timeout: 3s 也会被自动转换成 Duration。这里的关键对比是 @Value(\"${app.order.max-retry-count}\") ——@Value 走的是精确占位符解析，不支持松散绑定，key 写错一个字符就直接启动失败或取不到值。所以配置项多、需要容错时优先用 @ConfigurationProperties。", "kaodian": "AI 后端能力 - 框架与中间件集成层 - 配置属性松散绑定"}, {"no": 4, "type": "single", "body": "RabbitMQ 消费者按下面方式处理消息，而 handle() 因为一条脏数据永远抛异常。这条消息会出现什么现象？", "code": "@RabbitListener(queues = \"order.queue\")\npublic void onMessage(Message msg, Channel channel) throws IOException {\n  long tag = msg.getMessageProperties().getDeliveryTag();\n  try {\n    handle(msg);                       // 永远抛异常\n    channel.basicAck(tag, false);\n  } catch (Exception e) {\n    channel.basicNack(tag, false, true);   // 注意第三个参数\n  }\n}\n\n# application.yml\nspring:\n  rabbitmq:\n    listener:\n      simple:\n        acknowledge-mode: manual", "options": [{"k": "A", "t": "消息被直接丢弃，队列恢复正常"}, {"k": "B", "t": "消息自动进入死信队列，最多重投 3 次"}, {"k": "C", "t": "requeue=true 会把消息重新入队并立刻再次投递给消费者，形成无限重试死循环（毒消息），CPU 与日志被打满"}, {"k": "D", "t": "消息被视为已确认，队列长度减一"}], "answer": ["C"], "explain": "basicNack(tag, multiple, requeue) 的第三个参数 requeue=true 表示「拒绝并重新入队」，Broker 会把消息放回队列头部立刻再投递，而业务永远失败，于是形成死循环——这就是典型的毒消息（poison message）。正确做法有三种：① requeue=false，让消息走队列绑定的死信交换机进入 DLX 队列人工处理；② 自己维护重试计数，超过阈值后 basicAck 丢弃并落库告警；③ 用 Spring Retry / RepublishMessageRecoverer 把失败消息转发到专门的 error 队列。A/D 错：requeue=true 既不丢弃也不算确认。B 错：只有 requeue=false（或消息 TTL/队列溢出）才走 DLX，RabbitMQ 原生 basicNack 没有自动重试次数上限。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RabbitMQ 消息确认与毒消息"}, {"no": 5, "type": "single", "body": "下面 Kafka 消费循环用 commitAsync() 提交位移，相比 commitSync() 主要风险是什么？", "code": "while (running) {\n  ConsumerRecords<String, String> records = consumer.poll(Duration.ofMillis(500));\n  for (ConsumerRecord<String, String> r : records) {\n    process(r);\n  }\n  consumer.commitAsync();     // 异步提交，不等 broker 响应\n}\n// 进程被 kill 时没有任何收尾逻辑", "options": [{"k": "A", "t": "commitAsync 会阻塞线程直到 broker 返回，吞吐比 commitSync 更低"}, {"k": "B", "t": "commitAsync 提交失败后不会自动重试，若最后一次提交丢失，消费者重启会从旧位移重新消费，造成重复消费；应在退出时（finally）用 commitSync 兜底"}, {"k": "C", "t": "commitAsync 能保证 exactly-once 语义，不需要业务幂等"}, {"k": "D", "t": "两者完全等价，只是方法名不同"}], "answer": ["B"], "explain": "commitSync 会阻塞并在可重试异常时自动重试，直到成功或抛出不可恢复异常；commitAsync 不阻塞、吞吐高，但失败后不重试（因为后面可能已有更大的位移在排队，重试旧位移反而会造成回退）。因此标准写法是：循环内用 commitAsync 保证吞吐，在 finally 里用 commitSync 做最后一次可靠提交，然后 consumer.close()。A 错：说反了，阻塞的是 commitSync。C 错：位移提交只能做到 at-least-once，exactly-once 需要事务或业务幂等（唯一键 / 状态机）。D 错：语义差别明显。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 位移提交策略"}, {"no": 6, "type": "single", "body": "表结构与 EXPLAIN 如下（字符集 utf8mb4），该查询完全用上了联合索引 idx_ab 的两个字段，key_len 应该是多少？", "code": "CREATE TABLE t (\n  id  BIGINT PRIMARY KEY,\n  a   INT         NOT NULL,\n  b   VARCHAR(10) NULL,\n  KEY idx_ab (a, b)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\nEXPLAIN SELECT id FROM t WHERE a = 1 AND b = 'x';\n-- key: idx_ab   key_len: ?", "options": [{"k": "A", "t": "44"}, {"k": "B", "t": "47"}, {"k": "C", "t": "43"}, {"k": "D", "t": "40"}], "answer": ["B"], "explain": "key_len 逐列累加：① a 是 INT NOT NULL = 4 字节，NOT NULL 不加额外字节；② b 是 VARCHAR(10)，utf8mb4 每字符最多 4 字节 = 10 × 4 = 40，变长字段固定 +2 字节存长度，可为 NULL 再 +1 字节存 NULL 标记，共 43。合计 4 + 43 = 47。记住三条口诀：定长按类型字节数、变长 +2、可 NULL +1。这也是排查「联合索引到底用到第几列」的关键手段——如果这里 key_len 只有 4，说明 b 没走上索引。", "kaodian": "AI 后端能力 - 数据存储与ORM层 - EXPLAIN key_len 计算"}, {"no": 7, "type": "single", "body": "下面代码期望分页查第 2 页 10 条，但项目里没有任何 MybatisPlusInterceptor 相关的 @Bean 配置。运行结果是什么？", "code": "// 期望：第 2 页，每页 10 条\nPage<User> page = new Page<>(2, 10);\nPage<User> result = userMapper.selectPage(page, new LambdaQueryWrapper<User>()\n        .eq(User::getStatus, 1));\n\nSystem.out.println(result.getRecords().size());\nSystem.out.println(result.getTotal());\n\n// 全局没有：\n// @Bean MybatisPlusInterceptor + PaginationInnerInterceptor", "options": [{"k": "A", "t": "正常分页，records 为 10 条，total 为符合条件的总数"}, {"k": "B", "t": "分页完全不生效：SQL 不带 LIMIT，records 返回所有 status=1 的记录，total 为 0"}, {"k": "C", "t": "启动阶段就抛 IllegalStateException 提示未配置分页插件"}, {"k": "D", "t": "records 为 10 条但 total 为 0"}], "answer": ["B"], "explain": "MyBatis-Plus 的物理分页依赖 PaginationInnerInterceptor 拦截器改写 SQL（追加 LIMIT 并额外执行一次 COUNT）。没注册插件时框架不会报错，selectPage 退化成普通查询：SQL 里没有 LIMIT，把全部命中记录都塞进 records，total 保持默认 0。这是线上很典型的隐性事故——数据量小时看不出问题，数据涨上来直接 OOM 或接口超时。正确配置：@Bean MybatisPlusInterceptor 中 addInnerInterceptor(new PaginationInnerInterceptor(DbType.MYSQL))。", "kaodian": "AI 后端能力 - 数据存储与ORM层 - MyBatis-Plus 分页插件注册"}, {"no": 8, "type": "single", "body": "下面用 Spring Retry 做远程调用重试，remoteCall() 每次都抛 RemoteException。外部调用 svc.call() 的最终返回或异常是什么？", "code": "@Service\npublic class PayService {\n  @Retryable(value = RemoteException.class,\n             maxAttempts = 3,\n             backoff = @Backoff(delay = 1000, multiplier = 2))\n  public String call() {\n    return remoteCall();     // 每次都抛 RemoteException\n  }\n\n  @Recover\n  public String recover(RemoteException e) {\n    return \"fallback\";\n  }\n}\n// 启动类已加 @EnableRetry；外部通过注入的 payService 调用", "options": [{"k": "A", "t": "重试耗尽后把 RemoteException 抛给调用方，@Recover 不会执行"}, {"k": "B", "t": "总共执行 3 次（首次 + 2 次重试）都失败后进入 @Recover，方法返回 \"fallback\""}, {"k": "C", "t": "无限重试直到成功"}, {"k": "D", "t": "只执行 1 次就进入 @Recover"}], "answer": ["B"], "explain": "maxAttempts=3 表示「总尝试次数 3」（首次调用也算一次），不是「额外重试 3 次」；backoff delay=1000、multiplier=2 表示间隔 1s、2s 递增。三次全失败后，Spring Retry 会寻找同一个 Bean 中签名匹配的 @Recover 方法（返回值类型兼容、第一个参数是抛出的异常类型），执行它并把其返回值作为整个调用的结果，所以返回 \"fallback\"。如果没有匹配的 @Recover，才会把最后一次异常抛给调用方（选项 A 描述的是无 @Recover 的情况）。另外要注意：和 @Transactional / @Async 一样，@Retryable 基于 AOP 代理，同类自调用不生效。", "kaodian": "AI 后端能力 - 框架与中间件集成层 - Spring 重试与降级"}, {"no": 9, "type": "single", "body": "用 Redis ZSET 做积分排行榜，执行下面命令后，最后一条命令的返回结果是什么？", "code": "> ZADD rank 100 \"u1\"\n(integer) 1\n> ZADD rank 85 \"u2\"\n(integer) 1\n> ZADD rank 95 \"u3\"\n(integer) 1\n> ZINCRBY rank 10 \"u2\"\n\"95\"\n> ZREVRANGE rank 0 1 WITHSCORES\n?", "options": [{"k": "A", "t": "1) \"u1\" 2) \"100\" 3) \"u2\" 4) \"95\""}, {"k": "B", "t": "1) \"u2\" 2) \"95\" 3) \"u3\" 4) \"95\""}, {"k": "C", "t": "1) \"u1\" 2) \"100\" 3) \"u3\" 4) \"95\""}, {"k": "D", "t": "1) \"u3\" 2) \"95\" 3) \"u1\" 4) \"100\""}], "answer": ["C"], "explain": "ZINCRBY 把 u2 从 85 加到 95，此时分数为 u1=100、u2=95、u3=95。ZREVRANGE 按分数从高到低取下标 0..1 共两个成员：第一名 u1(100)；u2 与 u3 同为 95，分数相同时 ZSET 按成员字典序排列，正序是 u2 < u3，而 ZREVRANGE 是整体逆序，所以第二名取到的是字典序更大的 u3。因此结果是 u1/100、u3/95，选 C。这个「同分按 member 字典序、逆序时反过来」的细节是排行榜实现里最容易踩的坑，业务上通常会把时间戳编进 score（如 score = 积分 * 1e10 - 时间戳）来保证稳定排序。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis ZSET 排行榜"}, {"no": 10, "type": "single", "body": "服务同时存在 Nacos 远程配置和本地 application.yml，且都配了 order.timeout。启动后 @Value(\"${order.timeout}\") 注入的是哪个值？", "code": "# bootstrap.yml（本地）\nspring:\n  application:\n    name: order-service\n  cloud:\n    nacos:\n      config:\n        server-addr: 127.0.0.1:8848\n        file-extension: yaml\n\n# application.yml（本地）\norder:\n  timeout: 3000\n\n# Nacos 上的 order-service.yaml\norder:\n  timeout: 8000", "options": [{"k": "A", "t": "3000，本地文件优先级永远最高"}, {"k": "B", "t": "8000，Nacos 配置中心作为外部化配置源优先级高于本地 application.yml，同名 key 覆盖本地"}, {"k": "C", "t": "启动报冲突错误，必须删掉一处"}, {"k": "D", "t": "随机取其中一个，取决于加载线程顺序"}], "answer": ["B"], "explain": "Spring Cloud 的 PropertySource 是有序集合，Nacos 配置在 bootstrap 阶段被加入到 environment 的靠前位置，属于外部化配置源，优先级高于本地 application.yml，因此同名 key 由远程值覆盖，注入 8000。补充几个高频细节：① 拉取的 dataId 默认是 ${spring.application.name}+${file-extension}，且 file-extension 默认是 properties，写 yaml 格式却不改这个参数会直接读不到；② 多配置源优先级：命令行参数 > 环境变量 > Nacos 扩展配置(ext-config，越靠后越优先) > Nacos 主配置 > 本地 application.yml；③ 想让远程配置改动实时生效需要 @RefreshScope 或用 @ConfigurationProperties。", "kaodian": "AI 后端能力 - 微服务与配置中心 - Nacos 配置优先级"}, {"no": 11, "type": "single", "body": "下面查询在 idx_name_age(name, age) 上执行，MySQL 5.6+ 对它的索引使用情况是？", "code": "CREATE TABLE user (\n  id   BIGINT PRIMARY KEY,\n  name VARCHAR(32),\n  age  INT,\n  city VARCHAR(32),\n  KEY idx_name_age (name, age)\n);\n\nEXPLAIN SELECT id, name, age, city FROM user\nWHERE name LIKE '张%' AND age = 20;", "options": [{"k": "A", "t": "name 走索引范围扫描；age 因为紧跟在范围条件之后不能用于定位，但 5.6+ 的索引下推（ICP）能在存储引擎层用索引里的 age 先过滤，减少回表，Extra 显示 Using index condition"}, {"k": "B", "t": "整条语句无法用索引，type = ALL 全表扫描"}, {"k": "C", "t": "name 和 age 都作为等值条件参与索引定位，key_len 覆盖两列"}, {"k": "D", "t": "只能用 age 这一列做索引过滤，name 被忽略"}], "answer": ["A"], "explain": "最左前缀原则：name LIKE '张%' 是可以用索引的范围条件（前缀匹配，不是 '%张'），但一旦出现范围条件，后续列 age 就不能再参与 B+ 树的定位（不能算进 key_len）。在 MySQL 5.6 之前，server 层只能拿 name 的范围结果逐条回表再判断 age；5.6 引入 Index Condition Pushdown（ICP）后，age = 20 这个条件被下推到存储引擎，在索引记录上就先过滤掉不匹配的行，大幅减少回表次数，EXPLAIN 的 Extra 会出现 Using index condition。注意这里 SELECT 带了 city，city 不在索引里，所以仍需回表，不是覆盖索引（Using index）。B 错：前缀 LIKE 能用索引。C 错：范围条件后面的列不参与定位。", "kaodian": "AI 后端能力 - 数据存储与ORM层 - 索引下推与最左前缀"}, {"no": 12, "type": "single", "body": "下面 Vue3 代码执行完毕，控制台一共打印几次 'calc'？", "code": "import { ref, computed } from 'vue';\n\nconst count = ref(0);\nconst double = computed(() => {\n  console.log('calc');\n  return count.value * 2;\n});\n\nconsole.log(double.value);   // (1)\nconsole.log(double.value);   // (2)\nconsole.log(double.value);   // (3)\ncount.value = 1;\nconsole.log(double.value);   // (4)", "options": [{"k": "A", "t": "4 次"}, {"k": "B", "t": "2 次"}, {"k": "C", "t": "1 次"}, {"k": "D", "t": "3 次"}], "answer": ["B"], "explain": "computed 是带缓存的惰性求值：第一次读取 .value 时执行计算函数并缓存结果（打印第 1 次 calc）；(2)(3) 依赖 count 没变，dirty 标记为 false，直接返回缓存，不重新执行；count.value = 1 只是把 computed 标记为 dirty（此时并不立即计算），(4) 再次读取时才重新执行（打印第 2 次 calc）。所以总共 2 次。这正是 computed 与 method 的核心差别——模板里写 {{ doubleFn() }} 每次渲染都会执行，而 {{ double }} 只在依赖变化后才重算。另外 watchEffect 是「依赖变了就立刻跑」，computed 是「用到了才跑」。", "kaodian": "AI 前端能力 - 框架与组件层 - Vue3 computed 缓存与惰性求值"}, {"no": 13, "type": "single", "body": "下面 Flex 布局中，.a 和 .b 最终的宽度分别是多少？", "code": "<div class=\"container\">\n  <div class=\"a\">A</div>\n  <div class=\"b\">B</div>\n</div>\n\n<style>\n.container { display: flex; width: 600px; }\n.a { flex: 2 1 0; }   /* grow shrink basis */\n.b { flex: 1 1 0; }\n</style>", "options": [{"k": "A", "t": ".a = 400px，.b = 200px"}, {"k": "B", "t": ".a = 300px，.b = 300px"}, {"k": "C", "t": ".a = 200px，.b = 100px"}, {"k": "D", "t": ".a = 450px，.b = 150px"}], "answer": ["A"], "explain": "flex 简写三个值依次是 flex-grow / flex-shrink / flex-basis。两个子项 basis 都是 0，说明初始占位为 0，剩余空间 = 600 - 0 - 0 = 600px，再按 grow 比例 2 : 1 分配：.a 得 600 × 2/3 = 400px，.b 得 600 × 1/3 = 200px。关键区别要记住：如果写成 flex: 2 1 auto / flex: 1 1 auto，basis 取内容宽度，会先扣掉内容宽度再按比例分剩余空间，结果就不是干净的 2:1 了。常见简写：flex: 1 等价于 flex: 1 1 0%（所以多个 flex:1 会等分容器），flex: auto 等价于 1 1 auto，flex: none 等价于 0 0 auto。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - Flex 弹性计算"}, {"no": 14, "type": "single", "body": "下面导出 Excel 的前端代码，如果去掉 responseType: 'blob' 这一行，会出现什么现象？", "code": "axios.get('/api/order/export', {\n  params: { month: '2026-08' },\n  responseType: 'blob'          // ← 若去掉这一行\n}).then(res => {\n  const url = URL.createObjectURL(res.data);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = 'order.xlsx';\n  a.click();\n  URL.revokeObjectURL(url);\n});\n\n// 后端响应头\n// Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\n// Content-Disposition: attachment; filename=order.xlsx", "options": [{"k": "A", "t": "没有任何影响，Content-Type 已经声明是 xlsx，浏览器会自动按二进制处理"}, {"k": "B", "t": "axios 默认 responseType 为 'json'，会把二进制流当文本/JSON 解析，字节被破坏，最终下载到的是一个打不开的损坏文件（或 createObjectURL 报类型错误）"}, {"k": "C", "t": "会触发 CORS 预检失败"}, {"k": "D", "t": "请求变成 POST，后端接不到参数"}], "answer": ["B"], "explain": "axios 的 responseType 默认是 'json'，它会先把响应体按字符串读取再尝试 JSON.parse。二进制文件经过文本解码（尤其是非法 UTF-8 字节被替换成 U+FFFD）后字节流已经不可逆地损坏，即使拼出 Blob 也无法被 Excel 打开；且 res.data 是字符串而非 Blob，URL.createObjectURL 传字符串会报参数类型错误。正确姿势：responseType: 'blob'（或 'arraybuffer'）。进阶细节：如果后端在失败时返回 JSON 错误体，因为已经声明 blob，需要用 await res.data.text() 再 JSON.parse 才能读出错误信息；文件名最好从 Content-Disposition 头解析，而不是前端硬编码。", "kaodian": "AI 前端能力 - 前后端交互层 - Axios responseType 二进制流"}, {"no": 15, "type": "single", "body": "前端开启了携带 cookie 的跨域请求，后端返回了下面的响应头，浏览器控制台会怎样？", "code": "// 前端\naxios.defaults.withCredentials = true;\naxios.get('https://api.example.com/user/profile');\n\n// 后端实际返回的响应头\nHTTP/1.1 200 OK\nAccess-Control-Allow-Origin: *\nAccess-Control-Allow-Credentials: true\nContent-Type: application/json", "options": [{"k": "A", "t": "请求成功，cookie 正常携带"}, {"k": "B", "t": "浏览器拦截响应并报错：当 credentials 模式为 include 时，Access-Control-Allow-Origin 不能是通配符 *，必须回显具体的请求源"}, {"k": "C", "t": "只是控制台警告，数据依然能拿到"}, {"k": "D", "t": "后端会抛 500 错误"}], "answer": ["B"], "explain": "CORS 规范明确规定：携带凭证（cookie / HTTP 认证信息）的跨域请求，Access-Control-Allow-Origin 不允许为 *，必须是精确的源，否则浏览器拒收响应，控制台报 \"The value of the 'Access-Control-Allow-Origin' header in the response must not be the wildcard '*' when the request's credentials mode is 'include'\"。注意错误发生在浏览器侧：请求其实已经打到后端、后端也正常返回了（所以后端日志看不出异常），只是响应被浏览器拦住，JS 拿不到数据。正确做法：后端读取请求的 Origin 并做白名单校验后回显该具体源，同时保留 Access-Control-Allow-Credentials: true；Spring 里对应 CorsConfiguration.setAllowedOriginPatterns(...) + setAllowCredentials(true)（Spring 5.3 后 allowedOrigins 设 * 与 allowCredentials 同时开启会直接启动报错）。此外 Allow-Origin 为具体源时应加 Vary: Origin 防止 CDN 缓存串源。", "kaodian": "AI 前端能力 - 前后端交互层 - CORS 凭证请求"}, {"no": 16, "type": "single", "body": "Vite 开发服务器（端口 5173）配置如下，前端发起 axios.get('/api/user/1')，请求最终被转发到后端的哪个 URL？", "code": "// vite.config.ts\nexport default defineConfig({\n  server: {\n    port: 5173,\n    proxy: {\n      '/api': {\n        target: 'http://localhost:8080',\n        changeOrigin: true,\n        rewrite: (path) => path.replace(/^\\/api/, '')\n      }\n    }\n  }\n});", "options": [{"k": "A", "t": "http://localhost:8080/api/user/1"}, {"k": "B", "t": "http://localhost:8080/user/1"}, {"k": "C", "t": "http://localhost:5173/api/user/1"}, {"k": "D", "t": "http://localhost:8080/"}], "answer": ["B"], "explain": "命中前缀 /api 后，rewrite 把路径开头的 /api 去掉，/api/user/1 → /user/1，再拼到 target 上，实际转发到 http://localhost:8080/user/1。两个高频坑：① 如果后端接口本身就带 /api 前缀（如 @RequestMapping(\"/api/user\")），加了这个 rewrite 反而会 404，此时应删掉 rewrite；② changeOrigin: true 表示把转发请求的 Host 头改成 target 的 host，后端做域名校验或 Nginx 按 Host 路由时必须开启。另外要理解代理只在开发期生效——它由 dev server 在服务端转发，属于服务器到服务器通信，不受浏览器同源策略约束，所以能「解决」跨域；生产环境需要靠 Nginx 反向代理或后端 CORS 头。", "kaodian": "AI 前端能力 - 工程化与构建层 - Vite 代理与路径重写"}, {"no": 17, "type": "single", "body": "下面是一个下单接口的自动化测试用例和实际响应，这个用例存在什么问题？", "code": "// 实际响应\n// HTTP/1.1 200 OK\n{\n  \"code\": 40001,\n  \"msg\": \"账户余额不足\",\n  \"data\": null\n}\n\n// 测试代码（Jest + supertest）\nit('创建订单应成功', async () => {\n  const res = await request(app).post('/api/order').send({ skuId: 1, num: 1 });\n  expect(res.status).toBe(200);      // 唯一断言\n});", "options": [{"k": "A", "t": "断言充分，HTTP 200 已经说明接口调用成功"}, {"k": "B", "t": "HTTP 状态码只反映传输层/协议层是否成功，业务失败被封装在响应体的 code 里；只断言 status 会让 code=40001 的失败用例误判为通过，必须同时断言业务 code 和关键业务字段"}, {"k": "C", "t": "应该把断言改成 expect(res.status).toBe(40001)"}, {"k": "D", "t": "这是后端设计错误，业务失败必须返回 HTTP 500"}], "answer": ["B"], "explain": "在「统一响应体」风格（{code, msg, data}）的项目里，HTTP 200 仅代表请求正常到达并返回，业务成败由响应体的 code 表达。只断言 res.status === 200 会漏掉所有业务失败，是典型的假阳性（false pass）用例——测试全绿但功能是坏的。完整断言至少三层：① 协议层 status；② 业务层 code / msg；③ 数据层关键字段（如 data.orderId 存在、金额与预期一致）。C 错：status 与业务 code 是两个不同维度，不能混用。D 不能一概而论：业务语义失败用 200 + 业务 code 是常见约定（也有团队用 4xx 语义化返回），但无论哪种约定，测试都必须校验业务层结果。", "kaodian": "AI 质量保障 - 接口测试 - 业务 code 与断言分层"}, {"no": 18, "type": "single", "body": "本次迭代只改动了「订单退款」模块的一个金额计算方法，历史回归用例共 2000 条、全量跑一轮要 6 小时，而发布窗口只剩 1.5 小时。最合理的回归策略是？", "code": "# 变更内容（git diff --stat）\nRefundAmountCalculator.java | 18 +++---\n\n# 调用链（静态分析结果）\nRefundAmountCalculator\n  <- RefundService.apply()        <- /api/refund/apply\n  <- SettlementJob.dailySettle()  <- 每日结算定时任务\n  <- AccountService.writeBack()   <- 账户余额回写", "options": [{"k": "A", "t": "只测退款申请这一个接口，改动很小、影响可控"}, {"k": "B", "t": "做变更影响分析，把退款本身 + 受影响的下游链路（结算定时任务、账户余额回写）以及核心主流程（下单、支付）的高优用例挑出来组成回归集，配合自动化优先跑"}, {"k": "C", "t": "必须全量执行 2000 条用例，否则质量无法保证，申请延期发布"}, {"k": "D", "t": "跳过回归，本次只上线到灰度环境靠线上监控兜底"}], "answer": ["B"], "explain": "回归测试的目标是验证「改动没有破坏原有功能」，在资源受限时靠的是基于变更影响分析（Change Impact Analysis）的用例筛选，而不是二选一的「只测改动点」或「全量重跑」。筛选维度通常包括：① 直接受影响的功能点（退款申请）；② 通过调用链间接受影响的模块（结算任务、账户回写）；③ 与之共享数据/状态的模块；④ 与业务收入强相关的核心主流程（下单、支付）冒烟；⑤ 历史缺陷密集区与曾经回归失败过的用例。A 漏掉了下游链路——金额计算被结算任务复用，最容易出「接口正常但对账错」的隐性问题。C 不区分优先级、浪费窗口。D 放弃质量门禁，把风险直接抛给线上。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 回归测试用例筛选"}, {"no": 19, "type": "single", "body": "下面 Playwright 用例在 CI 上偶发失败（约 10% 概率超时）。最合理的优化方式是？", "code": "await page.click('#submit');\nawait page.waitForTimeout(3000);        // 固定硬等 3 秒\nawait expect(page.locator('.result')).toHaveText('提交成功');", "options": [{"k": "A", "t": "waitForTimeout 是官方推荐做法，保持不变"}, {"k": "B", "t": "去掉固定等待，直接用 expect(locator).toHaveText(...)：Web-First 断言自带 auto-wait 与轮询重试，会在超时上限内不断重试直到元素出现且文本匹配，既更稳定也更快"}, {"k": "C", "t": "把 waitForTimeout 从 3000 加大到 15000，等待越久越稳"}, {"k": "D", "t": "改成 while 循环里反复 page.reload() 直到断言通过"}], "answer": ["B"], "explain": "固定 sleep 是自动化测试不稳定（flaky）的头号来源：机器慢时 3 秒不够就失败，机器快时又白等 3 秒拖慢流水线，本质上是在猜时间。Playwright 的 expect(locator).toHaveText/ toBeVisible 等 Web-First 断言内置 auto-wait + 轮询重试机制，在 timeout（默认 5s，可用 { timeout } 或全局配置调整）内持续重试，元素一就绪立即通过。C 只是把偶发失败的概率压低，代价是流水线整体变慢，问题没有根治。D 反复 reload 会破坏页面状态、掩盖真实缺陷，属于更糟的实践。补充：定位器优先用 getByRole/getByTestId 这类语义化选择器，比 CSS 选择器更抗 UI 重构。", "kaodian": "AI 质量保障 - 自动化测试与工具 - Playwright 自动等待"}, {"no": 20, "type": "single", "body": "某前端项目的 CI 流水线如下，一个 PR 引入了类型错误（把 string 赋给了 number 字段）。流水线的实际表现是？", "code": "# .github/workflows/ci.yml\njobs:\n  build:\n    steps:\n      - run: npm ci\n      - run: tsc --noEmit          # 步骤 A：仅类型检查，不产出文件\n      - run: npm run lint          # 步骤 B\n      - run: npm run build         # 步骤 C：vite build（esbuild 转译）\n      - run: npm run test:e2e      # 步骤 D", "options": [{"k": "A", "t": "步骤 C 才会失败，因为只有真正打包时才会做类型检查"}, {"k": "B", "t": "步骤 A 就以非 0 退出码失败并中断后续步骤（B/C/D 不再执行），PR 的必需检查不通过因而无法合并"}, {"k": "C", "t": "类型错误只产生 warning，四个步骤全部通过"}, {"k": "D", "t": "步骤 D 运行时才会暴露该问题"}], "answer": ["B"], "explain": "tsc --noEmit 的作用就是「只做类型检查、不产出 JS」，发现类型错误即以非 0 退出码结束；CI 中任一步骤非 0 退出默认中断整个 job，所以 B/C/D 都不会执行，配合分支保护规则（required status checks）PR 就无法合入。关键认知：Vite/esbuild 打包时只做语法转译（transpile-only）并会丢弃类型信息，默认不做类型校验，所以选项 A 的「打包会拦住类型错误」是错的——这正是必须在流水线里单独加一步 tsc --noEmit 作为类型门禁的原因。质量门禁的通用设计是「越早越便宜」：类型检查/Lint（秒级）→ 单元测试（分钟级）→ E2E（十分钟级），快的先跑，早失败早反馈。", "kaodian": "AI 质量保障 - CI/CD 流水线 - 类型检查质量门禁"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "表 user 上只有联合索引 idx_name_age(name, age)。下面四条 WHERE 条件中，哪些会导致索引失效（走全表扫描或无法用索引定位）？（多选、少选、错选均不得分）", "code": "-- 表结构\nKEY idx_name_age (name, age)   -- name VARCHAR(32), age INT\n\n-- A\nSELECT * FROM user WHERE name LIKE '%三';\n-- B\nSELECT * FROM user WHERE LEFT(name, 2) = '张三';\n-- C\nSELECT * FROM user WHERE age = 20;\n-- D\nSELECT * FROM user WHERE name = '张三' AND age = 20;", "options": [{"k": "A", "t": "A：name LIKE '%三' 以通配符开头"}, {"k": "B", "t": "B：对索引列使用了函数 LEFT(name, 2)"}, {"k": "C", "t": "C：只给了 age 条件，跳过了联合索引的首列 name"}, {"k": "D", "t": "D：name、age 均为等值条件"}], "answer": ["A", "B", "C"], "explain": "A 失效：B+ 树按前缀有序，以 % 开头无法确定检索起点，只能全表（或全索引）扫描；写成 LIKE '张%' 则可用。B 失效：对索引列做函数/表达式运算（LEFT、DATE()、SUBSTR、+0 等）会使索引列的有序性不可用，等价写法应改成 name LIKE '张三%'。C 失效于「索引定位」：违反最左前缀原则，跳过首列 name 无法用 idx_name_age 定位；不过要注意在 MySQL 8 中，若 SELECT 的列都被索引覆盖，优化器可能选择「索引全扫描 + 覆盖」（Extra: Using index）来避免回表，但这仍不是索引定位（type=index 而非 ref/range），效率远低于走首列。D 有效：完整等值命中两列。其他常见失效场景还有隐式类型转换（varchar 列传数字）、OR 连接非索引列、!= / NOT IN 导致优化器放弃索引、以及区分度极低时优化器主动选择全表。", "kaodian": "AI 后端能力 - 数据存储与ORM层 - 索引失效场景"}, {"no": 22, "type": "multi", "body": "下面是一段有缺陷的 Redis 分布式锁实现。关于修复这段代码，哪些说法是正确的？（多选、少选、错选均不得分）", "code": "// 现有实现（有多处缺陷）\npublic boolean lock(String key) {\n  Boolean ok = redis.opsForValue().setIfAbsent(key, \"1\");   // 无过期时间\n  if (Boolean.TRUE.equals(ok)) {\n    redis.expire(key, 30, TimeUnit.SECONDS);                // 与上一行非原子\n    return true;\n  }\n  return false;\n}\n\npublic void unlock(String key) {\n  redis.delete(key);                                        // 无归属校验\n}", "options": [{"k": "A", "t": "加锁必须用 SET key value NX EX 30 的单条原子命令（setIfAbsent(key, val, 30, SECONDS)），否则 setIfAbsent 成功后进程崩溃会留下永不过期的死锁"}, {"k": "B", "t": "value 应存唯一标识（如 UUID + 线程 ID），释放时先校验 value 是否属于自己，避免误删别人持有的锁"}, {"k": "C", "t": "释放锁要用 Lua 脚本把「比对 value」和「DEL」合成一个原子操作，否则校验通过后锁刚好过期并被他人获取，仍会误删"}, {"k": "D", "t": "只要把过期时间设得足够长（比如 24 小时），就不需要考虑业务执行超时和锁续期问题"}], "answer": ["A", "B", "C"], "explain": "A 正确：分两条命令时，setIfAbsent 成功后若进程宕机，expire 没来得及执行，key 永久存在形成死锁；SET NX EX 是单条命令天然原子。B 正确：如果 value 是固定值，A 的业务超时锁自动过期、B 拿到锁，此时 A 执行完直接 DEL 会删掉 B 的锁，造成互斥失效；value 存唯一标识才能判断归属。C 正确：即使先 GET 校验再 DEL，两步之间锁可能过期并被 B 抢到，仍然误删，必须用 Lua（if redis.call('get',KEYS[1])==ARGV[1] then return redis.call('del',KEYS[1]) else return 0 end）保证原子。D 错误：过期时间过长会让宕机场景下其他节点长时间拿不到锁，等于把可用性搭上；正确思路是设置合理 TTL + 后台看门狗自动续期（Redisson 的 watchdog 默认 30s、每 10s 续期），并保证业务本身幂等。此外要清楚 Redis 分布式锁在主从切换时可能丢锁，对强一致要求极高的场景需考虑 RedLock 或改用数据库/ZooKeeper 方案。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 分布式锁实现要点"}, {"no": 23, "type": "multi", "body": "为了让下面这条 RabbitMQ 消息「不丢失」，哪些配置或改动是必要且正确的？（多选、少选、错选均不得分）", "code": "// 生产端\nrabbitTemplate.convertAndSend(\"order.exchange\", \"order.create\", dto);\n\n// 消费端\n@RabbitListener(queues = \"order.queue\")\npublic void on(OrderDTO dto) {\n  orderService.create(dto);      // 处理中可能抛异常\n}\n\n# 当前配置（默认）\nspring:\n  rabbitmq:\n    publisher-confirm-type: none\n    listener:\n      simple:\n        acknowledge-mode: auto", "options": [{"k": "A", "t": "生产端开启 publisher-confirm-type: correlated 并实现 ConfirmCallback，确认消息已到达 Exchange；同时开启 publisher-returns + mandatory 捕获「到了 Exchange 但没路由到任何队列」的情况"}, {"k": "B", "t": "Exchange 与 Queue 声明为 durable=true，消息 deliveryMode=2（持久化），防止 Broker 重启后队列与消息一起消失"}, {"k": "C", "t": "消费端改为 acknowledge-mode: manual，业务成功后再 basicAck；失败时 basicNack(requeue=false) 让消息进入死信队列，避免自动 ack 导致「取到就算成功」而丢消息"}, {"k": "D", "t": "只要生产者和消费者在同一内网机房、网络稳定，就不需要任何额外配置"}], "answer": ["A", "B", "C"], "explain": "消息可靠性要分三段各自设防：① 生产者到 Broker——publisher confirm 确认落到 Exchange，publisher returns + mandatory 兜住「路由键写错、没有匹配队列」的静默丢弃；② Broker 自身——交换机/队列 durable + 消息持久化，否则重启即丢（注意持久化只降低丢失概率，宕机瞬间未刷盘的消息仍可能丢，要求更高就上镜像队列/Quorum 队列）；③ Broker 到消费者——关闭自动 ack 改手动 ack，auto 模式在 Spring AMQP 中虽会因异常触发重投，但一旦消息被取走而消费者进程立刻崩溃、或业务异常被 catch 吞掉，就会出现「已确认但没处理成功」，手动 ack 才能把确认时机和业务成功严格对齐；配合 requeue=false + DLX 处理毒消息。D 错误：网络稳定无法替代确认机制，消息丢失的主因是进程崩溃、Broker 重启、路由键配错，与内网带宽无关。另外无论怎么配，最终都必须保证消费端业务幂等（唯一键/去重表/状态机），因为可靠投递能做到 at-least-once，重复是常态。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RabbitMQ 可靠投递"}, {"no": 24, "type": "multi", "body": "下面代码中 A 使用默认传播行为 REQUIRED，B 使用 REQUIRES_NEW，且 B 是通过注入的代理对象调用（不是 this 自调用）。哪些描述是正确的？（多选、少选、错选均不得分）", "code": "@Service\npublic class OrderService {\n  @Autowired private LogService logService;   // 代理对象\n\n  @Transactional                              // REQUIRED\n  public void createOrder() {\n    orderMapper.insert(order);                // 写订单\n    logService.writeLog(\"created\");            // B：REQUIRES_NEW\n    throw new RuntimeException(\"boom\");        // A 之后抛异常\n  }\n}\n\n@Service\npublic class LogService {\n  @Transactional(propagation = Propagation.REQUIRES_NEW)\n  public void writeLog(String msg) {\n    logMapper.insert(msg);\n  }\n}", "options": [{"k": "A", "t": "调用 writeLog 时，外层 A 的事务会被挂起（suspend），B 在一个全新的、独立的物理事务中运行"}, {"k": "B", "t": "B 先提交，随后 A 因 RuntimeException 回滚；最终结果是日志记录保留、订单记录被回滚"}, {"k": "C", "t": "A 回滚会连带把已提交的 B 一起回滚，日志也不会留下"}, {"k": "D", "t": "如果 B 内部抛出未被 A 捕获的异常，异常会向上传播导致 A 也回滚"}], "answer": ["A", "B", "D"], "explain": "REQUIRES_NEW 的语义是「总是新建事务，若当前存在事务则挂起它」，两个事务在数据库层面相互独立、各自提交回滚。A 正确。B 正确：B 提交是真实落库，之后 A 抛 RuntimeException 只回滚 A 自己的订单插入，日志保留——这正是「记录操作日志/流水必须成功保存」场景选 REQUIRES_NEW 的原因。C 错误：已提交的独立事务无法被外层回滚（这也是它与 NESTED 的核心差别，NESTED 基于 savepoint，外层回滚会一起回退）。D 正确：事务独立不等于异常隔离，B 抛出的异常仍会沿调用栈冒泡，A 未 catch 就会触发 A 的回滚；想要「日志失败不影响主流程」必须在调用处 try-catch 掉。另外两个必记前提：@Transactional 依赖 AOP 代理，this 自调用一律失效；REQUIRES_NEW 会占用两个数据库连接，在高并发下若连接池偏小容易出现「外层持连接等内层拿连接」的自锁式耗尽。", "kaodian": "AI 后端能力 - 框架与中间件集成层 - 事务传播 REQUIRES_NEW"}, {"no": 25, "type": "multi", "body": "关于下面 Vue3 代码中 ref 与 reactive 的使用，哪些说法是正确的？（多选、少选、错选均不得分）", "code": "import { ref, reactive, toRefs } from 'vue';\n\nconst count = ref(0);\nconst state = reactive({ name: 'Tom', age: 18 });\n\nconsole.log(count.value);        // (1) js 中\nlet { name } = state;            // (2) 直接解构\nname = 'Jerry';                  // 视图会更新吗？\n\nlet obj = reactive({ a: 1 });\nobj = { a: 2 };                  // (3) 整体重新赋值", "options": [{"k": "A", "t": "ref 可以包装基本类型，在模板中会自动解包（写 {{ count }} 即可），但在 JS 里必须通过 .value 读写"}, {"k": "B", "t": "reactive 底层基于 Proxy，只能代理对象/数组/Map 等引用类型，传入基本类型不会产生响应式"}, {"k": "C", "t": "(2) 处直接解构 reactive 对象会得到普通值、丢失响应性，需要用 toRefs(state) 解构才能保持响应"}, {"k": "D", "t": "(3) 处把 reactive 返回的变量整体重新赋值为一个新普通对象后，依然保持响应性"}], "answer": ["A", "B", "C"], "explain": "A 正确：ref 用一个包装对象承载值，模板编译时会自动 unref，JS 中必须 .value（额外细节：ref 放在 reactive 对象里访问会自动解包，但放在数组或 Map 里不会自动解包）。B 正确：reactive 基于 Proxy 拦截对象属性的 get/set，基本类型没有属性可拦截，Vue 会直接原样返回并在开发环境给出警告，所以基本类型只能用 ref。C 正确：解构相当于把当前属性值拷贝到新变量，Proxy 的拦截链就断了，改新变量不会触发更新；toRefs 会把每个属性转成指向源对象的 ref，从而保留响应式连接。D 错误：obj = { a: 2 } 只是把局部变量指向了一个全新的普通对象，原 Proxy 被丢弃，响应性随之丢失——这就是为什么整体替换数据推荐用 ref（xxx.value = newObj）或 Object.assign(state, newObj) 就地更新。", "kaodian": "AI 前端能力 - 框架与组件层 - Vue3 响应式 API 辨析"}, {"no": 26, "type": "multi", "body": "本地 http://localhost:5173 访问 http://localhost:8080/api/user 报下面的错误。哪些做法能真正解决这个跨域问题？（多选、少选、错选均不得分）", "code": "// 浏览器 Console\nAccess to XMLHttpRequest at 'http://localhost:8080/api/user'\nfrom origin 'http://localhost:5173' has been blocked by CORS policy:\nNo 'Access-Control-Allow-Origin' header is present on the requested resource.\n\n// Network 面板：请求状态 (failed)，但后端日志里能看到接口已被调用", "options": [{"k": "A", "t": "后端返回正确的 CORS 响应头：Access-Control-Allow-Origin（具体源或 *）、Allow-Methods、Allow-Headers，并正确响应 OPTIONS 预检请求"}, {"k": "B", "t": "开发环境用 Vite devServer proxy（或生产环境 Nginx 反向代理）把 /api 转发到后端，让浏览器看到的是同源请求"}, {"k": "C", "t": "Spring 端用 @CrossOrigin 注解，或实现 WebMvcConfigurer.addCorsMappings / 注册 CorsFilter 做全局配置"}, {"k": "D", "t": "前端把 axios 的 baseURL 直接写成 http://localhost:8080，就能绕过浏览器同源策略"}], "answer": ["A", "B", "C"], "explain": "同源策略是浏览器的安全限制，注意错误里的关键线索：后端日志能看到请求，说明请求真的发出去了、后端也处理了，只是响应缺少 CORS 头被浏览器拦下——所以解决方向只有两条：让服务端授权（A、C），或让浏览器认为是同源（B）。A 是标准方案，要点是简单请求只需 Allow-Origin，而带自定义头（如 Authorization、Content-Type: application/json）或 PUT/DELETE 的非简单请求会先发 OPTIONS 预检，后端必须正确响应预检（Spring 中还要注意 Security 过滤器链要放行 OPTIONS，否则预检被 401 拦住）。B 是开发期最常用手段，代理由 dev server 在服务端完成转发，服务器之间通信不受同源策略约束。C 是 A 在 Spring 里的具体落地方式。D 错误：改 baseURL 不改变「跨源」这一事实，反而正是触发该错误的原因；同源要求协议、域名、端口三者完全一致，端口不同即跨域。", "kaodian": "AI 前端能力 - 前后端交互层 - 跨域解决方案"}, {"no": 27, "type": "multi", "body": "下面这个自动化用例在 CI 上时好时坏（flaky）。关于治理这类不稳定用例，哪些做法是正确的？（多选、少选、错选均不得分）", "code": "// 用例 1：创建用户\ntest('创建用户', async ({ page }) => {\n  await page.goto('/user/new');\n  await page.fill('#name', 'tom');   // 固定用户名\n  await page.click('#save');\n  await page.waitForTimeout(2000);   // 硬等\n});\n\n// 用例 2：依赖用例 1 创建出来的数据\ntest('编辑用户', async ({ page }) => {\n  await page.goto('/user/list');\n  await page.click('text=tom');      // 若用例 1 失败或并行执行，这里必挂\n  // ...\n});", "options": [{"k": "A", "t": "用框架自带的显式等待 / Web-First 断言（auto-wait 轮询重试）替代 waitForTimeout 固定睡眠"}, {"k": "B", "t": "用例之间必须相互独立：每个用例自备前置数据（API 直接建数据或用唯一后缀 tom_${uuid}），不依赖执行顺序和上一个用例的产物"}, {"k": "C", "t": "测试数据要做隔离与清理（独立账号/独立租户，用完即删或用事务回滚），避免脏数据让下次执行失败"}, {"k": "D", "t": "flaky 用例最省事的做法是配置自动重跑 3 次，只要有一次通过就算通过，不必定位根因"}], "answer": ["A", "B", "C"], "explain": "A 正确：固定 sleep 把结果绑死在机器性能上，是 flaky 的首要来源，应交给框架轮询等待。B 正确：用例间的顺序依赖会让失败雪崩（用例 1 挂了用例 2 必挂），也让并行执行直接失效；同时固定用户名 tom 在并行或重复执行时会撞唯一约束，应用 uuid/时间戳生成唯一数据，前置数据优先用 API/SQL 快速构造而不是走 UI。C 正确：数据隔离与清理（独立账号、租户隔离、after hook 清理、事务回滚）是自动化能长期稳定跑的基础。D 错误：重试机制可以作为临时降噪手段，但必须同时记录 flaky 率并追根因——把重试当解药会掩盖真实的竞态、接口超时、缓存未刷新等产品缺陷，最终让整个测试套件失去可信度（大家开始习惯性忽略红灯）。", "kaodian": "AI 质量保障 - 自动化测试与工具 - 用例稳定性与数据隔离"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 28, "type": "judge", "body": "判断：下面方法抛出的是受检异常 IOException，且 @Transactional 没有配置 rollbackFor，事务依然会回滚。", "code": "@Transactional\npublic void importFile(String path) throws IOException {\n  orderMapper.insert(order);          // 已写库\n  Files.readAllBytes(Paths.get(path)); // 抛 IOException（受检异常）\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "错误。Spring 声明式事务的默认回滚规则只针对 RuntimeException 及其子类和 Error，受检异常（Checked Exception，如 IOException、SQLException、自定义 extends Exception）默认不回滚，事务会正常提交，于是出现「文件读失败但订单已入库」的脏数据。修复方式：@Transactional(rollbackFor = Exception.class)，这也是大多数团队的强制编码规范。另外两个高频陷阱一起记住：① 在方法内部 try-catch 吞掉异常且不手动 setRollbackOnly，事务同样不会回滚；② 事务基于 AOP 代理，this 自调用、private/final 方法、以及未被 Spring 管理的对象上都不生效。", "kaodian": "AI 后端能力 - 框架与中间件集成层 - 事务回滚规则"}, {"no": 29, "type": "judge", "body": "判断：下面生产者未指定 key，消息被轮询分发到 order-topic 的 3 个分区。此时 Kafka 只能保证「同一分区内」消息有序，无法保证整个 Topic 全局有序。", "code": "# Topic 信息\norder-topic  partitions: 3  replication-factor: 3\n\n// 生产者：未指定 key\nfor (int i = 1; i <= 6; i++) {\n  producer.send(new ProducerRecord<>(\"order-topic\", \"msg-\" + i));\n}\n\n// 消费者组内 3 个消费者，各消费一个分区", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。Kafka 的有序性保证粒度是分区（partition），单分区内消息按写入顺序追加并被顺序消费；一旦 Topic 有多个分区，消息被分散写入，多个消费者并行消费，全局顺序无法保证——上面 msg-1..msg-6 完全可能以乱序被业务处理。业务上要求有序（例如同一订单的 创建→支付→取消 状态流转）时的标准做法：把业务主键作为 key（send(topic, orderId, msg)），相同 key 经默认分区器哈希后进入同一分区，从而保证「同一订单内部有序」，不同订单之间仍可并行。代价是分区数决定了消费并行度上限，且 key 分布不均会造成分区数据倾斜；另外要注意生产端 max.in.flight.requests.per.connection > 1 且开启重试时，失败重发也可能打乱单分区顺序，需开启幂等（enable.idempotence=true）来保证顺序。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 分区有序性保证"}, {"no": 30, "type": "judge", "body": "判断：在 Vue3 中，当 v-if 与 v-for 写在同一个元素上时，v-if 的优先级高于 v-for，因此下面代码会报错（item 未定义）。", "code": "<!-- Vue3 -->\n<li v-for=\"item in list\" v-if=\"item.active\" :key=\"item.id\">\n  {{ item.name }}\n</li>", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。Vue3 明确规定 v-if 的优先级高于 v-for（Vue2 恰好相反，是 v-for 优先），所以 v-if 会先于循环求值，此时 item 还不存在，运行时会抛出 item is not defined 的错误，ESLint 的 vue/no-use-v-if-with-v-for 规则也会直接告警。两种正确写法：① 把 v-if 提到外层 <template v-for> 的内部元素上，即 <template v-for=\"item in list\" :key=\"item.id\"><li v-if=\"item.active\">…</li></template>；② 更推荐用 computed 先过滤（const activeList = computed(() => list.filter(i => i.active))）再 v-for，既避免优先级问题，也不会每次渲染都对全量列表做判断，性能更好。", "kaodian": "AI 前端能力 - 框架与组件层 - 指令优先级"}, {"no": 31, "type": "judge", "body": "判断：用 AI 批量生成的下面这批接口测试数据，因为已经按等价类/边界值分好类并附带了预期结果，可以直接全量投入自动化回归，不需要人工复核。", "code": "# AI 生成的「优惠券金额」测试数据（业务规则：面额 0.01~500 元，两位小数）\n| 用例         | 输入 amount | AI 标注分类   | AI 给出的预期结果 |\n| 正常值       | 100.00      | 有效等价类    | 成功              |\n| 下边界       | 0.01        | 边界值        | 成功              |\n| 上边界       | 500.00      | 边界值        | 成功              |\n| 上边界外     | 500.01      | 无效等价类    | 成功  ← ?         |\n| 精度超限     | 10.999      | 无效等价类    | 成功  ← ?         |\n| 特殊字符     | 1e2         | 无效等价类    | 报错「参数非法」  |", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "错误。AI 辅助生成测试数据能大幅提升「造数据」和「分类打标」的效率，但它给出的预期结果（Test Oracle）是根据字面描述推测的，不理解真实业务规则，必须人工复核。上表里 500.01 与 10.999 都被标为无效等价类，预期结果却写成「成功」，与规则（面额 0.01~500、两位小数）直接矛盾——如果不复核就投入回归，这两条用例会把「本该拦截却放过」的缺陷固化成「正确行为」，比没有用例更危险（错误的断言基线会长期掩盖真实 bug）。落地时的正确用法：① AI 负责生成数据组合与初步分类，人工负责校验分类边界和预期结果；② 预期结果优先由需求文档/接口契约推导，而不是让 AI 自由发挥；③ 生成的数据要脱敏，禁止直接使用生产真实数据；④ 首次纳入回归集前跑一轮人工确认，之后才作为基线。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - AI 辅助测试数据校验"}, {"no": 32, "type": "judge", "body": "判断：回归测试指的是只测试本次迭代新增或修改的功能，不需要再验证之前已经测过的老功能。", "code": "# 迭代 N 变更\n- 修复：优惠券叠加计算 bug（改动 CouponCalculator）\n\n# 迭代 N 上线后线上反馈\n- 优惠券计算正常\n- 但「满减活动」金额算错了（复用了同一个 CouponCalculator，本次未回归）", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "错误。回归测试（Regression Testing）的定义恰恰相反：它的核心目的是验证「本次修改没有破坏原有功能」，重点验证对象就是已经测过的老功能，尤其是与改动点共享代码、共享数据或处于同一调用链上的模块。上面的案例就是典型的回归缺失——只验了优惠券本身，没验同样依赖 CouponCalculator 的满减活动，导致修一个 bug 引入另一个（回归缺陷）。而「只测新增/修改功能」是新功能测试（或确认测试 / 缺陷验证）的范畴，两者是互补关系而非替代。实践中回归集的构建依据：变更影响分析、核心业务主流程、历史高频缺陷模块、上次回归失败过的用例，并优先自动化以便每次迭代低成本重跑。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 回归测试概念"}, {"no": 33, "type": "judge", "body": "判断：下面 Playwright 脚本用 console.log 打印出了页面上的金额文本，人工看日志确认数值正确，因此这一步可以视为有效的自动化断言。", "code": "await page.click('#submit');\nconst amount = await page.locator('.total-amount').textContent();\nconsole.log('订单金额：', amount);      // 只打印，不校验\n\n// 期望金额应为 ￥99.00", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "错误。console.log 只是输出信息，不产生任何通过/失败的判定：无论金额是 ￥99.00 还是 ￥0.00，用例都会「绿灯」通过，本质上是把校验责任推给了人工看日志——这在 CI 无人值守场景下等于没有断言，是自动化测试里最常见的假阳性写法。正确写法是使用断言 API，例如 await expect(page.locator('.total-amount')).toHaveText('￥99.00')（Web-First 断言自带 auto-wait 重试），或 expect(amount).toBe('￥99.00')。日志的定位是失败后的辅助排查（配合 trace、screenshot、video），断言才是判定标准。判断一个自动化用例是否有效有个简单准则：把被测功能故意改坏，用例必须变红——如果依然是绿的，这个用例就是无效的。", "kaodian": "AI 质量保障 - 自动化测试与工具 - 断言与日志的区别"}]}]}</script>
<script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
