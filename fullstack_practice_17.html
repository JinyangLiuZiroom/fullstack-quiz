<script type="application/json" id="quizData">{"id": "vol17", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "秒杀扣库存要求「判断+扣减」原子执行，下列方案最合适的是？", "code": "-- KEYS[1]=stock:1001  ARGV[1]=购买数量\nlocal s = tonumber(redis.call('GET', KEYS[1]))\nif s == nil or s < tonumber(ARGV[1]) then return -1 end\nredis.call('DECRBY', KEYS[1], ARGV[1])\nreturn s - tonumber(ARGV[1])", "options": [{"k": "A", "t": "用 Lua 脚本执行，Redis 单线程串行执行整段脚本，判断与扣减不会被打断"}, {"k": "B", "t": "先 GET 判断再 DECRBY，两条命令分开发也是原子的"}, {"k": "C", "t": "用 WATCH + MULTI 一定不会失败，性能也最高"}, {"k": "D", "t": "扣成负数没关系，最后统一修正即可"}], "answer": "A", "explain": "Redis 执行 Lua 脚本期间不会插入其它命令，因此「读-判-写」这组复合操作具备原子性，是秒杀扣减的标准做法（EVAL/EVALSHA）。分开发两条命令存在竞态：多个客户端可能同时读到 s=1 都判定通过导致超卖（B 错）。WATCH+MULTI 是乐观锁，高并发下大量事务失败重试，吞吐差（C 错）。库存扣成负数意味着已经超卖，事后修正要退款/补偿，代价极高（D 错）。", "kaodian": "AI后端能力-高并发与中间件层-RedisLua原子扣减"}, {"no": 2, "type": "single", "body": "JDBC 批量插入 10 万条数据很慢，下列最关键的优化是？", "code": "jdbc:mysql://host:3306/db?useSSL=false\n// for 循环 addBatch，每 1000 条 executeBatch", "options": [{"k": "A", "t": "换成 for 循环逐条 execute，效果一样"}, {"k": "B", "t": "URL 加上 rewriteBatchedStatements=true，让驱动把多条 INSERT 重写成一条多值语句"}, {"k": "C", "t": "把批次大小改成 1 条一提交"}, {"k": "D", "t": "给表加更多索引，写入会更快"}], "answer": "B", "explain": "MySQL Connector/J 默认不重写批量语句，addBatch 实际仍是逐条发送，网络往返成为瓶颈。开启 rewriteBatchedStatements=true 后驱动会合并成 `INSERT INTO t VALUES (...),(...),(...)`，性能常有数量级提升。批次改小（C）只会更慢；索引越多写入越慢，因为每条都要维护索引（D 错）；逐条执行是最慢的方式（A 错）。此外还可关闭自动提交、按批提交事务。", "kaodian": "AI后端能力-数据存储与ORM层-JDBC批量写入优化"}, {"no": 3, "type": "single", "body": "一个 HTTP 请求进入 Spring Boot 应用，下列组件的执行顺序是？", "code": "Filter(Servlet 规范) / Interceptor(Spring MVC) / AOP 切面(@Around Service 方法)", "options": [{"k": "A", "t": "Interceptor → Filter → AOP"}, {"k": "B", "t": "三者并行执行，顺序不确定"}, {"k": "C", "t": "Filter → Interceptor → AOP → Controller/Service 业务，返回时逆序"}, {"k": "D", "t": "AOP → Filter → Interceptor"}], "answer": "C", "explain": "Filter 属于 Servlet 容器层，最外层，能拿到原始 request/response（适合编码、跨域、鉴权前置、包装请求体）；Interceptor 由 DispatcherServlet 调度，位于 MVC 内部，能拿到 HandlerMethod（适合登录态、权限、日志）；AOP 切面作用在 Bean 方法调用上，最贴近业务（适合事务、缓存、埋点）。返回时按相反顺序出栈。理解这个顺序是排查「为什么我的拦截器拿不到 body」「为什么切面没生效」的基础。", "kaodian": "AI后端能力-应用框架层-过滤器拦截器与AOP顺序"}, {"no": 4, "type": "single", "body": "线上 MQ 积压 500 万条消息，下列处置最合理的是？", "code": "Topic: order.pay   分区数 4   消费者实例 4   消费 TPS 200", "options": [{"k": "A", "t": "只增加消费者实例数即可，无需管分区数"}, {"k": "B", "t": "直接清空队列，丢弃全部积压消息"}, {"k": "C", "t": "把消费者线程 sleep 时间调大，慢慢消化"}, {"k": "D", "t": "先定位消费慢的原因；如需紧急泄洪，可扩分区并同步扩消费者，或临时转存后异步补偿"}], "answer": "D", "explain": "处理积压先诊断：是消费逻辑变慢（DB 慢查询、外部接口超时）、消费者挂了，还是流量突增。紧急泄洪的标准手法是扩容——但 Kafka 中单分区只能被同组内一个消费者消费，分区数 4 时加到 8 个消费者也无效（A 错，必须先扩分区）；另一种做法是用一个「搬运」消费者快速把消息转存到临时 topic/存储再并行处理。清空队列会造成业务数据丢失（B 错）；调大 sleep 只会更慢（C 错）。", "kaodian": "AI后端能力-高并发与中间件层-消息积压处理"}, {"no": 5, "type": "single", "body": "一个订单对应多条明细，用 MyBatis 一次查询完成对象嵌套映射，正确的是？", "code": "<resultMap id=\"orderMap\" type=\"Order\">\n  <id property=\"id\" column=\"o_id\"/>\n  <!-- 补全明细集合映射 ? -->\n</resultMap>", "options": [{"k": "A", "t": "<collection property=\"items\" ofType=\"OrderItem\"> 配合 JOIN 查询做一对多映射"}, {"k": "B", "t": "<association property=\"items\" javaType=\"List\">"}, {"k": "C", "t": "一对多只能查两次，MyBatis 不支持嵌套映射"}, {"k": "D", "t": "直接用 resultType=\"Order\" 就能自动嵌套"}], "answer": "A", "explain": "MyBatis 中 <association> 用于一对一（如订单关联用户），<collection> 用于一对多（订单关联明细列表），ofType 指定集合元素类型。配合 LEFT JOIN 单次查询 + <id> 标签去重，可避免 N+1 查询。也可用嵌套 select（select 属性）分次查询，但要注意 N+1 与延迟加载配置。resultType 只能做扁平映射，无法自动构造嵌套集合（D 错）。", "kaodian": "AI后端能力-数据存储与ORM层-MyBatis一对多映射"}, {"no": 6, "type": "single", "body": "下列方法的返回值是？", "code": "public static int f() {\n  int x = 1;\n  try { return x; }\n  finally { x = 2; }\n}", "options": [{"k": "A", "t": "结果不确定"}, {"k": "B", "t": "1，因为 return 时已把 x 的值暂存，finally 里修改局部变量不影响已确定的返回值"}, {"k": "C", "t": "2，finally 一定在 return 之后执行并覆盖返回值"}, {"k": "D", "t": "编译报错"}], "answer": "B", "explain": "return 语句先把返回值压入栈（此时是 1），再执行 finally 块。finally 中修改局部变量 x 不会改变已暂存的返回值，所以结果是 1。但如果 finally 里写 `return 2;` 就会覆盖返回值（并吞掉异常），这是被强烈禁止的写法。另外若返回的是可变对象，finally 中修改其内部字段是可见的——变的是对象内容而非引用。", "kaodian": "AI后端能力-语言与计算层-finally与返回值"}, {"no": 7, "type": "single", "body": "下列代码中把 flag 加上 volatile 的作用是？", "code": "private volatile boolean flag = false;\n// 线程 A: while (!flag) { /* 空转 */ }\n// 线程 B: flag = true;", "options": [{"k": "A", "t": "等价于给整段代码加锁，能替代 synchronized"}, {"k": "B", "t": "只是性能优化，去掉也一定能正常退出"}, {"k": "C", "t": "保证可见性与禁止指令重排，使线程 A 能及时读到线程 B 的写入并退出循环"}, {"k": "D", "t": "保证 flag++ 这类复合操作的原子性"}], "answer": "C", "explain": "volatile 提供两个语义：① 可见性——写操作立刻刷回主内存、读操作直接从主内存取，避免线程 C 一直读自己工作内存里的旧值导致死循环；② 有序性——插入内存屏障禁止指令重排（DCL 单例必须加 volatile 就是这个原因）。它不保证原子性，flag++ 这种「读-改-写」仍需 synchronized 或 AtomicInteger（D/A 错）。去掉 volatile 可能永远退不出循环（B 错）。", "kaodian": "AI后端能力-语言与计算层-volatile可见性与有序性"}, {"no": 8, "type": "single", "body": "关于 watch 与 watchEffect 的区别，下列正确的是？", "code": "watch(src, cb, { immediate: true, deep: true })\nwatchEffect(() => { console.log(a.value, b.value) })", "options": [{"k": "A", "t": "两者完全等价，watchEffect 只是简写"}, {"k": "B", "t": "watchEffect 需要手动声明依赖数组"}, {"k": "C", "t": "watch 无法监听多个源"}, {"k": "D", "t": "watch 显式指定数据源、能拿到新旧值、默认懒执行；watchEffect 自动收集回调内依赖、立即执行一次、拿不到旧值"}], "answer": "D", "explain": "watch 需要明确传入侦听源（ref/getter/数组），回调接收 (newVal, oldVal)，默认变更时才触发（immediate:true 可改）。watchEffect 立即执行回调并在执行过程中自动追踪用到的响应式依赖，后续依赖变化时重跑，写法简洁但拿不到旧值、依赖是隐式的（不需要手动声明，B 错）。watch 支持数组形式监听多个源（C 错）。", "kaodian": "AI前端能力-语言与运行时-watch与watchEffect"}, {"no": 9, "type": "single", "body": "容器宽 400px，三个子项 flex-basis 分别 200/200/200，flex-shrink 均为 1，最终第一个子项宽度是？", "code": ".box { display: flex; width: 400px; }\n.item { flex: 0 1 200px; }   /* grow=0 shrink=1 basis=200px */", "options": [{"k": "A", "t": "约 133.33px"}, {"k": "B", "t": "200px"}, {"k": "C", "t": "100px"}, {"k": "D", "t": "400px"}], "answer": "A", "explain": "总基准 200×3=600px，超出容器 600−400=200px，需要收缩。收缩量按 (basis × shrink) 加权分配：每项权重 200×1=200，总权重 600，每项分摊 200×(200/600)=66.67px，最终 200−66.67≈133.33px。若某项 shrink=0 则它不参与收缩，其余项分摊更多。这是真题高频的 Flex 计算题型。", "kaodian": "AI前端能力-前端基础与渲染引擎-Flex收缩计算"}, {"no": 10, "type": "single", "body": "后端用 `@RequestParam` 接收参数，但前端传 JSON 时后端拿到 null，原因是？", "code": "axios.post('/api/save', { name: 'x' });\n// 后端： public R save(@RequestParam String name)", "options": [{"k": "A", "t": "参数名不一致导致，改成 userName 即可"}, {"k": "B", "t": "Axios 传对象默认发送 application/json 请求体，而 @RequestParam 读的是 query 或表单参数，需改用 @RequestBody 或改前端传参方式"}, {"k": "C", "t": "Axios 不支持 POST 传参"}, {"k": "D", "t": "后端必须加 @CrossOrigin 才能收到参数"}], "answer": "B", "explain": "@RequestParam 从 URL query string 或 application/x-www-form-urlencoded 表单体中取值；@RequestBody 才解析 JSON 请求体。Axios 传对象时默认 Content-Type: application/json，两边不匹配自然取不到。解法二选一：后端改 @RequestBody + DTO（推荐），或前端改用 URLSearchParams/qs.stringify 发 urlencoded。跨域与参数解析是两回事（D 错），名字本身是对的（A 错）。", "kaodian": "AI前端能力-网络与BFF架构-请求体类型与后端接收"}, {"no": 11, "type": "single", "body": "下列 TS 代码中，`Status` 的最佳实践与说明是？", "code": "const STATUS = { Draft: 'draft', Paid: 'paid' } as const;\ntype Status = typeof STATUS[keyof typeof STATUS];", "options": [{"k": "A", "t": "as const 会让对象在运行时被冻结（等同 Object.freeze）"}, {"k": "B", "t": "这种写法无法遍历取值，不如 enum"}, {"k": "C", "t": "as const 让属性推断为字面量类型，Status 等价于 'draft' | 'paid'，兼具运行时对象与编译期联合类型"}, {"k": "D", "t": "Status 的类型是 string"}], "answer": "C", "explain": "as const 断言把对象属性从 string 收窄为字面量类型且只读，配合 typeof + keyof 索引访问即可派生出联合类型 'draft'|'paid'。相比 enum，它没有额外的运行时代码、能被 tree-shaking、值就是字面量便于与接口 JSON 对齐，还能用 Object.values(STATUS) 正常遍历（B 错）。as const 是编译期断言，不做运行时冻结（A 错）。", "kaodian": "AI前端能力-语言与运行时-TS常量断言与联合类型"}, {"no": 12, "type": "single", "body": "跨站点场景下 Cookie 没有被携带，最可能与哪个属性有关？", "code": "Set-Cookie: token=abc; Path=/; HttpOnly; SameSite=Lax", "options": [{"k": "A", "t": "HttpOnly 导致 Cookie 不会随请求发送"}, {"k": "B", "t": "Path=/ 限制了只有根路径能带 Cookie"}, {"k": "C", "t": "Cookie 永远不会跨域携带，无解"}, {"k": "D", "t": "SameSite=Lax 会在跨站点的子请求（如 XHR、iframe、图片）中阻止携带 Cookie，需要 SameSite=None; Secure"}], "answer": "D", "explain": "SameSite 控制跨站携带策略：Strict 完全不带；Lax（多数浏览器默认）只在顶级导航的 GET 时带，XHR/fetch/iframe/图片等跨站子请求不带；None 允许跨站携带但必须同时加 Secure（HTTPS）。HttpOnly 只是禁止 JS 读取 document.cookie，不影响自动携带（A 错）；Path=/ 是最宽松的路径（B 错）；跨域携带还需前端 withCredentials 与后端 Access-Control-Allow-Credentials 配合（C 错）。", "kaodian": "AI前端能力-网络与BFF架构-CookieSameSite"}, {"no": 13, "type": "single", "body": "需要在路由跳转前校验登录态并跳到登录页，正确写法是？", "code": "router.beforeEach((to, from) => {\n  // 补全 ?\n});", "options": [{"k": "A", "t": "未登录且目标页需要鉴权时 return { name: 'login', query: { redirect: to.fullPath } }"}, {"k": "B", "t": "在守卫里写 window.location.href = '/login' 是唯一方式"}, {"k": "C", "t": "守卫必须调用 next() 否则一定报错，Vue Router 4 不支持返回值"}, {"k": "D", "t": "路由守卫只能写在组件内，不能全局注册"}], "answer": "A", "explain": "Vue Router 4 的守卫可以直接返回一个路由地址表示重定向，返回 false 表示取消导航，不返回则放行（next 仍兼容但不推荐混用，C 错）。带上 redirect 参数便于登录后回跳原页面。直接改 location.href 会整页刷新丢失 SPA 状态（B 非最优）。守卫分全局（beforeEach/afterEach）、路由独享（beforeEnter）与组件内（onBeforeRouteLeave 等）三层（D 错）。", "kaodian": "AI前端能力-前端生态-路由导航守卫"}, {"no": 14, "type": "single", "body": "页面在做大量 CSV 解析时卡死无法交互，最合适的优化是？", "code": "// 主线程执行\nconst rows = parseHugeCsv(text);   // 耗时 3s", "options": [{"k": "A", "t": "只能提示用户耐心等待，无解"}, {"k": "B", "t": "把解析放进 Web Worker 后台线程执行，通过 postMessage 回传结果，主线程保持响应"}, {"k": "C", "t": "用 setTimeout(fn, 0) 包一层就不会卡了"}, {"k": "D", "t": "用 async/await 包装即可变成多线程"}], "answer": "B", "explain": "JS 主线程与渲染共用同一线程，CPU 密集任务会阻塞渲染与交互。Web Worker 在独立线程运行（无 DOM 访问权限），通过结构化克隆或 Transferable 传数据，是解决计算卡顿的正解。setTimeout 只是延后执行，任务本身照样占满主线程（C 错）；async/await 只是异步语法糖，不创建线程（D 错）。若不便引入 Worker，也可用时间切片（分片处理 + requestIdleCallback）缓解。", "kaodian": "AI前端能力-前端生态-WebWorker"}, {"no": 15, "type": "single", "body": "用例库累计 5000 条，其中大量重复与失效用例，治理方向最合理的是？", "code": "现状：执行一轮 3 天；近半年 40% 用例从未发现缺陷", "options": [{"k": "A", "t": "随机删除一半以缩短执行时间"}, {"k": "B", "t": "用例库只增不减，删除等于降低质量"}, {"k": "C", "t": "按业务价值与缺陷发现率分层，合并重复、下线失效、标注冒烟/核心/边缘集合并定期复盘"}, {"k": "D", "t": "全部保留，用例越多覆盖越全"}], "answer": "C", "explain": "用例库是需要持续维护的资产。治理手法：按模块梳理去重、下线需求已废弃的用例、依据历史缺陷发现率与业务重要性分层（冒烟/核心回归/全量），把高价值用例自动化并纳入 CI，低价值用例降频或归档。盲目保留（D/B）会让执行成本失控并稀释注意力；随机删（A）不可控地丢失覆盖。", "kaodian": "AI质量保障-软件测试理论与质量体系-用例库治理"}, {"no": 16, "type": "single", "body": "App 稳定性测试用 Monkey 跑随机事件，下列做法正确的是？", "code": "adb shell monkey -p com.demo.app --throttle 300 -s 12345 -v -v 100000", "options": [{"k": "A", "t": "Monkey 能验证业务逻辑正确性，可替代功能测试"}, {"k": "B", "t": "不加 throttle 越快越好，结果更准确"}, {"k": "C", "t": "Monkey 崩溃日志无需保留，重跑即可"}, {"k": "D", "t": "固定 seed 让随机序列可复现，配合日志与 ANR/Crash 抓取定位问题"}], "answer": "D", "explain": "-s 指定种子后同一序列可重放，这是 Monkey 能复现问题的关键；配合 logcat 抓 FATAL EXCEPTION、ANR trace 与 tombstone 才能定位。Monkey 只做随机事件注入，不理解业务语义，无法验证功能正确性（A 错）；不加 throttle 事件过密会导致大量非真实场景的误报且难以复现（B 错）；崩溃日志是唯一证据，必须保留归档（C 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-稳定性Monkey测试"}, {"no": 17, "type": "single", "body": "改版后按钮错位、图表渲染异常，但功能断言全绿。最能补上这块缺口的是？", "code": "// 现有断言\nawait expect(page.getByRole('button', {name:'提交'})).toBeVisible();", "options": [{"k": "A", "t": "引入视觉回归测试：截图与基线比对，超出像素差异阈值即告警，并人工确认更新基线"}, {"k": "B", "t": "把断言改成 toBeTruthy 就能发现样式问题"}, {"k": "C", "t": "样式问题只能靠人眼，无法自动化"}, {"k": "D", "t": "增加更多功能断言即可覆盖视觉问题"}], "answer": "A", "explain": "功能断言只关心元素存在与文本内容，对布局错位、颜色异常、图表渲染缺失无感。视觉回归（如 Playwright 的 toHaveScreenshot、Percy、BackstopJS）通过与基线截图做像素/感知差异比对来发现 UI 退化；要点是控制不稳定因素（动画禁用、字体一致、mock 动态数据）并建立基线更新审批流程。功能断言再多也覆盖不到像素级表现（D 错）。", "kaodian": "AI质量保障-自动化测试-视觉回归测试"}, {"no": 18, "type": "single", "body": "接口自动化每次都要手动在库里插数据，效率低且易冲突。最佳改造是？", "code": "# 现状：测试前手工执行 SQL 插入用户、商品、优惠券", "options": [{"k": "A", "t": "每次测试前手工清空整个测试库"}, {"k": "B", "t": "建设造数服务/工厂方法，用例按需通过 API 创建唯一测试数据并在结束时清理"}, {"k": "C", "t": "把测试数据写死成固定 ID，所有用例共用"}, {"k": "D", "t": "直接连生产库取数据来测试"}], "answer": "B", "explain": "造数服务（Test Data Factory）把数据准备代码化：提供 createUser/createOrder 等接口按需生成带唯一后缀的数据，支持参数化定制状态，用例结束调用清理或依赖 TTL 自动回收。这样既避免用例间数据冲突（可并行），又让用例自包含可重复。固定共享数据（C）会互相踩踏；连生产库（D）严重违规且有数据污染与泄露风险；清空整库（A）会破坏其他人的测试。", "kaodian": "AI质量保障-接口测试-测试造数服务"}, {"no": 19, "type": "single", "body": "线上出现资损故障，处理与复盘的正确顺序是？", "code": "时间线：告警 → ? → ? → ?", "options": [{"k": "A", "t": "先追责相关人员，再恢复服务"}, {"k": "B", "t": "服务恢复后无需复盘，问题已解决"}, {"k": "C", "t": "先止血（回滚/降级/限流）恢复业务，再定位根因，最后复盘输出改进项与防复发措施"}, {"k": "D", "t": "先开会讨论根因，定位清楚再决定是否恢复"}], "answer": "C", "explain": "故障处理的第一原则是止损优先：能回滚就回滚、能降级就降级、必要时限流或切流，先把用户影响与资金损失止住，再从容定位根因。复盘（postmortem）要产出时间线、根因、影响面、改进项与责任人，并跟踪闭环，重点是「如何防止同类问题再发生」而不是追责——追责文化会导致隐瞒与延报（A 错）。不复盘等于把同一个坑留给下次（B 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-线上故障应急与复盘"}, {"no": 20, "type": "single", "body": "本次改动了 3 个类，想让 AI 推荐回归范围，最有效的输入是？", "code": "输入：代码 diff + 调用链/依赖关系 + 用例与代码的历史映射 + 线上流量热点", "options": [{"k": "A", "t": "只把 diff 丢给 AI，让它凭代码猜测试范围"}, {"k": "B", "t": "让 AI 直接决定跳过全量回归，结果由 AI 负责"}, {"k": "C", "t": "AI 无法参与回归范围决策"}, {"k": "D", "t": "结合变更影响面与历史缺陷/流量数据，让 AI 推荐必跑用例集，人工确认后执行"}], "answer": "D", "explain": "精准回归的关键是「影响面分析」：AI 需要 diff（改了什么）、依赖与调用链（影响谁）、用例与代码的映射关系（哪些用例覆盖了受影响路径）、线上流量与缺陷分布（哪些路径最重要）。四类信息齐备才能给出可信推荐，且必须人工确认（尤其涉及资金、权限等高危模块要强制全量）。只给 diff（A）信息不足；把决策责任推给 AI（B）不成立。", "kaodian": "AI质量保障-AI辅助测试-AI辅助回归范围推荐"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于服务优雅停机与健康检查，下列做法正确的有？（多选，多选、少选、错选均不得分）", "code": "server.shutdown=graceful\nspring.lifecycle.timeout-per-shutdown-phase=30s\nmanagement.endpoint.health.probes.enabled=true", "options": [{"k": "A", "t": "优雅停机让容器停止接收新请求，等待在途请求处理完再退出"}, {"k": "B", "t": "下线前应先从注册中心摘除实例并等待网关刷新，再停应用"}, {"k": "C", "t": "健康检查应区分存活探针（liveness）与就绪探针（readiness），语义不同"}, {"k": "D", "t": "直接 kill -9 也能优雅停机，效果一样"}], "answer": ["A", "B", "C"], "explain": "A 对：graceful shutdown 关闭连接接入但给在途请求留出处理窗口，避免请求被硬切。B 对：先摘流量再停进程，否则注册中心与网关缓存未刷新，仍会把请求路由到正在关闭的实例造成报错。C 对：liveness 失败会重启容器，readiness 失败只是摘流量，混用会导致「一慢就被重启」的雪崩。D 错：kill -9 是 SIGKILL，进程立即终止，在途请求全部失败、连接与缓冲区数据丢失。", "kaodian": "AI后端能力-微服务与云原生层-优雅停机与健康检查"}, {"no": 2, "type": "multi", "body": "一条 SQL 执行 3 秒，下列优化思路正确的有？（多选）", "code": "SELECT * FROM t_order o LEFT JOIN t_user u ON o.uid=u.id\nWHERE DATE(o.create_time)='2026-08-13' ORDER BY o.amount DESC;", "options": [{"k": "A", "t": "避免 SELECT *，只取必要列，配合覆盖索引减少回表"}, {"k": "B", "t": "为 JOIN 关联列与排序列建立合适索引，用 EXPLAIN 验证是否消除 filesort"}, {"k": "C", "t": "加 FORCE INDEX 强制走索引是首选方案，无需分析"}, {"k": "D", "t": "把 DATE(create_time)='...' 改成范围条件，避免在索引列上使用函数导致索引失效"}], "answer": ["A", "B", "D"], "explain": "D 对：对索引列套函数会让优化器无法使用索引，应改为 `create_time >= '2026-08-13 00:00:00' AND create_time < '2026-08-14 00:00:00'`。A 对：少取列能减少回表与网络传输，甚至形成覆盖索引。B 对：JOIN 列无索引会退化成嵌套循环全扫，ORDER BY 无索引支撑会 Using filesort。C 错：FORCE INDEX 是绕过优化器的应急手段，掩盖真实问题且在数据分布变化后可能更慢，应先用 EXPLAIN 分析。", "kaodian": "AI后端能力-数据存储与ORM层-慢SQL优化思路"}, {"no": 3, "type": "multi", "body": "消息可能在哪些环节丢失，以及对应的防护手段，下列正确的有？（多选）", "code": "生产者 → Broker → 消费者", "options": [{"k": "A", "t": "消费端：拿到消息就自动 ack 但处理失败，应改为业务处理成功后手动 ack"}, {"k": "B", "t": "只要用了 MQ 就不会丢消息，无需额外设计"}, {"k": "C", "t": "生产端：发送失败未重试或未确认，用 confirm/acks=all + 重试 + 本地消息表兜底"}, {"k": "D", "t": "Broker 端：未持久化就宕机，需开启持久化并配置多副本"}], "answer": ["A", "C", "D"], "explain": "消息丢失有三个经典环节。C：生产端要拿到 Broker 确认才算发送成功，配合重试与本地消息表/事务消息保证「业务成功则消息必发出」。D：Broker 要持久化（RabbitMQ 队列与消息 durable、Kafka 多副本 + min.insync.replicas）防止宕机丢数据。A：自动 ack 意味着「收到即确认」，业务处理抛异常消息就没了，必须改手动 ack 并配重试/死信。B 错：可靠性需要三端共同设计，MQ 本身不提供无条件保证。", "kaodian": "AI后端能力-高并发与中间件层-消息可靠性三环节"}, {"no": 4, "type": "multi", "body": "关于 Core Web Vitals 核心性能指标，下列说法正确的有？（多选）", "code": "LCP / INP(原 FID) / CLS", "options": [{"k": "A", "t": "这三个指标只影响开发体验，对 SEO 与转化率没有影响"}, {"k": "B", "t": "LCP 衡量最大内容元素的渲染时间，反映首屏加载速度，优化方向是资源体积与关键路径"}, {"k": "C", "t": "CLS 衡量累计布局偏移，图片/广告未预留尺寸是常见成因"}, {"k": "D", "t": "INP 衡量交互到下一次绘制的延迟，长任务阻塞主线程会显著劣化它"}], "answer": ["B", "C", "D"], "explain": "B 对：LCP 关注用户「看到主要内容」的时刻，优化手段包括图片压缩与格式升级、预加载关键资源、服务端渲染、减少阻塞脚本。C 对：给图片/视频/广告位显式声明宽高或 aspect-ratio 是防 CLS 的第一手段，动态插入内容也要预留占位。D 对：INP 已取代 FID 成为交互响应指标，长任务拆分、时间切片、Web Worker 可改善。A 错：Core Web Vitals 是搜索排名信号之一，且与跳出率、转化率强相关。", "kaodian": "AI前端能力-前端生态-CoreWebVitals"}, {"no": 5, "type": "multi", "body": "关于 Pinia 状态管理，下列说法正确的有？（多选）", "code": "export const useUserStore = defineStore('user', () => {\n  const name = ref(''); \n  const upper = computed(() => name.value.toUpperCase());\n  function setName(v){ name.value = v }\n  return { name, upper, setName };\n});", "options": [{"k": "A", "t": "setup 语法下 ref 相当于 state、computed 相当于 getter、函数相当于 action"}, {"k": "B", "t": "解构 store 会丢失响应式，需要用 storeToRefs 保留"}, {"k": "C", "t": "Pinia 相比 Vuex 去掉了 mutation，TypeScript 类型推导更友好"}, {"k": "D", "t": "所有组件数据都应该放进 store，组件内不应有局部状态"}], "answer": ["A", "B", "C"], "explain": "A 对：Pinia 的 setup store 直接复用组合式 API 心智模型。B 对：`const { name } = useUserStore()` 会拿到普通值失去响应式，必须 `const { name } = storeToRefs(store)`，而 action 可以直接解构。C 对：Pinia 移除了 mutation 层，action 支持同步异步，类型推导开箱即用。D 错：只有跨组件共享、需要持久化或跨路由存活的状态才进 store，把局部 UI 状态全放进去会让 store 臃肿且难维护。", "kaodian": "AI前端能力-前端生态-Pinia状态管理"}, {"no": 6, "type": "multi", "body": "需求评审时，测试视角应重点关注的有？（多选）", "code": "需求：新增「优惠券叠加使用」功能", "options": [{"k": "A", "t": "异常与逆向流程是否定义：叠加冲突、超额、退款回滚、并发使用"}, {"k": "B", "t": "对存量数据与老版本客户端的影响，以及灰度与回滚方案"}, {"k": "C", "t": "只需关注正向主流程，异常等开发提测后再说"}, {"k": "D", "t": "验收标准是否明确可测（有无量化判定条件），避免「体验流畅」这类无法验证的描述"}], "answer": ["A", "B", "D"], "explain": "D 对：需求阶段就把验收标准量化（如「优惠后金额不得小于 0.01 元」）是可测性的前提。A 对：异常与逆向流程往往是缺陷高发区，评审阶段缺失定义，后期实现会各写各的。B 对：存量数据兼容、老客户端行为、灰度与回滚方案属于交付风险，必须在评审时提出。C 错：把异常留到提测后发现，返工成本成倍上升——这正是测试左移要避免的。", "kaodian": "AI质量保障-软件测试理论与质量体系-需求评审测试视角"}, {"no": 7, "type": "multi", "body": "下列属于应用安全测试重点关注的问题有？（多选）", "code": "GET /api/order/detail?orderId=1002   （当前登录用户只拥有 1001）", "options": [{"k": "A", "t": "敏感信息泄露：接口返回身份证/手机号明文、错误堆栈暴露内部结构"}, {"k": "B", "t": "页面配色不符合品牌规范"}, {"k": "C", "t": "越权访问：改 ID 就能查到他人数据（水平越权），或普通用户访问管理接口（垂直越权）"}, {"k": "D", "t": "注入类漏洞：SQL 注入、命令注入、模板注入"}], "answer": ["A", "C", "D"], "explain": "C 对：越权是业务系统最高频的高危漏洞，必须逐接口验证「能否越过数据归属与角色边界」。D 对：注入类漏洞可直接导致数据泄露或服务器被控。A 对：返回明文敏感信息违反合规要求，异常堆栈外泄会给攻击者提供信息。B 错：配色属于 UI 规范问题，与安全无关。", "kaodian": "AI质量保障-软件测试理论与质量体系-应用安全测试重点"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "InnoDB 中 COUNT(*) 与 COUNT(1) 性能基本一致且都统计所有行，而 COUNT(某列) 会跳过该列为 NULL 的行。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "COUNT(*) 是 SQL 标准语义「统计行数」，MySQL 会优化为选择最小的可用索引扫描，COUNT(1) 与之基本等价（官方明确说明二者性能相同）。COUNT(col) 语义不同：只统计该列非 NULL 的行，因此结果可能小于 COUNT(*)，且如果该列无索引还需回表判断。这是真题常考的细节差异。", "kaodian": "AI后端能力-数据存储与ORM层-COUNT语义差异"}, {"no": 2, "type": "judge", "body": "Flex 适合二维（行列同时控制）的整体布局，Grid 只适合一维方向的布局与对齐。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "说反了：Flex 适合一维（行或列），Grid 适合二维（行列同时控制）整体布局。", "kaodian": "AI前端能力-前端基础与渲染引擎-Grid与Flex选型"}, {"no": 3, "type": "judge", "body": "HTTPS 在握手阶段用非对称加密协商出会话密钥，之后的数据传输使用对称加密，这样兼顾了安全性与性能。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "非对称加密（RSA/ECDHE）计算开销大，只用于握手阶段的身份验证与密钥协商；协商出的对称会话密钥用于后续数据加解密，速度快得多。证书由 CA 签发用于验证服务端身份，防中间人。此外 TLS 还用 MAC/AEAD 保证完整性。这是「为什么 HTTPS 不是全程非对称加密」的标准答案。", "kaodian": "AI前端能力-网络与BFF架构-HTTPS加密流程"}, {"no": 4, "type": "judge", "body": "性能压测可以在远低于生产规格的环境进行，测得数据可直接作为容量评估依据。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "压测应尽量在与生产同规格、同数据量级的环境进行，否则数据无法作为容量评估依据。", "kaodian": "AI质量保障-软件测试理论与质量体系-压测环境要求"}, {"no": 5, "type": "judge", "body": "线上缺陷修复后，应针对该场景补充自动化用例并纳入回归集，防止同类问题再次逃逸。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "「缺陷驱动补用例」是低成本高收益的做法：既然这个场景真实出过问题，说明它是薄弱环节且未被现有用例覆盖。补一条自动化用例后纳入回归集，能持续防止回退。同时应做根因归类，判断是否需要在同类模块批量补齐（如所有金额计算都补边界用例）。", "kaodian": "AI质量保障-自动化测试-缺陷驱动补用例"}, {"no": 6, "type": "judge", "body": "质量只由测试团队负责，开发只要把功能写完提测即可，线上缺陷应完全归责于测试漏测。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "质量是全流程共建的结果：需求写不清会带来理解偏差，设计缺陷会埋下架构隐患，编码不做自测与代码评审会让低级问题流到测试环节，运维配置漂移会造成环境类故障。测试是重要的质量保障手段而非唯一防线（质量内建、测试左移、开发自测、代码评审、灰度与监控共同构成纵深防御）。把线上问题一律归责漏测，会催生对立与隐瞒，反而伤害质量。", "kaodian": "AI质量保障-软件测试理论与质量体系-质量共建责任"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
