<script type="application/json" id="quizData">{"id": "vol01", "title": "全栈转型模拟自测卷", "sub": "依据自如 AI 平台笔试认证模拟题范围命题：后端 Java（Spring Boot / MyBatis-Plus / Redis / RabbitMQ / Kafka / MySQL）、前端 H5（Vue3 / Axios / DevTools / CSS 布局）、质量保障（接口测试 / 回归测试 / 自动化 / CI）。每题含答案、知识点讲解与 Android 开发类比。", "meta": "题型：单选 20 题 x 3 分 + 多选 7 题 x 4 分 + 判断 6 题 x 2 分 = 100 分。无填空题。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "某电商系统更新商品库存，为保证缓存与数据库一致性使用 Cache-Aside 模式。以下更新方法的伪代码，步骤 2【此处缺失代码】最合理的操作是？", "code": "@Transactional\npublic void updateStock(Long productId, Integer newStock) {\n    productMapper.updateStock(productId, newStock); // 1. 更新数据库\n    String cacheKey = \"product:stock:\" + productId;\n    // 2. 缓存处理【缺失】\n}", "options": [{"k": "A", "t": "先 Thread.sleep(500) 再 stringRedisTemplate.opsForValue().set(...) 直接更新缓存"}, {"k": "B", "t": "stringRedisTemplate.opsForValue().set(...) 直接更新缓存"}, {"k": "C", "t": "不做处理，等待缓存 TTL 自然失效"}, {"k": "D", "t": "stringRedisTemplate.delete(...) 删除/失效缓存"}], "answer": ["D"], "explain": "Cache-Aside 更新操作业界推荐“先更新 DB，再删除缓存”。直接更新缓存在并发写时易因网络延迟产生脏数据覆盖；删除缓存保证下次读回源 DB 拿最新值，达到最终一致。", "android": "类比 Android：类似“内存缓存 + 数据库”双写，更新 DB 后失效内存缓存（如 Glide 内存缓存 invalidate），下次再从 DB/网络加载，而不是立即回写可能过期的缓存。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存使用流程"}, {"no": 2, "type": "single", "body": "某网关统计 Redis 监控日志：total_requests=10000，cache_hits=8500，cache_misses=1500。缓存命中率与未命中时的业务流向是？", "code": "[INFO] total_requests: 10000\n[INFO] cache_hits: 8500\n[INFO] cache_misses: 1500", "options": [{"k": "A", "t": "15%；直接抛 504 Gateway Timeout"}, {"k": "B", "t": "100%；自动流向热备 Redis 集群二次读取"}, {"k": "C", "t": "85%；流向底层数据库查询并回写缓存"}, {"k": "D", "t": "85%；直接放弃读取返回空对象兜底"}], "answer": ["C"], "explain": "命中率 = hits/total = 8500/10000 = 85%。未命中说明缓存无数据，请求流向底层 DB 查询真实数据，获取后回写缓存以便下次命中。", "android": "类比 Android：类似图片三级缓存命中率统计，内存/磁盘未命中时回源网络请求，成功后写入内存与磁盘缓存。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 基础概念"}, {"no": 3, "type": "single", "body": "RabbitMQ 中 notify.topic 交换机：队列 A 绑定 user.*，队列 B 绑定 user.#。生产者发送 RoutingKey=\"user.vip.login\" 的消息，正确的是？", "code": "交换机: notify.topic\n队列A 绑定: user.*\n队列B 绑定: user.#\n发送: user.vip.login", "options": [{"k": "A", "t": "A、B 都收不到，路由键必须完全等值匹配"}, {"k": "B", "t": "只有 B 收到，* 严格匹配一个单词，# 匹配零个或多个单词"}, {"k": "C", "t": "A、B 都能收到，* 和 # 规则无区别"}, {"k": "D", "t": "只有 A 收到，* 代表匹配零个或多个单词"}], "answer": ["B"], "explain": "Topic 模式：* 匹配一个单词（以 . 分隔），user.vip.login 含两个后继单词，不匹配 user.*；# 匹配零个或多个单词，匹配 user.#。故仅 B 收到。", "android": "类比 Android：类似广播 Action 的匹配规则，* 像单段通配，# 像多级通配（如包名前缀匹配）。", "kaodian": "AI 后端能力 - 高并发与中间件层 - MQ 基础概念"}, {"no": 4, "type": "single", "body": "Cache-Aside 查询商品详情：先从缓存取，命中则反序列化返回；未命中时应执行的正确流程是？", "code": "public ProductVO getDetail(Long id) {\n    String key = \"product:detail:\" + id;\n    String v = stringRedisTemplate.opsForValue().get(key);\n    if (hasText(v)) return JSON.parseObject(v, ProductVO.class);\n    // 未命中【缺失】\n}", "options": [{"k": "A", "t": "直接返回 null，由调用方处理"}, {"k": "B", "t": "查数据库，写入缓存后再返回"}, {"k": "C", "t": "循环重试读取缓存直到命中"}, {"k": "D", "t": "抛异常提示缓存未命中"}], "answer": ["B"], "explain": "Cache-Aside 读路径：缓存未命中 → 查 DB → 将结果写回缓存 → 返回。这是“lazy load + 回填”的标准做法，避免每次都打 DB。", "android": "类比 Android：类似 Room 查询内存缓存未命中后查 SQLite，再把结果塞进 LRU 缓存供下次使用。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存使用流程"}, {"no": 5, "type": "single", "body": "Flex 容器内有 3 个等宽子元素，父容器宽度刚好容纳。以下 CSS 说法正确的是？", "code": ".parent { display: flex; }\n.child  { flex: 1 1 0; }", "options": [{"k": "A", "t": "三个子元素按内容宽度分配，互不影响"}, {"k": "B", "t": "flex:1 1 0 表示可增长可收缩、基准为 0，三者等分剩余空间"}, {"k": "C", "t": "flex-grow 为 1 时子元素宽度固定为 1px"}, {"k": "D", "t": "Flex 布局不能等分，必须用 grid"}], "answer": ["B"], "explain": "flex:1 1 0 即 grow=1、shrink=1、basis=0，三者以 basis=0 为起点，按 grow 比例（1:1:1）等分父容器宽度，实现等分布局。", "android": "类比 Android：类似 LinearLayout 的 layout_weight，weight 相等则子 View 等分剩余宽度。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 布局"}, {"no": 6, "type": "single", "body": "表单提交按钮逻辑：点击提交后置为 loading 并禁用，避免重复提交。以下做法正确的是？", "code": "const state = reactive({ loading: false });\nfunction submit(){\n  if(state.loading) return;\n  state.loading = true;\n  // 请求完成后 state.loading=false\n}", "options": [{"k": "A", "t": "不需要禁用，浏览器会自动防重复提交"}, {"k": "B", "t": "提交前判断 loading 标志，true 则拦截；请求结束（无论成败）复位"}, {"k": "C", "t": "只在成功时复位 loading，失败保持禁用"}, {"k": "D", "t": "用 CSS pointer-events:none 替代 JS 状态即可"}], "answer": ["B"], "explain": "功能测试关注“页面状态”：提交中应禁用按钮（防重复提交），请求结束必须在 finally/complete 中复位 loading，否则失败态下按钮永久禁用。", "android": "类比 Android：类似按钮点击后 setEnabled(false) 并显示 ProgressBar，网络回调（成功/失败）里再恢复，防止重复下单。", "kaodian": "AI 质量保障 - Web/App 功能测试 (Functional Testing) - 页面状态验证：加载中、空数据、错误提示、成功提示、按钮禁用"}, {"no": 7, "type": "single", "body": "Flex 页面中 4 个子元素 .box 宽度超出父容器导致折行。关于 align-content 的作用，正确的是？", "code": ".container { display:flex; flex-wrap:wrap; }\n.box { width: 120px; }", "options": [{"k": "A", "t": "align-content 控制单行内子元素在交叉轴的对齐"}, {"k": "B", "t": "只有一行时 align-content 无效；多行折行时才控制行与行之间的间距"}, {"k": "C", "t": "align-content 等价于 justify-content"}, {"k": "D", "t": "设置 align-content:center 可阻止折行"}], "answer": ["B"], "explain": "align-content 仅当 flex-wrap:wrap 产生多行时生效，负责多根轴线的整体对齐（如 space-between/center）。单行时无多根轴线，该属性不起作用。", "android": "类比 Android：类似 FlexboxLayout 多行时的 alignContent，单行时该属性无效。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 布局"}, {"no": 8, "type": "single", "body": "前端发起 fetch 请求，开发者按 F12 在 DevTools 中排查。以下说法正确的是？", "code": "fetch('/api/data', { method:'GET' })\n  .then(r => r.json())\n  .then(console.log);", "options": [{"k": "A", "t": "Network 面板只能看响应，看不到请求头"}, {"k": "B", "t": "可在 Network 面板查看请求 URL、状态码、请求/响应头与耗时"}, {"k": "C", "t": "Console 面板能直接修改接口返回数据"}, {"k": "D", "t": "DevTools 无法查看 fetch 请求"}], "answer": ["B"], "explain": "DevTools 的 Network 面板可查看每次请求的 URL、方法、状态码、请求头/响应头、大小与耗时（Waterfall），是定位前后端联调问题的首选。", "android": "类比 Android：类似用 Charles/OkHttp 拦截查看请求与响应，或 Android Studio Network Inspector。", "kaodian": "AI 前端能力 - 前端生态 - 浏览器 DevTools"}, {"no": 9, "type": "single", "body": "Vue3 中 computed 同时定义 get/set。以下说法正确的是？", "code": "const fullName = computed({\n  get: () => firstName.value + ' ' + lastName.value,\n  set: (v) => { [firstName.value, lastName.value] = v.split(' '); }\n});", "options": [{"k": "A", "t": "computed 只能读不能写，set 会报错"}, {"k": "B", "t": "给 fullName.value 赋值时触发 set，反向更新依赖的响应式变量"}, {"k": "C", "t": "set 中不能修改其他 ref"}, {"k": "D", "t": "computed 的 get 必须返回 Promise"}], "answer": ["B"], "explain": "computed 提供 get/set 时可双向绑定：读取走 get，赋值走 set。set 中更新源 ref（firstName/lastName），实现派生态的写回。", "android": "类比 Android：类似 LiveData 的派生（map/switchMap）只可读；若需可写，类似用自定义 getter/setter 双向同步两个字段。", "kaodian": "AI 前端能力 - 语言与运行时 (JS/TS/Vue/ 小程序) - 数据绑定"}, {"no": 10, "type": "single", "body": "两张表 departments(id,name) 与 employees(id,dept_id,name)。执行 SELECT e.name,d.name FROM employees e JOIN departments d ON e.dept_id=d.id，以下说法正确的是？", "code": "CREATE TABLE departments(id INT, name VARCHAR(20));\nCREATE TABLE employees(id INT, dept_id INT, name VARCHAR(20));\n-- e.dept_id = d.id", "options": [{"k": "A", "t": "结果只包含两表所有行的笛卡尔积"}, {"k": "B", "t": "结果返回员工姓名及其所属部门名，按 dept_id 关联"}, {"k": "C", "t": "JOIN 会丢失没有部门的员工"}, {"k": "D", "t": "必须写成 LEFT JOIN 才能关联"}], "answer": ["B"], "explain": "INNER JOIN 按 e.dept_id=d.id 关联，返回匹配的员工与部门名。无部门（dept_id 为 NULL 或无匹配）的员工不会出现在结果中。", "android": "类比 Android：类似 Room 的 @Relation 或联表查询，按外键关联两张表，内连接只返回有匹配的行。", "kaodian": "AI 后端能力 - 数据存储与持久化层 - 多表关联基础"}, {"no": 11, "type": "single", "body": "MySQL InnoDB 表 users(id PK, name, age)，对 (name, age) 建联合索引 idx_na。关于索引使用，正确的是？", "code": "CREATE TABLE users(\n  id INT PRIMARY KEY,\n  name VARCHAR(20),\n  age INT,\n  KEY idx_na (name, age)\n);", "options": [{"k": "A", "t": "WHERE age=20 能命中 idx_na（最左前缀）"}, {"k": "B", "t": "WHERE name='Tom' AND age=20 能命中 idx_na，且可索引下推"}, {"k": "C", "t": "联合索引与单列索引效果完全相同"}, {"k": "D", "t": "SELECT * 一定走索引不需要回表"}], "answer": ["B"], "explain": "最左前缀：条件含 name 才能用到 idx_na；name+age 都命中且可在索引层过滤（ICP）。仅 age 不满足最左前缀，无法命中该联合索引。", "android": "类比 Android：类似数据库联合索引/复合主键的最左匹配原则，跳过头列则索引失效。", "kaodian": "AI 后端能力 - 数据存储与持久化层 - 表结构理解"}, {"no": 12, "type": "single", "body": "Redis 用 Hash 存储用户基本信息，Key=\"user:profile:100\"。以下读取单个字段的方式正确的是？", "code": "// 存储\nredis.hset(\"user:profile:100\", \"nick\", \"Tom\");\nredis.hset(\"user:profile:100\", \"age\", \"18\");\n// 读取昵称", "options": [{"k": "A", "t": "stringRedisTemplate.opsForValue().get(\"user:profile:100\")"}, {"k": "B", "t": "stringRedisTemplate.opsForHash().get(\"user:profile:100\",\"nick\")"}, {"k": "C", "t": "stringRedisTemplate.opsForList().index(...)"}, {"k": "D", "t": "stringRedisTemplate.opsForSet().member(...)"}], "answer": ["B"], "explain": "Hash 结构用 opsForHash() 操作；读取单个字段用 hget(key, field) 即 opsForHash().get(key, field)。opsForValue 用于字符串类型，类型不匹配会报错。", "android": "类比 Android：类似用 HashMap 存对象字段，按 field 取单个属性，而非整体序列化字符串。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RedisTemplate 基础使用"}, {"no": 13, "type": "single", "body": "校验登录 Token 时效性的方法，使用 Redis 存储 token 及过期时间。以下做法最合理的是？", "code": "public boolean check(String token){\n  String t = stringRedisTemplate.opsForValue().get(\"token:\"+token);\n  return t != null; // 仅判断存在\n}", "options": [{"k": "A", "t": "仅判断 key 存在即可，过期由 Redis 自动删除"}, {"k": "B", "t": "应在写入时设置 EXPIRE，读取时判断存在即代表未过期"}, {"k": "C", "t": "需要自己在 Java 里再存过期时间并比较"}, {"k": "D", "t": "TTL 无法自动生效，必须手动删除"}], "answer": ["B"], "explain": "写入 token 时通过 set(key,val,timeout) 设置过期，Redis 到期自动删除；读取时 key 存在即未过期，无需业务侧再比较时间，简洁且准确。", "android": "类比 Android：类似 Token 存入 SharedPreferences 并附带过期时间戳，读取时判断时间戳；用 Redis 则由服务端 TTL 托管更可靠。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RedisTemplate 基础使用"}, {"no": 14, "type": "single", "body": "搜索功能含防抖处理，输入关键词后展示结果。关于“空数据/错误”状态的测试要点，正确的是？", "code": "const state = reactive({ kw:'', list:[], loading:false, err:null });\nfunction onInput(){ debounce(search, 300); }", "options": [{"k": "A", "t": "只需验证有结果的情况，空结果不用测"}, {"k": "B", "t": "应覆盖：加载中、空数据、接口报错、成功四种页面状态"}, {"k": "C", "t": "防抖可完全替代接口异常处理"}, {"k": "D", "t": "错误提示只在控制台打印即可"}], "answer": ["B"], "explain": "功能测试需覆盖页面状态机：输入中(loading)、无结果(空数据占位)、请求失败(错误提示)、成功(列表展示)。缺任一状态都可能导致线上空白页。", "android": "类比 Android：类似搜索页状态管理（Loading/Empty/Error/Success），四种状态都要有对应 UI 与用例。", "kaodian": "AI 质量保障 - Web/App 功能测试 (Functional Testing) - Web/App 基础操作：登录、搜索、筛选、查看详情、新增、编辑、删除、提交"}, {"no": 15, "type": "single", "body": "经典三层架构 Controller-Service-Mapper。以下 Controller 写法符合规范的是？", "code": "@RestController\npublic class UserController {\n    @Autowired UserService userService;\n    @GetMapping(\"/users/{id}\")\n    public UserVO get(@PathVariable Long id){\n        return userService.getById(id);\n    }\n}", "options": [{"k": "A", "t": "Controller 直接写 SQL 查库最快，符合规范"}, {"k": "B", "t": "Controller 只做参数校验与转发，业务逻辑交给 Service"}, {"k": "C", "t": "Service 层可以省略，逻辑都放 Controller"}, {"k": "D", "t": "Mapper 应直接被 Controller 调用"}], "answer": ["B"], "explain": "分层职责：Controller 负责接收请求、参数校验、返回；业务逻辑放 Service；数据访问放 Mapper/DAO。Controller 直接写 SQL 破坏分层、难测试。", "android": "类比 Android：类似 MVP/MVVM，Activity/Fragment 只做 UI 与事件转发，业务逻辑放 Presenter/ViewModel，数据层放 Repository。", "kaodian": "AI 后端能力 - 架构思维与程序设计层 - MVC 分层职责"}, {"no": 16, "type": "single", "body": "容器内两子元素 .a 与 .b，.b 设置 position:absolute 并偏移。渲染完成后说法正确的是？", "code": ".parent{position:relative;}\n.item-a{width:100px;height:40px;}\n.item-b{position:absolute;top:10px;left:60px;}", "options": [{"k": "A", "t": ".b 仍在普通流中占据原位置"}, {"k": "B", "t": ".b 脱离文档流，相对于 .parent 定位，可能覆盖 .a"}, {"k": "C", "t": ".a 会因 .b 绝对定位而下移"}, {"k": "D", "t": "绝对定位元素无法覆盖其他元素"}], "answer": ["B"], "explain": "position:absolute 使 .b 脱离普通流，以最近定位祖先 .parent 为基准定位，不再占据流内空间，可能叠在 .a 之上（由 z-index/顺序决定层叠）。", "android": "类比 Android：类似 FrameLayout 中子 View 的绝对/叠加布局，后添加的 View 默认叠在上层。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 布局"}, {"no": 17, "type": "single", "body": "观察 package.json 与 CI 构建日志，构建失败。以下最可能导致失败的原因是？", "code": "// CI 日志\nError: TS2322: Type 'string' is not assignable to type 'number'.\nnpm run build (tsc && vite build) 退出码 2", "options": [{"k": "A", "t": "Node 版本过低无关紧要"}, {"k": "B", "t": "tsc 类型检查报错导致 build 脚本（tsc && vite build）中断"}, {"k": "C", "t": "vite 配置错误导致，与 tsc 无关"}, {"k": "D", "t": "CI 不会因类型错误失败"}], "answer": ["B"], "explain": "CI 流水线 build 脚本通常是 tsc && vite build；tsc 严格类型检查报错（TS2322）会以非零码退出，&& 短路导致 vite build 不执行，整体失败。", "android": "类比 Android：类似 Gradle 构建中 kotlinc 类型错误使 assembleRelease 失败，需本地先 ./gradlew compileReleaseKotlin 复现修复。", "kaodian": "AI 质量保障 - 质量工程 - CI/CD 自动化流水线测试"}, {"no": 18, "type": "single", "body": "阅读 Axios 请求配置，关于 params 与 data 的底层差异，正确的是？", "code": "axios.get('/api/u', { params: { id: 1 } });\naxios.post('/api/u', { params: { id: 1 }, data: { name:'Tom' } });", "options": [{"k": "A", "t": "params 与 data 都放在请求体里"}, {"k": "B", "t": "params 拼到 URL 查询串（?id=1），data 放请求体（POST/PUT）"}, {"k": "C", "t": "GET 请求也可以用 data 传请求体"}, {"k": "D", "t": "params 只能传数字"}], "answer": ["B"], "explain": "params 序列化为 URL query string（GET 常用）；data 作为请求体（POST/PUT/PATCH）。GET 规范不带请求体，data 对 GET 一般被忽略。", "android": "类比 Android：类似 Retrofit @Query（拼 URL）与 @Body（请求体）的区别，@Query 对应 params，@Body 对应 data。", "kaodian": "AI 前端能力 - 网络与 BFF 架构 - Axios 请求配置"}, {"no": 19, "type": "single", "body": "MyBatis-Plus 将指定 id 用户 status 更新为 2 并清空备注（remark 置 NULL）。正确写法是？", "code": "// 目标：status=2, remark=null where id=#{id}\nUpdateWrapper<User> uw = new UpdateWrapper<>();\nuw.eq(\"id\", id)\n  .set(\"status\", 2)\n  .set(\"remark\", null); // 清空备注", "options": [{"k": "A", "t": ".set(\"remark\", null) 不会生成 SQL 字段赋值"}, {"k": "B", "t": ".set(\"remark\", null) 会生成 remark = null，真正清空"}, {"k": "C", "t": "必须写 .setSql(\"remark = null\") 才行"}, {"k": "D", "t": "LambdaUpdateWrapper 不支持 set null"}], "answer": ["B"], "explain": "UpdateWrapper.set(\"remark\", null) 会生成 remark = null 的赋值，真正清空字段。注意：set 值为 null 与 setSql 等价但更直观；若用 .set(\"remark\", \"\") 则是空串而非 NULL。", "android": "类比 Android：类似 UPDATE 语句把某列置 NULL 表示“未设置”，与空字符串语义不同（数据库 NULL ≠ ''）。", "kaodian": "AI 后端能力 - 数据存储与持久化层 - LambdaQueryWrapper/LambdaUpdateWrapper"}, {"no": 20, "type": "single", "body": "MyBatis-Plus 条件构造器写法，关于 LambdaQueryWrapper 与 QueryWrapper 的区别，正确的是？", "code": "LambdaQueryWrapper<User> lqw = new LambdaQueryWrapper<>();\nlqw.eq(User::getStatus, 1).like(User::getName, \"Tom\");", "options": [{"k": "A", "t": "Lambda 写法用字符串列名，易拼写错"}, {"k": "B", "t": "Lambda 写法用方法引用(User::getStatus)，编译期校验列名更安全"}, {"k": "C", "t": "LambdaQueryWrapper 不能做 like 查询"}, {"k": "D", "t": "两者生成的 SQL 完全不同"}], "answer": ["B"], "explain": "LambdaQueryWrapper 用 User::getStatus 方法引用指定列，编译期即可发现列名错误，避免硬编码字符串拼写出错；生成的 SQL 与 QueryWrapper 等价。", "android": "类比 Android：类似用 Room 的 DAO 方法引用实体字段，比手写列名字符串更类型安全。", "kaodian": "AI 后端能力 - 数据存储与持久化层 - LambdaQueryWrapper/LambdaUpdateWrapper"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "测试人员调用用户注册接口，Postman 请求与响应如下。关于“接口是否成功”的判断，正确的是？", "code": "Request:  POST /api/v1/users/register\n          Body: { \"name\":\"Tom\", \"age\":-1 }\nResponse: 200 OK\n          Body: { \"code\":40001, \"msg\":\"参数非法\", \"data\":null }", "options": [{"k": "A", "t": "HTTP 200 即成功，业务可忽略"}, {"k": "B", "t": "应同时看 HTTP 状态码与业务 code，code!=0/成功码才算失败"}, {"k": "C", "t": "age=-1 是后端问题，前端无需校验"}, {"k": "D", "t": "接口测试只看响应时间"}], "answer": ["B"], "explain": "接口测试要区分传输层与业务层：HTTP 200 仅表示请求送达；业务成功以响应体中的 code 为准。本例 code=40001 表示业务失败，应判为不通过。", "android": "类比 Android：类似接口返回包装类 Result<T>，不能只看 HTTP 200，还要看 Result.code，code!=0 即业务逻辑失败。", "kaodian": "AI 质量保障 - 接口测试能力 (API Testing & Integration) - 接口返回判断与参数测试"}, {"no": 22, "type": "multi", "body": "为处理因业务缺陷反复重试失败的消息，RabbitMQ 配置了死信交换机(DLX)与死信队列(DLQ)。关于死信消息的流转，正确的是？", "code": "// 队列属性\nx-dead-letter-exchange: dlx.exchange\nx-dead-letter-routing-key: dlq.key", "options": [{"k": "A", "t": "消息被消费者 basicReject/basicNack 且 requeue=false 时进入 DLQ"}, {"k": "B", "t": "消息 TTL 过期后会进入 DLQ"}, {"k": "C", "t": "队列达到最大长度被拒绝的消息进入 DLQ"}, {"k": "D", "t": "正常消费成功的消息也会进入 DLQ"}], "answer": ["A", "B", "C"], "explain": "死信消息触发条件：1) 被拒绝且 requeue=false；2) TTL 过期；3) 队列满被挤出的消息。均路由到 DLX→DLQ 供后续排查/补偿，成功消费的不进 DLQ。", "android": "类比 Android：类似失败任务进入“死信/重试队列”而非丢弃，便于离线排查与人工补偿。", "kaodian": "AI 后端能力 - 高并发与中间件层 - MQ 基础概念"}, {"no": 23, "type": "multi", "body": "前端用 Axios 从后端导出并下载 Excel/PDF 文件流。关于配置，正确的是？", "code": "axios.get('/api/export', {\n  responseType: 'blob'\n}).then(res => {\n  const url = URL.createObjectURL(res.data);\n  // 触发 <a download> 下载\n});", "options": [{"k": "A", "t": "必须设 responseType:'blob' 才能拿到二进制流"}, {"k": "B", "t": "可用 URL.createObjectURL 把 Blob 转为可下载链接"}, {"k": "C", "t": "responseType 默认 json，不设置会拿到乱码字符串"}, {"k": "D", "t": "下载必须后端直接返回文件 URL，前端无法处理流"}], "answer": ["A", "B", "C"], "explain": "下载二进制流需 responseType:'blob'；拿到 Blob 后用 URL.createObjectURL 生成临时 URL 触发 a[download] 下载。默认 json 会把流当文本解析导致乱码。", "android": "类比 Android：类似 Retrofit 用 ResponseBody 接收流，再写入文件；用 Okio 缓冲避免内存爆炸。", "kaodian": "AI 前端能力 - 网络与 BFF 架构 - Axios 请求配置"}, {"no": 24, "type": "multi", "body": "电商平台“购物车”模块变更：修改数量增减逻辑、优化总价计算。关于回归测试，正确的是？", "code": "变更点：\n1) 购物车商品数量 +1/-1 逻辑\n2) 商品总价计算逻辑", "options": [{"k": "A", "t": "应重跑全部用例确保无遗漏"}, {"k": "B", "t": "先做变更影响分析，筛选受影响的用例优先重跑"}, {"k": "C", "t": "只测改动的两个函数即可"}, {"k": "D", "t": "回归测试可完全用自动化替代人工评审"}], "answer": ["B"], "explain": "回归测试核心是变更影响分析：识别改动波及的功能与用例，优先重跑受影响用例，提升效率。盲目全量重跑成本高，只测改动点易漏间接影响。", "android": "类比 Android：类似改了购物车逻辑后，用影响分析定位需重测页面（结算、优惠），而非全量手测。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 (Testing Fundamentals & QA System) - 回归测试：变更影响分析与用例筛选"}, {"no": 25, "type": "multi", "body": "以下 Java 代码关于泛型擦除与强类型系统的分析，正确的选项有？", "code": "List<String> a = new ArrayList<>();\nList<Integer> b = new ArrayList<>();\nSystem.out.println(a.getClass() == b.getClass());\n// 运行期 a、b 的 getClass() 是否相同？", "options": [{"k": "A", "t": "a 与 b 运行时 getClass() 相同（均为 ArrayList）"}, {"k": "B", "t": "泛型 <String>/<Integer> 在编译后会被擦除为 Object"}, {"k": "C", "t": "可用 instanceof List<String> 在运行期判断元素类型"}, {"k": "D", "t": "编译器靠泛型保证类型安全，运行期无元素类型信息"}], "answer": ["A", "B", "D"], "explain": "Java 泛型在编译期做类型检查，运行期类型擦除为 Object/上界，故 a、b 的 getClass() 都是 ArrayList；instanceof 只能判断 List 不能判断 List<String>。", "android": "类比 Android：类似 Kotlin 的泛型实化需 reified 才能在运行期拿到类型；普通泛型同样被擦除。", "kaodian": "AI 后端能力 - 语言与计算层 - 强类型系统理解"}, {"no": 26, "type": "multi", "body": "Vue3 项目调用后端接口页面无任何数据展示，开发者按 F12 排查。应重点检查的点有？", "code": "// 现象：页面空白，无报错弹窗\n// Network 中该请求状态 200，但 Response 为空数组", "options": [{"k": "A", "t": "Network 面板确认请求是否真正发出及状态码"}, {"k": "B", "t": "Console 查看是否有 JS 运行/解析错误"}, {"k": "C", "t": "检查接口返回的字段名与前端绑定是否一致"}, {"k": "D", "t": "只需刷新页面，数据会自动出现"}], "answer": ["A", "B", "C"], "explain": "无数据排查链路：Network 确认请求发出+状态码；Console 看 JS 报错；再核对响应字段名与前端绑定是否匹配（如 res.list vs res.data）。空数组说明接口返回了但无数据。", "android": "类比 Android：类似接口返回空列表时，先查日志请求/响应、再看 Adapter 绑定字段名是否拼错。", "kaodian": "AI 前端能力 - 前端生态 - 浏览器 DevTools"}, {"no": 27, "type": "multi", "body": "开发者用 ChatGPT 为“用户注册”功能辅助生成测试数据。该模块含用户名(4-16位)、手机号(11位)、密码(8-20位)。关于 AI 生成测试数据，正确的是？", "code": "输入字段：\n- 用户名：4-16 位\n- 手机号：11 位\n- 密码：8-20 位", "options": [{"k": "A", "t": "AI 可快速生成边界与异常用例（如超长、非法字符）"}, {"k": "B", "t": "生成的数据必须人工校验格式与边界是否合规"}, {"k": "C", "t": "AI 生成即可直接使用，无需验证"}, {"k": "D", "t": "可让 AI 覆盖等价类与边界值用例"}], "answer": ["A", "B", "D"], "explain": "AI 擅长批量生成等价类/边界值用例（超长、空、特殊字符），但生成结果需人工校验真实合规性，不能直接信任，避免“看起来对”的脏数据。", "android": "类比 Android：类似用脚本批量造测试账号，仍需校验手机号/密码规则，避免脏数据污染测试环境。", "kaodian": "AI 质量保障 - AI 测试能力 - 测试数据准备"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 28, "type": "judge", "body": "在三层架构中，Controller 层直接编写 SQL 并通过 JDBC 查询数据库，只要能跑通就符合规范。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "Controller 应只做请求接收、参数校验与响应；数据访问必须下沉到 Mapper/DAO 层。直接在 Controller 写 SQL 破坏分层、紧耦合、难单测。", "android": "类比 Android：类似 Activity 里直接写 SQL 查询，违备 MVP/MVVM 分层，应放 Repository。", "kaodian": "AI 后端能力 - 架构思维与程序设计层 - MVC 分层职责"}, {"no": 29, "type": "judge", "body": "Nacos 作为配置中心，应用监听配置变更后可不重启就动态刷新配置（如 @RefreshScope）。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Nacos 配置中心支持配置动态推送，Spring Cloud Alibaba 配合 @RefreshScope 可在不重启应用的情况下热更新配置，是微服务配置管理的关键能力。", "android": "类比 Android：类似远程配置（Firebase Remote Config），下发新参数无需发版即可生效。", "kaodian": "AI 后端能力 - 微服务架构层 - 微服务基础概念"}, {"no": 30, "type": "judge", "body": "@ConfigurationProperties 可将配置文件中的一组同前缀属性批量绑定到一个 Java Bean 上。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "@ConfigurationProperties(prefix=\"myapp\") 把 application.yml 中 myapp.* 下的子项自动绑定到 Bean 字段，比逐个 @Value 更适合批量配置。", "android": "类比 Android：类似把 buildConfig 或 resource 下的一组同前缀配置批量映射到数据类。", "kaodian": "AI 后端能力 - 应用框架层 - 配置文件读写"}, {"no": 31, "type": "judge", "body": "回归测试为保证可靠性，每次都必须把全部历史用例重新执行一遍。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "全量回归成本高且慢；正确做法是基于变更影响分析筛选受影响用例优先重跑，结合自动化冒烟保证核心链路，而非无差别全量执行。", "android": "类比 Android：类似发版前跑核心用例集(P0)而非全量 monkey，效率与覆盖平衡。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 (Testing Fundamentals & QA System) - 测试基础概念"}, {"no": 32, "type": "judge", "body": "Java 多 catch 时，子类异常（如 IOException）必须写在父类异常（如 Exception）之前，否则编译报错。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "catch 块按书写顺序匹配，子类在前父类在后；若父类写在前面，子类 catch 永远不可达，编译器报“已捕获”错误。这是异常处理的基本顺序规则。", "android": "类比 Android：类似 Kotlin try-catch，更具体的异常分支必须放在更通用的之前，否则编译不过。", "kaodian": "AI 后端能力 - 语言与计算层 - 异常处理"}, {"no": 33, "type": "judge", "body": "自动化测试中可用 Playwright 的 expect(locator).toBeVisible() 对页面元素做断言。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Playwright 提供 expect + 匹配器（toBeVisible/toHaveText 等）做自动断言，配合测试运行器生成报告，是前端自动化测试的标准写法。", "android": "类比 Android：类似 Espresso 的 onView(...).check(matches(isDisplayed())) 做 UI 断言。", "kaodian": "AI 质量保障 - 自动化测试能力 (Automation Testing & Frameworks) - 简单断言"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+q.no+'" data-no="'+q.no+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+q.no+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q.no==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=document.querySelector('.card[data-no="'+btn.dataset.no+'"]'); gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  ans.querySelector('.ans').textContent='答案：'+(q.type==='fill'? q.answerText : q.answer.join('、'));
  ans.classList.add('show');
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  if(!isAnswered(card)){ if(!confirm('本题还没作答，将按答错处理并展示答案。')) return; }
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
