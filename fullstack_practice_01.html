  .btn-ghost { background:#f2f3f5; color:#41464b; }

  @media (max-width:600px) {

<script type="application/json" id="quizData">{"id": "vol01", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11（单选7+7+6 / 多选3+2+2 / 判断1+2+3）。覆盖缓存一致性、MyBatis-Plus、@Transactional/@Async、MQ死信与分区顺序、覆盖索引、Vue3响应式与computed、Flex布局、Axios/CORS/Vite代理、Playwright/回归测试/质量门禁等。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "采用 Cache-Aside 模式更新商品库存时，下列操作顺序在并发下最不易产生长期脏数据的是？", "code": "方案1：先更新数据库，再删除缓存\n方案2：先删除缓存，再更新数据库\n方案3：先更新数据库，再更新缓存", "options": [{"k": "A", "t": "方案1（更新DB→删缓存），配合读时回填，仅极小概率脏数据，是业界常用做法"}, {"k": "B", "t": "方案2（删缓存→更新DB）更优，能确保缓存一定为空"}, {"k": "C", "t": "方案3（更新DB→更新缓存）最安全，能完全避免一致性问题"}, {"k": "D", "t": "三种方案一致性等价"}], "answer": "A", "explain": "Cache-Aside 标准做法：写时更新数据库并删除缓存（方案1）。方案2 在并发下，读请求可能在删缓存与更新DB之间未命中而回填旧值，造成长期脏数据。方案3 直接更新缓存易因并发写乱序覆盖产生不一致，且缓存里放的是旧计算结果。", "kaodian": "AI后端能力-高并发与中间件层-缓存使用流程"}, {"no": 2, "type": "single", "body": "使用 MyBatis-Plus 查询状态为 ENABLED 的用户，仅返回 id 与 username。下列写法正确的是？", "code": "new LambdaQueryWrapper<User>()\n  .eq(User::getStatus, \"ENABLED\")\n  .select(User::getId, User::getUsername);", "options": [{"k": "A", "t": "LambdaQueryWrapper.select(方法引用) 可类型安全地指定返回列，避免硬编码字段名"}, {"k": "B", "t": "必须改用 QueryWrapper 才能用 select"}, {"k": "C", "t": "LambdaQueryWrapper 不支持 select 指定列"}, {"k": "D", "t": "select 只能写在最后且必须配合 last()"}], "answer": "A", "explain": "LambdaQueryWrapper 的 select(方法引用...) 可类型安全地指定返回列，编译期即可发现字段错误；eq 等条件方法均受支持。B/C/D 均错。", "kaodian": "AI后端能力-数据存储与ORM层-LambdaQueryWrapper/LambdaUpdateWrapper"}, {"no": 3, "type": "single", "body": "在 Spring 中，下面哪段代码会导致 @Transactional 注解不生效？", "code": "@Service\npublic class OrderService {\n  public void create() { this.inner(); }   // 自调用\n  @Transactional\n  public void inner() { /* 写库 */ }\n}", "options": [{"k": "A", "t": "自调用通过 this 调用，未经过代理，@Transactional 不生效"}, {"k": "B", "t": "inner 是 public，事务一定生效"}, {"k": "C", "t": "需加 @EnableTransactionManagement 才会生效"}, {"k": "D", "t": "事务只对接口方法生效"}], "answer": "A", "explain": "Spring 事务基于代理实现，只有经过容器注入的代理对象调用方法时才会开启事务。this.inner() 是对象内部直接调用，绕过代理，@Transactional 失效。B/C/D 错。", "kaodian": "AI后端能力-应用框架层-Spring事务管理"}, {"no": 4, "type": "single", "body": "消费者处理消息抛异常后调用 channel.basicNack(tag,false,false)，在已配置死信交换机(DLX)的前提下，该消息会怎样？", "code": "channel.basicConsume(queue, false, (tag,msg)->{\n  try { process(msg); channel.basicAck(tag,false); }\n  catch(Exception e){ channel.basicNack(tag,false,false); }\n});", "options": [{"k": "A", "t": "进入死信队列（因配置了 DLX 且 requeue=false）"}, {"k": "B", "t": "重新入队等待重试"}, {"k": "C", "t": "直接被丢弃且不进死信"}, {"k": "D", "t": "阻塞整个队列"}], "answer": "A", "explain": "basicNack 的 requeue=false 表示不重新入队；若队列配置了 x-dead-letter-exchange，消息会路由到死信队列，便于后续排查/重试，避免毒消息循环。", "kaodian": "AI后端能力-高并发与中间件层-MQ基础概念"}, {"no": 5, "type": "single", "body": "关于 Kafka 消息顺序，下列说法正确的是？", "code": "// 同一生产者向 topic orders 发送消息\nproducer.send(new ProducerRecord<>(\"orders\", 1, \"k\", \"v1\"));\nproducer.send(new ProducerRecord<>(\"orders\", 1, \"k\", \"v2\"));\nproducer.send(new ProducerRecord<>(\"orders\", 2, \"k\", \"v3\"));", "options": [{"k": "A", "t": "分区1内 v1 先于 v2 被消费（分区内有序），但跨分区不保证全局顺序"}, {"k": "B", "t": "全局严格有序"}, {"k": "C", "t": "仅按 key 哈希，不保证任何顺序"}, {"k": "D", "t": "消费组消费者越多越有序"}], "answer": "A", "explain": "Kafka 只保证分区内有序。同一分区（partition=1）的消息按写入顺序被消费；不同分区之间无顺序保证。B/C/D 错。", "kaodian": "AI后端能力-高并发与中间件层-MQ基础概念"}, {"no": 6, "type": "single", "body": "表 user(id PK, name, age, KEY idx_name_age(name,age))。下列查询哪种能利用覆盖索引、无需回表？", "code": "SELECT name, age FROM user WHERE name = 'Tom' AND age > 20;", "options": [{"k": "A", "t": "命中 idx_name_age 覆盖索引，Extra 显示 Using index，不需回表"}, {"k": "B", "t": "一定回表，因为 WHERE 有范围条件"}, {"k": "C", "t": "覆盖索引只在 COUNT 时生效"}, {"k": "D", "t": "必须建包含 id 的联合索引才行"}], "answer": "A", "explain": "查询列 name、age 都包含在 idx_name_age 中，索引叶节点即满足查询，无需回主键取数据（避免随机 IO），性能更好。", "kaodian": "AI后端能力-数据存储与ORM层-索引与SQL优化"}, {"no": 7, "type": "single", "body": "下列 @Async 异步方法调用后，哪项是其正确生效的前提？", "code": "@Service\npublic class Svc {\n  @Async\n  public CompletableFuture<String> task() { /* 耗时 */ return CompletableFuture.completedFuture(\"ok\"); }\n}\n// 调用方：通过注入的代理对象 svc.task() 才异步；同 service 内 this.task() 不生效", "options": [{"k": "A", "t": "@Async 方法须为 public 且经容器代理对象调用才异步，自调用不生效"}, {"k": "B", "t": "加 @Async 即可，与调用方式无关"}, {"k": "C", "t": "必须返回 void"}, {"k": "D", "t": "方法必须是 static"}], "answer": "A", "explain": "@Async 同样基于代理，只有经过代理调用才提交到线程池；自调用（this.xxx）绕过代理，仍是同步执行。返回 CompletableFuture 是推荐做法而非必须 void。", "kaodian": "AI后端能力-应用框架层-Spring异步与调度"}, {"no": 8, "type": "single", "body": "在 Vue3 中，下列关于 computed 的说法，执行结果符合预期的是？", "code": "const count = ref(1);\nconst double = computed(() => { console.log('calc'); return count.value * 2; });\nconsole.log(double.value);\nconsole.log(double.value); // 依赖未变", "options": [{"k": "A", "t": "控制台打印一次 'calc'，两次都返回 2（computed 惰性且带缓存）"}, {"k": "B", "t": "打印两次 'calc'"}, {"k": "C", "t": "第一次返回 undefined"}, {"k": "D", "t": "computed 每次访问都重新计算"}], "answer": "A", "explain": "computed 是惰性的：首次访问才执行并缓存结果；依赖（count.value）不变时，后续访问直接返回缓存值，不重复执行函数。故只打印一次 'calc'。", "kaodian": "AI前端能力-语言与运行时-Vue3响应式"}, {"no": 9, "type": "single", "body": "父容器 width:600px; display:flex; 两个子项样式分别为 flex:2 1 0 与 flex:1 1 0，它们的最终宽度约为？", "code": ".box{display:flex;width:600px}\n.a{flex:2 1 0}.b{flex:1 1 0}", "options": [{"k": "A", "t": "a≈400px, b≈200px（按 grow 比例 2:1 分配）"}, {"k": "B", "t": "各占 300px"}, {"k": "C", "t": "a 占满 600px, b 为 0"}, {"k": "D", "t": "按内容撑开"}], "answer": "A", "explain": "flex-grow 决定剩余空间分配比例。basis 均为 0，剩余 600px 按 2:1 分配：a 得 400、b 得 200。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS布局"}, {"no": 10, "type": "single", "body": "调用导出接口下载文件，下列配置正确的是？", "code": "axios.get('/api/export', { responseType: 'blob' })\n  .then(r => { const url = URL.createObjectURL(r.data); /* 触发下载 */ });", "options": [{"k": "A", "t": "用 responseType:'blob' 接收二进制，再借 URL.createObjectURL 下载，正确"}, {"k": "B", "t": "必须 responseType:'json'"}, {"k": "C", "t": "下载必须用 POST"}, {"k": "D", "t": "blob 只在 fetch 支持，Axios 不支持"}], "answer": "A", "explain": "文件下载需 responseType:'blob' 让 Axios 以 Blob 形式接收响应体，再借 URL.createObjectURL 触发下载。导出类接口多为 GET。B 会把二进制当 JSON 解析失败；C/D 错。", "kaodian": "AI前端能力-网络与BFF架构-Axios请求配置"}, {"no": 11, "type": "single", "body": "前端带凭证(cookies)跨域请求，后端下列哪项响应头配置会导致浏览器拦截？", "code": "Access-Control-Allow-Origin: *\nAccess-Control-Allow-Credentials: true", "options": [{"k": "A", "t": "携带凭证时 Allow-Origin 不能为 *，必须明确具体域名，否则浏览器拦截"}, {"k": "B", "t": "配置正确可用"}, {"k": "C", "t": "需要把 Credentials 设为 false"}, {"k": "D", "t": "与 Allow-Origin 无关"}], "answer": "A", "explain": "当请求带凭证（cookies）且 Access-Control-Allow-Credentials:true 时，Access-Control-Allow-Origin 不能是通配符 *，必须写明具体来源，否则浏览器拒绝响应。", "kaodian": "AI前端能力-网络与BFF架构-跨域CORS"}, {"no": 12, "type": "single", "body": "Vite 开发代理将 /api 转发到 http://backend 并希望去掉前缀，下列 rewrite 写法正确的是？", "code": "server:{ proxy:{ '/api':{ target:'http://backend', rewrite: p => p.replace('/api','') } } }", "options": [{"k": "A", "t": "rewrite 用 replace 把 /api 前缀替换为空，正确"}, {"k": "B", "t": "必须写成 rewrite:'/api'=>'' 字符串"}, {"k": "C", "t": "proxy 不能去前缀"}, {"k": "D", "t": "rewrite 只能改路径不能删"}], "answer": "A", "explain": "Vite 的 proxy.rewrite 接收一个函数，返回改写后的路径。p.replace('/api','') 把前缀去掉，后端收到无 /api 的路径。", "kaodian": "AI前端能力-网络与BFF架构-开发代理与构建"}, {"no": 13, "type": "single", "body": "在 Vue3 中，下列关于 ref 解包的说法正确的是？", "code": "const obj = reactive({ count: ref(0) });\nconsole.log(obj.count); // 在 reactive 中\nconst n = ref(1);\nconsole.log(n); // 在 setup 顶层", "options": [{"k": "A", "t": "reactive 对象中的 ref 会自动解包（obj.count 是 0 而非 Ref），而 setup 顶层 ref 需 .value 访问"}, {"k": "B", "t": "所有 ref 都需 .value"}, {"k": "C", "t": "reactive 中 ref 不解包"}, {"k": "D", "t": "ref 在模板中不解包"}], "answer": "A", "explain": "在 reactive 内嵌套的 ref 会被自动解包（脱 ref）；但在 setup 顶层或普通变量里，ref 必须通过 .value 访问。模板中顶层 ref 也会自动解包。", "kaodian": "AI前端能力-语言与运行时-Vue3响应式"}, {"no": 14, "type": "single", "body": "下列代码中，promiseAllSettled 的结果何时 resolve、内容如何？", "code": "const r = await Promise.allSettled([Promise.resolve(1), Promise.reject('e')]);", "options": [{"k": "A", "t": "两个都完成后 resolve，r 为 [{status:'fulfilled',value:1},{status:'rejected',reason:'e'}]，不抛错"}, {"k": "B", "t": "立即 reject"}, {"k": "C", "t": "等待第一个完成后 resolve"}, {"k": "D", "t": "结果只有一个元素"}], "answer": "A", "explain": "allSettled 等所有 promise 落定（无论成功失败）后 resolve，每项带 status 与 value/reason，不会因某一个失败而 reject，适合全部跑完再汇总。", "kaodian": "AI前端能力-语言与运行时-异步与事件循环"}, {"no": 15, "type": "single", "body": "某接口测试用例只断言了 response.status == 200，结果用例通过但实际业务失败。问题在于？", "code": "expect(res.status).toBe(200); // 仅此一行断言", "options": [{"k": "A", "t": "只校验 HTTP 状态码，未校验业务 code/数据，产生假阳性"}, {"k": "B", "t": "HTTP 200 一定代表成功"}, {"k": "C", "t": "应断言 status==500"}, {"k": "D", "t": "这是最佳实践"}], "answer": "A", "explain": "HTTP 200 只代表传输层成功，业务可能返回 {code:500} 失败。只断言状态码会漏掉业务逻辑错误，形成假阳性用例。", "kaodian": "AI质量保障-接口测试-APITesting&Integration"}, {"no": 16, "type": "single", "body": "一次需求变更只修改了 CouponService 的满减规则，回归测试应优先覆盖？", "code": "变更：CouponService.calculate()\n关联：OrderService.checkout() → CouponService\n       CheckoutController", "options": [{"k": "A", "t": "基于影响分析覆盖 CouponService 及其上下游 OrderService、CheckoutController"}, {"k": "B", "t": "只跑 CouponService 单测即可"}, {"k": "C", "t": "全量回归所有用例"}, {"k": "D", "t": "无需回归"}], "answer": "A", "explain": "回归测试应基于变更影响分析：不仅测被改模块，还要覆盖其调用方与依赖方（checkout、controller），否则可能漏掉联调层面的破坏。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归测试"}, {"no": 17, "type": "single", "body": "下列 Playwright 写法中，哪种能避免元素未就绪导致的 flaky？", "code": "A. await page.waitForTimeout(3000);\nB. await page.getByText('提交').click(); // 自动等待可见可点\nC. await page.locator('#btn').click({timeout:0});", "options": [{"k": "A", "t": "用 auto-wait 的智能定位点击（B）最稳，避免硬等"}, {"k": "B", "t": "waitForTimeout 硬等最稳"}, {"k": "C", "t": "timeout:0 会一直自动等待"}, {"k": "D", "t": "三者等价"}], "answer": "A", "explain": "Playwright 的 locator 操作默认带 auto-wait（等待元素可操作），比固定 sleep 更稳更省时。waitForTimeout 是反模式，易 flaky 且拖慢。", "kaodian": "AI质量保障-自动化测试-Playwright"}, {"no": 18, "type": "single", "body": "在 CI 中加入 tsc --noEmit 作为质量门禁，其作用是？", "code": "scripts: { \"typecheck\": \"tsc --noEmit\" }", "options": [{"k": "A", "t": "仅做类型检查不产出文件，把类型错误拦截在合入前"}, {"k": "B", "t": "编译并覆盖原 JS"}, {"k": "C", "t": "运行单元测试"}, {"k": "D", "t": "打包产物"}], "answer": "A", "explain": "tsc --noEmit 只做 TypeScript 类型检查不生成文件，作为门禁能在编译/运行前发现类型错误，是 CI 常见静态检查环节。", "kaodian": "AI质量保障-CI/CD与质量门禁-质量门禁"}, {"no": 19, "type": "single", "body": "某接口返回 HTTP 200 但响应体为 {code:500,msg:'库存不足'}，正确的测试断言应是？", "code": "HTTP/1.1 200 OK\n{\"code\":500,\"msg\":\"库存不足\"}", "options": [{"k": "A", "t": "业务失败应断言响应体 code 非成功值，不能只看 HTTP 200"}, {"k": "B", "t": "HTTP 200 即测试通过"}, {"k": "C", "t": "应断言 HTTP 500"}, {"k": "D", "t": "无法断言"}], "answer": "A", "explain": "接口的业务成败要看响应体里的业务 code，而非仅看 HTTP 状态码。此处业务 code=500 表示失败，用例应判失败。", "kaodian": "AI质量保障-接口测试-APITesting&Integration"}, {"no": 20, "type": "single", "body": "关于 AI 辅助测试数据分类，下列说法正确的是？", "code": "", "options": [{"k": "A", "t": "AI 可基于需求/接口自动生成并分类测试数据（正向/边界/异常），提升覆盖"}, {"k": "B", "t": "AI 只能生成随机数据"}, {"k": "C", "t": "AI 分类结果无需人工确认"}, {"k": "D", "t": "仅适用于性能测试"}], "answer": "A", "explain": "AI 辅助测试数据分类指利用模型理解需求与接口，产出并归类正向、边界、异常等数据，补全人工易漏的维度；但生成数据仍需人工复核预期结果。", "kaodian": "AI质量保障-软件测试理论与质量体系-AI辅助测试数据分类"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于基于 Redis 的分布式锁，下列说法正确的有？（多选、少选、错选均不得分）", "code": "SET lock_key uuid NX EX 30   // 加锁\nif redis.call('get',KEYS[1])==ARGV[1] then return redis.call('del',KEYS[1])", "options": [{"k": "A", "t": "SET NX EX 保证原子加锁，避免检查再设置的竞态与死锁"}, {"k": "B", "t": "释放锁前校验 value 是本线程 uuid，防止误删他人锁"}, {"k": "C", "t": "用 Lua 脚本保证判断+删除原子"}, {"k": "D", "t": "锁过期时间设越长越好，避免业务未执行完就过期"}], "answer": ["A", "B", "C"], "explain": "分布式锁三要素：① 原子加锁（SET NX EX）；② 释放时校验归属（uuid）防误删；③ 用 Lua 保证判断+删除原子。D 错：过期过长会降低可用性，应配合看门狗续期。", "kaodian": "AI后端能力-高并发与中间件层-分布式锁"}, {"no": 2, "type": "multi", "body": "关于 Spring 事务传播行为，下列说法正确的有？（多选、少选、错选均不得分）", "code": "@Transactional(propagation=Propagation.REQUIRED)   // 外层\n@Transactional(propagation=Propagation.REQUIRES_NEW) // 内层", "options": [{"k": "A", "t": "REQUIRED：内层加入外层事务，外层回滚内层也回滚"}, {"k": "B", "t": "REQUIRES_NEW：内层挂起外层事务，独立提交/回滚"}, {"k": "C", "t": "REQUIRES_NEW 内层抛异常一定导致外层回滚"}, {"k": "D", "t": "NESTED 与 REQUIRES_NEW 等价"}], "answer": ["A", "B"], "explain": "REQUIRED 内层并入外层同一事务；REQUIRES_NEW 挂起外层、开新事务，内层成败不影响外层（除非外层捕获后自行回滚）。C 错：外层不捕获则不受影响；D 错：NESTED 是嵌套保存点，与 REQUIRES_NEW 不同。", "kaodian": "AI后端能力-应用框架层-Spring事务管理"}, {"no": 3, "type": "multi", "body": "MyBatis-Plus 分页失效（仍全表查询无 LIMIT），可能原因正确的有？（多选、少选、错选均不得分）", "code": "// 配置类\n@Bean\npublic MybatisPlusInterceptor mpInterceptor(){\n  MybatisPlusInterceptor i=new MybatisPlusInterceptor();\n  i.addInnerInterceptor(new PaginationInnerInterceptor(DbType.MYSQL));\n  return i;\n}\n// 使用\nPage<User> p = userMapper.selectPage(new Page<>(1,10), wrapper);", "options": [{"k": "A", "t": "必须注册 MybatisPlusInterceptor 并添加 PaginationInnerInterceptor"}, {"k": "B", "t": "必须使用 Page 对象作为分页参数"}, {"k": "C", "t": "调用 selectPage 才会触发分页，selectList 不会"}, {"k": "D", "t": "分页插件只能在 YAML 配置，不能代码配置"}], "answer": ["A", "B", "C"], "explain": "MP 分页三要素：① 注册拦截器并加 PaginationInnerInterceptor；② 用 Page 对象承载分页参数；③ 调用 selectPage/selectMapsPage 等才会被拦截加 LIMIT。D 错：代码配置完全可行。", "kaodian": "AI后端能力-数据存储与ORM层-MyBatis-Plus基础"}, {"no": 4, "type": "multi", "body": "关于 Vue3 响应式丢失，下列说法正确的有？（多选、少选、错选均不得分）", "code": "const s = reactive({ n: 1 });\nlet { n } = s;            // 解构\nconst plain = reactive({});\nplain = { a:1 };          // 整体重赋值", "options": [{"k": "A", "t": "对 reactive 对象解构出的基础类型会丢失响应性"}, {"k": "B", "t": "用 let 对变量整体重新赋值为新 reactive 会切断模板绑定"}, {"k": "C", "t": "ref.value 重新赋值仍是响应式的"}, {"k": "D", "t": "reactive 返回的是原始对象不是 Proxy"}], "answer": ["A", "B", "C"], "explain": "A 解构出的基础类型是值拷贝，不再与源联动；B 对 let 变量整体重赋值切断原代理与模板的关联；C ref.value 赋值响应式；D 错：reactive 返回的是 Proxy。", "kaodian": "AI前端能力-语言与运行时-Vue3响应式"}, {"no": 5, "type": "multi", "body": "接口返回 500，用浏览器 DevTools 排查时，下列说法正确的有？（多选、少选、错选均不得分）", "code": "// Network 面板中该请求\nStatus: 500\nResponse: {\"timestamp\":...,\"message\":\"NullPointerException\"}", "options": [{"k": "A", "t": "应在 Network 面板查看该请求的 Status 与 Response 定位服务端错误"}, {"k": "B", "t": "Console 面板主要看前端 JS 报错，不能直接看接口响应体"}, {"k": "C", "t": "Elements 面板可看接口返回"}, {"k": "D", "t": "Sources 打断点能直接修复后端 500"}], "answer": ["A", "B"], "explain": "接口 500 是服务端问题，优先在 Network 面板看 Status/Response/Request Headers 定位传参与报错；Console 多为前端 JS 错误，Elements/Sources 与接口响应无直接关系。", "kaodian": "AI前端能力-前端生态-浏览器DevTools"}, {"no": 6, "type": "multi", "body": "关于 flaky（不稳定）用例治理，下列说法正确的有？（多选、少选、错选均不得分）", "code": "// 偶发失败\nawait page.click('#submit'); // 未等待按钮就绪", "options": [{"k": "A", "t": "用自动等待/重试机制减少时序依赖"}, {"k": "B", "t": "保证用例间数据隔离（独立账户/清理）避免相互污染"}, {"k": "C", "t": "用 sleep 硬等即可根治"}, {"k": "D", "t": "隔离外部依赖（网络/时钟）提升稳定"}], "answer": ["A", "B", "D"], "explain": "flaky 治理靠：等待策略（auto-wait）、数据隔离（每用例独立数据）、消除外部依赖不确定性。C 错：sleep 是反模式，不能根治且拖慢。", "kaodian": "AI质量保障-自动化测试-自动化用例稳定性"}, {"no": 7, "type": "multi", "body": "关于回归测试策略，下列说法正确的有？（多选、少选、错选均不得分）", "code": "", "options": [{"k": "A", "t": "基于风险（高频/核心功能）优先"}, {"k": "B", "t": "基于影响分析（变更波及模块）筛选"}, {"k": "C", "t": "基于历史缺陷（易错模块）加权"}, {"k": "D", "t": "每次全量无条件执行所有用例最经济"}], "answer": ["A", "B", "C"], "explain": "回归测试应讲求性价比：按风险、变更影响、历史缺陷分布筛选用例集，而非盲目全量。D 错：全量成本高、反馈慢。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归测试"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "判断：@Value(\"${person.name}\") 可以像 @ConfigurationProperties 一样进行松散绑定，例如把配置项 person-name 绑定到 personName 字段。", "code": "@Value(\"${person.name}\") private String personName;", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "@Value 不支持松散绑定（kebab/pascal/camel 互转）；person-name 无法绑定到 @Value(\"${person.name}\")。只有 @ConfigurationProperties 支持松散绑定。", "kaodian": "AI后端能力-应用框架层-配置绑定"}, {"no": 2, "type": "judge", "body": "判断：在 Vue3 中，v-if 的优先级高于 v-for，因此同一元素上同时写 v-if 和 v-for 时 v-if 无法访问 v-for 的变量。", "code": "<li v-for=\"item in list\" v-if=\"item.show\">{{item.name}}</li>", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Vue3 中 v-if 优先级高于 v-for，同一节点上 v-if 不能访问 v-for 作用域变量，应避免同节点混用（用 template 包 v-for 或在 computed 中过滤）。", "kaodian": "AI前端能力-语言与运行时-Vue基础模板"}, {"no": 3, "type": "judge", "body": "判断：跨域请求被拦截是浏览器的同源策略限制，服务端本身没有同源概念，可通过返回正确 CORS 头允许跨域。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "同源策略由浏览器执行，服务端只负责按请求返回数据及 CORS 响应头；配置正确的 Access-Control-Allow-Origin 即可放行跨域请求。", "kaodian": "AI前端能力-网络与BFF架构-跨域CORS"}, {"no": 4, "type": "judge", "body": "判断：Playwright 每个测试用例应相互独立，拥有自己的测试数据，不依赖其他用例的执行顺序。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "独立用例可并行、可单独重跑，避免顺序依赖导致的偶发失败，是自动化测试的基本要求。", "kaodian": "AI质量保障-自动化测试-Playwright"}, {"no": 5, "type": "judge", "body": "判断：系统吞吐量（TPS）通常会随并发用户数增加而单调递增。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "并发超过系统处理能力后，资源竞争/上下文切换导致 TPS 持平甚至下降，并非单调增。存在拐点与瓶颈。", "kaodian": "AI质量保障-软件测试理论与质量体系-性能测试基础"}, {"no": 6, "type": "judge", "body": "判断：在自动化测试中，用 console.log 打印结果来代替断言（expect）是可接受的验证方式。", "code": "console.log(res.status); // 未做断言", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "断言是自动化测试的核心，console.log 只输出不判断，用例永远通过，无法发现回归。必须用 expect/assert 做显式校验。", "kaodian": "AI质量保障-自动化测试-测试基础"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
