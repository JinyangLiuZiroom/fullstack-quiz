<script type="application/json" id="quizData">{"id": "vol01", "title": "全栈转型模拟自测卷", "sub": "可答题 · 交卷判分 · 自动记录错题", "meta": "对齐公司真实考法：<b>单选 / 多选 / 判断</b>，每题包含完整代码场景，问执行结果、补全代码、判断框架用法正误。<br>本卷共 <b>33 题</b>：单选 20（60 分）+ 多选 7（28 分）+ 判断 6（12 分）= 100 分。<br>难度：<b>实战细节型</b>，考点标签采用公司标准层级命名。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "阅读以下 Java 代码，<code>System.out.println</code> 的输出是？", "code": "String s1 = \"ziroom\";\nString s2 = new String(\"ziroom\");\nString s3 = s2.intern();\nString s4 = \"zi\" + \"room\";\nString pre = \"zi\";\nString s5 = pre + \"room\";\nSystem.out.println((s1 == s2) + \" \" + (s1 == s3) + \" \" + (s1 == s4) + \" \" + (s1 == s5));", "options": [{"k": "A", "t": "true true true true"}, {"k": "B", "t": "false true true false"}, {"k": "C", "t": "false false true false"}, {"k": "D", "t": "false true false false"}], "answer": ["B"], "explain": "考点：String 常量池与编译期常量折叠。<br>① <code>s1</code> 直接指向常量池中的 \"ziroom\"；<code>new String()</code> 一定在堆上再造一个对象，所以 <code>s1 == s2</code> 为 <b>false</b>。<br>② <code>intern()</code> 返回常量池中的那份引用，<code>s1 == s3</code> 为 <b>true</b>。<br>③ <code>\"zi\" + \"room\"</code> 两侧都是字面量，javac 在编译期就折叠成常量 \"ziroom\" 并入池，<code>s1 == s4</code> 为 <b>true</b>（看字节码里根本没有拼接指令）。<br>④ <code>pre</code> 是普通局部变量，<code>pre + \"room\"</code> 会被编译成 <code>StringBuilder.append().toString()</code>，运行期在堆上新建对象，<code>s1 == s5</code> 为 <b>false</b>。若把 <code>pre</code> 声明为 <code>final String</code>，它就成了编译期常量，s5 也会折叠入池，结果变 true。<br>结论：字符串内容比较永远用 <code>equals()</code>，<code>==</code> 只比引用地址。", "android": "类似 Android 里 R.string 常量与运行时 getString() 拼出来的字符串：前者是同一份共享引用，后者每次都是新对象，所以判断相等只能用 equals，用 == 会偶发失效。", "kaodian": "AI 后端能力 - 语言基础层 - String 常量池"}, {"no": 2, "type": "single", "body": "以下代码的输出是？", "code": "Integer a = 127, b = 127;\nInteger c = 128, d = 128;\nLong e = 128L;\nSystem.out.println((a == b) + \" \" + (c == d) + \" \" + c.equals(d) + \" \" + e.equals(128));", "options": [{"k": "A", "t": "true true true true"}, {"k": "B", "t": "true false true true"}, {"k": "C", "t": "true false true false"}, {"k": "D", "t": "false false true false"}], "answer": ["C"], "explain": "考点：包装类自动装箱缓存 + equals 的类型判断。<br>① 自动装箱走 <code>Integer.valueOf()</code>，内部对 <b>-128 ~ 127</b> 使用 IntegerCache 常量池，同一个数值返回同一个对象，所以 <code>a == b</code> 为 true。<br>② 128 超出缓存范围，每次都 <code>new Integer(128)</code>，<code>c == d</code> 为 <b>false</b>（缓存上界可用 <code>-XX:AutoBoxCacheMax</code> 调整，但绝不能依赖）。<br>③ <code>c.equals(d)</code> 比较数值，为 true。<br>④ <code>e.equals(128)</code>：字面量 128 装箱成 <b>Integer</b>，而 <code>Long.equals()</code> 第一步就判断 <code>instanceof Long</code>，类型不同直接返回 <b>false</b>——这是跨类型比较最阴的坑，要写成 <code>e.equals(128L)</code> 或 <code>e.longValue() == 128</code>。<br>规范：包装类型比较值一律用 equals 或 <code>Objects.equals()</code>，DB 主键、订单号这类字段尤其容易踩（id 超过 127 后 == 就失效）。", "android": "和 Android 里比较 Integer 类型的 itemId 一个道理：列表项少的时候 == 一直是对的，数据一多就莫名匹配不上，本质是缓存范围之外变成了不同对象。", "kaodian": "AI 后端能力 - 语言基础层 - 包装类装箱缓存"}, {"no": 3, "type": "single", "body": "以下代码的输出是？", "code": "class Key {\n    int id;\n    Key(int id) { this.id = id; }\n    @Override public int hashCode() { return id; }\n    @Override public boolean equals(Object o) {\n        return (o instanceof Key) && ((Key) o).id == this.id;\n    }\n}\n\nMap<Key, String> map = new HashMap<>();\nKey k = new Key(1);\nmap.put(k, \"room-1\");\nk.id = 2;\nSystem.out.println(map.size() + \" \" + map.get(k) + \" \" + map.get(new Key(1)));", "options": [{"k": "A", "t": "1 room-1 room-1"}, {"k": "B", "t": "1 null null"}, {"k": "C", "t": "1 null room-1"}, {"k": "D", "t": "2 null room-1"}], "answer": ["B"], "explain": "考点：HashMap 对 key 的不可变性要求（hashCode 契约）。<br>put 时按 <code>hash(1)</code> 定位到某个桶并存入 Entry。随后 <code>k.id = 2</code> 改变了对象状态，<b>但 Entry 里缓存的 hash 值不会跟着变</b>。<br>① <code>map.get(k)</code>：现在 k 的 hashCode 是 2，去 hash=2 对应的桶里找，那个桶是空的 → <b>null</b>。<br>② <code>map.get(new Key(1))</code>：定位到 hash=1 的桶（找对了桶），但桶里那个 Key 对象的 id 已经是 2，<code>equals</code> 比较 1 vs 2 不相等 → 也是 <b>null</b>。<br>③ size 仍然是 1，这条数据变成了<b>永远取不出来、也删不掉的内存垃圾</b>。<br>规范：HashMap/HashSet 的 key 必须是不可变对象（String、Integer，或所有参与 hashCode/equals 的字段都是 final 的值对象）；如果确实要用可变对象，就只能在修改前先 remove、修改后再 put。", "android": "类似 Android 里把可变的 Bean 直接塞进 HashMap 或 DiffUtil 的 key：对象字段被别处改掉后，缓存查不中、列表 item 复用错乱，排查时完全看不出是谁改的。", "kaodian": "AI 后端能力 - 语言基础层 - HashMap 与 hashCode 契约"}, {"no": 4, "type": "single", "body": "以下代码的输出是？", "code": "TreeMap<String, Integer> m = new TreeMap<>(String.CASE_INSENSITIVE_ORDER);\nm.put(\"Ziroom\", 1);\nm.put(\"ZIROOM\", 2);\nm.put(\"zi\", 3);\nSystem.out.println(m.size() + \" \" + m.get(\"ziroom\") + \" \" + m.firstKey() + \" \" + m.containsKey(\"ZiRoom\"));", "options": [{"k": "A", "t": "3 1 ZIROOM false"}, {"k": "B", "t": "2 1 Ziroom true"}, {"k": "C", "t": "2 2 zi true"}, {"k": "D", "t": "3 2 zi false"}], "answer": ["C"], "explain": "考点：TreeMap 的相等性由 Comparator 决定，而不是 equals/hashCode。<br>① TreeMap 判定两个 key 是否为「同一个 key」的唯一标准是 <code>comparator.compare(a, b) == 0</code>。在 <code>CASE_INSENSITIVE_ORDER</code> 下 \"Ziroom\" 与 \"ZIROOM\" 相等，第二次 put 只<b>覆盖 value、不替换原 key</b>，所以 size = <b>2</b>，取值得到 <b>2</b>，而 map 中保留的 key 仍是最早的 \"Ziroom\"。<br>② <code>firstKey()</code> 按忽略大小写的字典序：\"zi\" 是 \"ziroom\" 的前缀且更短，排在前面 → <b>zi</b>。<br>③ <code>containsKey(\"ZiRoom\")</code> 同样走 comparator，忽略大小写命中 → <b>true</b>。<br>这也是 TreeSet 用自定义比较器时「元素莫名被去重」的根因：比较器返回 0 就被当成重复。写比较器必须保证与 equals 语义一致（自反、传递、且 compare==0 ⇔ 业务上真的相等）。", "android": "就像 Android 里给 SortedList 传了个只比较 name 的 Comparator，结果两个 id 不同但同名的条目被当成同一条互相覆盖——去重规则被比较器悄悄接管了。", "kaodian": "AI 后端能力 - 语言基础层 - TreeMap 比较器语义"}, {"no": 5, "type": "single", "body": "以下代码的输出是？", "code": "CopyOnWriteArrayList<String> list = new CopyOnWriteArrayList<>();\nlist.add(\"a\");\nlist.add(\"b\");\n\nIterator<String> it = list.iterator();\nlist.add(\"c\");\nlist.remove(\"a\");\n\nStringBuilder sb = new StringBuilder();\nwhile (it.hasNext()) sb.append(it.next());\nSystem.out.println(sb + \" \" + list);", "options": [{"k": "A", "t": "ab [b, c]"}, {"k": "B", "t": "abc [b, c]"}, {"k": "C", "t": "bc [b, c]"}, {"k": "D", "t": "遍历时抛出 ConcurrentModificationException"}], "answer": ["A"], "explain": "考点：CopyOnWriteArrayList 的快照迭代器（弱一致性）。<br>COW 的每次写操作（add/remove/set）都会<b>加 ReentrantLock、复制一份新数组、修改后再把引用整体替换</b>；读操作完全无锁。<code>iterator()</code> 拿到的是调用那一瞬间旧数组的<b>快照引用</b>，之后所有写操作对它都不可见，所以遍历结果仍是 <b>ab</b>，而 list 本身已经变成 <b>[b, c]</b>。<br>正因为遍历的是不会变的快照，COW <b>不会 fail-fast 抛 CME</b>（这正是它相对 ArrayList 的核心价值）。<br>两个必须记住的细节：① 快照迭代器的 <code>it.remove()</code> 会抛 <code>UnsupportedOperationException</code>；② 它只保证最终一致性，读不到最新写入。<br>适用场景：读多写极少且集合不大——监听器列表、白名单、本地配置。写频繁时每次全量复制的 CPU 与内存开销会直接打崩服务。", "android": "对应 Android 里遍历监听器列表时对方 unregister 导致的并发修改崩溃：COW 用「读快照 + 写复制」把这个崩溃消灭掉，代价是回调看到的是稍旧的列表。", "kaodian": "AI 后端能力 - 语言基础层 - CopyOnWriteArrayList"}, {"no": 6, "type": "single", "body": "以下代码的执行结果是？", "code": "Queue<Integer> q = new ArrayDeque<>();\nSystem.out.println(q.poll());\nSystem.out.println(q.peek());\n\nq.offer(1);\nq.offer(2);\nq.remove();\nSystem.out.println(q.element());\n\nq.clear();\nq.remove();", "options": [{"k": "A", "t": "依次打印 null、null、2，随后抛出 NoSuchElementException"}, {"k": "B", "t": "依次打印 null、null、1，随后抛出 NullPointerException"}, {"k": "C", "t": "依次打印 null、null、2，随后再打印一个 null"}, {"k": "D", "t": "第 2 行就抛出 NoSuchElementException"}], "answer": ["A"], "explain": "考点：Queue 接口的两套 API 语义。每类操作都有「抛异常版」和「返回特殊值版」，必须成对记忆：<br>· 插入：<code>add()</code> 失败抛 IllegalStateException / <code>offer()</code> 返回 false<br>· 移除队头：<code>remove()</code> 空队列抛 <b>NoSuchElementException</b> / <code>poll()</code> 返回 null<br>· 查看队头：<code>element()</code> 空队列抛 <b>NoSuchElementException</b> / <code>peek()</code> 返回 null<br>所以：空队列 poll、peek 各打印一个 null；offer 1、2 后 <code>remove()</code> 弹出队头 1，<code>element()</code> 看到 2；clear 之后 <code>remove()</code> 抛 NoSuchElementException。<br>补充：<code>ArrayDeque</code> <b>不允许存入 null</b>（会 NPE），正因为 null 被用作「队列为空」的信号；<code>LinkedList</code> 允许 null，因此用它当队列时 poll 返回 null 是有歧义的。生产上做消费循环请用 <code>while ((e = q.poll()) != null)</code> 而不是 remove。", "android": "类似 Android 里 Handler 的 MessageQueue 取消息：拿不到消息应当返回空并等待，而不是直接抛异常炸掉主线程——选 poll 还是 remove，就是选「返回空」还是「抛异常」两种错误处理风格。", "kaodian": "AI 后端能力 - 语言基础层 - Queue 接口方法族"}, {"no": 7, "type": "single", "body": "以下代码的执行结果是？", "code": "List<Integer> list = new ArrayList<>();\nlist.add(1);\n\nMethod add = list.getClass().getMethod(\"add\", Object.class);\nadd.invoke(list, \"ziroom\");\n\nSystem.out.println(list.size() + \" \" + list.toString());\n\nInteger n = list.get(1);\nSystem.out.println(n);", "options": [{"k": "A", "t": "编译期就报错：不能向 List<Integer> 中添加 String"}, {"k": "B", "t": "先打印 2 [1, ziroom]，再抛出 ClassCastException"}, {"k": "C", "t": "先打印 2 [1, ziroom]，再打印 ziroom"}, {"k": "D", "t": "执行 add.invoke 这一行时抛出 IllegalArgumentException"}], "answer": ["B"], "explain": "考点：泛型擦除（Type Erasure）。<br>① Java 泛型只是<b>编译期</b>的语法糖，编译后 <code>List&lt;Integer&gt;</code> 的字节码里只剩裸 <code>List</code>，<code>add</code> 的真实签名就是 <code>add(Object)</code>。通过反射直接拿到 <code>add(Object)</code> 调用，<b>运行期没有任何类型校验</b>，String 就被塞进去了——这就是「泛型污染」。<br>② 打印时调用的是 <code>toString()</code>，不涉及转型，所以能正常输出 <code>2 [1, ziroom]</code>。<br>③ 真正的爆点在 <code>Integer n = list.get(1)</code>：编译器在这里插入了 <code>checkcast Integer</code> 指令，运行到此才抛 <b>ClassCastException</b>。<br>关键教训：<b>报错点离污染点往往很远</b>（污染可能发生在几层调用之外的反射/序列化/Map 强转里），排查这类 CCE 要往上游找是谁往集合里放了脏数据。相关衍生：<code>new ArrayList&lt;String&gt;().getClass() == new ArrayList&lt;Integer&gt;().getClass()</code> 结果为 true。", "android": "和 Android 里从 Bundle / JSON 反序列化拿到 List 再强转元素类型一样：塞进去的时候一声不吭，等到某个 item 被真正使用时才崩，堆栈里完全看不到是谁塞错的。", "kaodian": "AI 后端能力 - 语言基础层 - 泛型擦除与反射"}, {"no": 8, "type": "single", "body": "以下代码的输出是？", "code": "public class T {\n    static int calc() {\n        int x = 1;\n        try {\n            return x;\n        } finally {\n            x = 2;\n        }\n    }\n\n    static int calc2() {\n        try {\n            return 1;\n        } finally {\n            return 2;\n        }\n    }\n\n    public static void main(String[] args) {\n        System.out.println(calc() + \" \" + calc2());\n    }\n}", "options": [{"k": "A", "t": "1 1"}, {"k": "B", "t": "1 2"}, {"k": "C", "t": "2 2"}, {"k": "D", "t": "2 1"}], "answer": ["B"], "explain": "考点：try-finally 与返回值暂存机制。<br>① <code>calc()</code>：执行 <code>return x</code> 时，JVM 先把 x 的当前值 1 <b>复制暂存</b>到操作数栈（字节码里是 istore 到一个临时槽），再去执行 finally。finally 里对局部变量 x 的重新赋值改的是 x 这个变量，<b>改不到已经暂存的返回值</b> → 返回 <b>1</b>。<br>② <code>calc2()</code>：finally 里自己有 <code>return</code>，会<b>直接覆盖并丢弃</b> try 中的返回结果 → 返回 <b>2</b>。<br>易错延伸：如果返回的是<b>对象引用</b>，暂存的是引用值，finally 里修改该对象的字段是<b>会生效</b>的（例如 <code>return user;</code> 后在 finally 里 <code>user.setName(...)</code>）。<br>阿里规约红线：<b>finally 块中禁止出现 return / break / continue</b>，因为它会吞掉 try 中抛出的异常（异常直接消失，日志里什么都看不到），是最难排查的一类 bug。", "android": "类似 Android 里在 finally 中直接 return 关闭 loading 并吞掉网络异常：界面看着正常结束，异常却凭空消失，线上只能看到「数据为空」而没有任何错误上报。", "kaodian": "AI 后端能力 - 语言基础层 - 异常与 finally 返回值"}, {"no": 9, "type": "single", "body": "以下代码的执行结果是？", "code": "public enum OrderState {\n    CREATED, PAID, CANCELED\n}\n\npublic class T {\n    public static void main(String[] args) {\n        OrderState s = OrderState.PAID;\n        System.out.println(s.ordinal() + \" \" + s.name().toLowerCase()\n                + \" \" + (s == OrderState.valueOf(\"PAID\")));\n        System.out.println(OrderState.valueOf(\"paid\"));\n    }\n}", "options": [{"k": "A", "t": "打印 1 paid true，然后打印 PAID"}, {"k": "B", "t": "打印 1 paid true，然后抛出 IllegalArgumentException"}, {"k": "C", "t": "打印 1 paid false，然后抛出 NullPointerException"}, {"k": "D", "t": "打印 0 paid true，然后抛出 NoSuchFieldException"}], "answer": ["B"], "explain": "考点：枚举的 ordinal / valueOf 语义。<br>① <code>ordinal()</code> 是声明顺序下标，从 0 开始，PAID 是第二个 → <b>1</b>。<br>② 枚举常量由 JVM 保证<b>全局唯一实例</b>，<code>valueOf(\"PAID\")</code> 返回的就是同一个对象，<code>==</code> 为 <b>true</b>（枚举比较推荐用 ==：天然防 NPE、编译期就能检查类型写错）。<br>③ <code>valueOf(String)</code> <b>严格区分大小写、不容忍空格</b>，找不到时抛 <b>IllegalArgumentException: No enum constant</b>，而不是返回 null。<br>实战规范：<br>· 从 HTTP 参数、MQ 报文、Excel 导入转枚举，必须写带兜底的 <code>fromCode()</code>（try-catch 或先 toUpperCase().trim()），否则一个脏数据就打爆接口；<br>· <b>绝不要用 ordinal() 落库或参与协议</b>，一旦有人在枚举中间插入新值，历史数据全部错位，应显式定义 code 字段并用它持久化。", "android": "对应 Android 里把服务端下发的字符串状态直接 valueOf 成枚举：后端新加一个状态值或大小写不一致，客户端立刻崩溃，稳妥做法永远是带 default 的映射函数。", "kaodian": "AI 后端能力 - 语言基础层 - 枚举与 valueOf"}, {"no": 10, "type": "single", "body": "以下代码的执行结果是？", "code": "class Base {\n    public void run() {}\n    private void hide() {}\n}\nclass Sub extends Base {}\n\npublic class T {\n    public static void main(String[] args) throws Exception {\n        Class<Sub> c = Sub.class;\n        System.out.println(c.getMethod(\"run\").getDeclaringClass().getSimpleName());\n        System.out.println(c.getDeclaredMethods().length);\n        System.out.println(c.getDeclaredMethod(\"run\"));\n    }\n}", "options": [{"k": "A", "t": "打印 Base、0，然后抛出 NoSuchMethodException"}, {"k": "B", "t": "打印 Sub、1，然后打印 public void Base.run()"}, {"k": "C", "t": "打印 Base、1，然后抛出 IllegalAccessException"}, {"k": "D", "t": "打印 Sub、0，然后打印 null"}], "answer": ["A"], "explain": "考点：反射 API 中 getXxx 与 getDeclaredXxx 的边界。<br>· <code>getMethod(name, ...)</code>：查找范围是<b>本类 + 所有父类 / 接口中的 public 方法</b>，能拿到继承来的 <code>run()</code>；它的 <code>getDeclaringClass()</code> 是真正声明它的 <b>Base</b>。<br>· <code>getDeclaredMethods()</code>：只返回<b>本类自己声明的全部方法</b>（含 private / protected，但<b>不含继承</b>）。<code>Sub</code> 里一个方法都没写（编译器只会生成默认构造器，构造器不算 method）→ 长度 <b>0</b>。<br>· <code>getDeclaredMethod(\"run\")</code> 在 Sub 中找不到声明 → 抛 <b>NoSuchMethodException</b>（编译期就要求捕获，属于受检异常）。<br>实战：要访问父类的私有方法 <code>hide()</code>，必须用 <code>Base.class.getDeclaredMethod(\"hide\")</code> 再 <code>setAccessible(true)</code>，或者顺着 <code>getSuperclass()</code> 逐层向上找——这正是 Spring 的 ReflectionUtils、各类 BeanUtils 都要写「循环向上遍历父类」的原因。反射调用还会绕过编译期检查且有性能损耗，热点路径要缓存 Method 对象。", "android": "和 Android 里反射 hook 系统类的私有字段一个套路：在子类上直接 getDeclaredField 往往找不到，必须先定位到真正声明它的那一层父类再 setAccessible。", "kaodian": "AI 后端能力 - 语言基础层 - 反射 API 语义"}, {"no": 11, "type": "single", "body": "以下代码运行后会发生什么？", "code": "ExecutorService pool = Executors.newFixedThreadPool(2);\nCountDownLatch latch = new CountDownLatch(3);\n\nfor (int i = 0; i < 3; i++) {\n    int id = i;\n    pool.execute(() -> {\n        if (id == 1) throw new RuntimeException(\"boom\");\n        System.out.println(\"task-\" + id + \" ok\");\n        latch.countDown();\n    });\n}\n\nlatch.await();\nSystem.out.println(\"all done\");\npool.shutdown();", "options": [{"k": "A", "t": "正常打印两条 task ok 与 all done，异常被线程池自动忽略"}, {"k": "B", "t": "主线程立即抛出 RuntimeException: boom"}, {"k": "C", "t": "主线程在 latch.await() 处永久阻塞，不会打印 all done"}, {"k": "D", "t": "线程池会自动重试失败的任务，最终打印 all done"}], "answer": ["C"], "explain": "考点：CountDownLatch 的计数必须放在 finally + 线程池异常吞噬。<br>① task-1 抛异常后，后面的 <code>latch.countDown()</code> 被跳过，计数器永远停在 <b>1</b>，<code>await()</code> 无限期阻塞——线上表现就是「接口偶发 hang 死 / 线程池线程被耗尽」，最难定位的一类故障。<br>② <code>execute()</code> 提交的任务抛出的异常<b>不会传播到主线程</b>，只会由线程的 UncaughtExceptionHandler 打印堆栈；若换成 <code>submit()</code>，异常会被包进 Future，不调用 <code>get()</code> 就<b>彻底静默</b>，连堆栈都看不到。<br>③ B 错：主线程和任务线程是两个独立的调用栈，异常不会跨线程抛。D 错：JDK 线程池没有任何自动重试机制。<br>正确写法：<pre>try { ... } finally { latch.countDown(); }</pre>并且一律使用带超时的 <code>latch.await(3, TimeUnit.SECONDS)</code>，返回 false 时走降级/告警，绝不裸调无参 await。", "android": "就像 Android 里并发发起 3 个接口用计数器聚合结果，某个请求走 onFailure 时忘了减计数，loading 弹窗就永远转圈——计数递减必须写在 finally 里。", "kaodian": "AI 后端能力 - 语言基础层 - CountDownLatch"}, {"no": 12, "type": "single", "body": "以下代码的输出是？", "code": "AtomicInteger n = new AtomicInteger(5);\nint a = n.getAndIncrement();\nint b = n.incrementAndGet();\nboolean ok = n.compareAndSet(6, 10);\nn.getAndAdd(3);\nSystem.out.println(a + \" \" + b + \" \" + ok + \" \" + n.get());", "options": [{"k": "A", "t": "6 7 true 13"}, {"k": "B", "t": "6 8 false 10"}, {"k": "C", "t": "5 6 true 13"}, {"k": "D", "t": "5 7 false 10"}], "answer": ["D"], "explain": "考点：原子类 API 的返回值语义与 CAS。<br>① <code>getAndIncrement()</code> 是「<b>先取后加</b>」，返回<b>旧值 5</b>，此时 n = 6；<code>incrementAndGet()</code> 是「先加后取」，返回<b>新值 7</b>，n = 7。<b>getAndXxx 返回旧值、XxxAndGet 返回新值</b>，这是最高频的取值错误（生成序号、扣库存时直接导致差 1）。<br>② <code>compareAndSet(6, 10)</code> 是 CAS：只有当前值 <b>等于</b> 期望值时才更新。此刻实际值是 7 而期望是 6 → 返回 <b>false</b> 且不修改。<br>③ <code>getAndAdd(3)</code> 把 7 变成 <b>10</b>。<br>底层：CAS 依赖 Unsafe 的 <code>compareAndSwapInt</code>（对应 CPU 的 lock cmpxchg 指令），无锁但在<b>高竞争下会自旋空转烧 CPU</b>，此时更适合 LongAdder 的分段累加。另外 CAS 存在 <b>ABA 问题</b>——值被改成 B 又改回 A 时无法察觉，需要 <code>AtomicStampedReference</code> 加版本号解决。", "android": "类似 Android 里用原子计数器做请求序号：把 getAndIncrement 和 incrementAndGet 用反，就会出现两个请求拿到同一个序号或首个序号被跳过。", "kaodian": "AI 后端能力 - 语言基础层 - 原子类与 CAS"}, {"no": 13, "type": "single", "body": "以下代码的输出是？", "code": "class Parent {\n    static { System.out.print(\"A\"); }\n    { System.out.print(\"B\"); }\n    Parent() { System.out.print(\"C\"); }\n}\n\nclass Child extends Parent {\n    static { System.out.print(\"D\"); }\n    { System.out.print(\"E\"); }\n    Child() { System.out.print(\"F\"); }\n}\n\npublic class T {\n    public static void main(String[] args) {\n        new Child();\n        new Child();\n    }\n}", "options": [{"k": "A", "t": "ADBCEFBCEF"}, {"k": "B", "t": "ABCDEFBCEF"}, {"k": "C", "t": "ADBCEFADBCEF"}, {"k": "D", "t": "ABCEFDBCEF"}], "answer": ["A"], "explain": "考点：类初始化与实例初始化的执行顺序。<br>固定顺序为：<b>父类静态块/静态字段 → 子类静态块/静态字段 → 父类实例代码块 → 父类构造器 → 子类实例代码块 → 子类构造器</b>。<br>· 第一次 <code>new Child()</code>：触发类初始化（&lt;clinit&gt;，JVM 加锁保证<b>只执行一次</b>）打印 <b>A D</b>，再执行实例初始化（&lt;init&gt;）打印 <b>B C E F</b>。<br>· 第二次 <code>new Child()</code>：类已初始化，静态块不再执行，只打印 <b>B C E F</b>。<br>合起来是 <code>ADBCEFBCEF</code>。<br>字节码细节：实例代码块 <code>{ }</code> 会被编译器<b>插入到每个构造器中 super() 调用之后、构造器原有语句之前</b>，所以它一定晚于父类构造器、早于子类构造器体。<br>由此引出一条硬规范：<b>构造器里不要调用可被子类重写的方法</b>——此时子类的字段还没初始化，拿到的全是 null/0，Spring 里对应的坑就是不要在构造器中使用尚未注入完成的依赖（该用 @PostConstruct）。", "android": "对应 Android 里在 Activity 构造器或父类 init 中调用被子类重写的方法：子类的成员变量还没赋值，直接拿到 null 崩溃，所以初始化逻辑要放到 onCreate 而不是构造器。", "kaodian": "AI 后端能力 - 语言基础层 - 类初始化顺序"}, {"no": 14, "type": "single", "body": "订单页需要展示金额，以下 JS 代码在浏览器控制台依次输出什么？", "code": "console.log(0.1 + 0.2);\nconsole.log((0.1 + 0.2).toFixed(2) === '0.30');\nconsole.log(1.005.toFixed(2));\nconsole.log(Number('') === 0, Number(null) === 0, Number(undefined));", "options": [{"k": "A", "t": "0.3 / true / '1.01' / true true 0"}, {"k": "B", "t": "0.3 / false / '1.00' / true true NaN"}, {"k": "C", "t": "0.30000000000000004 / false / '1.01' / false false NaN"}, {"k": "D", "t": "0.30000000000000004 / true / '1.00' / true true NaN"}], "answer": ["D"], "explain": "考点：IEEE 754 双精度浮点与数值转换规则。<br>① JS 只有一种数字类型（双精度浮点），0.1 和 0.2 都无法用二进制精确表示，相加得 <b>0.30000000000000004</b>。<br>② <code>toFixed(2)</code> 做四舍五入并返回<b>字符串</b>，得到 <code>'0.30'</code>，与 <code>'0.30'</code> 全等 → <b>true</b>。<br>③ <code>1.005</code> 在内存里实际是 <code>1.00499999999999989...</code>，所以 <code>toFixed(2)</code> 得到 <b>'1.00'</b> 而不是直觉的 '1.01'——财务对账差一分钱的经典来源。<br>④ <code>Number('')</code> 和 <code>Number(null)</code> 都转成 <b>0</b>，而 <code>Number(undefined)</code> 是 <b>NaN</b>；这就是表单未填写时空串被当成 0 提交的坑。<br>工程规范：<b>金额只在展示层用 toFixed 格式化</b>，参与计算一律转成「整数分」或使用 decimal.js / big.js；后端对应用 <code>BigDecimal</code>（且必须用字符串构造器），数据库用 DECIMAL 而非 DOUBLE。判等要用 <code>Math.abs(a - b) &lt; Number.EPSILON</code>。", "android": "和 Android 里用 float/double 算价格再 String.format 展示一样：单看没问题，累加多笔后就会出现 0.01 的对账差，正解同样是用整数分或 BigDecimal。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 数字精度"}, {"no": 15, "type": "single", "body": "以下 HTML/CSS 中，两个 div 的「内容区宽度 / 边框盒宽度」分别是多少？", "code": "<div class=\"box\"></div>\n<div class=\"box border\"></div>\n\n.box {\n  width: 300px;\n  padding: 20px;\n  border: 5px solid #ddd;\n  margin: 10px;\n}\n.box.border {\n  box-sizing: border-box;\n}", "options": [{"k": "A", "t": "300px / 350px 和 250px / 300px"}, {"k": "B", "t": "300px / 300px 和 300px / 350px"}, {"k": "C", "t": "260px / 300px 和 300px / 350px"}, {"k": "D", "t": "300px / 370px 和 250px / 320px"}], "answer": ["A"], "explain": "考点：标准盒模型 content-box 与怪异盒模型 border-box。<br>① 默认 <code>box-sizing: content-box</code>：<code>width</code> 只描述<b>内容区</b>，padding 和 border 都向外叠加。内容区 = <b>300px</b>，边框盒 = 300 + 20×2 + 5×2 = <b>350px</b>。<br>② 设置 <code>box-sizing: border-box</code> 后，<code>width</code> 表示<b>边框盒总宽</b>，浏览器反向压缩内容区：边框盒 = <b>300px</b>，内容区 = 300 − 40 − 10 = <b>250px</b>。<br>③ <b>margin 不属于盒子本身的宽度</b>，它只影响元素与外部的间距（选项 D 把 margin 算进去了，是典型误区）。<br>这正是响应式布局中「给容器写 <code>width: 100%</code> 再加 padding 就撑破父级出现横向滚动条」的根因，工程上标准做法是全局重置：<pre>*, *::before, *::after { box-sizing: border-box; }</pre>另外 <code>box-sizing</code> 不影响 <code>outline</code> 和 <code>box-shadow</code>，它们始终不占布局空间。", "android": "对应 Android 里 View 的 padding 是「内缩」而 margin 是「外推」：Web 默认的 content-box 相当于 padding 会把 View 撑大，加上 border-box 才是 Android 里 layout_width 固定后 padding 向内挤的直觉行为。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 盒模型"}, {"no": 16, "type": "single", "body": "以下代码渲染后，<code>li</code> 中「自如」两个字最终显示的颜色是？", "code": "<div id=\"app\">\n  <ul class=\"list\">\n    <li class=\"active on\" style=\"color: purple\">自如</li>\n  </ul>\n</div>\n\n#app .list li.active { color: red; }\n.list li.active.on   { color: blue !important; }\nli[class~=\"active\"]  { color: green; }", "options": [{"k": "A", "t": "red，因为选择器中含 ID，特异性最高"}, {"k": "B", "t": "green，属性选择器最后声明，后来者居上"}, {"k": "C", "t": "purple，行内样式的优先级永远最高"}, {"k": "D", "t": "blue，带 !important 的作者样式优先级高于普通行内样式"}], "answer": ["D"], "explain": "考点：CSS 层叠（Cascade）的比较顺序。<br>浏览器决定最终样式的顺序是：<b>① 重要性与来源 → ② 特异性（Specificity） → ③ 源码书写顺序</b>，前一级能分出胜负就不看后面。<br>· 第一级：带 <code>!important</code> 的<b>作者样式</b>排在「普通行内样式」之上（层叠顺序为：作者 !important &gt; 行内 &gt; 作者普通 &gt; 用户代理），所以 <b>blue</b> 直接胜出。<br>· 假如去掉 <code>!important</code>：行内 <code>style</code> 的 purple 会赢。<br>· 假如既没有 !important 也没有行内样式，才比特异性：<code>#app .list li.active</code> 是 <b>(1,2,1)</b>，<code>.list li.active.on</code> 是 <b>(0,3,1)</b>，<code>li[class~=\"active\"]</code> 是 <b>(0,1,1)</b>；特异性<b>逐位比较且不进位</b>——256 个 class 也压不过一个 ID → red。<br>工程规范：禁止在业务样式里滥用 <code>!important</code>（它会让后续覆盖只能用更多 !important，形成权重军备竞赛），改用 BEM 命名、CSS Modules 或 scoped 样式来控制作用域。", "android": "类似 Android 里主题、style、xml 属性、代码 setTextColor 的覆盖链：越靠近具体 View 的设置越优先，而 !important 相当于强行加了一道「谁也别想覆盖我」的锁。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 选择器优先级"}, {"no": 17, "type": "single", "body": "以下工具函数在业务中被用来判断「用户是否未填写」，其输出是？", "code": "function isEmpty(v) {\n  return !v;\n}\n\nconsole.log(isEmpty(0), isEmpty(''), isEmpty([]), isEmpty('0'), isEmpty(NaN));", "options": [{"k": "A", "t": "true true true true true"}, {"k": "B", "t": "true true false true false"}, {"k": "C", "t": "false true false false true"}, {"k": "D", "t": "true true false false true"}], "answer": ["D"], "explain": "考点：JS 的假值（falsy）集合。<br>JS 中只有 <b>8 个</b>假值：<code>false</code>、<code>0</code>、<code>-0</code>、<code>0n</code>、<code>''</code>、<code>null</code>、<code>undefined</code>、<code>NaN</code>。除此之外<b>全是真值</b>。<br>· <code>0</code> → true（假值）；<code>''</code> → true（假值）；<code>NaN</code> → true（假值）。<br>· <code>[]</code> 和 <code>{}</code> 是<b>对象</b>，即使为空也是真值 → <code>!v</code> 得 <b>false</b>。<br>· <code>'0'</code> 是非空字符串 → 真值 → <b>false</b>。<br>这个 <code>isEmpty</code> 在业务里非常危险：<b>数量为 0、金额为 0、楼层为 0 会被误判成「没填」</b>，直接引发提交校验失败或默认值覆盖。<br>正确写法要区分意图：<br>· 判断未传值：<code>v === undefined || v === null</code>（可简写 <code>v == null</code>，这是唯一推荐使用 == 的场景）；<br>· 判断空字符串：<code>typeof v === 'string' && v.trim() === ''</code>；<br>· 判断空数组：<code>Array.isArray(v) && v.length === 0</code>；<br>· 判断空对象：<code>Object.keys(v).length === 0</code>。", "android": "和 Android 里用 TextUtils.isEmpty 判断数字输入框一样：把「输入了 0」和「什么都没输」混为一谈，业务上这是两种完全不同的语义。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 假值判断"}, {"no": 18, "type": "single", "body": "以下 JS 代码依次输出什么？", "code": "console.log(1 + '2' - 3);\nconsole.log('5' * '2' + true);\nconsole.log([] + []);\nconsole.log(typeof ('a' * 1));", "options": [{"k": "A", "t": "0 / 11 / 空数组 / 'object'"}, {"k": "B", "t": "'123' / '10true' / '[object Object]' / 'NaN'"}, {"k": "C", "t": "9 / 11 / 空字符串 / 'number'"}, {"k": "D", "t": "9 / '10true' / 空字符串 / 'number'"}], "answer": ["C"], "explain": "考点：运算符的隐式类型转换规则。<br>① <code>+</code> 是唯一的重载运算符：只要有一个操作数是字符串就做<b>拼接</b>，<code>1 + '2'</code> → <code>'12'</code>；而 <code>-</code> <code>*</code> <code>/</code> <code>%</code> <b>只能做数值运算</b>，会把两边强制 ToNumber，<code>'12' - 3</code> → <b>9</b>。<br>② <code>'5' * '2'</code> → 10；<code>true</code> 参与数值运算转成 1 → <b>11</b>（注意这里两边都不是字符串，所以 + 走的是数值加法）。<br>③ 数组做加法时先 <code>ToPrimitive</code>：<code>[].toString()</code> 得空串，所以 <code>[] + []</code> 是<b>空字符串</b>（对照：<code>[] + {}</code> 是 <code>'[object Object]'</code>）。<br>④ <code>'a' * 1</code> 得 <b>NaN</b>，但 <code>typeof NaN</code> 仍是 <b>'number'</b>——NaN 是一个特殊的数值。判断 NaN 必须用 <code>Number.isNaN()</code>，因为 <code>NaN !== NaN</code>（这也是 <code>[NaN].indexOf(NaN)</code> 返回 -1、而 <code>includes(NaN)</code> 返回 true 的原因）。<br>规范：接口返回的数字字段一律显式 <code>Number()</code> / <code>parseInt(v, 10)</code> 转换后再运算，别指望隐式转换。", "android": "类似 Android 里字符串与数字拼接：Java 是强类型，编译器直接拦住你；JS 会「热心地」帮你转换，于是 bug 从编译期推迟到了线上。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 运算符与隐式转换"}, {"no": 19, "type": "single", "body": "针对下面的方法，测试同学已设计了 2 条用例，关于覆盖情况的说法<b>正确</b>的是？", "code": "public String level(int score, boolean vip) {\n    if (score > 80 && vip) {\n        return \"A\";\n    }\n    return \"B\";\n}\n\n// 已设计用例\n// TC1: level(90, true)  期望 \"A\"\n// TC2: level(70, false) 期望 \"B\"", "options": [{"k": "A", "t": "判定覆盖已达 100%，但条件覆盖未达标"}, {"k": "B", "t": "只达到语句覆盖 100%，判定覆盖未达标"}, {"k": "C", "t": "语句覆盖、判定覆盖、条件覆盖均已达 100%，但条件组合覆盖未达 100%"}, {"k": "D", "t": "语句、判定、条件、条件组合四种覆盖全部达到 100%"}], "answer": ["C"], "explain": "考点：白盒测试的逻辑覆盖强度。<br>· <b>语句覆盖</b>：两条 return 都被执行过 → 100%。<br>· <b>判定覆盖（分支覆盖）</b>：整个 if 判定取真（TC1）与取假（TC2）都出现 → 100%。<br>· <b>条件覆盖</b>：两个原子条件各自的真假都出现过（score&gt;80 取到 T/F，vip 取到 T/F）→ 100%。<br>· <b>条件组合覆盖</b>：要求 (T,T)(T,F)(F,T)(F,F) 四种组合全覆盖，现在只有 (T,T) 和 (F,F) → <b>50%</b>，故选 C。<br>强度排序大致为：语句 &lt; 判定 &lt; 条件 &lt; 判定/条件 &lt; 条件组合 &lt; 路径。<br>两个必须记住的反直觉点：① <b>条件覆盖 100% 不代表判定覆盖 100%</b>——若换成 (90,false) 和 (70,true)，每个条件的真假仍都覆盖了，但判定结果全是假，判定覆盖只有 50%；② <code>&&</code> 有<b>短路</b>特性，TC2 里 <code>vip</code> 根本没被求值，普通行覆盖率工具看不出来，需要 MC/DC（修正条件判定覆盖）才能真正衡量。这里还漏了<b>边界值 score = 80 / 81</b> 的用例。", "android": "相当于 Android 里跑完 UI 测试看 JaCoCo 报告显示行覆盖 100%，但 if(a && b) 的四种组合其实只测了两种——覆盖率数字漂亮不等于分支真的被测到。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 白盒逻辑覆盖"}, {"no": 20, "type": "single", "body": "订单状态机代码如下，按<b>状态迁移法</b>补充负向用例时，下列哪一条属于必须覆盖的「非法迁移」（预期返回 false）？", "code": "private static final Map<String, Set<String>> ALLOW = Map.of(\n    \"CREATED\",   Set.of(\"PAID\", \"CANCELED\"),\n    \"PAID\",      Set.of(\"REFUNDING\", \"COMPLETED\"),\n    \"REFUNDING\", Set.of(\"REFUNDED\"),\n    \"COMPLETED\", Set.of()\n);\n\npublic boolean change(String from, String to) {\n    return ALLOW.getOrDefault(from, Set.of()).contains(to);\n}", "options": [{"k": "A", "t": "change(\"CREATED\", \"PAID\")"}, {"k": "B", "t": "change(\"REFUNDING\", \"REFUNDED\")"}, {"k": "C", "t": "change(\"PAID\", \"COMPLETED\")"}, {"k": "D", "t": "change(\"PAID\", \"CANCELED\")"}], "answer": ["D"], "explain": "考点：状态迁移法（状态图法）的用例设计。<br>A、B、C 都在 <code>ALLOW</code> 表中，是合法迁移，属于<b>正向用例</b>（断言 true）；只有 D 的 <b>PAID → CANCELED</b> 不在 PAID 的允许集合里，是典型的<b>非法迁移</b>，必须设计负向用例断言返回 false 并给出明确错误码——已支付订单只能走退款流程，如果被直接取消，就是资金与库存双错的重大事故。<br>状态迁移法的标准步骤：<br>① 画状态迁移图，识别所有状态与事件；<br>② 列<b>状态-事件矩阵</b>（行为状态、列为事件），矩阵中的每个空格都是潜在的非法迁移；<br>③ 正向覆盖每一条合法边（保证每个状态可达、每条边至少走一次）；<br>④ 负向抽取高风险非法边，重点是涉及<b>资金、库存、权限</b>的组合（已支付后被取消、已退款再退款）；<br>⑤ 补充<b>终态自环</b>用例（COMPLETED 收到任何事件都应拒绝）和<b>并发重复提交</b>场景（同一订单并发两次支付回调，需配合幂等设计）。", "android": "类似 Android 里页面/播放器的状态机测试：不仅要测 prepare→start→pause 的正常路径，更要测 stop 之后再 start 这类非法调用是否被安全拦截而不是直接崩溃。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 状态迁移法用例设计"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "阅读以下代码，关于其行为与字符串 API 的说法，<b>正确</b>的有哪些？（多选、少选、错选均不得分）", "code": "String a = \"zi\";\na.concat(\"room\");\n\nStringBuilder sb = new StringBuilder(\"zi\");\nsb.append(\"room\");\nString b = sb.toString();\nString c = \"ziroom\";\n\nSystem.out.println(a);          // 第 8 行\nSystem.out.println(b == c);     // 第 9 行\nSystem.out.println(b.equals(c));// 第 10 行", "options": [{"k": "A", "t": "第 8 行输出 zi，因为 String 不可变，concat() 只是返回新对象而没有被接收"}, {"k": "B", "t": "第 9 行输出 false，b 是运行期在堆上新建的对象，c 指向常量池中的字面量"}, {"k": "C", "t": "若改为 System.out.println(b.intern() == c)，将输出 true"}, {"k": "D", "t": "StringBuilder 是线程安全的，多个线程共享同一个 StringBuilder 拼接字符串没有问题"}], "answer": ["A", "B", "C"], "explain": "考点：String 不可变性 + StringBuilder/StringBuffer 选型。<br><b>A 正确</b>：String 内部的 value 数组是 <code>final</code> 的，<code>concat / trim / replace / substring / toUpperCase</code> 等方法<b>全部返回新对象</b>，不接收返回值等于白做。日志脱敏、参数 trim 时最常犯这个错。<br><b>B 正确</b>：<code>sb.toString()</code> 内部是 <code>new String(value, 0, count)</code>，在堆上新建对象，与常量池里的 \"ziroom\" 不是同一个引用，<code>==</code> 为 false；内容比较必须用 <code>equals</code>。<br><b>C 正确</b>：<code>intern()</code> 会在常量池中查找/放入该字符串并返回<b>池中的引用</b>，与字面量 c 相等。但注意：对海量动态字符串调用 intern 会撑大常量池（JDK7 后在堆中）并增加 GC 压力，不要滥用。<br><b>D 错误</b>：<code>StringBuilder</code> <b>不加锁、非线程安全</b>，多线程共享会出现字符错乱甚至 <code>ArrayIndexOutOfBoundsException</code>（扩容与写入之间没有同步）。线程安全的是 <code>StringBuffer</code>（方法上加 synchronized），但正确做法是<b>让每个线程使用自己的局部 StringBuilder</b>——局部变量天然线程私有，性能也最好。补充：循环体内做字符串拼接必须用 StringBuilder，用 + 会在每次迭代都 new 一个 StringBuilder。", "android": "对应 Android 里在 RecyclerView 的 onBindViewHolder 里用 + 拼字符串：不可变对象每次拼接都产生新对象，滑动时疯狂触发 GC 卡顿，正解是复用 StringBuilder。", "kaodian": "AI 后端能力 - 语言基础层 - 字符串不可变与 StringBuilder"}, {"no": 22, "type": "multi", "body": "以下代码创建了一个本地缓存 Map，关于 HashMap 的容量与扩容机制，说法<b>正确</b>的有哪些？（多选、少选、错选均不得分）", "code": "Map<String, Object> cache = new HashMap<>(10);\nfor (int i = 0; i < 13; i++) {\n    cache.put(\"key-\" + i, i);\n}", "options": [{"k": "A", "t": "HashMap 的 key 必须实现 Comparable 接口，否则发生哈希冲突时无法处理"}, {"k": "B", "t": "默认负载因子 0.75，阈值为 12，放入第 13 个元素时触发一次扩容，数组长度变为 32"}, {"k": "C", "t": "已知元素个数 n 时，应按 n / 0.75 + 1 向上取整设置初始容量，以避免中途扩容"}, {"k": "D", "t": "实际的桶数组长度是 16，HashMap 会把传入的初始容量向上取整到最近的 2 的幂"}], "answer": ["B", "C", "D"], "explain": "考点：HashMap 的初始容量、负载因子与扩容时机。<br><b>A 错误</b>：key 只需要正确实现 <code>hashCode()</code> 和 <code>equals()</code>。<code>Comparable</code> 只是链表转红黑树（链长 ≥ 8 且数组长度 ≥ 64）后用于比较排序的<b>可选优化</b>，没实现时会退化用 <code>System.identityHashCode</code> 兜底比较，完全不影响使用。<br><b>B 正确</b>：<code>threshold = 16 × 0.75 = 12</code>，put 后 <code>++size &gt; threshold</code> 即 resize，容量翻倍到 32。JDK8 的扩容用<b>高低位链表拆分</b>（判断 <code>hash & oldCap</code> 是否为 0），不需要逐个重算下标。<br><b>C 正确</b>：这正是 Guava <code>Maps.newHashMapWithExpectedSize()</code> 的算法，能避免多次扩容带来的数组复制与 rehash 开销（扩容是 O(n) 操作，大 Map 扩容时会有明显毛刺）。<br><b>D 正确</b>：构造器里通过 <code>tableSizeFor(10)</code> 算出 <b>16</b>。桶数组长度恒为 2 的幂，这样 <code>(n - 1) & hash</code> 才能等价于取模且高效；同时配合 <code>hash()</code> 中的高 16 位异或扰动，减少高位丢失导致的冲突。注意：数组是<b>首次 put 时才真正创建</b>（懒初始化）。<br>再补一句：HashMap 非线程安全，并发场景请用 <code>ConcurrentHashMap</code>。", "android": "类似 Android 里明知列表只有几十条却用默认容量的 HashMap，或反过来给 SparseArray 预估容量：容量给对了能省掉好几次数组复制，在低端机上是真实可感的性能差异。", "kaodian": "AI 后端能力 - 语言基础层 - HashMap 容量与扩容"}, {"no": 23, "type": "multi", "body": "以下代码期望通过 <code>interrupt()</code> 停止工作线程，关于线程中断，说法<b>正确</b>的有哪些？（多选、少选、错选均不得分）", "code": "Thread t = new Thread(() -> {\n    while (!Thread.currentThread().isInterrupted()) {\n        try {\n            Thread.sleep(200);\n            System.out.println(\"working...\");\n        } catch (InterruptedException e) {\n            // 什么都不做\n        }\n    }\n    System.out.println(\"exit\");\n});\nt.start();\nThread.sleep(500);\nt.interrupt();", "options": [{"k": "A", "t": "线程不会退出：sleep 响应中断抛出 InterruptedException 时会清除中断标志位，catch 吞掉后 isInterrupted() 仍为 false"}, {"k": "B", "t": "应该改用 Thread.stop() 强制结束线程，它是官方推荐的线程终止方式"}, {"k": "C", "t": "interrupt() 只是设置中断标志 / 唤醒阻塞方法，并不会强行终止目标线程"}, {"k": "D", "t": "正确做法是在 catch 中调用 Thread.currentThread().interrupt() 恢复中断标志，或直接 break 退出循环"}], "answer": ["A", "C", "D"], "explain": "考点：Java 协作式中断机制。<br><b>A 正确</b>：这是「任务停不掉」最隐蔽的根因——<code>sleep / wait / join</code> 响应中断时会抛出 <code>InterruptedException</code> 并<b>把中断标志复位为 false</b>，catch 里一吞，循环条件 <code>!isInterrupted()</code> 永远成立，线程继续跑，日志里连异常都看不到。<br><b>B 错误</b>：<code>Thread.stop()</code> 早已被废弃——它会立刻抛出 ThreadDeath 并<b>释放该线程持有的所有锁</b>，共享对象可能停在被破坏的中间状态，数据错乱且无法恢复；<code>suspend/resume</code> 同样废弃（持锁挂起极易死锁）。<br><b>C 正确</b>：中断是<b>协作式</b>的，只是发出「请你停下」的信号；线程必须自己检查标志或在阻塞点响应。如果任务是纯 CPU 计算的死循环且从不检查标志，<code>interrupt()</code> 毫无作用（这也是线程池 <code>shutdownNow()</code> 不一定能停住任务的原因）。<br><b>D 正确</b>：两种正规处理方式——要么 <code>Thread.currentThread().interrupt()</code> 恢复标志让上层感知，要么就地 break/return 结束任务，<b>绝不允许静默吞掉</b>（阿里规约明确要求）。<br>细节补充：<code>isInterrupted()</code> 不清标志，静态方法 <code>Thread.interrupted()</code> 会<b>清除</b>标志，两者别用混。", "android": "和 Android 里想停掉一个后台 Thread 一个道理：没有「杀死线程」的安全 API，只能设置 volatile 的 running 标志或用中断信号让任务自己走到检查点优雅退出。", "kaodian": "AI 后端能力 - 语言基础层 - 线程中断机制"}, {"no": 24, "type": "multi", "body": "以下程序以 <code>-Xmx64m -XX:+HeapDumpOnOutOfMemoryError</code> 启动，关于其结果与 JVM 运行时数据区，说法<b>正确</b>的有哪些？（多选、少选、错选均不得分）", "code": "public class T {\n    static List<byte[]> cache = new ArrayList<>();\n\n    public static void main(String[] args) {\n        while (true) {\n            cache.add(new byte[1024 * 1024]);\n        }\n    }\n}", "options": [{"k": "A", "t": "程序会抛出 java.lang.OutOfMemoryError: Java heap space，因为 byte[] 分配在堆上且被静态集合强引用，GC 无法回收"}, {"k": "B", "t": "虚拟机栈、本地方法栈、程序计数器是线程私有的，堆和方法区（元空间）是线程共享的"}, {"k": "C", "t": "只要把 -Xmx 调大就能彻底解决这类问题，无需分析代码"}, {"k": "D", "t": "程序计数器是唯一不会抛出 OutOfMemoryError 的运行时数据区"}], "answer": ["A", "B", "D"], "explain": "考点：JVM 运行时数据区划分与 OOM 定位。<br><b>A 正确</b>：<code>static</code> 变量是 <b>GC Roots</b> 之一，cache 里的所有数组一直可达，可达性分析判定为存活，64MB 堆很快被撑满 → <code>OOM: Java heap space</code>。对照记忆：无限递归是 <code>StackOverflowError</code>（虚拟机栈），动态生成大量类/大量 CGLIB 代理才是 <code>OOM: Metaspace</code>，NIO DirectByteBuffer 用超了是 <code>OOM: Direct buffer memory</code>。<br><b>B 正确</b>：这是运行时数据区最基本的划分，也解释了为什么<b>局部变量天然线程安全</b>（在各自的虚拟机栈帧里），而成员变量/静态变量需要同步。<br><b>C 错误</b>：调大 -Xmx 只是把 OOM 推迟发生，反而让 dump 文件更大、Full GC 停顿更长。正确姿势是：用 <code>-XX:+HeapDumpOnOutOfMemoryError</code> 产出 hprof，再用 MAT / jvisualvm 看<b>支配树（Dominator Tree）</b>找出占比最大的对象和它的 <b>GC Roots 引用链</b>。要区分「<b>内存泄漏</b>」（本例：静态集合只增不减，该释放的没释放）和「<b>内存溢出</b>」（确实业务量大、内存真的不够）——前者改代码（加淘汰策略/换 Caffeine 设置 maximumSize 与过期），后者才是扩容。<br><b>D 正确</b>：程序计数器只存当前线程执行的字节码行号，大小固定且极小，是《JVM 规范》中<b>唯一没有规定 OOM</b> 的区域。", "android": "就是 Android 里最经典的 static 集合持有 Context/Bitmap 造成的内存泄漏：LeakCanary 报出来的那条引用链，和这里用 MAT 找 GC Roots 是完全一样的分析方法。", "kaodian": "AI 后端能力 - 语言基础层 - JVM 运行时数据区"}, {"no": 25, "type": "multi", "body": "阅读以下代码，关于 Java 异常体系与捕获规则，说法<b>正确</b>的有哪些？（多选、少选、错选均不得分）", "code": "public class T {\n    public static void main(String[] args) {\n        try {\n            Object o = null;\n            o.toString();\n        } catch (Exception e) {\n            System.out.println(\"A\");\n        } catch (NullPointerException e) {\n            System.out.println(\"B\");\n        }\n    }\n}", "options": [{"k": "A", "t": "这段代码编译不通过：NullPointerException 已被前面的 catch (Exception e) 覆盖，子类异常的 catch 必须写在父类之前"}, {"k": "B", "t": "NullPointerException 属于 RuntimeException（非受检异常），编译器不强制 try-catch 或 throws"}, {"k": "C", "t": "OutOfMemoryError 继承自 Error，catch (Exception e) 捕获不到它"}, {"k": "D", "t": "把两个 catch 块的顺序调换后代码可以编译通过，运行时会打印 A"}], "answer": ["A", "B", "C"], "explain": "考点：Throwable 继承体系与多 catch 匹配规则。<br><b>A 正确</b>：javac 会直接报错「已捕获到 java.lang.NullPointerException」。多个 catch 必须<b>从具体到宽泛</b>排列，因为 JVM 是自上而下做 instanceof 匹配，父类写在前面会让后面的子类分支永远不可达。补充：用 <code>catch (A | B e)</code> 多重捕获时，A 与 B 之间也不能有继承关系，且变量 e 隐式为 final。<br><b>B 正确</b>：<code>Throwable</code> 分为 <b>Error</b> 与 <b>Exception</b>；Exception 又分<b>受检异常</b>（IOException、SQLException、ClassNotFoundException，编译器强制处理）和<b>非受检的 RuntimeException</b>（NPE、IndexOutOfBounds、IllegalArgument、ClassCast）。RuntimeException 通常代表<b>代码 bug，应当修复而不是 catch 掩盖</b>。<br><b>C 正确</b>：Error 表示 JVM 层面无法恢复的严重问题（OOM、StackOverflowError），与 Exception 是<b>兄弟分支</b>，<code>catch (Exception)</code> 捕获不到；只有 <code>catch (Throwable)</code> 能捕获，但业务代码不应这么写（会把 OOM 也吞掉，让进程带病运行）。<br><b>D 错误</b>：调换顺序后确实能编译通过，但 NPE 会被<b>更精确的第一个 catch</b> 命中，打印的是 <b>B</b> 而不是 A。<br>实战规范：捕获异常必须处理或带上下文向上抛（<code>throw new BizException(\"订单ID=\" + id, e)</code>），禁止空 catch 块，禁止 <code>catch (Exception e) {}</code> 一把梭吞掉所有异常。", "android": "对应 Android 里在 Activity 外层 catch (Exception e) 兜底防崩溃：能挡住空指针，却挡不住 OOM 和 ANR，而且吞掉后问题不上报，线上等于瞎了。", "kaodian": "AI 后端能力 - 语言基础层 - 异常体系与捕获顺序"}, {"no": 26, "type": "multi", "body": "以下 CSS 中，关于 <code>.child</code> 的尺寸计算，说法<b>正确</b>的有哪些？（多选、少选、错选均不得分）", "code": "<div class=\"parent\">\n  <div class=\"child\"></div>\n</div>\n\n.parent {\n  width: 400px;\n  height: 100px;\n}\n.child {\n  width: 50%;\n  padding: 10%;\n  margin-top: 10%;\n}", "options": [{"k": "A", "t": "child 的 padding 上下左右都是 40px，padding 百分比一律参照包含块的宽度"}, {"k": "B", "t": "child 的 width: 50% 参照的是父元素的边框盒宽度（含 padding 与 border）"}, {"k": "C", "t": "默认 content-box 下，child 的边框盒宽度是 200 + 40 × 2 = 280px"}, {"k": "D", "t": "margin-top: 10% 计算结果也是 40px，纵向外边距的百分比同样参照包含块的宽度而非高度"}], "answer": ["A", "C", "D"], "explain": "考点：CSS 百分比的参照基准（包含块）。<br><b>A 正确</b>：<code>padding-top / bottom</code> 的百分比也以<b>包含块的 width</b> 为基准，400 × 10% = 40px，四边都是 40px。这正是 <code>padding-top: 56.25%</code> 实现 16:9 自适应盒子的原理（现代写法可用 <code>aspect-ratio</code> 替代）。<br><b>B 错误</b>：百分比宽度的基准是<b>包含块的内容盒宽度</b>（父元素 content box），不包含父元素自身的 padding 和 border。<br><b>C 正确</b>：默认 <code>content-box</code>，width 只算内容区 400 × 50% = 200px，再加左右 padding 各 40px，边框盒 = <b>280px</b>（本例没有 border；margin 不计入盒宽，只影响外部间距）。注意这个 280px 已经超过了父元素 400px 的 70%，继续加内容很容易溢出。<br><b>D 正确</b>：<code>margin-top / bottom</code> 的百分比<b>同样参照宽度</b>，而不是高度——极其反直觉，是响应式布局的高发坑（改父容器宽度，纵向间距跟着变）。<br>再补一条对照：<code>height</code> 的百分比参照的是包含块的<b>高度</b>，且要求包含块有确定高度，否则会被当作 auto 失效——高度和宽度的百分比规则并不对称。", "android": "类似 Android 里 ConstraintLayout 的 layout_constraintWidth_percent 与 dimensionRatio：百分比到底是相对父容器的哪个尺寸，一旦记错，换个屏幕宽度布局就整体错位。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 百分比参照"}, {"no": 27, "type": "multi", "body": "测试同学提交了如下缺陷单，关于这份缺陷报告的评审意见，<b>正确</b>的有哪些？（多选、少选、错选均不得分）", "code": "【缺陷单 BUG-20431】\n标题：APP 有问题\n重现步骤：登录后点了几下就崩了\n预期结果：不崩溃\n实际结果：崩溃\n严重级别：致命(S1)     优先级：低(P3)\n环境：无\n附件：无", "options": [{"k": "A", "t": "标题未描述「哪个模块、什么操作、出现什么现象」，无法检索与去重，应改为「【租客端 v3.2.1】我的-账单页连续快速切换月份导致 App 闪退」"}, {"k": "B", "t": "重现步骤不可复现：缺少精确的操作路径、测试数据（账号 / 订单号）以及复现概率说明"}, {"k": "C", "t": "严重级别为致命而优先级为低，这种组合本身就是非法的，任何缺陷的严重级别与优先级都必须保持一致"}, {"k": "D", "t": "缺少环境信息（App 版本、机型、系统版本、后端环境）与崩溃日志、录屏等证据附件"}], "answer": ["A", "B", "D"], "explain": "考点：缺陷报告的质量要素。<br>一份合格的缺陷单 = <b>可检索的标题 + 可复现的步骤 + 明确的预期/实际对比 + 完整环境 + 证据链</b>，目标是让开发<b>不用回来追问就能复现和定位</b>。<br><b>A 正确</b>：标题是缺陷的唯一「索引」，必须包含 端/版本 + 模块路径 + 触发操作 + 现象，否则无法搜索、无法判重、周报里也统计不出模块分布。<br><b>B 正确</b>：步骤要精确到可被机械执行（第几步点什么、输入什么数据），并注明<b>复现概率</b>（5 次 5 中 / 偶现 1/10）和<b>是否为回归问题</b>（上个版本是否存在）——偶现与必现的排查投入完全不同。<br><b>C 错误</b>：<b>Severity（严重级别）由测试判定，衡量缺陷对系统的破坏程度；Priority（优先级）由产品/项目判定，衡量修复的紧急程度</b>，这是两个独立维度。完全可能出现「高严重低优先」（崩溃只发生在即将下线的功能或极冷门机型上）和「低严重高优先」（首页 Logo 写错字，影响品牌形象需立即修）。只是这类反差组合需要在缺陷单里写明判定理由，避免误解。<br><b>D 正确</b>：环境是复现的前提（很多崩溃只在特定机型 / 系统版本 / 弱网下出现），日志、录屏、接口报文是定位的证据，缺一样就多一轮来回沟通。", "android": "和 Android 提 Crash 单一个标准：没有堆栈、机型、系统版本和复现路径的「用着用着就闪退」，开发只能回一句「无法复现」，一来一回两天就过去了。", "kaodian": "AI 质量保障 - 缺陷定位与可观测性 - 缺陷报告规范"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 28, "type": "judge", "body": "判断：以下代码<b>不会</b>抛出 <code>ConcurrentModificationException</code>，最终正常输出 <code>[a, c]</code>。", "code": "List<String> list = new ArrayList<>();\nlist.add(\"a\");\nlist.add(\"b\");\nlist.add(\"c\");\n\nfor (String s : list) {\n    if (\"b\".equals(s)) {\n        list.remove(s);\n    }\n}\nSystem.out.println(list);", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：ArrayList 迭代器的 fail-fast 触发时机。<br>增强 for 编译后就是 Iterator 循环：每轮先调 <code>hasNext()</code>（判断 <code>cursor != size</code>），再调 <code>next()</code>（内部先执行 <code>checkForComodification()</code> 比较 <code>modCount != expectedModCount</code>）。<br>删除 \"b\" 时（它是<b>倒数第二个</b>元素），cursor 已经是 2，remove 后 size 从 3 变成 2，下一轮 <code>hasNext()</code> 得到 <code>2 != 2</code> → <b>false</b>，循环<b>直接结束</b>，<code>checkForComodification()</code> 根本没机会执行，所以这次侥幸不抛异常，输出 <code>[a, c]</code>。<br><b>但这只是巧合</b>：只要删的不是倒数第二个元素（比如把条件换成 <code>\"a\".equals(s)</code>），下一轮 next() 立刻抛 <code>ConcurrentModificationException</code>。这种「<b>随数据位置而变的偶发 bug</b>」比稳定报错危险得多——开发本地三条数据测过了，线上数据一多就炸。<br>正确写法三选一：<code>Iterator.remove()</code>、<code>list.removeIf(s -&gt; ...)</code>、或倒序下标 for 循环。多线程并发修改则必须换 <code>CopyOnWriteArrayList</code> 或加锁。", "android": "和 Android 里边遍历 adapter 数据源边删除 item 一样：数据少的时候一直没事，用户列表一长就随机崩溃，测试还很难稳定复现。", "kaodian": "AI 后端能力 - 语言基础层 - fail-fast 与迭代器"}, {"no": 29, "type": "judge", "body": "判断：以下双重检查锁（DCL）单例存在隐患——<code>instance</code> 必须声明为 <code>volatile</code>，否则其他线程可能在第一个 <code>if</code> 处拿到<b>尚未初始化完成</b>的对象。", "code": "public class Singleton {\n    private static Singleton instance;\n    private Singleton() {}\n\n    public static Singleton getInstance() {\n        if (instance == null) {\n            synchronized (Singleton.class) {\n                if (instance == null) {\n                    instance = new Singleton();\n                }\n            }\n        }\n        return instance;\n    }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：指令重排序与 volatile 的内存屏障作用。<br><code>instance = new Singleton()</code> <b>不是原子操作</b>，字节码上分三步：① 分配内存 ② 调用构造器初始化对象 ③ 把内存地址赋给 instance 引用。JIT 与 CPU 在<b>单线程语义不变</b>（as-if-serial）的前提下，允许把 ② 和 ③ 重排序为 ①③②。<br>一旦发生重排，线程 A 执行完 ③ 但还没执行 ② 时，线程 B 在<b>同步块之外</b>的第一个 <code>if</code> 处（这里没有任何锁、没有任何内存屏障）看到 <code>instance != null</code>，直接返回并使用这个字段全是默认值 null/0 的<b>半成品对象</b>，出现莫名其妙的 NPE——而且概率极低、只在高并发首次初始化的瞬间出现，几乎无法复现。<br>加上 <code>volatile</code> 后：写操作后插入 StoreStore/StoreLoad 屏障禁止上述重排，读操作前插入 LoadLoad/LoadStore 屏障保证可见性，问题解决（JDK5 修正内存模型后 volatile 才具备这个语义）。<br>更省心的替代方案：<b>静态内部类 Holder</b>（借助 JVM 类初始化的加锁机制，天然线程安全且懒加载）或<b>枚举单例</b>（还能防反射与反序列化破坏）。业务开发中其实很少手写单例——Spring 容器管理的 Bean 默认就是单例。", "android": "Android 里 SDK 初始化、图片加载器、数据库 Helper 的单例几乎全用 DCL 写法，漏掉 volatile 就会在多线程首次调用时偶发 NPE，属于典型的「一年崩一次、永远查不出」的问题。", "kaodian": "AI 后端能力 - 语言基础层 - 指令重排序与 volatile"}, {"no": 30, "type": "judge", "body": "判断：把下面这个类编译后执行 <code>java java.lang.String</code>，控制台会正常输出 <code>hello ziroom</code>。", "code": "package java.lang;\n\npublic class String {\n    public static void main(String[] args) {\n        System.out.println(\"hello ziroom\");\n    }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：双亲委派模型（Parents Delegation Model）。<br>应用类加载器（AppClassLoader）收到加载 <code>java.lang.String</code> 的请求后，<b>不会自己先加载</b>，而是逐级向上委派给扩展/平台类加载器、最终交给<b>启动类加载器（Bootstrap ClassLoader）</b>。Bootstrap 在 rt.jar / java.base 中找到了官方的 <code>java.lang.String</code> 并成功加载，于是自定义的这份<b>根本不会被使用</b>。运行时因为官方 String 里没有 main 方法，报「<b>错误: 在类 java.lang.String 中找不到 main 方法</b>」。<br>这套机制的价值：① 保证核心类库<b>不被篡改</b>（否则替换掉 String 就能为所欲为）；② 保证同一个类在 JVM 中的<b>唯一性</b>——类的相等性由「<b>全限定类名 + 加载它的类加载器</b>」共同决定，不同 ClassLoader 加载的同名类互相 instanceof 为 false（这正是热部署、OSGi 中 ClassCastException 的来源）。<br>补充：若试图用自定义 ClassLoader 的 <code>defineClass</code> 强行加载 <code>java.*</code> 包下的类，会直接抛 <code>SecurityException: Prohibited package name</code>；JDK9 模块化后包名冲突还会被模块系统拦截。<br>反例（有意打破委派）：Tomcat 为实现 webapp 隔离而<b>优先自己加载</b>；JDBC/SPI 通过<b>线程上下文类加载器</b>让父加载器反向调用子加载器的实现。", "android": "Android 的 ClassLoader（PathClassLoader / DexClassLoader）同样遵循双亲委派，热修复框架正是通过往 dexElements 数组前面插入补丁 dex 来「抢先加载」，本质就是在可控范围内绕过默认的查找顺序。", "kaodian": "AI 后端能力 - 语言基础层 - 类加载双亲委派"}, {"no": 31, "type": "judge", "body": "判断：下面的 Controller 中，因为 ThreadLocalMap 的 key 是弱引用、<code>USER_ID</code> 又是 <code>static final</code>，所以在 Tomcat 线程池环境下既不会内存泄漏也不会串数据，无需手动 <code>remove()</code>。", "code": "@RestController\npublic class OrderController {\n\n    private static final ThreadLocal<Long> USER_ID = new ThreadLocal<>();\n\n    @GetMapping(\"/order/list\")\n    public Object list(@RequestHeader(\"uid\") Long uid) {\n        USER_ID.set(uid);\n        return orderService.listByUser(USER_ID.get());\n    }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：ThreadLocal 在线程池复用场景下的两大风险，本题两个风险都真实存在。<br><b>① 内存泄漏</b>：<code>ThreadLocalMap.Entry</code> 继承 WeakReference，<b>key（ThreadLocal 对象）是弱引用，但 value 是强引用</b>。恰恰因为 <code>USER_ID</code> 被 static final 常驻引用，key 永远不会被回收，value 自然也永远不会释放；而 Tomcat 工作线程是<b>复用且生命周期极长</b>的，请求越多堆积越多，最终 OOM（弱引用只在 ThreadLocal 本身不可达时才可能触发 key = null 的脏 Entry，仍需 set/get/remove 时的启发式清理才能删掉 value）。<br><b>② 数据串号（更致命）</b>：线程处理完请求归还线程池，下一个请求可能<b>复用同一个线程</b>。只要某条路径提前抛异常、走了没有 set 的分支，就会读到<b>上一个用户遗留的 uid</b>——直接构成越权访问与数据泄露事故，且日志上看一切正常。<br>正确做法：<pre>try { USER_ID.set(uid); ... } finally { USER_ID.remove(); }</pre>或统一在拦截器的 <code>afterCompletion()</code> / Filter 的 finally 中清理（Spring 的 RequestContextHolder、MDC 日志链路 ID 都是这么做的）。<br>补充：ThreadLocal 的值<b>不会自动传递</b>给子线程或线程池中的异步任务，需要 <code>InheritableThreadLocal</code>（只对新建线程有效）或阿里的 <code>TransmittableThreadLocal</code>（支持线程池）。", "android": "类似 Android 里用 static 变量缓存当前登录用户：单个进程里看着很方便，但一旦账号切换或页面复用时忘了清理，就会把上一个账号的数据渲染给新用户看。", "kaodian": "AI 后端能力 - 语言基础层 - ThreadLocal 与线程复用"}, {"no": 32, "type": "judge", "body": "判断：以下代码会输出 <code>[1, 9, 10, 100]</code>，并且 <code>arr === sorted</code> 为 <code>false</code>，因为 <code>sort()</code> 返回的是一个排好序的新数组。", "code": "const arr = [10, 9, 1, 100];\nconst sorted = arr.sort();\nconsole.log(sorted);\nconsole.log(arr === sorted);", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：Array.prototype.sort 的默认比较规则与原地变更特性。题目里<b>两处都错</b>。<br><b>① 排序结果错</b>：不传比较函数时，sort 会把每个元素<b>先转成字符串</b>，再按 UTF-16 码元顺序逐位比较，于是 <code>'1' &lt; '10' &lt; '100' &lt; '9'</code>，实际输出 <b>[1, 10, 100, 9]</b>。要按数值排序必须显式传比较器：<code>arr.sort((a, b) =&gt; a - b)</code>。（注意比较器要返回数字而不是布尔值，返回 true/false 在部分引擎下结果不稳定。）<br><b>② 返回值错</b>：sort 是<b>原地（in-place）</b>排序，直接修改并返回<b>原数组本身</b>，所以 <code>arr === sorted</code> 为 <b>true</b>。这意味着它会<b>意外污染源数据</b>——把父组件通过 props 传下来的数组直接 sort，会绕过响应式赋值改掉上游状态，引发难以追踪的视图错乱（Vue3 中还会触发意料之外的依赖更新）。<br>需要保留原数组时：<code>[...arr].sort((a, b) =&gt; a - b)</code> 或 ES2023 的 <code>arr.toSorted()</code>。<br>同类对照记忆：<b>变更型</b>（sort / reverse / splice / push / pop / shift / unshift / fill）会改原数组；<b>非变更型</b>（slice / concat / map / filter / toSorted / toReversed）返回新数组。", "android": "对应 Android 里 Collections.sort(list) 直接对 adapter 的数据源排序：既改了原始列表，又因为默认比较规则不符合预期（比如按字符串比数字），列表顺序看起来完全是乱的。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - Array.sort 默认比较"}, {"no": 33, "type": "judge", "body": "判断：下面这条接口用例属于<b>黑盒测试</b>；即使这类接口用例全部通过，也不能证明服务端的分支逻辑已被完整覆盖，仍需结合白盒手段（单元测试、代码覆盖率）评估质量。", "code": "@Test\nvoid 优惠券折扣接口测试() {\n    given().contentType(\"application/json\")\n           .body(\"{\\\"amount\\\": 100, \\\"couponId\\\": 8801}\")\n    .when().post(\"/api/order/discount\")\n    .then().statusCode(200)\n           .body(\"data.discount\", equalTo(10));\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：黑盒 / 白盒测试的边界与互补关系。<br><b>① 属于黑盒测试</b>：该用例只依据接口契约（入参、出参、状态码）设计，完全不关心服务端内部实现，属于典型的黑盒（功能测试 / 接口测试）。若同时参考了代码结构来设计入参组合，则称为<b>灰盒</b>。<br><b>② 通过 ≠ 覆盖完整</b>：黑盒用例是按<b>需求文档、等价类与边界值</b>划分出来的，天然感知不到代码里的私有分支、异常兜底、并发保护路径。比如「优惠券已过期」「券与商品不匹配」「金额为负」「券被并发核销」这些分支，只要需求文档里没写，用例就会漏掉，而线上这些分支照样会被触发。<br>所以业界通行的做法是分层互补：<b>单元测试（白盒，配合 JaCoCo 看行/分支覆盖率）打底 → 接口测试（黑盒/灰盒）验证契约与集成 → 少量 E2E 保障关键链路</b>，即测试金字塔。<br>反过来也要清醒：<b>覆盖率 100% 同样不等于没有缺陷</b>——覆盖率只能说明代码被执行过，不能说明断言写对了、边界考虑全了、需求理解对了。断言写成 <code>assertNotNull</code> 也能刷满覆盖率。", "android": "类似 Android 里只跑 Espresso UI 测试就宣称质量达标：点得通不代表 ViewModel 里的异常分支和边界逻辑被测过，还是得靠单元测试补齐内部路径。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 黑盒与白盒测试"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
