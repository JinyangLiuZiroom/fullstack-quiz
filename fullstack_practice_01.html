<script type="application/json" id="quizData">{"id": "vol01", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷为全新重做（2026-08-13）：每题给代码/配置片段，考读代码判行为/补全/规范正误；答案已随机分布（单选 A/B/C/D 均衡、判断 3对3错），分布 后端11/前端11/测试11。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "对于「缓存穿透」（大量请求查询一个数据库中根本不存在的 key），下列哪项能从源头最有效地拦截？", "code": "public Object get(String key) {\n    Object v = cache.get(key);\n    if (v != null) return v;\n    return db.select(key);   // key 本就不存在，每次都白查一次 DB\n}", "options": [{"k": "A", "t": "用布隆过滤器先判 key 是否可能存在，不存在则直接返回空"}, {"k": "B", "t": "把缓存过期时间设置得更长一些"}, {"k": "C", "t": "增大数据库连接池的大小"}, {"k": "D", "t": "给接口增加限流与熔断即可"}], "answer": "A", "explain": "布隆过滤器用极小内存快速判定 key 是否可能存在，不存在的 key 直接拦截，从源头阻断穿透。空值缓存也能缓解但不如布隆过滤器彻底；B/C/D 都是治标不治本。", "kaodian": "AI后端能力-高并发与中间件层-Redis缓存穿透防护"}, {"no": 2, "type": "single", "body": "实体上加了 @TableLogic 后，执行 updateById 删除一条记录，MyBatis-Plus 实际执行的 SQL 是？", "code": "@TableLogic\nprivate Integer deleted;   // 0=未删 1=已删\n// 调用 userService.removeById(10L);", "options": [{"k": "A", "t": "DELETE FROM user WHERE id=10"}, {"k": "B", "t": "UPDATE user SET deleted=1 WHERE id=10 AND deleted=0"}, {"k": "C", "t": "UPDATE user SET deleted=0 WHERE id=10"}, {"k": "D", "t": "直接把该行物理删除并清空缓存"}], "answer": "B", "explain": "@TableLogic 把删除改写为逻辑删除：将 deleted 置 1（并在 where 追加 deleted=0 防止重复删除），不会物理删除。默认未配置时全局逻辑删除值为 1。", "kaodian": "AI后端能力-数据存储与ORM层-MP逻辑删除改写SQL"}, {"no": 3, "type": "single", "body": "某队列设置了 TTL 过期 + 死信交换机，消息消费超时未被确认，消息最终会怎样？", "code": "// 声明队列：x-message-ttl=5000, x-dead-letter-exchange=dlx\nchannel.basicConsume(queue, false, consumer);   // 手动 ack，但消费者一直不 ack", "options": [{"k": "A", "t": "消息会在 5 秒后从原队列移除，经死信交换机进入死信队列"}, {"k": "B", "t": "消息永远留在原队列，直到消费者 ack"}, {"k": "C", "t": "消息被直接丢弃，不进任何队列"}, {"k": "D", "t": "消息立即重新入队无限循环"}], "answer": "A", "explain": "设置了 TTL 且未在超时前 ack，消息过期后会被投递到死信交换机（DLX），最终进入死信队列；这不是无限循环（除非死信队列又绑回原队列）。", "kaodian": "AI后端能力-高并发与中间件层-RabbitMQ死信队列TTL"}, {"no": 4, "type": "single", "body": "表有联合索引 idx(a,b,c)，下列哪条查询能走该索引（最左前缀）？", "code": "CREATE INDEX idx_abc ON t(a, b, c);\n-- 下列哪条能用上 idx_abc？", "options": [{"k": "A", "t": "SELECT * FROM t WHERE b=1 AND c=2"}, {"k": "B", "t": "SELECT * FROM t WHERE c=3"}, {"k": "C", "t": "SELECT * FROM t WHERE a=1 AND c=3"}, {"k": "D", "t": "SELECT * FROM t WHERE a=1 AND b=2 AND c=3"}], "answer": "D", "explain": "联合索引遵循最左前缀：必须从 a 开始按顺序使用。D 用全 a,b,c 最充分；C 用了 a 但中间跳过 b，只能用到 a；A、B 不以 a 开头，无法命中。", "kaodian": "AI后端能力-数据存储与ORM层-联合索引最左前缀"}, {"no": 5, "type": "single", "body": "外层事务里调用一个 REQUIRES_NEW 的内层方法，内层抛异常被外层 catch，结果会怎样？", "code": "@Transactional\npublic void outer() {\n    try { innerService.doInner(); }  // doInner 标了 REQUIRES_NEW\n    catch (Exception e) { /* 吞掉 */ }\n    // 外层继续执行并提交\n}", "options": [{"k": "A", "t": "内层已独立提交/回滚，不影响外层；外层可正常提交"}, {"k": "B", "t": "内层异常会标记外层事务，导致外层整体回滚"}, {"k": "C", "t": "REQUIRES_NEW 内层挂起时外层事务被提交"}, {"k": "D", "t": "内层异常一定导致内层和外层都回滚"}], "answer": "A", "explain": "REQUIRES_NEW 会挂起外层事务、开启独立新事务，内层异常只回滚内层；外层 catch 后不受影响可继续提交。B 是 REQUIRED 的默认传播行为。", "kaodian": "AI后端能力-应用框架层-事务传播REQUIRES_NEW"}, {"no": 6, "type": "single", "body": "一个消费者组里消费者数量大于 topic 分区数时，会发生什么？", "code": "// topic: order，3 个分区；消费者组 group-a 启动 5 个消费者实例\nkafkaConsumer.subscribe(List.of(\"order\"));", "options": [{"k": "A", "t": "5 个消费者均分 3 个分区，都能消费到数据"}, {"k": "B", "t": "最多 3 个消费者能分到分区，多余 2 个空闲不消费"}, {"k": "C", "t": "所有消费者都消费同一份全量数据"}, {"k": "D", "t": "Kafka 会报错拒绝启动多余消费者"}], "answer": "B", "explain": "同一消费者组内，一个分区只能被组内一个消费者消费，因此消费者数 > 分区数时，多余消费者会空闲。想提升并行度应先增加分区数。", "kaodian": "AI后端能力-高并发与中间件层-Kafka消费者组分区分配"}, {"no": 7, "type": "single", "body": "修改 Nacos 上的配置后，下列哪个 Bean 里的字段会被自动刷新？", "code": "@RefreshScope\n@ConfigurationProperties(prefix = \"app\")\npublic class AppCfg {\n    private int timeout;   // 字段A\n}\n@Component\npublic class Other {\n    @Value(\"${app.timeout}\") private int t;  // 字段B，未加 @RefreshScope\n}", "options": [{"k": "A", "t": "两个字段都会被刷新"}, {"k": "B", "t": "只有字段 B 会被刷新"}, {"k": "C", "t": "只有字段 A 会被刷新"}, {"k": "D", "t": "都不会刷新，需重启应用"}], "answer": "C", "explain": "@RefreshScope 让 Bean 在配置变更时重建，@ConfigurationProperties 绑定的字段 A 会被刷新；字段 B 用 @Value 但所在类未加 @RefreshScope，不会刷新。", "kaodian": "AI后端能力-微服务与云原生层-Nacos动态刷新粒度"}, {"no": 8, "type": "single", "body": "关于 Vue3 的 watch 与 computed，下列说法正确的是？", "code": "const count = ref(0);\nconst doubled = computed(() => count.value * 2);   // ①\nwatch(count, (v) => console.log(v));                // ②", "options": [{"k": "A", "t": "computed 有缓存、首次被读取时才计算；watch 默认惰性、值变化才执行"}, {"k": "B", "t": "watch 和 computed 都会在初始化时立即执行一次"}, {"k": "C", "t": "computed 不能依赖 ref，只能依赖 reactive"}, {"k": "D", "t": "watch 返回一个可被模板直接使用的值"}], "answer": "A", "explain": "computed 有缓存、首次被读取时才计算，返回只读 ref；watch 默认惰性（除非 immediate:true）、不返回值。B 错：两者都不是初始化立即执行；C 错：computed 可以依赖 ref；D 错：watch 返回的是停止函数，不是模板可用的值。", "kaodian": "AI前端能力-语言与运行时-Vue3watch与computed"}, {"no": 9, "type": "single", "body": "容器宽 600px，三个子项 flex 分别 1/2/1 且 flex-basis:0，它们的最终宽度是？", "code": ".box{display:flex;width:600px}\n.a{flex:1 1 0}  .b{flex:2 1 0}  .c{flex:1 1 0}", "options": [{"k": "A", "t": "150px / 300px / 150px"}, {"k": "B", "t": "200px / 200px / 200px"}, {"k": "C", "t": "600px / 0 / 0"}, {"k": "D", "t": "100px / 400px / 100px"}], "answer": "A", "explain": "flex-basis:0 使基准为 0，剩余 600px 按 grow 比例 1:2:1 分配，即 150/300/150。", "kaodian": "AI前端能力-前端基础与渲染引擎-Flex弹性计算"}, {"no": 10, "type": "single", "body": "下面 Axios 拦截器中，请求发出前控制台会依次打印什么？", "code": "axios.interceptors.request.use(cfg => { console.log('r1'); return cfg; });\naxios.interceptors.request.use(cfg => { console.log('r2'); return cfg; });\naxios.interceptors.response.use(res => { console.log('p1'); return res; });\naxios.interceptors.response.use(res => { console.log('p2'); return res; });\naxios.get('/api');   // 成功后", "options": [{"k": "A", "t": "r1 r2 p1 p2"}, {"k": "B", "t": "r1 r2 p2 p1"}, {"k": "C", "t": "r2 r1 p1 p2"}, {"k": "D", "t": "r1 p1 r2 p2"}], "answer": "B", "explain": "请求拦截器按注册顺序执行（r1→r2），响应拦截器按注册逆序执行（p2→p1）。", "kaodian": "AI前端能力-网络与BFF架构-Axios拦截器执行顺序"}, {"no": 11, "type": "single", "body": "下面代码的输出顺序是？", "code": "console.log('a');\nsetTimeout(() => console.log('b'), 0);\nPromise.resolve().then(() => console.log('c'));\nconsole.log('d');", "options": [{"k": "A", "t": "a b c d"}, {"k": "B", "t": "a d b c"}, {"k": "C", "t": "a d c b"}, {"k": "D", "t": "a c d b"}], "answer": "C", "explain": "同步代码 a、d 先执行；Promise.then 进微任务、setTimeout 进宏任务。当前宏任务结束后先清空微任务(c)，再执行下一个宏任务(b)，故 a→d→c→b。", "kaodian": "AI前端能力-语言与运行时-事件循环微宏任务"}, {"no": 12, "type": "single", "body": "元素 width:200px、padding:20px、border:5px，box-sizing 分别取 content-box 和 border-box 时，实际占位宽度是？", "code": ".x{ width:200px; padding:20px; border:5px solid; }", "options": [{"k": "A", "t": "都是 200px"}, {"k": "B", "t": "都是 250px"}, {"k": "C", "t": "content-box 200px / border-box 250px"}, {"k": "D", "t": "content-box 250px / border-box 200px"}], "answer": "D", "explain": "content-box 下 width 只指内容，总宽=200+20*2+5*2=250px；border-box 下 width 已含 padding+border，总宽=200px。", "kaodian": "AI前端能力-前端基础与渲染引擎-盒模型box-sizing"}, {"no": 13, "type": "single", "body": "`<input v-model=\"msg\">` 等价于下面哪种写法？", "code": "<input v-model=\"msg\" />", "options": [{"k": "A", "t": ":value=\"msg\" @input=\"msg = $event.target.value\""}, {"k": "B", "t": ":value=\"msg\" @change=\"msg = $event.target.value\""}, {"k": "C", "t": "value=\"msg\" @blur=\"msg = $event.target.value\""}, {"k": "D", "t": "只做单向绑定，无法回写到数据"}], "answer": "A", "explain": "v-model 是语法糖：等价于 :value 绑定 + @input 事件回写（组件上是 modelValue + update:modelValue）。B 用 change 事件只在失焦/回车触发，非实时。", "kaodian": "AI前端能力-语言与运行时-v-model原理"}, {"no": 14, "type": "single", "body": "下面 TS 泛型函数调用后返回值的类型推断是？", "code": "function identity<T>(arg: T): T { return arg; }\nconst r = identity('hello');", "options": [{"k": "A", "t": "any"}, {"k": "B", "t": "string"}, {"k": "C", "t": "T"}, {"k": "D", "t": "string | number"}], "answer": "B", "explain": "泛型 T 由实参 'hello' 推断为 string，返回类型 T 即 string，故 r 是 string。", "kaodian": "AI前端能力-语言与运行时-TS泛型推断"}, {"no": 15, "type": "single", "body": "某输入框接受 1~100 的整数，用等价类划分法，下列哪组分法最合理？", "code": "规则：输入 1~100 之间的整数", "options": [{"k": "A", "t": "只测 50 这一个中间值"}, {"k": "B", "t": "只测 0 和 101 两个越界值"}, {"k": "C", "t": "有效等价类(1~100 取代表值) + 无效等价类(<1、>100、非数字)"}, {"k": "D", "t": "随机生成 1000 个值全测"}], "answer": "C", "explain": "等价类划分要把输入划分为有效/无效等价类并各取代表值，通常还要补边界值。A 缺无效类，B 缺有效类，D 是随机法。", "kaodian": "AI质量保障-软件测试理论与质量体系-等价类划分"}, {"no": 16, "type": "single", "body": "Playwright 中，下列哪种定位方式最稳健、最不易因 DOM 结构/样式微调而失效？", "code": "page.locator('div > div > button:nth-child(3)');\npage.getByText('提交订单');\npage.getByRole('button', { name: '提交' });", "options": [{"k": "A", "t": "page.locator('div > div > button:nth-child(3)')"}, {"k": "B", "t": "page.locator('#btn-submit')"}, {"k": "C", "t": "page.getByText('提交订单')"}, {"k": "D", "t": "page.getByRole('button', { name: '提交' })"}], "answer": "D", "explain": "getByRole 基于可访问性角色+可见名称，对结构/样式微调最鲁棒；CSS 层级路径最脆（结构一变就断），纯文本与 id 依赖前端约定。", "kaodian": "AI质量保障-自动化测试-Playwright语义化定位"}, {"no": 17, "type": "single", "body": "代码改动后，下列哪项最能有效圈定回归测试范围？", "code": "需求变更后，需要确定本次回归要跑哪些用例", "options": [{"k": "A", "t": "变更影响分析(代码/接口调用链) + 历史缺陷高发区 + 业务风险等级"}, {"k": "B", "t": "把所有历史用例全量重跑一遍"}, {"k": "C", "t": "只测本次改动的那个函数本身"}, {"k": "D", "t": "随机抽取 10% 用例执行"}], "answer": "A", "explain": "回归范围应综合影响面（代码/接口依赖）、历史缺陷高发区与业务风险来圈定。全量重跑成本高；只测改动函数会漏掉受影响的老功能；随机抽则可能漏关键路径。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归测试范围"}, {"no": 18, "type": "single", "body": "CI 流水线里 `tsc --noEmit` 这一步的作用是？", "code": "package.json: \"build\": \"tsc --noEmit && vite build\"", "options": [{"k": "A", "t": "生成最终的 JS 产物"}, {"k": "B", "t": "只做 TypeScript 类型检查、不产出文件，类型错误即失败"}, {"k": "C", "t": "压缩 JS 代码体积"}, {"k": "D", "t": "运行单元测试"}], "answer": "B", "explain": "tsc --noEmit 只做类型检查、不输出 JS，类型错误会让该步骤退出非 0 从而阻断构建，是类型门禁。", "kaodian": "AI质量保障-CI/CD与质量门禁-tsc类型门禁"}, {"no": 19, "type": "single", "body": "接口测试中，只断言 HTTP 状态码为 200 会有什么问题？", "code": "const res = await fetch('/api/orders');\nexpect(res.status).t c 基于 AOP 代理，this 自调用绕过了代理对象，因此不会异步执行、也不会走线程池。", "kaodian": "AI后端能力-应用框架层-@Async自调用失效"}, {"no": 2, "type": "judge", "body": "在 Vue3 中，同一元素上 v-for 的优先级高于 v-if。", "code": "<li v-for=\"u in users\" v-if=\"u.active\">{{u.name}}</li>", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Vue3 中 v-for 优先级高于 v-if（与 Vue2 相反），二者同元素混用会导致 v-if 拿不到循环变量，应改用 template 包裹或 computed 过滤。", "kaodian": "AI前端能力-语言与运行时-v-for与v-if优先级"}, {"no": 3, "type": "judge", "body": "对元素从 display:none 切换到 display:block 时，同时设置的 transition 会平滑过渡生效。", "code": ".x{display:none;transition:opacity .3s}\n.x.show{display:block;opacity:1}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "display 是离散属性，none↔block 切换不触发过渡动画；需先用 opacity/transform 或 requestAnimationFrame 延时切换类。", "kaodian": "AI前端能力-前端基础与渲染引擎-display切换过渡失效"}, {"no": 4, "type": "judge", "body": "在自动化测试中，用 console.log 打印结果即可代替断言（expect）判断用例通过与否。", "code": "console.log(res.status === 200);", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "断言需由测试框架（expect/assert）驱动，失败时让用例标红并计入失败数；console.log 只是输出，不阻断、不统计，CI 下无人看。", "kaodian": "AI质量保障-自动化测试-console.log不能当断言"}, {"no": 5, "type": "judge", "body": "代码覆盖率达到 100% 就说明程序没有缺陷。", "code": "coverage = 100%", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "覆盖率只表示代码被执行过，不保证分支逻辑正确、边界处理无误、业务语义正确；100% 行覆盖仍可能有逻辑/边界/集成缺陷。", "kaodian": "AI质量保障-软件测试理论与质量体系-覆盖率局限"}, {"no": 6, "type": "judge", "body": "自动化测试用例之间应当相互独立，不依赖执行顺序与共享状态。", "code": "testA(); testB();   // 各自准备前置并清理", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "用例独立性是可重复、可并行、易定位失败的前提；应各自准备前置数据并清理，避免用例间通过数据库/全局变量形成隐性依赖。", "kaodian": "AI质量保障-自动化测试-用例独立性"}]}]}</script>

  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+esc(sec.name)+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+esc(q.kaodian)+'">'+esc(q.kaodian)+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):esc(q.body))+'</div>';
      if(q.code) html += '<div class="code">'+esc(q.code)+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+esc(q.explain)+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); if(new URLSearchParams(location.search).get('mode')==='wrong' && rec.wrong && rec.wrong.length){ toggleOnlyWrong(); } } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q._gno));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
