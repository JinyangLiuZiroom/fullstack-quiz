<style>

<script type="application/json" id="quizData">{"id": "vol01", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按「自如真卷 + 全栈认证大纲」重构：后端≈52%（缓存/Redis/MQ/MySQL/MyBatis-Plus/Spring/三层架构）、前端≈24%、测试≈24%。每题给代码/配置/日志片段，问执行结果 / 补全缺失代码 / 判断框架用法或架构规范正误。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "某 Service 中方法 A 标注 @Transactional，内部通过 this.methodB() 直接调用同类的 @Transactional 方法 B。方法 B 的事务会生效吗？", "code": "@Service\npublic class OrderService {\n  @Transactional\n  public void A() { this.B(); }   // 同类自调用\n  @Transactional\n  public void B() { /* 写库 */ }\n}", "options": [{"k": "A", "t": "生效，B 拥有独立事务"}, {"k": "B", "t": "不生效，自调用绕过 AOP 代理"}, {"k": "C", "t": "仅当 A 也开启事务时才生效"}, {"k": "D", "t": "编译报错，注解冲突"}], "answer": ["B"], "explain": "Spring 事务基于 AOP 动态代理，只有「外部通过代理对象」调用方法时才会织入事务切面。this.B() 是对象内部自调用，绕过代理，B 上的 @Transactional 完全不生效。A/C/D 均错：不会报错，也与 A 是否有事务无关。", "kaodian": "AI 后端能力 - 框架与中间件集成层 - Spring 事务与 AOP"}, {"no": 2, "type": "single", "body": "Cache-Aside（旁路缓存）读流程：先查缓存，未命中时应补全哪一步？", "code": "String getOrder(Long id) {\n  String cached = redis.get(\"order:\" + id);\n  if (cached != null) return cached;\n  // TODO 缓存未命中\n}", "options": [{"k": "A", "t": "直接 return null"}, {"k": "B", "t": "查数据库，写入缓存后再返回"}, {"k": "C", "t": "向上抛出缓存未命中异常"}, {"k": "D", "t": "返回数据库空对象但不写缓存"}], "answer": ["B"], "explain": "Cache-Aside 标准读路径：缓存命中直接返回；未命中则回源查 DB，把结果回填缓存（并设 TTL）再返回。A 错（丢数据）、C 错（不应抛异常）、D 错（不回填会导致下次仍击穿到 DB）。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存使用流程"}, {"no": 3, "type": "single", "body": "使用 RedisTemplate 实现分布式锁，下列写法语义等价于哪条 Redis 命令？", "code": "redisTemplate.opsForValue()\n  .setIfAbsent(\"lock:order\", token, 30, TimeUnit.SECONDS);", "options": [{"k": "A", "t": "SET lock:order token NX EX 30"}, {"k": "B", "t": "SET lock:order token XX"}, {"k": "C", "t": "SETEX lock:order 30 token"}, {"k": "D", "t": "SETNX lock:order token（无过期）"}], "answer": ["A"], "explain": "setIfAbsent(key, value, timeout, unit) 是原子操作，等价于 SET key value NX EX 30：仅当 key 不存在时设置，并带 30 秒过期。B 的 XX 表示 key 存在才设置（相反）；C 不设 NX 条件会覆盖已存在的锁；D 无过期易死锁。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 分布式锁"}, {"no": 4, "type": "single", "body": "RabbitMQ 消费者处理消息失败，希望消息进入死信队列（DLX）重试，应使用哪种否定确认？", "options": [{"k": "A", "t": "basicAck（确认）"}, {"k": "B", "t": "basicReject/requeue=false 或 basicNack"}, {"k": "C", "t": "basicPublish 重新发送"}, {"k": "D", "t": "channel.txCommit 提交事务"}], "answer": ["B"], "explain": "队列配置了 x-dead-letter-exchange 后，消费者用 basicReject(deliveryTag, false) 或 basicNack 且 requeue=false，消息会被路由到死信交换机进入死信队列。A 是正常 ack（消息删除）；C 是生产者侧 API；D 是事务提交，与死信无关。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息队列(RabbitMQ)", "code": null}, {"no": 5, "type": "single", "body": "Kafka 要保证「同一订单的状态变更」严格有序，生产者应如何发送？", "options": [{"k": "A", "t": "同一 orderId 使用相同 key 发送"}, {"k": "B", "t": "强制单分区 topic"}, {"k": "C", "t": "只用一个消费者"}, {"k": "D", "t": "acks=all 即可保证"}], "answer": ["A"], "explain": "Kafka 只保证「分区内」有序。相同 key（如 orderId）经默认分区器哈希到固定分区，从而保证该订单的所有消息落在同一分区、按发送顺序消费。B 过于浪费；C/D 与分区有序无关。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息队列(Kafka)", "code": null}, {"no": 6, "type": "single", "body": "表 orders(id, user_id, status, create_time)，有联合索引 idx_user(user_id, status)。执行 SELECT user_id, status FROM orders WHERE user_id = 1，该查询是否覆盖索引（无需回表）？", "options": [{"k": "A", "t": "是，查询列都在索引中，不需回表"}, {"k": "B", "t": "否，仍需回表取数据"}, {"k": "C", "t": "取决于数据量大小"}, {"k": "D", "t": "索引会失效，全表扫描"}], "answer": ["A"], "explain": "覆盖索引指「SELECT 的列 + WHERE 条件列」都包含在索引的叶子节点中。idx_user 含 (user_id, status)，查询只需这两列且满足最左前缀（user_id=1），因此可直接从索引取数，不需回表。B/C/D 均错。", "kaodian": "AI 后端能力 - 数据存储层 - MySQL 索引与事务", "code": null}, {"no": 7, "type": "single", "body": "MyBatis-Plus 中，下列 LambdaQueryWrapper 用法正确的是？", "code": "LambdaQueryWrapper&lt;User&gt; w = new LambdaQueryWrapper&lt;&gt;();\n// 补充条件：name = 'Tom'", "options": [{"k": "A", "t": "w.eq(User::getName, \"Tom\")"}, {"k": "B", "t": "w.eq(\"name\", \"Tom\")"}, {"k": "C", "t": "w.where(\"name = 'Tom'\")"}, {"k": "D", "t": "w.select(\"name = 'Tom'\")"}], "answer": ["A"], "explain": "LambdaQueryWrapper 使用「方法引用」User::getName 表示字段，编译期类型安全、重构友好。B 用字符串硬编码字段名（QueryWrapper 风格）；C/D 不是 MP 的条件 API。", "kaodian": "AI 后端能力 - 数据存储层 - MyBatis-Plus"}, {"no": 8, "type": "single", "body": "配置文件中写 order.max-count=100，代码用 @Value(\"${order.maxCount}\") 注入，启动结果是？", "options": [{"k": "A", "t": "正常注入 100"}, {"k": "B", "t": "启动报错：无法解析占位符 order.maxCount"}, {"k": "C", "t": "注入为 null"}, {"k": "D", "t": "注入为 0"}], "answer": ["B"], "explain": "@Value 不支持「松散绑定（relaxed binding）」，它按字面量匹配占位符。配置项是 kebab-case（max-count），代码写 camelCase（maxCount），两者不匹配，Spring 找不到该 key 而抛 IllegalArgumentException。应改用 @ConfigurationProperties（支持松散绑定）。", "kaodian": "AI 后端能力 - 框架与中间件集成层 - Spring 配置与 Bean", "code": null}, {"no": 9, "type": "single", "body": "Controller 直接注入 Mapper 并调用其方法完成数据操作，这主要违反了？", "options": [{"k": "A", "t": "单一职责原则"}, {"k": "B", "t": "三层架构分层规范（应经 Service 层）"}, {"k": "C", "t": "RESTful 接口规范"}, {"k": "D", "t": "HTTP 幂等规范"}], "answer": ["B"], "explain": "标准分层是 Controller→Service→Mapper。Controller 直调 Mapper 跳过了 Service 的业务逻辑、事务边界与复用，违背分层规范。A 也部分相关但不是核心；C/D 与此无关。", "kaodian": "AI 后端能力 - 架构与工程规范层 - 分层架构", "code": null}, {"no": 10, "type": "single", "body": "已加 @EnableAsync，本类方法 a() 调用本类标注 @Async 的方法 b()，但 b() 仍在调用线程同步执行。最可能的原因是？", "options": [{"k": "A", "t": "同类方法自调用，绕过异步代理"}, {"k": "B", "t": "返回值不是 Future 类型"}, {"k": "C", "t": "方法不是 public"}, {"k": "D", "t": "@Async 只能用于静态方法"}], "answer": ["A"], "explain": "@Async 同样基于 AOP 代理，同类内部 a() 调 b() 是 this 自调用，不走代理，因此不异步。B/C 不是此场景主因（public 非静态方法才能被代理，但题干已满足）；D 说法错误。", "kaodian": "AI 后端能力 - 框架与中间件集成层 - Spring 异步与调度", "code": null}, {"no": 11, "type": "single", "body": "Cache-Aside 写策略中，更新数据后应优先采用哪种方式以降低缓存与数据库不一致？", "options": [{"k": "A", "t": "先更新数据库，再删除缓存（可配合延时双删）"}, {"k": "B", "t": "先删除缓存，再更新数据库"}, {"k": "C", "t": "只更新数据库，保留旧缓存"}, {"k": "D", "t": "只删除缓存，不更新数据库"}], "answer": ["A"], "explain": "先更新 DB 再删缓存是 Cache-Aside 标准写策略（延迟双删可进一步降低并发不一致窗口）。B 在「删缓存后、更新 DB 前」若有读请求会回填旧值；C 缓存永远陈旧；D 数据丢失。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存一致性", "code": null}, {"no": 12, "type": "single", "body": "Vue3 中 const fullName = computed(() => user.first + user.last); 之后执行 fullName.value = 'x'，结果是？", "options": [{"k": "A", "t": "修改成功，视图刷新"}, {"k": "B", "t": "运行时报错：computed 默认只读"}, {"k": "C", "t": "静默失败，无副作用"}, {"k": "D", "t": "触发重新计算并覆盖"}], "answer": ["B"], "explain": "computed 默认只有 getter，是只读的，对其 .value 赋值会在开发环境抛错。要可写需定义带 get/set 的 writable computed。A/C/D 均错。", "kaodian": "AI 前端能力 - 前端框架与逻辑层 - Vue3 响应式", "code": null}, {"no": 13, "type": "single", "body": "flex 容器 width=400px，三个子项 flex-basis:100px，flex-grow:1:2:1，容器无 gap。第二项的最终宽度是？", "code": ".box{display:flex;width:400px}\n.item{flex-basis:100px}\n.a{flex-grow:1}.b{flex-grow:2}.c{flex-grow:1}", "options": [{"k": "A", "t": "100px"}, {"k": "B", "t": "133.33px"}, {"k": "C", "t": "150px"}, {"k": "D", "t": "200px"}], "answer": ["C"], "explain": "剩余空间 = 400 - 300(basis 总和) = 100px，按 grow 比例 1:2:1 分配：25/50/25。第二项 100+50=150px。A 忽略了 grow；B 误按 1:2:1 均分 100 给第二项得 133.33（比例算错）；D 算成 200。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 布局"}, {"no": 14, "type": "single", "body": "Axios 发送 GET 请求并携带查询参数，应配置哪个字段？", "options": [{"k": "A", "t": "config.data"}, {"k": "B", "t": "config.params"}, {"k": "C", "t": "config.body"}, {"k": "D", "t": "config.query"}], "answer": ["B"], "explain": "GET 请求的参数应放在 params（Axios 会拼到 URL query string）；data 用于 POST/PUT 等请求体。C/D 不是 Axios 配置项。", "kaodian": "AI 前端能力 - 前端框架与逻辑层 - Axios 请求", "code": null}, {"no": 15, "type": "single", "body": "执行下列代码，控制台输出顺序是？", "code": "console.log(1);\nsetTimeout(() => console.log(2), 0);\nPromise.resolve().then(() => console.log(3));\nconsole.log(4);", "options": [{"k": "A", "t": "1, 2, 3, 4"}, {"k": "B", "t": "1, 4, 3, 2"}, {"k": "C", "t": "1, 3, 4, 2"}, {"k": "D", "t": "1, 4, 2, 3"}], "answer": ["B"], "explain": "同步代码先执行：1、4。Promise.then 是微任务，在同步代码后、宏任务前执行：3。setTimeout 是宏任务，最后执行：2。故顺序 1,4,3,2。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 执行机制"}, {"no": 16, "type": "single", "body": "Vue3 中 v-model 在原生输入框上编译后等价于？", "options": [{"k": "A", "t": ":value + @input（或 :modelValue + @update:modelValue）"}, {"k": "B", "t": "v-bind + v-on:click"}, {"k": "C", "t": ":model + @change"}, {"k": "D", "t": "ref + watch 手动同步"}], "answer": ["A"], "explain": "v-model 是语法糖：在原生元素上编译为 :value 绑定 + @input 更新；在组件上编译为 :modelValue + @update:modelValue。B/C/D 都不是其等价展开。", "kaodian": "AI 前端能力 - 前端框架与逻辑层 - Vue3 双向绑定", "code": null}, {"no": 17, "type": "single", "body": "某接口 HTTP 返回 200，但响应体为 {\"code\":500,\"msg\":\"fail\"}。自动化接口测试断言应如何处理？", "options": [{"k": "A", "t": "断言 HTTP 200 即通过"}, {"k": "B", "t": "必须同时断言业务 code 字段"}, {"k": "C", "t": "忽略响应体"}, {"k": "D", "t": "仅断言响应耗时"}], "answer": ["B"], "explain": "HTTP 200 只表示「传输层/网关成功」，不代表业务成功。业务失败（code=500）必须断言响应体里的业务 code，否则会漏掉真实缺陷。A 错把传输成功当业务成功；C/D 不相关。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 接口测试", "code": null}, {"no": 18, "type": "single", "body": "修改了支付模块代码，回归测试应优先覆盖哪些范围？", "options": [{"k": "A", "t": "仅支付模块单元测试"}, {"k": "B", "t": "调用链下游（订单、对账、通知等受影响模块）"}, {"k": "C", "t": "仅前端页面样式"}, {"k": "D", "t": "随机挑选用例"}], "answer": ["B"], "explain": "回归测试的核心是「变更影响分析」：修改点不仅影响自身，更影响下游调用方。应优先覆盖支付模块的下游链路（订单、对账、通知）。A 太窄；C 与改动无关；D 无法保证覆盖。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 回归测试", "code": null}, {"no": 19, "type": "single", "body": "Playwright 中断言某元素文本为 'ok'，哪种写法最稳健、不易产生 flaky？", "options": [{"k": "A", "t": "立即断言 page.locator('.x').textContent() === 'ok'"}, {"k": "B", "t": "用 expect(locator).toHaveText('ok') 自动等待重试"}, {"k": "C", "t": "sleep(2000) 后再断言"}, {"k": "D", "t": "仅断言元素存在即可"}], "answer": ["B"], "explain": "expect().toHaveText 内置自动等待与轮询（web-first 断言），能容忍元素异步渲染，避免时序导致的 flaky。A 立即读取可能因未渲染而失败；C 魔法 sleep 不稳健；D 没验证文本。", "kaodian": "AI 质量保障 - 自动化测试与工具链 - 端到端自动化(Playwright)", "code": null}, {"no": 20, "type": "single", "body": "测试金字塔（测试蜂巢）建议的测试分布是？", "options": [{"k": "A", "t": "单元测试最多，UI/E2E 测试最少"}, {"k": "B", "t": "E2E 测试最多"}, {"k": "C", "t": "单元/集成/UI 三者数量相等"}, {"k": "D", "t": "只做接口测试"}], "answer": ["A"], "explain": "测试金字塔主张：底层单元测试数量最多（成本低、执行快、覆盖广），向上集成/接口次之，顶层 UI/E2E 最少而精（成本高、易碎）。B/C/D 都违背分层成本原则。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 测试金字塔", "code": null}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于缓存穿透、击穿、雪崩，下列应对正确的有哪些？（多选）", "code": null, "options": [{"k": "A", "t": "穿透：缓存空值 或 布隆过滤器拦截不存在的 key"}, {"k": "B", "t": "击穿：热点 key 用互斥锁/逻辑过期重建缓存"}, {"k": "C", "t": "雪崩：过期时间加随机值，避免同时失效"}, {"k": "D", "t": "穿透：直接查数据库且不缓存结果"}], "answer": ["A", "B", "C"], "explain": "A 正确：缓存空值/布隆过滤器可挡住对不存在 key 的穿透。B 正确：击穿是单个热点 key 失效瞬间高并发打到 DB，用互斥锁或逻辑过期保护。C 正确：雪崩是大量 key 同时过期，加随机 TTL 打散。D 错：穿透时不缓存会让每次都打 DB，正是要避免的。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存典型问题与防护"}, {"no": 2, "type": "multi", "body": "关于 Spring 事务传播行为，下列说法正确的有哪些？（多选）", "code": null, "options": [{"k": "A", "t": "REQUIRED：当前无事务则新建，有则加入"}, {"k": "B", "t": "REQUIRES_NEW：挂起当前事务，新建独立事务"}, {"k": "C", "t": "SUPPORTS：强制要求调用方必须存在事务"}, {"k": "D", "t": "NESTED：嵌套事务，内部回滚到保存点不影响外部"}], "answer": ["A", "B", "D"], "explain": "A 正确：REQUIRED 是最常用默认传播。B 正确：REQUIRES_NEW 挂起外层、另起事务，内外互不影响。D 正确：NESTED 用数据库保存点，内层回滚不影响外层已提交部分。C 错：SUPPORTS 是「有则加入、无则以非事务方式执行」，并不强制要求事务。", "kaodian": "AI 后端能力 - 框架与中间件集成层 - Spring 事务与 AOP"}, {"no": 3, "type": "multi", "body": "关于 MyBatis-Plus 更新字段策略，正确的有哪些？（多选）", "code": null, "options": [{"k": "A", "t": "默认策略 NOT_NULL：字段为 null 时不参与 UPDATE"}, {"k": "B", "t": "要把字段显式置 null，需用 FieldStrategy.IGNORED 或 LambdaUpdateWrapper.set(字段, null)"}, {"k": "C", "t": "逻辑删除可用 @TableLogic 注解实现"}, {"k": "D", "t": "updateById 会忽略所有字段，只更新主键"}], "answer": ["A", "B", "C"], "explain": "A 正确：MyBatis-Plus 默认 updateStrategy=NOT_NULL，null 字段不拼进 SQL。B 正确：要置 null 需 IGNORED 策略或用 LambdaUpdateWrapper.set(..., null) 强制。C 正确：@TableLogic 自动做逻辑删除（改 deleted 字段）。D 错：updateById 是按 id 更新非 null 字段，不是只更新主键。", "kaodian": "AI 后端能力 - 数据存储层 - MyBatis-Plus"}, {"no": 4, "type": "multi", "body": "关于 Kafka 消费者组（Consumer Group），正确的有哪些？（多选）", "code": null, "options": [{"k": "A", "t": "同组多个消费者按分区分配，一个分区只被组内一个消费者消费"}, {"k": "B", "t": "offset 可自动提交（enable.auto.commit）或手动 commitSync/commitAsync"}, {"k": "C", "t": "发生 rebalance 时分区会重新分配给消费者"}, {"k": "D", "t": "增加消费者数量可超过分区数来提升并行度"}], "answer": ["A", "B", "C"], "explain": "A 正确：消费者组实现队列模型，分区与消费者一一对应。B 正确：位移提交有自动与手动两种方式。C 正确：成员变更触发 rebalance 重分配。D 错：消费者数超过分区数时，多余消费者分不到分区而空闲，不能提升并行度。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息队列(Kafka)"}, {"no": 5, "type": "multi", "body": "关于 Vue3 响应式 API，正确的有哪些？（多选）", "code": null, "options": [{"k": "A", "t": "ref 用于基本类型，模板中自动解包"}, {"k": "B", "t": "reactive 返回对象的响应式代理"}, {"k": "C", "t": "shallowRef 只追踪 .value 的整体替换，不深度响应内部"}, {"k": "D", "t": "reactive 对象整体重新赋值会丢失响应性"}], "answer": ["A", "B", "C"], "explain": "A 正确：ref 包裹基本类型，模板自动解包。B 正确：reactive 返回 Proxy。C 正确：shallowRef 仅响应 .value 引用变化，不递归深层。D 错：reactive 对象整体重新赋值（如 Object.assign 或替换属性）仍可响应；但「把 reactive 变量重新指向新对象」要配合 ref 使用才稳。", "kaodian": "AI 前端能力 - 前端框架与逻辑层 - Vue3 响应式"}, {"no": 6, "type": "multi", "body": "回归测试用例筛选可依据哪些因素？（多选）", "code": null, "options": [{"k": "A", "t": "变更影响分析（调用链/依赖关系）"}, {"k": "B", "t": "历史缺陷集中模块优先"}, {"k": "C", "t": "需求/业务优先级"}, {"k": "D", "t": "完全随机抽选用例"}], "answer": ["A", "B", "C"], "explain": "A 正确：基于代码改动的影响面（调用链）筛选。B 正确：历史易错模块应重点回归。C 正确：核心业务优先级高。D 错：随机抽选无法保证关键路径覆盖，效率低且易漏测。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 回归测试"}, {"no": 7, "type": "multi", "body": "AI 辅助生成/分类测试数据时，可基于哪些方法？（多选）", "code": null, "options": [{"k": "A", "t": "等价类划分"}, {"k": "B", "t": "边界值分析"}, {"k": "C", "t": "业务场景聚类"}, {"k": "D", "t": "仅随机生成无分类"}], "answer": ["A", "B", "C"], "explain": "A/B/C 都是系统化测试数据设计方法，AI 可在其基础上做增强（如按场景聚类生成组合用例）。D 错：纯随机缺乏覆盖设计，达不到测试目标。", "kaodian": "AI 质量保障 - AI 辅助测试与质量体系 - 测试数据管理(TDM)"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "@Transactional(readOnly=true) 可提示 Spring/MySQL 做只读优化（如路由从库），说法正确吗？", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。readOnly=true 会让 Spring 把 JDBC Connection 设为只读，部分场景（如 JPA/多数据源只读路由）可据此优化或走从库；MySQL 本身也会做一定优化。", "kaodian": "AI 后端能力 - 框架与中间件集成层 - Spring 事务与 AOP"}, {"no": 2, "type": "judge", "body": "Nacos 配置中心默认使用 .properties 格式（而非 .yaml），说法正确吗？", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。Nacos 默认 file-extension 为 properties；若要用 YAML，需显式配置 file-extension: yaml 且 Data ID 带 .yaml 后缀。", "kaodian": "AI 后端能力 - 架构与工程规范层 - 配置中心(Nacos)"}, {"no": 3, "type": "judge", "body": "CORS 是浏览器的同源策略限制，服务端必须返回 Access-Control-Allow-Origin 等响应头才能放行跨域请求，说法正确吗？", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。CORS 由浏览器执行：跨域请求时浏览器检查响应头是否允许该源。服务端不返回允许头，浏览器就会拦截响应。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - 浏览器与 HTTP"}, {"no": 4, "type": "judge", "body": "Vite 开发服务器配置 server.proxy 可把前端请求代理到后端，从而解决开发期跨域问题，说法正确吗？", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。开发期浏览器同源限制导致前端直连后端跨域，Vite proxy 在 dev server 侧把 /api 转发到后端地址，对浏览器而言仍是同源，规避 CORS。", "kaodian": "AI 前端能力 - 前端工程化与构建 - Vite/构建工具"}, {"no": 5, "type": "judge", "body": "测试准入（进入测试的条件）与测试准出（退出/发布的标准）是测试管理的重要环节，说法正确吗？", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。准入如「冒烟测试通过方可进入系统测试」；准出如「致命/严重缺陷清零、缺陷收敛、覆盖率达标」方可发布。二者都是质量门禁。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 测试准入与准出"}, {"no": 6, "type": "judge", "body": "Apache JMeter 是常用的性能/压力测试工具，可用于接口与系统的并发压测，说法正确吗？", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。JMeter 支持 HTTP、FTP、JDBC、消息队列等多种协议的性能压测，能模拟并发并统计吞吐、响应时间、错误率。", "kaodian": "AI 质量保障 - 自动化测试与工具链 - 性能测试(JMeter)"}]}]}</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>

</body>
</html>
