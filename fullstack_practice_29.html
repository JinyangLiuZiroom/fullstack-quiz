<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;

  .container { max-width: 880px; margin: 0 auto; }

  .kaodian { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; background: #f0f2f5; color: #646a73; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .opt.wrong { background: #fff1f0; border-color: #ff4d4f; }

  .blank.wrong { border-bottom-color:#ff4d4f; background:#fff1f0; }

  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }
  .bar .userbox a { color:#1664ff; cursor:pointer; text-decoration:none; }
  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }
  .result-panel.show { display:block; }
  .result-panel .score { font-size:30px; font-weight:800; color:#1664ff; }
  .result-panel .score small { font-size:15px; color:#646a73; font-weight:500; }
  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }
  .result-panel .wrongs a { display:inline-block; margin:3px 6px 3px 0; padding:2px 8px; background:#fff1f0; color:#ff4d4f; border-radius:4px; text-decoration:none; font-weight:600; }
  @media (max-width:600px) {
    body { padding: 12px 12px 100px; }
    .container { max-width: 100%; }
    h1 { font-size: 20px; }

    .card { padding: 14px 12px; margin-bottom: 10px; }
    .q-body { font-size: 14px; }

    .opt { padding: 8px 10px; font-size: 13px; }

    .btn { padding: 7px 12px; font-size: 13px; }

<script type="application/json" id="quizData">{"id": "vol29", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "第 29 期 · 33 题（20单+7多+6判）· 11后端/11前端/11测试 · 均分对齐认证考 · 6 原型复刻（P1代码行为≈13 / P2逐条正误多选7 / P3找问题4 / P4用法正误4 / P5补全3 / P6计算2）· code覆盖率100% · 跨卷0重复 · 选项长度均衡", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "用 Redis Pipeline 一次性入队 1000 条 SET 再统一读取响应，关于它的语义，正确的是？", "code": "Jedis jedis = new Jedis(\"localhost\");\nPipeline p = jedis.pipelined();\nfor (int i = 0; i < 1000; i++) {\n    p.set(\"k:\" + i, \"v\" + i);   // 只是入队，尚未真正发送\n}\nList<Object> res = p.sync();    // 一次性发给服务端并等待全部响应", "options": [{"k": "A", "t": "把 1000 条命令合并为一次网络往返，但每条命令在服务端仍是逐条独立执行，且整体非原子"}, {"k": "B", "t": "这 1000 条命令在服务端被包裹进一个事务，要么全成功要么全失败"}, {"k": "C", "t": "Pipeline 会阻塞服务端，期间其他客户端的命令必须排队等待"}, {"k": "D", "t": "p.sync() 之前这些 key 已经写入 Redis，可随时被其他客户端读取"}], "answer": ["A"], "explain": "Pipeline 仅把多次命令合并为一次网络往返以减少 RTT，命令在服务端仍是逐条执行、彼此不保证原子；只有 EXEC 事务或 Lua 脚本才提供原子性。未 sync 前命令尚未发送，其他客户端读不到。", "kaodian": "AI后端能力-高并发与中间件层-RedisPipeline批量管道"}, {"no": 2, "type": "single", "body": "消费者开启手动 ACK 并设置 channel.basicQos(1)，意义是？", "code": "channel.basicQos(1);            // 预取上限\nchannel.basicConsume(queue, false, (tag, msg) -> {\n    // 处理业务\n    channel.basicAck(tag, false); // 手动确认\n}, consumerTag -> {});", "options": [{"k": "A", "t": "开启后所有消息都会先落盘再投递，以此防止消息丢失"}, {"k": "B", "t": "Broker 在收到上一条 ACK 前最多再缓冲 1 条，实现串行公平分发"}, {"k": "C", "t": "该队列被强制限速为每秒最多投递 1 条，其余全部丢弃"}, {"k": "D", "t": "消费者业务线程池被固定为 1，因此无法并发处理多条"}], "answer": ["B"], "explain": "basicQos(1) 设置 prefetchCount=1，配合手动 ACK，Broker 在收到上一条 ACK 前最多再缓冲 1 条，实现公平分发与串行消费，避免消息在忙碌消费者处堆积。它不影响投递速率、线程数或持久化。", "kaodian": "AI后端能力-高并发与中间件层-RabbitMQprefetch预取条数"}, {"no": 3, "type": "single", "body": "对大量设置了 TTL 的 key，Redis 内存为何没有在过期瞬间立即释放？", "code": "SET session:u1 data EX 30     // 30 秒后过期\n// 30 秒后没有任何客户端访问它\nINFO memory                  // used_memory 并未立刻下降", "options": [{"k": "A", "t": "Redis 固定每小时整点统一扫描并清理一次所有过期键"}, {"k": "B", "t": "只有执行 DEL 命令才能释放内存，过期并不会自动释放"}, {"k": "C", "t": "Redis 采用惰性删除加定期随机采样，过期键可能延迟清理"}, {"k": "D", "t": "TTL 只是逻辑标记，key 永远不会真正删除，只能被覆盖"}], "answer": ["C"], "explain": "Redis 过期删除是两种策略结合：惰性删除在键被访问时检查并删除；定期删除由后台周期性随机抽样一批带 TTL 的键删除。因此过期后若无人访问、又恰在抽样范围外，内存释放会滞后，并非立即。", "kaodian": "AI后端能力-高并发与中间件层-Redis惰性删除与定期删除"}, {"no": 4, "type": "single", "body": "表 id 为 INT 自增主键，当前最大 id 已达 2147483647。再执行 INSERT 会怎样？", "code": "CREATE TABLE t (\n  id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,\n  name VARCHAR(50)\n);\n-- 当前 AUTO_INCREMENT = 2147483647\nINSERT INTO t(name) VALUES ('x');  -- 还能成功吗？", "options": [{"k": "A", "t": "正常插入，id 自动升级为 8 字节 BIGINT 容纳更大数值"}, {"k": "B", "t": "正常插入后 id 从 1 重新开始循环并复用"}, {"k": "C", "t": "插入成功但 id 字段被置为 NULL 且不再自增"}, {"k": "D", "t": "插入失败，超过 INT 上限报 Out of range 或重复键错误"}], "answer": ["D"], "explain": "INT 最大值为 2147483647，达到上限后无法再分配新的自增值，继续 INSERT 会报 Out of range value 或 Duplicate entry 错误。应使用 BIGINT 预留空间。此外自增主键在事务回滚、批量插入后会产生空洞（值不回退）。", "kaodian": "AI后端能力-数据存储与ORM层-自增主键耗尽与空洞"}, {"no": 5, "type": "single", "body": "User 实体 deleted 字段标注 @TableLogic。执行 selectList 时实际 SQL 是？", "code": "@TableLogic\nprivate Integer deleted;\n\nList<User> list = userMapper.selectList(\n    new LambdaQueryWrapper<User>().eq(User::getName, \"tom\"));", "options": [{"k": "A", "t": "自动在 WHERE 后追加 deleted = 0，逻辑删除的数据不会被查出"}, {"k": "B", "t": "查询所有记录（含 deleted=1），由业务代码自行过滤"}, {"k": "C", "t": "自动追加 deleted IS NULL"}, {"k": "D", "t": "抛出缺少物理删除条件的异常，禁止查询"}], "answer": ["A"], "explain": "@TableLogic 让 MyBatis-Plus 在 select / update 时自动拼接逻辑删除条件（默认 deleted=0），查询自动排除已逻辑删除的数据，无需手写。插入时自动置 0，删除时改为 UPDATE ... SET deleted=1。", "kaodian": "AI后端能力-数据存储与ORM层-MP逻辑删除查询自动过滤"}, {"no": 6, "type": "single", "body": "执行下列语句，结果集的最后一行是？", "code": "SELECT category, COUNT(*) AS cnt\nFROM orders\nGROUP BY category WITH ROLLUP;", "options": [{"k": "A", "t": "报错，MySQL 不支持 WITH ROLLUP 语法"}, {"k": "B", "t": "多出一趟汇总行：category 为 NULL，cnt 为全部记录总数"}, {"k": "C", "t": "多出一趟汇总行：category 为 '总计'，cnt 为全部记录总数"}, {"k": "D", "t": "不会多出汇总行，WITH ROLLUP 仅影响排序"}], "answer": ["B"], "explain": "WITH ROLLUP 在分组结果上再生成更高层级的汇总行；最顶层的汇总行分组列（category）置为 NULL，聚合值（cnt）为全体合计。可用 COALESCE(category,'总计') 美化显示。", "kaodian": "AI后端能力-数据存储与ORM层-GROUPBYWITHROLLUP汇总行"}, {"no": 7, "type": "single", "body": "消费者在分区被回收前没有及时提交位移，导致重平衡后重复消费。问题出在哪？", "code": "consumer.subscribe(topics, new ConsumerRebalanceListener() {\n    public void onPartitionsRevoked(Collection<TopicPartition> p) {\n        // 此处未手动提交已处理位移\n    }\n    public void onPartitionsAssigned(Collection<TopicPartition> p) {}\n});\nwhile (true) {\n    poll(Duration.ofMillis(100));  // 依赖自动提交间隔\n}", "options": [{"k": "A", "t": "监听器参数顺序写反了，应把 assigned 回调放在前面"}, {"k": "B", "t": "每次重启 GROUP_ID 都变化，导致永远创建全新消费组"}, {"k": "C", "t": "revoked 回调没提交位移，分区交给他人后从旧位移重放导致重复"}, {"k": "D", "t": "问题在循环使用 poll，应当改用 seek 主动定位偏移量"}], "answer": ["C"], "explain": "再均衡发生时，被回收分区的消费者应先在 onPartitionsRevoked 中同步提交已处理的位移，否则自动提交（默认 5s 间隔）可能尚未提交，分区交给他人后从旧位移重放，导致重复消费。务必在 revoked 回调里 commitSync。", "kaodian": "AI后端能力-高并发与中间件层-Kafka再均衡监听提交位移"}, {"no": 8, "type": "single", "body": "三个 flex item 的 order 分别为 2、1、3，默认 flex-direction:row 下，页面从左到右的视觉顺序是？", "code": "<div style=\"display:flex\">\n  <div style=\"order:2\">A</div>\n  <div style=\"order:1\">B</div>\n  <div style=\"order:3\">C</div>\n</div>", "options": [{"k": "A", "t": "按 DOM 文档顺序渲染为 A、B、C"}, {"k": "B", "t": "按 order 降序渲染为 C、B、A"}, {"k": "C", "t": "顺序随机，order 属性不影响任何布局"}, {"k": "D", "t": "按 order 升序为 B、A、C，与 DOM 文档顺序无关"}], "answer": ["D"], "explain": "Flex 的 order 属性改变的是视觉/排版顺序，数值小的排前面；相同 order 才按 DOM 顺序。它不改变 DOM，也不影响无障碍朗读顺序（屏幕阅读器仍按 DOM）。此处为 A(1)、D(2)、B(3)。", "kaodian": "AI前端能力-前端基础与渲染引擎-Flexorder重排视觉顺序"}, {"no": 9, "type": "single", "body": "给元素设 position:sticky 但没写 top，滚动时为何不吸顶？", "code": ".header { position: sticky; /* 缺少 top 等阈值 */ }\n/* 父容器可滚动 */", "options": [{"k": "A", "t": "必须指定 top 等阈值，否则不触发吸附退化为普通定位"}, {"k": "B", "t": "必须依赖 position:relative 父元素，否则立即失效"}, {"k": "C", "t": "必须配合 z-index 一起使用才会生效"}, {"k": "D", "t": "桌面浏览器都不支持，必须用 JS 滚动模拟"}], "answer": ["A"], "explain": "position:sticky 是相对定位与固定定位的混合，必须指定一个粘性阈值（top/bottom/left/right 之一）才会触发吸附；缺省时表现为普通流内定位，不会吸顶。它也不能跨越可滚动祖先的边界生效。", "kaodian": "AI前端能力-前端基础与渲染引擎-sticky阈值与滚动容器"}, {"no": 10, "type": "single", "body": "模板引用 el 在 v-if 为 false 时，组件 setup 阶段访问 el.value 得到什么？", "code": "const el = ref(null);\nonMounted(() => {\n  console.log(el.value); // 这里打印什么？\n});", "options": [{"k": "A", "t": "返回一个 Proxy 包装的响应式对象"}, {"k": "B", "t": "show=false 时 el.value 为 null"}, {"k": "C", "t": "始终指向包含该段落的真实 DOM 元素"}, {"k": "D", "t": "返回一个空字符串而不是元素"}], "answer": ["B"], "explain": "v-if 为 false 时子树不渲染，ref 没有可绑定的真实节点，el.value 保持初始 null。只有当 show 为 true 且节点挂载后，el.value 才指向 DOM。访问模板引用应在 onMounted 且确保对应节点已渲染。", "kaodian": "AI前端能力-前端基础与渲染引擎-Vue3ref条件渲染null"}, {"no": 11, "type": "single", "body": "为什么要优先用 Object.hasOwn(obj,'x') 而不是 obj.hasOwnProperty('x')？", "code": "const o = { hasOwnProperty: () => true }; // 原型/自身被覆盖\nconsole.log(o.hasOwnProperty('x')); // 不可靠\nconsole.log(Object.hasOwn(o, 'x')); // 可靠", "options": [{"k": "A", "t": "hasOwn 性能比 hasOwnProperty 慢大约十倍"}, {"k": "B", "t": "两者完全等价，仅是写法不同的语法糖"}, {"k": "C", "t": "hasOwnProperty 可被覆盖失灵，hasOwn 静态方法不受影响"}, {"k": "D", "t": "hasOwnProperty 只查自有属性，hasOwn 还能查继承属性"}], "answer": ["C"], "explain": "hasOwnProperty 是实例方法，可被对象自身属性或原型链上的同名方法覆盖，导致判断失真；Object.hasOwn 是 Object 上的静态方法，直接基于内部槽判断，安全且不受对象内容影响，是推荐写法。", "kaodian": "AI前端能力-语言与运行时-ObjecthasOwn避免原型污染"}, {"no": 12, "type": "single", "body": "下列 Promise 链最终 .then 拿到的值是什么？", "code": "Promise.resolve(1)\n  .then(x => x + 1)        // 返回普通数字\n  .then(x => { return x * 2; })\n  .then(x => console.log(x));", "options": [{"k": "A", "t": "2（.then 返回普通值也被包装成 Promise，但只执行一次）"}, {"k": "B", "t": "NaN"}, {"k": "C", "t": "undefined"}, {"k": "D", "t": "4（2 先算出 2，再乘以 2 = 4）"}], "answer": ["D"], "explain": "then 的回调若返回非 Promise 值，会被自动包装为已决议的 Promise 传给下一个 then。链路：1 变 2 再乘以 2 = 4，最后打印 4。每一步的返回值都会被规范化后再进入下一环。", "kaodian": "AI前端能力-语言与运行时-Promise链式返回自动包装"}, {"no": 13, "type": "single", "body": "用 Axios 上传文件时，为什么不能让 transformRequest 把它转成 JSON？", "code": "const fd = new FormData();\nfd.append('file', file);\naxios.post('/upload', fd, {\n  headers: { 'Content-Type': 'multipart/form-data' }\n});", "options": [{"k": "A", "t": "Axios 跳过 FormData 原样 multipart 发送，JSON 化会破坏上传"}, {"k": "B", "t": "FormData 会被自动转成 JSON 字符串再发送"}, {"k": "C", "t": "必须手动 JSON.stringify(fd) 才能正确上传"}, {"k": "D", "t": "Axios 不支持 FormData，只能改用 fetch"}], "answer": ["A"], "explain": "Axios 的默认 transformRequest 对 FormData、URLSearchParams 等类型直接放行（不做 JSON 序列化），保留 multipart/form-data 边界与二进制内容。若手动覆盖 transformRequest 并 JSON 序列化，会破坏文件上传。注意不要自己设置成 application/json。", "kaodian": "AI前端能力-网络与BFF架构-AxiosFormData不序列化"}, {"no": 14, "type": "single", "body": "容器宽 500px，三个子项 flex-basis 均为 100px，flex-grow 分别为 1:2:1，flex-shrink 为 0。最终三者的宽度是？", "code": ".container { display:flex; width:500px; }\n.item1 { flex: 1 0 100px; }\n.item2 { flex: 2 0 100px; }\n.item3 { flex: 1 0 100px; }", "options": [{"k": "A", "t": "200px / 100px / 200px"}, {"k": "B", "t": "150px / 200px / 150px（剩余 200px 按 grow 1:2:1 分配）"}, {"k": "C", "t": "100px / 100px / 100px（basis 已占满，不分配剩余）"}, {"k": "D", "t": "125px / 250px / 125px（按 1:2:1 平分 500px）"}], "answer": ["B"], "explain": "三子项 basis 合计 300px，容器 500px，剩余空间 200px；shrink=0 不收缩，剩余按 grow 权重 1:2:1 分配（50/100/50），故宽度 150/200/150。", "kaodian": "AI前端能力-前端基础与渲染引擎-Flex弹性增长加权计算"}, {"no": 15, "type": "single", "body": "下列接口测试用例的问题在哪？", "code": "// 登录接口，正确账号应返回业务 code=0，错误账号 code=1001\ntest('登录错误账号返回', async () => {\n  const res = await axios.post('/login', { user:'wrong', pwd:'x' });\n  expect(res.status).toBe(200);   // 仅断言 HTTP 状态\n});", "options": [{"k": "A", "t": "没有断言响应时间是否超时"}, {"k": "B", "t": "axios 不能用于测试，必须改用 fetch"}, {"k": "C", "t": "只断言 200 忽略业务 code，业务失败也通过形成假绿"}, {"k": "D", "t": "应该断言 res.data 而不是 res.status 字段"}], "answer": ["C"], "explain": "接口可能在 HTTP 200 下返回业务失败（code 不为 0）。只断言状态码忽略了业务语义，错误结果也会被判定通过，形成假绿用例。应同时断言 HTTP 状态与业务 code/数据结构。", "kaodian": "AI质量保障-接口测试-仅断言HTTP状态忽略业务code"}, {"no": 16, "type": "single", "body": "用 AI 生成一批测试数据与预期结果，直接用于回归，风险是？", "code": "// AI 生成：输入 [1,2,3] -> 预期输出 [1,2,3]（某去重函数）\n// 实际该函数对 [1,1,2] 应返回 [1,2]\nconst cases = aiGeneratedCases; // 含预期结果", "options": [{"k": "A", "t": "AI 生成数据一定比人工慢，应当全部手写"}, {"k": "B", "t": "AI 无法生成边界用例，所以无需关注"}, {"k": "C", "t": "预期结果由 AI 给出即可，无需再复核"}, {"k": "D", "t": "AI 预期可能理解偏差，直接采用会引入错误基线需复核"}], "answer": ["D"], "explain": "AI 造数能提升效率，但它对隐式业务规则、边界与异常的理解可能偏差，生成的预期结果未必正确。若直接当作基线，错误预期会污染回归判定。必须由人工复核关键预期，尤其边界与异常路径。", "kaodian": "AI质量保障-AI辅助测试-AI造数预期需复核"}, {"no": 17, "type": "single", "body": "验证一个下单接口是否幂等，正确做法是？", "code": "// 同一笔订单（相同 bizId/请求号）连续提交两次\nPOST /order  { bizId: 'u-1001', item: 'A' }\nPOST /order  { bizId: 'u-1001', item: 'A' }", "options": [{"k": "A", "t": "相同业务键重复发两次，结果一致且只落一条才算幂等"}, {"k": "B", "t": "只发送一次请求成功，就认为接口是幂等的"}, {"k": "C", "t": "并发发送一千次不同业务键看是否超时"}, {"k": "D", "t": "幂等只看接口是否返回 HTTP 200 状态码"}], "answer": ["A"], "explain": "幂等指相同请求重复执行结果一致、不产生副作用叠加。验证必须用相同业务键重复提交，并检查结果一致 + 副作用唯一（只创建一条）。仅靠单次 200 或并发压测无法证明幂等。", "kaodian": "AI质量保障-接口测试-幂等靠重复请求验证"}, {"no": 18, "type": "single", "body": "补全 JUnit5 参数化测试，使 test 对 1、2、3 各跑一次：", "code": "____                       // 标记参数化测试\n____({1, 2, 3})            // 提供参数源\nvoid test(int n) {\n    assertTrue(n > 0);\n}", "options": [{"k": "A", "t": "@ParameterizedTest 与 @MockSource"}, {"k": "B", "t": "@ParameterizedTest 与 @ValueSource"}, {"k": "C", "t": "@Test 与 @DataSource"}, {"k": "D", "t": "@RepeatedTest(3) 与 @ValueSource"}], "answer": ["B"], "explain": "JUnit5 参数化测试用 @ParameterizedTest 标记方法，并配合 @ValueSource 等提供参数源；@ValueSource(ints={1,2,3}) 会让该测试方法对三个值各执行一次。@Test 不支持参数源，@RepeatedTest 是重复执行而非传参。", "kaodian": "AI质量保障-自动化测试-JUnit5参数化注解补全"}, {"no": 19, "type": "single", "body": "补全 Playwright 的代码，使其在按钮可见后再断言文本（自动等待，避免硬等待）：", "code": "await ____(page.getByRole('button', { name: '提交' }))\n    .____();   // 断言元素可见", "options": [{"k": "A", "t": "page.waitForTimeout 与 textContent()"}, {"k": "B", "t": "locator 与 count()"}, {"k": "C", "t": "expect 与 toBeVisible()"}, {"k": "D", "t": "waitFor 与 isVisible()"}], "answer": ["C"], "explain": "Playwright 推荐用 expect(locator).toBeVisible() 这类自动等待断言，框架会在超时内轮询直到元素可见或超时，无需手写 waitForTimeout。硬等待（waitForTimeout）是反模式，易 flaky。", "kaodian": "AI质量保障-自动化测试-Playwright自动等待可见断言"}, {"no": 20, "type": "single", "body": "补全 Axios 请求拦截器，为每个请求自动带上登录 token：", "code": "axios.interceptors.request.use(config => {\n    const token = localStorage.getItem('token');\n    if (token) {\n        config.headers.____ = 'Bearer ' + token;  // 补全\n    }\n    return config;\n});", "options": [{"k": "A", "t": "Authentication"}, {"k": "B", "t": "Token"}, {"k": "C", "t": "X-Auth"}, {"k": "D", "t": "Authorization"}], "answer": ["D"], "explain": "标准做法是在请求拦截器里向 config.headers.Authorization 注入 Bearer token，后端据此鉴权。Authentication 非标准头名，Token/X-Auth 多为自定义约定，优先遵循 Authorization 规范。", "kaodian": "AI质量保障-接口测试-请求拦截注入Authorization"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "以下关于 Spring @Transactional 是否生效的论断，哪些是正确的？（逐条判断）", "code": "@Service\npublic class OrderService {\n    @Transactional\n    public void a() { b(); }          // 同类调用\n\n    @Transactional\n    public void b() { /* 写库 */ }\n\n    @Transactional\n    private void c() {                // private 方法\n        /* 写库 */\n    }\n}", "options": [{"k": "A", "t": "同类内 a() 直接调用 b()，b() 的事务不生效（未经过代理）"}, {"k": "B", "t": "把 b() 标成 private 后，事务依然通过 CGLIB 代理生效"}, {"k": "C", "t": "方法抛出未被捕获的 RuntimeException，默认会回滚"}, {"k": "D", "t": "方法内部用 try-catch 吞掉异常，事务仍会回滚"}], "answer": ["A", "C"], "explain": "1. A 正确：同类方法互相调用绕过了代理，@Transactional 失效。2. B 错误：Spring 事务基于 AOP 代理，只增强 public 方法，private 方法上的注解不生效。3. C 正确：默认只对 RuntimeException/Error 回滚。4. D 错误：异常被 catch 吞掉后没有抛出到代理，事务不会回滚。", "kaodian": "AI后端能力-应用框架层-Transactional失效场景逐条判定"}, {"no": 2, "type": "multi", "body": "下列场景的数据结构选型，哪些是正确的？（逐条判断）", "code": "场景A：用户每日签到，统计月活\n场景B：商品详情页实时点赞数\n场景C：延迟队列（30 分钟后取消订单）\n场景D：排行榜 Top100 实时刷新", "options": [{"k": "A", "t": "场景A 用 Bitmap（SETBIT 记录每天签到，BITCOUNT 统计月活）"}, {"k": "B", "t": "场景B 用 String 的 INCR 自增计数最合适"}, {"k": "C", "t": "场景C 用 ZSET 按分值为时间戳轮询实现延迟队列"}, {"k": "D", "t": "场景D 用 Hash 存储排行榜 Top100"}], "answer": ["A", "B", "C"], "explain": "1. A 正确：Bitmap 极省空间，适合海量用户的签到/在线位图统计。2. B 正确：单值计数用 String(INCR) 原子且简单。3. C 正确：延迟队列用 ZSET（score=执行时间戳）轮询或 RabbitMQ 死信/TTL 实现。4. D 错误：排行榜用有序集合 ZSET 而非 Hash（Hash 无序）。", "kaodian": "AI后端能力-高并发与中间件层-Redis数据结构选型逐条判定"}, {"no": 3, "type": "multi", "body": "为保证 Kafka 消息不丢，下列论断哪些正确？（逐条判断）", "code": "// 生产者\nprops.put(\"acks\", \"all\");\nprops.put(\"enable.idempotence\", true);\n// 服务端\n// default.replication.factor >= 3, min.insync.replicas = 2\n// 消费者\nwhile(true){\n    var rs = consumer.poll(Duration.ofMillis(100));\n    for (var r : rs) { process(r); }\n    consumer.commitSync();   // 处理完才提交\n}", "options": [{"k": "A", "t": "生产者 acks=all 且 min.insync.replicas=2，可避免 Leader 未同步就返回成功导致丢消息"}, {"k": "B", "t": "enable.idempotence=true 能防止生产者重试造成的消息重复"}, {"k": "C", "t": "消费者先 commitSync 再 process，能保证至少一次且不丢"}, {"k": "D", "t": "消费者处理完再 commitSync，配合手动提交可做到不丢（幂等消费防重复）"}], "answer": ["A", "B", "D"], "explain": "1. A 正确：acks=all 要求 ISR 全部确认，min.insync.replicas=2 保证至少 2 副本写入，避免单点丢。2. B 正确：幂等生产者用 PID+序列号去重，防止重试导致重复。3. C 错误：先提交后处理，若提交后崩溃，消息被标记为已消费但没处理，造成丢失；应处理完再提交。4. D 正确：处理完提交 + 幂等消费可做到可靠。", "kaodian": "AI后端能力-高并发与中间件层-Kafka可靠性环节逐条判定"}, {"no": 4, "type": "multi", "body": "以下关于 Vue3 响应式丢失的论断，哪些正确？（逐条判断）", "code": "const state = reactive({ count: 0 });\nlet { count } = state;            // 解构\nconst plain = { n: state.count }; // 普通对象引用", "options": [{"k": "A", "t": "解构出的 count 只是当前值的副本，后续 state.count 变化不会驱动视图更新"}, {"k": "B", "t": "把基本类型放进普通对象 { n: state.count }，n 仍是响应式的"}, {"k": "C", "t": "用 toRef(state,'count') 解构可保持响应式同步"}, {"k": "D", "t": "reactive 对象属性（state.count = 1）的修改是响应式的，能触发视图更新"}], "answer": ["A", "C", "D"], "explain": "1. A 正确：reactive 解构基本类型会丢失响应式。2. B 错误：普通对象的属性不经过 reactive 代理，不具响应式。3. C 正确：toRef/toRefs 能保持与源对象的响应式链接。4. D 正确：reactive 对象自身的属性修改是响应式的。", "kaodian": "AI前端能力-语言与运行时-Vue3响应式丢失陷阱逐条判定"}, {"no": 5, "type": "multi", "body": "以下关于跨域（CORS）解决方案的论断，哪些正确？（逐条判断）", "code": "// 前端 http://a.com 请求 http://b.com/api\n// 浏览器同源策略拦截", "options": [{"k": "A", "t": "开发环境可用 Vite 的 server.proxy 把 /api 代理到 b.com，绕过浏览器同源限制"}, {"k": "B", "t": "后端加 Access-Control-Allow-Origin: * 即可支持带凭证（cookie）的跨域请求"}, {"k": "C", "t": "JSONP 可发起带自定义请求头的跨域请求"}, {"k": "D", "t": "Nginx 反向代理让前后端同域，是生产常用方案"}], "answer": ["A", "D"], "explain": "1. A 正确：开发代理在服务端转发，浏览器只同源请求 dev server。2. B 错误：携带凭证时 Allow-Origin 必须是明确源且配合 Allow-Credentials，不能用通配 *。3. C 错误：JSONP 利用 script 标签，只能 GET、不能自定义头/方法。4. D 正确：反向代理同源化是生产稳妥方案。", "kaodian": "AI前端能力-网络与BFF架构-CORS跨域方案逐条判定"}, {"no": 6, "type": "multi", "body": "筛选回归测试用例时，下列维度哪些应当纳入？（逐条判断）", "code": "// 本次需求：订单服务增加优惠券核销", "options": [{"k": "A", "t": "代码变更影响范围（被修改/依赖的模块）"}, {"k": "B", "t": "历史高频缺陷模块"}, {"k": "C", "t": "业务核心且与资损相关的链路"}, {"k": "D", "t": "仅按测试用例的执行时长从短到长选"}], "answer": ["A", "B", "C"], "explain": "1. A 正确：影响分析是回归筛选首要依据。2. B 正确：历史易错模块应纳入回归。3. C 正确：核心/资损链路不可遗漏。4. D 错误：执行时长与是否需要回归无关，不能作为筛选标准。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归筛选多维逐条判定"}, {"no": 7, "type": "multi", "body": "一个合格的 CI 质量门禁通常应包含哪些要素？（逐条判断）", "code": "// pipeline 在合并前执行", "options": [{"k": "A", "t": "单元测试与覆盖率阈值"}, {"k": "B", "t": "静态代码扫描（如 Sonar / lint）"}, {"k": "C", "t": "类型检查（如 tsc --noEmit / 编译）"}, {"k": "D", "t": "门禁不达标时阻断合并，防止劣质代码流入"}], "answer": ["A", "B", "C", "D"], "explain": "1. A 正确：单测+覆盖率门禁是质量基线。2. B 正确：静态扫描发现潜在缺陷与坏味道。3. C 正确：类型/编译检查防止低级错误合入。4. D 正确：门禁的价值在于不达标即阻断合并，仅打印警告等于形同虚设。", "kaodian": "AI质量保障-CI/CD与质量门禁-质量门禁构成逐条判定"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "在 placeOrder 中，inventoryMapper.decrease() 抛出的异常即便被 try-catch 捕获且未重新抛出，order 的 insert 也会随事务一起回滚。", "code": "@Transactional\npublic void placeOrder() {\n    orderMapper.insert(order);\n    try {\n        inventoryMapper.decrease(stock); // 这里抛 RuntimeException\n    } catch (Exception e) {\n        log.error(\"库存扣减失败\", e);     // 吞掉异常\n    }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "@Transactional 只在异常抛出到代理层时才触发回滚。这里 decrease 抛出的异常被 try-catch 吞掉，没有向外传播，代理认为方法正常结束，事务提交，order 的 insert 不会回滚，造成数据不一致。需在 catch 中手动 setRollbackOnly 或重新抛出。", "kaodian": "AI后端能力-应用框架层-Transactional异常被捕获不回滚"}, {"no": 2, "type": "judge", "body": "对元素使用 transform: translateX(10px) 或改变 opacity 来制作动画时，浏览器会触发重排（layout）。", "code": ".box { transition: transform .3s, opacity .3s; }\n.box.move { transform: translateX(10px); opacity: .5; }", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "transform 与 opacity 属于可合成属性，浏览器尽量在合成线程处理，不触发 layout（重排）与 paint（重绘），仅做 composite，性能开销低。这也是动画优先用 transform/opacity 的原因。", "kaodian": "AI前端能力-前端基础与渲染引擎-transform不触发重排"}, {"no": 3, "type": "judge", "body": "在 http:// 明文站点（非 localhost）也可以正常注册 Service Worker 并用于离线缓存与请求拦截。", "code": "navigator.serviceWorker.register('/sw.js')\n  .then(() => console.log('registered'))\n  .catch(e => console.log(e));", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "Service Worker 出于安全考虑，要求页面处于安全上下文（HTTPS 或 localhost）。在普通 http 站点注册会直接失败（SecurityError），无法用它做离线缓存与拦截。", "kaodian": "AI前端能力-前端生态-ServiceWorker需安全上下文"}, {"no": 4, "type": "judge", "body": "多个集成测试共享同一测试库且不在用例间清理数据，是造成数据串扰、导致 CI 偶发失败而本地常通过的典型根因。", "code": "// 多个测试共连同一 test 库，直接在库里读写业务表，彼此不清理\n@BeforeEach void setUp(){ /* 无数据清理 */ }\n@Test void t1(){ insertOrder(); ... }\n@Test void t2(){ insertOrder(); ... } // 与 t1 共享表", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "测试用例必须相互独立、可重复。共享库且不清理会造成数据串扰，CI 并行/乱序执行时尤其明显，本地顺序跑却可能通过。应每用例前后清理，或使用独立 schema/事务回滚隔离。", "kaodian": "AI质量保障-自动化测试-共享数据库致用例偶发失败"}, {"no": 5, "type": "judge", "body": "回归测试必须对全部用例做全量重跑，才能确保改动没有破坏既有功能。", "code": "// 本次仅修改了订单导出模块", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "回归测试目标是验证改动未破坏既有功能。全量重跑成本高、慢；应通过影响分析（代码依赖、历史缺陷、业务风险）精准筛选用例，覆盖核心与高风险链路，兼顾效率与信心。说必须全量重跑是不对的。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归不必全量重跑"}, {"no": 6, "type": "judge", "body": "缺陷的严重度（Severity）与优先级（Priority）是两个不同维度，高严重度的问题其优先级未必最高。", "code": "// 例：偶现的崩溃（严重度高）但影响用户极少", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "严重度描述缺陷造成的危害程度（如崩溃/数据丢失），优先级决定修复先后顺序，受发生概率、业务价值、排期影响。高严重但极低概率的问题，优先级未必最高；反之低严重但高频阻塞的问题优先级可能很高。两者是不同维度，可不一致。", "kaodian": "AI质量保障-软件测试理论与质量体系-严重度优先级分离"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
const esc = s => (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+esc(o.t)+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+esc(sec.name)+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+esc(q.kaodian)+'">'+esc(q.kaodian)+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):esc(q.body))+'</div>';
      if(q.code) html += '<div class="code">'+esc(q.code)+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+esc(q.explain)+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
