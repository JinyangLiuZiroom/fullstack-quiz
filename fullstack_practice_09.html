<script type="application/json" id="quizData">{"id": "vol09", "title": "全栈转型模拟自测卷", "sub": "可答题 · 交卷判分 · 自动记录错题", "meta": "对齐公司真实考法：<b>单选 / 多选 / 判断</b>，每题包含完整代码场景，问执行结果、补全代码、判断框架用法正误。<br>本卷共 <b>33 题</b>：单选 20（60 分）+ 多选 7（28 分）+ 判断 6（12 分）= 100 分。<br>难度：<b>实战细节型</b>，考点标签采用公司标准层级命名。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "以下代码的输出是？", "code": "Queue<Integer> q = new PriorityQueue<>();\nq.offer(3); q.offer(1); q.offer(2);\nStringBuilder it = new StringBuilder();\nfor (Integer x : q) it.append(x);\nStringBuilder poll = new StringBuilder();\nwhile (!q.isEmpty()) poll.append(q.poll());\nSystem.out.println(it + \" \" + poll);", "options": [{"k": "A", "t": "123 123"}, {"k": "B", "t": "132 123"}, {"k": "C", "t": "312 312"}, {"k": "D", "t": "123 132"}], "answer": ["B"], "explain": "PriorityQueue 底层是<b>二叉小顶堆</b>，只保证堆顶最小，<b>迭代器遍历顺序是堆数组的物理顺序，不是升序</b>。依次 offer 3/1/2 后堆数组为 [1,3,2]，所以 for-each 输出 132；而 <code>poll()</code> 每次取堆顶并重新调整，才能得到有序的 123。要有序遍历必须连续 poll 或先转数组排序。", "android": "类似 Android 里 SparseArray 的内部存储顺序与你 put 的顺序无关——遍历内部结构 ≠ 拿到业务上想要的顺序，取数要走它提供的正规接口。", "kaodian": "AI 后端能力 - 语言基础层 - PriorityQueue"}, {"no": 2, "type": "single", "body": "以下代码的输出是？", "code": "String s = \"a,b,,c,,,\";\nSystem.out.println(s.split(\",\").length);", "options": [{"k": "A", "t": "7"}, {"k": "B", "t": "6"}, {"k": "C", "t": "4"}, {"k": "D", "t": "3"}], "answer": ["C"], "explain": "<code>split(regex)</code> 等价于 <code>split(regex, 0)</code>，limit=0 时会<b>删除结果末尾的所有空字符串</b>。\"a,b,,c,,,\" 按逗号切开是 [a, b, \"\", c, \"\", \"\", \"\"]，去掉末尾连续空串后剩 [a, b, \"\", c]，长度 4。注意<b>中间的空串会保留</b>。若想保留末尾空串需用 <code>split(\",\", -1)</code>。", "android": "解析服务端下发的 CSV 配置串时这是经典线上坑：末尾空字段被吃掉导致数组越界。Android 里处理 getStringExtra 拿到的拼接串同理，建议显式传 limit=-1。", "kaodian": "AI 后端能力 - 语言基础层 - String.split 细节"}, {"no": 3, "type": "single", "body": "以下代码的输出是？", "code": "LocalDate d = LocalDate.of(2026, 7, 29);\nd.plusDays(3);\nd = d.withDayOfMonth(1);\nSystem.out.println(d);", "options": [{"k": "A", "t": "2026-08-01"}, {"k": "B", "t": "2026-07-01"}, {"k": "C", "t": "2026-07-29"}, {"k": "D", "t": "2026-08-04"}], "answer": ["B"], "explain": "java.time 所有类型（LocalDate/LocalDateTime 等）都是<b>不可变对象</b>，<code>plusDays(3)</code> 返回一个新对象，原 d 不变——这里返回值被丢弃，等于没加。随后 <code>withDayOfMonth(1)</code> 的返回值被重新赋给 d，所以结果是 2026-07-01。链式修改必须始终接收返回值。", "android": "和 Kotlin 的 String/不可变 data class 一样：copy() 出来的新对象不赋值就丢了。Android 里用 ThreeTenABP/java.time 处理日期时同样要接返回值。", "kaodian": "AI 后端能力 - 语言基础层 - java.time 不可变性"}, {"no": 4, "type": "single", "body": "以下代码运行会发生什么？", "code": "Thread t = new Thread(() -> System.out.println(\"run\"));\nt.start();\nt.start();", "options": [{"k": "A", "t": "输出两次 run"}, {"k": "B", "t": "输出一次 run，第二次 start() 被静默忽略"}, {"k": "C", "t": "输出一次 run，第二次 start() 抛出 IllegalThreadStateException"}, {"k": "D", "t": "编译报错"}], "answer": ["C"], "explain": "一个 Thread 对象<b>只能 start 一次</b>。start() 内部检查 threadStatus，线程已启动（或已结束）后再次调用会抛 <code>IllegalThreadStateException</code>。第一次 start 正常异步执行输出 run。若想再次执行任务，应新建 Thread 或交给线程池复用工作线程。", "android": "和 Android 里一个 HandlerThread 不能 start 两次、一个 AsyncTask 实例不能 execute 两次是同一个设计：生命周期一次性。", "kaodian": "AI 后端能力 - 语言基础层 - 线程生命周期"}, {"no": 5, "type": "single", "body": "以下代码运行会发生什么？", "code": "Map<String, String> m = new ConcurrentHashMap<>();\nm.put(\"k\", null);\nSystem.out.println(m.get(\"k\"));", "options": [{"k": "A", "t": "输出 null"}, {"k": "B", "t": "put 时抛出 NullPointerException"}, {"k": "C", "t": "输出空字符串"}, {"k": "D", "t": "get 时抛出 NullPointerException"}], "answer": ["B"], "explain": "ConcurrentHashMap <b>不允许 null 键和 null 值</b>，put(null) 或 put(k, null) 直接抛 NPE。原因：并发场景下 get 返回 null 无法区分「key 不存在」还是「值就是 null」，无法再用 containsKey 二次确认（两次调用之间可能被其他线程修改）。HashMap 单线程可用 containsKey 消歧，所以允许 null。", "android": "类似 Kotlin 用可空类型 String? 逼你在编译期处理歧义——并发容器干脆禁掉 null，把歧义扼杀在源头。", "kaodian": "AI 后端能力 - 语言基础层 - ConcurrentHashMap 特性"}, {"no": 6, "type": "single", "body": "以下代码中 taskB 的命运是？", "code": "ExecutorService pool = Executors.newFixedThreadPool(2);\npool.submit(() -> System.out.println(\"A\")); // taskA\npool.shutdown();\npool.submit(() -> System.out.println(\"B\")); // taskB", "options": [{"k": "A", "t": "taskA、taskB 都正常执行"}, {"k": "B", "t": "taskA 正常执行；提交 taskB 时抛 RejectedExecutionException"}, {"k": "C", "t": "taskA 被中断；taskB 不执行"}, {"k": "D", "t": "taskB 排队等待线程池重新开启"}], "answer": ["B"], "explain": "<code>shutdown()</code> 是<b>温和关闭</b>：不再接收新任务，但会把已提交的任务执行完（taskA 正常输出）。关闭后再 submit，默认拒绝策略 AbortPolicy 直接抛 <code>RejectedExecutionException</code>。对比 <code>shutdownNow()</code>：尝试中断正在执行的任务并返回队列中未执行的任务列表。线程池一旦关闭不能重新开启。", "android": "类似 Activity onDestroy 后再往已 quit 的 HandlerThread 的 Handler 发消息——目标已进入终止流程，新任务必然被拒。", "kaodian": "AI 后端能力 - 语言基础层 - 线程池关闭语义"}, {"no": 7, "type": "single", "body": "单例 Bean 注入原型 Bean 如下。连续调用两次 orderService.createDraft()，两次拿到的 draft 是同一个对象吗？", "code": "@Component\n@Scope(\"prototype\")\npublic class Draft { }\n\n@Service\npublic class OrderService {\n    @Autowired\n    private Draft draft;      // 注入原型 Bean\n    public Draft createDraft() { return draft; }\n}", "options": [{"k": "A", "t": "不同对象，prototype 每次获取都是新实例"}, {"k": "B", "t": "同一个对象；因为注入只在 OrderService 创建时发生一次"}, {"k": "C", "t": "同一个对象；因为 prototype 在 Spring 中已废弃，实际按单例处理"}, {"k": "D", "t": "启动时报错：单例不允许注入原型"}, {"k": "E", "t": "不同对象；Spring 会自动为 prototype 生成代理"}], "answer": ["B"], "explain": "字段注入只在单例 OrderService <b>初始化时执行一次</b>，之后 draft 引用固定不变——prototype 的「每次获取新实例」只对「每次向容器要」生效，而这里只要了一次。这就是经典的<b>单例注入原型失效</b>问题。正确做法：① <code>ObjectProvider&lt;Draft&gt;</code> 每次 getObject()；② <code>@Lookup</code> 方法注入；③ <code>@Scope(value=\"prototype\", proxyMode=TARGET_CLASS)</code> 生成代理（E 选项说「自动」生成代理是错的，必须显式配置 proxyMode）。", "android": "类似 Dagger/Hilt 里给 @Singleton 的类注入一个无 scope 的依赖：构造时注入一次就定死了，想每次新实例得注入 Provider<T> 再 get()。", "kaodian": "AI 后端能力 - 框架与容器层 - 作用域注入失效"}, {"no": 8, "type": "single", "body": "两个环绕切面作用于同一方法，输出顺序是？", "code": "@Aspect @Order(1) @Component\nclass LogAspect {\n    @Around(\"execution(* com.demo.svc.*.*(..))\")\n    Object around(ProceedingJoinPoint p) throws Throwable {\n        System.out.println(\"log-in\");\n        Object r = p.proceed();\n        System.out.println(\"log-out\");\n        return r;\n    }\n}\n@Aspect @Order(2) @Component\nclass AuthAspect {\n    @Around(\"execution(* com.demo.svc.*.*(..))\")\n    Object around(ProceedingJoinPoint p) throws Throwable {\n        System.out.println(\"auth-in\");\n        Object r = p.proceed();\n        System.out.println(\"auth-out\");\n        return r;\n    }\n}\n// 目标方法体：System.out.println(\"biz\");", "options": [{"k": "A", "t": "log-in → auth-in → biz → auth-out → log-out"}, {"k": "B", "t": "auth-in → log-in → biz → log-out → auth-out"}, {"k": "C", "t": "log-in → log-out → auth-in → auth-out → biz"}, {"k": "D", "t": "顺序不确定，取决于 Bean 加载顺序"}], "answer": ["A"], "explain": "多切面按 <code>@Order</code> 值<b>越小优先级越高、越靠外层</b>，执行呈<b>洋葱模型</b>：外层切面先进后出。Order(1) 的 LogAspect 在最外层，所以进入顺序 log-in → auth-in → biz，退出顺序反向 auth-out → log-out。不加 @Order 时顺序才是不确定的（D 的说法只在未指定 Order 时成立）。", "android": "和 OkHttp 拦截器链一模一样：addInterceptor 的顺序决定洋葱层次，请求按序进入、响应逆序返回。", "kaodian": "AI 后端能力 - 框架与容器层 - 切面执行顺序"}, {"no": 9, "type": "single", "body": "关于事务传播行为 NESTED 与 REQUIRES_NEW 的区别（内层方法通过另一个 Bean 调用，代理生效），正确的是？）", "code": "@Transactional // 外层 REQUIRED\npublic void outer() {\n    repoA.save(a);\n    try { innerBean.inner(); } catch (Exception e) { /* 吞掉 */ }\n    repoB.save(b);\n    // 之后外层因其他原因回滚\n}\n// 场景1：inner 标注 @Transactional(propagation = NESTED)\n// 场景2：inner 标注 @Transactional(propagation = REQUIRES_NEW)", "options": [{"k": "A", "t": "两者完全等价，都是独立新事务"}, {"k": "B", "t": "NESTED 基于保存点，外层最终回滚时 inner 的修改也一起回滚；REQUIRES_NEW 是独立事务，inner 已提交的修改不受外层回滚影响"}, {"k": "C", "t": "REQUIRES_NEW 基于保存点；NESTED 会挂起外层事务"}, {"k": "D", "t": "NESTED 下 inner 抛异常必然导致外层整体回滚，无法只回滚内层"}], "answer": ["B"], "explain": "<b>NESTED</b>：在当前事务内创建 <code>savepoint</code>，内层异常可只回滚到保存点（外层 catch 后可继续），但它仍属于外层物理事务——<b>外层回滚会连带内层一起回滚</b>。<b>REQUIRES_NEW</b>：挂起外层、开启全新物理事务，内层提交后即持久化，外层再回滚也影响不到它。D 错：NESTED 配合外层 catch 恰好能实现「只回滚内层」。", "android": "类似 SQLite 的嵌套事务：内层用 savepoint 可局部回滚，但外层 endTransaction 不 setSuccessful，整体照样全部回滚。", "kaodian": "AI 后端能力 - 框架与容器层 - 事务传播"}, {"no": 10, "type": "single", "body": "MyBatis-Plus 配置了自动填充如下。调用 userMapper.updateById(user) 时 updateTime 的行为是？", "code": "public class User {\n    @TableField(fill = FieldFill.INSERT)\n    private LocalDateTime createTime;\n    @TableField(fill = FieldFill.INSERT_UPDATE)\n    private LocalDateTime updateTime;\n}\n\n@Component\npublic class MyMetaHandler implements MetaObjectHandler {\n    public void insertFill(MetaObject mo) {\n        strictInsertFill(mo, \"createTime\", LocalDateTime.class, LocalDateTime.now());\n        strictInsertFill(mo, \"updateTime\", LocalDateTime.class, LocalDateTime.now());\n    }\n    public void updateFill(MetaObject mo) {\n        strictUpdateFill(mo, \"updateTime\", LocalDateTime.class, LocalDateTime.now());\n    }\n}", "options": [{"k": "A", "t": "updateTime 自动填充为当前时间，createTime 不变"}, {"k": "B", "t": "updateTime 和 createTime 都会被更新为当前时间"}, {"k": "C", "t": "不会填充，自动填充只对 insert 生效"}, {"k": "D", "t": "报错：INSERT_UPDATE 不能与 updateFill 同时使用"}], "answer": ["A"], "explain": "MetaObjectHandler 注册为 Spring Bean 后，MP 在执行 <code>updateById(entity)</code> 时触发 <code>updateFill</code>，对标注 <code>FieldFill.UPDATE / INSERT_UPDATE</code> 的字段填充——updateTime 自动写入当前时间；createTime 只标了 INSERT，更新时不处理。注意两个坑：① strict 系列<b>只在字段为 null 时填充</b>，手动 set 过的值不会被覆盖；② <code>update(null, wrapper)</code> 这种没有实体的更新<b>不会触发填充</b>。", "android": "类似 Room 里用 @TypeConverter + 回调统一维护 updated_at 字段：框架层拦截写操作自动补时间戳，业务代码不用每处手写。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis-Plus 自动填充"}, {"no": 11, "type": "single", "body": "两张表数据如下，两条 SQL 分别返回几行？", "code": "-- t1.city: '北京', '上海', '北京'\n-- t2.city: '上海', '深圳'\nSELECT city FROM t1 UNION SELECT city FROM t2;      -- SQL1\nSELECT city FROM t1 UNION ALL SELECT city FROM t2;  -- SQL2", "options": [{"k": "A", "t": "SQL1 返回 5 行，SQL2 返回 5 行"}, {"k": "B", "t": "SQL1 返回 3 行，SQL2 返回 5 行"}, {"k": "C", "t": "SQL1 返回 4 行，SQL2 返回 5 行"}, {"k": "D", "t": "SQL1 返回 3 行，SQL2 返回 3 行"}], "answer": ["B"], "explain": "<code>UNION</code> 对合并后的结果<b>整体去重</b>（含跨表重复）：北京、上海、深圳 → 3 行；<code>UNION ALL</code> 直接拼接不去重 → 5 行。性能上 UNION 需要排序/哈希去重，开销更大；<b>确认无重复或允许重复时应优先 UNION ALL</b>。这是 SQL 审查里的高频优化点。", "android": "类似把两个 List 合并：addAll 直接拼（UNION ALL），先塞进 LinkedHashSet 再取出（UNION）——去重是有代价的。", "kaodian": "AI 后端能力 - 数据库与ORM层 - UNION 与 UNION ALL"}, {"no": 12, "type": "single", "body": "用 Redis BITMAP 记录用户 7 月签到，执行以下命令后 BITCOUNT 返回什么？", "code": "SETBIT sign:1001:202607 0 1   # 7月1日签到\nSETBIT sign:1001:202607 2 1   # 7月3日签到\nSETBIT sign:1001:202607 2 1   # 7月3日重复签到\nSETBIT sign:1001:202607 5 0   # 7月6日显式置0\nBITCOUNT sign:1001:202607", "options": [{"k": "A", "t": "4"}, {"k": "B", "t": "3"}, {"k": "C", "t": "2"}, {"k": "D", "t": "1"}], "answer": ["C"], "explain": "BITCOUNT 统计值为 1 的 bit 数。offset 0 和 2 被置 1；offset 2 <b>重复置 1 不会累加</b>（幂等）；offset 5 置 0 不计入。所以是 2。BITMAP 一个用户一个月的签到只占约 4 字节，亿级用户也就几百 MB，是签到/活跃打点的标准方案；天然幂等还顺带解决了重复签到问题。", "android": "和 Java 的 BitSet 或用 int 按位存开关状态（flags |= FLAG_X）一个思路：一个 bit 存一个布尔，省空间且天然幂等。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis BITMAP"}, {"no": 13, "type": "single", "body": "topic 已有 1000 条历史消息。一个全新的消费者组（从未提交过 offset）以如下配置启动，行为是？）", "code": "props.put(\"group.id\", \"new-group-v2\");   // 全新消费者组\nprops.put(\"auto.offset.reset\", \"latest\");", "options": [{"k": "A", "t": "从第 1 条开始，把 1000 条历史消息全部消费"}, {"k": "B", "t": "跳过历史消息，只消费启动之后新写入的消息"}, {"k": "C", "t": "抛出异常：新消费者组必须显式指定起始 offset"}, {"k": "D", "t": "随机从某个 offset 开始消费"}], "answer": ["B"], "explain": "<code>auto.offset.reset</code> 只在<b>找不到已提交 offset</b>（新组、或 offset 已过期被清理）时生效：<code>latest</code>（默认）从分区末尾开始，历史消息不消费；<code>earliest</code> 从头消费全部历史。已有提交 offset 的老消费者组，该参数<b>不起作用</b>，从上次提交位置继续。上线新消费组前必须确认这个参数，否则「为什么少消费了历史数据」就是它。", "android": "类似注册 BroadcastReceiver：注册之后才能收到新广播，注册前发的收不到（latest）；而 sticky 广播能补收最后一条，类似 earliest 的补历史语义。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 消费起点"}, {"no": 14, "type": "single", "body": "以下 JavaScript 代码的输出是？", "code": "const arr = [1, [2, [3, [4]]]];\nconsole.log(arr.flat());\nconsole.log(arr.flat(Infinity));", "options": [{"k": "A", "t": "[1, 2, 3, 4] 和 [1, 2, 3, 4]"}, {"k": "B", "t": "[1, 2, [3, [4]]] 和 [1, 2, 3, 4]"}, {"k": "C", "t": "[1, 2, [3, [4]]] 和 [1, 2, [3, [4]]]"}, {"k": "D", "t": "[1, [2, [3, [4]]]] 和 [1, 2, 3, 4]"}], "answer": ["B"], "explain": "<code>flat(depth)</code> 默认 depth=1，只拍平一层：[1, 2, [3, [4]]]；传 <code>Infinity</code> 递归拍平所有嵌套：[1, 2, 3, 4]。flat 返回新数组不改原数组，且会顺带移除数组空位。相关的 <code>flatMap(fn)</code> 等价于 map 后再 flat(1)，常用于「一条数据展开成多条」。", "android": "类似 Kotlin 的 flatten()（一层）与自己递归展开的区别；flatMap 则和 Kotlin/RxJava 的 flatMap 语义一致。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - 数组扁平化"}, {"no": 15, "type": "single", "body": "以下代码两个循环分别输出什么？", "code": "const arr = ['a', 'b'];\narr.extra = 'x';\nfor (const k in arr) console.log(k);\nfor (const v of arr) console.log(v);", "options": [{"k": "A", "t": "for...in 输出 0、1、extra；for...of 输出 a、b"}, {"k": "B", "t": "for...in 输出 a、b、x；for...of 输出 0、1"}, {"k": "C", "t": "两个循环都输出 a、b"}, {"k": "D", "t": "for...in 输出 0、1；for...of 输出 a、b、x"}], "answer": ["A"], "explain": "<code>for...in</code> 遍历对象的<b>可枚举属性名（字符串键）</b>，包括数组下标 \"0\"、\"1\" 和手动挂上去的 extra（还会沿原型链找）；<code>for...of</code> 走<b>迭代器协议</b>，只遍历数组元素值 a、b，extra 不是元素不会出现。所以遍历数组永远用 for...of / forEach，for...in 只用于普通对象且最好配 hasOwnProperty。", "android": "类似 Java 反射 getFields()（把所有字段都翻出来，含继承的）与正常 for-each 集合元素的区别：一个看结构，一个看内容。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - for...in 与 for...of"}, {"no": 16, "type": "single", "body": "以下 Vue3 代码，修改 name 后会打印 'changed' 吗？", "code": "const state = reactive({ user: { name: 'Tom' } });\nwatch(\n  () => state.user,\n  () => console.log('changed')\n);\nstate.user.name = 'Jerry';", "options": [{"k": "A", "t": "会，reactive 对象的任何修改都会触发 watch"}, {"k": "B", "t": "不会：getter 返回的 user 引用没变，且未开启 deep，内部属性变化不触发"}, {"k": "C", "t": "不会：watch 不能监听 reactive 对象的属性"}, {"k": "D", "t": "会，但要等下一次组件重新渲染后才触发"}], "answer": ["B"], "explain": "watch 的源是 <b>getter 函数</b> <code>() =&gt; state.user</code> 时，只比较 getter 返回值本身是否变化——user 的<b>引用</b>始终是同一个对象，改内部 name 不触发。三种修复：① 加 <code>{ deep: true }</code>；② 精确监听 <code>() =&gt; state.user.name</code>；③ 直接 <code>watch(state.user, cb)</code>（直接传 reactive 对象时 Vue 会隐式深度监听）。A 的说法只对第 ③ 种写法成立。", "android": "和 LiveData/StateFlow 一样：对同一个可变对象改字段再 setValue，distinctUntilChanged 判定引用相等不发射——要么换新对象（copy），要么观察具体字段。", "kaodian": "AI 前端能力 - 框架与组件 - watch 深度监听"}, {"no": 17, "type": "single", "body": "容器与子项样式如下，a、b 的实际渲染宽度分别是？", "code": ".box { display: flex; width: 400px; }\n.a { flex: 0 1 300px; }  /* flex-shrink: 1 */\n.b { flex: 0 3 300px; }  /* flex-shrink: 3 */", "options": [{"k": "A", "t": "a: 200px，b: 200px"}, {"k": "B", "t": "a: 250px，b: 150px"}, {"k": "C", "t": "a: 300px，b: 100px"}, {"k": "D", "t": "a: 150px，b: 250px"}], "answer": ["B"], "explain": "总 basis 600px，容器 400px，溢出 200px 需要收缩。收缩量按 <b>shrink × basis 加权</b>分配：a 权重 1×300=300，b 权重 3×300=900，总权重 1200。a 收缩 200×300/1200=50px → 250px；b 收缩 200×900/1200=150px → 150px。注意不是简单按 shrink 比例 1:3 分（那样是 50/150，本例恰好相同是因为两者 basis 相等；basis 不等时必须乘 basis 加权）。", "android": "对应 LinearLayout 的 layout_weight 分配剩余空间，但 flex-shrink 是「按权重分摊超出量」且要乘 basis，比 weight 多一层加权，算错就是 UI 走查一像素之争。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - flex-shrink 计算"}, {"no": 18, "type": "single", "body": "以下 Axios 代码，两次请求的参数分别通过什么方式发送？后端 Spring 应分别用什么注解接收？", "code": "axios.get('/api/user', { params: { id: 1 } });\naxios.post('/api/user', { id: 1 });", "options": [{"k": "A", "t": "GET 拼到 URL 查询串（?id=1），后端用 @RequestParam；POST 放 JSON 请求体，后端用 @RequestBody"}, {"k": "B", "t": "两者都放请求体，后端都用 @RequestBody"}, {"k": "C", "t": "GET 放请求体，POST 拼 URL，注解相反"}, {"k": "D", "t": "两者都拼 URL，后端都用 @RequestParam"}], "answer": ["A"], "explain": "Axios 配置对象里 <code>params</code> 序列化为 URL 查询字符串（适用任何方法）；post 的<b>第二个参数是 data</b>，默认以 <code>application/json</code> 放进请求体。对应后端：查询串/表单字段用 <code>@RequestParam</code>，JSON 体用 <code>@RequestBody</code> 映射对象。常见 400 报错就是前端把参数放了 body、后端却用 @RequestParam 接（或反之）。", "android": "对应 Retrofit 的 @Query（拼 URL）和 @Body（JSON 请求体）——前后端参数位置对不上时，和 Retrofit 注解用错报的错如出一辙。", "kaodian": "AI 前端能力 - 工程化与网络 - Axios params 与 data"}, {"no": 19, "type": "single", "body": "Vue3 中自定义组件上的 v-model 是哪组写法的语法糖？", "code": "<Child v-model=\"msg\" />", "options": [{"k": "A", "t": ":value=\"msg\" 加 @input=\"msg = $event\"（同 Vue2）"}, {"k": "B", "t": ":modelValue=\"msg\" 加 @update:modelValue=\"msg = $event\""}, {"k": "C", "t": ":msg=\"msg\" 加 @change=\"msg = $event\""}, {"k": "D", "t": "v-bind 与 v-on 的任意组合，由子组件自行约定"}], "answer": ["B"], "explain": "Vue3 中组件 v-model 默认等价于 <code>:modelValue</code> + <code>@update:modelValue</code>，子组件需声明 <code>props: ['modelValue']</code> 并 <code>emit('update:modelValue', 新值)</code>。与 Vue2 的 value/input 约定不同（A 是 Vue2 写法）。Vue3 还支持多 v-model：<code>v-model:title=\"t\"</code> 对应 <code>title</code> + <code>update:title</code>。", "android": "本质是「双向绑定 = 属性下发 + 事件回传」的约定，和自定义 View 暴露 setValue() + OnValueChangeListener 的成对接口完全同构。", "kaodian": "AI 前端能力 - 框架与组件 - 组件 v-model"}, {"no": 20, "type": "single", "body": "采用自顶向下策略做集成测试，高层模块已完成、部分底层模块未开发完，此时需要的辅助模块是？", "code": null, "options": [{"k": "A", "t": "驱动模块（Driver）：模拟上层调用者"}, {"k": "B", "t": "桩模块（Stub）：模拟下层被调模块，返回预设结果"}, {"k": "C", "t": "适配器模块：转换接口协议"}, {"k": "D", "t": "监控模块：记录调用日志"}], "answer": ["B"], "explain": "<b>自顶向下</b>集成：先测高层，底层未就绪 → 用<b>桩模块（Stub）</b>顶替「被调用的下层」，返回写死的结果。<b>自底向上</b>集成：先测底层，上层未就绪 → 用<b>驱动模块（Driver）</b>模拟「发起调用的上层」。口诀：缺谁补谁——缺下层补桩（Stub），缺上层补驱动（Driver）。", "android": "App 联调时服务端接口没好，用 MockWebServer 返回假 JSON——这就是给「下层依赖」打桩；而写 main/测试用例去调你的 SDK，就是驱动。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 集成测试策略"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "关于 Java 并行流 parallelStream 的使用，正确的有：（多选、少选、错选均不得分））", "code": "List<Integer> result = new ArrayList<>();\nsource.parallelStream().forEach(x -> result.add(x * 2)); // 隐患代码", "options": [{"k": "A", "t": "并行流默认共享 JVM 全局的 ForkJoinPool.commonPool，某个耗时任务会拖累其他并行流"}, {"k": "B", "t": "示例代码向共享 ArrayList 并发 add，可能丢元素、抛 ArrayIndexOutOfBoundsException"}, {"k": "C", "t": "数据量越小，并行流加速效果越明显"}, {"k": "D", "t": "forEach 在并行流中保证按源顺序处理，无需 forEachOrdered"}, {"k": "E", "t": "正确做法是用 collect(Collectors.toList()) 等归约操作代替共享可变容器"}], "answer": ["A", "B", "E"], "explain": "A 对：所有并行流共用 commonPool（线程数≈CPU核数-1），IO 阻塞型任务会饿死其他使用方。B 对：ArrayList 非线程安全，并发 add 会竞态。E 对：collect 由框架做线程安全的分段合并，是标准写法。C 错：小数据量时任务拆分/合并的开销反而更慢，并行流适合大数据量 CPU 密集场景。D 错：并行流 forEach <b>不保证顺序</b>，要顺序输出需 forEachOrdered（会牺牲部分并行度）。", "android": "和 RxJava 滥用 Schedulers.computation() 跑 IO 一个道理：公共计算线程池被阻塞任务占满，全 App 卡顿；共享可变状态则等价于多线程同时改一个非同步集合。", "kaodian": "AI 后端能力 - 语言基础层 - 并行流"}, {"no": 22, "type": "multi", "body": "关于 MySQL（InnoDB）的三大日志 redo log、undo log、binlog，说法正确的有：（多选、少选、错选均不得分））", "code": null, "options": [{"k": "A", "t": "redo log 是 InnoDB 引擎层的物理日志，保证崩溃恢复后已提交事务不丢失（crash-safe）"}, {"k": "B", "t": "undo log 记录数据修改前的旧值，用于事务回滚，同时支撑 MVCC 的多版本读"}, {"k": "C", "t": "binlog 是 Server 层的逻辑日志，主要用于主从复制和数据恢复"}, {"k": "D", "t": "事务提交时 redo log 与 binlog 通过两阶段提交（2PC）保证两份日志的一致性"}, {"k": "E", "t": "binlog 是固定大小循环覆盖写，redo log 则无限追加永不覆盖"}], "answer": ["A", "B", "C", "D"], "explain": "A/B/C/D 均正确，构成 InnoDB 事务与复制的基石：redo 保证持久性 D、undo 保证原子性 A 并支撑 MVCC、binlog 负责复制与恢复、2PC（prepare 写 redo → 写 binlog → commit）防止两份日志不一致导致主从数据分叉。E 说反了：<b>redo log 才是固定大小的环形文件</b>（写满触发 checkpoint 刷脏页），binlog 是追加写、按大小滚动新文件。", "android": "SQLite 的 WAL 文件与 redo log 神似（先写日志再落数据页，崩溃后重放）；binlog 则像埋点上报的操作流水，供「另一端」重放同步。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 日志体系"}, {"no": 23, "type": "multi", "body": "高并发系统中保证 Redis 缓存与 MySQL 数据一致性，说法正确的有：（多选、少选、错选均不得分））", "code": null, "options": [{"k": "A", "t": "常规方案：先更新数据库、再删除缓存（Cache-Aside），并给缓存设置过期时间兜底"}, {"k": "B", "t": "延迟双删：删缓存 → 更新数据库 → 延迟几百毫秒再删一次，降低并发读把旧值写回缓存的概率"}, {"k": "C", "t": "先更新缓存、再更新数据库，可以彻底避免不一致"}, {"k": "D", "t": "通过订阅 MySQL binlog（如 Canal）异步删除/更新缓存，可与业务代码解耦并保证最终一致"}, {"k": "E", "t": "只要把删缓存和更新数据库放进 Redis 的 MULTI/EXEC 事务里，就能保证两者强一致"}], "answer": ["A", "B", "D"], "explain": "A 对：更新 DB 后删缓存（而非改缓存），下次读回填，配过期时间兜底，是工程标准做法。B 对：第二次延迟删除清掉「更新期间被并发读回填的旧值」。D 对：binlog 订阅方案把缓存维护从业务剥离，天然最终一致。C 错：先改缓存后写 DB，DB 写失败缓存就成了脏数据，且并发下写序不可控。E 错：Redis 事务只管 Redis 自己的命令打包，<b>管不了 MySQL</b>，跨存储不存在这种强一致捷径。", "android": "和本地 Room 缓存 + 服务端数据同步一个命题：以服务端(DB)为准，本地缓存只做失效重拉（删缓存=清本地缓存触发重新请求），而不是双写两份都改。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存一致性"}, {"no": 24, "type": "multi", "body": "线上 Kafka 某 topic 消息大量积压（消费速度远跟不上生产速度），正确的处理思路有：（多选、少选、错选均不得分））", "code": null, "options": [{"k": "A", "t": "消费者实例数已经等于分区数时，继续加消费者不会提升消费能力，多出来的只会空闲"}, {"k": "B", "t": "可以增加 topic 分区数并同步扩容消费者，提高消费并行度"}, {"k": "C", "t": "优化消费端逻辑：批量拉取批量落库、耗时操作异步化，提升单实例吞吐"}, {"k": "D", "t": "把消费者组的 auto.offset.reset 改成 latest 重启，直接跳过积压消息，是生产环境的常规手段"}], "answer": ["A", "B", "C"], "explain": "A 对：Kafka 一个分区同一时刻只能被组内一个消费者消费，消费者数 &gt; 分区数的部分纯空转——这是扩容前必须先看分区数的原因。B 对：分区是并行度上限，扩分区+扩消费者才真正提速（注意扩分区会影响按 key 的分区路由）。C 对：多数积压瓶颈在消费端单条同步落库，改批量/异步立竿见影。D 错：这等于<b>主动丢消息</b>，而且该参数对已有提交 offset 的组根本不生效；跳过积压只能作为极端故障下的止损决策，绝非常规手段。", "android": "像消息列表页卡顿：单线程逐条解析入库跟不上推送速率，解法是分片并行 + 批量写 Room，而不是直接把没处理的消息扔掉。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 积压治理"}, {"no": 25, "type": "multi", "body": "关于 Vue3 相对 Vue2 的核心改进，说法正确的有：（多选、少选、错选均不得分））", "code": null, "options": [{"k": "A", "t": "响应式底层从 Object.defineProperty 换成 Proxy，能直接监听属性新增/删除和数组索引赋值"}, {"k": "B", "t": "Composition API 按逻辑关注点组织代码，比 mixins 更利于复用且对 TypeScript 类型推导更友好"}, {"k": "C", "t": "支持 Fragment，组件模板不再强制单一根节点"}, {"k": "D", "t": "Vue3 已彻底移除 Options API，老写法无法运行"}, {"k": "E", "t": "API 按 ES Module 导出，配合打包器可 Tree-shaking 掉未使用的功能，减小体积"}], "answer": ["A", "B", "C", "E"], "explain": "A 对：Proxy 代理整个对象，Vue2 时代 <code>this.obj.newKey = 1</code> 不响应、必须 $set 的痛点消失。B 对：逻辑按功能聚合成 composable 函数，类型推导天然完整。C 对：多根节点模板直接可用。E 对：如 v-model 修饰符、transition 等未用到的模块可被裁剪。D 错：<b>Options API 在 Vue3 中完全保留</b>，两种风格可共存，老项目可渐进迁移。", "android": "Composition API 之于 mixins，相当于 Kotlin 扩展函数+组合优于「多层继承基类 BaseActivity」；Proxy 响应式则像从手写 notifyPropertyChanged 升级到 Compose 的 State 自动追踪。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 架构演进"}, {"no": 26, "type": "multi", "body": "关于 HTTPS 的安全机制，说法正确的有：（多选、少选、错选均不得分））", "code": null, "options": [{"k": "A", "t": "TLS 握手阶段用非对称加密协商出会话密钥，之后的数据传输用对称加密，兼顾安全与性能"}, {"k": "B", "t": "数字证书由 CA 签发，浏览器用内置的 CA 公钥验证证书签名，从而确认服务器身份、防止中间人伪装"}, {"k": "C", "t": "HTTPS 默认端口是 443，HTTP 默认端口是 80"}, {"k": "D", "t": "启用 HTTPS 后即可防御 XSS 和 SQL 注入攻击"}], "answer": ["A", "B", "C"], "explain": "A 对：非对称加密（RSA/ECDHE）安全但慢，只用来交换密钥；后续通信用对称加密（AES）保证吞吐。B 对：证书链验证是防中间人的关键——自签证书告警就是这个校验没过。C 对：常识但常考。D 错：HTTPS 只保证<b>传输通道</b>的机密性和完整性；XSS 是页面脚本注入、SQL 注入发生在服务端处理层，都在加密通道「两端」，与传输加密无关。", "android": "对应 OkHttp 的 certificatePinner 证书校验与抓包对抗：Charles 抓 HTTPS 要装自签 CA，正是绕过 B 的信任链；而 App 里拼 SQL 的注入漏洞，HTTPS 救不了。", "kaodian": "AI 前端能力 - 工程化与网络 - HTTPS 原理"}, {"no": 27, "type": "multi", "body": "版本迭代后回归测试的用例筛选与执行策略，正确的有：（多选、少选、错选均不得分））", "code": null, "options": [{"k": "A", "t": "全量回归最稳妥但成本高，实际工作中通常基于风险和影响范围裁剪回归集"}, {"k": "B", "t": "应基于变更影响分析（改动的模块及其依赖链路）筛选需要回归的用例"}, {"k": "C", "t": "核心业务链路（如登录、下单、支付）的用例通常固定纳入每轮回归"}, {"k": "D", "t": "回归测试只需重新执行上一轮发现过 bug 的用例即可"}, {"k": "E", "t": "高频执行的回归集适合自动化，并纳入 CI 流水线在每次合码后自动运行"}], "answer": ["A", "B", "C", "E"], "explain": "A/B/C/E 是回归测试的标准打法：按风险裁剪 + 影响分析选用例 + 核心链路必测 + 自动化进 CI。D 错：回归的目的是确认<b>新改动没有破坏既有功能</b>，改动可能影响从未出过 bug 的模块（依赖传导），只回归历史 bug 用例会漏掉大量风险面；历史 bug 用例只是回归集的一个子集（防复发）。", "android": "发版前跑 Monkey + 核心路径 UI 自动化（Espresso）就是移动端的回归集；改了网络层却只测上次崩溃页面，结果支付页挂了——这就是 D 的教训。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 回归测试策略"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 28, "type": "judge", "body": "Java 接口中定义的成员变量默认是 public static final 常量；JDK 8 起接口方法除抽象方法外还可以有 default 方法和 static 方法实现。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。接口字段隐式为 <code>public static final</code>（必须初始化、不可修改、属于接口本身）；JDK 8 引入 default（实例默认实现，可被实现类覆盖）与 static 方法（只能用接口名调用），JDK 9 还允许 private 方法用于 default 方法间复用。因此「接口里只能有抽象方法」早已过时。", "android": "Android 开发常用的 View.OnClickListener 是单抽象方法接口（SAM）；而 Kotlin 接口天然支持带默认实现的方法，Java 8 的 default 就是同类能力。", "kaodian": "AI 后端能力 - 语言基础层 - 接口成员默认修饰符"}, {"no": 29, "type": "judge", "body": "InnoDB 中，唯一索引（UNIQUE）列与主键一样，都不允许存储 NULL 值。）", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "错误。主键 = 唯一 + <b>非空</b>；而唯一索引列<b>允许存 NULL，且可以存多个 NULL</b>（MySQL 中 NULL 与 NULL 不视为相等，不触发唯一冲突）。这是实际建表的高频坑：想用唯一索引做防重，列却允许 NULL，结果重复的「空值行」全部插入成功。防重字段应同时设 NOT NULL + UNIQUE。", "android": "SQLite 同样如此：UNIQUE 列多个 NULL 不冲突。本地表设计防重时同样要 NOT NULL + UNIQUE 双保险。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 唯一索引与 NULL"}, {"no": 30, "type": "judge", "body": "RabbitMQ 消费端处理失败时，直接 basicNack(deliveryTag, false, true)（requeue=true）让消息重新入队，是处理反复消费失败的「毒消息」的推荐做法。）", "code": "channel.basicNack(tag, false, true); // 消费失败就重新入队", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "错误。requeue=true 会把消息放回<b>队列头部</b>，若失败原因是消息本身有问题（毒消息），会立刻被再次投递、再次失败，形成<b>无限重试死循环</b>，打满消费者并阻塞后面的正常消息。正确做法：重试计数（消息头记录次数），超过阈值后 <code>requeue=false</code> 让消息进入<b>死信队列</b>，由人工或补偿程序处理。", "android": "和 WorkManager 的 Result.retry() 不设 BackoffPolicy 和最大次数一样：坏任务无限重跑耗电耗资源。正解都是「有限重试 + 兜底落盘人工处理」。", "kaodian": "AI 后端能力 - 高并发与中间件层 - RabbitMQ 毒消息处理"}, {"no": 31, "type": "judge", "body": "关于脚本加载：<script defer> 的脚本按文档顺序、在 DOM 解析完成后且 DOMContentLoaded 事件之前执行；<script async> 的脚本下载完立即执行，不保证顺序。", "code": "<script defer src=\"a.js\"><\/script>\n<script defer src=\"b.js\"><\/script>\n<script async src=\"c.js\"><\/script>", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。两者下载都不阻塞 HTML 解析，区别在执行时机：<b>defer</b> 延迟到 DOM 解析完、按书写顺序执行、且在 DOMContentLoaded 前——a.js 一定先于 b.js，适合有依赖关系的业务脚本；<b>async</b> 谁先下载完谁先执行、可能打断解析、顺序不可控——c.js 位置不定，适合无依赖的独立脚本（埋点、统计）。普通 script 则会阻塞解析。", "android": "类似启动优化中的任务编排：defer 是「主流程结束后按依赖序执行的启动任务」，async 是「完全独立、谁好谁跑的并行任务」，有依赖的任务绝不能放进无序并行组。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - defer 与 async"}, {"no": 32, "type": "judge", "body": "TypeScript 中，同名 interface 的多次声明会自动合并（声明合并）；而同名 type 别名重复声明会直接报错。）", "code": "interface User { name: string; }\ninterface User { age: number; }\n// User 实际为 { name: string; age: number; }\n\ntype Point = { x: number };\ntype Point = { y: number }; // 这一行会怎样？", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。<b>声明合并</b>是 interface 独有能力，常用于给第三方库类型补字段（如扩展 Window、给 Vue 组件全局属性补类型）。type 别名重复声明报「Duplicate identifier」。其余差异：type 能表达联合/交叉/元组/映射类型等，interface 只能描述对象结构但可 extends/implements。团队约定通常是：对象结构优先 interface，工具类型用 type。", "android": "interface 合并类似 Kotlin 对第三方类写扩展（不改源码补能力）；type 别名更像 typealias——重复定义同名 typealias 同样编译报错。", "kaodian": "AI 前端能力 - 框架与组件 - TS interface 与 type"}, {"no": 33, "type": "judge", "body": "V 模型中，测试阶段与开发阶段左右对应：单元测试对应详细设计，集成测试对应概要设计，系统测试对应需求分析/系统设计，验收测试对应用户需求。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。V 模型左边是开发活动（用户需求 → 需求分析 → 概要设计 → 详细设计 → 编码），右边是测试活动自底向上一一对应：编码→单元测试的依据是<b>详细设计</b>，模块拼装的集成测试依据<b>概要设计</b>，整体验证的系统测试依据<b>需求规格</b>，最终验收测试回到<b>用户需求</b>。每层测试的「依据文档」是考试常问点。V 模型的短板是测试介入晚，这也是「测试左移」要解决的问题。", "android": "对应移动端实践：单测（ViewModel 逻辑）看技术设计文档，集成测试（模块间联调）看架构图，系统测试跑整机功能，验收就是产品按 PRD 走查。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - V 模型"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
