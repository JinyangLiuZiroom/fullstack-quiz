<script type="application/json" id="quizData">{"id": "vol09", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "Cache-Aside 先更新数据库再删除缓存（延迟双删）的目的，正确的是？", "code": "// 写流程\ndb.update(order);\nredis.del(\"order:\"+id);\nThread.sleep(500);          // 延迟\nredis.del(\"order:\"+id);      // 再次删除", "options": [{"k": "A", "t": "延迟双删用于解决『更新DB后、旧缓存被其他读线程回填』的窗口问题"}, {"k": "B", "t": "延迟双删能保证强一致，缓存与DB永远一致"}, {"k": "C", "t": "第一次删除是多余的，只留延迟后的删除即可"}, {"k": "D", "t": "延迟双删是为了提升读取性能"}], "answer": "A", "explain": "延迟双删针对：更新DB→删缓存→此时若有读线程发现缓存空、把旧值写回，延迟后二次删除可清掉这个脏值。它只能降低不一致窗口，不能保证强一致（B 错）。两次删除都必要。", "kaodian": "AI后端能力-高并发与中间件层-缓存一致性"}, {"no": 2, "type": "single", "body": "联合索引 idx(a,b,c)，下列查询能充分利用最左前缀的是？", "code": "-- 可用最左前缀\nWHERE a=1 AND b=2 AND c=3\nWHERE a=1 AND b=2\n-- 下列哪个会中断最左前缀？\nWHERE b=2 AND c=3\nWHERE a=1 AND c=3", "options": [{"k": "A", "t": "索引列顺序不影响最左前缀"}, {"k": "B", "t": "WHERE b=2 AND c=3 能用到索引 idx(a,b,c)"}, {"k": "C", "t": "WHERE a=1 AND c=3 能用到 a 索引但 c 无法继续走索引（缺 b 断档）"}, {"k": "D", "t": "WHERE a=1 AND c=3 与 WHERE a=1 AND b=2 利用效率完全相同"}], "answer": "C", "explain": "最左前缀要求从索引最左列连续匹配。a=1 AND c=3 用了 a 但跳过 b，c 无法利用索引（b 断档），只能用到 a 的前缀部分。b=2 AND c=3 完全没用 a，索引失效。列顺序至关重要。", "kaodian": "AI后端能力-数据存储与ORM层-SQL最左前缀"}, {"no": 3, "type": "single", "body": "MyBatis-Plus 乐观锁 @Version 在并发更新时的行为是？", "code": "@Version\nprivate Integer version;\n// 两次同时 update，version 均为 1\nuserMapper.updateById(u); // 带 WHERE version=1", "options": [{"k": "A", "t": "自动升级为悲观锁阻塞并发"}, {"k": "B", "t": "version 字段由数据库自动维护，代码无需关心"}, {"k": "C", "t": "两个更新都成功，version 各加 1"}, {"k": "D", "t": "后提交的更新因 WHERE version=1 不匹配而受影响行数 0，需重试"}], "answer": "D", "explain": "乐观锁：UPDATE ... SET ..., version=version+1 WHERE id=? AND version=旧值。第一个成功（version 1→2），第二个因 WHERE version=1 已不匹配、影响行数 0，MP 抛 OptimisticLockException 或返回 0，应用需重试。C 错（后者失败）；A 是悲观锁；B version 由 MP 自动递增但读取需靠 @Version 标注。", "kaodian": "AI后端能力-数据存储与ORM层-MP乐观锁"}, {"no": 4, "type": "single", "body": "Spring 构造器循环依赖（A 依赖 B，B 依赖 A）默认会？", "code": "@Component\nclass A { public A(B b) { this.b = b; } }\n@Component\nclass B { public B(A a) { this.a = a; } }", "options": [{"k": "A", "t": "构造器注入的循环依赖无法解决，启动抛 BeanCurrentlyInCreationException"}, {"k": "B", "t": "需要用 @Lazy 才能让两者都懒加载"}, {"k": "C", "t": "Spring 会自动把其中一个改成 prototype 破除循环"}, {"k": "D", "t": "Spring 自动用三级缓存解决，正常启动"}], "answer": "A", "explain": "构造器注入的循环依赖 Spring 无法解决（还没实例化完就相互需要对方），直接抛 BeanCurrentlyInCreationException。字段/setter 注入可借三级缓存解决；构造器循环通常需改设计或用 @Lazy 延迟注入代理。", "kaodian": "AI后端能力-应用框架层-Spring循环依赖"}, {"no": 5, "type": "single", "body": "下列 CompletableFuture 中，用于『把结果转换为另一种类型（同步映射）』的是？", "code": "CompletableFuture<String> f = cf.thenApply(s -> s + \"!\");\nCompletableFuture<String> g = cf.thenCompose(s -> other(s));", "options": [{"k": "A", "t": "thenApply：把上游结果同步转换为新值"}, {"k": "B", "t": "thenCompose：用于扁平化另一个 CompletableFuture"}, {"k": "C", "t": "thenRun：接收结果并返回新 Future"}, {"k": "D", "t": "allOf：转换单个结果"}], "answer": "A", "explain": "thenApply(fn) 把上游结果用同步函数映射为新值（如 String→String）；thenCompose 用于返回新的 CompletableFuture 做扁平化；thenRun 不接收结果只做副作用；allOf 等待多个任务。", "kaodian": "AI后端能力-语言与计算层-CompletableFuture"}, {"no": 6, "type": "single", "body": "Redis 管道（pipeline）的主要作用是？", "code": "Pipeline p = jedis.pipelined();\nfor (int i=0;i<1000;i++) p.set(\"k\"+i, \"\"+i);\np.sync();  // 一次性发送", "options": [{"k": "A", "t": "管道会自动重试失败命令"}, {"k": "B", "t": "管道把多条命令打包一次网络往返发送，减少 RTT，提升批量吞吐"}, {"k": "C", "t": "管道保证多条命令的原子性（要么全成要么全败）"}, {"k": "D", "t": "管道用于消息发布订阅"}], "answer": "B", "explain": "pipeline 将多个命令一次性发给服务端、一次性取回响应，把 N 次 RTT 降为 1 次，大幅提升批量操作吞吐。但 pipeline 不等同事务（不保证原子，C 错），与 Pub/Sub、重试无关。", "kaodian": "AI后端能力-高并发与中间件层-Redis管道与批量"}, {"no": 7, "type": "single", "body": "Kafka 消费者重平衡（rebalance）期间，正在处理的消息会？", "code": "// 消费逻辑\npoll(records); process(records); commitSync();\n// 若期间发生 rebalance，且未处理完", "options": [{"k": "A", "t": "rebalance 会丢失未提交消息，永不重投"}, {"k": "B", "t": "rebalance 只在消费者启动时发生一次"}, {"k": "C", "t": "自动提交保证消息不重复"}, {"k": "D", "t": "rebalance 会撤销分区分配，未提交位移的消息会被重新投递（可能重复消费）"}], "answer": "D", "explain": "rebalance 是分区重新分配的过程，发生在订阅变更、成员增减、心跳超时等。期间若消息已处理但未提交位移，分区被回收再分配后这些消息会被重新投递，造成重复消费（需消费端幂等）。C/A/B 均错。", "kaodian": "AI后端能力-高并发与中间件层-Kafka消费者组与rebalance"}, {"no": 8, "type": "single", "body": "Vue3 中 watch 监听对象深层属性变化，正确的是？", "code": "watch(() => state.user.age, (n,o) => {...});          // 写法1\nwatch(state, cb, { deep: true });                     // 写法2", "options": [{"k": "A", "t": "写法2 不加 deep:true 也能捕获深层变化"}, {"k": "B", "t": "watch 默认深度遍历对象所有属性"}, {"k": "C", "t": "reactive 对象无法被 watch 监听"}, {"k": "D", "t": "写法1 用 getter 精确监听 state.user.age，无需 deep"}], "answer": "D", "explain": "写法1 通过 getter 精确返回 state.user.age，普通 watch 即可捕获该值变化，无需 deep（高效）。deep:true 会递归遍历整个对象，开销大；watch 默认不深度遍历（A/B 错）；reactive 可被 watch。", "kaodian": "AI前端能力-语言与运行时-Vue3侦听"}, {"no": 9, "type": "single", "body": "CSS Grid 中 grid-template-columns: repeat(3, 1fr) 的效果是？", "code": "display: grid;\ngrid-template-columns: repeat(3, 1fr);\ngrid-template-rows: 100px 100px;", "options": [{"k": "A", "t": "创建 3 列等宽、2 行各 100px 的网格"}, {"k": "B", "t": "创建 1 列 3 行"}, {"k": "C", "t": "repeat(3,1fr) 表示列宽固定 3px"}, {"k": "D", "t": "fr 单位只在 Flex 中有效"}], "answer": "A", "explain": "grid-template-columns: repeat(3,1fr) 生成 3 个等宽（各占 1 份剩余空间）的列；grid-template-rows 定义 2 行高 100px。fr 是 Grid 的弹性单位（非 Flex 专有但常用于 Grid）。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSSGrid"}, {"no": 10, "type": "single", "body": "Axios 中 GET 请求带数组参数，期望序列化为 ids=1&ids=2，应配置？", "code": "axios.get('/u', { params: { ids: [1,2] },\n  paramsSerializer: p => qs.stringify(p, { arrayFormat: 'repeat' }) });", "options": [{"k": "A", "t": "Axios 不支持数组参数"}, {"k": "B", "t": "默认就会序列化为 ids=1&ids=2"}, {"k": "C", "t": "需自定义 paramsSerializer（如 qs 的 arrayFormat:'repeat'）才能得到重复键"}, {"k": "D", "t": "数组参数只能放 data 里"}], "answer": "C", "explain": "Axios 默认把数组序列化为 ids[]=1&ids[]=2 或 ids=1,2，并非重复的 ids=1&ids=2。要得到 repeat 格式需自定义 paramsSerializer（如 qs.stringify({arrayFormat:'repeat'})）。数组可放 params（GET 查询串）。", "kaodian": "AI前端能力-网络与BFF架构-Axios参数序列化"}, {"no": 11, "type": "single", "body": "TypeScript 工具类型 Partial<T> 的作用是？", "code": "interface User { id: number; name: string }\ntype U = Partial<User>;  // { id?: number; name?: string }", "options": [{"k": "A", "t": "把 T 的所有属性变为必填"}, {"k": "B", "t": "提取 T 的所有键名组成联合类型"}, {"k": "C", "t": "把 T 的所有属性变为可选"}, {"k": "D", "t": "把 T 的所有属性变为只读"}], "answer": "C", "explain": "Partial<T> 将 T 的每个属性变为可选（?），常用于『更新时部分字段可缺省』场景。只读是 Readonly<T>；必填是 Required<T>；键名联合是 keyof T。", "kaodian": "AI前端能力-语言与运行时-TS工具类型"}, {"no": 12, "type": "single", "body": "下列代码的输出顺序是？", "code": "console.log('1');\nsetTimeout(() => console.log('2'), 0);\nPromise.resolve().then(() => console.log('3'));\nconsole.log('4');", "options": [{"k": "A", "t": "1 4 3 2"}, {"k": "B", "t": "1 2 3 4"}, {"k": "C", "t": "1 3 2 4"}, {"k": "D", "t": "1 4 2 3"}], "answer": "A", "explain": "同步代码先执行：1、4。微任务（Promise.then）先于宏任务（setTimeout）清空，故 3 在 2 前。输出 1 4 3 2。这是事件循环『微任务优先于宏任务』的经典题。", "kaodian": "AI前端能力-语言与运行时-微任务宏任务顺序"}, {"no": 13, "type": "single", "body": "Vite 开发代理把 /api 转发到后端，下列 rewrite 的作用是？", "code": "server: { proxy: { '/api': {\n  target: 'http://localhost:8080',\n  changeOrigin: true,\n  rewrite: p => p.replace(/^\\/api/, '') } } }", "options": [{"k": "A", "t": "rewrite 去掉请求路径前缀 /api，转发到后端时变成 /xxx"}, {"k": "B", "t": "rewrite 给请求加上 /api 前缀"}, {"k": "C", "t": "changeOrigin 决定是否改写路径"}, {"k": "D", "t": "rewrite 用于设置请求头"}], "answer": "A", "explain": "Vite 代理中 rewrite 用正则替换路径：/^\\/api/ → '' 即去掉 /api 前缀，使转发到后端时为 /xxx（后端无 /api 前缀时常用）。changeOrigin 是改 Host 头骗过服务端，与路径无关。", "kaodian": "AI前端能力-网络与BFF架构-Vite代理"}, {"no": 14, "type": "single", "body": "前端身份认证方案中，下列说法正确的是？", "code": "// 登录后\nlocalStorage.setItem('token', jwt);\n// 每次请求\naxios.defaults.headers.common['Authorization'] = 'Bearer '+token;", "options": [{"k": "A", "t": "JWT 必须服务端存储才能校验"}, {"k": "B", "t": "Token（如 JWT）无状态、可携带用户信息、前端存 localStorage 后随请求头发送"}, {"k": "C", "t": "Cookie 与 Token 是完全相同的机制"}, {"k": "D", "t": "Session 把状态存在前端"}], "answer": "B", "explain": "Token（JWT）是无状态凭证：服务端签发、前端持有（localStorage/Cookie），每次请求在 Authorization 头带上，服务端用密钥校验无需查库。Session 状态在服务端；Cookie 与 Token 机制不同（Cookie 自动携带、可设 HttpOnly）；JWT 校验靠签名无需存储。", "kaodian": "AI前端能力-前端生态-身份认证"}, {"no": 15, "type": "single", "body": "接口自动化需要统一鉴权，下列做法正确的是？", "code": "axios.interceptors.request.use(cfg => {\n  cfg.headers['Authorization'] = 'Bearer ' + getToken();\n  return cfg;\n});", "options": [{"k": "A", "t": "接口测试不需要鉴权"}, {"k": "B", "t": "鉴权只能放响应拦截器"}, {"k": "C", "t": "在请求拦截器统一注入 Authorization 头，避免每处手写"}, {"k": "D", "t": "在每个用例里手动复制 token 字符串"}], "answer": "C", "explain": "统一鉴权最佳实践是在请求拦截器注入 Authorization（或其它鉴权头），集中管理、避免重复与泄露。手动复制易出错；接口测试大多需要鉴权；请求头应在 request 阶段加。", "kaodian": "AI质量保障-接口测试-接口鉴权"}, {"no": 16, "type": "single", "body": "探索性测试（Exploratory Testing）的特点是？", "code": "// 没有固定脚本，边学边测\ntester: 我想知道『超长用户名』会怎样\n-> 输入 10000 字符，观察崩溃/截断", "options": [{"k": "A", "t": "完全按写好的脚本逐步执行，不临场发挥"}, {"k": "B", "t": "只用于回归，不用于新功能"}, {"k": "C", "t": "必须自动化执行"}, {"k": "D", "t": "依赖测试人员经验，边设计用例边执行，强调发现未知缺陷"}], "answer": "D", "explain": "探索性测试是『测试设计+执行』并行的测试方法，依赖测试者经验与直觉，在探索中动态设计用例，擅长发现脚本测试遗漏的异常路径/未知缺陷。它不是纯脚本执行（A 错）、可用于新功能（B 错）、可以是手工（C 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-探索性测试"}, {"no": 17, "type": "single", "body": "Playwright 推荐用语义化定位器而非 CSS 选择器，原因主要是？", "code": "page.getByRole('button', { name: '提交' })\npage.getByText('欢迎')\n// vs\npage.click('#btn-3f2a')", "options": [{"k": "A", "t": "语义化定位贴合用户可见文本/角色，用例更可读、对 DOM 结构调整更健壮"}, {"k": "B", "t": "CSS 选择器比语义化定位更快"}, {"k": "C", "t": "语义化定位只能用于按钮"}, {"k": "D", "t": "CSS 选择器无法点击"}], "answer": "A", "explain": "语义化定位（getByRole/getByText/getByLabel）基于用户可感知的属性，用例可读性高，且当 class/id 变化时不易断裂，比脆弱的 CSS 选择器更稳健。B/C/D 均错。", "kaodian": "AI质量保障-自动化测试-Playwright定位"}, {"no": 18, "type": "single", "body": "『质量内建（Quality Built-in）』的核心理念是？", "code": "// 在需求/设计/编码阶段就考虑质量\n- 需求评审把关\n- 单测随开发同步写\n- CI 门禁卡质量", "options": [{"k": "A", "t": "质量内建等同于自动化测试"}, {"k": "B", "t": "把质量活动前移到需求与开发阶段，而不是等到测试阶段才发现缺陷"}, {"k": "C", "t": "质量主要由测试团队在后期负责"}, {"k": "D", "t": "质量内建就是提高测试覆盖率"}], "answer": "B", "explain": "质量内建源自精益，强调缺陷越晚发现成本越高，应在需求评审、设计、编码阶段就预防缺陷，而非依赖后期测试兜底。它是文化/实践体系（含评审、TDD、CI 门禁等），非单指覆盖率或自动化。", "kaodian": "AI质量保障-软件测试理论与质量体系-质量内建"}, {"no": 19, "type": "single", "body": "JUnit5 中下列注解的执行顺序是？", "code": "@BeforeEach void init() {}\n@Test void t1() {}\n@AfterEach void clean() {}\n@BeforeAll static void beforeAll() {}", "options": [{"k": "A", "t": "Test → BeforeEach → AfterEach → BeforeAll"}, {"k": "B", "t": "BeforeAll 与 BeforeEach 顺序随机"}, {"k": "C", "t": "BeforeAll → BeforeEach → Test → AfterEach（每个测试类/方法各一次）"}, {"k": "D", "t": "BeforeEach → BeforeAll → Test → AfterEach"}], "answer": "C", "explain": "JUnit5 生命周期：@BeforeAll（类级，静态，一次）→ @BeforeEach（每方法前）→ @Test → @AfterEach（每方法后）→ @AfterAll（类级）。顺序固定，非随机。", "kaodian": "AI质量保障-自动化测试-JUnit5"}, {"no": 20, "type": "single", "body": "缺陷管理中，Severity（严重度）与 Priority（优先级）的关系是？", "code": "// 例：拼写错误——Severity 低，但出现在首页大标题——Priority 高", "options": [{"k": "A", "t": "Severity 与 Priority 永远一致"}, {"k": "B", "t": "Priority 由开发定，Severity 由测试定，互不影响"}, {"k": "C", "t": "Severity 高的缺陷 Priority 一定高"}, {"k": "D", "t": "二者常相关但不等价：Severity 看技术影响，Priority 看业务修复紧急度"}], "answer": "D", "explain": "Severity（严重度）描述缺陷对系统的技术破坏程度（崩溃/功能失效/UI）；Priority（优先级）描述业务上修复的紧急程度。二者常正相关但不等价：如首页错别字 Severity 低但 Priority 高。需分别评估。", "kaodian": "AI质量保障-软件测试理论与质量体系-缺陷定级"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "保障『缓存与数据库一致』的常见策略有？", "code": "// 策略A：Cache-Aside 先更新DB再删缓存\n// 策略B：延迟双删\n// 策略C：更新DB后发 binlog 由 Canal 同步删/更缓存\n// 策略D：写时加分布式锁串行化", "options": [{"k": "A", "t": "Cache-Aside：更新 DB 后删除缓存，读时回填"}, {"k": "B", "t": "延迟双删：更新后删缓存，延迟再删一次清脏值"}, {"k": "C", "t": "Canal 订阅 binlog 异步保证缓存最终一致"}, {"k": "D", "t": "任何策略都能做到实时强一致"}], "answer": ["A", "B", "C"], "explain": "三种都是业界常用的最终一致策略：Cache-Aside 先更新DB再删缓存（A）；延迟双删缓解脏写（B）；Canal 基于 binlog 异步同步（C）。D 错误：缓存与 DB 天然是最终一致，难以做到实时强一致（除非牺牲性能用强一致协议）。", "kaodian": "AI后端能力-高并发与中间件层-缓存双写策略"}, {"no": 2, "type": "multi", "body": "分布式事务的实现思路包括？", "code": "// Seata AT 模式\n// TCC：Try-Confirm-Cancel\n// 本地消息表 + MQ 最终一致\n// RocketMQ 事务消息", "options": [{"k": "A", "t": "本地消息表 + MQ：本地事务与消息同库，异步保证最终一致"}, {"k": "B", "t": "两阶段提交（2PC）：强一致但锁资源、性能差"}, {"k": "C", "t": "只用数据库单事务即可跨服务保证"}, {"k": "D", "t": "Seata AT/TCC：框架托管分支事务与全局回滚"}], "answer": ["A", "B", "D"], "explain": "分布式事务跨服务，常见方案：Seata（AT 自动补偿 / TCC 三阶段，D）；本地消息表 + MQ 最终一致（A）；2PC/XA 强一致但高延迟（B）。C 错误：单库事务无法跨服务。", "kaodian": "AI后端能力-微服务与云原生层-分布式事务Seata"}, {"no": 3, "type": "multi", "body": "下列哪些写法会导致 MySQL 索引失效？", "code": "-- 列上做函数运算\nWHERE YEAR(create_time) = 2024\n-- 隐式类型转换\nWHERE phone = 13800000000   -- phone 是 varchar\n-- 前模糊\nWHERE name LIKE '%明'\n-- 最左前缀缺首列\nWHERE b=1 AND c=2  -- idx(a,b,c)", "options": [{"k": "A", "t": "LIKE '%明' 前模糊匹配"}, {"k": "B", "t": "联合索引跳过最左列 b=1 AND c=2"}, {"k": "C", "t": "在索引列上使用函数（YEAR(create_time)）"}, {"k": "D", "t": "字符串列与数字比较触发隐式类型转换"}], "answer": ["A", "B", "C", "D"], "explain": "四种都是典型索引失效场景：列上函数运算使优化器无法用索引（C）；varchar 与数字比较触发隐式转换（D）；前模糊 %x 无法走 D+Tree 前缀（A）；联合索引缺最左列（B）。全选。", "kaodian": "AI后端能力-数据存储与ORM层-SQL索引失效"}, {"no": 4, "type": "multi", "body": "Vue3 组件间通信方式包括？", "code": "// 父->子\n<Child :msg=\"m\" @ok=\"onOk\" />\n// 跨层级\nprovide('key', val); inject('key')\n// 全局\nconst store = useXxxStore();", "options": [{"k": "A", "t": "只能用全局事件总线，Vue3 不支持其它方式"}, {"k": "B", "t": "props 向下传、emit 向上发事件"}, {"k": "C", "t": "provide/inject 跨多层传递"}, {"k": "D", "t": "Pinia/Vuex 全局状态管理"}], "answer": ["B", "C", "D"], "explain": "Vue3 通信：父子用 props + emit（B）；跨层用 provide/inject（C）；全局用 Pinia/Vuex（D）。A 错误：Vue3 移除了 $on 事件总线，推荐上述方式。", "kaodian": "AI前端能力-语言与运行时-Vue3组件通信"}, {"no": 5, "type": "multi", "body": "用浏览器 DevTools 定位性能问题，常用手段有？", "code": "// Performance 面板录制的火焰图\n// Network 面板看请求耗时/瀑布\n// Memory 面板抓堆快照查泄漏\n// Lighthouse 跑性能评分", "options": [{"k": "A", "t": "Performance 面板录制火焰图分析长 前端能力-前端基础与渲染引擎-CSS动画合成层"}, {"no": 3, "type": "judge", "body": "HTTP 强缓存（Cache-Control: max-age）命中时，浏览器不发请求直接读本地；协商缓存（ETag/Last-Modified）未命中才发请求校验。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "强缓存（Cache-Control/Expires）生效时浏览器直接用本地副本、不发请求；协商缓存（ETag/Last-Modified）是发请求带上校验头，由服务端决定是否 304 复用。二者层级不同，强缓存优先级更高。", "kaodian": "AI前端能力-网络与BFF架构-HTTP缓存"}, {"no": 4, "type": "judge", "body": "并发用户数上升时，系统 TPS（每秒事务数）一定单调上升，不会出现下降。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "系统存在性能拐点，超过瓶颈后 TPS 会下降甚至雪崩，故不单调。", "kaodian": "AI质量保障-软件测试理论与质量体系-性能测试指标"}, {"no": 5, "type": "judge", "body": "测试环境与数据必须隔离，禁止自动化用例直连生产数据库。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "测试（尤其自动化回归）应连独立测试环境/测试库，直连生产会污染真实数据、引发安全事故，且环境不稳定导致用例 flaky。数据隔离是测试可信的前提。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试数据隔离"}, {"no": 6, "type": "judge", "body": "质量门禁（单测覆盖率、Sonar 扫描）只是参考指标，不达标也能合入主干。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "质量门禁不达标应阻断合入，防止低质量代码流入主干。", "kaodian": "AI质量保障-CI/CD与质量门禁-发布门禁"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
