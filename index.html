function loadLocal(id){ try{ return JSON.parse(localStorage.getItem('fsp:'+id)); }catch(e){ return null; } }

async function render(){
  const topbar=document.getElementById('topbar');
  if(QB && QB.isLogin()){
    topbar.innerHTML='<span class="who">已登录：'+QB.user()+'</span>'
      +'<button class="btn btn-ghost" onclick="exportWrongs()">\u5bfc\u51fa\u9519\u9898</button>'
      +'<button class="btn btn-ghost" onclick="doLogout()">登出</button>';
  } else {
    topbar.innerHTML='<span class="who">未登录，记录仅存本机。'
      +'<a onclick="doLogin()">登录 / 注册</a> 可跨设备同步</span>'
      +'<button class="btn btn-ghost" onclick="exportWrongs()">\u5bfc\u51fa\u9519\u9898</button>';
  }
  let recs={};
  if(QB && QB.isLogin()){
    try{ const list=await QB.apiGet('/api/records'); list.forEach(r=>recs[r.volId]=r); }
    catch(e){ recs=localMap(); }
  } else { recs=localMap(); }

  let doneCount=0, wrongTotal=0, scoreSum=0, scoreTotal=0;
  let html='';
  QUIZZES.forEach(q=>{
    const r=recs[q.id]; const done=!!r;
    const score=r?r.score:0, total=r?r.total:q.total, wrong=r?JSON.parse(r.wrong||'[]'):[];
    if(done){ doneCount++; wrongTotal+=wrong.length; scoreSum+=score; scoreTotal+=total; }
    html+='<div class="card'+(done?' completed':'')+'">';
    html+='<div class="info"><div class="t">'+q.title
        + (done?' <span class="badge done">\u2714 \u5df2\u5b8c\u6210</span>':'')
        + (done&&wrong.length?' <span class="badge wrong">\u9519 '+wrong.length+' \u9898</span>':'')
        +'</div>';
    html+='<div class="d">'+(done? ('\u5f97\u5206 '+score+'/'+total+'\u3000\u00b7\u3000\u6b63\u786e\u7387 '+Math.round(score/total*100)+'%') : '\u5355\u9009 / \u591a\u9009 / \u5224\u65ad \u00b7 \u542b\u7b54\u6848+\u8bb2\u89e3')+'</div></div>';
    html+='<a class="open" href="'+q.file+'">'+(done?'\u67e5\u770b/\u590d\u4e60 \u2192':'\u5f00\u59cb\u7b54\u9898 \u2192')+'</a>';
    if(done) html+='<button class="redo" onclick="redo(\''+q.id+'\')">\u91cd\u505a</button>';
    if(done && wrong.length) html+='<a class="redo" href="'+q.file+'?mode=wrong">\u53ea\u770b\u9519\u9898</a>';
    html+='</div>';
  });
  document.getElementById('list').innerHTML=html;
  document.getElementById('stat').innerHTML=
     '<div class="item"><div class="n">'+QUIZZES.length+'</div><div class="l">\u603b\u5377\u6570</div></div>'
    +'<div class="item"><div class="n">'+doneCount+'</div><div class="l">\u5df2\u5b8c\u6210</div></div>'
    +'<div class="item"><div class="n red">'+wrongTotal+'</div><div class="l">\u7d2f\u8ba1\u9519\u9898</div></div>'
    +'<div class="item"><div class="n">'+(scoreTotal? Math.round(scoreSum/scoreTotal*100):0)+'%</div><div class="l">\u5e73\u5747\u6b63\u786e\u7387</div></div>';
}
function localMap(){
  const m={}; QUIZZES.forEach(q=>{ const s=loadLocal(q.id); if(s&&s.done) m[q.id]={score:s.score,total:s.total,wrong:JSON.stringify(s.wrong)}; });
  return m;
}
function redo(id){ if(confirm('\u6e05\u9664\u8be5\u5377\u8bb0\u5f55\u5e76\u91cd\u505a\uff1f')){ localStorage.removeItem('fsp:'+id); render(); } }
function doLogin(){ QB.showLogin(()=>render()); }
function doLogout(){ QB.clear(); render(); }

// ---- \u5bfc\u51fa\u9519\u9898\uff08\u4f9b\u5f31\u70b9\u5f3a\u5316\u5377\u5206\u6790\u4f7f\u7528\uff09----
// wrong \u91cc\u5b58\u7684\u662f\u5168\u5c40\u9898\u53f7 1..33\uff0c\u5de5\u4f5c\u533a\u4fa7\u53ef\u53cd\u67e5\u8003\u70b9
async function collectRecords(){
  let recs={};
  if(QB && QB.isLogin()){
    try{ const list=await QB.apiGet('/api/records'); list.forEach(r=>recs[r.volId]=r); }
    catch(e){ recs=localMap(); }
  } else { recs=localMap(); }
  const out=[];
  QUIZZES.forEach(q=>{
    const r=recs[q.id]; if(!r) return;
    let wrong=[];
    try{ wrong = typeof r.wrong==='string' ? JSON.parse(r.wrong||'[]') : (r.wrong||[]); }catch(e){ wrong=[]; }
    out.push({volId:q.id, score:r.score, total:r.total, wrong:wrong});
  });
  return out;
}
async function exportWrongs(){
  const records=await collectRecords();
  if(!records.length){ alert('\u8fd8\u6ca1\u6709\u4efb\u4f55\u5df2\u5b8c\u6210\u7684\u5377\uff0c\u5148\u53bb\u505a\u51e0\u5377\u518d\u5bfc\u51fa\u3002'); return; }
  const wrongSum=records.reduce((s,r)=>s+r.wrong.length,0);
  const payload={
    exportedAt:new Date().toISOString(),
    source:'portal',
    user:(QB&&QB.isLogin())?QB.user():'local',
    records:records
  };
  showExportModal(JSON.stringify(payload), records.length, wrongSum);
}
function showExportModal(txt, volN, wrongSum){
  const old=document.getElementById('qb-export-modal'); if(old) old.remove();
  const m=document.createElement('div');
  m.id='qb-export-modal';
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
  const box=document.createElement('div');
  box.style.cssText='background:#fff;border-radius:12px;width:520px;max-width:100%;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.2);box-sizing:border-box;';
  const h=document.createElement('div');
  h.style.cssText='font-size:17px;font-weight:700;margin-bottom:4px;';
  h.textContent='\u5bfc\u51fa\u9519\u9898\u6570\u636e';
  const d=document.createElement('div');
  d.style.cssText='font-size:12px;color:#8a9099;margin-bottom:14px;line-height:1.6;';
  d.textContent='\u5df2\u6c47\u603b '+volN+' \u5377\u3001\u5171 '+wrongSum+' \u9053\u9519\u9898\u3002\u590d\u5236\u4e0b\u65b9\u5185\u5bb9\u53d1\u7ed9 AI\uff08\u6216\u4e0b\u8f7d\u6587\u4ef6\u653e\u5165\u5de5\u4f5c\u533a wrongbook/ \u76ee\u5f55\uff09\uff0c\u4e0b\u4e00\u671f\u5c31\u4f1a\u81ea\u52a8\u751f\u6210\u9488\u5bf9\u5f31\u9879\u8003\u70b9\u7684\u5f3a\u5316\u5377\u3002';
  const ta=document.createElement('textarea');
  ta.readOnly=true; ta.value=txt;
  ta.style.cssText='width:100%;height:150px;padding:10px;border:1px solid #d0d3d9;border-radius:8px;font-size:12px;font-family:ui-monospace,Consolas,monospace;box-sizing:border-box;resize:vertical;';
  const row=document.createElement('div');
  row.style.cssText='display:flex;gap:8px;margin-top:14px;';
  const bCopy=document.createElement('button');
  bCopy.style.cssText='flex:1;padding:10px;border:none;border-radius:8px;background:#1664ff;color:#fff;font-weight:700;cursor:pointer;font-size:14px;';
  bCopy.textContent='\u590d\u5236';
  bCopy.onclick=function(){
    ta.select();
    const done=function(){ bCopy.textContent='\u5df2\u590d\u5236 \u2714'; setTimeout(function(){ bCopy.textContent='\u590d\u5236'; },1600); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, function(){ try{ document.execCommand('copy'); done(); }catch(e){} }); }
    else { try{ document.execCommand('copy'); done(); }catch(e){} }
  };
  const bDl=document.createElement('button');
  bDl.style.cssText='flex:1;padding:10px;border:1px solid #d0d3d9;border-radius:8px;background:#fff;color:#41464b;font-weight:700;cursor:pointer;font-size:14px;';
  bDl.textContent='\u4e0b\u8f7d JSON';
  bDl.onclick=function(){
    const blob=new Blob([txt],{type:'application/json'});
    const a=document.createElement('a');
    const dt=new Date(); const pad=function(n){ return n<10?'0'+n:''+n; };
    a.href=URL.createObjectURL(blob);
    a.download='wrongbook_'+dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
  };
  const bClose=document.createElement('button');
  bClose.style.cssText='width:100%;padding:9px;border:none;background:transparent;color:#8a9099;cursor:pointer;margin-top:10px;font-size:13px;';
  bClose.textContent='\u5173\u95ed';
  bClose.onclick=function(){ m.remove(); };
  row.appendChild(bCopy); row.appendChild(bDl);
  box.appendChild(h); box.appendChild(d); box.appendChild(ta); box.appendChild(row); box.appendChild(bClose);
  m.appendChild(box);
  m.onclick=function(e){ if(e.target===m) m.remove(); };
  document.body.appendChild(m);
}
render();
</script>
