<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2329; margin: 0; padding: 24px 24px 96px; line-height: 1.65; }
  .container { max-width: 880px; margin: 0 auto; }

  .opt.wrong { background: #fff1f0; border-color: #ff4d4f; }

  .blank.wrong { border-bottom-color:#ff4d4f; background:#fff1f0; }

  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }

  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }

  .result-panel .wrongs { margin-top:8px; font-size:14px; }

    .opt { padding: 8px 10px; font-size: 13px; }

    .btn { padding: 7px 12px; font-size: 13px; }

<script type="application/json" id="quizData">{"id": "vol12", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "深分页 SELECT * FROM t LIMIT 1000000, 20 性能差的根因是？", "code": "SELECT * FROM orders ORDER BY id LIMIT 1000000, 20;\n-- 优化：用上一页最大 id 游标\nSELECT * FROM orders WHERE id > 1000000 ORDER BY id LIMIT 20;", "options": [{"k": "A", "t": "LIMIT 大偏移需先扫描并丢弃前 100 万行，优化可用『游标/延迟关联』避免"}, {"k": "B", "t": "深分页比普通分页更快"}, {"k": "C", "t": "加索引即可完全消除偏移开销"}, {"k": "D", "t": "LIMIT 偏移越大越省资源"}], "answer": "A", "explain": "LIMIT 1000000,20 要先定位并丢弃前 100 万行再取 20 行，IO 巨大。优化常用『延迟关联/游标分页』：WHERE id>上一页最大id LIMIT 20，用索引定位避免扫废行。加索引不能消除偏移丢弃（C 错）。", "kaodian": "AI后端能力-数据存储与ORM层-SQL深分页"}, {"no": 2, "type": "single", "body": "InnoDB 中下列 UPDATE 可能把行锁升级为表锁的是？", "code": "-- 无索引列做更新条件\nUPDATE account SET balance=0 WHERE name = '张三';\n-- name 无索引", "options": [{"k": "A", "t": "加事务注解即可避免锁表"}, {"k": "B", "t": "WHERE 条件列无索引时，InnoDB 无法精准锁行，会锁住更多甚至全表"}, {"k": "C", "t": "InnoDB 永远只锁单行，不会升级"}, {"k": "D", "t": "只有 MyISAM 才锁表，InnoDB 不会"}], "answer": "B", "explain": "InnoDB 行锁建立在索引上：UPDATE 的 WHERE 列若无索引，无法定位到具体行，会退化为锁全表（或未使用索引的记录），引发严重并发问题。必须用索引列做更新条件。C/D/A 均错。", "kaodian": "AI后端能力-数据存储与ORM层-SQL行锁表锁"}, {"no": 3, "type": "single", "body": "Spring AOP 默认代理方式，下列正确的是？", "code": "// 目标类实现接口 -> JDK 动态代理\n// 目标类无接口 -> CGLIB 代理（SpringBoot 2.x 默认全用 CGLIB）", "options": [{"k": "A", "t": "Spring 永远只用 CGLIB"}, {"k": "B", "t": "代理方式由数据库类型决定"}, {"k": "C", "t": "有接口用 JDK 动态代理，无接口用 CGLIB；SpringBoot 2.x 起默认 CGLIB"}, {"k": "D", "t": "Spring 永远只用 JDK 动态代理"}], "answer": "C", "explain": "Spring AOP：目标实现接口时默认 JDK 动态代理（基于接口），否则 CGLIB（基于子类继承）；SpringBoot 2.x 默认 proxyTargetClass=true 统一用 CGLIB。代理方式与数据库无关。", "kaodian": "AI后端能力-应用框架层-SpringAOP代理"}, {"no": 4, "type": "single", "body": "RabbitMQ 消息进入死信队列（DLX）的触发条件，下列正确的是？", "code": "// 队列声明绑定死信交换机\nargs.put(\"x-dead-letter-exchange\", \"dlx\");\n// 触发：消息被拒绝(nack/reject 且 requeue=false)、TTL 过期、队列满", "options": [{"k": "A", "t": "只有消费者崩溃才会进死信"}, {"k": "B", "t": "消息发送失败直接进死信"}, {"k": "C", "t": "死信队列需要手动轮询才能拿到消息"}, {"k": "D", "t": "消息被拒绝且不重入队、或 TTL 过期、或队列满，都会进死信队列"}], "answer": "D", "explain": "死信（DLQ）触发三条件：① 消息被 basicReject/Nack 且 requeue=false；② 消息 TTL 过期；③ 队列达到最大长度。进死信后由死信交换机路由到死信队列，可用于延迟/重试/告警。A/B 窄化；C 死信队列也是普通队列，消费即可。", "kaodian": "AI后端能力-高并发与中间件层-RabbitMQ死信队列"}, {"no": 5, "type": "single", "body": "高并发计数器，下列更优的是？", "code": "// AtomicInteger\natomic.incrementAndGet();\n// LongAdder（分段 Cell，高争用更低开销）\nadder.increment();", "options": [{"k": "A", "t": "高争用计数场景用 LongAdder（分段 CAS）比 AtomicLong 吞吐更高"}, {"k": "B", "t": "AtomicInteger 在任何并发度都优于 LongAdder"}, {"k": "C", "t": "synchronized 自增性能最好"}, {"k": "D", "t": "用 volatile int 自增即可保证原子"}], "answer": "A", "explain": "LongAdder 内部用多个 Cell 分段累加，高并发写争用时分散热点，吞吐优于 AtomicLong；低争用两者接近。volatile int 自增非原子（D 错，需读-改-写原子）；synchronized 串行化更低效。", "kaodian": "AI后端能力-语言与计算层-原子类"}, {"no": 6, "type": "single", "body": "API 网关（Gateway）的核心职责不包括？", "code": "// 网关通常做：路由转发、鉴权、限流、熔断、日志\n// 业务 CRUD 在后端服务", "options": [{"k": "A", "t": "熔断降级与灰度路由"}, {"k": "B", "t": "执行业务核心 CRUD 逻辑（应由后端服务负责）"}, {"k": "C", "t": "统一鉴权与限流"}, {"k": "D", "t": "请求路由与协议转换"}], "answer": "B", "explain": "网关是横切层：路由转发、统一鉴权、限流、熔断、日志、灰度。业务核心 CRUD 属于后端微服务自身职责，不应堆在网关。C/D/A 都是网关职责。", "kaodian": "AI后端能力-微服务与云原生层-网关"}, {"no": 7, "type": "single", "body": "MyBatis-Plus 批量插入 saveBatch 的注意点是？", "code": "userService.saveBatch(list, 1000);  // 每批 1000", "options": [{"k": "A", "t": "saveBatch 不支持事务"}, {"k": "B", "t": "批大小设越大越好，无副作用"}, {"k": "C", "t": "saveBatch 默认按批大小分批执行，可显著减少与 DB 的交互次数"}, {"k": "D", "t": "saveBatch 与单条 insert 性能完全相同"}], "answer": "C", "explain": "saveBatch 把集合按 batchSize 分批提交，减少网络往返与语句解析，大批量插入明显快于逐条。它仍可在事务内（A 错）；批大小过大占内存/单条超长 SQL，并非越大越好（B 错）。", "kaodian": "AI后端能力-数据存储与ORM层-MP批量操作"}, {"no": 8, "type": "single", "body": "Vue3 provide / inject 适合的场景是？", "code": "// 祖先\nprovide('theme', ref('dark'));\n// 任意后代\nconst theme = inject('theme');", "options": [{"k": "A", "t": "只能在父子相邻两层使用"}, {"k": "B", "t": "provide 的数据后代无法修改"}, {"k": "C", "t": "inject 必须配合 vuex 才能用"}, {"k": "D", "t": "跨多层组件传递数据，避免逐层 props 透传（prop drilling）"}], "answer": "D", "explain": "provide/inject 用于跨层级依赖注入：祖先 provide 一个值，任意后代 inject 取得，避免中间层逐层透传 props。它不限相邻两层（A 错）；若提供 ref/reactive 后代可改（B 错）；与 vuex 无关（C 错）。", "kaodian": "AI前端能力-语言与运行时-Vue3 provide/inject"}, {"no": 9, "type": "single", "body": "CSS transition 与 animation 的区别，正确的是？", "code": "transition: width .3s;          /* 状态切换过渡 */\n@keyframes spin { to { transform: rotate(360deg);} }\nanimation: spin 1s linear infinite;", "options": [{"k": "A", "t": "transition 用于两状态间平滑过渡；animation 用关键帧做复杂多步动画、可循环"}, {"k": "B", "t": "transition 可以无限循环而 animation 不能"}, {"k": "C", "t": "animation 只能过渡两个状态"}, {"k": "D", "t": "两者完全一样"}], "answer": "A", "explain": "transition 适合『属性值变化』的平滑过渡（需触发状态改变）；animation + @keyframes 可定义多关键帧、控制方向/次数/无限循环，适合复杂动画。B/C 反了；D 错。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS过渡与动画"}, {"no": 10, "type": "single", "body": "HTTP/2 相比 HTTP/1.1 在前端性能上的关键改进是？", "code": "// 同一 TCP 连接上多路复用，并行多个请求/响应\n// 头部压缩 HPACK，减少重复头开销", "options": [{"k": "A", "t": "HTTP/2 比 HTTP/1.1 更慢"}, {"k": "B", "t": "多路复用：单连接并行多个请求，消除队头阻塞，无需域名分片"}, {"k": "C", "t": "HTTP/2 每个请求仍需独立 TCP 连接"}, {"k": "D", "t": "HTTP/2 不支持头部压缩"}], "answer": "B", "explain": "HTTP/2 关键改进：① 多路复用（单连接并行请求/响应，解决 HTTP/1.1 队头阻塞，无需为并发做域名分片）；② HPACK 头部压缩。C/D/A 均与事实相反。", "kaodian": "AI前端能力-网络与BFF架构-网络请求优化"}, {"no": 11, "type": "single", "body": "TypeScript 装饰器（Decorator）常用于？", "code": "@Log()\nmethod() {}\n// 或类装饰器、属性装饰器\n@Injectable()\nexport class UserService {}", "options": [{"k": "A", "t": "装饰器会删除被装饰的方法"}, {"k": "B", "t": "装饰器是 CSS 的概念"}, {"k": "C", "t": "在不修改原逻辑的情况下为类/方法/属性附加横切能力（日志、依赖注入、校验）"}, {"k": "D", "t": "装饰器只能用于变量声明"}], "answer": "C", "explain": "TS 装饰器是实验性特性（或 TC39 标准版），用于元编程：类/方法/属性/参数装饰器可在不改动原代码情况下附加日志、DI、校验等横切逻辑（如 NestJS 的 @Injectable）。D/A/B 均错。", "kaodian": "AI前端能力-语言与运行时-TS装饰器"}, {"no": 12, "type": "single", "body": "下列 Generator 代码的输出是？", "code": "function* gen() {\n  yield 1; yield 2; return 3;\n}\nconst g = gen();\nconsole.log(g.next().value); // 1\nconsole.log(g.next().value); // 2\nconsole.log(g.next().value); // ?", "options": [{"k": "A", "t": "undefined"}, {"k": "B", "t": "再次输出 2"}, {"k": "C", "t": "抛出错误"}, {"k": "D", "t": "3（return 的值作为最后一次 next 的 value，done 为 true）"}], "answer": "D", "explain": "Generator 每次 next() 执行到下一个 yield 暂停并返回其右值；return 的值在最后一次 next() 中作为 value 返回且 done=true。所以第三次 next() 得到 value=3。", "kaodian": "AI前端能力-语言与运行时-生成器Generator"}, {"no": 13, "type": "single", "body": "前端监控（RUM）通常采集的指标不包括？", "code": "// 采集：白屏/首屏、资源加载、JS 错误、接口耗时、PV/UV\n// 上报：sendBeacon 不阻塞", "options": [{"k": "A", "t": "用户银行卡密码明文"}, {"k": "B", "t": "页面性能（首屏/白屏）"}, {"k": "C", "t": "JS 运行时错误"}, {"k": "D", "t": "接口请求耗时与状态码"}], "answer": "A", "explain": "前端监控采集性能（首屏/白屏）、错误（JS 异常/资源加载失败）、接口耗时、PV/UV 等，但严禁采集用户敏感信息（密码/银行卡明文）。B/C/D 都是常规采集项。", "kaodian": "AI前端能力-前端生态-前端监控"}, {"no": 14, "type": "single", "body": "CSS 伪类 :hover 与伪元素 ::before 的区别是？", "code": "a:hover { color: red; }       /* 伪类：状态 */\np::before { content: '★'; }     /* 伪元素：插入生成内容 */", "options": [{"k": "A", "t": "两者无任何区别"}, {"k": "B", "t": "伪类描述元素状态/特征（如 :hover/:nth-child），伪元素创建/选取元素的某部分（::before/::after）"}, {"k": "C", "t": "伪类用于插入内容，伪元素用于选状态"}, {"k": "D", "t": "::before 必须配合 :hover 使用"}], "answer": "B", "explain": "伪类（单冒号）选中处于特定状态的元素（:hover、:focus、:nth-child）；伪元素（双冒号）创建或选中元素的某个部分（::before、::after、::first-line），可插入生成内容。C 反了；D/A 错。", "kaodian": "AI前端能力-前端基础与渲染引擎-伪类与伪元素"}, {"no": 15, "type": "single", "body": "测试『准入/准出』准则是指？", "code": "// 准入：代码合入测试分支前需通过冒烟\n// 准出：发布前需满足覆盖率/用例通过率门槛", "options": [{"k": "A", "t": "只有准出、没有准入概念"}, {"k": "B", "t": "准入准出都由开发单方面决定"}, {"k": "C", "t": "准入=测试可开始的门槛；准出=测试通过可发布的门槛，二者界定测试阶段边界"}, {"k": "D", "t": "准入准出是同一个意思"}], "answer": "C", "explain": "准入准则（Entry Criteria）：具备哪些条件测试才能开始（如环境就绪、冒烟通过）；准出准则（Exit Criteria）：满足哪些条件才能结束/发布（如覆盖率、通过率、缺陷收敛）。界定测试阶段边界，常由质量团队与干系人共定。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试准入准出"}, {"no": 16, "type": "single", "body": "制定测试策略时，应优先考虑？", "code": "// 综合：风险、资源、进度、质量目标\nstrategy = f(risk, resource, schedule, quality_goal)", "options": [{"k": "A", "t": "一律追求 100% 覆盖所有路径"}, {"k": "B", "t": "只测核心功能，忽略边界"}, {"k": "C", "t": "照搬其它项目的策略不改"}, {"k": "D", "t": "结合项目风险、资源、进度与质量目标，确定测什么、怎么测、测多深"}], "answer": "D", "explain": "测试策略是宏观规划：基于风险/资源/进度/质量目标，决定测试范围、深度、方法、环境。盲目 100% 覆盖不现实（A）；只测核心漏边界（B）；照搬不顾差异（C）都不妥。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试策略"}, {"no": 17, "type": "single", "body": "用 JMeter 做性能压测，下列做法正确的是？", "code": "// 设置线程数(并发用户)=200，ramp-up=60s，循环=10\n// 监听：聚合报告看吞吐/平均响应时间/错误率", "options": [{"k": "A", "t": "用线程组模拟并发用户，配合聚合报告观察吞吐/响应时间/错误率"}, {"k": "B", "t": "压测时所有用例串行单线程最准"}, {"k": "C", "t": "只看用例通过数不看吞吐"}, {"k": "D", "t": "压测无需逐步加压，直接拉满"}], "answer": "A", "explain": "JMeter 用线程组模拟并发用户（线程数=并发），ramp-up 控制加压节奏，聚合报告给出吞吐/平均 RT/错误率。压测应逐步加压找拐点（D 错）；仅看通过数忽视吞吐（C 错）会漏性能问题。", "kaodian": "AI质量保障-软件测试理论与质量体系-性能压测工具"}, {"no": 18, "type": "single", "body": "接口安全测试应重点检查？", "code": "// 越权：普通用户访问管理员接口\n// 注入：参数拼 SQL/命令\n// 敏感信息泄露", "options": [{"k": "A", "t": "安全测试只能在生产环境做"}, {"k": "B", "t": "越权访问（水平/垂直）、注入、敏感信息泄露、认证绕过"}, {"k": "C", "t": "只检查响应是否 200"}, {"k": "D", "t": "接口安全与功能测试无关"}], "answer": "B", "explain": "接口安全测试重点：水平越权（改 ID 看他人数据）、垂直越权（普通用户调管理员接口）、SQL/命令注入、敏感字段泄露、认证/鉴权绕过。只查 200（C）会漏越权；可在测试环境用授权数据做（A 错）。", "kaodian": "AI质量保障-接口测试-接口安全测试"}, {"no": 19, "type": "single", "body": "用 AI 生成自动化测试脚本时，正确的是？", "code": "script = ai.generate(test_case=case, framework='playwright')\n// 生成的脚本如何使用？", "options": [{"k": "A", "t": "AI 只能生成伪代码不能生成可运行脚本"}, {"k": "B", "t": "AI 生成脚本越多越好不考虑稳定性"}, {"k": "C", "t": "AI 生成脚本骨架后需人工审查定位器/断言/数据，确保稳定可维护再入套件"}, {"k": "D", "t": "AI 生成的脚本直接合入主干无需审查"}], "answer": "C", "explain": "AI 能生成 Playwright/Cypress 等脚本骨架，但定位器是否稳定（避免脆弱选择器）、断言是否正确、数据是否隔离都需人工审查，否则会引入 flaky。D 越权；脚本可运行（A 错）；稳定性优先（B 错）。", "kaodian": "AI质量保障-AI辅助测试-AI辅助测试脚本生成"}, {"no": 20, "type": "single", "body": "测试环境隔离的正确做法是？", "code": "// 每特性分支部署独立环境 / 或用容器按需起环境\n// 测试库与开发库、生产库分离", "options": [{"k": "A", "t": "测试环境直接连生产库最真实"}, {"k": "B", "t": "所有团队共用一个测试库无需隔离"}, {"k": "C", "t": "环境隔离只针对生产"}, {"k": "D", "t": "测试环境/数据库与开发、生产隔离，避免相互干扰与污染"}], "answer": "D", "explain": "环境隔离：测试环境（含测试库）应与开发、生产分离，按需为分支/特性起独立环境（容器化），避免数据污染、并发干扰、误伤生产。直连生产（A）危险；共用库（B）易冲突。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试环境隔离"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "Spring 统一异常处理的正确用法有？", "code": "@RestControllerAdvice\npublic class GlobalExHandler {\n  @ExceptionHandler(BizException.class)\n  public R handle(BizException e) { return R.fail(e.getCode(), e.getMsg()); }\n}", "options": [{"k": "A", "t": "用 @RestControllerAdvice + @ExceptionHandler 集中拦截指定异常并返回统一结构"}, {"k": "B", "t": "可在 @ExceptionHandler 中按异常类型分别处理（业务/校验/系统）"}, {"k": "C", "t": "统一异常处理避免在各 Controller 散落 try-catch"}, {"k": "D", "t": "统一异常处理会吞掉所有异常导致无法排查"}], "answer": ["A", "B", "C"], "explain": "全局异常处理：@RestControllerAdvice（或 @ControllerAdvice）配合 @ExceptionHandler 按异常类型统一返回结构（A、B），把错误处理从业务代码抽离（C）。良好实现会记录日志而非吞异常（D 错，记录后仍返回友好结构）。", "kaodian": "AI后端能力-应用框架层-SpringMVC统一异常"}, {"no": 2, "type": "multi", "body": "熔断、降级、限流三者的关系是？", "code": "// 限流：控制进入系统的流量\n// 熔断：依赖故障时快速失败，不再压垮调用\n// 降级：返回兜底/简化逻辑保核心", "options": [{"k": "A", "t": "熔断：下游故障时快速失败、避免雪崩扩散"}, {"k": "B", "t": "降级：故障时返回兜底/简化结果，保核心可用"}, {"k": "C", "t": "三者完全等价，随便用一个即可"}, {"k": "D", "t": "限流：保护自身不被过量请求压垮"}], "answer": ["A", "B", "D"], "explain": "三件套定位不同：限流护己（控制入口流量）、熔断护链路（下游挂了快速失败防雪崩）、降级保核心（返回兜底）。常配合使用（如 Sentinel），并非等价（C 错）。", "kaodian": "AI后端能力-微服务与云原生层-熔断降级"}, {"no": 3, "type": "multi", "body": "事务隔离级别对应可避免的并发现象，正确的有？", "code": "READ UNCOMMITTED -> 脏读\nREAD COMMITTED   -> 不可重复读\nREPEATABLE READ  -> 幻读(InnoDB靠锁避免)\nSERIALIZABLE     -> 全避免", "options": [{"k": "A", "t": "REPEATABLE READ 避免不可重复读（InnoDB 还防幻读）"}, {"k": "B", "t": "SERIALIZABLE 串行化，避免所有并发异常但性能最低"}, {"k": "C", "t": "READ UNCOMMITTED 会出现脏读（读到未提交数据）"}, {"k": "D", "t": "READ COMMITTED 避免脏读但可能出现不可重复读"}], "answer": ["A", "B", "C", "D"], "explain": "隔离级别递进：RU 有脏读；RC 无脏读但有不可重复读；RR（InnoDB）快照读防不可重复读、Next-Key Lock 防幻读；SERIALIZABLE 完全串行避免一切但最慢。全选。", "kaodian": "AI后端能力-数据存储与ORM层-事务隔离级别现象"}, {"no": 4, "type": "multi", "body": "前端构建与打包优化的常见手段有？", "code": "// Tree Shaking 删除未用导出\n// Code Splitting 按需分包\n// 资源 hash 长缓存 + CDN", "options": [{"k": "A", "t": "把所有依赖打进一个超大文件最省事"}, {"k": "B", "t": "Tree Shaking 剔除未引用的死代码（依赖 ESM 静态分析）"}, {"k": "C", "t": "代码分割（Code Splitting）按需加载、减小首包"}, {"k": "D", "t": "文件名加 content hash 实现长效缓存，配合 CDN 提速"}], "answer": ["B", "C", "D"], "explain": "构建优化：Tree Shaking 删死代码（需 ESM，B）；Code Splitting 分包按需加载（C）；content hash 文件名+CDN 做长效缓存（D）。A 反了：单大包首屏极慢。", "kaodian": "AI前端能力-前端生态-构建与打包"}, {"no": 5, "type": "multi", "body": "媒体查询实现响应式断点，下列做法正确的有？", "code": "@media (max-width: 768px) { .nav { display: none; } }\n@media (min-width: 1200px) { .container { max-width: 1140px; } }", "options": [{"k": "A", "t": "用 max-width 适配小屏（手机隐藏导航）"}, {"k": "B", "t": "用 min-width 适配大屏（桌面约束容器宽）"}, {"k": "C", "t": "移动优先：先写小屏基线样式，再用 min-width 向上增强"}, {"k": "D", "t": "断点应完全照搬某框架数值，不顾自身设计"}], "answer": ["A", "B", "C"], "explain": "响应式断点：max-width 命中小屏（A）、min-width 命中大屏（B）；移动优先（Mobile First）先小屏基线、min-width 向上增强（C）。断点应服从自身设计而非盲抄（D 错）。", "kaodian": "AI前端能力-前端基础与渲染引擎-媒体查询与响应式"}, {"no": 6, "type": "multi", "body": "缺陷生命周期（Defect Life Cycle）通常经历？", "code": "new -> open -> assigned -> fixed -> retest -> closed\n（或 reopen 若回归仍失败）", "options": [{"k": "A", "t": "若回归不通过可 re-open 重新打开"}, {"k": "B", "t": "缺陷发现后直接关闭无需修复"}, {"k": "C", "t": "修复后必须回归验证才能关闭"}, {"k": "D", "t": "新建→打开→分配→修复→回归验证→关闭"}], "answer": ["A", "C", "D"], "explain": "缺陷生命周期：提交(new)→确认打开(open)→指派(assigned)→修复(fixed)→回归(retest)→关闭(closed)；回归失败则 re-open。关闭前必须回归验证（C），不能跳过修复（B 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-缺陷生命周期"}, {"no": 7, "type": "multi", "body": "选择自动化测试框架时，应考虑？", "code": "// 单元: JUnit5/pytest\n// 接口: RestAssured/Postman\n// E2E: Playwright/Cypress/Selenium", "options": [{"k": "A", "t": "社区成熟度、报告与 CI 集成能力"}, {"k": "B", "t": "只看哪个框架名字最响，无视项目契合度"}, {"k": "C", "t": "测试类型匹配：单元/接口/UI 各有合适框架"}, {"k": "D", "t": "团队技术栈与学习成本"}], "answer": ["A", "C", "D"], "explain": "选型因素：测试层级匹配（单元用 JUnit5/pytest、UI 用 Playwright 等，C）、团队栈与成本（D）、生态/报告/CI 集成（A）。B 盲目追名牌不顾契合，不专业。", "kaodian": "AI质量保障-自动化测试-自动化测试框架"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "JVM 类加载采用双亲委派模型：子加载器先委托父加载器尝试加载，父无法加载时才自己加载。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "双亲委派：类加载请求先委派给父加载器，父加载器能加载就用父的，父失败才由子自己加载。好处是避免类重复加载、保证核心类（如 java.lang.Object）唯一安全。描述正确。", "kaodian": "AI后端能力-语言与计算层-类加载"}, {"no": 2, "type": "judge", "body": "ES Module（import/export）是动态的、运行时才确定依赖关系，不利于 Tree Shaking。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "ESM 是静态的、编译期确定依赖，便于 Tree Shaking；动态导入是 CommonJS 的特性。", "kaodian": "AI前端能力-语言与运行时-模块化ESM"}, {"no": 3, "type": "judge", "body": "事件委托（事件代理）利用事件冒泡，把子元素事件统一委托给祖先元素处理，可减少监听器数量并支持动态新增元素。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "事件委托：在共同祖先上监听，利用冒泡捕获到子孙事件（event.target 识别来源），好处是监听器少、动态新增的子元素自动生效、内存占用低。是前端经典优化手段。", "kaodian": "AI前端能力-前端生态-事件委托"}, {"no": 4, "type": "judge", "body": "测试替身中 Stub 与 Mock 完全相同，都是用来验证交互行为的。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "Stub 提供预设返回值（验证状态），Mock 验证交互行为，两者用途不同。", "kaodian": "AI质量保障-自动化测试-测试替身辨析"}, {"no": 5, "type": "judge", "body": "探索性测试与脚本测试是互补关系：脚本测试保证已知路径，探索性测试发现未知缺陷，不能相互取代。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "二者互补：脚本测试覆盖已知需求路径、可回归；探索性测试靠经验发现脚本未覆盖的异常/未知缺陷。各有侧重，不能互相替代（如只用探索性无法保证回归）。", "kaodian": "AI质量保障-软件测试理论与质量体系-探索性与脚本测试互补"}, {"no": 6, "type": "judge", "body": "CI 中即使有测试用例失败，只要失败数量少于阈值，仍可合入主干。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "任何用例失败都应阻断构建/合入，防止缺陷流入主干。", "kaodian": "AI质量保障-CI/CD与质量门禁-CI测试门禁"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
