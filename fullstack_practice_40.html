<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;

  .opt.wrong { background: #fff1f0; border-color: #ff4d4f; }

  .blank.wrong { border-bottom-color:#ff4d4f; background:#fff1f0; }

  .answer.show { display: block; }

  .bar .userbox a { color:#1664ff; cursor:pointer; text-decoration:none; }
  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }

  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }

  @media (max-width:600px) {

<script type="application/json" id="quizData">{"id": "vol40", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按「自如大学 7月认证考（均分 11/11/11）+ 全栈认证大纲 + AI时代全栈工程实战能力认证大纲」出题：后端≈33% / 前端≈33% / 测试≈33%。每题给真实可运行代码/配置/日志片段，考读代码判行为/找坑/补全，对齐真卷出题思路。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "@Scheduled 方法执行耗时 2 秒，fixedRate=1000，连续触发的实际行为？", "code": "@Scheduled(fixedRate = 1000)\npublic void job() throws InterruptedException {\n    log.info(\"start\");\n    Thread.sleep(2000);   // 模拟耗时\n    log.info(\"end\");\n}", "options": [{"k": "A", "t": "以“上一次开始时间”为基准调度；Spring 默认单线程调度器串行执行，到点未结束则等结束后立即补一次，不并发"}, {"k": "B", "t": "每 1 秒准时触发一次，与耗时无关"}, {"k": "C", "t": "上一次结束后等 0 秒再触发，实际约每 2 秒一次（这是 fixedDelay 的行为）"}, {"k": "D", "t": "任务会并发执行，多个实例同时跑"}], "answer": ["A"], "explain": "fixedRate 以“上一次开始时间”为基准排期；Spring 默认使用单线程的调度线程池，任务串行，若到点上次还没结束则等其结束后立即执行下一次，不会并发。fixedDelay 才是“上次结束后再等间隔”。", "kaodian": "AI后端能力-高并发与中间件层-定时任务调度"}, {"no": 2, "type": "single", "body": "采用 Cache-Aside 模式读取用户，缓存未命中时的正确读路径？", "code": "public User get(Long id){\n    User u = redis.get(\"u:\"+id);\n    if(u != null) return u;\n    u = db.selectById(id);\n    redis.set(\"u:\"+id, u, 5, MINUTES);   // 回填\n    return u;\n}", "options": [{"k": "A", "t": "先查库再查缓存，命中直接返回"}, {"k": "B", "t": "先查缓存，未命中则回源查库并回填缓存，再返回；后续请求命中缓存不再穿透 DB"}, {"k": "C", "t": "先查缓存，未命中直接返回 null（不查库）"}, {"k": "D", "t": "每次都查库并顺手删除缓存"}], "answer": ["B"], "explain": "Cache-Aside 读路径：先读缓存，未命中回源 DB 并把结果回填缓存，从而降低后续请求对 DB 的穿透。A 把顺序写反了，Cache-Aside 不先查库。", "kaodian": "AI后端能力-高并发与中间件层-缓存读写流程"}, {"no": 3, "type": "single", "body": "缓存统计：总读请求 1000 次，其中缓存命中 850 次、未命中回源 150 次且均回填成功。缓存命中率是多少？", "code": "总读请求 = 1000\n缓存命中 = 850\n回源     = 150  (均回填成功)", "options": [{"k": "A", "t": "82.5%"}, {"k": "B", "t": "90%"}, {"k": "C", "t": "85%"}, {"k": "D", "t": "15%"}], "answer": ["C"], "explain": "命中率 = 命中数 / 总请求数 = 850 / 1000 = 85%。回源请求是“未命中”部分，不计入命中。", "kaodian": "AI后端能力-高并发与中间件层-缓存命中率"}, {"no": 4, "type": "single", "body": "要把用户邮箱置为 NULL，下列 LambdaUpdateWrapper 写法正确的是？", "code": "LambdaUpdateWrapper<User> uw = new LambdaUpdateWrapper<>();\nuw.eq(User::getId, 1L);\n// 缺失一行：显式把 email 更新为 null\nuserMapper.update(null, uw);", "options": [{"k": "A", "t": "uw.set(User::getEmail, null);   // 默认 NOT_NULL 策略会忽略 null，不生成该字段"}, {"k": "B", "t": "uw.eq(User::getEmail, null);   // 这是条件不是赋值"}, {"k": "C", "t": "uw.set(User::getEmail, \"\");   // 设成空串而非 NULL"}, {"k": "D", "t": "uw.setSql(\"email = null\");   // 直接写 SQL 片段，强制生成 email = null"}], "answer": ["D"], "explain": "MyBatis-Plus 默认字段策略为 NOT_NULL，set(字段, null) 会被忽略、不生成 SQL；要真正把列置 NULL 需用 setSql(\"email = null\") 直接拼接 SQL 片段（或改字段策略为 IGNORED）。A 不生效，B 是条件，C 设的是空串。", "kaodian": "AI后端能力-数据存储与ORM层-MP字段更新策略"}, {"no": 5, "type": "single", "body": "配置如下，@Value 注入失败的根因？", "code": "// application.yml\napp:\n  max-retry: 3\n// Java\n@Value(\"${app.maxRetry}\")\nprivate int maxRetry;", "options": [{"k": "A", "t": "@Value 占位符使用精确属性名，不支持 relaxed binding；yml 里是 max-retry，而占位符写 app.maxRetry，找不到匹配 key"}, {"k": "B", "t": "yml 不支持嵌套配置"}, {"k": "C", "t": "int 类型不能从配置注入"}, {"k": "D", "t": "缺少 @ConfigurationProperties 注解（@Value 本就不需要它）"}], "answer": ["A"], "explain": "@Value(\"${...}\") 按精确属性名查找，不支持 relaxed binding（max-retry ↔ maxRetry 的连字符/驼峰转换）。@ConfigurationProperties 才支持宽松绑定。因此 ${app.maxRetry} 匹配不到 app.max-retry，启动报 Could not resolve placeholder。", "kaodian": "AI后端能力-后端框架与Spring层-配置注入松散绑定"}, {"no": 6, "type": "single", "body": "消息队列可能重复投递同一条消息（网络重投 / 手动 ack 前崩溃）。正确的幂等处理是？", "code": "@RabbitListener(queues=\"order\")\npublic void on(Order o, Channel ch, @Header(AmqpHeaders.DELIVERY_TAG) long tag){\n    // 此处应？\n    orderService.handle(o);\n    ch.basicAck(tag, false);\n}", "options": [{"k": "A", "t": "在 handle 前用 Redis/DB 唯一键记录“已处理消息ID”，处理前先查重，已存在则直接 ack 跳过"}, {"k": "B", "t": "增大消费者并发数即可避免重复"}, {"k": "C", "t": "把消息 TTL 设短即可避免重复"}, {"k": "D", "t": "把交换机换成 fanout 即可避免重复"}], "answer": ["B"], "explain": "消息中间件通常只保证 at-least-once，重复投递是常态；业务幂等必须靠“处理前查重键”（DB 唯一约束 / Redis SETNX 消息ID）。增大并发、缩短 TTL、换交换机都不能消除重复投递。", "kaodian": "AI后端能力-高并发与中间件层-消息幂等处理"}, {"no": 7, "type": "single", "body": "表 user(id, name, age)，有联合索引 idx_name_age(name, age)。下列查询是否命中覆盖索引（无需回表）？", "code": "SELECT name, age FROM user WHERE name = 'Tom' AND age > 18;", "options": [{"k": "A", "t": "必然回表，因为 age 用了范围条件，联合索引失效"}, {"k": "B", "t": "不会用 idx_name_age，因为 SELECT 没包含 id"}, {"k": "C", "t": "命中覆盖索引：idx_name_age 叶子已含 name、age，WHERE 与 SELECT 都在索引内，无需回表（Using index）"}, {"k": "D", "t": "只有查询所有列时才可能命中覆盖索引"}], "answer": ["C"], "explain": "联合索引 (name, age) 的叶子节点本身存储 name、age（及主键）。SELECT 只取 name、age，且 WHERE 用 name 等值 + age 范围，索引内即可完成过滤与取值，无需回表（Extra 显示 Using index）。范围条件在联合索引最右列仍可用。", "kaodian": "AI后端能力-数据存储与ORM层-MySQL覆盖索引"}, {"no": 8, "type": "single", "body": "对 reactive 对象整体重新赋值后，模板里的绑定会怎样？", "code": "let state = reactive({ count: 0 });\nfunction reset(){ state = reactive({ count: 0 }); }\nstate.count++;   // 模板显示？", "options": [{"k": "A", "t": "重新赋值的新对象仍是响应式代理，count++ 后视图正常更新"}, {"k": "B", "t": "state 用 const 声明所以不能重新赋值（运行时报错）——本题用 let，故不成立"}, {"k": "C", "t": "重新赋值会触发 Vue 深层响应式重建，视图自动刷新"}, {"k": "D", "t": "重新赋值后模板仍持有旧代理引用，后续对 count 的修改不再触发视图更新"}], "answer": ["D"], "explain": "reactive 返回的是代理对象；整体重新赋值会断开模板对原代理的引用追踪，后续响应式更新失效。正确做法是 Object.assign(state, {...}) 或改用 ref。", "kaodian": "AI前端能力-前端框架与响应式-Vue3响应式丢失"}, {"no": 9, "type": "single", "body": "容器宽 600px，3 个子项 flex-basis 均为 100px，flex-grow 分别为 1/2/3，无溢出。最终各占宽度？", "code": ".container{display:flex; width:600px;}\n.a{flex:1 1 100px;}\n.b{flex:2 1 100px;}\n.c{flex:3 1 100px;}", "options": [{"k": "A", "t": "150 / 200 / 250"}, {"k": "B", "t": "160 / 220 / 280"}, {"k": "C", "t": "100 / 200 / 300"}, {"k": "D", "t": "130 / 260 / 310"}], "answer": ["A"], "explain": "基础宽度合计 3×100=300px，剩余 300px 按 grow 比例 1:2:3 分配，得 50/100/150，最终 150/200/250（px）。", "kaodian": "AI前端能力-布局与样式-Flex宽度分配计算"}, {"no": 10, "type": "single", "body": "下列 GET 请求里，params 里的参数会被放到哪里？", "code": "axios.get('/api/users', { params: { page: 1, size: 10 } });", "options": [{"k": "A", "t": "作为请求体 JSON 发送"}, {"k": "B", "t": "被序列化拼接到 URL 查询字符串，变成 /api/users?page=1&size=10"}, {"k": "C", "t": "放在请求头里"}, {"k": "D", "t": "被忽略，GET 不能带参数"}], "answer": ["B"], "explain": "axios 的 params 会被序列化进 URL 查询字符串；data 才进入请求体（GET 一般无 body，参数应走 params）。", "kaodian": "AI前端能力-网络与BFF架构-Axios请求参数"}, {"no": 11, "type": "single", "body": "下列 Vue3 computed 用法，描述正确的是？", "code": "const fullName = computed(() => user.first + user.last);\nfullName.value = 'Tom';\n\nconst obj = reactive({ list: [1,2,3] });\nconst len = computed(() => obj.list.length);\nobj.list.push(4);   // len 更新？", "options": [{"k": "A", "t": "不带 setter 的 computed 默认只读，给 fullName.value 赋值会静默失败或报错；len 会因依赖变化自动重算"}, {"k": "B", "t": "给 fullName.value 赋值会成功并触发视图更新"}, {"k": "C", "t": "len 不会随 obj.list 变化，因为 computed 只算一次"}, {"k": "D", "t": "computed 必须写成 get/set 形式才能被读取"}], "answer": ["C"], "explain": "不带 setter 的 computed 是只读的，写入 .value 在非严格模式静默失败、严格模式抛错；computed 基于响应式依赖做缓存，依赖变化会自动重算，所以 len 会更新。", "kaodian": "AI前端能力-前端框架与响应式-Vue3计算属性"}, {"no": 12, "type": "single", "body": "开发环境请求 /api/v1/users 返回 404，后端接口实际路径是 /users，根因？", "code": "// vite.config.ts\nexport default defineConfig({\n  server: { proxy: { '/api': { target: 'http://localhost:8080', changeOrigin: true } } }\n});\n// 前端\naxios.get('/api/v1/users');", "options": [{"k": "A", "t": "配置完全正确，跨域不会报错"}, {"k": "B", "t": "没开 changeOrigin 必然 404"}, {"k": "C", "t": "必须加 secure:false 才生效"}, {"k": "D", "t": "代理只做前缀转发、未重写路径，请求到后端仍是 /api/v1/users，而后端无此路由 → 404（需 rewrite 去掉 /api）"}], "answer": ["D"], "explain": "proxy '/api' 仅把请求转发到 target，路径保持 /api/v1/users；后端路由是 /users，需配 rewrite: path => path.replace(/^\\/api/,'') 去掉前缀。changeOrigin 解决 host 校验、secure 解决 https 证书，都不是 404 根因。", "kaodian": "AI前端能力-网络与BFF架构-开发代理配置"}, {"no": 13, "type": "single", "body": "下列 v-for 列表，key 应填什么才能保持 DOM 复用与状态正确？", "code": "<li v-for=\"item in list\" :key=\"???\">\n  {{ item.name }}\n</li>\n// list = [{ id:1, name:'A' }, { id:2, name:'B' }]", "options": [{"k": "A", "t": "item.id（稳定且唯一的标识）"}, {"k": "B", "t": "item.name"}, {"k": "C", "t": "index（数组下标）"}, {"k": "D", "t": "不需要 key"}], "answer": ["A"], "explain": "key 应使用稳定唯一标识 item.id；用 index 在增删/排序时会错配 DOM 导致组件状态错乱；name 可能重复不唯一；不加 key 在列表变更时 Vue 采用就地复用易出错。", "kaodian": "AI前端能力-前端框架与渲染-Vue3列表key"}, {"no": 14, "type": "single", "body": "修改响应式数据后想立即读取更新后的 DOM，正确做法？", "code": "state.count++;\n// 此处直接读 document.getElementById('c').textContent 拿到的是旧值", "options": [{"k": "A", "t": "用 await nextTick() 后再读 DOM，确保 DOM 已随数据刷新"}, {"k": "B", "t": "用 setTimeout(0) 一定比 nextTick 更早拿到新值"}, {"k": "C", "t": "直接读即可，Vue 同步更新 DOM"}, {"k": "D", "t": "把读取放进 watch 的 immediate 选项"}], "answer": ["B"], "explain": "Vue 异步批量更新 DOM，nextTick 在 DOM 刷新后的微任务回调；setTimeout 是宏任务，不一定先于 nextTick；Vue 不是同步更新。", "kaodian": "AI前端能力-前端框架与响应式-Vue3异步更新与nextTick"}, {"no": 15, "type": "single", "body": "某接口返回 HTTP 200，但响应体为 {\"code\":500,\"msg\":\"fail\"}。正确的测试判定？", "code": "HTTP/1.1 200 OK\nContent-Type: application/json\n{\"code\":500,\"msg\":\"fail\"}", "options": [{"k": "A", "t": "HTTP 200 即视为用例通过"}, {"k": "B", "t": "以 HTTP 状态码为准，业务 code 无所谓"}, {"k": "C", "t": "需同时校验 HTTP 状态码与业务 code，二者都成功才算通过"}, {"k": "D", "t": "只需断言响应时间小于 1 秒"}], "answer": ["C"], "explain": "接口测试要同时校验协议层（HTTP 状态码）与业务层（业务 code/msg）。很多网关把业务失败包成 200，只看状态码会漏判真正的业务失败。", "kaodian": "AI质量保障-接口测试能力-HTTP状态码与业务码"}, {"no": 16, "type": "single", "body": "下列 JUnit5 写法，描述正确的是？", "code": "@BeforeAll\nstatic void init(){ /* 连接 DB */ }\n\n@Test\nvoid t1(){ assertEquals(2, 1+1); }", "options": [{"k": "A", "t": "@BeforeAll 标注的方法可以是非 static 实例方法，JUnit5 自动实例化后调用"}, {"k": "B", "t": "@Test 注解来自 org.junit.Test（JUnit4 包）"}, {"k": "C", "t": "assertEquals(expected, actual) 中 expected 与 actual 的先后顺序会改变断言通过与否"}, {"k": "D", "t": "@BeforeAll 必须是 static，在所有测试方法前执行一次；@Test 来自 org.junit.jupiter.api.Test"}], "answer": ["D"], "explain": "JUnit5 中 @BeforeAll 必须是 static（在类级别、所有测试前执行一次）；@Test 来自 org.junit.jupiter.api.Test；assertEquals 仅比较值，顺序不影响通过与否（只影响失败信息）。A/B/C 均错。", "kaodian": "AI质量保障-自动化测试能力-JUnit5注解与断言"}, {"no": 17, "type": "single", "body": "登录表单只判断了 user/pwd 非空。关于测试覆盖，正确的是？", "code": "function validate(form){\n  if(!form.user) return '用户名必填';\n  if(!form.pwd)  return '密码必填';\n  return null;\n}", "options": [{"k": "A", "t": "还应补充格式、长度、重复提交/防爆破等用例，仅非空不足"}, {"k": "B", "t": "非空校验已足够，其他不用测"}, {"k": "C", "t": "非空校验能防住 SQL 注入"}, {"k": "D", "t": "密码只需非空，复杂度策略属于后端事，前端不用测"}], "answer": ["A"], "explain": "功能测试的表单校验需覆盖必填、格式、长度、重复提交/防爆破等维度；非空仅是最基本一项。非空不能防注入，复杂度等前端也应做基础校验与提示。", "kaodian": "AI质量保障-功能测试能力-表单校验用例"}, {"no": 18, "type": "single", "body": "流水线构建失败，首行错误：error TS2345: Argument of type 'string' is not assignable to parameter of type 'number'；本地却通过。最可能根因？", "code": "# 流水线\n- run: npm install\n- run: npm run build   # tsc 失败", "options": [{"k": "A", "t": "流水线没装依赖（缺 npm ci 步骤）"}, {"k": "B", "t": "流水线用 npm install 而非 npm ci，可能装到与 lock 文件不一致的依赖/@types 版本，导致 tsc 更严格报错（环境漂移）"}, {"k": "C", "t": "代码在本地本来也没法编译"}, {"k": "D", "t": "build 脚本本地是 vite 打包、流水线才是 tsc，所以不一致"}], "answer": ["B"], "explain": "未用 npm ci 锁定 lock 文件时，npm install 可能解析到新版本的 @types 或依赖，引入类型变更使 tsc 报错；用 npm ci 可复现本地环境，避免“本地过、流水线挂”的漂移。", "kaodian": "AI质量保障-质量工程能力-CI流水线构建失败"}, {"no": 19, "type": "single", "body": "下列 Playwright 断言，想“等元素出现并可见”再判断，缺哪一部分？", "code": "await expect(page.getByText('提交成功'))\n// 缺失：等待该文本可见并断言", "options": [{"k": "A", "t": ".click()"}, {"k": "B", "t": ".fill('ok')"}, {"k": "C", "t": ".toBeVisible()"}, {"k": "D", "t": ".waitFor()"}], "answer": ["C"], "explain": "expect(locator).toBeVisible() 是 Playwright 的自动重试断言，会轮询直到元素可见或超时；.click/.fill 是动作不是断言；.waitFor() 是 locator 方法但此处缺的是断言动作。", "kaodian": "AI质量保障-自动化测试能力-Playwright重试断言"}, {"no": 20, "type": "single", "body": "修复订单优惠券分摊逻辑后，回归测试应优先跑？", "code": "// 改动：OrderService.calculate() 的优惠券分摊逻辑", "options": [{"k": "A", "t": "所有用例全量跑，确保无遗漏"}, {"k": "B", "t": "只跑被改的那一行对应的单元测试"}, {"k": "C", "t": "回归测试只跑冒烟用例即可"}, {"k": "D", "t": "基于变更影响分析筛选受影响用例优先跑，再抽样核心链路，平衡覆盖与成本"}], "answer": ["D"], "explain": "回归测试基于变更影响分析筛选受影响用例优先执行，兼顾覆盖与执行成本；全量跑太慢、仅跑单行或仅冒烟覆盖不足。", "kaodian": "AI质量保障-回归测试能力-变更影响分析"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "（多选）下列 Redis 数据结构选型，各项论断是否成立？", "code": "Long v = stringRedisTemplate.opsForValue().increment(\"view:\"+aid);\nstringRedisTemplate.opsForZSet().add(\"rank\", aid, score);\nstringRedisTemplate.opsForSet().add(\"tags:\"+uid, \"java\", \"go\");", "options": [{"k": "A", "t": "用 String 的 increment 实现阅读量原子自增，正确"}, {"k": "B", "t": "用 ZSet 的 add(member,score) 按分值排序可取排行榜 TopN，正确"}, {"k": "C", "t": "用 Hash 的 HSET 也能直接实现“阅读量自增 +1”语义"}, {"k": "D", "t": "用 Set 的 add 实现去重标签集合，正确"}], "answer": ["A", "B", "D"], "explain": "1. A 正确：opsForValue().increment 基于 String 做原子自增，适合阅读量。2. B 正确：ZSet add(member, score) 按 score 排序，可取 TopN 做排行榜。3. C 错误：阅读量自增要用 HINCRBY（Hash 自增），HSET 是覆盖写入不能自增；题干也没用 Hash。4. D 正确：Set add 自动去重，适合标签集合。", "kaodian": "AI后端能力-高并发与中间件层-Redis数据结构选型"}, {"no": 2, "type": "multi", "body": "（多选）下列 Spring 事务传播行为，各项论断是否成立？", "code": "@Service\npublic class A {\n  @Autowired B b;\n  @Transactional\n  public void a(){ b.b(); throw new RuntimeException(); }\n}\n@Service\npublic class B {\n  @Transactional(propagation = Propagation.REQUIRES_NEW)\n  public void b(){ /* 写库 */ }\n}", "options": [{"k": "A", "t": "a 的 @Transactional 默认传播 REQUIRED，a 在事务上下文中执行"}, {"k": "B", "t": "b 用 REQUIRES_NEW 会挂起 a 的事务并开启新事务；a 抛异常只回滚 a 的事务，b 已独立提交"}, {"k": "C", "t": "本题是跨 Bean 注入调用（b.b()），事务代理生效；若为同类内部 this 调用则注解失效"}, {"k": "D", "t": "@Transactional 方法只要抛异常就一定会回滚，包括 IOException 等 checked 异常"}], "answer": ["A", "B", "C"], "explain": "1. A 正确：a 默认 REQUIRED，纳入事务管理。2. B 正确：REQUIRES_NEW 挂起外层、开新事务，外层回滚不影响已提交的内层。3. C 正确：跨 Bean 调用走代理，注解生效；同类内部 this 调用不走代理，注解失效。4. D 错误：默认仅 RuntimeException/Error 回滚，checked 异常不回滚，除非指定 rollbackFor。", "kaodian": "AI后端能力-后端框架与Spring层-事务传播行为"}, {"no": 3, "type": "multi", "body": "（多选）下列 Vue3 响应式行为，各项论断是否成立？", "code": "const state = reactive({ user: { name: 'Tom' } });\nconst { user } = state;            // 解构\nconst obj = reactive({ a: 1 });\nObject.assign(obj, { a: 2, b: 3 });\nconst arr = reactive([]);\narr.length = 0;                    // 清空", "options": [{"k": "A", "t": "const { user } = state 解构后，user 仍是响应式代理（深代理，引用不变），读取仍响应"}, {"k": "B", "t": "Object.assign 给 reactive 动态新增属性 b，b 是响应式的（Proxy 支持运行时增属性）"}, {"k": "C", "t": "arr.length = 0 能触发响应式更新并清空（Vue3 重写了 length setter）"}, {"k": "D", "t": "直接给 reactive 对象整体重新赋值（state = reactive({...})）仍能保持原模板引用追踪"}], "answer": ["A", "B", "C"], "explain": "1. A 正确：state.user 本身是 reactive 代理，解构拿到同一引用，仍响应式。2. B 正确：Vue3 Proxy 支持运行时增删属性且保持响应式。3. C 正确：Vue3 重写了数组 length 的 setter，arr.length=0 触发更新。4. D 错误：整体重新赋值会断开模板对原代理的引用追踪，不再响应式。", "kaodian": "AI前端能力-前端框架与响应式-Vue3响应式陷阱"}, {"no": 4, "type": "multi", "body": "（多选）下列 Axios 拦截器与下载处理，各项论断是否成立？", "code": "axios.interceptors.response.use(\n  res => res.data,\n  err => { if (err.response?.status === 401) { refreshToken().then(()=>retry(err.config)); } return Promise.reject(err); }\n);\naxios.get('/file', { responseType: 'blob' });", "options": [{"k": "A", "t": "响应拦截器返回 res.data，业务层直接拿到后端 data 字段（而非完整 AxiosResponse）"}, {"k": "B", "t": "401 时在错误拦截器里 refreshToken 并重发，可实现无感刷新（需避免死循环）"}, {"k": "C", "t": "responseType:'blob' 会把普通 JSON 响应也转成 Blob，因此任何接口都能用"}, {"k": "D", "t": "请求拦截器统一加鉴权 token 应写入 headers 配置而非 params"}], "answer": ["A", "B", "D"], "explain": "1. A 正确：返回 res.data 后业务层拿到的是 data 字段。2. B 正确：401 无感刷新靠 refreshToken + 重发原请求实现（注意去重避免死循环）。3. C 错误：blob 用于二进制下载，普通 JSON 接口用 blob 拿不到可解析对象。4. D 正确：鉴权 token 放请求头 headers，不放 params。", "kaodian": "AI前端能力-网络与BFF架构-Axios拦截器与文件下载"}, {"no": 5, "type": "multi", "body": "（多选）下列 Flex 对齐机制，各项论断是否成立？", "code": ".box{display:flex; flex-wrap:wrap; align-content:flex-start;}\n.item{flex:0 0 30%;}", "options": [{"k": "A", "t": "align-content 控制“多根交叉轴线”的整体对齐，仅在换行有多行时生效"}, {"k": "B", "t": "单行时 align-content 不生效，应使用 align-items 控制单行交叉轴对齐"}, {"k": "C", "t": "flex:0 0 30% 表示不放大不缩小、基准 30%，三项各 30% 共 90% 仍可排在一行"}, {"k": "D", "t": "align-items:center 与 justify-content:center 都作用于主轴居中"}], "answer": ["A", "B", "C"], "explain": "1. A 正确：align-content 作用于多行整体的交叉轴对齐，单行无意义。2. B 正确：单行用 align-items。3. C 正确：flex:0 0 30% 三项共 90% 仍在单行（不换行）。4. D 错误：align-items 作用于交叉轴，justify-content 作用于主轴。", "kaodian": "AI前端能力-布局与样式-Flex对齐机制"}, {"no": 6, "type": "multi", "body": "（多选）关于测试金字塔，各项论断是否成立？", "code": "理想分布（成本/速度）：\n- 单元测试：多、快、便宜\n- 集成测试：中\n- E2E/UI：少、慢、贵", "options": [{"k": "A", "t": "测试金字塔建议底层单元测试最多、UI 测试最少（正三角）"}, {"k": "B", "t": "倒金字塔（UI 测试占多数）会导致反馈慢、维护贵、不稳定"}, {"k": "C", "t": "单元测试可完全替代 E2E 测试，因此 E2E 可不做"}, {"k": "D", "t": "测试越多越好，各层数量无所谓"}], "answer": ["A", "B"], "explain": "1. A 正确：金字塔底层单测多、顶层 UI 少。2. B 正确：倒金字塔成本高、不稳定。3. C 错误：E2E 验证真实集成与端到端链路，单测不可完全替代。4. D 错误：需按成本/收益分层，并非越多越好。", "kaodian": "AI质量保障-质量工程能力-测试金字塔"}, {"no": 7, "type": "multi", "body": "（多选）关于 AI 辅助生成测试用例，各项论断是否成立？", "code": "prompt: \"根据 OpenAPI 为 /users POST 生成正常/边界/异常用例\"\n// AI 产出 20 条用例", "options": [{"k": "A", "t": "AI 可基于接口契约快速生成正常/边界/异常用例，提升覆盖"}, {"k": "B", "t": "AI 生成的用例仍需人工评审断言正确性，不能直接信任"}, {"k": "C", "t": "AI 能自动发现所有隐藏缺陷，无需人审"}, {"k": "D", "t": "AI 生成的测试数据可用于分类（正常/边界/异常）辅助管理"}], "answer": ["A", "B", "D"], "explain": "1. A 正确：AI 依契约生成多类用例，提升效率与覆盖。2. B 正确：AI 可能产生错误断言，需人工评审。3. C 错误：AI 不能发现所有缺陷，需人审兜底。4. D 正确：AI 可辅助测试数据分类管理。", "kaodian": "AI质量保障-AI测试能力-AI辅助测试数据分类"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "在 @Transactional 标注的方法内部捕获 RuntimeException 并吞掉而不重新抛出，该事务仍然会回滚。", "code": "@Transactional\npublic void pay(Long id){\n  try { dao.update(id); }\n  catch (RuntimeException e) { log.error(e.getMessage()); }  // 吞掉异常\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "Spring 事务靠代理感知到抛出的 RuntimeException 才触发回滚；若方法内 try-catch 吞掉异常不重新抛出，代理感知不到异常，事务会提交（除非手动 setRollbackOnly）。因此该说法错。", "kaodian": "AI后端能力-后端框架与Spring层-事务回滚边界"}, {"no": 2, "type": "judge", "body": "未配置 CacheManager 却使用 @Cacheable 注解时，Spring 应用启动会抛出 No qualifying bean of type 'CacheManager' 的异常。", "code": "@Cacheable(\"users\")\npublic User get(Long id){ return dao.get(id); }\n// 未声明任何 CacheManager Bean", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "@Cacheable 等缓存注解需要 CacheManager 支撑；未配置时 Spring 容器找不到 CacheManager 类型的 Bean，启动即报 No qualifying bean of type 'CacheManager'。需引入 spring-boot-starter-cache 并配置 CacheManager。", "kaodian": "AI后端能力-高并发与中间件层-缓存注解配置"}, {"no": 3, "type": "judge", "body": "对元素使用 transform: translateX(10px) 会触发浏览器对该元素进行重排（layout）计算。", "code": ".box { transform: translateX(10px); }", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "transform 由合成层（composite）处理，只触发 paint/composite，不触发 layout（重排）；只有改变几何属性（宽高、位置、display 等）才触发 layout。该说法错。", "kaodian": "AI前端能力-渲染与性能优化-重排重绘合成"}, {"no": 4, "type": "judge", "body": "冒烟测试覆盖系统最核心路径的最小可验证集合，能快速判断当前版本能否进入后续测试。", "code": "// 每次提测先跑：登录 -> 进入首页 -> 核心下单 -> 支付回调", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "冒烟测试取核心路径的最小验证集合，用于快速判断版本是否“可测”；若冒烟不过，后续大规模测试无意义。该说法正确。", "kaodian": "AI质量保障-质量工程能力-冒烟测试设计"}, {"no": 5, "type": "judge", "body": "对生产环境数据库直接执行 DELETE 语句是回归测试的标准做法。", "code": "-- 回归时清理测试数据\nDELETE FROM order WHERE create_time < '2026-01-01';", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "回归测试应在隔离/影子环境或用事务回滚、假数据进行，绝不应对生产库直接执行破坏性 DELETE；直删生产数据会破坏真实业务与线上稳定性。该说法错。", "kaodian": "AI质量保障-质量工程能力-回归测试规范"}, {"no": 6, "type": "judge", "body": "质量门禁是在流水线中对覆盖率、静态扫描、测试结果等指标设置阈值，未达标即阻断合并或发布。", "code": "// CI 步骤\n// - coverage >= 80% ?\n// - sonarqube 无 blocker ?\n// - test 全绿 ?", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "质量门禁（quality gate）在流水线中设阈值（覆盖率、扫描、测试结果等），未达标准就阻断合并/发布，防止劣质代码流入。该说法正确。", "kaodian": "AI质量保障-质量工程能力-质量门禁"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
const esc = s => (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+esc(o.t)+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+esc(sec.name)+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+esc(q.kaodian)+'">'+esc(q.kaodian)+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):esc(q.body))+'</div>';
      if(q.code) html += '<div class="code">'+esc(q.code)+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+esc(q.explain)+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); if(new URLSearchParams(location.search).get('mode')==='wrong' && rec.wrong && rec.wrong.length){ toggleOnlyWrong(); } } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  // 兼容旧数据：wrong 数组元素可能是字符串（早期版本存的是 c.dataset.no 字符串）
  const wrongSet = new Set((saved.wrong||[]).map(n=>Number(n)));
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no);
    if(!q){ console.warn('restore: question not found for card', card.dataset.no); return; }
    const gno = Number(card.dataset.no);
    const ok = !wrongSet.has(gno);
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
