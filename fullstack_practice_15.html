<script type="application/json" id="quizData">{"id": "vol15", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "统计页面日活 UV（要求亿级、允许约 0.81% 误差、内存极省），最合适的 Redis 结构是？", "code": "PFADD uv:20260813 user1 user2 user3\nPFCOUNT uv:20260813", "options": [{"k": "A", "t": "HyperLogLog，固定约 12KB 内存即可估算基数"}, {"k": "B", "t": "Set，SADD 后 SCARD，精确且省内存"}, {"k": "C", "t": "Hash，每个用户一个 field"}, {"k": "D", "t": "List，LPUSH 后 LLEN"}], "answer": "A", "explain": "HyperLogLog 用概率算法估算基数，标准误差约 0.81%，无论多少元素固定占用约 12KB，还支持 PFMERGE 合并多天。Set 虽精确但亿级用户内存会到 GB 级；Hash 同样按元素线性增长；List 不去重，LLEN 统计的是写入次数不是 UV。", "kaodian": "AI后端能力-高并发与中间件层-RedisHyperLogLog"}, {"no": 2, "type": "single", "body": "线上出现「Lock wait timeout exceeded」，排查方向最合理的是？", "code": "SHOW ENGINE INNODB STATUS;\nSELECT * FROM information_schema.innodb_trx\n WHERE TIME_TO_SEC(TIMEDIFF(NOW(), trx_started)) > 60;", "options": [{"k": "A", "t": "锁等待与索引无关，加索引没用"}, {"k": "B", "t": "定位长事务持有行锁未提交，检查事务中是否夹杂了 RPC/大循环等耗时操作"}, {"k": "C", "t": "一定是死锁，直接重启数据库"}, {"k": "D", "t": "把隔离级别降到读未提交就能解决所有锁等待"}], "answer": "B", "explain": "锁等待超时通常源于长事务：事务里做了远程调用、文件处理或大批量循环，导致行锁长时间不释放。排查用 innodb_trx 找长事务、innodb_lock_waits 看阻塞关系。死锁是另一种错误码（Deadlock found）且 InnoDB 会自动回滚其一（C 错）；降隔离级别有一致性风险且不解决长事务（D 错）；缺索引会让更新退化成扫描更多行、锁范围扩大，加索引恰恰能缓解（A 错）。", "kaodian": "AI后端能力-数据存储与ORM层-锁等待与长事务"}, {"no": 3, "type": "single", "body": "下列参数校验为何不生效？", "code": "@PostMapping(\"/user\")\npublic R add(@RequestBody UserDTO dto) { ... }\n\npublic class UserDTO {\n  @NotBlank(message = \"姓名必填\")\n  private String name;\n}", "options": [{"k": "A", "t": "必须继承 BaseValidator 才能生效"}, {"k": "B", "t": "Spring Boot 默认不支持 JSR-303，无法校验"}, {"k": "C", "t": "缺少 @Valid 或 @Validated 注解触发校验"}, {"k": "D", "t": "@NotBlank 只能用于 int 字段"}], "answer": "C", "explain": "Bean Validation 需要在入参上标注 @Valid（或 @Validated）才会触发，否则注解只是元数据。校验失败会抛 MethodArgumentNotValidException，一般用 @RestControllerAdvice 统一转成友好提示。@NotBlank 用于字符串（数字用 @NotNull/@Min），无需继承任何基类，spring-boot-starter-validation 引入后即可用。", "kaodian": "AI后端能力-应用框架层-参数校验Validated"}, {"no": 4, "type": "single", "body": "Kafka 开启下列配置后，能获得什么保证？", "code": "props.put(\"enable.idempotence\", true);\nprops.put(\"acks\", \"all\");\nprops.put(\"max.in.flight.requests.per.connection\", 5);", "options": [{"k": "A", "t": "端到端 Exactly-Once，消费者也不会重复消费"}, {"k": "B", "t": "消息可以跨分区全局有序"}, {"k": "C", "t": "开启幂等后就不再需要 acks 配置"}, {"k": "D", "t": "生产者到单分区的消息不会因重试而重复，且保持发送顺序（幂等生产者）"}], "answer": "D", "explain": "幂等生产者靠 PID + 序列号在 Broker 端去重，解决「重试导致单分区重复写入」，并在 max.in.flight ≤ 5 时仍能保序。但它只覆盖生产端到单分区：跨分区全局有序做不到（B 错）；端到端 EOS 还需事务（transactional.id）加消费端 read_committed 与位移事务提交（A 错）；幂等要求 acks=all，配置不可省（C 错）。", "kaodian": "AI后端能力-高并发与中间件层-Kafka幂等生产者"}, {"no": 5, "type": "single", "body": "关于 MyBatis 缓存，下列说法正确的是？", "code": "SqlSession session = factory.openSession();\nUser a = mapper.selectById(1);\nUser b = mapper.selectById(1);   // 是否再查库？", "options": [{"k": "A", "t": "一级缓存默认开启且作用于同一个 SqlSession，第二次查询命中缓存不发 SQL"}, {"k": "B", "t": "一级缓存默认关闭，需要手动配置"}, {"k": "C", "t": "一级缓存跨 SqlSession 共享"}, {"k": "D", "t": "执行 update 后一级缓存仍然保留旧值"}], "answer": "A", "explain": "MyBatis 一级缓存（SqlSession 级）默认开启，同一 Session 内相同语句+参数的查询直接返回缓存对象，不再发 SQL。它不跨 Session（C 错，跨 Session 需二级缓存且默认关闭）；同一 Session 内执行任何 insert/update/delete 会清空该 Session 缓存以避免脏读（D 错）。注意 Spring 环境下每次操作常是新 Session，一级缓存往往感知不到。", "kaodian": "AI后端能力-数据存储与ORM层-MyBatis缓存机制"}, {"no": 6, "type": "single", "body": "下列代码输出是？", "code": "String a = \"ab\";\nString b = \"a\" + \"b\";\nString c = new String(\"ab\");\nSystem.out.println((a == b) + \" \" + (a == c) + \" \" + a.equals(c));", "options": [{"k": "A", "t": "true false false"}, {"k": "B", "t": "true false true"}, {"k": "C", "t": "true true true"}, {"k": "D", "t": "false false true"}], "answer": "B", "explain": "\"a\"+\"b\" 是编译期常量折叠，直接指向常量池中的 \"ab\"，与 a 同一对象 → a==b 为 true。new String(\"ab\") 在堆上新建对象，引用不同 → a==c 为 false。equals 比较字符序列，内容相同 → true。若写成 String s=\"a\"; String b2=s+\"b\";（变量参与）则运行期用 StringBuilder 拼接，a==b2 也是 false。", "kaodian": "AI后端能力-语言与计算层-字符串常量池"}, {"no": 7, "type": "single", "body": "用 RabbitMQ 实现「订单 30 分钟未支付自动关闭」，经典方案是？", "code": "// 队列 A：不设消费者\nx-message-ttl: 1800000\nx-dead-letter-exchange: dlx.close.order", "options": [{"k": "A", "t": "消费者收到消息后 Thread.sleep(30*60*1000)"}, {"k": "B", "t": "RabbitMQ 无法实现延迟，只能用数据库轮询"}, {"k": "C", "t": "消息在 TTL 队列中过期后进入死信交换机，由绑定的关闭订单队列消费"}, {"k": "D", "t": "生产者 sleep 30 分钟后再发消息"}], "answer": "C", "explain": "TTL + DLX 是原生延迟队列方案：消息投到无消费者的 TTL 队列，到期成为死信被转发到 DLX，真正的处理队列在那边消费。注意同队列不同消息 TTL 会有「队头阻塞」问题，生产更推荐 rabbitmq-delayed-message-exchange 插件。D 会阻塞生产链路，A 撑爆消费者线程且重启即丢，B 说法错误。", "kaodian": "AI后端能力-高并发与中间件层-RabbitMQ延迟队列"}, {"no": 8, "type": "single", "body": "下列代码为何打印的是旧文本？", "code": "const msg = ref('old');\nfunction change() {\n  msg.value = 'new';\n  console.log(box.value.textContent);  // 打印 old\n}", "options": [{"k": "A", "t": "ref 赋值失败，应该用 reactive"}, {"k": "B", "t": "必须调用 forceUpdate 才会更新 DOM"}, {"k": "C", "t": "textContent 无法读取最新值，只能用 innerHTML"}, {"k": "D", "t": "DOM 更新是异步批量的，需在 nextTick 回调或 await nextTick() 之后读取"}], "answer": "D", "explain": "Vue 的响应式更新会把渲染任务放进微任务队列批量执行，同步代码里 DOM 还是旧的。要读取更新后的 DOM，用 `await nextTick()` 或 `nextTick(() => ...)`。这么设计是为了把一次事件里的多次数据变更合并成一次渲染，避免重复布局。", "kaodian": "AI前端能力-语言与运行时-Vue3nextTick"}, {"no": 9, "type": "single", "body": "要让封面图固定 16:9 且填满容器不变形（超出部分裁剪），正确写法是？", "code": ".cover {\n  width: 100%;\n  /* 补全 ? */\n}", "options": [{"k": "A", "t": "aspect-ratio: 16 / 9; object-fit: cover;"}, {"k": "B", "t": "height: 100%; object-fit: fill;"}, {"k": "C", "t": "aspect-ratio: 16 / 9; object-fit: contain;"}, {"k": "D", "t": "只写 width:100% 即可自动保持比例并裁剪"}], "answer": "A", "explain": "aspect-ratio 让元素按固定宽高比自适应高度，避免加载时布局抖动（CLS）；object-fit: cover 等比缩放后裁剪溢出部分，保证填满且不变形。fill 会拉伸变形（B 错）；contain 会等比缩放并留白，不是裁剪（C 错）；只写宽度时高度由图片原始比例决定，无法约束成 16:9（D 错）。", "kaodian": "AI前端能力-前端基础与渲染引擎-宽高比与objectfit"}, {"no": 10, "type": "single", "body": "用 Axios 上传文件，下列写法正确的是？", "code": "const fd = new FormData();\nfd.append('file', file);\nfd.append('bizType', 'avatar');\n// 发送 ?", "options": [{"k": "A", "t": "必须用 GET 请求，把文件放 params 里"}, {"k": "B", "t": "axios.post('/upload', fd) —— 浏览器会自动带上含 boundary 的 multipart Content-Type"}, {"k": "C", "t": "axios.post('/upload', fd, {headers:{'Content-Type':'multipart/form-data'}}) 且必须手写，否则失败"}, {"k": "D", "t": "先 JSON.stringify(fd) 再发送"}], "answer": "B", "explain": "传 FormData 时不要手动设置 Content-Type：浏览器会自动生成带 boundary 的 `multipart/form-data; boundary=----WebKitFormBoundaryXXX`，手写会丢掉 boundary 导致后端解析失败（C 的「必须手写」是常见误区）。FormData 无法被 JSON.stringify 序列化（得到 {}），GET 也不能携带请求体上传文件。", "kaodian": "AI前端能力-网络与BFF架构-文件上传FormData"}, {"no": 11, "type": "single", "body": "下列 TS 代码中，if 分支内 `res.data` 的类型是？", "code": "type Resp =\n  | { ok: true; data: string[] }\n  | { ok: false; error: string };\nfunction f(res: Resp) {\n  if (res.ok) { /* res.data ? */ }\n}", "options": [{"k": "A", "t": "any"}, {"k": "B", "t": "编译报错：联合类型不能访问 data"}, {"k": "C", "t": "string[]，因为字面量类型 ok:true 作为判别属性完成了收窄"}, {"k": "D", "t": "string[] | undefined"}], "answer": "C", "explain": "这是可辨识联合（Discriminated Union）：以字面量类型属性 ok 作为判别标签，if (res.ok) 后 TS 自动把类型收窄为 { ok:true; data:string[] }，访问 data 安全且类型精确；else 分支收窄为错误分支，只能访问 error。这是接口响应建模的推荐写法，比 data?: T 更严谨。", "kaodian": "AI前端能力-语言与运行时-TS可辨识联合"}, {"no": 12, "type": "single", "body": "需要深拷贝一个含 Date、Map、循环引用的对象，最合适的是？", "code": "const src = { d: new Date(), m: new Map([[1,'a']]) };\nsrc.self = src;", "options": [{"k": "A", "t": "JSON.parse(JSON.stringify(src))"}, {"k": "B", "t": "Object.assign({}, src)"}, {"k": "C", "t": "展开运算符 {...src}"}, {"k": "D", "t": "structuredClone(src)，原生支持 Date/Map/Set 与循环引用"}], "answer": "D", "explain": "structuredClone 是现代浏览器与 Node 17+ 原生的结构化克隆，支持 Date/Map/Set/ArrayBuffer 与循环引用（但不支持函数、DOM 节点、Symbol）。JSON 大法会把 Date 变字符串、Map 变 {}、遇循环引用直接抛错（A 错）；Object.assign 与展开都是浅拷贝，嵌套对象仍共享引用（B/C 错）。", "kaodian": "AI前端能力-语言与运行时-深拷贝structuredClone"}, {"no": 13, "type": "single", "body": "弹窗组件被父级 `overflow:hidden` 裁剪、被 `transform` 影响定位，最优解是？", "code": "<div class=\"card\">   <!-- overflow:hidden; transform: translateZ(0) -->\n  <MyDialog />\n</div>", "options": [{"k": "A", "t": "用 <Teleport to=\"body\"> 把弹窗内容渲染到 body 下，脱离父级层叠与裁剪上下文"}, {"k": "B", "t": "把 z-index 调到 99999 即可"}, {"k": "C", "t": "给弹窗加 position: fixed 一定不受影响"}, {"k": "D", "t": "只能重构父组件删掉 overflow"}], "answer": "A", "explain": "Teleport 保留组件的逻辑父子关系（props/事件/依赖注入照常），但把真实 DOM 渲染到指定容器（通常 body），从而绕开父级 overflow 裁剪与 transform 造成的包含块变化。加大 z-index 无法突破裁剪（B 错）；父级有 transform/filter 时 fixed 会以该祖先为包含块而失效（C 错）；重构父组件成本高且影响面大（D 非最优）。", "kaodian": "AI前端能力-语言与运行时-Vue3Teleport"}, {"no": 14, "type": "single", "body": "搜索框输入联想请求过于频繁，下列实现最合适的是？", "code": "function debounce(fn, delay) {\n  let t;\n  return function (...args) {\n    clearTimeout(t);\n    t = setTimeout(() => fn.apply(this, args), delay);\n  };\n}", "options": [{"k": "A", "t": "防抖和节流效果完全相同，可随意替换"}, {"k": "B", "t": "防抖：连续输入只在停止输入 delay 毫秒后发一次请求"}, {"k": "C", "t": "节流：固定每 delay 毫秒必发一次请求"}, {"k": "D", "t": "这段代码会让每次输入都立即发请求"}], "answer": "B", "explain": "这是标准防抖：每次触发都清掉上一个定时器重新计时，只有「安静」了 delay 才真正执行，非常适合搜索联想、表单校验。节流是「单位时间内最多执行一次」，适合 scroll/resize 这类需要持续但降频响应的场景。二者语义不同不可混用（A 错）；箭头函数配合 apply 保住了 this 与参数（D 错）。", "kaodian": "AI前端能力-语言与运行时-防抖与节流"}, {"no": 15, "type": "single", "body": "对「优惠券金额计算」这类历史缺陷高发模块，最能快速找出问题的用例设计方法是？", "code": "历史缺陷：0 元券、超过订单金额、过期券、叠加使用、退款回滚", "options": [{"k": "A", "t": "随机点点点"}, {"k": "B", "t": "只测最常见的正常抵扣流程"}, {"k": "C", "t": "错误推测法：基于经验与历史缺陷清单，针对性构造易错场景"}, {"k": "D", "t": "只做等价类划分，一个有效类一条用例即可"}], "answer": "C", "explain": "错误推测法依赖测试人员的经验与缺陷库，直接瞄准「历史上出过问题、逻辑上容易出问题」的点，如边界金额、状态互斥、并发叠加、逆向流程（退款/取消），投入产出比很高，常与等价类/边界值组合使用。D 覆盖太粗（这类模块正是边界与组合出问题）；A 无章法不可复用；B 完全避开风险区。", "kaodian": "AI质量保障-软件测试理论与质量体系-错误推测法"}, {"no": 16, "type": "single", "body": "新功能按 5% 灰度上线，测试侧最应关注的是？", "code": "灰度规则：uid % 100 < 5\n监控：新老分组的成功率 / 耗时 / 错误码 / 核心转化", "options": [{"k": "A", "t": "灰度期间只看功能能否打开，指标属于运维职责"}, {"k": "B", "t": "灰度是产品行为，测试无需介入"}, {"k": "C", "t": "灰度必须 100% 放量后才能开始观察数据"}, {"k": "D", "t": "验证分流准确性与灰度开关可回滚，并对比新老分组的核心业务与技术指标"}], "answer": "D", "explain": "灰度测试的核心：① 分流是否按规则精准命中且用户体验一致（不能同一用户忽新忽旧）；② 开关能否秒级回滚、回滚后是否有脏数据；③ 新老分组的成功率/耗时/错误码/转化率对比是否有显著劣化。只看能否打开（A）会漏掉性能与转化回退；测试不介入（B）等于放弃线上验证阵地；等全量再看（C）失去灰度意义。", "kaodian": "AI质量保障-软件测试理论与质量体系-灰度验证"}, {"no": 17, "type": "single", "body": "CI 上偶发失败但本地复现不了，Playwright 中最有效的排查手段是？", "code": "// playwright.config.ts\nuse: { trace: 'on-first-retry', video: 'retain-on-failure', screenshot: 'only-on-failure' }", "options": [{"k": "A", "t": "开启 trace/视频/截图，用 trace viewer 回放每一步 DOM、网络与控制台"}, {"k": "B", "t": "在用例里加 sleep(10000) 就能解决"}, {"k": "C", "t": "把失败用例直接 skip 掉"}, {"k": "D", "t": "只看最终报错文本即可定位"}], "answer": "A", "explain": "trace 记录了每步操作的 DOM 快照、网络请求、控制台日志与耗时，配合 `npx playwright show-trace` 可像录像一样回放，是定位 CI 偶发失败的最强工具；视频与失败截图作为补充。固定 sleep（B）掩盖问题且拖慢流水线；skip（C）是掩耳盗铃，问题会流到线上；只看报错文本（D）往往只能看到「元素未找到」这类表象。", "kaodian": "AI质量保障-自动化测试-PlaywrightTrace调试"}, {"no": 18, "type": "single", "body": "接口返回结构频繁变动导致自动化大面积失败，最合理的断言策略是？", "code": "{\"code\":0,\"data\":{\"id\":1,\"name\":\"x\",\"ext\":{...}},\"ts\":1723...}", "options": [{"k": "A", "t": "不做断言，人工看日志"}, {"k": "B", "t": "用 JSON Schema 校验结构与类型契约，再对核心业务字段做精确断言"}, {"k": "C", "t": "对整个响应体做全量字符串相等断言"}, {"k": "D", "t": "只断言 HTTP 200"}], "answer": "B", "explain": "分层断言最稳：Schema 层保证字段存在性与类型（结构契约），业务层只精确断言真正关心的字段值（如 code、订单号、金额），忽略 ts、traceId 这类易变字段。全量字符串比对（C）极脆，任何新增字段都误报；只看 200（D）漏掉业务错误码；不断言（A）自动化失去意义。", "kaodian": "AI质量保障-接口测试-JSONSchema契约断言"}, {"no": 19, "type": "single", "body": "关于缺陷的「严重程度（Severity）」与「优先级（Priority）」，下列判断正确的是？", "code": "案例：官网页脚公司名写错一个字（仅显示问题）——但今天要对外发布会", "options": [{"k": "A", "t": "两者永远一致，低就都低"}, {"k": "B", "t": "严重程度由开发定，优先级由测试定"}, {"k": "C", "t": "严重程度低、优先级高：影响面小但业务时机要求立刻修"}, {"k": "D", "t": "严重程度高、优先级高"}], "answer": "C", "explain": "Severity 描述缺陷对系统功能的技术影响（崩溃/数据错误 > 功能不可用 > 体验问题），Priority 描述修复的紧迫性，由业务价值与时机决定。文案错字技术影响很小（低 Severity），但发布会当天对外露出，必须马上修（高 Priority）。反例也存在：偏门路径的崩溃可能高 Severity、低 Priority。二者相互独立（A 错），通常由测试评严重度、产品/项目定优先级（B 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-严重程度与优先级"}, {"no": 20, "type": "single", "body": "把 PRD 丢给 AI 生成测试用例，正确的使用姿势是？", "code": "输入：需求文档 + 历史缺陷模式 + 用例模板\n输出：初稿用例集", "options": [{"k": "A", "t": "AI 生成即最终版，直接执行并作为验收依据"}, {"k": "B", "t": "AI 只能生成正向用例，异常场景完全不能提"}, {"k": "C", "t": "用 AI 生成用例属于作弊，不应使用"}, {"k": "D", "t": "把 AI 输出当初稿，人工补齐隐性规则、异常与逆向场景，并评审后入库"}], "answer": "D", "explain": "AI 擅长快速铺开覆盖面、套用模板、避免遗漏常规分支，但它看不到未写进文档的隐性业务规则、历史坑与线上真实数据分布，容易产出「看起来很全其实很水」的用例。正确姿势是 AI 出初稿 + 人工审校补充（边界、并发、逆向、兼容）+ 评审入库，把人的时间投在判断而不是打字上。", "kaodian": "AI质量保障-AI辅助测试-AI需求转用例"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "服务端实现接口幂等，下列可行的方案有？（多选，多选、少选、错选均不得分）", "code": "POST /pay  Header: Idempotency-Key: abc-123", "options": [{"k": "A", "t": "幂等键 + Redis SETNX 占位，重复请求直接返回首次结果"}, {"k": "B", "t": "数据库唯一索引（如 业务单号 唯一），重复插入报唯一冲突后转为幂等成功"}, {"k": "C", "t": "状态机流转：只允许「待支付 → 已支付」，重复请求命中非法流转被拒"}, {"k": "D", "t": "前端按钮置灰即可，服务端无需处理"}], "answer": ["A", "B", "C"], "explain": "A 对：SETNX + 过期时间是最常用的分布式幂等占位，注意要把首次结果缓存回给重复请求。B 对：唯一索引是最可靠的兜底（数据库层强约束），捕获 DuplicateKeyException 后按幂等成功返回。C 对：状态机天然防重复，也能防乱序。D 错：前端置灰挡不住网络重试、消息重投、恶意重放，幂等必须由服务端保证。", "kaodian": "AI后端能力-应用框架层-接口幂等实现"}, {"no": 2, "type": "multi", "body": "线上抛 java.lang.OutOfMemoryError: Java heap space，合理的排查步骤有？（多选）", "code": "-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/dump", "options": [{"k": "A", "t": "查看 GC 日志确认是内存泄漏（老年代持续上涨回收不掉）还是短时流量导致的容量不足"}, {"k": "B", "t": "排查常见泄漏点：静态集合无限增长、ThreadLocal 未 remove、连接/流未关闭、缓存无上限"}, {"k": "C", "t": "直接把 -Xmx 调到最大，无需分析原因"}, {"k": "D", "t": "用 dump 文件配合 MAT/JProfiler 分析支配树，找出占用最大的对象与 GC Root 引用链"}], "answer": ["A", "B", "D"], "explain": "D 对：堆转储分析是定位大对象与引用链的核心手段。A 对：先区分「泄漏」与「容量不足」，两者处置方向完全不同——泄漏要修代码，容量不足才考虑扩容或优化数据结构。B 对：这些是最高频的泄漏来源。C 错：盲目调大堆只是把 OOM 推迟，真泄漏照样复现，还会让 Full GC 停顿更长。", "kaodian": "AI后端能力-语言与计算层-OOM排查"}, {"no": 3, "type": "multi", "body": "关于缓存预热与降级，下列做法合理的有？（多选）", "code": "场景：大促 0 点开抢，冷启动瞬间打满 DB", "options": [{"k": "A", "t": "缓存或下游异常时，降级返回兜底数据/静态页并快速失败，保护核心链路"}, {"k": "B", "t": "缓存挂了就让全部请求直接打到数据库，保证数据最新"}, {"k": "C", "t": "活动前用定时任务或脚本把热点商品数据预加载进 Redis"}, {"k": "D", "t": "给热点 key 设置随机化过期时间，避免同一时刻集中失效"}], "answer": ["A", "C", "D"], "explain": "C 对：预热把冷启动的 DB 压力提前摊平。D 对：过期时间加随机扰动是防雪崩的标准做法。A 对：降级 + 熔断 + 快速失败能避免线程被拖死引发级联雪崩，兜底数据比整体不可用体验更好。B 错：缓存失效时把全量流量放给 DB 正是雪崩的成因，应配合熔断、限流与互斥重建（如分布式锁只放一个请求回源）。", "kaodian": "AI后端能力-高并发与中间件层-缓存预热与降级"}, {"no": 4, "type": "multi", "body": "Vite 生产构建体积过大，下列优化手段有效的有？（多选）", "code": "dist/assets/index-a1b2.js   3.8 MB", "options": [{"k": "A", "t": "把所有依赖都打进一个 bundle，请求数少所以更快"}, {"k": "B", "t": "用 rollup 的 manualChunks 拆分第三方依赖，提升缓存命中率"}, {"k": "C", "t": "路由级别动态 import() 做代码分割，按需加载"}, {"k": "D", "t": "用 rollup-plugin-visualizer 分析产物构成，定位体积大户后替换或按需引入"}], "answer": ["B", "C", "D"], "explain": "B 对：把变动少的 vendor 单独成 chunk，业务代码更新时用户仍能命中依赖缓存。C 对：动态 import 让首屏只下载当前路由所需代码。D 对：先量化再优化，常见大户是 moment/lodash/echarts 全量引入，可换 dayjs、按需引入或用 CDN externals。A 错：单一巨包会拖垮首屏 TTI，且任何微小改动都让整包缓存失效；HTTP/2 多路复用下请求数已不是主要瓶颈。", "kaodian": "AI前端能力-前端生态-Vite构建优化"}, {"no": 5, "type": "multi", "body": "关于 Web 可访问性（a11y）与语义化，下列做法正确的有？（多选）", "code": "<div onclick=\"submit()\">提交</div>", "options": [{"k": "A", "t": "可点击元素应使用 <button>，天然可聚焦、支持回车/空格触发与读屏识别"}, {"k": "B", "t": "图片必须提供有意义的 alt，纯装饰图用 alt=\"\" 让读屏跳过"}, {"k": "C", "t": "表单控件用 <label for> 关联，点击文字即可聚焦且读屏能播报"}, {"k": "D", "t": "只要视觉上看得清，语义标签用 div 全部替代也没问题"}], "answer": ["A", "B", "C"], "explain": "A 对：div 模拟按钮会丢失键盘可达性与 role 语义，必须额外补 tabindex/role/keydown，不如直接用 button。B 对：alt 是读屏用户获取图片信息的唯一途径，装饰图用空 alt 明确跳过。C 对：label 关联同时提升可用性与可访问性。D 错：语义标签影响读屏导航、SEO 与浏览器默认行为，全用 div 会让辅助技术无法理解页面结构。", "kaodian": "AI前端能力-前端生态-可访问性与语义化"}, {"no": 6, "type": "multi", "body": "移动端 App 专项测试，下列属于必测项的有？（多选）", "code": "场景：弱网、后台被杀、切换账号、系统深色模式", "options": [{"k": "A", "t": "生命周期与中断：来电/切后台被回收后恢复现场，不崩溃不丢草稿"}, {"k": "B", "t": "权限与兼容：权限拒绝后的降级路径、不同系统版本与深色模式适配"}, {"k": "C", "t": "只要功能在 WiFi 良好网络下能跑通就算通过"}, {"k": "D", "t": "弱网与断网：超时提示、重试、数据不丢失、不白屏"}], "answer": ["A", "B", "D"], "explain": "移动端与 Web 的最大差异就在环境不稳定：D 弱网是最高频的线上问题来源（需用抓包工具做限速/丢包模拟）；A 进程被系统回收后的状态恢复直接影响数据安全；B 权限拒绝与系统主题/字体缩放的适配是常见崩溃与错位来源。只测理想网络（C）等于放弃真实用户场景。", "kaodian": "AI质量保障-软件测试理论与质量体系-移动端专项测试"}, {"no": 7, "type": "multi", "body": "自动化用例集跑一轮 40 分钟，想压进 10 分钟，下列做法可行的有？（多选）", "code": "CI: 单机串行执行 1200 条 UI 用例", "options": [{"k": "A", "t": "把慢的 UI 用例下沉为接口用例，遵循测试金字塔"}, {"k": "B", "t": "删掉一半用例，剩下的就快了"}, {"k": "C", "t": "用例分片（sharding）+ 多 worker 并行执行"}, {"k": "D", "t": "按变更影响做用例筛选，PR 阶段只跑相关子集，全量放夜间"}], "answer": ["A", "C", "D"], "explain": "C 对：Playwright/Jest 等都支持 shard 与并行 worker，前提是用例互相独立、数据隔离。D 对：变更影响分析让 PR 反馈保持分钟级，全量回归靠夜间构建兜底。A 对：同一逻辑在接口层验证比 UI 层快一到两个数量级，且更稳定。B 错：无依据删用例是直接砍掉覆盖面，缺陷会逃逸到线上——要减的是冗余与重复，不是覆盖。", "kaodian": "AI质量保障-CI/CD与质量门禁-用例并行与分片"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "Spring 默认的单例 Bean 只要不含可变的成员状态（无状态），在多线程下就是安全的；一旦在 Bean 里放可变实例字段就可能出现线程安全问题。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Spring 单例 Bean 全应用共享同一实例，多个请求线程并发调用。无状态（只用局部变量与方法参数）时天然安全；一旦写入可变实例字段（如把当前用户存成成员变量），就会被并发覆盖导致串数据。需要线程隔离时用局部变量、ThreadLocal（记得 remove）或改为 prototype/request 作用域。", "kaodian": "AI后端能力-应用框架层-单例Bean线程安全"}, {"no": 2, "type": "judge", "body": "`<script defer>` 会阻塞 HTML 解析，脚本下载完成后立即执行。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "defer 是并行下载、在 HTML 解析完成后、DOMContentLoaded 之前执行，不阻塞解析。", "kaodian": "AI前端能力-前端基础与渲染引擎-脚本加载defer与async"}, {"no": 3, "type": "judge", "body": "DOM 事件传播分为捕获、目标、冒泡三个阶段，`addEventListener` 第三个参数为 true 时在捕获阶段触发；`stopPropagation()` 能阻止继续传播但不阻止同元素上的其他监听器。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "事件先从 window 向下捕获到目标，再从目标向上冒泡。第三参数 true（或 {capture:true}）表示在捕获阶段响应。stopPropagation 阻止事件继续向上/下传播，但同一元素上已注册的其它监听器仍会执行——要连它们一起拦掉需用 stopImmediatePropagation()。另外 preventDefault 只阻止默认行为，与传播无关。", "kaodian": "AI前端能力-前端生态-事件捕获与冒泡"}, {"no": 4, "type": "judge", "body": "性能测试无需建立基线(baseline)，凭主观感受判断是否出现性能劣化即可。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "必须先建立性能基线，后续版本才能通过与基线对比客观判断是否劣化。", "kaodian": "AI质量保障-软件测试理论与质量体系-性能基线"}, {"no": 5, "type": "judge", "body": "只要自动化回归全部通过，就可以直接发布，不需要任何人工验证。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "自动化只覆盖「已知且已编写」的场景，对新增功能的体验问题、视觉错位、文案歧义、未预料的交互组合无能为力，还可能存在断言不充分导致的假绿。发布前通常仍需针对本次变更做人工验证与探索性测试，并结合灰度与线上监控兜底。自动化是提效手段，不是免检金牌。", "kaodian": "AI质量保障-软件测试理论与质量体系-发布前人工验证"}, {"no": 6, "type": "judge", "body": "测试报告的核心价值是给出「能否发布」的风险结论与依据，而不仅仅是罗列执行了多少条用例、通过率多少。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "决策者关心的是风险：还有哪些遗留缺陷、影响什么用户、是否有兜底方案、未覆盖的范围在哪里。一份好报告应包含测试范围与未覆盖说明、遗留缺陷及其影响评估、风险与建议、明确的准出结论。只堆数字（执行 1200 条、通过率 99%）无法支撑发布决策，还可能掩盖高危遗留。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试报告结论"}]}]}</script>

function renderQuiz(){

      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
