<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;

  .container { max-width: 880px; margin: 0 auto; }

  .backlink:hover { text-decoration: underline; }

  .kaodian { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; background: #f0f2f5; color: #646a73; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-badge { font-size:12px; padding:2px 9px; border-radius:4px; font-weight:700; margin-left:auto; }

    background: #f7f8fa; border: 1.5px solid transparent; font-size: 14px; cursor: pointer; transition: all .12s; }

  .footer { text-align: center; color: #9aa0a6; font-size: 13px; margin: 30px 0 10px; }

  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }

  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }

  .result-panel .score small { font-size:15px; color:#646a73; font-weight:500; }
  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }
  .result-panel .wrongs a { display:inline-block; margin:3px 6px 3px 0; padding:2px 8px; background:#fff1f0; color:#ff4d4f; border-radius:4px; text-decoration:none; font-weight:600; }
  @media (max-width:600px) {

    .opt { padding: 8px 10px; font-size: 13px; }

<script type="application/json" id="quizData">{"id": "vol03", "title": "全栈转型模拟自测卷", "sub": "依据自如 AI 平台笔试认证模拟题范围命题：后端 Java（Spring Boot / MyBatis-Plus / Redis / RabbitMQ / Kafka / MySQL）、前端 H5（Vue3 / Axios / DevTools / CSS 布局）、质量保障（接口测试 / 回归测试 / 自动化 / CI）。每题含答案、知识点讲解与 Android 开发类比。", "meta": "题型：单选 20 题 x 3 分 + 多选 7 题 x 4 分 + 判断 6 题 x 2 分 = 100 分。无填空题。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "SpringBoot 读取配置并注入字段，推荐且支持松散绑定的方式是？", "code": "@ConfigurationProperties(prefix = \"app\")\npublic class AppProps { private int timeout; }", "options": [{"k": "A", "t": "@Value(\"${app.timeout}\") 只能取单个值，不支持批量绑定对象"}, {"k": "B", "t": "@ConfigurationProperties(prefix=\"app\") 批量绑定对象属性，支持驼峰/短横线松散绑定"}, {"k": "C", "t": "@PropertySource 直接注入到字段"}, {"k": "D", "t": "@Value 必须配合 @Bean 才能用"}], "answer": "B", "explain": "@ConfigurationProperties 把同一前缀的配置批量绑定到 POJO（app.timeout ← timeout），支持 kebab-case/appTimeout 等松散绑定，适合一组相关配置；@Value 适合取单个值且不支持对象批量绑定。二者常配合 @EnableConfigurationProperties 使用。", "android": "类比 Android：类似 BuildConfig 字段或 DataStore 把一组配置映射到对象，而非逐个 getString。", "kaodian": "AI 后端能力 - 框架与容器层 - 配置绑定"}, {"no": 2, "type": "single", "body": "MyBatis-Plus 实现\"插入时自动填充 createTime、更新时自动填充 updateTime\"，应使用？", "code": "@TableField(fill = FieldFill.INSERT)\nprivate LocalDateTime createTime;", "options": [{"k": "A", "t": "在 SQL 里手写 now()"}, {"k": "B", "t": "实现 MetaObjectHandler，配合 @TableField(fill=...) 注解"}, {"k": "C", "t": "用 @Version 注解"}, {"k": "D", "t": "用 @TableLogic"}], "answer": "B", "explain": "MP 自动填充：字段加 @TableField(fill=INSERT/UPDATE/INSERT_UPDATE)，并自定义 MetaObjectHandler 重写 insertFill/updateFill 写入时间等。@Version 是乐观锁，@TableLogic 是逻辑删除，不负责填充。", "android": "类比 Android：类似 Room 的 @Insert(onConflict) 或 TypeConverter 自动处理时间戳字段。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis-Plus 自动填充"}, {"no": 3, "type": "single", "body": "下列 Redis 数据结构最适合\"实时排行榜（按分数排序、取 Top10）\"的是？", "code": "ZADD rank 100 userA; ZREVRANGE rank 0 9 WITHSCORES", "options": [{"k": "A", "t": "String"}, {"k": "B", "t": "List"}, {"k": "C", "t": "ZSET（有序集合，按 score 排序）"}, {"k": "D", "t": "Set"}], "answer": "C", "explain": "ZSET 用 score 维护有序，ZREVRANGE 取TopN、ZRANK 查排名，天然适合排行榜/延迟队列。String 无排序；List 按插入序；Set 无序。", "android": "类比 Android：类似用 TreeMap/优先队列按分数排序取 Top，但 Redis ZSET 是服务端持久化的。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 数据结构选型"}, {"no": 4, "type": "single", "body": "关于 MySQL 中 COUNT(*) 、COUNT(1) 与 COUNT(col) 的区别，正确的是？", "code": "SELECT COUNT(*) FROM t;", "options": [{"k": "A", "t": "COUNT(col) 统计含 NULL 的行数"}, {"k": "B", "t": "COUNT(*) 与 COUNT(1) 都统计行数（含 NULL），COUNT(col) 忽略 NULL"}, {"k": "C", "t": "COUNT(*) 比 COUNT(1) 慢很多"}, {"k": "D", "t": "COUNT(主键) 永远最快"}], "answer": "B", "explain": "COUNT(*)/COUNT(1) 统计所有行（不忽略 NULL）；COUNT(col) 只统计 col 非 NULL 的行。现代 MySQL 中 COUNT(*) 与 COUNT(1) 性能基本等价，优化器都会选最优执行；COUNT(主键) 也统计非 NULL，但不一定比 COUNT(*) 快。", "android": "类比 Android：类似统计列表 size vs 统计某字段非空的个数，语义不同。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 聚合统计语义"}, {"no": 5, "type": "single", "body": "Kafka 消费者\"至少一次\"（at-least-once）语义，正确的实现是？", "code": "enable.auto.commit=false; 处理完手动 commitAsync()", "options": [{"k": "A", "t": "auto.commit=true 高频提交，绝不重复"}, {"k": "B", "t": "先提交 offset 再处理消息"}, {"k": "C", "t": "关闭自动提交，业务处理成功后再手动提交 offset"}, {"k": "D", "t": "at-least-once 无法做到，Kafka 只有 exactly-once"}], "answer": "C", "explain": "at-least-once：处理成功后再提交 offset，若提交前崩溃则重启会重消费（可能重复，但不会丢）。若\"先提交再处理\"崩溃则会丢（at-most-once）。exactly-once 需事务/幂等生产者配合。", "android": "类比 Android：类似消费本地消息\"处理完打已读再删\"，崩溃重启会重读，保证不丢但可能重复。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消费语义"}, {"no": 6, "type": "single", "body": "@ConfigurationProperties 绑定配置时，yml 的 app.time-out 能映射到 Java 字段 timeout 是因为？", "code": "app:\n  time-out: 3000", "options": [{"k": "A", "t": "必须字段名完全等于 time-out"}, {"k": "B", "t": "支持松散绑定（relaxed binding）：time-out / time_out / timeout 都能映射"}, {"k": "C", "t": "需在字段上写 @Value"}, {"k": "D", "t": "只能用小驼峰，不支持短横线"}], "answer": "B", "explain": "@ConfigurationProperties 支持松散绑定：短横线（kebab）、下划线、驼峰等命名可互相映射；@Value 不支持此特性。这也是推荐用 @ConfigurationProperties 管理一组配置的原因。", "android": "类比 Android：类似 Gradle 配置不同命名风格映射到同一变量，框架做了归一化。", "kaodian": "AI 后端能力 - 框架与容器层 - 配置绑定"}, {"no": 7, "type": "single", "body": "缓存雪崩（大量 key 同时过期）的防护手段是？", "code": "同一批缓存设置了相同 TTL", "options": [{"k": "A", "t": "给 TTL 加随机抖动，避免同时失效"}, {"k": "B", "t": "把所有 key 过期时间设为永久"}, {"k": "C", "t": "增大 Redis 单线程处理能力即可"}, {"k": "D", "t": "只要加分布式锁就解决"}], "answer": "A", "explain": "缓存雪崩=同一时刻大量 key 失效，请求直接打到 DB 打垮。防护：①TTL 加随机抖动错峰；②多级缓存（本地+Redis）；③热点 key 不过期+后台刷新；④熔断/限流兜底。永久不过期会内存暴涨且数据不更新。", "android": "类比 Android：类似把多个定时刷新任务错开，避免同一秒全部失效导致集中请求。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存雪崩防护"}, {"no": 8, "type": "single", "body": "一条 SQL 很慢，用 EXPLAIN 分析时，下列 type 列值表示扫描效率最高（最快）的是？", "code": "EXPLAIN SELECT * FROM t WHERE id=1;", "options": [{"k": "A", "t": "ALL（全表扫描）"}, {"k": "B", "t": "INDEX（全索引扫描）"}, {"k": "C", "t": "ref（非唯一索引查找）"}, {"k": "D", "t": "const / eq_ref（主键或唯一索引精确匹配）"}], "answer": "D", "explain": "EXPLAIN type 从优到劣：system > const > eq_ref > ref > range > index > ALL。const/eq_ref 是主键/唯一索引的常量级精确命中，最快；ALL 全表扫描最差。rows 列显示估算扫描行数，Extra 显示是否 Using index/Using filesort 等。", "android": "类比 Android：类似用索引查询 vs 遍历整个列表，explain 的 type 就是告诉你走的是哪种。", "kaodian": "AI 后端能力 - 数据库与ORM层 - SQL 优化-EXPLAIN"}, {"no": 9, "type": "single", "body": "Vue3 中 watch 与 watchEffect 的区别，正确的是？", "code": "watch(src, (n,o)=>{...}); watchEffect(()=>{...})", "options": [{"k": "A", "t": "二者完全一样，只是名字不同"}, {"k": "B", "t": "watch 需显式指定监听源；watchEffect 自动追踪回调内用到的响应式依赖"}, {"k": "C", "t": "watchEffect 拿不到旧值，且不会立即执行"}, {"k": "D", "t": "watch 无法监听多个源"}], "answer": "B", "explain": "watch 明确指定监听的数据源与回调（可拿到新旧值，默认惰性不立即执行除非 immediate）；watchEffect 立即执行一次并自动收集回调中访问的响应式依赖，依赖变才重跑。watch 也可监听多个源（数组）。", "android": "类比 Android：类似 Flow 的 distinctUntilChanged 需指定字段，而某些自动追踪整个 lambda 引用的状态。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 侦听"}, {"no": 10, "type": "single", "body": "Flex 布局中 flex: 1 2 100px 三个值分别对应？", "code": ".item { flex: 1 2 100px; }", "options": [{"k": "A", "t": "flex-grow flex-shrink flex-basis"}, {"k": "B", "t": "flex-basis flex-grow flex-shrink"}, {"k": "C", "t": "flex-direction flex-wrap flex-basis"}, {"k": "D", "t": "order align-self flex-basis"}], "answer": "A", "explain": "flex 简写 = flex-grow（放大比例）/ flex-shrink（缩小比例）/ flex-basis（基准尺寸）。flex:1 等价于 1 1 0%。grow/shrink 为 0 表示不放大/不缩小。", "android": "类比 Android：类似 LinearLayout 的 layout_weight / 最小尺寸，grow 像 weight 分配剩余空间。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS Flex 布局"}, {"no": 11, "type": "single", "body": "下列代码在浏览器中的输出是？", "code": "for (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 0);\n}", "options": [{"k": "A", "t": "0 1 2"}, {"k": "B", "t": "3 3 3"}, {"k": "C", "t": "0 0 0"}, {"k": "D", "t": "undefined undefined undefined"}], "answer": "B", "explain": "var 函数作用域且无块级绑定，三次 setTimeout 共享同一个 i；循环结束 i=3，宏任务执行时打印 3 3 3。改用 let（块级作用域）才会输出 0 1 2。这是经典的闭包/作用域题。", "android": "类比 Android：类似在循环里 post 一个引用了循环变量的 Runnable，变量是同一份，最终都读到终值。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 作用域与闭包"}, {"no": 12, "type": "single", "body": "HTTP 状态码 401 与 403 的区别是？", "code": "响应头 WWW-Authenticate / 无权限", "options": [{"k": "A", "t": "401 未认证（未登录），403 已认证但无权限"}, {"k": "B", "t": "401 服务器错误，403 客户端错误"}, {"k": "C", "t": "二者完全相同"}, {"k": "D", "t": "401 表示资源不存在"}], "answer": "A", "explain": "401 Unauthorized = 未提供有效身份凭证（需登录）；403 Forbidden = 已登录但无权访问该资源。404 才是资源不存在。5xx 才是服务端错误。", "android": "类比 Android：类似接口返回\"未登录\"与\"无权限\"是两个不同语义，前端跳转逻辑不同。", "kaodian": "AI 前端能力 - 工程化与网络 - HTTP 状态码"}, {"no": 13, "type": "single", "body": "Axios 中取消一个进行中的请求，现代做法是？", "code": "const ac = new AbortController();\naxios.get(url, { signal: ac.signal });\nac.abort();", "options": [{"k": "A", "t": "用 setTimeout 忽略响应"}, {"k": "B", "t": "用 AbortController + signal（Fetch 标准）"}, {"k": "C", "t": "axios.cancel() 静态方法（已过时）"}, {"k": "D", "t": "无法取消，只能等超时"}], "answer": "B", "explain": "现代浏览器用 AbortController 的 signal 传给 axios 请求配置，调用 ac.abort() 取消；axios 旧版 CancelToken 已废弃。取消后请求进入 rejected（CanceledError）。", "android": "类比 Android：类似 OkHttp 的 Call.cancel()，中断进行中的请求。", "kaodian": "AI 前端能力 - 工程化与网络 - Axios 取消请求"}, {"no": 14, "type": "single", "body": "浏览器同源策略（Same-Origin Policy）判定\"不同源\"的依据不包括？", "code": "协议://域名:端口/路径", "options": [{"k": "A", "t": "协议（http vs https）不同"}, {"k": "B", "t": "域名（a.com vs b.com）不同"}, {"k": "C", "t": "端口（:80 vs :8080）不同"}, {"k": "D", "t": "URL 路径（/api vs /user）不同"}], "answer": "D", "explain": "同源=协议+域名+端口三者全同；路径不同不影响同源判定（同源策略只看这三要素）。跨源才会触发 CORS 限制。", "android": "类比 Android：类似同一\"baseUrl+端口\"算同源，路径不同仍共享 cookie/凭据策略。", "kaodian": "AI 前端能力 - 工程化与网络 - 同源策略"}, {"no": 15, "type": "single", "body": "JUnit5 中 @Mock 与 @Spy 的区别是？", "code": "@Mock UserService m; @Spy UserRepo r;", "options": [{"k": "A", "t": "@Mock 创建全假对象（方法默认返回空）；@Spy 包装真实对象，未 stub 的方法走真实实现"}, {"k": "B", "t": "@Spy 创建全假对象"}, {"k": "C", "t": "二者完全一致"}, {"k": "D", "t": "@Mock 只能用于接口"}], "answer": "A", "explain": "@Mock 生成纯桩对象，所有方法返回默认值（0/null/false），需 when().thenReturn() 设定行为；@Spy 基于真实实例，调用真实方法除非显式 stub 某方法。适合\"只替换个别方法、保留其余真实逻辑\"。", "android": "类比 Android：类似 mock 整个对象 vs spy 在真实对象上只打桩某几个方法。", "kaodian": "AI 质量保障 - 自动化测试与工具 - Mock 与 Spy"}, {"no": 16, "type": "single", "body": "契约测试（Consumer-Driven Contract）主要解决的是？", "code": "consumer 定义期望，provider 校验", "options": [{"k": "A", "t": "单元测试覆盖率不足"}, {"k": "B", "t": "微服务间接口变更导致消费方 unknow 崩溃（接口契约一致性）"}, {"k": "C", "t": "前端样式错乱"}, {"k": "D", "t": "数据库性能"}], "answer": "B", "explain": "契约测试在微服务间：由消费方定义期望的请求/响应契约，提供方在 CI 中校验自己是否满足，防止一方改接口破坏另一方。弥补 E2E 测试慢、单测不跨服务的盲区。常见工具 Pact。", "android": "类比 Android：类似 SDK 提供方与调用方约定接口契约，CI 中自动校验兼容，避免升级 SDK 后调用方编译/运行崩。", "kaodian": "AI 质量保障 - 自动化测试与工具 - 契约测试"}, {"no": 17, "type": "single", "body": "关于 Java volatile 关键字，正确的是？", "code": "private volatile boolean running = true;", "options": [{"k": "A", "t": "volatile 保证原子性（如 i++ 线程安全）"}, {"k": "B", "t": "volatile 保证可见性（一线程写其他线程立即可见）与有序性（禁止重排），但不保证复合操作原子性"}, {"k": "C", "t": "volatile 等同于 synchronized"}, {"k": "D", "t": "volatile 只能修饰方法"}], "answer": "B", "explain": "volatile 保证可见性（写立即刷主存、读从主存）和禁止指令重排，但不保证 i++ 这类\"读-改-写\"的原子性（仍需 synchronized/AtomicInteger）。synchronized 还提供互斥与原子。", "android": "类比 Android：类似在主线程与工作线程间共享的标志位，volatile 让主线程及时看到子线程改的值（类似 AtomicBoolean 的可见性语义）。", "kaodian": "AI 后端能力 - 语言基础层 - 并发与 volatile"}, {"no": 18, "type": "single", "body": "JVM 中，对象实例通常分配在？", "code": "new User();", "options": [{"k": "A", "t": "方法区（元空间）"}, {"k": "B", "t": "堆（Heap）"}, {"k": "C", "t": "栈（Stack）"}, {"k": "D", "t": "PC 寄存器"}], "answer": "B", "explain": "绝大多数对象实例与数组分配在堆（Heap），由 GC 管理；方法区/元空间存类元信息；栈存局部变量与方法帧；逃逸分析优化下部分对象可栈上分配（标量替换）或锁消除。", "android": "类比 Android：类似 Java 层对象在堆、由 GC 回收；Native 层才在栈/手动管理。", "kaodian": "AI 后端能力 - 语言基础层 - JVM 内存模型"}, {"no": 19, "type": "single", "body": "GROUP BY 查询中，筛选\"分组后\"的条件应使用？", "code": "SELECT dept, COUNT(*) FROM emp GROUP BY dept HAVING COUNT(*)>10;", "options": [{"k": "A", "t": "WHERE COUNT(*)>10"}, {"k": "B", "t": "HAVING COUNT(*)>10（分组后过滤）"}, {"k": "C", "t": "ORDER BY 后过滤"}, {"k": "D", "t": "LIMIT 代替 HAVING"}], "answer": "B", "explain": "WHERE 在分组前对行过滤，HAVING 在分组后对聚合结果过滤（如 COUNT>10）。聚合函数不能出现在 WHERE 中。执行顺序：WHERE→GROUP BY→HAVING→SELECT→ORDER BY。", "android": "类比 Android：类似先 map 再 group，最后 filter 掉 count 不达标的组。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 分组与聚合"}, {"no": 20, "type": "single", "body": "关于测试替身（Test Double），\"验证调用次数/顺序\"应使用？", "code": "Mockito.verify(m, times(2)).send(any());", "options": [{"k": "A", "t": "只做 stub（when/thenReturn），从不验证"}, {"k": "B", "t": "Mockito.verify() 验证方法被调用的次数/参数/顺序"}, {"k": "C", "t": "用 assertEquals 验证"}, {"k": "D", "t": "无法验证调用行为"}], "answer": "B", "explain": "Mock 既能 stub 返回值（when/thenReturn），也能 verify 验证交互（调用次数 times(n)、参数 any()、顺序 InOrder）。单纯 stub 不验证行为，verify 才断言\"是否被正确调用\"，是行为测试的核心。", "android": "类比 Android：类似验证某个接口方法是否按预期被调用了 N 次（可用 mockito-kotlin 的 verify）。", "kaodian": "AI 质量保障 - 自动化测试与工具 - 行为验证"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "下列哪些场景适合用 Redis？（多选）", "code": "缓存 / 计数器 / 排行榜 / 分布式锁", "options": [{"k": "A", "t": "热点数据缓存（降 DB 压力）"}, {"k": "B", "t": "分布式锁（SET NX）"}, {"k": "C", "t": "排行榜（ZSET）"}, {"k": "D", "t": "需要强事务、跨多表一致的核心记账主存"}], "answer": ["A", "B", "C"], "explain": "Redis 适合缓存、计数、排行榜、分布式锁、限流、消息队列（轻量）等高性能场景。D 错误：Redis 事务弱（不支持回滚、无跨键强一致），核心金融记账主存应在关系库+事务保障。", "android": "类比 Android：类似用 MMKV/内存缓存做高频读写，但关键账目仍落 SQLite 事务。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 适用场景"}, {"no": 2, "type": "multi", "body": "MySQL 某查询慢，可选的优化手段有？（多选）", "code": "SELECT * FROM t WHERE name LIKE '%张%' ORDER BY create_time DESC LIMIT 100000,10;", "options": [{"k": "A", "t": "为高频过滤/排序列建合适索引"}, {"k": "B", "t": "避免 SELECT *，只取所需列（利于覆盖索引）"}, {"k": "C", "t": "深分页改用游标/延迟关联（WHERE id>? LIMIT n）"}, {"k": "D", "t": "给 LIKE '%x%' 前模糊字段加普通索引即可加速"}], "answer": ["A", "B", "C"], "explain": "A 建索引最直接；B 减少回表、利于覆盖索引；C 深分页（OFFSET 大）应改游标分页避免扫描丢弃大量行；D 错误：前模糊 '%x%' 普通索引失效（B+Tree 不支持后缀/中间匹配），可用全文索引/倒排。", "android": "类比 Android：类似分页查询用 key 游标代替 offset，避免越翻越慢。", "kaodian": "AI 后端能力 - 数据库与ORM层 - SQL 优化手段"}, {"no": 3, "type": "multi", "body": "关于 Spring Bean 作用域（scope），下列说法正确的有？（多选）", "code": "@Scope(\"prototype\") / 默认 singleton", "options": [{"k": "A", "t": "singleton（默认）：容器中只有一个实例，线程安全需自行保证"}, {"k": "B", "t": "prototype：每次 getBean / 注入都新建实例"}, {"k": "C", "t": "request / session：Web 环境下每个请求/会话一个实例"}, {"k": "D", "t": "singleton Bean 自动线程安全，无需同步"}], "answer": ["A", "B", "C"], "explain": "singleton 是默认作用域（单例），prototype 每次获取新建；request/session 作用域仅在 Web 上下文有效。D 错误：单例只代表\"唯一实例\"，若 Bean 有可变状态且被并发访问仍需同步，Spring 不替你加锁。", "android": "类比 Android：类似单例 Logger（无状态安全）vs 每次 new 的 Request 对象（有状态）。", "kaodian": "AI 后端能力 - 框架与容器层 - Bean 作用域"}, {"no": 4, "type": "multi", "body": "Vue3 组合式 API（Composition API）相比选项式 API 的优势有？（多选）", "code": "setup() / <script setup>", "options": [{"k": "A", "t": "按逻辑关注点组织代码，相关状态与逻辑聚在一起，便于复用"}, {"k": "B", "t": "更好的 TypeScript 类型推导"}, {"k": "C", "t": "通过 composable 函数实现跨组件逻辑复用（替代 mixin 的命名冲突）"}, {"k": "D", "t": "运行时性能比选项式慢很多，不推荐用"}], "answer": ["A", "B", "C"], "explain": "组合式 API 让同一功能的 data/computed/watch 聚在一起，逻辑复用用 composable（如 u , "answer": "正确", "explain": "唯一索引能在数据库层拒绝重复记录（DuplicateKey 异常），是幂等兜底手段；配合业务状态机/Token 去重，可可靠防重复提交。", "android": "类比 Android：类似用唯一约束的本地表防插入重复记录。", "kaodian": "AI 后端能力 - 框架与容器层 - 接口幂等"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+q.no+'" data-no="'+q.no+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+q.no+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q.no==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=document.querySelector('.card[data-no="'+btn.dataset.no+'"]'); gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  ans.querySelector('.ans').textContent='答案：'+(q.type==='fill'? q.answerText : q.answer.join('、'));
  ans.classList.add('show');
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  if(!isAnswered(card)){ if(!confirm('本题还没作答，将按答错处理并展示答案。')) return; }
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>

</body>
</html>
