<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;

  .bar .userbox a { color:#1664ff; cursor:pointer; text-decoration:none; }
  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }

  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }

<script type="application/json" id="quizData">{"id": "vol03", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11。覆盖缓存穿透/三问题、MyBatis-Plus 置 NULL 与 updateById、@Cacheable/condition/unless、MQ Topic 路由与 rebalance、最左前缀、@Profile、Vue3 watch flush/ref 解包、Flex/border-box、Axios 拦截器顺序、TS 类型守卫、测试断言层次/TDM/缺陷生命周期/测试左移等。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "某热点用户查询被恶意刷大量不存在的 id，请求全部打到 DB。下列防护思路正确的是？", "code": "String v = redis.get(id);\nif (v == null) {\n  v = db.get(id);\n  if (v == null) { redis.set(id, \"\", 60); } // 空值缓存\n}", "options": [{"k": "A", "t": "缓存空值（短过期）可拦截重复穿透，或布隆过滤器前置拦截不存在的 key"}, {"k": "B", "t": "加更多 DB 连接即可解决"}, {"k": "C", "t": "关闭缓存最安全"}, {"k": "D", "t": "用 UUID 替换 id"}], "answer": "A", "explain": "缓存穿透=查不存在的数据导致绕过缓存打 DB。空值缓存（短 TTL）与布隆过滤器是常见解法；布隆过滤器能快速判断 key 是否存在，不存在直接返回。", "kaodian": "AI后端能力-高并发与中间件层-缓存穿透"}, {"no": 2, "type": "single", "body": "想把 userName 更新为 NULL，下列写法能否生效？", "code": "userMapper.update(null, new LambdaUpdateWrapper<User>()\n  .eq(User::getId,1).set(User::getUserName, null));", "options": [{"k": "A", "t": "默认更新策略(NOT_NULL)会忽略 null，userName 不会被置空；需 @TableField(updateStrategy=IGNORED) 或 .isNull()"}, {"k": "B", "t": "一定能把 userName 置为 NULL"}, {"k": "C", "t": "LambdaUpdateWrapper 不支持 set null"}, {"k": "D", "t": "应改用 delete"}], "answer": "A", "explain": "MP 默认 FieldStrategy.NOT_NULL 会跳过 null 字段的更新。要显式置 NULL，需在该字段上配 updateStrategy=IGNORED，或用 .set(...).isNull(...) 方式。", "kaodian": "AI后端能力-数据存储与ORM层-LambdaQueryWrapper/LambdaUpdateWrapper"}, {"no": 3, "type": "single", "body": "下列 @Cacheable 配置，哪项正确表述了 condition 与 unless 的区别？", "code": "@Cacheable(cacheNames=\"u\", condition=\"#id>0\", unless=\"#result==null\")", "options": [{"k": "A", "t": "condition 在调用前判断（不满足则不走缓存），unless 在调用后判断（结果为 true 时不缓存）"}, {"k": "B", "t": "两者都在调用前判断"}, {"k": "C", "t": "顺序相反：unless 在前 condition 在后"}, {"k": "D", "t": "两者作用完全相同"}], "answer": "A", "explain": "condition 是前置条件（不满足直接查库不缓存），unless 是后置条件（返回 true 则不放入缓存，常用于屏蔽 null 结果）。", "kaodian": "AI后端能力-应用框架层-Spring缓存"}, {"no": 4, "type": "single", "body": "Topic 交换机，绑定：Q1 order.#，Q2 *.payment.*。发送 routing key=order.payment.success，哪些队列收到？", "code": "Q1: order.#\nQ2: *.payment.*\nrk: order.payment.success", "options": [{"k": "A", "t": "Q1 和 Q2 都收到（# 匹配零或多词，* 匹配恰好一词）"}, {"k": "B", "t": "仅 Q1"}, {"k": "C", "t": "仅 Q2"}, {"k": "D", "t": "都不收到"}], "answer": "A", "explain": "# 匹配零个或多个词，* 匹配恰好一个词。order.payment.success 含 3 词：Q1 order.# 命中，Q2 *.payment.* 第一/三词任意、第二词 payment 命中。", "kaodian": "AI后端能力-高并发与中间件层-MQ基础概念"}, {"no": 5, "type": "single", "body": "消费者组内新增消费者触发 rebalance，下列描述正确的是？", "code": "group:A, topic orders 3 partitions, consumers: c1 -> 新增 c2", "options": [{"k": "A", "t": "rebalance 会暂停消费并重新分配分区，期间消费组短暂不可用，可能导致重复消费"}, {"k": "B", "t": "rebalance 不影响正常消费"}, {"k": "C", "t": "新增消费者立即接管全部分区"}, {"k": "D", "t": "分区数量会自动增加"}], "answer": "A", "explain": "rebalance 是分区重分配过程，期间消费者暂停拉取，分配完成后从新分配的分区 offset 继续；若 offset 提交不及时可能产生重复消费。", "kaodian": "AI后端能力-高并发与中间件层-MQ基础概念"}, {"no": 6, "type": "single", "body": "联合索引 idx(a,b,c)，下列哪条查询无法充分利用索引（出现断点）？", "code": "WHERE a=1 AND c=2;        -- 跳过 b\nWHERE b=2 AND c=3;      -- 缺失 a\nWHERE a=1 AND b>2 AND c=3; -- b 范围后 c 失效", "options": [{"k": "A", "t": "WHERE a=1 AND c=2（跳过 b，只用到 a，c 无法走索引）"}, {"k": "B", "t": "WHERE a=1 AND b=2 AND c=3"}, {"k": "C", "t": "WHERE a=1 AND b=2"}, {"k": "D", "t": "WHERE a>1 AND b=2"}], "answer": "A", "explain": "最左前缀原则：索引按 a,b,c 顺序组织。跳过 b 直接查 c 无法利用已排序结构；范围查询(b>2)之后的列(c)也会失效。", "kaodian": "AI后端能力-数据存储与ORM层-索引与SQL优化"}, {"no": 7, "type": "single", "body": "下列用 @Profile 控制 Bean 生效环境，说法正确的是？", "code": "@Bean @Profile(\"dev\") DataSource devDs(){...}\n@Bean @Profile(\"prod\") DataSource prodDs(){...}", "options": [{"k": "A", "t": "只有激活 dev 时 devDs 注册，激活 prod 时 prodDs 注册，实现环境隔离"}, {"k": "B", "t": "两个 Bean 都会注册"}, {"k": "C", "t": "@Profile 只能用于类上"}, {"k": "D", "t": "默认两个都生效"}], "answer": "A", "explain": "@Profile 让 Bean 仅在指定环境激活时注册。配合 spring.profiles.active 切换 dev/prod/test，避免错误数据源被加载。", "kaodian": "AI后端能力-微服务与云原生层-多环境与配置"}, {"no": 8, "type": "single", "body": "在 Vue3 中，希望 watch 回调在 DOM 更新之后执行，应配置？", "code": "watch(src, () => { /* 访问更新后的 DOM */ }, { flush: 'post' });", "options": [{"k": "A", "t": "flush:'post' 让回调在组件更新（DOM 刷新）之后执行"}, {"k": "B", "t": "flush:'pre' 在更新前执行"}, {"k": "C", "t": "flush:'sync' 同步立即执行"}, {"k": "D", "t": "watch 无法控制执行时机"}], "answer": "A", "explain": "Vue3 watch 的 flush 选项：pre（默认，组件更新前）、post（更新后，可访问 DOM）、sync（同步）。需要操作更新后 DOM 用 post。", "kaodian": "AI前端能力-语言与运行时-Vue3响应式"}, {"no": 9, "type": "single", "body": "容器 width:500px，两个子项 flex:1 1 100 与 flex:2 1 100，最终宽度如何？", "code": ".a{flex:1 1 100}.b{flex:2 1 100}", "options": [{"k": "A", "t": "各先占 basis=100，剩余 300 按 grow 1:2 分配：a≈200、b≈300"}, {"k": "B", "t": "按内容撑开"}, {"k": "C", "t": "各 250"}, {"k": "D", "t": "a 占满 500"}], "answer": "A", "explain": "flex 计算：先按 basis 各占 100（共 200），剩余 300 按 grow 比例 1:2 分配，a 得 100+100=200，b 得 100+200=300。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS布局"}, {"no": 10, "type": "single", "body": "设置 *{box-sizing:border-box} 后，width:100px;padding:20px 的元素总宽度是？", "code": "width:100px; padding:20px; box-sizing:border-box;", "options": [{"k": "A", "t": "总宽度 100px（padding 含在 width 内，内容区为 60px）"}, {"k": "B", "t": "总宽 140px"}, {"k": "C", "t": "总宽 120px"}, {"k": "D", "t": "内容区 100px"}], "answer": "A", "explain": "border-box 模型下 width 包含 padding 与 border。padding 20*2=40 含在 100 内，内容区=60px。相比 content-box 更易于布局计算。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS布局"}, {"no": 11, "type": "single", "body": "Axios 同时注册请求与响应拦截器，执行顺序正确的是？", "code": "axios.interceptors.request.use(r1, r2);\naxios.interceptors.response.use(s1, s2);", "options": [{"k": "A", "t": "请求拦截器按注册正序执行，响应拦截器按注册逆序执行"}, {"k": "B", "t": "都按正序"}, {"k": "C", "t": "都按逆序"}, {"k": "D", "t": "随机顺序"}], "answer": "A", "explain": "Axios 请求拦截器为栈式（后注册先执行请求前置的洋葱外层），响应拦截器逆序。理解顺序对统一注入 Token/统一处理错误很关键。", "kaodian": "AI前端能力-网络与BFF架构-Axios请求配置"}, {"no": 12, "type": "single", "body": "下列代码中，state.list[0] 能否直接拿到基本类型值而非 ref？", "code": "const state = reactive({ list: [ref(1), ref(2)] });\nconsole.log(state.list[0]);", "options": [{"k": "A", "t": "reactive 数组中的 ref 元素会自动解包，state.list[0] 是 1"}, {"k": "B", "t": "仍是 ref 对象"}, {"k": "C", "t": "会报错"}, {"k": "D", "t": "需 .value 访问"}], "answer": "A", "explain": "reactive 对象（含数组）在访问时会自动对嵌套 ref 解包，所以 state.list[0] 直接是 1。但在纯数组中 ref 不解包。", "kaodian": "AI前端能力-语言与运行时-Vue3响应式"}, {"no": 13, "type": "single", "body": "关于 Promise.race 与 Promise.any，下列说法正确的是？", "code": "Promise.race([p1,p2]); Promise.any([p1,p2]);", "options": [{"k": "A", "t": "race 取最先落定（无论成败），any 取最先成功"}, {"k": "B", "t": "两者都取最先成功"}, {"k": "C", "t": "两者都取最先失败"}, {"k": "D", "t": "两者都等待全部完成"}], "answer": "A", "explain": "race 是「第一个 settle 的」（可能失败），any 是「第一个 fulfilled 的」，全部失败才 reject（AggregateError）。", "kaodian": "AI前端能力-语言与运行时-异步与事件循环"}, {"no": 14, "type": "single", "body": "下列自定义类型守卫写法正确的是？", "code": "function isFish(x: Fish|Bird): x is Fish { return (x as Fish).swim !== undefined; }", "options": [{"k": "A", "t": "返回类型谓词 x is Fish，调用后 TS 能收窄联合类型"}, {"k": "B", "t": "返回 boolean 即可，无需 is 谓词"}, {"k": "C", "t": "必须写 as 断言才能用"}, {"k": "D", "t": "TS 不支持自定义类型守卫"}], "answer": "A", "explain": "类型守卫函数返回 `x is T` 谓词，调用 `if (isFish(x))` 后 TS 在该分支内把 x 收窄为 Fish，获得精准提示。", "kaodian": "AI前端能力-语言与运行时-TypeScript基础"}, {"no": 15, "type": "single", "body": "接口自动化测试中，一个健壮的断言应包含哪些层次？", "code": "expect(status).toBe(200);\nexpect(body.code).toBe(0);\nexpect(body.data.id).toBeDefined();", "options": [{"k": "A", "t": "状态码 + 业务 code + 关键业务字段，三层校验"}, {"k": "B", "t": "只看状态码"}, {"k": "C", "t": "只看响应时间"}, {"k": "D", "t": "不需要断言"}], "answer": "A", "explain": "完整断言应覆盖：传输层（HTTP 状态码）、业务层（业务 code）、数据层（关键字段存在/正确）。只断言一层易漏 bug。", "kaodian": "AI质量保障-接口测试-APITesting&Integration"}, {"no": 16, "type": "single", "body": "关于自动化测试用例设计，下列说法正确的是？", "code": "", "options": [{"k": "A", "t": "用例应独立、可重复执行，不依赖执行顺序与共享状态"}, {"k": "B", "t": "用例间共享全局变量可提升效率"}, {"k": "C", "t":       const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
