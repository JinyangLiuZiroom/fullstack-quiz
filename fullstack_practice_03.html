<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全栈转型模拟自测卷</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2329; margin: 0; padding: 24px 24px 96px; line-height: 1.65; }
  .container { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: #646a73; font-size: 14px; margin-bottom: 4px; }
  .meta { background: #fff; border-radius: 10px; padding: 14px 18px; margin: 16px 0 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); font-size: 14px; color: #41464b; }
  .meta b { color: #1664ff; }
  .backlink { display:inline-block; margin: 4px 0 10px; color:#1664ff; text-decoration:none; font-size:14px; }
  .backlink:hover { text-decoration: underline; }
  .section { margin-top: 28px; }
  .section h2 { font-size: 18px; margin: 0 0 12px; padding-left: 10px; border-left: 4px solid #1664ff; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card.correct { box-shadow: 0 0 0 2px #52c41a inset, 0 1px 3px rgba(0,0,0,.06); }
  .card.wrong { box-shadow: 0 0 0 2px #ff4d4f inset, 0 1px 3px rgba(0,0,0,.06); }
  .q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .q-no { font-weight: 700; font-size: 15px; }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: 4px; font-weight: 600; }
  .tag-single { background: #e8f3ff; color: #1664ff; }
  .tag-multi  { background: #fff3e0; color: #d4860b; }
  .tag-judge  { background: #fde8f3; color: #c41d7f; }
  .tag-fill   { background: #e9f9ee; color: #1a9e4b; }
  .kaodian { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; background: #f0f2f5; color: #646a73; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-badge { font-size:12px; padding:2px 9px; border-radius:4px; font-weight:700; margin-left:auto; }
  .res-badge.ok { background:#e9f9ee; color:#1a9e4b; }
  .res-badge.no { background:#fff1f0; color:#ff4d4f; }
  .q-body { font-size: 15px; margin-bottom: 10px; }
  .code { background: #2b2f36; color: #e6e6e6; border-radius: 8px; padding: 12px 14px;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; overflow-x: auto; margin: 10px 0; white-space: pre; }
  .options { margin: 8px 0 4px; }
  .opt { display: flex; align-items:flex-start; gap:8px; padding: 9px 12px; border-radius: 8px; margin: 6px 0;
    background: #f7f8fa; border: 1.5px solid transparent; font-size: 14px; cursor: pointer; transition: all .12s; }
  .opt:hover { background: #eef2f7; }
  .opt .k { font-weight:700; color:#1664ff; min-width: 16px; }
  .opt.sel { background: #e8f3ff; border-color: #1664ff; }
  .opt.correct { background: #f0f9eb; border-color: #52c41a; }
  .opt.correct .k { color:#52c41a; }
  .opt.wrong { background: #fff1f0; border-color: #ff4d4f; }
  .opt.wrong .k { color:#ff4d4f; }
  .opt.locked { cursor: default; }
  .q-actions { margin-top: 10px; }
  .q-check { background:#1664ff; color:#fff; border:none; border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; font-weight:600; }
  .q-check:hover { background:#0e4fd8; }
  .card.graded .q-check { display:none; }
  .blank { border:none; border-bottom: 1.5px solid #1664ff; background:#f7f8fa; padding: 3px 8px; margin: 0 4px;
    font-size:14px; min-width: 120px; border-radius:4px 4px 0 0; }
  .blank.correct { border-bottom-color:#52c41a; background:#f0f9eb; }
  .blank.wrong { border-bottom-color:#ff4d4f; background:#fff1f0; }
  .answer { display: none; margin-top: 14px; padding: 14px; background: #f0f9eb;
    border-left: 4px solid #67c23a; border-radius: 6px; font-size: 14px; }
  .answer.show { display: block; }
  .answer .ans { font-weight: 700; color: #1a9e4b; margin-bottom: 8px; font-size: 15px; }
  .answer .label { font-weight: 700; }
  .answer .android { margin-top: 10px; padding: 10px 12px; background: #eef4ff; border-radius: 6px; color: #2a3a55; font-size: 13px; }
  .answer .android .label { color: #1664ff; }
  .footer { text-align: center; color: #9aa0a6; font-size: 13px; margin: 30px 0 10px; }
  .bar { position: fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #e5e6eb;
    box-shadow: 0 -2px 10px rgba(0,0,0,.05); padding: 10px 16px; display:flex; gap:10px; align-items:center; justify-content:center; z-index: 50; }
  .bar .prog { font-size: 14px; color:#41464b; margin-right: auto; }
  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }
  .bar .userbox a { color:#1664ff; cursor:pointer; text-decoration:none; }
  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }
  .result-panel.show { display:block; }
  .result-panel .score { font-size:30px; font-weight:800; color:#1664ff; }
  .result-panel .score small { font-size:15px; color:#646a73; font-weight:500; }
  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }
  .result-panel .wrongs a { display:inline-block; margin:3px 6px 3px 0; padding:2px 8px; background:#fff1f0; color:#ff4d4f; border-radius:4px; text-decoration:none; font-weight:600; }
  @media (max-width:600px) {
    body { padding: 12px 12px 100px; }
    .container { max-width: 100%; }
    h1 { font-size: 20px; }
    .meta { padding: 10px 12px; font-size: 13px; }
    .card { padding: 14px 12px; margin-bottom: 10px; }
    .q-body { font-size: 14px; }
    .code { font-size: 11px; padding: 10px 10px; }
    .opt { padding: 8px 10px; font-size: 13px; }
    .bar { padding: 8px 10px; gap: 6px; }
    .bar .prog { font-size: 12px; }
    .btn { padding: 7px 12px; font-size: 13px; }
    .section h2 { font-size: 16px; }
    .answer { font-size: 13px; }
    .answer .android { font-size: 12px; }
  }
</style>
</head>

<script type="application/json" id="quizData">{"id": "vol03", "title": "全栈转型模拟自测卷", "sub": "可答题 · 交卷判分 · 自动记录错题", "meta": "对齐公司真实考法：<b>单选 / 多选 / 判断</b>，每题包含完整代码场景，问执行结果、补全代码、判断框架用法正误。<br>本卷共 <b>33 题</b>：单选 20（60 分）+ 多选 7（28 分）+ 判断 6（12 分）= 100 分。<br>难度：<b>实战细节型</b>，考点标签采用公司标准层级命名。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "下面是一张 InnoDB 表及其查询。关于这条 SQL 在存储引擎层的<code>数据读取过程</code>，描述正确的是？", "code": "CREATE TABLE t_user (\n  id    BIGINT      PRIMARY KEY AUTO_INCREMENT,\n  name  VARCHAR(32) NOT NULL,\n  age   INT         NOT NULL,\n  city  VARCHAR(32),\n  KEY idx_name (name)\n) ENGINE=InnoDB;\n\nSELECT * FROM t_user WHERE name = '张三';", "options": [{"k": "A", "t": "直接在 idx_name 的叶子节点上就能拿到整行数据，一次 B+ 树查找即可完成"}, {"k": "B", "t": "先在 idx_name 的 B+ 树中定位到 name='张三' 的叶子节点，取出其中保存的主键 id，再拿 id 回到聚簇索引查一次才能拿到整行（回表）"}, {"k": "C", "t": "InnoDB 先全表扫描聚簇索引取出所有行，再用 idx_name 对结果做过滤"}, {"k": "D", "t": "因为写了 SELECT *，索引一定失效，执行计划必然是 type=ALL 全表扫描"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 数据库与ORM层 - 聚簇索引与回表。InnoDB 是索引组织表，主键索引即聚簇索引，其叶子节点存放的是<b>完整行数据</b>；而二级索引（idx_name）的叶子节点只存放<b>索引列 + 主键值</b>。所以 name 等值命中二级索引后只能拿到 id，还必须用 id 再走一遍聚簇索引的 B+ 树，这个额外查找就是「回表」。A 错：二级索引叶子不存整行；C 错：命中索引时优化器走 ref，不会先全表再过滤；D 错：SELECT * 只是因为回表代价可能过高而<b>可能</b>被优化器放弃索引（过滤性差时才退化为 ALL），并非「一定」，本例 name 过滤性好仍走 ref。减少回表的正解是建覆盖索引。", "android": "类似 Room 里给字段加 @Index：二级索引像一本「关键词 → rowid」的目录，拿到 rowid 还得回主表取完整实体，和列表页先拿 id 列表、再按 id 查详情是一个套路。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 聚簇索引与回表"}, {"no": 2, "type": "single", "body": "线上慢查询排查时拿到如下 <code>EXPLAIN</code> 输出。关于这份执行计划，判断正确的是？", "code": "mysql> EXPLAIN SELECT id, name FROM t_user WHERE age > 18;\n+----+-------------+--------+-------+---------------+----------+---------+------+--------+-------------+\n| id | select_type | table  | type  | possible_keys | key      | key_len | ref  | rows   | Extra       |\n+----+-------------+--------+-------+---------------+----------+---------+------+--------+-------------+\n|  1 | SIMPLE      | t_user | index | NULL          | idx_name | 130     | NULL | 998112 | Using where |\n+----+-------------+--------+-------+---------------+----------+---------+------+--------+-------------+\n\n-- 表定义：PRIMARY KEY(id), KEY idx_name(name)，age 列上没有索引，表约 100 万行", "options": [{"k": "A", "t": "key=idx_name 说明 WHERE age>18 用上了 idx_name 索引，查询已经优化到位"}, {"k": "B", "t": "type=index 表示「索引范围扫描」，性能仅次于 const，属于优秀级别"}, {"k": "C", "t": "type=index 是全索引扫描：索引只被当作更小的「全表」遍历了一遍，并没有起到缩小扫描范围的作用，rows≈100 万 + possible_keys=NULL 都是佐证，应为 age 建索引"}, {"k": "D", "t": "possible_keys=NULL 说明 SQL 有语法错误，执行时会直接报错"}], "answer": ["C"], "explain": "考点：AI 后端能力 - 数据库与ORM层 - 执行计划分析。type 的常见优劣顺序：<code>system > const > eq_ref > ref > range > index > ALL</code>。<b>type=index 是「全索引扫描」</b>，即从头到尾遍历整棵二级索引 B+ 树，行数级别和 ALL 相同，只是因为要取的 id、name 都在 idx_name 上（相当于覆盖扫描，索引页比数据页小得多）才被优化器选中；WHERE age>18 是扫完之后在 server 层用 Using where 逐行过滤的。<b>possible_keys=NULL 而 key 有值</b>，正是「没有任何索引可用于查找、只是被拿来做覆盖扫描」的典型特征。B 错：range 才是范围扫描。正确优化是建 idx_age(age) 或覆盖索引 (age, name)。", "android": "类比 Android 里遍历整个 List 再 if 过滤：容器换成了更紧凑的索引结构，遍历量小了点，但复杂度仍是 O(n)，不是真正的「按 key 查找」。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 执行计划分析"}, {"no": 3, "type": "single", "body": "已知下表与联合索引。下列哪条 SQL 可以<code>只靠 idx_user_status 完成、无需回表</code>（即命中覆盖索引，Extra 出现 Using index）？", "code": "CREATE TABLE t_order (\n  id        BIGINT        PRIMARY KEY AUTO_INCREMENT,\n  user_id   BIGINT        NOT NULL,\n  status    TINYINT       NOT NULL,\n  amount    DECIMAL(10,2) NOT NULL,\n  create_at DATETIME      NOT NULL,\n  KEY idx_user_status (user_id, status)\n) ENGINE=InnoDB;", "options": [{"k": "A", "t": "SELECT * FROM t_order WHERE user_id = 100;"}, {"k": "B", "t": "SELECT id, create_at FROM t_order WHERE user_id = 100;"}, {"k": "C", "t": "SELECT user_id, amount FROM t_order WHERE user_id = 100;"}, {"k": "D", "t": "SELECT id, user_id, status FROM t_order WHERE user_id = 100 AND status = 1;"}], "answer": ["D"], "explain": "考点：AI 后端能力 - 数据库与ORM层 - 覆盖索引。覆盖索引的判定标准是：<b>查询涉及的所有列都能从索引本身取到</b>。二级索引 idx_user_status 的叶子节点实际保存的是 (user_id, status, id)——主键 id 被隐式携带，这一点常被忽略。D 中 id / user_id / status 全部可从索引取得，无需回表，Extra 显示 Using index。A 要取全部列、C 要取 amount、B 要取 create_at，这些列都不在索引里，必须拿主键回聚簇索引再查一次，产生回表。工程上把高频查询的返回列并入联合索引（索引下推之外的另一种优化）就是在造覆盖索引，代价是索引变大、写入变慢。", "android": "相当于本地缓存已经存好了「列表页需要的字段」就不用再请求详情接口；一旦多问一个字段，就得回源一次。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 覆盖索引"}, {"no": 4, "type": "single", "body": "下面这张 MEMORY 引擎表的索引显式指定为 <code>USING HASH</code>。两条 SQL 对 idx_k 的使用情况是？", "code": "CREATE TABLE t_cache (\n  id INT NOT NULL,\n  k  INT NOT NULL,\n  v  VARCHAR(50),\n  PRIMARY KEY (id),\n  KEY idx_k (k) USING HASH\n) ENGINE=MEMORY;\n\n-- SQL1: SELECT * FROM t_cache WHERE k = 100;\n-- SQL2: SELECT * FROM t_cache WHERE k > 100 ORDER BY k;", "options": [{"k": "A", "t": "SQL1 可用 idx_k 做等值查找（O(1)）；SQL2 无法用 idx_k 做范围扫描，也无法借它省掉 ORDER BY 排序"}, {"k": "B", "t": "两条都能用 idx_k，Hash 索引与 B+ 树索引在检索能力上等价"}, {"k": "C", "t": "SQL1 用不了、SQL2 能用，Hash 索引就是为范围查询设计的"}, {"k": "D", "t": "两条都用不了，MEMORY 引擎不支持任何索引"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 数据库与ORM层 - 索引数据结构。Hash 索引把键散列后放入桶中，只保留「键 → 地址」的等值映射，<b>散列过程彻底丢失了原始顺序</b>，因此：只支持 =、IN、<=> 等值匹配；不支持 >、<、BETWEEN、LIKE 'x%' 等范围扫描；不能用于消除 ORDER BY 排序；也不支持联合索引的最左前缀部分匹配。InnoDB 选择 B+ 树正因为它叶子节点有序且用双向链表串联，天然支持范围查询与排序，且树高只有 3~4 层、磁盘 IO 少。补充：InnoDB 的自适应哈希索引（AHI）是引擎针对热点等值查询自动建立的内存结构，用户无法通过 USING HASH 控制。", "android": "就是 HashMap 与 TreeMap 的差别：HashMap 查单 key 是 O(1)，但要「取出所有大于 100 的 key 并排序」只能全遍历；TreeMap 才有 tailMap/subMap 这种有序能力。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 索引数据结构"}, {"no": 5, "type": "single", "body": "会话隔离级别为 <code>READ COMMITTED</code>，两个事务按下表时序执行。T2、T6 两次查询的返回值以及该现象的名称是？", "code": "-- 表 account(id, balance)，id=1 初始 balance=100，隔离级别 READ COMMITTED\n\n时刻   事务A                                        事务B\n T1    BEGIN;\n T2    SELECT balance FROM account WHERE id=1;   -- 返回 ?\n T3                                              BEGIN;\n T4                                              UPDATE account SET balance=200 WHERE id=1;\n T5                                              COMMIT;\n T6    SELECT balance FROM account WHERE id=1;   -- 返回 ?\n T7    COMMIT;", "options": [{"k": "A", "t": "100、100；RC 下同一事务内两次读结果一定一致，不存在异常"}, {"k": "B", "t": "100、200；这是「不可重复读」，RC 级别允许该现象，升到 RR 可避免"}, {"k": "C", "t": "200、200；RC 会让 A 读到 B 尚未提交的最新值"}, {"k": "D", "t": "100、200；这是「脏读」，说明 RC 无法阻止脏读"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 数据库与ORM层 - 事务隔离级别。三类读异常：<b>脏读</b>=读到别的事务<b>未提交</b>的数据；<b>不可重复读</b>=同一事务内两次读<b>同一行</b>结果不同（被别的事务 UPDATE 并提交）；<b>幻读</b>=同一事务内两次<b>范围查询</b>返回的行数不同（被别的事务 INSERT）。RC 在<b>每次 SELECT 时都重新生成 ReadView</b>，所以 T2 读 100、B 提交后 T6 读 200，属于不可重复读；RR 只在事务首次快照读时生成 ReadView 并全程复用，两次都读 100。C 错：RC 只读已提交数据，T5 之前看不到 200；D 错：B 已经提交了，不是脏读，且 RC 本身就能阻止脏读（只有 READ UNCOMMITTED 才有脏读）。", "android": "像两次从 SharedPreferences 读同一个 key，中间被别的线程改掉了值；要保证整段流程看到一致快照，就得先把值取到局部变量里（相当于 RR 的一次性快照）。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 事务隔离级别"}, {"no": 6, "type": "single", "body": "RR 隔离级别下，事务 A 对<b>非唯一索引</b>做了等值加锁查询。此时另一会话执行下列语句，<code>会被阻塞</code>的是？", "code": "-- 表 t(id PK, name, KEY idx_name(name))，非唯一索引\n-- 现有数据（按 name 排序）：('a', id=1)  ('c', id=5)  ('f', id=10)\n-- 隔离级别 REPEATABLE READ\n\n-- 事务A（未提交）\nBEGIN;\nSELECT * FROM t WHERE name = 'c' FOR UPDATE;", "options": [{"k": "A", "t": "INSERT INTO t(id, name) VALUES (20, 'g');"}, {"k": "B", "t": "SELECT * FROM t WHERE name = 'c';   -- 普通快照读"}, {"k": "C", "t": "INSERT INTO t(id, name) VALUES (21, 'd');"}, {"k": "D", "t": "SELECT id FROM t WHERE name = 'z';   -- 普通快照读，且值不存在"}], "answer": ["C"], "explain": "考点：AI 后端能力 - 数据库与ORM层 - 锁机制（Next-Key Lock）。RR 下对<b>非唯一索引</b>做等值当前读（FOR UPDATE），InnoDB 为了防止幻读会加：①命中记录的 Next-Key Lock <code>('a','c']</code>；②向右继续探测到下一条不满足条件的记录，对右侧间隙加 Gap Lock <code>('c','f')</code>。所以任何试图插入 name 落在 ('a','f') 这段开区间内的语句都会被间隙锁阻塞——C 的 'd' 正好落在 ('c','f') 中，被阻塞。A 的 'g' 在 'f' 之后，不在锁定范围内；B、D 是<b>快照读</b>，走 MVCC 读 undo 版本链，不加锁也不会被阻塞（这正是 InnoDB「读写不冲突」的关键）。若换成唯一索引等值且记录存在，Next-Key Lock 会退化为仅 Record Lock，不会锁间隙。", "android": "类比给 RecyclerView 的一段区间加了「禁止插入」的编辑锁：不仅锁住了命中的那一行，连它前后的空位也不许插入新条目，避免同一次滚动里数量突然变多。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 锁机制"}, {"no": 7, "type": "single", "body": "线上库存扣减接口偶发报错 <code>Deadlock found when trying to get lock</code>，执行 SHOW ENGINE INNODB STATUS 得到如下片段。根本原因与最有效的改法是？", "code": "------------------------\nLATEST DETECTED DEADLOCK\n------------------------\n*** (1) TRANSACTION:\nTRANSACTION 4231, ACTIVE 6 sec starting index read\nUPDATE t_stock SET num = num - 1 WHERE id = 2\n*** (1) HOLDS THE LOCK(S):\nRECORD LOCKS space id 58 index PRIMARY of table `shop`.`t_stock` trx id 4231 lock_mode X locks rec but not gap  (id=1)\n*** (1) WAITING FOR THIS LOCK TO BE GRANTED:\nRECORD LOCKS space id 58 index PRIMARY of table `shop`.`t_stock` trx id 4231 lock_mode X locks rec but not gap waiting  (id=2)\n\n*** (2) TRANSACTION:\nTRANSACTION 4232, ACTIVE 4 sec starting index read\nUPDATE t_stock SET num = num - 1 WHERE id = 1\n*** (2) HOLDS THE LOCK(S):\nRECORD LOCKS ... trx id 4232 lock_mode X locks rec but not gap  (id=2)\n*** (2) WAITING FOR THIS LOCK TO BE GRANTED:\nRECORD LOCKS ... trx id 4232 lock_mode X locks rec but not gap waiting  (id=1)\n*** WE ROLL BACK TRANSACTION (2)", "options": [{"k": "A", "t": "两个事务对同一批行的加锁顺序相反（一个 1→2，一个 2→1）形成循环等待；应统一按主键升序排序后再逐行加锁，并缩短事务、捕获 1213 重试"}, {"k": "B", "t": "调大 innodb_lock_wait_timeout 即可解决死锁"}, {"k": "C", "t": "把隔离级别降到 READ UNCOMMITTED 就不会再发生死锁"}, {"k": "D", "t": "该日志说明 InnoDB 无法自行检测死锁，必须人工 kill 掉其中一个连接"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 数据库与ORM层 - 死锁。日志清楚显示：trx 4231 持有 id=1 的 X 锁并等待 id=2，trx 4232 持有 id=2 并等待 id=1，构成典型的循环等待。<b>根治办法是打破「环路等待」这一必要条件：让所有事务按同一顺序（如主键升序）加锁</b>，批量扣减时先对 id 集合 sort 再执行；同时缩小事务范围、走索引减少锁行数、业务层捕获 SQLState 40001 / errno 1213 做幂等重试。B 错：innodb_lock_wait_timeout 只影响锁等待超时（报 1205），循环等待依然存在；C 错：写-写行锁的冲突与隔离级别无关，降级并不能消除死锁（只会减少间隙锁类死锁）；D 错：<code>WE ROLL BACK TRANSACTION (2)</code> 正是 InnoDB 死锁检测（wait-for graph）自动回滚 undo 量较小事务的输出。", "android": "和 Android 多线程里两把锁 A/B 被两个线程反向持有导致 ANR 一模一样，解法同样是「全局统一锁顺序」。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 死锁"}, {"no": 8, "type": "single", "body": "运维在排查 Redis 内存时观察到如下命令序列。对这一现象的正确解释是？", "code": "127.0.0.1:6379> SET session:1001 \"token-abc\" EX 5\nOK\n127.0.0.1:6379> DBSIZE\n(integer) 1\n\n# 等待 10 秒，期间没有任何客户端访问 session:1001\n127.0.0.1:6379> DBSIZE\n(integer) 1        # 仍然是 1，内存也没释放\n127.0.0.1:6379> GET session:1001\n(nil)\n127.0.0.1:6379> DBSIZE\n(integer) 0", "options": [{"k": "A", "t": "Redis 用定时器在 key 到期的那一刻精确删除，DBSIZE 返回 1 是客户端本地缓存导致的假象"}, {"k": "B", "t": "说明 EX 5 没有生效，Redis 的 EX 只是一个建议值，不保证过期"}, {"k": "C", "t": "GET 返回 nil 是因为上一条 DBSIZE 命令触发了删除，与过期策略无关"}, {"k": "D", "t": "Redis 采用「惰性删除 + 定期抽样删除」：逻辑过期的 key 不一定被立刻清理，可能仍占内存并被 DBSIZE 统计到；但任何读命令都会先判断过期直接返回 nil，并顺手删除该 key"}], "answer": ["D"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Redis 过期策略。理论上有三种过期删除策略：<b>定时删除</b>（到点即删，内存友好但 CPU 开销大）、<b>惰性删除</b>（访问时才判断，CPU 友好但内存不友好）、<b>定期删除</b>（周期性抽样折中）。Redis 实际组合使用<b>惰性删除 + 定期删除</b>：serverCron 每秒执行 hz（默认 10）次，每次从设置了过期时间的字典中<b>随机抽样 20 个</b> key 删掉已过期的，若过期比例超过 25% 就再来一轮。因此「key 逻辑上过期了但内存还没释放、DBSIZE 还统计得到」是完全正常的；但读取一定不会读到过期数据（惰性删除保证语义正确）。这也是必须配合 maxmemory + 淘汰策略兜底的原因；主从架构下从库不主动删过期 key，而是等主库的 DEL 传播，读从库时由过期判断保证不返回过期值。", "android": "类似 DiskLruCache：条目「逻辑过期」不代表磁盘空间立刻回收，通常等下一次 get 判断或 trimToSize 才真正清理。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 过期策略"}, {"no": 9, "type": "single", "body": "下面是商品详情的缓存读取代码。某爆款商品的 key 到期瞬间，DB 的 QPS 从 200 飙升到 12000、接口大面积超时。该现象的名称与最合适的修复方案是？", "code": "public Product getProduct(Long id) {\n    String key = \"product:\" + id;\n    String json = redis.opsForValue().get(key);\n    if (json != null) {\n        return JSON.parseObject(json, Product.class);\n    }\n    // 缓存未命中：所有线程都会走到这里，直接压到 DB\n    Product p = productMapper.selectById(id);\n    if (p != null) {\n        redis.opsForValue().set(key, JSON.toJSONString(p), 30, TimeUnit.MINUTES);\n    }\n    return p;\n}", "options": [{"k": "A", "t": "缓存穿透；给不存在的 id 缓存空值（或加布隆过滤器）即可解决"}, {"k": "B", "t": "缓存雪崩；把所有 key 的过期时间设置成完全一致即可解决"}, {"k": "C", "t": "缓存击穿（热点 key 失效）；用互斥锁 / 单飞让同一 key 只放一个线程回源重建，其余线程等待复用；或对热点 key 采用「逻辑过期 + 异步重建」不设物理 TTL"}, {"k": "D", "t": "内存淘汰问题；把 maxmemory-policy 改成 allkeys-random 即可"}], "answer": ["C"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 缓存击穿。三个易混概念：<b>穿透</b>=请求的数据在 DB 里根本不存在，缓存永远无法命中，恶意刷 id 时直击 DB（解法：缓存空值并设短 TTL、布隆过滤器、参数校验）；<b>击穿</b>=某个<b>热点 key</b> 恰好过期的瞬间，海量并发同时回源压垮 DB（解法：互斥锁/单飞重建、逻辑过期异步刷新、热点数据不过期）；<b>雪崩</b>=<b>大批 key</b> 同一时刻集中失效或 Redis 实例宕机（解法：TTL 随机抖动、多级缓存、集群高可用、限流降级）。本题商品是存在的、平时命中率很高，只在到期瞬间出事，是典型击穿。B 恰好说反了——「过期时间完全一致」正是雪崩的成因。", "android": "像 App 内多个页面同时发现 token 过期，一起去刷新 token；正确做法是加一个「单飞」锁，只放一个请求去刷新，其余挂起等待复用结果。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存击穿"}, {"no": 10, "type": "single", "body": "下面两种 Redisson 加锁写法，在「业务实际耗时 25 秒」的情况下表现分别是？", "code": "RLock lock = redissonClient.getLock(\"lock:order:1001\");\n\n// ① 不传 leaseTime\nlock.lock();\ntry {\n    Thread.sleep(25_000);   // 业务执行 25 秒\n    orderService.handle();\n} finally {\n    lock.unlock();\n}\n\n// ② 传了 leaseTime = 10 秒\n// lock.lock(10, TimeUnit.SECONDS);\n// try { Thread.sleep(25_000); orderService.handle(); }\n// finally { lock.unlock(); }", "options": [{"k": "A", "t": "① 由 watchdog 看门狗持续续期（默认 30s，每 10s 续一次）直到 unlock，业务安全；② 指定了 leaseTime 后不再续期，第 10 秒锁自动到期，其他线程可能同时进入临界区"}, {"k": "B", "t": "①② 都会在 30 秒后自动释放，行为完全一致"}, {"k": "C", "t": "① 会永久不释放造成死锁，② 才是唯一正确的写法"}, {"k": "D", "t": "①② 都会立即抛出 IllegalMonitorStateException"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 分布式锁。Redisson 的 <b>watchdog 只在「未指定 leaseTime」时生效</b>：<code>lock()</code> 内部 leaseTime=-1，加锁成功后注册定时任务，每 <code>lockWatchdogTimeout / 3</code>（默认 30s/3=10s）把锁的 TTL 重置回 30s，直到显式 unlock 或客户端进程宕机（宕机后最多 30 秒自动释放，所以 C 说的「永久死锁」不成立）。一旦显式传了 leaseTime（写法②），Redisson 认为使用方自行管控时长，<b>不再续期</b>，10 秒后锁到期释放，而业务还在跑，别的线程就能拿到同一把锁——这是分布式锁「锁提前失效导致临界区并发」的经典事故；此时②的 finally 里 unlock 还可能因为锁已不属于当前线程而抛 IllegalMonitorStateException。工程建议：能预估耗时就设置足够大的 leaseTime + 业务幂等兜底，不能预估就用 lock() 依赖看门狗。", "android": "像 Android 的 WakeLock：acquire() 不带超时需要自己 release；acquire(timeout) 到点系统强制回收，业务没跑完被回收就要自己兜底。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 分布式锁"}, {"no": 11, "type": "single", "body": "下面这段 Lua 脚本通过 <code>EVAL</code> 提交给 Redis 执行。它实现的是哪种限流算法，选用 ZSet 的理由是什么？", "code": "-- KEYS[1]=限流key  ARGV[1]=当前毫秒时间戳  ARGV[2]=窗口大小(ms)  ARGV[3]=阈值\nredis.call('ZREMRANGEBYSCORE', KEYS[1], 0, ARGV[1] - ARGV[2])\nlocal cnt = redis.call('ZCARD', KEYS[1])\nif tonumber(cnt) < tonumber(ARGV[3]) then\n    redis.call('ZADD', KEYS[1], ARGV[1], ARGV[1] .. '-' .. math.random(100000))\n    redis.call('PEXPIRE', KEYS[1], ARGV[2])\n    return 1\nend\nreturn 0", "options": [{"k": "A", "t": "固定窗口计数器；ZSet 在这里只是用来存一个计数值"}, {"k": "B", "t": "滑动窗口限流；以请求时间戳为 score，ZREMRANGEBYSCORE 淘汰窗口外的记录、ZCARD 统计窗口内请求数，天然消除了固定窗口的临界突刺问题"}, {"k": "C", "t": "令牌桶限流；ZSet 中的每个 member 代表一个可用令牌，ZCARD 就是剩余令牌数"}, {"k": "D", "t": "漏桶限流；PEXPIRE 用来控制桶的匀速漏水速率"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 限流算法。脚本的语义是：先把「当前时间 - 窗口大小」之前的所有记录移除（滑出窗口），再数一数窗口内还剩多少条请求记录，没超阈值就把本次请求的时间戳作为 score 记进去。这是<b>滑动窗口（滑动日志）限流</b>的标准实现。ZSet 的价值在于 score 有序，可以 O(logN) 按分值区间批量删除。注意两个细节：①member 必须唯一，所以拼了随机数，否则同一毫秒的多次请求会被 ZADD 覆盖成一条导致漏放；②整段逻辑放在 Lua 中执行是为了保证「清理-统计-写入」的原子性。局限：需要为每个请求存一条记录，超大流量下内存占用远高于计数器，这类场景更适合令牌桶（Redisson RRateLimiter）或直接在网关层（Sentinel/Nginx）限流。", "android": "类似客户端做「60 秒内最多发 5 条验证码」的本地防刷：维护一个按时间排序的队列，每次先丢掉 60 秒前的记录，再看队列长度。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 限流算法"}, {"no": 12, "type": "single", "body": "「附近的门店」功能用 Redis GEO 实现，执行了如下命令。关于 Redis GEO，说法正确的是？", "code": "> GEOADD shops:bj 116.404 39.915 \"s1001\" 116.418 39.921 \"s1002\" 116.310 39.990 \"s1003\"\n(integer) 3\n\n> GEOSEARCH shops:bj FROMLONLAT 116.405 39.916 BYRADIUS 3 km ASC WITHDIST\n1) 1) \"s1001\"\n   2) \"0.1421\"\n2) 1) \"s1002\"\n   2) \"1.2437\"\n\n> TYPE shops:bj\n?", "options": [{"k": "A", "t": "TYPE 返回 geo，GEO 是 Redis 独立于五大类型之外的第六种底层数据结构"}, {"k": "B", "t": "GEO 类型的 key 不支持设置过期时间，只能手动 DEL"}, {"k": "C", "t": "GEOSEARCH 只能返回成员名，无法同时返回距离或坐标"}, {"k": "D", "t": "TYPE 返回 zset：GEO 底层就是 ZSet，把经纬度用 GeoHash 编码成 52 位整数当作 score，GEOSEARCH 本质是 ZSet 的分值范围查询；ASC WITHDIST 表示按距离升序返回并附带距离值"}], "answer": ["D"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Redis 数据结构选型。Redis 对外暴露的 GEO 命令没有新增底层类型，<b>GEOADD 内部等价于 ZADD</b>：把经纬度通过 GeoHash 交叉编码成一个 52 位整数作为 score，所以 TYPE 返回 zset，还能直接用 ZREM 删成员、ZCARD 统计数量、EXPIRE 设过期（B 错）。GEOSEARCH（6.2+，取代了废弃的 GEORADIUS）支持 WITHDIST / WITHCOORD / WITHHASH 三个可选返回项以及 COUNT、ASC/DESC（C 错）。实战注意：一个城市一个 key 容易形成大 key，应按城市/区域拆分；GeoHash 存在边界问题，Redis 内部已通过检索相邻 9 个格子来规避。", "android": "和客户端做「附近的人」思路一致：先用 GeoHash 前缀粗筛格子，再算精确距离排序，只不过 Redis 把这套编码 + 有序检索封装好了。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 数据结构选型"}, {"no": 13, "type": "single", "body": "下单接口用「一次性 Token」做防重复提交。这段实现在高并发重复提交下存在什么问题，应如何修复？", "code": "// 前端提交前先 GET /api/token 拿到一次性 token，提交时放在请求头里\n@PostMapping(\"/order/submit\")\npublic Result submit(@RequestHeader(\"Idem-Token\") String token,\n                     @RequestBody OrderDTO dto) {\n    String key = \"idem:\" + token;\n    if (Boolean.FALSE.equals(redis.hasKey(key))) {   // ① 校验 token 是否存在\n        return Result.fail(\"请勿重复提交\");\n    }\n    redis.delete(key);                               // ② 删除 token\n    return Result.ok(orderService.create(dto));      // ③ 创建订单\n}", "options": [{"k": "A", "t": "没有问题，Redis 是单线程执行命令，已经保证了整段逻辑的原子性"}, {"k": "B", "t": "把 delete 挪到方法最开头执行就能彻底解决"}, {"k": "C", "t": "①② 两步不是原子操作：两个线程可能都通过了 hasKey 判断后才各自 delete，导致重复下单；应用 Lua 脚本（或直接用 delete 的返回值 / GETDEL）把「校验 + 删除」合并成一个原子操作，以删除成功者为准"}, {"k": "D", "t": "只要给 submit 方法加上 @Transactional 就能保证幂等"}], "answer": ["C"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 幂等设计。幂等 Token 的核心是「取令牌」这一步必须原子。<b>Redis 单线程保证的是单条命令的原子性，跨命令的 check-then-act 依然存在竞态</b>：两个并发请求可能都看到 key 存在，随后都执行 delete、都创建订单。正确写法有三种：①<code>Long n = redis.delete(key); if (n == null || n == 0) return fail;</code> —— DEL 返回实际删除数量，只有拿到 1 的线程有资格继续；②Lua：<code>if redis.call('get', KEYS[1]) then return redis.call('del', KEYS[1]) else return 0 end</code>；③Redis 6.2+ 的 GETDEL。B 错：单纯挪位置而不校验返回值仍然不幂等；D 错：数据库事务解决不了跨请求的重复提交，最终还应有 order_no 唯一索引做兜底。", "android": "相当于防连点：<code>if (!clicked) { clicked = true; ... }</code> 在多线程下必须换成 AtomicBoolean.compareAndSet；Lua / DEL 返回值就是分布式版的 CAS。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 幂等设计"}, {"no": 14, "type": "single", "body": "评审下面这张订单明细表结构（联合主键 order_id + product_id）。它主要违反了第几范式？", "code": "CREATE TABLE t_order_item (\n  order_id     BIGINT        NOT NULL,\n  product_id   BIGINT        NOT NULL,\n  order_time   DATETIME      NOT NULL,   -- 只由 order_id 决定\n  product_name VARCHAR(64)   NOT NULL,   -- 只由 product_id 决定\n  quantity     INT           NOT NULL,\n  price        DECIMAL(10,2) NOT NULL,\n  PRIMARY KEY (order_id, product_id)\n);", "options": [{"k": "A", "t": "第二范式（2NF）：order_time 只依赖 order_id、product_name 只依赖 product_id，都是对联合主键的「部分函数依赖」"}, {"k": "B", "t": "第一范式（1NF），因为表中存在可再分的重复列"}, {"k": "C", "t": "第三范式（3NF），因为存在 A→B→C 形式的传递依赖"}, {"k": "D", "t": "完全符合三大范式，无需任何调整"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 数据库与ORM层 - 数据库设计范式。<b>1NF</b>：每列都是不可再分的原子值（本表满足）；<b>2NF</b>：在 1NF 基础上，所有非主属性必须<b>完全依赖</b>于候选键，不能只依赖联合主键的一部分——order_time 仅由 order_id 决定、product_name 仅由 product_id 决定，正是典型的「部分函数依赖」，违反 2NF，会带来更新异常（改商品名要扫全表）和插入异常；<b>3NF</b>：非主属性之间不能存在传递依赖（如同表内同时存 province_id 和 province_name）。修复：order_time 归入 t_order，product_name 归入 t_product。补充：互联网业务常刻意反范式冗余（订单快照冗余下单时的商品名与价格），那是「用空间和一致性成本换查询性能」的<b>有意设计</b>，与本题这种无意识的部分依赖是两回事。", "android": "类似 Room 建表把用户昵称冗余进每条消息：改昵称就得全表刷新——除非你要的恰恰是「发送那一刻的快照」。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 数据库设计范式"}, {"no": 15, "type": "single", "body": "下面的 Flex 布局中，容器固定 600px。三个子元素最终渲染宽度分别是多少？", "code": "<div class=\"box\">\n  <div class=\"a\">A</div>\n  <div class=\"b\">B</div>\n  <div class=\"c\">C</div>\n</div>\n\n<style>\n.box { display: flex; width: 600px; }\n.a { flex: 1 1 100px; }\n.b { flex: 2 1 100px; }\n.c { flex: 0 1 200px; }\n</style>", "options": [{"k": "A", "t": "A=200px，B=200px，C=200px（容器宽度三等分）"}, {"k": "B", "t": "A=100px，B=100px，C=200px，右侧剩余 200px 留白"}, {"k": "C", "t": "A≈166.67px，B≈233.33px，C=200px"}, {"k": "D", "t": "A=150px，B=250px，C=200px"}], "answer": ["C"], "explain": "考点：AI 前端能力 - 前端基础与渲染引擎 - Flex 布局。<code>flex</code> 是 <code>flex-grow flex-shrink flex-basis</code> 的简写。计算分三步：①先按 flex-basis 排布，占 100+100+200=400px；②容器 600px，<b>剩余空间 = 600 − 400 = 200px</b>；③按 grow 权重分配剩余空间，权重和 = 1+2+0 = 3，A 得 200×1/3≈66.67 → 最终 ≈166.67px，B 得 200×2/3≈133.33 → 最终 ≈233.33px，C 的 grow=0 不参与放大，保持 200px。B 选项只有在所有子项 grow 都为 0 时才成立。反之若子项 basis 之和超过容器，则改由 flex-shrink 起作用，且收缩量要按 <code>shrink × basis</code> 的加权比例分配（这是 shrink 与 grow 算法的关键差异）。", "android": "对应 LinearLayout 的 layout_weight：先按 layout_width 占位，再按 weight 分配剩余空间——flex-basis ≈ layout_width，flex-grow ≈ weight。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - Flex 布局"}, {"no": 16, "type": "single", "body": "开发给容器加上 <code>transform: translateZ(0)</code> 开启 GPU 加速后，原本全屏的弹窗突然错位了。下面代码中 <code>.dialog</code> 的实际定位表现是？", "code": "<div class=\"wrap\">\n  <div class=\"dialog\">我是弹窗</div>\n</div>\n\n<style>\n.wrap   { width: 300px; height: 300px; margin: 100px;\n          transform: translateZ(0); }\n.dialog { position: fixed; top: 0; left: 0;\n          width: 100%; height: 100%; background: rgba(0,0,0,.6); }\n</style>", "options": [{"k": "A", "t": "相对浏览器视口铺满全屏，符合 position:fixed 的预期"}, {"k": "B", "t": "transform 只影响绘制阶段，对定位没有任何影响，渲染结果与不加时一致"}, {"k": "C", "t": "相对 <body> 定位，铺满整个文档流"}, {"k": "D", "t": "相对 .wrap 定位并只铺满 .wrap 的 300×300 区域，因为祖先的 transform 使其成为 fixed 元素的「包含块」"}], "answer": ["D"], "explain": "考点：AI 前端能力 - 前端基础与渲染引擎 - 定位与包含块。CSS 规范规定：当祖先元素的 <code>transform</code> / <code>filter</code> / <code>perspective</code> / <code>backdrop-filter</code> / <code>will-change</code>（含 contain:paint）不为 none 时，<b>该祖先会成为其后代中 position:fixed（以及 absolute）元素的包含块</b>，fixed 不再相对视口定位。本例 .dialog 的 100% 因此参照 .wrap 的 300×300，弹窗只覆盖了一小块。这就是「加了 translateZ(0) 硬件加速后，全屏遮罩 / 吸底按钮突然错位」的经典事故。解决：把弹窗用 Vue 的 <code>&lt;Teleport to=\"body\"&gt;</code>（或原生 appendChild 到 body）移出该祖先，或去掉祖先的 transform。附带影响：transform 同时会创建<b>层叠上下文</b>，导致内部 z-index 无法再与外部元素比较大小。", "android": "类似给父 ViewGroup 设了 scaleX/translationY，子 View 的坐标系整体跟着变；要真正盖住全屏只能用 Dialog / WindowManager 挂到 DecorView，本质就是 Web 的 Teleport to=\"body\"。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - 定位与包含块"}, {"no": 17, "type": "single", "body": "响应式卡片墙用了 <code>repeat(auto-fill, minmax(200px, 1fr))</code>。若把 <code>auto-fill</code> 换成 <code>auto-fit</code>，两者的渲染差异是？", "code": "<div class=\"grid\">\n  <div>1</div>\n  <div>2</div>\n</div>\n\n<style>\n.grid {\n  display: grid;\n  width: 1000px;\n  gap: 0;\n  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));\n}\n</style>\n<!-- 容器 1000px，但只有 2 个子项 -->", "options": [{"k": "A", "t": "auto-fill 会创建 5 条 200px 轨道并保留 3 条空轨道，两个子项各 200px、左对齐；auto-fit 会把空轨道折叠为 0 宽，剩余空间由 2 个子项均分，各 500px"}, {"k": "B", "t": "两者完全一样，auto-fit 只是 auto-fill 的别名写法"}, {"k": "C", "t": "auto-fill 下子项各 500px，auto-fit 下各 200px"}, {"k": "D", "t": "auto-fit 会强制子项换行，每行只显示一个"}], "answer": ["A"], "explain": "考点：AI 前端能力 - 前端基础与渲染引擎 - Grid 布局。<code>repeat(auto-fill | auto-fit, minmax(200px, 1fr))</code> 都会先根据容器宽度尽可能多地创建轨道：1000 / 200 = 5 条。二者的唯一区别在于<b>如何处理没有内容的空轨道</b>：<code>auto-fill</code> 保留空轨道，它们仍参与 1fr 的空间分配，所以实际子项停在 200px；<code>auto-fit</code> 把空轨道<b>折叠为 0 宽</b>，1fr 于是把全部可用空间分给真实存在的 2 个子项，各 500px。选型经验：希望「卡片保持固定宽度、不足一行时左对齐不被拉伸」用 auto-fill；希望「无论几张卡片都铺满整行」用 auto-fit。", "android": "类似 GridLayoutManager 固定 spanCount（auto-fill，位置空着也占格）与 FlexboxLayoutManager 按权重撑满（auto-fit）的差别。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - Grid 布局"}, {"no": 18, "type": "single", "body": "抓包得到静态资源的两次请求与响应如下。关于这次<code>缓存交互</code>，描述正确的是？", "code": "# 第一次请求\nGET /static/app.a1b2c3.js HTTP/1.1\n\nHTTP/1.1 200 OK\nCache-Control: no-cache\nETag: \"9f8a7b\"\nLast-Modified: Tue, 04 Aug 2026 02:00:00 GMT\nContent-Length: 128340\n\n# 刷新页面后第二次请求\nGET /static/app.a1b2c3.js HTTP/1.1\nIf-None-Match: \"9f8a7b\"\nIf-Modified-Since: Tue, 04 Aug 2026 02:00:00 GMT\n\nHTTP/1.1 304 Not Modified\nETag: \"9f8a7b\"", "options": [{"k": "A", "t": "Cache-Control: no-cache 表示完全不缓存，浏览器每次都必须重新下载完整文件"}, {"k": "B", "t": "no-cache 表示「可以缓存，但每次使用前必须回源校验」；命中协商缓存时服务端返回 304 且响应体为空，浏览器复用本地副本——省下的是 128KB 传输量，而不是这一次请求往返"}, {"k": "C", "t": "304 响应同样会携带完整的 Content-Length 与文件内容，只是状态码不同"}, {"k": "D", "t": "服务端同时返回 ETag 和 Last-Modified 时，浏览器与服务端都优先以 Last-Modified 为准"}], "answer": ["B"], "explain": "考点：AI 前端能力 - 工程化与网络 - HTTP 缓存。<b>no-store</b> 才是「完全不缓存」；<b>no-cache</b> 是「允许缓存但每次使用前必须发条件请求做协商」。协商缓存的一对头是 <code>ETag / If-None-Match</code>（内容指纹，优先级更高）与 <code>Last-Modified / If-Modified-Since</code>（时间戳，精度只到秒，且内容未变但 mtime 变了会误判），服务端两者都返回时浏览器两个条件头都带上，<b>服务端以 ETag 为准</b>（D 错）。304 响应不含响应体（C 错），因此节省了 128KB 流量，但这一次 HTTP 往返（RTT）依然发生了。真正想「连请求都不发」必须使用强缓存：<code>Cache-Control: max-age=31536000, immutable</code> 配合文件名哈希（如 app.a1b2c3.js），这也是 Vite/Webpack 产物带 hash 的意义。", "android": "对应 OkHttp 的缓存拦截器：命中条件缓存时发条件请求拿 304 再读磁盘缓存；想彻底不发请求要用 CacheControl.FORCE_CACHE / maxAge。", "kaodian": "AI 前端能力 - 工程化与网络 - HTTP 缓存"}, {"no": 19, "type": "single", "body": "下面是订单查询接口的 JMeter 压测报告（稳定阶段）。该接口的理论 TPS 约为多少，这组数据应如何解读？", "code": "JMeter 压测报告（订单查询接口，稳定阶段 60s）：\n  线程数（并发用户）      : 50\n  平均响应时间 avg RT     : 200 ms\n  90% 响应时间  P90       : 260 ms\n  99% 响应时间  P99       : 1500 ms\n  错误率 error%           : 0.00%\n  Think Time              : 0", "options": [{"k": "A", "t": "TPS ≈ 50，并发用户数就等于 TPS"}, {"k": "B", "t": "TPS ≈ 0.2，用「平均RT / 并发数」计算"}, {"k": "C", "t": "TPS ≈ 10000，用「并发数 × 平均RT(ms)」计算"}, {"k": "D", "t": "TPS ≈ 250：由利特尔法则「并发数 = TPS × 平均响应时间」推得 TPS = 50 / 0.2s；同时 P99 高达 1500ms 远离均值，说明存在长尾请求，不能只看平均 RT"}], "answer": ["D"], "explain": "考点：AI 质量保障 - 软件测试理论与质量体系 - 性能测试指标。利特尔法则（Little's Law）：<b>并发数 = TPS × 平均响应时间</b>（think time 为 0 时），因此 TPS = 50 / 0.2s = 250。解读要点：①<b>平均值会掩盖问题</b>，必须看 P90/P95/P99 分位——本例均值 200ms 但 P99 达 1500ms，说明存在长尾（常见诱因：Full GC、慢 SQL、连接池等待、缓存未命中回源），用户侧的真实体感由分位值决定；②TPS 与 RT 相互制约，压测的目标是找<b>容量拐点</b>——TPS 不再上升而 RT 陡增的那个并发数；③错误率与服务端资源水位（CPU/内存/IO/连接数）必须同时采集，否则脱离成功率与稳定性谈 TPS 没有意义。", "android": "类比帧率：平均 60fps 不代表流畅，真正的卡顿藏在掉帧的那 1%（P99 帧耗时）里——只看 avg RT 会漏掉长尾，道理完全一致。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 性能测试指标"}, {"no": 20, "type": "single", "body": "下面是用户详情接口的 Postman 断言脚本。这段断言的主要问题是？", "code": "// Postman Tests（GET /api/user/1001）\npm.test(\"接口返回正确\", function () {\n    pm.response.to.have.status(200);\n    pm.expect(pm.response.json()).to.eql({\n        code: 0,\n        message: \"success\",\n        data: {\n            id: 1001,\n            name: \"张三\",\n            loginTime: \"2026-08-05 10:30:00\",\n            token: \"eyJhbGciOiJIUzI1NiJ9.xxx\"\n        }\n    });\n});", "options": [{"k": "A", "t": "没有问题，响应体全量比对是最严格的断言方式，属于最佳实践"}, {"k": "B", "t": "断言过强，正确做法是只保留 pm.response.to.have.status(200)，其余一律不断言"}, {"k": "C", "t": "断言过强且脆弱：把 loginTime、token 这类每次都变化的动态字段也纳入了全等比对，用例会频繁误报；应分层断言——HTTP 状态码 + 业务 code + 关键业务字段精确值，动态字段只校验存在性/类型/格式（或用 JSON Schema 校验结构）"}, {"k": "D", "t": "问题在于用了 to.eql，对象比较应该改成 to.be 做引用相等判断"}], "answer": ["C"], "explain": "考点：AI 质量保障 - 自动化测试与工具 - 接口断言设计。断言设计要在<b>强度</b>与<b>稳定性</b>之间取平衡。过弱（只判 HTTP 200，即 B）会漏掉「HTTP 200 但 body 里 code=500」的业务失败；过强（全量 eql）会因时间戳、token、自增 id、列表顺序等非确定字段频繁误报，维护成本高，最终导致团队对红灯麻木、失去信号价值。推荐分层：①协议层——HTTP 状态码；②业务层——响应体的 code / message；③数据层——关键业务字段精确断言，动态字段用 <code>to.have.property</code>、typeof、正则或 JSON Schema 校验类型与格式；④必要时补充数据库/缓存的落库校验，防止「接口返回成功但没真正写库」。D 错：chai 中 <code>to.be</code> 只是语言链而非引用比较，深比较对象本就应该用 eql。", "android": "类似 UI 自动化里断言整屏截图 —— 只要有个动图或时间控件变化就挂；不如断言关键控件的文本和可见性来得稳定。", "kaodian": "AI 质量保障 - 自动化测试与工具 - 接口断言设计"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "某平台要用 Redis 支撑下面 4 个功能，下列「结构选型 + 命令」组合正确的有？（多选、少选、错选均不得分）", "code": "① 用户资料缓存，需要单独更新某个字段（如只改 nickname，不动其他字段）\n② 商品详情页「我最近浏览的 10 个商品」，要求去重、按浏览时间倒序\n③ 抽奖：从 10 万参与用户中随机抽出 3 个不重复的中奖者\n④ 直播间实时积分排行榜，取 TOP10 并显示分数", "options": [{"k": "A", "t": "① 用 Hash：HSET user:1 nickname \"x\" / HGET user:1 nickname，可单字段读写，比整个对象序列化成 String 再整存整取更省带宽和 CPU"}, {"k": "B", "t": "② 用 List：LPUSH + LTRIM key 0 9 即可同时满足「去重」和「按时间倒序」两个要求"}, {"k": "C", "t": "③ 用 Set：SRANDMEMBER key 3 一次性随机取 3 个不重复元素（若要「抽中即移除」则用 SPOP key 3）"}, {"k": "D", "t": "④ 用 ZSet：ZINCRBY key score member 累加积分，ZREVRANGE key 0 9 WITHSCORES 取 TOP10 及分数"}], "answer": ["A", "C", "D"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Redis 数据结构选型。A 正确：Hash 适合存对象且支持字段级读写，还能用 HINCRBY 原子累加；若整体读写频繁且字段少，String+JSON 也可，但改一个字段要整存整取。C 正确：Set 无序不重复，SRANDMEMBER 传正数 count 时返回<b>不重复</b>的随机元素（传负数才可能重复），SPOP 则是取出并移除，对应「抽完不能再中」。D 正确：ZSet 按 score 排序，ZINCRBY 累加、ZREVRANGE ... WITHSCORES 取倒序 TOP N，是排行榜的标准解法。<b>B 错误</b>：List 允许重复元素，LPUSH+LTRIM 只能保证「最近 10 条、时间倒序」，无法去重——重复浏览同一商品会占多个位置；正确做法是先 <code>LREM key 0 商品id</code> 再 LPUSH，或直接用 ZSet 以浏览时间戳为 score（ZADD 天然对同一 member 更新 score 实现去重 + 重排）。补充：若是「统计文章 UV 且允许 0.81% 误差」这类只要基数的场景，应选 HyperLogLog 而非 Set，可省下巨量内存。", "android": "选型思路和客户端选容器一样：要按 key 改字段用 Map（Hash）、要去重用 Set、要排序榜单用 TreeMap/SortedList（ZSet）、要保留插入顺序的历史记录用 LinkedList（List）。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 数据结构选型"}, {"no": 22, "type": "multi", "body": "大促压测发现：凌晨 00:00 整点大批商品缓存集中失效，DB 连接池被瞬间打满。针对下面的现状代码，属于<code>缓存雪崩</code>有效防护手段的有？（多选、少选、错选均不得分）", "code": "// 现状：所有商品缓存统一 30 分钟过期，且都由 00:00 的定时任务批量预热写入\nfor (Product p : products) {\n    redis.opsForValue().set(\"product:\" + p.getId(),\n                            JSON.toJSONString(p),\n                            30, TimeUnit.MINUTES);\n}", "options": [{"k": "A", "t": "把所有缓存都改成永不过期（不设置任何 TTL），从根本上杜绝缓存雪崩"}, {"k": "B", "t": "构建多级缓存：本地 Caffeine（短 TTL）+ Redis（长 TTL），Redis 未命中或抖动时本地缓存仍能扛住一部分读流量"}, {"k": "C", "t": "回源查库时加互斥锁/信号量收敛并发，并配合 Sentinel/Hystrix 做熔断降级与限流，保证 DB 不被瞬时流量打穿"}, {"k": "D", "t": "给 TTL 加随机抖动：set(key, json, 30*60 + ThreadLocalRandom.current().nextInt(600), TimeUnit.SECONDS)，把失效时间点打散到一个区间内"}], "answer": ["B", "C", "D"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 缓存雪崩。雪崩有两类成因：<b>大批 key 同一时刻集中失效</b>（本题）与 <b>Redis 实例整体宕机</b>。D 正确：TTL 随机抖动是成本最低、最直接的解法，把「同一秒失效」摊平到 10 分钟区间。B 正确：多级缓存让请求在 Redis 之前先经过进程内缓存，既降低 Redis 压力也提供了兜底。C 正确：互斥重建收敛回源并发，熔断降级保证极端情况下「返回兜底数据」而不是把 DB 拖死，这是雪崩场景的最后一道防线。<b>A 错误</b>：物理上永不过期会导致内存无限增长，最终触发 maxmemory 淘汰策略被动踢 key（时机与对象都不可控，反而更危险），且数据长期不一致；工程上正确的是<b>「逻辑过期」</b>——value 里带 expireAt 字段，key 本身不设 TTL，读到逻辑过期时异步开线程重建、当前请求先返回旧值。另外针对宕机型雪崩，还应部署 Redis 主从/哨兵/Cluster 保证高可用。", "android": "类似 App 冷启动瞬间所有模块同时请求接口把后端打崩，解法同样是「错峰 + 本地缓存兜底 + 失败降级」，而不是让缓存永不失效。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存雪崩"}, {"no": 23, "type": "multi", "body": "关于下表在 InnoDB 中的<code>索引组织方式</code>，说法正确的有？（多选、少选、错选均不得分）", "code": "CREATE TABLE t_msg (\n  id      BIGINT   NOT NULL AUTO_INCREMENT,\n  uuid    CHAR(36) NOT NULL,\n  content TEXT,\n  PRIMARY KEY (id),\n  UNIQUE KEY uk_uuid (uuid)\n) ENGINE=InnoDB;\n\n-- SELECT content FROM t_msg WHERE uuid = 'a3f1...';", "options": [{"k": "A", "t": "聚簇索引（主键 id）的叶子节点存放的是完整行数据，因此一张表只能有一个聚簇索引"}, {"k": "B", "t": "uk_uuid 的叶子节点存放的是 uuid + 主键 id，所以通过 uuid 查 content 需要先查 uk_uuid 再回聚簇索引回表一次"}, {"k": "C", "t": "如果把主键改成 uuid CHAR(36)，所有二级索引都会因为携带更大的主键值而膨胀，且随机字符串插入会引发频繁页分裂与碎片——这正是推荐使用自增主键的原因"}, {"k": "D", "t": "如果建表时不定义任何主键，InnoDB 就不会建立聚簇索引，该表会退化成堆表（heap table）"}], "answer": ["A", "B", "C"], "explain": "考点：AI 后端能力 - 数据库与ORM层 - 索引结构。A 正确：InnoDB 是索引组织表，数据行就存在聚簇索引的叶子节点上，数据只有一份，所以聚簇索引唯一。B 正确：二级索引（含唯一索引）叶子只存「索引列 + 主键值」，取 content 必须回表；若把查询改成 <code>SELECT id, uuid FROM ...</code> 则命中覆盖索引无需回表。C 正确：这是自增主键的两大理由——①二级索引都要冗余主键值，主键越大索引整体越大、缓存的索引页越少；②自增主键是顺序追加写，总在 B+ 树最右侧插入，页利用率高；随机 UUID 会插到中间位置引发页分裂、产生碎片、降低写入性能（这也是雪花 ID/有序 UUID 存在的意义）。<b>D 错误</b>：InnoDB 永远是索引组织表，无显式主键时会依次寻找<b>第一个非空唯一索引</b>作为聚簇索引（本表就是 uk_uuid），若仍没有则自动生成 6 字节的隐藏列 DB_ROW_ID 建聚簇索引。", "android": "类比 Room 主键选型：用自增 Long 还是 UUID 字符串，直接影响索引体积和插入性能，移动端数据量小感知不明显，服务端千万级表差异巨大。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 索引结构"}, {"no": 24, "type": "multi", "body": "订单库按 <code>user_id % 8</code> 水平分成 8 个库，分片配置与线上 SQL 如下。关于暴露出的问题与对策，正确的有？（多选、少选、错选均不得分）", "code": "rules:\n  - !SHARDING\n    tables:\n      t_order:\n        actualDataNodes: ds_${0..7}.t_order\n        databaseStrategy:\n          standard:\n            shardingColumn: user_id\n            shardingAlgorithmName: mod8\n\n-- 线上出现的三类 SQL：\n-- ① SELECT * FROM t_order WHERE user_id = 10086;\n-- ② SELECT * FROM t_order WHERE order_no = 'NO20260805001';\n-- ③ SELECT * FROM t_order ORDER BY create_at DESC LIMIT 10000, 10;", "options": [{"k": "A", "t": "① 携带分片键，可精确路由到单个库执行，是分库分表下最理想的查询形态"}, {"k": "B", "t": "② 不带分片键，会被广播到 8 个库做全库扫描；可用「基因法」把 user_id 的低位比特嵌入 order_no，或建立 order_no → user_id 的映射表 / ES 二级索引来先定位分片"}, {"k": "C", "t": "分库分表后跨库 JOIN 与跨库事务都能像单库一样直接使用，中间件已经完全屏蔽了分片带来的差异"}, {"k": "D", "t": "③ 深分页在分库分表下需要从每个库各取 10010 条再归并排序，内存与耗时急剧放大；应改用「上一页最后一条的 create_at/id 作游标」的键集分页（keyset pagination）"}], "answer": ["A", "B", "D"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 分库分表。A 正确：带分片键的查询能被路由到唯一分片，性能等同单库，因此<b>分片键的选择要贴合最高频的查询维度</b>。B 正确：非分片键查询会退化为全分片广播（8 次查询 + 归并），QPS 高时会把所有库打满；工业界常用两种解法——基因法（把 user_id 的低 3 位「基因」拼进 order_no，使 order_no 自身可算出分片）、异构索引表/ES 建立「其他维度 → 分片键」的映射。D 正确：分库分表的深分页必须先各库取 offset+limit 条再全局归并，offset 越大代价越恐怖，解法是游标分页或先用覆盖索引查主键再回表。<b>C 错误</b>：分片后跨库 JOIN 通常被禁止或只支持绑定表/广播小表（字典表全库冗余）；跨库事务失去本地事务能力，必须引入 XA、Seata AT/TCC 或本地消息表实现最终一致。此外还有全局唯一 ID（雪花算法）、分布式聚合（COUNT/SUM/GROUP BY 需归并）、扩容再平衡等一系列代价——所以「能不分就不分，先考虑读写分离、归档冷数据」。", "android": "类似客户端按用户分库存 SQLite：只要按 userId 查很快，一旦要按订单号全局搜索，就得把所有库都翻一遍或者另建一张索引表。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 分库分表"}, {"no": 25, "type": "multi", "body": "前端用 Axios 下载后端导出的 Excel，需要读取响应头 <code>Content-Disposition</code> 中的文件名，但拿到的一直是 undefined，而 DevTools 的 Network 面板里明明能看到这个响应头。下列说法正确的有？（多选、少选、错选均不得分）", "code": "// 后端（服务域名 api.demo.com，页面域名 web.demo.com）\nresponse.setHeader(\"Content-Disposition\", \"attachment; filename=order.xlsx\");\nresponse.setHeader(\"Access-Control-Allow-Origin\", \"https://web.demo.com\");\n\n// 前端\nconst res = await axios.get('https://api.demo.com/order/export', { responseType: 'blob' })\nconsole.log(res.headers['content-disposition'])   // undefined", "options": [{"k": "A", "t": "跨域场景下浏览器默认只把 6 个「简单响应头」（Cache-Control、Content-Language、Content-Type、Expires、Last-Modified、Pragma）暴露给 JS，其余响应头即使已经收到也读不到"}, {"k": "B", "t": "只要把 Access-Control-Allow-Origin 的值改成 *，JS 就能读到全部响应头"}, {"k": "C", "t": "Network 面板能看到该响应头，说明浏览器确实收到了完整响应，是 CORS 策略在 JS 访问层做了屏蔽，并非后端没返回——因此排查方向应是响应头暴露配置而不是后端代码"}, {"k": "D", "t": "后端需要额外返回 Access-Control-Expose-Headers: Content-Disposition，前端才能通过 res.headers 读到该响应头"}], "answer": ["A", "C", "D"], "explain": "考点：AI 前端能力 - 工程化与网络 - 跨域与响应头。CORS 对跨域响应有两层控制：<b>能不能拿到响应</b>（由 Access-Control-Allow-Origin 决定）和<b>能拿到哪些响应头</b>（由 Access-Control-Expose-Headers 决定）。A、D 正确：默认只暴露 6 个 CORS-safelisted response headers，自定义头（Content-Disposition、X-Total-Count、X-Trace-Id、Authorization 等）必须由服务端显式列进 Expose-Headers 白名单（可写多个逗号分隔，或用 <code>*</code>，但带凭证请求时 <code>*</code> 无效）。C 正确：这是这类问题最重要的排查心法——<b>Network 看得到 ≠ JS 读得到</b>，浏览器是在把响应交给 JS 之前做的过滤，所以别再去怀疑后端没 set。<b>B 错误</b>：Allow-Origin 只解决「是否允许读取响应体」，与响应头暴露是两件事，改成 * 依然读不到 Content-Disposition（而且带 cookie 的凭证请求下 Allow-Origin 不能为 *）。同理，分页总数走响应头时也必须 expose，否则前端拿不到。", "android": "类似 OkHttp 里 response.header(\"X-Total\") 能随便读——原生 HTTP 客户端没有同源策略这层限制；这是浏览器特有的安全沙箱，转前端时最容易踩。", "kaodian": "AI 前端能力 - 工程化与网络 - 跨域与响应头"}, {"no": 26, "type": "multi", "body": "网关改造涉及下列几种响应。关于这些 <code>HTTP 状态码</code>的语义，说法正确的有？（多选、少选、错选均不得分）", "code": "① HTTP/1.1 301 Moved Permanently   Location: https://new.demo.com/api/user\n② HTTP/1.1 302 Found               Location: /login\n③ HTTP/1.1 307 Temporary Redirect  Location: /api/v2/order\n④ HTTP/1.1 401 Unauthorized\n⑤ HTTP/1.1 403 Forbidden\n⑥ HTTP/1.1 502 Bad Gateway", "options": [{"k": "A", "t": "⑥ 502 表示客户端提交的请求参数有误，应由前端修正参数后重试"}, {"k": "B", "t": "历史上大量客户端在处理 301/302 时会把 POST 改写成 GET 并丢弃请求体；307/308 则明确要求保持原请求方法和请求体不变，因此转发 POST 接口应使用 307/308"}, {"k": "C", "t": "④ 表示「未认证或认证失败」（token 缺失/过期，重新登录可能解决）；⑤ 表示「已认证但无权限」（重复携带同样凭证再试仍会被拒，需换账号或申请授权）"}, {"k": "D", "t": "① 是永久重定向，浏览器会缓存这条跳转记录（下次直接请求新地址）、搜索引擎会做权重转移；② 是临时重定向，不应被长期缓存"}], "answer": ["B", "C", "D"], "explain": "考点：AI 前端能力 - 工程化与网络 - HTTP 状态码。D 正确：301 会被浏览器强缓存（改错了很难回滚，需清缓存或用 302 过渡），SEO 场景用它做域名迁移；302/307 是临时跳转。B 正确：这是 307/308 存在的根本原因——RFC 允许（且历史实现普遍如此）把 301/302 的 POST 降级为 GET，<b>307=临时且保持方法体、308=永久且保持方法体</b>，网关做接口版本转发时必须用它们，否则 POST 请求体会丢失。C 正确：401 是「认证」问题（Authentication，配合 WWW-Authenticate 头，前端拦截器通常在此触发刷新 token 或跳登录页），403 是「授权」问题（Authorization，重试无意义，应提示无权限）。<b>A 错误</b>：502 Bad Gateway 表示网关/代理从上游服务器收到无效响应（上游进程挂了、超时、返回非法报文），属于服务端问题；参数错误应返回 400 Bad Request，语义校验失败常用 422。相关：504 是网关等待上游超时，503 是服务暂不可用（过载/维护）。", "android": "对应 OkHttp 的 followRedirects：客户端自动跟随重定向时，POST 被改成 GET 导致「明明提交了却收不到参数」，Android 端排查网络问题时也常踩这个坑。", "kaodian": "AI 前端能力 - 工程化与网络 - HTTP 状态码"}, {"no": 27, "type": "multi", "body": "对订单创建接口做阶梯加压，得到下面这份压测数据。关于结果分析，正确的有？（多选、少选、错选均不得分）", "code": "并发数   TPS     平均RT     P99 RT    错误率    压测机CPU   服务端CPU\n  50     480     104 ms     260 ms    0%         20%         45%\n 100     920     108 ms     300 ms    0%         35%         70%\n 200    1050     190 ms     900 ms    0%         50%         95%\n 400    1040     385 ms    2600 ms    0.6%       60%         98%\n 800     760    1050 ms    6000 ms    7.2%       65%         99%", "options": [{"k": "A", "t": "系统容量拐点出现在并发 200 附近：此后继续加压 TPS 不再增长（1050→1040→760），RT 却成倍上升，说明请求开始在队列中排队等待"}, {"k": "B", "t": "并发 800 时 TPS 不升反降、错误率升至 7.2%，是典型的「过载崩溃」；生产上应在网关/服务端做限流保护，把并发压在拐点附近，而不是靠继续加压换吞吐"}, {"k": "C", "t": "服务端 CPU 已达 95%~99%，是当前最主要的瓶颈点；下一步应采集 CPU 火焰图、慢 SQL、线程栈定位热点，再决定是优化代码还是水平扩容"}, {"k": "D", "t": "压测机 CPU 只有 65% 没有跑满，说明本次压测施压不足、数据不可信，必须先让压测机 CPU 也达到 100% 再重新取数"}], "answer": ["A", "B", "C"], "explain": "考点：AI 质量保障 - 软件测试理论与质量体系 - 性能测试指标。A 正确：阶梯加压的典型曲线分三段——轻负载区（TPS 随并发线性上升、RT 平稳）、<b>拐点/饱和区</b>（TPS 触顶、RT 开始明显上升）、过载区（TPS 下降、RT 暴涨、错误率上升）。本例 100→200 并发时 TPS 只从 920 涨到 1050 而 RT 从 108ms 涨到 190ms，200 就是容量拐点，最佳工作点应取拐点或略低。B 正确：过载区继续加压只会让所有请求一起变慢并触发超时雪崩，生产必须靠限流（令牌桶/漏桶/信号量隔离）把并发钉在安全水位，这正是压测数据反哺容量规划与限流阈值的意义。C 正确：性能分析必须「指标 + 资源」联动，CPU 接近饱和说明瓶颈在计算或上下文切换，后续用火焰图/线程栈/慢 SQL 定位。<b>D 错误</b>：结论恰恰相反——<b>压测机资源没被打满，才说明施压端本身不是瓶颈、数据是可信的</b>；如果压测机 CPU 跑满，测出来的 RT 里会混入施压端排队时间，结果反而失真，此时应增加压力机做分布式施压。", "android": "类似给 App 做帧率压测：手机自身发热降频时测出的数据不能代表应用性能；先确保「测量工具本身不是瓶颈」，再谈被测对象的指标。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 性能测试指标"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 28, "type": "judge", "body": "下面是 Nacos 注册中心的配置。CAP 定理指出：分布式系统中网络分区（P）客观存在、无法回避，因此架构设计上只能在一致性（C）与可用性（A）之间做取舍——Nacos 同时提供 AP（临时实例 + Distro 协议）与 CP（持久化实例 + Raft 协议）两种模式，正是这一取舍的工程体现。", "code": "spring:\n  cloud:\n    nacos:\n      discovery:\n        server-addr: 127.0.0.1:8848\n        ephemeral: true   # true = 临时实例(AP, Distro)  false = 持久化实例(CP, Raft)", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - CAP 与分布式理论。网络分区在跨机房、跨网络的分布式系统中是<b>客观存在且不可选择</b>的故障形态，所以「CA 系统」在真正的分布式场景下不成立，实际权衡永远发生在 <b>CP 与 AP</b> 之间。注册中心更看重可用性——拿到一份稍微过期的服务列表，也远比整个服务发现不可用要好，所以 Nacos 默认 <code>ephemeral=true</code> 走 AP（节点间用 Distro 协议做最终一致的数据同步，健康检查靠心跳）；而配置中心、分布式锁、选主这类强一致场景则选 CP（Raft 保证多数派写入，分区时少数派不可写）。对比记忆：ZooKeeper 是 CP（选主期间整个集群不可用），Eureka 是 AP（自我保护机制宁可返回过期数据）。BASE 理论（基本可用、软状态、最终一致）就是对 AP 路线的工程化补充。", "android": "类似客户端的离线优先设计：网络断了宁可先展示本地缓存的旧数据（AP），也不要整个页面白屏；只有支付、下单这类关键路径才必须联网强校验（CP）。", "kaodian": "AI 后端能力 - 高并发与中间件层 - CAP 与分布式理论"}, {"no": 29, "type": "judge", "body": "一致性哈希把节点与 key 都映射到同一个 0 ~ 2³²−1 的哈希环上，key 顺时针找到的第一个节点即为归属节点。因此下面的实现具有这样的特性：<b>新增或摘除一个节点时，环上几乎所有 key 都要重新计算归属、发生整体迁移，这一点与 <code>hash(key) % N</code> 取模路由并无本质差别；引入虚拟节点是为了提升单机吞吐量</b>。", "code": "// 简化实现\nTreeMap<Long, String> ring = new TreeMap<>();\nfor (String node : nodes) {\n    for (int i = 0; i < 160; i++) {                 // 每个物理节点 160 个虚拟节点\n        ring.put(hash(node + \"#VN\" + i), node);\n    }\n}\n\nString route(String key) {\n    Map.Entry<Long, String> e = ring.ceilingEntry(hash(key));\n    return (e == null ? ring.firstEntry() : e).getValue();   // 顺时针，越界则绕回环首\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 一致性哈希。题干把一致性哈希的两个核心价值都说反了。①<b>迁移范围</b>：普通取模下节点数从 N 变成 N+1，<code>hash % N</code> 的结果几乎全部改变，缓存集体失效、请求全部穿透到 DB，这正是「扩容引发雪崩」的经典事故；而一致性哈希只会影响<b>新增节点在环上逆时针方向到其前驱节点之间</b>的那段区间，平均只迁移约 1/(N+1) 的数据，其余 key 的归属完全不变——这恰恰是它相对取模的最大优势，而不是「并无本质差别」。②<b>虚拟节点</b>：其目的是把一个物理节点打散到环上多个位置，缓解节点数较少时的<b>数据倾斜</b>，并避免某节点下线时负载全部压给单一后继节点的「雪崩式转移」，与「提升单机吞吐量」无关。代码中 <code>ceilingEntry</code>（找 ≥ hash 的第一个键）+ 越界回到 <code>firstEntry</code>，正是「顺时针找第一个节点、找不到就绕回环首」的标准写法。注意区分：Redis Cluster 用的是 16384 个固定哈希槽（CRC16 % 16384）+ 槽到节点的映射，思想相近但并非一致性哈希。", "android": "类似客户端把图片缓存分散到多个磁盘目录：如果按 hash%目录数 分配，加一个目录就全部错位、缓存全失效；按环状分配则只影响相邻的一小段。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 一致性哈希"}, {"no": 30, "type": "judge", "body": "RR 隔离级别下执行下面的 UPDATE，由于 remark 列上没有任何索引，InnoDB 只能走聚簇索引全表扫描，并对扫描到的每一行加 Next-Key Lock，实际效果接近「锁全表」——此时另一个会话即使去更新 id=999 这种完全不相干的行，也会被阻塞。", "code": "-- t_user 共 50 万行，remark 列上没有任何索引，隔离级别 REPEATABLE READ\n\n-- 事务A\nBEGIN;\nUPDATE t_user SET status = 1 WHERE remark = 'vip';   -- 实际只命中 3 行\n\n-- 事务B（另一个会话）\nUPDATE t_user SET age = 30 WHERE id = 999;           -- 被阻塞，直至A提交或超时", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：AI 后端能力 - 数据库与ORM层 - 锁机制。InnoDB 的<b>行锁是加在索引记录上的</b>，没有可用索引时只能退化为聚簇索引全表扫描，扫描过程中对遍历到的每条记录及其间隙加 Next-Key Lock，虽然最终「命中」的只有 3 行，锁住的却是全表 50 万行及所有间隙，任何并发写都会被阻塞——这与「只锁 3 行」的直觉完全相反。MySQL 5.6+ 在 RC 级别下对 UPDATE 有 semi-consistent read 优化，可以在 server 层判定不匹配后提前释放该行锁，但<b>RR 级别下不会释放</b>。这就是线上运维规范中「禁止无索引的 UPDATE/DELETE」「大批量更新必须先按主键分批」的由来，MySQL 客户端的 <code>sql_safe_updates</code> 参数也是同一初衷。修复方式：为 remark 建索引；或先 <code>SELECT id ... WHERE remark='vip'</code> 拿到主键集合，再按主键分批小事务更新。", "android": "类似在主线程对整个数据库加了一把大锁做全表遍历：明明只想改 3 条记录，却把所有其他读写都卡住，最终表现为 ANR。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 锁机制"}, {"no": 31, "type": "judge", "body": "下面这段用 Redis <code>INCR</code> 实现的「每分钟最多 100 次」限流属于<b>滑动窗口</b>算法，能够严格保证任意连续 60 秒内放行的请求都不超过 100 次。", "code": "// 以「当前分钟」为窗口切片\nString key = \"rate:\" + userId + \":\" + (System.currentTimeMillis() / 60000);\nLong cnt = redis.opsForValue().increment(key);\nif (cnt != null && cnt == 1L) {\n    redis.expire(key, 60, TimeUnit.SECONDS);\n}\nif (cnt != null && cnt > 100) {\n    throw new BizException(\"请求过于频繁\");\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 限流算法。这段代码用 <code>时间戳 / 60000</code> 把时间按「整分钟」硬切成片，是标准的<b>固定窗口计数器</b>，不是滑动窗口，也无法保证「任意连续 60 秒不超过 100 次」：若用户在 10:00:59 这一秒打满 100 次，时间跨到 10:01:00 后 key 变成新窗口、计数从 0 重新开始，又能立刻打满 100 次，<b>跨越窗口边界的这 1 秒内实际放行约 200 次，达到阈值的 2 倍</b>，这就是固定窗口的「临界突刺 / 边界毛刺」问题。真正的滑动窗口需要用 ZSet 记录每次请求的时间戳，按「当前时刻往前推一个窗口」统计；此外还可用滑动窗口计数器（把 1 分钟拆成若干小格加权求和）或令牌桶/漏桶（Redisson RRateLimiter、Guava RateLimiter、Sentinel 匀速排队）来平滑流量。这段代码还有两个生产隐患：①<code>INCR</code> 与 <code>EXPIRE</code> 是两条命令、非原子，若在两者之间进程宕机会留下<b>永不过期的 key</b>，该用户之后被永久限流，应合并进 Lua 脚本；②按 userId 拼 key 要注意 key 数量膨胀与内存回收。", "android": "类似客户端做「每分钟最多刷新 5 次」的节流：如果按整分钟清零，用户卡着 59 秒和 00 秒连点，一样能在两秒内刷 10 次。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 限流算法"}, {"no": 32, "type": "judge", "body": "下面的 Flex 布局中，<code>.content</code> 已经设置了 <code>flex: 1</code>，却仍被内部的长文本撑破并把 <code>.sidebar</code> 挤出容器。原因是 flex item 的 <code>min-width</code> 默认值为 <code>auto</code>（自动最小尺寸取内容的 min-content 宽度，不会收缩到该值以下），需要给 .content 加上 <code>min-width: 0</code>（或设置 overflow 为非 visible 值）才能正常收缩并让省略号生效。", "code": "<div class=\"layout\">\n  <div class=\"content\">这是一段非常非常长的不会换行的文本……</div>\n  <aside class=\"sidebar\">侧栏</aside>\n</div>\n\n<style>\n.layout  { display: flex; width: 500px; }\n.content { flex: 1; white-space: nowrap; text-overflow: ellipsis; }\n.sidebar { width: 200px; flex-shrink: 0; }\n</style>", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：AI 前端能力 - 前端基础与渲染引擎 - Flex 布局。Flexbox 规范规定：flex item 的 <code>min-width / min-height</code> 初始值是 <code>auto</code>，其解析出的「自动最小尺寸」等于内容的 min-content 尺寸——对于 <code>white-space: nowrap</code> 的长文本来说，就是整段文字的完整宽度。于是 <code>flex: 1</code>（= 1 1 0%）里的 flex-shrink:1 想收缩也收不下去，内容溢出并把兄弟元素挤出容器。两种标准解法：①显式写 <code>min-width: 0</code>，把自动最小尺寸改成 0；②给该 item 设置 <code>overflow: hidden</code>（规范中 overflow 为非 visible 值时自动最小尺寸也变为 0）。注意本例还漏了 <code>overflow: hidden</code>——<code>text-overflow: ellipsis</code> 必须同时具备 nowrap + overflow:hidden + 有限宽度三个条件才会生效。这是 Flex 布局中最高频的「省略号不生效 / 布局被撑破」事故，纵向布局对应的是 <code>min-height: 0</code>（常见于内部滚动区域失效）。", "android": "对应 LinearLayout 里子 View 被长文本撑破：解法是 layout_width=0dp + weight 交给父容器分配，再配 singleLine + ellipsize=\"end\"，本质都是「不让内容决定最小宽度」。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - Flex 布局"}, {"no": 33, "type": "judge", "body": "在性能测试中，<code>吞吐量（Throughput）</code>与 <code>TPS</code> 是完全等价的两个指标，压测报告里可以互换使用、直接互相替代做容量评估。", "code": "JMeter 聚合报告（首页加载场景：1 个「事务」= 1 次页面打开，包含 1 个 HTML + 8 个静态资源请求）\n\n  Transactions per Second (TPS) : 120\n  Requests per Second (QPS/RPS) : 1080\n  Received KB/sec               : 15360\n  avg RT / P95 RT               : 260 ms / 700 ms", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：AI 质量保障 - 软件测试理论与质量体系 - 性能测试指标。三者含义不同，报告中混用会导致容量评估严重偏差：<b>TPS</b>（每秒事务数）统计的是<b>业务事务</b>，一个事务可以由多个 HTTP 请求组成——本例一次页面打开 = 9 个请求，所以 RPS = 120 × 9 = 1080，二者相差 9 倍；<b>QPS/RPS</b> 统计的是请求数，是服务端接口维度的指标；<b>吞吐量</b>在不同语境下既可泛指单位时间处理的请求/事务数，也常特指网络层面的数据量（本例 15360 KB/s），做带宽评估时用的就是后者。因此做容量规划前必须先明确「事务」的定义与边界（JMeter 中用 Transaction Controller 圈定），并同时给出 TPS、RT 分位值（P95/P99）、错误率与服务端资源水位，任何单一指标都不足以描述系统性能。", "android": "类似「页面打开耗时」和「单个接口耗时」不是一回事：一次冷启动背后可能有十几个请求，只盯单接口耗时会严重低估用户实际等待时间。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 性能测试指标"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
