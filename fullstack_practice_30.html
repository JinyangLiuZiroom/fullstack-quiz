<script type="application/json" id="quizData">{"id": "vol30", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "第 30 期 · 33 题（20单+7多+6判）· 11后端/11前端/11测试 · 均分对齐认证考 · 6 原型复刻（P1代码行为12 / P2逐条正误多选7 / P3配置日志找问题4 / P4流程用法5 / P5补全3 / P6计算2）· 每题均带真实可运行代码/配置/日志片段，考读代码判行为、找坑与补全", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "下面这段 Redis 加锁代码在大促期间偶发“某个 SKU 的锁再也拿不到、后续请求全部走不下去”，最可能的原因是？", "code": "// 加锁：先 setnx，再单独设置过期时间\nBoolean ok = redis.opsForValue().setIfAbsent(\"lock:sku:1001\", reqId);\nif (Boolean.TRUE.equals(ok)) {\n    redis.expire(\"lock:sku:1001\", 30, TimeUnit.SECONDS);  // 与上一行不是一个原子操作\n    try {\n        deductStock(1001);\n    } finally {\n        redis.delete(\"lock:sku:1001\");\n    }\n}", "options": [{"k": "A", "t": "delete 写在 finally 里会把别人持有的锁也删掉，所以必须去掉 finally 块"}, {"k": "B", "t": "setIfAbsent 与 expire 之间若进程崩溃，key 没有 TTL，锁永久残留导致后续拿不到锁"}, {"k": "C", "t": "setIfAbsent 本身不保证互斥，多个线程可能同时拿到 true 从而一起进入临界区"}, {"k": "D", "t": "expire 只对 String 类型生效，对用作锁的 key 设置过期时间不会成功"}], "answer": ["B"], "explain": "setIfAbsent 底层就是 SETNX，互斥是有保证的（C 错）；expire 对任意类型的 key 都可用（D 错）；finally 释放是必要的，误删问题应靠比对 reqId 或 Lua 脚本解决，而不是删掉 finally（A 错）。真正的坑在于两条命令非原子：进程恰好崩在 setIfAbsent 成功、expire 未执行之间，就留下一个没有 TTL 的死锁 key，之后所有请求都拿不到锁。正确写法是一次完成：SET key value NX EX 30，即 setIfAbsent(k, v, 30, TimeUnit.SECONDS)。", "kaodian": "AI后端能力-高并发与中间件层-SETNXEX原子加锁"}, {"no": 2, "type": "single", "body": "t_order 有 500 万行、二级索引 idx_ctime(create_time)。执行下面 SQL，InnoDB 大约需要处理多少行才能返回最终的 10 行？", "code": "-- idx_ctime(create_time)，查询列不在索引中（非覆盖）\nSELECT id, user_id, amount, create_time\nFROM t_order\nORDER BY create_time DESC\nLIMIT 100000, 10;", "options": [{"k": "A", "t": "沿索引倒序取出前 100010 行并逐行回表，丢弃前 100000 行后返回最后 10 行"}, {"k": "B", "t": "只回表 10 行，偏移量由索引直接跳过，代价与 LIMIT 0,10 基本一致"}, {"k": "C", "t": "放弃索引改为全表扫描 500 万行，排序后再取出需要的 10 行"}, {"k": "D", "t": "回表 100000 行，第 100001 行起的 10 行由覆盖索引直接返回不需回表"}], "answer": ["A"], "explain": "LIMIT offset, n 并不能“跳过”offset 行：由于 SELECT 的列不在 idx_ctime 里，服务层要沿索引倒序取出 offset+n = 100010 条索引记录，每条都回聚簇索引取 user_id/amount，再把前 100000 行丢弃（B、D 错）。有可用索引时优化器不会退化成全表扫 500 万行再排序（C 错）。这就是深分页越翻越慢的根因。常见优化：改成游标式分页 WHERE create_time < ? ORDER BY create_time DESC LIMIT 10，或先用覆盖索引只取主键再 JOIN 回表。", "kaodian": "AI后端能力-数据存储层-LIMIT偏移扫描行数计算"}, {"no": 3, "type": "single", "body": "createBatch 内部自调用 saveOne，抛异常后数据却没有回滚。要求不拆类、不改注解，横线处应补哪一行让事务生效？", "code": "@Service\npublic class OrderService {\n    public void createBatch(List<Order> list) {\n        for (Order o : list) {\n            /* ______ */.saveOne(o);   // 原来写的是 this.saveOne(o)，事务未生效\n        }\n    }\n\n    @Transactional(rollbackFor = Exception.class)\n    public void saveOne(Order o) {\n        orderMapper.insert(o);\n        if (o.getAmount() < 0) throw new IllegalArgumentException(\"amount\");\n    }\n}", "options": [{"k": "A", "t": "((OrderService) this.getClass().newInstance())"}, {"k": "B", "t": "TransactionAspectSupport.currentTransactionStatus()"}, {"k": "C", "t": "AopProxyUtils.ultimateTargetClass(this).newInstance()"}, {"k": "D", "t": "((OrderService) AopContext.currentProxy())"}], "answer": ["D"], "explain": "@Transactional 依赖 Spring AOP 代理，只有“从代理对象进入”的调用才会被事务拦截器包围；原来的 this.saveOne() 用目标对象内部引用，绕过代理，事务完全失效。AopContext.currentProxy() 正是用来取回当前代理对象的，前提是 @EnableAspectJAutoProxy(exposeProxy = true)。反射 newInstance 出来的对象不受容器管理，连 Mapper 都是 null（A 错）；currentTransactionStatus() 只能拿到当前事务状态用于手动回滚，不是一个能调业务方法的对象（B 错）；ultimateTargetClass 拿到的恰恰是被代理的原始类，再实例化仍然没有事务增强（C 错）。工程上更常见的做法是把 saveOne 拆到另一个 Bean，或注入自身代理（@Lazy 自注入）。", "kaodian": "AI后端能力-三层架构与规范层-自调用事务修复补全"}, {"no": 4, "type": "single", "body": "大促时下单接口大面积超时，代码与日志如下。最可能的根因是？", "code": "@Transactional(rollbackFor = Exception.class)\npublic void submit(OrderDTO dto) {\n    orderMapper.insert(dto.toEntity());        // 1. 本地写库\n    riskClient.check(dto);                     // 2. 远程风控 HTTP，P99 3s，偶发 10s\n    couponClient.deduct(dto.getCouponId());    // 3. 远程券服务 HTTP\n    orderMapper.updateStatus(dto.getId(), 2);  // 4. 本地写库\n}\n\n--- 日志 ---\n10:12:31 WARN  HikariPool-1 - Connection is not available, request timed out after 30000ms\n10:12:31 ERROR dispatcherServlet - Servlet.service() threw exception\n  java.sql.SQLTransientConnectionException: HikariPool-1 - Connection is not available\n--- 配置 ---\nspring.datasource.hikari.maximum-pool-size=20", "options": [{"k": "A", "t": "两次 orderMapper 操作没有声明 REQUIRES_NEW，导致连接无法在方法内复用"}, {"k": "B", "t": "远程调用抛异常触发事务回滚，回滚阶段占用连接属于正常现象，不需要优化"}, {"k": "C", "t": "事务里夹了慢 HTTP 调用，DB 连接被长时间独占，20 条连接很快耗尽，后续请求等连接超时"}, {"k": "D", "t": "maximum-pool-size 只是软限制，需要同时调大 connection-timeout 才能真正生效"}], "answer": ["C"], "explain": "方法一进入事务就绑定一条 DB 连接，直到提交或回滚才归还。中间夹着 P99 3 秒、偶发 10 秒的两个远程调用，单请求持有连接的时间被拉到秒级；大促 QPS 下 20 条连接瞬间打满，后来的请求等满 connection-timeout(30s) 抛 SQLTransientConnectionException。maximum-pool-size 是硬上限（D 错）；REQUIRES_NEW 会额外再开一条连接，只会更快耗尽（A 错）；回滚本身很快，不是根因（B 错）。修法：把远程调用移出事务边界（先调用外部、再开短事务落库），或事务内只做本地写，外部交互走消息与补偿。", "kaodian": "AI后端能力-数据存储层-长事务占用连接池排查"}, {"no": 5, "type": "single", "body": "用 Redis ZSET 做延迟任务（score 存到期时间戳），轮询线程要取出“当前所有已到期任务”，横线处应填？", "code": "// 投递：30 秒后关闭订单\nzset.add(\"delay:order:close\", orderId, System.currentTimeMillis() + 30_000);\n\n// 轮询：每秒取一次已到期任务\nlong now = System.currentTimeMillis();\nSet<String> due = /* ______ */;\nfor (String id : due) {\n    // remove 成功才处理，保证同一任务只被一个实例消费\n    if (Boolean.TRUE.equals(zset.remove(\"delay:order:close\", id))) {\n        closeOrder(id);\n    }\n}", "options": [{"k": "A", "t": "redis.opsForZSet().rangeByScore(\"delay:order:close\", 0, now)"}, {"k": "B", "t": "redis.opsForZSet().range(\"delay:order:close\", 0, now)"}, {"k": "C", "t": "redis.opsForZSet().reverseRange(\"delay:order:close\", 0, now)"}, {"k": "D", "t": "redis.opsForList().range(\"delay:order:close\", 0, now)"}], "answer": ["A"], "explain": "到期条件是“score <= 当前时间”，必须按 score 区间取，对应命令 ZRANGEBYSCORE key 0 now。range/reverseRange 对应 ZRANGE/ZREVRANGE，第二、三个参数是排名下标而不是 score，把毫秒时间戳当下标传进去会把几乎整个集合都取回来（B、C 错）；opsForList 类型不匹配，会抛 WRONGTYPE（D 错）。多实例并发时靠 remove 的返回值抢占（只有删除成功的实例才执行任务），比“先查后删”安全；更严谨可用 Lua 把取值与删除合成一步原子执行。", "kaodian": "AI后端能力-高并发与中间件层-ZSET实现延迟任务队列"}, {"no": 6, "type": "single", "body": "服务本地能启动，部署到 prod 环境启动即失败。结合代码、启动参数与报错，原因是？", "code": "@Configuration\npublic class MockConfig {\n    @Bean\n    @Profile(\"dev\")\n    public SmsSender smsSender() { return new MockSmsSender(); }\n}\n\n@Service\npublic class NotifyService {\n    @Autowired private SmsSender smsSender;   // 工程里没有别的 SmsSender 实现\n}\n\n--- 启动参数 ---\njava -jar app.jar --spring.profiles.active=prod\n--- 报错 ---\nUnsatisfiedDependencyException: Error creating bean with name 'notifyService':\n  No qualifying bean of type 'com.demo.SmsSender' available", "options": [{"k": "A", "t": "prod 环境下 @Configuration 类不会被解析，需要额外加 @EnableConfigurationProperties"}, {"k": "B", "t": "字段注入默认 required=false 不该报错，问题在于 SmsSender 被声明成了接口"}, {"k": "C", "t": "@Profile(\"dev\") 让该 Bean 只在 dev 激活时注册，prod 下容器内没有 SmsSender，强依赖注入直接启动失败"}, {"k": "D", "t": "@Profile 只影响配置文件的加载，不影响 Bean 注册，报错是因为缺少 @ComponentScan"}], "answer": ["C"], "explain": "@Profile 是 Bean 注册级别的条件：active=prod 时 smsSender() 根本不会进容器，而 NotifyService 用字段 @Autowired 强依赖它，启动阶段就抛 UnsatisfiedDependencyException。@Profile 作用于 Bean 与配置类的注册，不只是配置文件（D 错）；@Configuration 在任何 profile 下都会被解析，@EnableConfigurationProperties 与此无关（A 错）；@Autowired 默认 required=true（B 错）。修法：为 prod 提供真实实现（@Profile(\"!dev\") 或 @ConditionalOnMissingBean），或把注入改成 Optional<SmsSender> 并做降级处理。", "kaodian": "AI后端能力-三层架构与规范层-Profile环境Bean装配"}, {"no": 7, "type": "single", "body": "把 Kafka 生产者的 linger.ms 从 0 调整为 50，最直接的效果是？", "code": "acks=1\nbatch.size=16384\nlinger.ms=50          # 原来是 0\ncompression.type=lz4\nmax.in.flight.requests.per.connection=5\nenable.idempotence=true", "options": [{"k": "A", "t": "调大 linger.ms 会让分区内消息顺序失去保证，必须把 in.flight 同时改为 1"}, {"k": "B", "t": "单条消息延迟最多增加约 50ms，但批次更满、压缩率更好，吞吐上升、网络请求数下降"}, {"k": "C", "t": "每条消息都被强制延迟 50ms 后单独发送，吞吐与延迟同时变差"}, {"k": "D", "t": "linger.ms 仅在 batch.size 已满时才起作用，开启压缩后该参数会被忽略"}], "answer": ["B"], "explain": "linger.ms 的语义是“批次没攒满时最多再等多久”，设为 50 表示 sender 允许一条消息最多等 50ms 以凑更大的批；批次变大后 lz4 压缩率更高、请求次数更少，吞吐提升，代价是尾延迟增加最多约 50ms。它不是给每条消息单独加延迟（C 错）；恰恰是 batch.size 未满时才靠 linger 等待，与是否压缩无关（D 错）；顺序性风险来自 in.flight>1 时的失败重试，与 linger 无关，而且这里已开启 enable.idempotence，在 in.flight<=5 时仍能保序（A 错）。", "kaodian": "AI后端能力-高并发与中间件层-Kafka批量发送与linger权衡"}, {"no": 8, "type": "single", "body": "点击按钮修改 state.count，页面数字正常变化，但控制台一直没有输出。这个 watch 为什么不触发？", "code": "import { reactive, watch } from 'vue'\n\nconst state = reactive({ count: 0, user: { name: 'jy' } })\n\nwatch(state.count, (n, o) => {          // ← 从未输出\n  console.log('count changed', o, '->', n)\n})\n\nfunction inc() { state.count++ }", "options": [{"k": "A", "t": "reactive 里的基本类型属性不是响应式的，必须改成 ref(0) 并用 count.value 访问才能被侦听到"}, {"k": "B", "t": "watch 默认 deep 为 false，给 state.count 补上 { deep: true, immediate: true } 选项即可正常触发"}, {"k": "C", "t": "watch 必须在 onMounted 之后注册，setup 顶层注册的侦听器会在首次渲染前被丢弃掉"}, {"k": "D", "t": "state.count 传参时已被求值成数字 0，watch 拿到普通值无法追踪，应写 watch(() => state.count, cb)"}], "answer": ["D"], "explain": "watch 的第一个参数只接受 ref、reactive 对象、getter 函数或它们的数组。state.count 在传参那一刻就被求值成数字 0，watch 拿到一个原始值，无法建立依赖关系，因此永远不触发；写成 getter () => state.count，回调注册时会读取属性并收集依赖。reactive 内的基本类型属性本身是响应式的，模板能正常更新（A 错）；deep 只影响对象的深层遍历，救不了“传进来就是常量”（B 错）；setup 顶层注册 watch 是标准用法，还能随组件卸载自动停止（C 错）。", "kaodian": "AI前端能力-前端基础与渲染引擎-watch侦听源必须为getter"}, {"no": 9, "type": "single", "body": "容器宽 600px，三个子项配置如下。实际渲染结果是？", "code": "<div class=\"row\">\n  <div class=\"col\">1</div><div class=\"col\">2</div><div class=\"col\">3</div>\n</div>\n\n<style>\n.row { display: flex; width: 600px; }   /* flex-wrap 默认 nowrap */\n.col {\n  flex: 0 0 33.3333%;                   /* 不伸不缩，基准约 200px */\n  padding: 0 20px;\n  box-sizing: content-box;              /* 注意不是 border-box */\n}\n</style>", "options": [{"k": "A", "t": "总宽超出容器后 flex 会自动换行，第三项掉到第二行显示"}, {"k": "B", "t": "flex-shrink 默认为 1，三项会被等比压缩，最终总宽仍回到 600px"}, {"k": "C", "t": "每项实际占位 240px（200 + 左右 padding 40），总宽 720px 溢出容器，且不会换行"}, {"k": "D", "t": "每项占 200px 恰好铺满 600px，padding 被画在这 200px 的内部"}], "answer": ["C"], "explain": "content-box 下 flex-basis: 33.3333% 只约束内容盒宽度 = 600 × 1/3 ≈ 200px，左右 padding 各 20px 再加到外面，单项实际占位 240px，三项共 720px。若改成 box-sizing: border-box，padding 会算进 200px 之内，才是“恰好铺满 600px”的结果。flex-wrap 默认 nowrap，宽度超了只会溢出而不换行（A 错）；这里 flex 简写的第二个值把 flex-shrink 显式写成了 0，所以不会被压缩（B 错）——这正是“用了百分比 basis 还溢出”最常见的原因。", "kaodian": "AI前端能力-前端基础与渲染引擎-boxsizing与百分比basis计算"}, {"no": 10, "type": "single", "body": "部分用户打开页面白屏，控制台报错如下。根因与修法是？", "code": "// 登录时\nlocalStorage.setItem('userInfo', JSON.stringify(user))\nlocalStorage.setItem('token', res.token)      // token 是裸字符串，没有 stringify\n\n// 页面初始化\nconst token = JSON.parse(localStorage.getItem('token'))    // ← 报错行\nconst user = JSON.parse(localStorage.getItem('userInfo'))\nstore.init(user, token)\n\n--- 控制台 ---\nUncaught SyntaxError: Unexpected token e in JSON at position 1\n    at JSON.parse (<anonymous>)\n    at initApp (main.js:12)", "options": [{"k": "A", "t": "报错是因为 userInfo 里含中文没有编码，应先 encodeURIComponent 再存进去"}, {"k": "B", "t": "token 存的是裸字符串（如 eyJhbGci...），不是合法 JSON，parse 抛错中断初始化，应直接取值或加 try/catch 兜底"}, {"k": "C", "t": "localStorage 有 5MB 上限，token 过长被截断成了非法 JSON，应改用 sessionStorage 存放"}, {"k": "D", "t": "JSON.parse 无法解析 null，而 getItem 未命中会返回 null，因此只要判空就能完全避免该报错"}], "answer": ["B"], "explain": "报错里的 “Unexpected token e at position 1” 指的正是 JWT 开头的 eyJ：token 写入时没有序列化，读取时却 JSON.parse，语法解析立刻失败；未捕获的异常打断了 initApp，后续渲染全部不执行，表现为白屏。容量超限会在 setItem 阶段抛 QuotaExceededError，不会变成语法错误（C 错）；JSON.parse(null) 返回 null 并不报错，判空救不了“存的本身是非法 JSON”（D 错）；JSON.stringify 已正确处理 Unicode，中文无需额外编码（A 错）。修法：token 直接 getItem 使用，其余反序列化统一包一层 safeParse（try/catch 返回默认值）。", "kaodian": "AI前端能力-网络与BFF架构-本地存储解析异常白屏排查"}, {"no": 11, "type": "single", "body": "左侧文案是一串不含空格的长文本时，它把右侧操作区挤出了容器，且设置的省略号也不生效。原因是？", "code": "<div class=\"wrap\">\n  <div class=\"main\">很长很长的一段不含空格的连续文字XXXXXXXXXXXXXXXXXXXX</div>\n  <aside class=\"side\">操作区</aside>\n</div>\n\n<style>\n.wrap { display: flex; width: 400px; }\n.main { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.side { flex: 0 0 120px; }\n</style>", "options": [{"k": "A", "t": "flex 项的 min-width 计算值默认为 auto（等于最小内容宽度），.main 无法收缩到内容以下，需显式设 min-width: 0"}, {"k": "B", "t": "text-overflow 只对 block 元素生效，flex 子项必须再包一层 span 才能出现省略号"}, {"k": "C", "t": "flex: 1 展开后 flex-shrink 为 0，所以 .main 不会被压缩，应改写成 flex: 1 1 auto"}, {"k": "D", "t": "white-space: nowrap 与 overflow: hidden 互相冲突，必须去掉 nowrap 才会出现省略号"}], "answer": ["A"], "explain": "flex 子项在主轴方向上的 min-width 初始值是 auto，其解析结果为“最小内容尺寸”——对不可断行的长串就是整串宽度，于是 .main 的收缩下限被撑大，flex-shrink 想收也收不下去，宽度溢出、省略号自然不出现。修法就是给 .main 加 min-width: 0（配合已有的 overflow: hidden）。text-overflow 对任何有 overflow 限制的块级容器都生效（B 错）；flex: 1 等价于 flex: 1 1 0%，shrink 是 1 而不是 0（C 错）；出现省略号恰恰需要 nowrap + overflow: hidden + text-overflow 三件套配合（D 错）。", "kaodian": "AI前端能力-前端基础与渲染引擎-flex项minwidthauto阻止收缩"}, {"no": 12, "type": "single", "body": "同一批 id 分别用 forEach 与 for-of 配合 await 遍历，下面这段代码在控制台的输出顺序是？", "code": "const ids = [1, 2]\nconst sleep = (ms, v) => new Promise(r => setTimeout(() => r(v), ms))\n\nasync function main() {\n  ids.forEach(async (id) => {\n    const r = await sleep(10, id)\n    console.log('item', r)\n  })\n  console.log('forEach done')\n\n  for (const id of ids) {\n    const r = await sleep(10, id)\n    console.log('for-of', r)\n  }\n  console.log('for-of done')\n}\nmain()", "options": [{"k": "A", "t": "item 1 → item 2 → forEach done → for-of 1 → for-of 2 → for-of done"}, {"k": "B", "t": "forEach done → for-of 1 → for-of 2 → for-of done → item 1 → item 2"}, {"k": "C", "t": "item 1 → forEach done → item 2 → for-of 1 → for-of 2 → for-of done"}, {"k": "D", "t": "forEach done → item 1 → item 2 → for-of 1 → for-of 2 → for-of done"}], "answer": ["D"], "explain": "forEach 不认识回调返回的 Promise，两个 async 回调只是被同步“发射”出去（各注册一个 10ms 定时器），随后立刻打印 forEach done。接着 for-of 的第一次 await 也注册一个 10ms 定时器，但它排在前两个之后，因此到期顺序是 item 1、item 2、for-of 1，最后一轮再等 10ms 输出 for-of 2 与 for-of done。要顺序执行必须用 for...of + await；要并发且可等待，用 await Promise.all(ids.map(async ...))。“forEach 里 await 白写”在批量埋点、串行落库场景里非常常见。", "kaodian": "AI前端能力-前端基础与渲染引擎-forEach中async不等待"}, {"no": 13, "type": "single", "body": "图片懒加载能正常加载，但滚动过后回调仍被反复触发、内存占用持续上升。横线处应补哪一行？", "code": "const io = new IntersectionObserver((entries) => {\n  entries.forEach(entry => {\n    if (!entry.isIntersecting) return\n    const img = entry.target\n    img.src = img.dataset.src\n    /* ______ */              // 已加载的图片不需要再被观察\n  })\n}, { rootMargin: '200px' })\n\ndocument.querySelectorAll('img[data-src]').forEach(el => io.observe(el))", "options": [{"k": "A", "t": "io.disconnect()"}, {"k": "B", "t": "img.removeAttribute('data-src')"}, {"k": "C", "t": "entry.isIntersecting = false"}, {"k": "D", "t": "io.unobserve(img)"}], "answer": ["D"], "explain": "每个元素加载完就该停止对它的观察，unobserve(target) 只摘掉这一个目标，其余图片继续懒加载。disconnect() 会一次性取消全部观察，后面的图片再也不会被加载（A 错）；删掉 data-src 只是去掉数据源，元素仍留在观察列表里，回调照旧触发（B 错）；entry 是只读快照，改它不影响观察行为（C 错）。补充：整个列表卸载时（路由离开、组件 onUnmounted）再调一次 disconnect() 释放引用，避免 observer 持有已移除的 DOM 造成泄漏。", "kaodian": "AI前端能力-前端基础与渲染引擎-IntersectionObserver懒加载补全"}, {"no": 14, "type": "single", "body": "用 requestAnimationFrame 做 60 秒倒计时，用户切到别的标签页停留一分钟再切回来，剩余时间明显偏多。原因是？", "code": "let left = 60\nlet last = performance.now()\n\nfunction tick(now) {\n  if (now - last >= 1000) { left--; last = now; render(left) }\n  if (left > 0) requestAnimationFrame(tick)\n}\nrequestAnimationFrame(tick)", "options": [{"k": "A", "t": "标签页不可见时浏览器会暂停或大幅降低 rAF 回调频率，倒计时少走了秒数，应改为按“截止时间戳 - 当前时间”反算"}, {"k": "B", "t": "performance.now() 在后台会被冻结成同一个值，改用 Date.now() 做差值即可修好这段逻辑"}, {"k": "C", "t": "rAF 在后台依然按 60fps 执行，偏差来自 render 触发的重排耗时不断累积"}, {"k": "D", "t": "应换成 setInterval(fn, 1000)，setInterval 在后台不受任何节流限制，可以保证精确计时"}], "answer": ["A"], "explain": "rAF 与渲染帧绑定，页面进入后台（document.hidden 为 true）后回调会被暂停或压到极低频率，这段时间 tick 几乎不执行，left 自然没减够。可靠做法是记录截止时间戳，展示时用 deadline - Date.now() 反算剩余，并监听 visibilitychange 在回到前台时立即校正。performance.now() 是单调时钟，后台并不冻结（B 错）；后台并非仍跑满 60fps（C 错）；setInterval 在后台同样会被节流到 1000ms 甚至更久，也不精确（D 错）。", "kaodian": "AI前端能力-前端基础与渲染引擎-rAF后台标签暂停"}, {"no": 15, "type": "single", "body": "同一套 E2E 用例本地全绿，CI 上 30 条全部失败，日志如下。最直接的修法是？", "code": "# .github/workflows/e2e.yml\n- run: npm ci\n- run: npx playwright test --reporter=line\n\n--- CI 日志 ---\nError: browserType.launch: Executable doesn't exist at\n  /home/runner/.cache/ms-playwright/chromium-1140/chrome-linux/chrome\n+-------------------------------------------------------------+\n| Looks like Playwright was just installed.                   |\n| Please run the following command to download new browsers:  |\n|     npx playwright install                                  |\n+-------------------------------------------------------------+\n  1) [chromium] > login.spec.ts:7:1 > 登录成功  ... 30 failed", "options": [{"k": "A", "t": "把 headless 改成 false 并配置 xvfb 虚拟显示，CI 上必须有真实窗口才能启动成功"}, {"k": "B", "t": "在 playwright.config.ts 里把 workers 设为 1，并发过高导致浏览器实例无法同时启动"}, {"k": "C", "t": "npm ci 之后补一步 npx playwright install --with-deps chromium 装浏览器与依赖"}, {"k": "D", "t": "在用例里加 test.setTimeout(120000)，CI 机器较慢导致浏览器在启动阶段被超时中断"}], "answer": ["C"], "explain": "日志已直接点明 Executable doesn't exist：npm ci 只安装 @playwright/test 这个 npm 包，浏览器二进制是单独下载并缓存在 ~/.cache/ms-playwright 的，CI 的干净环境里没有，必须显式执行 npx playwright install，Linux 上还需 --with-deps 装 libnss3 等系统库。这不是超时（报错发生在 launch 阶段，而非导航或断言阶段，D 错）；CI 恰恰应该用 headless，有头模式还需要 xvfb 支持（A 错）；并发数与“可执行文件不存在”无关（B 错）。工程上可用 actions/cache 缓存该目录来加速。", "kaodian": "AI质量保障-自动化测试-Playwright执行环境缺失排查"}, {"no": 16, "type": "single", "body": "下面两个用例针对同一个有 3 处数据错误的对象做校验，运行后报告里分别能看到几条失败信息？", "code": "@Test\nvoid case1() {                        // 连续断言\n    Order o = svc.get(1L);\n    assertEquals(2, o.getStatus());   // 实际 1，失败\n    assertEquals(99L, o.getAmount()); // 实际 88\n    assertNotNull(o.getPayTime());    // 实际 null\n}\n\n@Test\nvoid case2() {                        // 聚合断言\n    Order o = svc.get(1L);\n    assertAll(\"order\",\n        () -> assertEquals(2, o.getStatus()),\n        () -> assertEquals(99L, o.getAmount()),\n        () -> assertNotNull(o.getPayTime()));\n}", "options": [{"k": "A", "t": "两个用例都只报第 1 条，assertAll 需要配合 @Nested 才会收集全部失败"}, {"k": "B", "t": "case1 只报第 1 条（status）随即中断；case2 把 3 条失败一次性聚合报出"}, {"k": "C", "t": "两个用例都会报出全部 3 条失败，assertAll 只是写法上更简洁一些"}, {"k": "D", "t": "case1 报 3 条；case2 因为第一个断言失败就中断，只能报 1 条"}], "answer": ["B"], "explain": "JUnit5 普通断言失败会抛 AssertionFailedError，方法立即结束，后面的断言不再执行，所以 case1 只能看到 status 这一条，改完再跑才发现 amount 也不对，排查要跑很多轮。assertAll 会执行全部 Executable，把所有失败收集进 MultipleFailuresError 一次性输出，定位效率高得多，其余三项对这两种断言的行为描述都不符合实际。实践建议：同一对象的多字段校验用 assertAll（或 AssertJ 的 assertSoftly），而前置条件校验仍用普通断言以便快速失败。", "kaodian": "AI质量保障-自动化测试-assertAll聚合断言语义"}, {"no": 17, "type": "single", "body": "要验证“商品详情下游接口返回 500 时，前端展示兜底文案且重试按钮可用”，下面哪种做法最合适？", "code": "// Playwright 中拦截并打桩下游接口\nawait page.route('**/api/goods/detail*', route =>\n  route.fulfill({\n    status: 500,\n    contentType: 'application/json',\n    body: JSON.stringify({ code: 50001, msg: 'server error' })\n  }))\n\nawait page.goto('/goods/1001')\nawait expect(page.getByText('加载失败，请重试')).toBeVisible()\nawait expect(page.getByRole('button', { name: '重试' })).toBeEnabled()", "options": [{"k": "A", "t": "只在代码评审里确认写了 catch 分支，异常路径无法自动化验证"}, {"k": "B", "t": "用请求拦截打桩把响应固定为 500，异常分支即可稳定、可重复地被验证"}, {"k": "C", "t": "找后端同学在测试环境临时把该接口改成抛异常，测完再改回来"}, {"k": "D", "t": "直接对下游接口发起压测把它打挂，从而观察前端的异常表现"}], "answer": ["B"], "explain": "异常分支能否测，关键在于“能否稳定构造”。请求拦截或 Mock 服务（Playwright route、MSW、WireMock）可以把响应精确固定为 500、超时、非法 JSON 等各种形态，用例可重复、不依赖下游真实状态，也便于覆盖更多分支。让后端临时改代码会污染共享环境、影响其他人且不可重复（C 错）；压挂下游是破坏性操作，时机与影响都不可控（D 错）；异常路径完全可以自动化，评审不能替代验证（A 错）。补充：打桩用例之外仍要保留一条不打桩的真实链路用例，兜住集成风险。", "kaodian": "AI质量保障-自动化测试-Mock服务模拟异常响应"}, {"no": 18, "type": "single", "body": "结算金额偶发差一分钱，用 AI 辅助分析下面代码与日志，正确的根因判断与修法是？", "code": "double total = 0;\nfor (Item it : items) { total += it.getPrice() * it.getCount(); }  // price 为 double\nlog.info(\"total={}\", total);\n\nassertEquals(0.3, total, 0);   // 期望 0.3\n\n--- 运行输出 ---\ntotal=0.30000000000000004\njava.lang.AssertionError: expected:<0.3> but was:<0.30000000000000004>\nitems=[{price=0.1,count=1},{price=0.2,count=1}]", "options": [{"k": "A", "t": "这是特定 JVM 版本上的浮点精度 bug，升级到较新的 JDK 之后该误差就会自动消除"}, {"k": "B", "t": "属于断言写法问题，把 delta 从 0 放宽到 0.01 即可，缺陷本身就算已经修好"}, {"k": "C", "t": "计算结果本身精确等于 0.3，只是 log 打印时的格式化引入了多余的尾数位"}, {"k": "D", "t": "double 无法精确表示 0.1/0.2 导致累加误差，金额应改用 BigDecimal 或以“分”计"}], "answer": ["D"], "explain": "0.1、0.2 在 IEEE 754 双精度下都是无限循环二进制小数，只能近似存储，相加得到 0.30000000000000004。这与 JVM 版本无关（A 错），也不是打印格式问题——日志显示的就是变量真实值（C 错）。放宽 delta 只是让断言不再报警，金额在多笔累加、退款抹零后误差还会放大，属于掩盖缺陷（B 错）。正确修法：金额用 BigDecimal，且必须用 new BigDecimal(\"0.1\") 字符串构造（传 double 会把误差带进去），比较用 compareTo；或统一以 long 存“分”。测试侧应把这条固化为金额类接口的常驻用例，并覆盖多笔累加与折扣场景。", "kaodian": "AI质量保障-AI测试能力-浮点精度缺陷定位"}, {"no": 19, "type": "single", "body": "用判定表法为下面折扣逻辑设计用例，完整判定表的规则（列）数与覆盖全部动作所需的最少用例数分别是？", "code": "// 三个独立条件，各取 是 / 否\n// C1: 是否会员    C2: 订单金额 >= 200    C3: 是否使用优惠券\nif (isMember && amount >= 200) discount = 0.8;\nelse if (isMember)             discount = 0.9;\nelse if (amount >= 200 && hasCoupon) discount = 0.95;\nelse                           discount = 1.0;", "options": [{"k": "A", "t": "完整判定表 2×2×2 = 8 条规则；合并等价规则后最少 4 条用例覆盖 4 种折扣"}, {"k": "B", "t": "完整判定表有 3 条规则（对应 3 个条件），因此需要写 3 条用例来覆盖"}, {"k": "C", "t": "完整判定表有 3×3 = 9 条规则，必须写满 9 条用例才算完全覆盖"}, {"k": "D", "t": "完整判定表有 8 条规则，8 条都要各写一条用例，等价规则不允许合并"}], "answer": ["A"], "explain": "判定表的规则数等于各条件取值的笛卡尔积，3 个二值条件即 2³ = 8 条规则（其余选项对规则数的算法理解有误）。但 8 条规则映射到的动作只有 4 种折扣（0.8 / 0.9 / 0.95 / 1.0）：例如“会员且金额≥200”时 hasCoupon 取任何值结果都是 0.8，这两条规则可以合并；“会员且金额<200”恒为 0.9 同理。因此最少 4 条用例即可覆盖全部动作分支，这正体现判定表“先穷举、再化简”的价值。实际还会对 amount 补 199/200/201 边界，那属于边界值分析的叠加，不改变判定表的规则数。", "kaodian": "AI质量保障-软件测试理论与质量体系-判定表规则数计算"}, {"no": 20, "type": "single", "body": "下面这个参数化测试的运行结果是？", "code": "@ParameterizedTest\n@CsvSource({ \"abc, 3\", \"'', 0\", \", 0\" })\nvoid len(String s, int expect) {\n    assertEquals(expect, s == null ? 0 : s.length());\n}", "options": [{"k": "A", "t": "第 3 个用例失败并抛 NullPointerException，@CsvSource 不允许某个参数缺省"}, {"k": "B", "t": "编译期即报错：@CsvSource 每一行必须提供全部参数且不能留空"}, {"k": "C", "t": "3 个用例全部通过：'' 解析为空字符串（长度 0），第三行缺省值解析为 null，走三元表达式的 0 分支"}, {"k": "D", "t": "3 个用例全部通过，因为 '' 与缺省值都会被解析成空字符串，长度同为 0"}], "answer": ["C"], "explain": "JUnit5 的 @CsvSource 默认把带引号的 '' 解析为空字符串（emptyValue 默认为 \"\"），把“什么都不写”的缺省值解析为 null。所以三行分别是 (\"abc\",3)、(\"\",0)、(null,0)，代码里的判空正好接住第三行，三条全部通过。若想让字面量 NIL 也当 null，可写 @CsvSource(value = {...}, nullValues = \"NIL\")；想让空串映射成别的默认值可用 emptyValue 属性。这个差异是参数化用例里最容易误判的点——把 null 用例误写成 '' 就永远测不到空指针分支。", "kaodian": "AI质量保障-自动化测试-CsvSource空值与null语义"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "t_user_coupon 上有唯一索引 uk_user_coupon(user_id, coupon_id)，现有数据 (1001, 2001, status=1, remark='old')。下列关于三条语句的说法，正确的有？（多选、少选、错选均不得分）", "code": "-- ①\nINSERT INTO t_user_coupon(user_id, coupon_id, status) VALUES(1001, 2001, 1)\nON DUPLICATE KEY UPDATE status = 2;\n-- ②\nREPLACE INTO t_user_coupon(user_id, coupon_id, status) VALUES(1001, 2001, 3);\n-- ③\nINSERT IGNORE INTO t_user_coupon(user_id, coupon_id, status) VALUES(1001, 2001, 4);", "options": [{"k": "A", "t": "① 命中唯一键冲突后执行 UPDATE，把 status 改为 2，remark 仍保持 'old'"}, {"k": "B", "t": "② 语义等价于先 DELETE 再 INSERT，未在 VALUES 中给出的 remark 会丢失（回到默认值或 NULL）"}, {"k": "C", "t": "③ 遇到唯一键冲突时不报错也不更新，只是把该错误降级为 warning"}, {"k": "D", "t": "①②③ 都不会消耗自增值，冲突时自增计数器一定不前进，不会出现主键空洞"}], "answer": ["A", "B", "C"], "explain": "1. A 正确：ON DUPLICATE KEY UPDATE 只更新 SET 里列出的列，其余列保持原值。 2. B 正确：REPLACE 的实现是删除冲突行再插入新行，未显式赋值的列会回到默认值或 NULL，这是它最容易“丢字段”的地方。 3. C 正确：INSERT IGNORE 把唯一键冲突这类错误降级为 warning，目标行不受影响。 4. D 错误：在 innodb_autoinc_lock_mode 默认配置下，自增值在插入前就可能被分配，冲突后不回收，会留下主键空洞；REPLACE 更是真的插入新行、必然占用新的自增值。", "kaodian": "AI后端能力-数据存储层-INSERT冲突处理语义判定"}, {"no": 2, "type": "multi", "body": "同一个配置项在多处出现，下列关于最终生效值与刷新行为的说法，正确的有？（多选、少选、错选均不得分）", "code": "# application.yml（打进 jar 内）\napp:\n  timeout: 1000\n\n# application-prod.yml（打进 jar 内）\napp:\n  timeout: 2000\n\n# 容器环境变量\nexport APP_TIMEOUT=3000\n\n# 启动命令\njava -jar app.jar --spring.profiles.active=prod --app.timeout=4000", "options": [{"k": "A", "t": "最终 app.timeout 生效值是 4000，命令行参数优先级高于环境变量与 jar 内配置文件"}, {"k": "B", "t": "APP_TIMEOUT 能通过松散绑定映射到 app.timeout，去掉命令行参数后生效值为 3000"}, {"k": "C", "t": "用 @Value(\"${app.timeout}\") 注入的字段，会随配置中心推送自动变成新值，无需任何额外注解"}, {"k": "D", "t": "application-prod.yml 优先级高于 application.yml，两者会合并加载、同名 key 由 prod 覆盖"}], "answer": ["A", "B", "D"], "explain": "1. A 正确：Spring Boot 外部化配置顺序中，命令行 --key=value 属于最高优先级来源之一，压过环境变量与 jar 内 yml。 2. B 正确：Relaxed Binding 允许 APP_TIMEOUT 这种大写下划线写法映射到 app.timeout，去掉命令行参数后它生效。 3. C 错误：@Value 注入的是启动时的快照，配置中心推送后需要 @RefreshScope（或改用 @ConfigurationProperties 配合刷新）才会更新，否则字段值不变。 4. D 正确：application-{profile}.yml 与 application.yml 都会加载，profile 专属文件覆盖默认文件的同名 key，属于合并而非整体替换。", "kaodian": "AI后端能力-三层架构与规范层-外部化配置优先级判定"}, {"no": 3, "type": "multi", "body": "关于下面 keep-alive 的缓存行为，判断正确的有？（多选、少选、错选均不得分）", "code": "<router-view v-slot=\"{ Component }\">\n  <keep-alive :include=\"['ListPage']\" :max=\"2\">\n    <component :is=\"Component\" />\n  </keep-alive>\n</router-view>\n\n<!-- ListPage.vue -->\n<script setup>\ndefineOptions({ name: 'ListPage' })\nonMounted(() => load())        // ①\nonActivated(() => refresh())   // ②\nonUnmounted(() => clear())     // ③\n<\/script>", "options": [{"k": "A", "t": "从 ListPage 离开再返回时，① 的 onMounted 不会再次执行，② 的 onActivated 会执行"}, {"k": "B", "t": "被缓存的组件切走时会触发 ③ 的 onUnmounted，因此可以在这里清理定时器"}, {"k": "C", "t": "include 依据组件 name 匹配，若没有通过 defineOptions 或文件名提供名字，则不会被缓存"}, {"k": "D", "t": "max 为 2 表示最多缓存 2 个实例，超出时按最久未访问（LRU）销毁最老的那个"}], "answer": ["A", "C", "D"], "explain": "1. A 正确：缓存命中时组件实例被复用，只走 activated/deactivated，不会重新 mounted，这也是“返回列表不刷新”的原理。 2. B 错误：被缓存的组件切走只触发 onDeactivated，onUnmounted 仅在实例真正销毁时才执行（被 LRU 淘汰、include 不再匹配、父级卸载）；定时器等资源应在 onDeactivated 里暂停。 3. C 正确：include/exclude 按组件名匹配，script setup 需要 defineOptions({ name }) 或依赖文件名推断，名字不匹配则不进缓存。 4. D 正确：max 限制缓存实例数，采用 LRU 淘汰最久未使用的实例，并触发其卸载钩子。", "kaodian": "AI前端能力-前端基础与渲染引擎-keepalive缓存行为判定"}, {"no": 4, "type": "multi", "body": "下面是前端错误监控的初始化代码，关于四类错误能否被捕获，判断正确的有？（多选、少选、错选均不得分）", "code": "window.onerror = (msg, src, line, col, err) => { report(err || msg); return true }\n\n// 以下四类错误分别能否被上面这一行捕获？\nfetch('/api/list').then(r => r.json())            // ① 接口返回 500\nJSON.parse('{oops')                                // ② 同步运行时异常\nPromise.reject(new Error('no handler'))            // ③ 未处理的 Promise 拒绝\ndocument.body.innerHTML = '<img src=\"/404.png\">'   // ④ 资源加载失败", "options": [{"k": "A", "t": "① fetch 拿到 500 响应时会自动 reject 并抛出异常，因此能被上面这个全局处理器捕获上报"}, {"k": "B", "t": "② 这类同步抛出的运行时异常正是 window.onerror 的捕获范围，返回 true 还能屏蔽控制台默认输出"}, {"k": "C", "t": "③ 未处理的 Promise 拒绝不走 window.onerror，需要额外监听 unhandledrejection 事件"}, {"k": "D", "t": "④ 资源加载失败不冒泡，需用 addEventListener('error', fn, true) 在捕获阶段监听"}], "answer": ["B", "C", "D"], "explain": "1. A 错误：fetch 只在网络层失败（断网、DNS、CORS 拦截）时 reject，HTTP 4xx/5xx 属于“请求正常完成”，必须自己判断 response.ok 并手动上报，否则错误被静默吞掉——这是前端监控最常见的漏报点。 2. B 正确：未捕获的同步异常正是 window.onerror 的主场，返回 true 可阻止默认的控制台输出。 3. C 正确：没有 catch 的 Promise 拒绝走的是 unhandledrejection 事件，必须单独注册监听。 4. D 正确：img/script/link 的加载失败只在目标元素上触发 error 事件且不冒泡，只能靠第三个参数为 true 的捕获阶段监听拿到。", "kaodian": "AI前端能力-网络与BFF架构-前端异常捕获覆盖判定"}, {"no": 5, "type": "multi", "body": "并发从 50 提到 200 的压测结果如下，判断下列分析正确的有？（多选、少选、错选均不得分）", "code": "并发50 : TPS=980   RT_avg=51ms   RT_P99=120ms  错误率 0%     CPU(app)=45%  CPU(db)=30%\n并发100: TPS=1010  RT_avg=99ms   RT_P99=260ms  错误率 0%     CPU(app)=52%  CPU(db)=35%\n并发200: TPS=1005  RT_avg=199ms  RT_P99=890ms  错误率 0.2%   CPU(app)=55%  CPU(db)=38%\n\n应用日志: HikariPool-1 - Timeout failure ... total=20, active=20, idle=0, waiting=37", "options": [{"k": "A", "t": "TPS 在 1000 附近封顶而 RT 随并发近似线性增长，符合“系统已达吞吐上限、请求在排队”的特征"}, {"k": "B", "t": "active=20、idle=0、waiting=37 指向 DB 连接池是当前瓶颈点，应先排查慢 SQL 与连接持有时长"}, {"k": "C", "t": "应用与 DB 的 CPU 都不到 60%，说明瓶颈不在算力，更可能在等待类资源（连接、锁、下游 IO）"}, {"k": "D", "t": "容量结论要同时看 P99 与错误率：P99 已从 120ms 恶化到 890ms 并开始出现失败，不能判定 200 并发可用"}], "answer": ["A", "B", "C", "D"], "explain": "1. A 正确：TPS 封顶而 RT 与并发近似线性上升，是典型排队现象（并发 ≈ TPS × RT），继续加并发只增加等待时间。 2. B 正确：等待队列 37、活跃连接打满 20，连接池已是瓶颈；但要先查“为什么每个请求占用连接这么久”（慢 SQL、事务里夹远程调用），盲目扩池只会把压力传导给 DB。 3. C 正确：两侧 CPU 都不高说明不是计算受限，应重点看等待类资源。 4. D 正确：只看错误率 0.2% 会误判为“容量充足”，而 P99 已恶化 7 倍，用户体验早已不达标，容量结论必须同时看长尾与错误率。", "kaodian": "AI质量保障-软件测试理论与质量体系-TPS瓶颈原因判定"}, {"no": 6, "type": "multi", "body": "提的缺陷被开发以“本地无法复现”打回，下列处置做法正确的有？（多选、少选、错选均不得分）", "code": "缺陷单 #4821\n标题：点击“提交”后偶发提示“网络异常”\n步骤：1. 打开订单页  2. 点提交\n预期：提交成功\n实际：偶发失败\n附件：无\n环境：测试环境（未写版本号/构建号）", "options": [{"k": "A", "t": "无法稳定复现的缺陷应先关闭，等它下次出现时重新提单，避免占用开发排期"}, {"k": "B", "t": "补齐可定位信息：版本号与构建号、账号与数据前置条件、发生时间点、traceId、请求响应报文与录屏"}, {"k": "C", "t": "既然开发本地复现不了，就该把结论切到开发本地环境重测，测试环境的现象不作为依据"}, {"k": "D", "t": "给出复现概率与触发规律（如 20 次中 3 次、均发生在连续快速点击时），把偶发转成可控条件"}], "answer": ["B", "D"], "explain": "1. A 错误：直接关闭会丢掉线上风险线索，正确做法是保留在“待补充信息/待观察”状态，挂上监控与埋点继续跟踪——缺陷逃逸到生产的代价远高于排查成本。 2. B 正确：这张单缺的正是版本、环境细节、traceId、报文与录屏，开发只能靠猜；补齐上下文是解决“无法复现”的第一步。 3. C 错误：本地环境与测试环境的数据、配置、依赖版本都不同，本地复现不了不等于缺陷不存在；应以可复现的环境为基准，用日志与链路数据对齐差异。 4. D 正确：把偶发量化为概率与触发条件，往往能直接暴露防抖缺失、幂等缺失、缓存脏读等根因。", "kaodian": "AI质量保障-软件测试理论与质量体系-无法复现缺陷处置判定"}, {"no": 7, "type": "multi", "body": "把接口自动化从串行改成 4 个 worker 并行后开始偶发失败，下列关于失败原因的判断正确的有？（多选、少选、错选均不得分）", "code": "public class OrderApiTest {\n    static String couponCode = \"C-ONLY-ONE\";                  // ① 一次性券码，用完即失效\n\n    @BeforeAll\n    static void initPort() { app.start(8080); }                // ② 固定端口\n\n    @Test void t1() { api.use(couponCode); /* ... */ }\n    @Test void t2() { api.use(couponCode); /* ... */ }\n    @Test void t3() { db.execute(\"delete from t_order\"); }     // ③ 无条件清库\n}", "options": [{"k": "A", "t": "① 一次性券码被多个用例争抢，谁先执行谁成功，属共享测试数据冲突，应改为每个用例自造独立数据"}, {"k": "B", "t": "只要给所有用例加上 @Order 注解规定执行顺序，并行执行下就能避免这些冲突"}, {"k": "C", "t": "② 固定端口 8080 在多进程并行时会 Address already in use，应改为随机端口并从上下文读取实际端口"}, {"k": "D", "t": "③ 的全表删除是并行安全的，因为每个 worker 使用各自独立的数据库连接"}], "answer": ["A", "C"], "explain": "1. A 正确：一次性券码是典型的共享可变状态，并行下产生“谁先谁赢”的偶发失败，测试数据应按用例维度独立生成。 2. B 错误：@Order 只能约束同一执行容器内的顺序，并行的多个 worker 之间无法互相排序；而且靠顺序掩盖依赖本身就是设计缺陷，正解是消除共享状态。 3. C 正确：多 worker 各自起进程，固定端口必然抢占，应使用随机端口（如 port=0）并动态读取。 4. D 错误：连接独立不代表数据独立，无条件 delete 会把其他并行用例正在使用的数据一并清掉，应按本用例的业务键定向清理，或使用独立 schema/容器。", "kaodian": "AI质量保障-自动化测试-并行执行冲突判定"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "线上按前缀清理缓存时，第②种写法（SCAN 游标分批扫描）比第①种（KEYS 一次性匹配全库）更安全，因为 KEYS 会遍历整个 keyspace 并阻塞 Redis 单线程，而 SCAN 分批返回、不会长时间阻塞。", "code": "// ① 危险：一次性匹配全库\nSet<String> keys = redis.keys(\"cache:user:*\");\n\n// ② 推荐：游标分批扫描\nScanOptions opt = ScanOptions.scanOptions().match(\"cache:user:*\").count(500).build();\ntry (Cursor<byte[]> cur = redis.getConnectionFactory().getConnection().scan(opt)) {\n    while (cur.hasNext()) {\n        redis.unlink(new String(cur.next()));\n    }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。KEYS pattern 的复杂度是 O(N)（N 为 keyspace 大小），在千万级 key 的实例上一次调用可能阻塞主线程数百毫秒到数秒，期间所有命令排队，属于线上禁用命令。SCAN 是基于游标的增量迭代，每次只返回一小批（count 只是提示值），单次耗时可控；代价是弱一致——迭代期间新增或删除的 key 可能漏掉或重复，但全程存在且未变动的 key 保证至少被返回一次。再配合 UNLINK 异步回收大 key，可以避免删除阶段的阻塞。", "kaodian": "AI后端能力-高并发与中间件层-SCAN游标替代KEYS"}, {"no": 2, "type": "judge", "body": "Spring 事务传播行为中，SUPPORTS 表示当前没有事务就新建一个事务；MANDATORY 表示当前没有事务就以非事务方式执行。", "code": "@Transactional(propagation = Propagation.SUPPORTS)\npublic void report() { ... }        // 外层无事务时？\n\n@Transactional(propagation = Propagation.MANDATORY)\npublic void mustInTx() { ... }      // 外层无事务时？", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "错误，两者的定义被说反了。SUPPORTS：有事务就加入，没有事务就以非事务方式执行，绝不新建；MANDATORY：必须存在外层事务，否则直接抛 IllegalTransactionStateException(\"No existing transaction found\")。“没有就新建一个”是 REQUIRED 的语义（默认值），而 REQUIRES_NEW 是无论有没有都挂起外层、开一个新事务。另外 NEVER 是“存在事务就抛异常”，NESTED 是基于 savepoint 的嵌套回滚，只回滚内层不影响外层已完成的部分。", "kaodian": "AI后端能力-三层架构与规范层-事务传播SUPPORTS语义"}, {"no": 3, "type": "judge", "body": "在 Vue3 的 script setup 中使用子组件，只要 import 进来就能直接写在模板里，不需要再声明 components 选项。", "code": "<script setup>\nimport UserCard from './UserCard.vue'   // 只有 import，没有 components 选项\nconst u = { name: 'jy' }\n<\/script>\n\n<template>\n  <UserCard :user=\"u\" />\n</template>", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。script setup 会把顶层作用域的所有绑定（变量、函数、import 进来的组件）暴露给模板编译结果，编译器把 <UserCard /> 直接解析成对该变量的引用，因此不需要 components 注册。两个注意点：一是标签名要能与变量名匹配（推荐 PascalCase 导入并以 PascalCase 使用）；二是动态组件要写 <component :is=\"UserCard\" /> 传变量而不是字符串名，因为组件并未注册到全局名字表。若使用选项式 API（非 setup 语法糖），仍必须显式声明 components。", "kaodian": "AI前端能力-前端基础与渲染引擎-scriptsetup组件自动注册"}, {"no": 4, "type": "judge", "body": "商品详情用 v-html 渲染后端返回的富文本时，Vue 的模板编译器会对 v-html 的内容做转义，因此不存在 XSS 风险。", "code": "<template>\n  <!-- content 来自后端，可能含用户提交的 HTML -->\n  <div v-html=\"content\"></div>\n  <div>{{ content }}</div>\n</template>\n\n<script setup>\nconst content = '<img src=x onerror=\"fetch(`/api/steal?c=`+document.cookie)\">'\n<\/script>", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "错误，实际情况恰好相反。Vue 只对文本插值 {{ }} 做 HTML 转义（上面第二个 div 会把标签原样当文字显示），而 v-html 的语义就是“把字符串当 HTML 插入”，不做任何转义，其中的 onerror 会被浏览器执行，构成典型的存储型 XSS。安全做法：优先不渲染不可信 HTML；确实需要富文本时先做白名单净化（前端 DOMPurify.sanitize，或服务端统一过滤标签、属性与 javascript: 协议），并配合 CSP 与 HttpOnly Cookie 降低被利用后的危害。", "kaodian": "AI前端能力-前端基础与渲染引擎-vhtml不转义风险"}, {"no": 5, "type": "judge", "body": "自动化测试脚本同样是需要评审、重构与治理的代码资产，否则会随业务迭代变成维护负担。", "code": "@Test\nvoid t() {\n    driver.findElement(By.xpath(\"/html/body/div[3]/div[2]/div/ul/li[4]/a\")).click(); // 绝对 xpath\n    Thread.sleep(3000);                                        // 硬等待\n    assertTrue(driver.getPageSource().contains(\"成功\"));        // 弱断言\n    // 账号密码硬编码，且依赖上一条用例留下的数据\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "正确。这段脚本的问题都会随迭代放大：绝对 xpath 一改样式就断；Thread.sleep 既拖慢流水线又不稳定（快时仍等 3 秒，慢时依旧超时）；contains(\"成功\") 无法区分是哪种成功，容易出现“假绿”；硬编码账号与跨用例数据依赖会在并行执行时集中爆发。自动化资产同样需要分层封装（PageObject 或 API 层）、语义化定位、显式与自动等待、断言到字段级、数据自造自清，并与业务代码一起走评审与 CI。度量口径也要跟上：除用例通过率外，还要看 flaky 率、平均修复时长与维护工时占比。", "kaodian": "AI质量保障-自动化测试-自动化脚本需评审维护"}, {"no": 6, "type": "judge", "body": "用例评审时，预期结果写成“页面显示正常、符合需求”就够了，具体数值由执行人临场判断。", "code": "用例 TC-1201\n步骤：输入手机号 138****0000，点击“获取验证码”\n预期结果：页面显示正常，符合需求\n\n用例 TC-1202\n步骤：同上\n预期结果：1) 按钮变为倒计时“60s”且置灰不可点\n         2) 接口 POST /api/sms/code 返回 HTTP 200 且 body.code=0\n         3) 60s 内重复点击不发起第二次请求", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "错误。预期结果必须唯一、可观测、可判定，否则不同执行人会得出不同结论，缺陷也无法被证明——TC-1201 这种写法既不能自动化，也无法在与开发争议时作为依据，更没法回归复用。TC-1202 才是合格样例：把 UI 状态、接口状态码与业务 code、防重复提交行为都写成可核对的具体断言点。规范做法是“步骤—预期”一一对应，涉及接口的用例给出请求与响应关键字段，涉及数据落库的给出校验点，必要时附上不该发生的行为（如不应发起第二次请求）。", "kaodian": "AI质量保障-软件测试理论与质量体系-预期结果必须明确可判定"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
const esc = s => (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+esc(o.t)+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+esc(sec.name)+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+esc(q.kaodian)+'">'+esc(q.kaodian)+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):esc(q.body))+'</div>';
      if(q.code) html += '<div class="code">'+esc(q.code)+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+esc(q.explain)+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); if(new URLSearchParams(location.search).get('mode')==='wrong' && rec.wrong && rec.wrong.length){ toggleOnlyWrong(); } } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  // 兼容旧数据：wrong 数组元素可能是字符串（早期版本存的是 c.dataset.no 字符串）
  const wrongSet = new Set((saved.wrong||[]).map(n=>Number(n)));
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no);
    if(!q){ console.warn('restore: question not found for card', card.dataset.no); return; }
    const gno = Number(card.dataset.no);
    const ok = !wrongSet.has(gno);
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
