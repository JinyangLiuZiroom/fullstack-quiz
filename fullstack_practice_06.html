<script type="application/json" id="quizData">{"id": "vol06", "title": "全栈转型模拟自测卷", "sub": "可答题 · 交卷判分 · 自动记录错题", "meta": "对齐公司真实考法：<b>单选 / 多选 / 判断</b>，每题包含完整代码场景，问执行结果、补全代码、判断框架用法正误。<br>本卷共 <b>33 题</b>：单选 20（60 分）+ 多选 7（28 分）+ 判断 6（12 分）= 100 分。<br>难度：<b>实战细节型</b>，考点标签采用公司标准层级命名。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "以下代码执行后，列表 list 的内容是？", "code": "List<Integer> list = new ArrayList<>(Arrays.asList(1, 2, 3, 4));\nlist.remove(2);          // 注意：传入的是 int\nSystem.out.println(list);", "options": [{"k": "A", "t": "[1, 2, 4]（移除下标 2 的元素，即值为 3 的元素）"}, {"k": "B", "t": "[2, 3, 4]（移除元素值为 2 的元素）"}, {"k": "C", "t": "[1, 3, 4]"}, {"k": "D", "t": "编译错误，remove 不接受 int 参数"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 语言与计算层 - 集合 API。List 有两个 remove 重载：remove(int index) 按索引删除、remove(Object o) 按元素删除。传入字面量 2 是 int，编译器优先匹配 remove(int)，删除下标 2 的元素（值为 3），结果 [1,2,4]。若要删除元素值 2，须写 list.remove(Integer.valueOf(2))。", "android": "类似 Kotlin List 的 removeAt(index) 与 remove(element) 是两个不同方法，类型不同走不同的重载——歧义来自重载决议。", "kaodian": "AI 后端能力 - 语言基础层 - Java 集合/基础"}, {"no": 2, "type": "single", "body": "关于 Java 的四种引用类型，以下说法正确的是？", "code": "WeakHashMap<Key, Value> map = new WeakHashMap<>();\nKey k = new Key(\"k1\");\nmap.put(k, new Value(\"v1\"));\nk = null;            // 外部强引用断开\nSystem.gc();         // 触发 GC\nSystem.out.println(map.size());", "options": [{"k": "A", "t": "map 仍包含 1 个元素，因为 WeakHashMap 内部持有强引用"}, {"k": "B", "t": "GC 后 key 被回收，WeakHashMap 自动移除该 entry，size 变为 0"}, {"k": "C", "t": "虚引用 (PhantomReference) 可在对象被回收前通过它访问对象字段"}, {"k": "D", "t": "软引用 (SoftReference) 在每次 GC 时都会被立即回收"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 语言与计算层 - JVM 内存管理。WeakHashMap 的 key 是弱引用，外部强引用断开后下次 GC 即回收 key，对应 entry 自动清除。软引用在内存不足（OOM 前）才回收；虚引用不能通过它访问对象，仅用于跟踪回收通知（配合 ReferenceQueue）；强引用不释放则 GC 无法回收。", "android": "类似 WeakReference 在 Android 中防止 Activity 泄漏（Handler/Context 用弱引用），GC 时自动断开避免内存泄漏。", "kaodian": "AI 后端能力 - 框架与容器层 - AOP 环绕通知"}, {"no": 3, "type": "single", "body": "线程池 corePoolSize=2、maximumPoolSize=2、workQueue 为有界队列（容量 1）。当已有 2 个线程在跑且队列已满，再提交第 4 个任务时，若拒绝策略为 CallerRunsPolicy，会怎样？", "code": "ThreadPoolExecutor pool = new ThreadPoolExecutor(\n    2, 2, 0L, TimeUnit.MILLISECONDS,\n    new ArrayBlockingQueue<>(1),\n    new ThreadPoolExecutor.CallerRunsPolicy());", "options": [{"k": "A", "t": "抛出 RejectedExecutionException"}, {"k": "B", "t": "由提交任务的线程（调用者线程）自己执行该任务"}, {"k": "C", "t": "静默丢弃该任务"}, {"k": "D", "t": "丢弃队列中最老的任务并把新任务入队"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 语言与计算层 - 线程与并发。四种拒绝策略：AbortPolicy（默认抛异常）、CallerRunsPolicy（由调用者线程执行，起到负反馈限流作用）、DiscardPolicy（静默丢弃）、DiscardOldestPolicy（丢弃队列头任务再入队）。此处线程满+队列满，CallerRunsPolicy 让提交线程自己跑，缓解提交速度。", "android": "类似你用 Executor 提交任务超限时主线程兜底执行（如 coalescing 任务），既是降级也是限流。", "kaodian": "AI 后端能力 - 框架与容器层 - 异步与线程池"}, {"no": 4, "type": "single", "body": "需要让 N 个工作线程反复在多个回合的“集合点”汇合（每轮全部到齐再同时继续，且可重复多轮），应选用？", "code": "for (int round = 0; round < ROUNDS; round++) {\n    // 等待所有线程到齐后一起进入下一阶段\n}", "options": [{"k": "A", "t": "CountDownLatch（每轮 new 一个，一次性）"}, {"k": "B", "t": "CyclicBarrier（可重置、可循环使用，所有线程到 barrier 后放行并自动重置）"}, {"k": "C", "t": "Semaphore"}, {"k": "D", "t": "Exchanger（只能两两交换数据）"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 语言与计算层 - 线程与并发。CountDownLatch 是一次性计数器（countDown 到 0 后不可复用）；CyclicBarrier 可循环使用，所有线程调用 await() 到齐后放行，并自动重置可进入下一轮，还支持 barrierAction。Exchanger 仅用于两个线程交换数据。", "android": "类似多人游戏每局“全部加载完再开始”，CyclicBarrier 就是可重开的回合栅栏。", "kaodian": "AI 后端能力 - 语言基础层 - Java 集合/基础"}, {"no": 5, "type": "single", "body": "类中有两个方法：静态方法 staticMethod 用 synchronized 修饰，实例方法 instMethod 用 synchronized 修饰。线程 T1 执行 staticMethod、线程 T2 同时执行 instMethod，二者会互斥阻塞吗？", "code": "class S {\n    public static synchronized void staticMethod() { /* 锁 S.class */ }\n    public synchronized void instMethod() { /* 锁 this */ }\n}", "options": [{"k": "A", "t": "会，因为都是 synchronized，全局互斥"}, {"k": "B", "t": "不会，静态方法锁 Class 对象、实例方法锁实例对象，二者锁不同，不互斥"}, {"k": "C", "t": "会，因为实例方法内部调用了静态方法"}, {"k": "D", "t": "不一定，取决于线程优先级"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 语言与计算层 - 线程与并发。synchronized 静态方法锁定的是类的 Class 对象（S.class），实例方法锁定的是当前对象实例（this）。两个锁对象不同，彼此不互斥，可并行执行。只有两个线程都锁同一个对象（同一个 Class 或同一个实例）才会互斥。", "android": "类似 synchronized 锁的是不同 monitor，类锁和对象锁是两把不同的锁，互不干扰。", "kaodian": "AI 后端能力 - 语言基础层 - 死锁条件"}, {"no": 6, "type": "single", "body": "超高并发（数百线程）下频繁对一个计数器做自增，相比 AtomicLong，更推荐使用？", "code": "counter.increment();   // 每个请求都自增的热点计数", "options": [{"k": "A", "t": "AtomicLong（单 CAS，热点下竞争激烈、自旋开销大）"}, {"k": "B", "t": "LongAdder（内部 Cell 分段，热点分散，高并发吞吐更高）"}, {"k": "C", "t": "synchronized long 字段（性能最佳）"}, {"k": "D", "t": "volatile long 字段（无需 CAS）"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 语言与计算层 - 线程与并发。AtomicLong 所有线程竞争同一个 CAS 变量，高并发下自旋重试多。LongAdder（JDK8）采用分段 Cell 数组，线程各自累加本地 Cell，最终 sum() 汇总，显著降低竞争，适合“高并发写、偶尔读汇总”的计数场景（如 QPS 统计）。读 sum() 不保证瞬时精确但足够统计。", "android": "类似你在多线程统计点击数，分散到多个本地计数器再汇总，比一个全局锁计数快得多。", "kaodian": "AI 后端能力 - 语言基础层 - 并发与 volatile"}, {"no": 7, "type": "single", "body": "已知 Sub 继承 Super，Super 有 static int VALUE=10 和 static 块打印。执行 System.out.println(Sub.VALUE); 会触发哪个类的初始化？", "code": "class Super { static int VALUE = 10; static { System.out.println(\"Super init\"); } }\nclass Sub extends Super { static { System.out.println(\"Sub init\"); } }", "options": [{"k": "A", "t": "只初始化 Super，不初始化 Sub（通过子类引用父类静态字段属于被动引用）"}, {"k": "B", "t": "Super 和 Sub 都会初始化"}, {"k": "C", "t": "只初始化 Sub"}, {"k": "D", "t": "都不初始化（VALUE 是编译期常量，直接内联）"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 语言与计算层 - JVM 类加载。主动引用才触发初始化（new、访问自身静态字段/方法、反射等）。通过子类访问“父类”的静态字段属于被动引用，只初始化父类，不初始化子类。若 VALUE 是 final 编译期常量才会被内联、连父类初始化都不触发；此处是静态非常量，父类会初始化。", "android": "类似你访问父类的 companion object 常量，子类不会因此被加载——类的加载是按需触发的。", "kaodian": "AI 后端能力 - 语言基础层 - JVM 内存模型"}, {"no": 8, "type": "single", "body": "Service 内有方法 a() 调用同类的 @Async 方法 b()。期望 b() 异步执行，但实测 b() 同步执行了。原因是？", "code": "@Service\npublic class OrderService {\n    public void a() { b(); }          // 同类内部调用\n    @Async\n    public void b() { /* 重活 */ }\n}", "options": [{"k": "A", "t": "@Async 只能标注在 static 方法上"}, {"k": "B", "t": "同类内部调用绕过了 Spring 代理，@Async 不生效，b() 由当前线程同步执行"}, {"k": "C", "t": "需要在方法 b 上加 @Transactional 才异步"}, {"k": "D", "t": "Spring Boot 默认未开启异步，@Async 完全无效"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 应用框架层 - 异步与定时。@Async 基于 AOP 代理实现；同类 this.b() 是直接调用，没经过代理，注解不生效。解决：① 自注入（@Autowired 自己）后调用代理对象；② 抽到另一个 @Component 中调用；③ 用 ApplicationContext 获取代理。另外需 @EnableAsync 开启。", "android": "类似你在 Activity 里直接调自己的方法，绕过了你封装的“埋点/异步”代理，异步就丢了。", "kaodian": "AI 后端能力 - 框架与容器层 - AOP 环绕通知"}, {"no": 9, "type": "single", "body": "使用 Spring Cache 的 @Cacheable。关于 condition 与 unless，正确的是？", "code": "@Cacheable(cacheNames=\"user\", key=\"#id\", condition=\"#id>0\", unless=\"#result==null\")\npublic User getUser(Long id) { ... }", "options": [{"k": "A", "t": "condition 在调用前判断（为 false 则不查缓存直接执行方法）；unless 在方法返回后判断（为 true 则不放入缓存）"}, {"k": "B", "t": "condition 与 unless 都是在方法执行后判断"}, {"k": "C", "t": "unless=\"#result==null\" 表示结果为 null 时也缓存"}, {"k": "D", "t": "key 表达式不支持 SpEL"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 应用框架层 - 声明式缓存。condition 在方法调用前求值，false 时跳过缓存（直接执行）；unless 在返回后求值，true 时不缓存结果（常用于不缓存 null 避免缓存穿透）。key 用 SpEL 表达式。底层依赖 CacheManager（如 RedisCacheManager），需 @EnableCaching。", "android": "类似给网络请求加内存缓存时，你也会写“参数为空不读缓存”“结果为空不写缓存”的过滤条件。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存穿透防护"}, {"no": 10, "type": "single", "body": "通过 @RestControllerAdvice 统一处理异常。以下说法正确的是？", "code": "@RestControllerAdvice\npublic class GlobalExceptionHandler {\n    @ExceptionHandler(BizException.class)\n    public Result<Void> handleBiz(BizException e) { return Result.fail(e.getCode()); }\n    @ExceptionHandler(Exception.class)\n    public Result<Void> handleAll(Exception e) { return Result.fail(500); }\n}", "options": [{"k": "A", "t": "异常先匹配最具体类型 (BizException)，匹配不到才匹配更宽泛的 Exception"}, {"k": "B", "t": "总是优先匹配 Exception（更宽泛的先匹配）"}, {"k": "C", "t": "多个 @ExceptionHandler 会全部执行"}, {"k": "D", "t": "@RestControllerAdvice 只能处理 Controller 层的 checked 异常"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 应用框架层 - Web 层统一处理。Spring 异常解析时按异常类型的“最近继承关系”选择最具体的 @ExceptionHandler（精确优先）。BizException 触发 handleBiz，其它未捕获异常兜底到 handleAll。@RestControllerAdvice = @ControllerAdvice + @ResponseBody，返回自动转 JSON。", "android": "类似你全局注册一个 UncaughtExceptionHandler，按异常类型 dispatch 到不同处理逻辑，具体优先。", "kaodian": "AI 前端能力 - 工程化与网络 - HTTP 状态码"}, {"no": 11, "type": "single", "body": "Spring Cloud Alibaba + Nacos 配置中心。修改 Nacos 上配置后，Bean 中 @Value 注入的值未更新。要使配置动态生效，应？", "code": "@Component\npublic class AppConfig {\n    @Value(\"${app.timeout:1000}\")\n    private int timeout;\n}", "options": [{"k": "A", "t": "在类上加 @RefreshScope（配合配置中心监听，Bean 在下次访问时重建并重新注入新值）"}, {"k": "B", "t": "重启应用"}, {"k": "C", "t": "把 @Value 改成 @Autowired"}, {"k": "D", "t": "在字段上加 @Dynamic"}], "answer": ["A"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 配置中心 (Nacos)。Nacos 客户端监听配置变更并发布 RefreshEvent；标注 @RefreshScope 的 Bean 会被销毁并在下次访问时重新创建，从而重新执行 @Value 注入拿到新值。未加 @RefreshScope 的单例 Bean 不会刷新。也可注入 ConfigurableEnvironment 实时读取。", "android": "类似你用 LiveData 包裹配置，配置变更时自动通知订阅方刷新 UI——@RefreshScope 是后端的“响应式刷新”。", "kaodian": "AI 后端能力 - 框架与容器层 - 配置绑定"}, {"no": 12, "type": "single", "body": "实体类主键用 @TableId(type = IdType.ASSIGN_ID)。插入时主键如何生成？", "code": "@TableId(type = IdType.ASSIGN_ID)\nprivate Long id;", "options": [{"k": "A", "t": "由数据库自增列生成"}, {"k": "B", "t": "由 MyBatis-Plus 用雪花算法 (Snowflake) 生成 19 位 Long 并填入"}, {"k": "C", "t": "由开发者手动 set 后传入"}, {"k": "D", "t": "使用 UUID 字符串"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 数据存储与持久化层 - MyBatis-Plus。IdType 枚举：AUTO（数据库自增）、INPUT（手动输入）、ASSIGN_ID（雪花算法，默认全局唯一，适合分布式）、ASSIGN_UUID（UUID 去横杠）。ASSIGN_ID 不依赖数据库自增列，适合分库分表场景。若数据库已设自增列且想用它，应配 AUTO。", "android": "类似 Room 的 @PrimaryKey(autoGenerate=true) 是数据库自增；ASSIGN_ID 更像是客户端生成 UUID 当主键，便于分布式。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 持久化"}, {"no": 13, "type": "single", "body": "映射“一个订单含多个订单项”。应在 resultMap 中用哪个标签关联？", "code": "<resultMap id=\"orderMap\" type=\"Order\">\n    <id property=\"id\" column=\"id\"/>\n    <!-- 关联多个 OrderItem -->\n</resultMap>", "options": [{"k": "A", "t": "<association property=\"items\" .../>（一对一/多对一）"}, {"k": "B", "t": "<collection property=\"items\" ofType=\"OrderItem\" .../>（一对多/多对多）"}, {"k": "C", "t": "<discriminator>"}, {"k": "D", "t": "<foreach>"}], "answer": ["B"], "explain": "考点：AI 后端能力 - 数据存储与持久化层 - 结果映射。association 用于“多对一/一对一”（如 Order 关联 User）；collection 用于“一对多”（如 Order 关联 List<OrderItem>），用 ofType 指定集合元素类型。嵌套时常用嵌套 SELECT 或嵌套结果。注意一对多用 JOIN 易笛卡尔积膨胀，配合 groupBy 或分步查询。", "android": "类似 Room 的 @Relation 一对多（一个 User 对应多张 Post），collection 就是后端版的 @Relation。", "kaodian": "AI 后端能力 - 数据库与ORM层 - JOIN 语义"}, {"no": 14, "type": "single", "body": "以下代码输出？", "code": "const obj = {\n  name: 'A',\n  foo() { return () => console.log(this.name); }\n};\nconst f = obj.foo();\nf();", "options": [{"k": "A", "t": "'A'（箭头函数继承定义时外层 foo 的 this，即 obj）"}, {"k": "B", "t": "undefined"}, {"k": "C", "t": "''（空字符串）"}, {"k": "D", "t": "报错"}], "answer": ["A"], "explain": "考点：AI 前端能力 - 语言与运行时 (JS/TS/Vue/小程序) - this 与闭包。箭头函数没有自己的 this，它捕获的是“定义时”外层作用域的 this。obj.foo() 调用时 this=obj，返回的箭头函数沿用该 this，故打印 'A'。若换成普通 function 则返回函数 this 取决于调用方式（默认全局/undefined）。", "android": "类似 Kotlin 的 this@Outer 显式捕获外层的 this，箭头函数也是“词法捕获 this”。", "kaodian": "AI 后端能力 - 框架与容器层 - Bean 作用域"}, {"no": 15, "type": "single", "body": "以下代码，点击列表中的任意 <li> 都能触发处理。这是利用了？", "code": "<ul id=\"list\">\n  <li>1</li><li>2</li><li>3</li>\n</ul>\n<script>\n  document.getElementById('list').addEventListener('click', e => {\n    if (e.target.tagName === 'LI') console.log(e.target.textContent);\n  });\n<\/script>", "options": [{"k": "A", "t": "事件冒泡 + 在父元素上统一监听（事件委托）"}, {"k": "B", "t": "每个 li 都单独 addEventListener"}, {"k": "C", "t": "事件捕获阶段拦截"}, {"k": "D", "t": "定时器轮询 DOM"}], "answer": ["A"], "explain": "考点：AI 前端能力 - 语言与运行时 (JS/TS/Vue/小程序) - DOM 事件。事件委托利用事件冒泡：点击 li 会冒泡到 ul，在 ul 上统一监听，通过 e.target 判断实际点击元素。好处：动态新增的 li 也能生效、减少监听器数量、提升性能。e.target 是实际触发元素，e.currentTarget 是绑定监听的元素。", "android": "类似 RecyclerView 的 onItemClick 在 Adapter 里统一处理（或 setOnClickListener 复用），而非给每个 item 单独设监听。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 类型转换"}, {"no": 16, "type": "single", "body": "Vue3 中 const count = ref(0)。在模板和脚本中分别如何访问其值？", "code": "const count = ref(0);\ncount.value++;   // 脚本中\n// 模板中：{{ ??? }}", "options": [{"k": "A", "t": "模板中写 count（自动解包），脚本中用 count.value"}, {"k": "B", "t": "模板和脚本中都用 count.value"}, {"k": "C", "t": "模板中用 count.value，脚本中用 count"}, {"k": "D", "t": "两者都用 count"}], "answer": ["A"], "explain": "考点：AI 前端能力 - 语言与运行时 (JS/TS/Vue/小程序) - 数据绑定。ref 是对基本类型/对象的包装，脚本里必须 .value 访问；模板里在顶层绑定会自动“解包”（无需 .value）。reactive 对象则直接 .属性 访问、无需 .value。若 ref 嵌套在 reactive 对象中，模板也会自动解包。", "android": "类似 LiveData 在 XML 里用观察者自动取值，在代码里用 .value 取——两层访问方式不同。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 响应式"}, {"no": 17, "type": "single", "body": "两个绝对定位元素，都未设置 z-index，b 在 DOM 中靠后。它们的覆盖关系是？", "code": "<div class=\"a\"></div>\n<div class=\"b\"></div>   /* a、b 都 position:absolute，无 z-index */", "options": [{"k": "A", "t": "后面的 b 覆盖前面的 a（同层叠上下文内，后渲染的在上）"}, {"k": "B", "t": "前面的 a 覆盖 b"}, {"k": "C", "t": "取决于元素宽度"}, {"k": "D", "t": "z-index 默认 999"}], "answer": ["A"], "explain": "考点：AI 前端能力 - 前端基础与渲染引擎 - CSS 定位。同属一个层叠上下文且都无 z-index（auto）时，按 DOM 顺序（后来居上）绘制，靠后的 b 盖住 a。z-index 只在同一/新建层叠上下文内比较有效；opacity<1、transform、position 非 static 等会创建新层叠上下文，改变比较范围。", "android": "类似 FrameLayout 中子 View 后 add 的盖在上面，z 序由添加顺序决定。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 定位与层叠"}, {"no": 18, "type": "single", "body": "接口返回 Cache-Control: max-age=60 且 ETag: \"abc\"。60 秒内再次请求会怎样？", "code": "// 第一次响应头\nCache-Control: max-age=60\nETag: \"abc\"", "options": [{"k": "A", "t": "直接用本地强缓存，不发请求（max-age 内命中强缓存）"}, {"k": "B", "t": "每次都发请求带 If-None-Match 校验"}, {"k": "C", "t": "60 秒后也永不发请求"}, {"k": "D", "t": "ETag 会阻止任何缓存"}], "answer": ["A"], "explain": "考点：AI 前端能力 - 前端生态 - HTTP 缓存。max-age=60 表示 60 秒内为强缓存，浏览器直接用本地副本、不发请求（from memory/disk cache）。超过 60 秒进入协商缓存阶段，浏览器带 If-None-Match: \"abc\" 询问服务端，服务端比对 ETag 未变则返回 304 继续用缓存。强缓存优先级高于协商缓存。", "android": "类似 Retrofit/OkHttp 的 Cache-Control 拦截器，max-age 内直接用缓存响应，省去网络往返。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息可靠性-Kafka"}, {"no": 19, "type": "single", "body": "关于 ES Module 与 CommonJS，正确的是？", "code": "// a.mjs\nexport const x = 1;\n// b.mjs\nimport { x } from './a.mjs';", "options": [{"k": "A", "t": "ES Module 是静态编译期确定依赖、可 tree-shaking；CommonJS 是运行时 require 动态加载"}, {"k": "B", "t": "ES Module 的 import 必须在运行时才能解析"}, {"k": "C", "t": "CommonJS 的 export 是值引用，改了外部能感知"}, {"k": "D", "t": "两者完全等价，只是写法不同"}], "answer": ["A"], "explain": "考点：AI 前端能力 - 语言与运行时 (JS/TS/Vue/小程序) - 模块化。ESM（import/export）在编译期静态分析依赖图，支持 tree-shaking 摇树优化（Vite/webpack 据此删未用代码），且是异步、只读绑定。CommonJS（require/module.exports）运行时加载、动态、导出的是值拷贝（基本类型改了外部不知）。现代前端构建用 ESM。", "android": "类似 Gradle 的 implementation vs api 依赖，静态依赖图让编译器能做未使用代码的剔除（R8/ProGuard）。", "kaodian": "AI 后端能力 - 框架与容器层 - 异步与线程池"}, {"no": 20, "type": "single", "body": "以下 Promise 链，最终会进入 then 还是 catch？", "code": "Promise.resolve(1)\n  .then(v => { throw new Error('boom'); })\n  .then(v => console.log('then'))\n  .catch(e => console.log('caught: ' + e.message));", "options": [{"k": "A", "t": "进入 catch 打印 'caught: boom'（中间 then 因前序抛错被跳过）"}, {"k": "B", "t": "进入 then 打印 'then'"}, {"k": "C", "t": "既不进 then 也不进 catch"}, {"k": "D", "t": "两个都会执行"}], "answer": ["A"], "explain": "考点：AI 前端能力 - 语言与运行时 (JS/TS/Vue/小程序) - 异步与 Promise。Promise 链中一旦某环节 reject/throw，后续 then 被跳过，直接落到最近的 catch。第一个 then 抛错后，第二个 then 不执行，错误被末尾 catch 捕获。若想让错误后流程继续，需在中间加 catch 处理。这是“错误穿透”特性。", "android": "类似 Kotlin 协程的异常会沿 Job 树向上传播，中间未捕获的 suspend 异常会被外层 CoroutineExceptionHandler 接住。", "kaodian": "AI 后端能力 - 框架与容器层 - 异步与线程池"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "关于 MySQL 的 COUNT(*)、COUNT(1)、COUNT(列)，正确的有：（多选、少选、错选均不得分）", "code": "SELECT COUNT(*) FROM t;\nSELECT COUNT(1) FROM t;\nSELECT COUNT(name) FROM t;", "options": [{"k": "A", "t": "COUNT(*) 统计行数，不忽略 NULL，优化器有专门优化"}, {"k": "B", "t": "COUNT(1) 与 COUNT(*) 语义一致（都按行计），性能基本无差"}, {"k": "C", "t": "COUNT(列) 只统计该列非 NULL 的行"}, {"k": "D", "t": "统计总行数应优先用 COUNT(列) 以保证精确"}], "answer": ["A", "B", "C"], "explain": "考点：AI 后端能力 - 数据存储与持久化层 - SQL 基础。A/B/C 正确。D 错误：统计总行数用 COUNT(*) 最规范、最稳；COUNT(列) 会漏掉该列为 NULL 的行，且未必更快。三者中 COUNT(*) 是官方推荐写法。", "android": "类似 Kotlin list.count { it.name != null } 与 list.size，前者排除空值——语义一致。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 聚合统计语义"}, {"no": 22, "type": "multi", "body": "关于 MySQL 索引下推 (Index Condition Pushdown, ICP)，正确的有：（多选、少选、错选均不得分）", "code": "SELECT * FROM user WHERE name LIKE '张%' AND age = 20;  -- 联合索引 (name, age)", "options": [{"k": "A", "t": "ICP 在存储引擎层就用索引列条件 (age=20) 提前过滤，减少回表"}, {"k": "B", "t": "EXPLAIN 的 Extra 出现 “Using index condition” 表示 ICP 生效"}, {"k": "C", "t": "ICP 只对联合索引有效，且条件必须是索引列"}, {"k": "D", "t": "没有 ICP 时，符合条件的回表行会在 Server 层才被 age 过滤"}], "answer": ["A", "B", "C", "D"], "explain": "考点：AI 后端能力 - 数据存储与持久化层 - 索引优化。全部正确。ICP 把本应在 Server 层做的“索引列过滤”下推到存储引擎，减少回表 IO（B/D 描述对比）。仅作用于索引列、需联合/二级索引场景，单列或回表后才有的条件无法下推。", "android": "类似你在数据库查询后还会在内存里再 filter 一次；ICP 是把这个 filter 下推到存储引擎，省去无效回表。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 索引与最左前缀"}, {"no": 23, "type": "multi", "body": "关于 Redis 数据结构的典型使用场景，正确的有：（多选、少选、错选均不得分）", "code": null, "options": [{"k": "A", "t": "HyperLogLog：上亿级 UV 近似去重统计（误差约 0.81%，内存极小）"}, {"k": "B", "t": "Bitmap：用户每日签到（每位代表一天，SETBIT/GETBIT）"}, {"k": "C", "t": "ZSET：排行榜（按分数排序、ZREVRANGE 取 Top N）"}, {"k": "D", "t": "Stream：可持久化、支持消费者组的消息队列（替代简单 Pub/Sub 防丢消息）"}], "answer": ["A", "B", "C", "D"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - Redis 数据结构。四个均正确。HyperLogLog 省内存估基数；Bitmap 用位存布尔状态（签到/在线）；ZSET 跳表按分排序适合排行；Stream（Redis 5.0+）弥补 Pub/Sub 不持久化、无消费者组的短板，适合可靠队列。", "android": "类似 Android 里不同数据结构选型：SparseArray vs HashMap、Bitmap 位标记在线状态——都是“按场景选结构”。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 数据结构选型"}, {"no": 24, "type": "multi", "body": "用 Redis 实现安全的分布式锁，正确的有：（多选、少选、错选均不得分）", "code": "SET key uuid NX EX 30   // 原子获取锁", "options": [{"k": "A", "t": "获取锁用一条原子命令 SET key uuid NX EX 30（不存在才设值并带过期，防死锁）"}, {"k": "B", "t": "释放锁用 Lua 脚本：先比对 value(uuid) 再 DEL，避免误删他人锁"}, {"k": "C", "t": "业务执行时间可能超过锁过期时间时，应有“看门狗”自动续期"}, {"k": "D", "t": "用 GET 判断锁是否存在再 SET，两步分开也能保证安全"}], "answer": ["A", "B", "C"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 分布式锁。D 错误：GET 再 SET 是“读-改-写”非原子，并发下多进程都判定“无锁”然后都 SET，锁失效。正确做法：SET NX EX 原子获取、Lua 原子释放、Redisson 看门狗续期。value 用唯一 uuid 防止误删。", "android": "类似你用 SharedPreferences 先读再写会竞态；应用层“读-改-写”必须合成原子操作（如用事务或加锁）。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 索引失效"}, {"no": 25, "type": "multi", "body": "关于浏览器跨域 (CORS)，正确的有：（多选、少选、错选均不得分）", "code": null, "options": [{"k": "A", "t": "简单请求 (GET/POST 且头字段合规) 直接发，响应需带 Access-Control-Allow-Origin"}, {"k": "B", "t": "非简单请求 (如带自定义头/PUT/Content-Type:application/json) 会先发 OPTIONS 预检，通过后发真实请求"}, {"k": "C", "t": "预检请求由浏览器自动发起，开发者无需手写 OPTIONS"}, {"k": "D", "t": "服务端设置 Access-Control-Allow-Origin: * 即可允许任何源（含带凭证请求）"}], "answer": ["A", "B", "C"], "explain": "考点：AI 前端能力 - 前端生态 - 跨域。简单请求直接发、响应带允许源；非简单请求浏览器自动先发 OPTIONS 预检（开发者不用手写），预检通过才发实际请求。带 Cookie 凭证的请求 Access-Control-Allow-Origin 不能为 *、必须具体源且 Access-Control-Allow-Credentials: true。CORS 是浏览器同源策略的安全机制，服务端不参与则被拦截。", "android": "类似你做混合开发时 WebView 与 native 的跨域桥接，需要两端约定好 origin/白名单才能通信。", "kaodian": "AI 前端能力 - 工程化与网络 - CORS 跨域"}, {"no": 26, "type": "multi", "body": "关于缺陷的严重程度 (Severity) 与优先级 (Priority)，正确的有：（多选、少选、错选均不得分）", "code": null, "options": [{"k": "A", "t": "Severity 描述缺陷造成的危害程度（如崩溃/数据丢失为高）"}, {"k": "B", "t": "Priority 描述修复的紧急程度（由业务方/开发排期决定）"}, {"k": "C", "t": "一个 UI 文字错别字可能 Severity 低但 Priority 高（上线前必须改）"}, {"k": "D", "t": "Severity 与 Priority 必然一一对应（高 Severity 一定高 Priority）"}], "answer": ["A", "B", "C"], "explain": "考点：AI 质量保障 - 软件测试理论与质量体系 - 缺陷管理。Severity 是技术危害度（由测试定），Priority 是修复先后（由 PM/开发定），二者解耦。典型例子：线上崩溃 Severity 高 Priority 高；错别字 Severity 低但临近发布 Priority 高；底层隐蔽 bug 可能 Severity 高但短期无触发路径 Priority 低。", "android": "类似你评估一个崩溃（Severity 高）但只在极冷门路径触发（Priority 可排后），和文案 bug（Severity 低）但运营要求上线前必改（Priority 高）。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息队列场景"}, {"no": 27, "type": "multi", "body": "关于自动化测试的分层与选型，正确的有：（多选、少选、错选均不得分）", "code": null, "options": [{"k": "A", "t": "单元测试数量最多、执行最快、最稳定，应占最大比例"}, {"k": "B", "t": "端到端 (E2E) 测试成本高、易脆、慢，应占比最小"}, {"k": "C", "t": "UI 自动化适合做核心主流程的冒烟，不宜覆盖所有细枝末节"}, {"k": "D", "t": "接口自动化 (API 测试) 性价比高，适合覆盖大量业务分支"}], "answer": ["A", "B", "C", "D"], "explain": "考点：AI 质量保障 - 质量工程 - 测试金字塔。经典金字塔：底层单元测试多而快，中层 API/集成，顶层 UI/E2E 少而贵。接口自动化不依赖 UI、稳定且能覆盖业务分支，是性价比最高的投入点。UI 自动化只保核心链路。全靠 E2E 会慢且脆。", "android": "类似 Android 测试分层：JUnit（多）+ Espresso/UI（少），你不会给每个 UI 细节都写 E2E。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 测试金字塔"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 28, "type": "judge", "body": "TIMESTAMP 与时区无关、全局一致；DATETIME 存储时会按会话时区转换。两者的时区行为恰好相反。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：AI 后端能力 - 数据存储与持久化层 - 表结构。恰恰相反：TIMESTAMP 才与时区相关（存储/读取按会话时区转 UTC/转回），DATETIME 原样存储、与时区无关。跨时区系统常用 DATETIME 存 UTC 或在应用层统一时区，避免 TIMESTAMP 时区错乱。", "android": "类似你存 Instant（UTC）还是本地时间字符串——一个全局一致，一个取决于设备时区。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 持久化"}, {"no": 29, "type": "judge", "body": "用 RabbitMQ 实现“订单 30 分钟未支付自动关闭”，标准做法是：业务队列设置消息 TTL=30min 并绑定死信交换机，消息过期变死信转发到消费队列，由消费者监听死信队列实现延迟处理。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 消息队列 (RabbitMQ)。正确。消息在 TTL 到期后成为“死信”被 DLX 路由到死信队列，实现延迟消费。注意队列级 TTL 整批到期、消息级 TTL 各自到期；也可装 rabbitmq_delayed_message_exchange 插件原生延时。切忌用消费者 sleep 实现（占线程且不可靠）。", "android": "类似你用 WorkManager 的 InitialDelay 或 AlarmManager 定时触发——把“延迟”交给可靠调度而非阻塞线程。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 分区消费"}, {"no": 30, "type": "judge", "body": "Kafka 消费者设为 enable.auto.commit=false，并在“处理完一批消息后再 commitSync()”即可保证精确一次 (Exactly-Once) 语义，无需业务幂等。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：AI 后端能力 - 高并发与中间件层 - 消息队列 (Kafka)。手动提交+处理后提交只能保证“至少一次”：处理中宕机未提交会重投，导致重复消费。要精确一次需配合幂等生产者和事务，且业务消费逻辑必须幂等（唯一约束/去重表）。仅靠手动提交无法消除重复。", "android": "类似你处理推送消息后回 ACK，若没回 ACK 会重发——因此 onMessage 里必须保证幂等，重复处理不出错。", "kaodian": "AI 后端能力 - 框架与容器层 - 接口幂等"}, {"no": 31, "type": "judge", "body": "Vue 中 v-for 渲染列表时，不写 :key 也能正常渲染，因此 key 是可选的、对功能无影响。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：AI 前端能力 - 语言与运行时 (JS/TS/Vue/小程序) - 渲染。v-for 不写 key 能渲染，但在列表增删/重排时 Vue 会按“就地复用”策略，可能导致状态错乱（如输入框内容错位）。key 给每个节点稳定标识，让 Diff 算法精准匹配、复用/移动节点，避免 BUG。官方要求 v-for 必须加 key（用稳定唯一值，重排场景别用 index 当 key）。", "android": "类似 RecyclerView 必须给 Adapter 稳定 getItemId，否则局部刷新/动画会错位——key 就是Diff的坐标系。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 v-if 与 v-for"}, {"no": 32, "type": "judge", "body": "探索性测试 (Exploratory Testing) 是“边学、边设计、边执行”的测试方法，依赖测试人员的经验和直觉，不需要预先编写详细测试用例。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：AI 质量保障 - 软件测试理论与质量体系 - 测试方法。探索性测试强调测试设计与执行并行，测试人员根据实时观察调整策略，适合时间紧或需求模糊场景。它和脚本化测试互补，并非“不专业”——资深测试的探索性测试常能发现脚本遗漏的深层问题。", "android": "类似你做手动复现/Ad-hoc 测试，边点边想边界，往往比机械跑用例更能撞出隐藏 bug。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 测试用例设计"}, {"no": 33, "type": "judge", "body": "测试替身中，Stub 用于“提供预设返回值”，Mock 用于“预设期望并验证交互是否被调用”；二者用途不同，不能混为一谈。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：AI 质量保障 - 自动化测试能力 - Mock/Stub。Stub 关心“喂什么数据进去”（驱动被测逻辑），Mock 关心“某个依赖是否按预期被调用/调用几次/传什么参”（验证交互）。Mockito 的 when().thenReturn() 是 stub，verify() 是 mock 验证。混淆二者会导致测试意图不清。", "android": "类似你写单元测试时，Fake 假数据驱动逻辑 (Stub)、verify 验证方法是否被调用 (Mock)——职责不同。", "kaodian": "AI 质量保障 - 自动化测试与工具 - 单元测试 Mock"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
