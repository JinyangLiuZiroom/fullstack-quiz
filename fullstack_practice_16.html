<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2329; margin: 0; padding: 24px 24px 96px; line-height: 1.65; }
  .container { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }

  .meta { background: #fff; border-radius: 10px; padding: 14px 18px; margin: 16px 0 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); font-size: 14px; color: #41464b; }
  .meta b { color: #1664ff; }
  .backlink { display:inline-block; margin: 4px 0 10px; color:#1664ff; text-decoration:none; font-size:14px; }
  .backlink:hover { text-decoration: underline; }
  .section { margin-top: 28px; }
  .section h2 { font-size: 18px; margin: 0 0 12px; padding-left: 10px; border-left: 4px solid #1664ff; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card.correct { box-shadow: 0 0 0 2px #52c41a inset, 0 1px 3px rgba(0,0,0,.06); }
  .card.wrong { box-shadow: 0 0 0 2px #ff4d4f inset, 0 1px 3px rgba(0,0,0,.06); }
  .q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .q-no { font-weight: 700; font-size: 15px; }

  .tag-single { background: #e8f3ff; color: #1664ff; }
  .tag-multi  { background: #fff3e0; color: #d4860b; }
  .tag-judge  { background: #fde8f3; color: #c41d7f; }
  .tag-fill   { background: #e9f9ee; color: #1a9e4b; }
  .kaodian { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; background: #f0f2f5; color: #646a73; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-badge { font-size:12px; padding:2px 9px; border-radius:4px; font-weight:700; margin-left:auto; }

    background: #f7f8fa; border: 1.5px solid transparent; font-size: 14px; cursor: pointer; transition: all .12s; }
  .opt:hover { background: #eef2f7; }

  .opt.wrong { background: #fff1f0; border-color: #ff4d4f; }

    font-size:14px; min-width: 120px; border-radius:4px 4px 0 0; }

  .blank.wrong { border-bottom-color:#ff4d4f; background:#fff1f0; }
  .answer { display: none; margin-top: 14px; padding: 14px; background: #f0f9eb;
    border-left: 4px solid #67c23a; border-radius: 6px; font-size: 14px; }
  .answer.show { display: block; }
  .answer .ans { font-weight: 700; color: #1a9e4b; margin-bottom: 8px; font-size: 15px; }
  .answer .label { font-weight: 700; }
  .footer { text-align: center; color: #9aa0a6; font-size: 13px; margin: 30px 0 10px; }
  .bar { position: fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #e5e6eb;
    box-shadow: 0 -2px 10px rgba(0,0,0,.05); padding: 10px 16px; display:flex; gap:10px; align-items:center; justify-content:center; z-index: 50; }

  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }
  .bar .userbox a { color:#1664ff; cursor:pointer; text-decoration:none; }
  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }
  .result-panel.show { display:block; }
  .result-panel .score { font-size:30px; font-weight:800; color:#1664ff; }
  .result-panel .score small { font-size:15px; color:#646a73; font-weight:500; }
  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }
  .result-panel .wrongs a { display:inline-block; margin:3px 6px 3px 0; padding:2px 8px; background:#fff1f0; color:#ff4d4f; border-radius:4px; text-decoration:none; font-weight:600; }
  @media (max-width:600px) {
    body { padding: 12px 12px 100px; }
    .container { max-width: 100%; }
    h1 { font-size: 20px; }

    .card { padding: 14px 12px; margin-bottom: 10px; }

    .code { font-size: 11px; padding: 10px 10px; }
    .opt { padding: 8px 10px; font-size: 13px; }

    .btn { padding: 7px 12px; font-size: 13px; }
    .section h2 { font-size: 16px; }

<script type="application/json" id="quizData">{"id": "vol16", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "用 Redis 做「实时积分排行榜 Top10（分高在前）」，正确命令组合是？", "code": "ZINCRBY rank:score 10 user1001     // 加分\n// 取前 10 名（含分数）?", "options": [{"k": "A", "t": "ZREVRANGE rank:score 0 9 WITHSCORES"}, {"k": "B", "t": "ZRANGE rank:score 0 9 WITHSCORES"}, {"k": "C", "t": "LRANGE rank:score 0 9"}, {"k": "D", "t": "HGETALL rank:score"}], "answer": "A", "explain": "ZSET 按 score 升序存储，ZRANGE 取的是分数最低的 10 个；要「分高在前」必须用 ZREVRANGE（Redis 6.2+ 也可用 ZRANGE ... REV）。WITHSCORES 一并返回分值。查某人排名用 ZREVRANK（同样要 REV 版本，ZRANK 得到的是升序名次）。C/D 类型不匹配会报 WRONGTYPE。", "kaodian": "AI后端能力-高并发与中间件层-RedisZSET排行榜"}, {"no": 2, "type": "single", "body": "读写分离架构下，用户下单成功后立刻查询订单列表却查不到，最可能的原因与解法是？", "code": "写：master  →  binlog 同步  →  读：slave（延迟 200ms~2s）\n下单成功后立即 GET /order/list  →  空列表", "options": [{"k": "A", "t": "把从库数量翻倍就能消除延迟"}, {"k": "B", "t": "主从复制延迟；对「写后立即读」的场景强制走主库或读缓存兜底"}, {"k": "C", "t": "数据库索引缺失，加索引即可"}, {"k": "D", "t": "订单没写成功，属于事务 bug"}], "answer": "B", "explain": "主从异步复制天然存在延迟，写后马上读从库就可能读到旧快照。常见解法：① 关键路径「写后读」强制路由主库（如 ShardingSphere 的 HintManager、MyBatis 拦截器打标）；② 写成功后把结果放本地/分布式缓存直接返回；③ 前端乐观更新。加索引与延迟无关（C 错）；D 与现象不符（事务已提交）；增加从库只会让延迟情况更分散，不会消除（A 错）。", "kaodian": "AI后端能力-数据存储与ORM层-读写分离主从延迟"}, {"no": 3, "type": "single", "body": "希望某个 Bean 只在测试与开发环境注册，正确写法是？", "code": "@Configuration\npublic class MockPayConfig {\n  // 补全 ?\n  @Bean public PayClient mockPay() { return new MockPayClient(); }\n}", "options": [{"k": "A", "t": "用 @Lazy 延迟加载即可避免生产注册"}, {"k": "B", "t": "用 if (env.equals(\"dev\")) 包住 @Bean 注解"}, {"k": "C", "t": "在类或方法上加 @Profile({\"dev\",\"test\"})"}, {"k": "D", "t": "在 application.yml 里写 spring.profiles.active=dev 就能自动排除生产"}], "answer": "C", "explain": "@Profile 按激活的 profile 决定 Bean 是否注册，可标在配置类或 @Bean 方法上，是多环境隔离的标准做法。D 只是激活某个 profile，本身不构成排除条件（没 @Profile 的 Bean 在任何环境都会注册）；@Lazy 只影响初始化时机不影响是否注册（A 错）；注解是编译期元数据，不能被运行时 if 包裹（B 错）。更细粒度条件可用 @ConditionalOnProperty。", "kaodian": "AI后端能力-微服务与云原生层-Profile环境隔离"}, {"no": 4, "type": "single", "body": "下列 Kafka 消费代码存在什么风险？", "code": "while (true) {\n  ConsumerRecords<String,String> rs = consumer.poll(Duration.ofMillis(500));\n  for (ConsumerRecord<String,String> r : rs) handle(r);\n  consumer.commitSync();   // handle 抛异常则整批不提交\n}", "options": [{"k": "A", "t": "commitSync 会自动跳过失败消息，无任何风险"}, {"k": "B", "t": "poll 超时 500ms 会导致消息丢失"}, {"k": "C", "t": "Kafka 保证 Exactly-Once，不可能重复"}, {"k": "D", "t": "handle 在批中途抛异常时整批不提交，重启后已处理的消息会被重复消费，业务需幂等"}], "answer": "D", "explain": "手动提交位移的常见坑：一批 500 条处理到第 300 条抛异常，commitSync 没执行，位移仍停在批首，重启后前 300 条会再处理一遍。因此消费逻辑必须幂等（唯一键去重、状态机、幂等表），或改成逐条/分段提交并把失败消息投到重试/死信队列。Kafka 默认是 At-Least-Once，EOS 需要事务与 read_committed 配合（C 错）。", "kaodian": "AI后端能力-高并发与中间件层-Kafka位移提交与重复消费"}, {"no": 5, "type": "single", "body": "MyBatis-Plus 的 `saveOrUpdate(entity)` 判断走 insert 还是 update 的依据是？", "code": "User u = new User();\nu.setName(\"张三\");     // 未设置 id\nservice.saveOrUpdate(u);", "options": [{"k": "A", "t": "看主键是否为空：为空走 insert，非空则先按主键查存在性再决定 update 或 insert"}, {"k": "B", "t": "看所有字段是否都有值"}, {"k": "C", "t": "永远先 update，失败再 insert"}, {"k": "D", "t": "根据唯一索引自动判断，无需主键"}], "answer": "A", "explain": "saveOrUpdate 的逻辑是主键驱动：主键为空 → insert；主键非空 → 先 selectById 判断是否存在，存在则 updateById，不存在则 insert。因此它不认业务唯一键（D 错），高并发下「查后写」还存在竞态，可能触发唯一索引冲突——真正需要按唯一键去重时应用数据库的 ON DUPLICATE KEY / INSERT IGNORE 或加分布式锁。", "kaodian": "AI后端能力-数据存储与ORM层-MP保存或更新"}, {"no": 6, "type": "single", "body": "下列代码为什么 set.size() 是 2？", "code": "class P { String id;\n  P(String id){this.id=id;}\n  public boolean equals(Object o){ return o instanceof P && ((P)o).id.equals(id); }\n}\nSet<P> set = new HashSet<>();\nset.add(new P(\"1\")); set.add(new P(\"1\"));\nSystem.out.println(set.size());", "options": [{"k": "A", "t": "需要实现 Comparable 接口才能去重"}, {"k": "B", "t": "只重写了 equals 没重写 hashCode，两对象哈希不同被分到不同桶，equals 根本没被调用"}, {"k": "C", "t": "HashSet 不支持自定义对象去重"}, {"k": "D", "t": "equals 写错了，应该用 =="}], "answer": "B", "explain": "HashSet 去重流程是先比 hashCode 定位桶，同桶内再用 equals 比较。只重写 equals 而沿用 Object 的 hashCode（基于对象地址），两个内容相同的对象哈希值不同，直接落在不同桶，equals 没机会执行，于是重复存入。规范要求 equals 与 hashCode 必须同时重写并保持一致：equals 相等则 hashCode 必须相等。Comparable 是 TreeSet 才需要（A 错）。", "kaodian": "AI后端能力-语言与计算层-equals与hashCode契约"}, {"no": 7, "type": "single", "body": "下列线程池配置的最大隐患是？", "code": "new ThreadPoolExecutor(10, 50, 60L, TimeUnit.SECONDS,\n    new LinkedBlockingQueue<>());   // 未指定容量", "options": [{"k": "A", "t": "keepAlive 太长，线程无法回收"}, {"k": "B", "t": "必须用 Executors.newFixedThreadPool 才安全"}, {"k": "C", "t": "无界队列会让任务无限堆积，maxPoolSize=50 永远用不上，最终 OOM"}, {"k": "D", "t": "核心线程数太少，会立刻拒绝任务"}], "answer": "C", "explain": "LinkedBlockingQueue 不传容量时默认 Integer.MAX_VALUE。ThreadPoolExecutor 的扩容条件是「队列已满」，无界队列永远不满，所以线程数卡在 corePoolSize=10，maxPoolSize 形同虚设，任务在队列里越堆越多直到堆内存耗尽（这也是 Executors.newFixedThreadPool 被诟病的原因，B 恰恰相反）。正确做法：显式设置有界队列容量 + 合适的拒绝策略 + 监控队列长度。", "kaodian": "AI后端能力-语言与计算层-线程池队列与拒绝策略"}, {"no": 8, "type": "single", "body": "下列列表删除一项后，剩余行的输入框内容发生错位，原因是？", "code": "<div v-for=\"(item, i) in list\" :key=\"i\">\n  <input v-model=\"item.remark\" />\n</div>", "options": [{"k": "A", "t": "v-model 不能用于 v-for 内部"}, {"k": "B", "t": "必须加 v-once 才能保持状态"}, {"k": "C", "t": "Vue3 不支持带 key 的 v-for"}, {"k": "D", "t": "用数组索引作 key，删除后索引重排导致 Vue 复用了错误的 DOM 与组件状态"}], "answer": "D", "explain": "key 是 diff 算法识别节点身份的依据。用索引当 key 时，删掉中间一项会让后续项的索引整体前移，Vue 认为「同一个 key 的节点内容变了」而复用原 DOM/组件实例，于是输入框里的用户输入、组件内部状态会串位。应使用稳定唯一的业务 id 作 key（如 :key=\"item.id\"）。", "kaodian": "AI前端能力-语言与运行时-v-for的key与DOM复用"}, {"no": 9, "type": "single", "body": "移动端用 rem 适配，下列说明正确的是？", "code": "html { font-size: calc(100vw / 7.5); }  /* 设计稿 750px */\n.btn { width: 2rem; }   /* 设计稿 200px */", "options": [{"k": "A", "t": "rem 相对根元素字号，把根字号按视口宽度换算即可让元素随屏幕等比缩放"}, {"k": "B", "t": "rem 相对父元素字号，嵌套会累乘"}, {"k": "C", "t": "rem 与 px 完全等价，只是写法不同"}, {"k": "D", "t": "rem 适配必须依赖 JS，纯 CSS 做不到"}], "answer": "A", "explain": "rem = root em，只相对 html 的 font-size（em 才是相对父元素并会嵌套累乘，B 混淆了两者）。把根字号设成视口宽度的固定比例（750 设计稿除以 7.5，则 1rem=100px 设计稿单位），元素写 2rem 即对应设计稿 200px，随屏幕等比缩放。用 calc(100vw/7.5) 或 vw 单位纯 CSS 即可实现，不必依赖 JS（D 错）；注意配合 max-width 防止大屏过度放大。", "kaodian": "AI前端能力-前端基础与渲染引擎-rem移动端适配"}, {"no": 10, "type": "single", "body": "同一浏览器多个标签页需要同步「已登出」状态，最合适的方案是？", "code": "// A 标签页执行登出\nlocalStorage.removeItem('token');", "options": [{"k": "A", "t": "跨标签页无法通信，只能让用户手动刷新"}, {"k": "B", "t": "监听 window 的 storage 事件，或用 BroadcastChannel 广播登出消息"}, {"k": "C", "t": "用 setInterval 每秒轮询 localStorage"}, {"k": "D", "t": "用 sessionStorage 即可自动跨标签同步"}], "answer": "B", "explain": "storage 事件会在同源的其它标签页触发（当前页自身不触发），能感知 localStorage 变化；BroadcastChannel 提供更语义化的同源广播通道（postMessage/onmessage），也可用 SharedWorker。轮询（C）浪费资源且有延迟；sessionStorage 是每标签页独立的，根本不共享（D 错）；跨标签通信手段很多（A 错）。", "kaodian": "AI前端能力-前端生态-跨标签页通信"}, {"no": 11, "type": "single", "body": "下列 TS 代码中 `K` 的类型是？", "code": "interface User { id: number; name: string; age: number }\ntype K = keyof User;", "options": [{"k": "A", "t": "{ id: number; name: string; age: number }"}, {"k": "B", "t": "number | string"}, {"k": "C", "t": "\"id\" | \"name\" | \"age\""}, {"k": "D", "t": "string"}], "answer": "C", "explain": "keyof 取出对象类型的所有键，得到字面量联合类型 \"id\"|\"name\"|\"age\"。它常与泛型配合做类型安全的属性访问：`function get<T, K extends keyof T>(o: T, k: K): T[K]`，这样 get(user,'age') 返回 number，写错键名编译期就报错。注意若 interface 带索引签名 [k:string]:any，keyof 结果才会包含 string|number。", "kaodian": "AI前端能力-语言与运行时-TSkeyof与索引访问"}, {"no": 12, "type": "single", "body": "下列代码输出是？", "code": "const a = [3, 1, 2];\nconst b = a.slice(0, 2);\nconst c = a.splice(0, 2);\nconsole.log(a, b, c);", "options": [{"k": "A", "t": "[3, 1, 2] [3, 1] [3, 1]"}, {"k": "B", "t": "[2] [3] [1]"}, {"k": "C", "t": "[3, 1] [3, 1] [2]"}, {"k": "D", "t": "[2] [3, 1] [3, 1]"}], "answer": "D", "explain": "slice 是纯函数：返回浅拷贝的新数组 [3,1]，原数组不变。splice 会原地修改：从索引 0 删除 2 个元素，返回被删除的 [3,1]，原数组 a 只剩 [2]。所以最终 a=[2]、b=[3,1]、c=[3,1]。同类易错点：sort/reverse/fill/push 原地修改，而 map/filter/concat/toSorted 返回新数组。", "kaodian": "AI前端能力-语言与运行时-数组原地修改与纯方法"}, {"no": 13, "type": "single", "body": "首屏加载慢，想把大图表组件改为按需加载并显示 loading，最合适的写法是？", "code": "const Chart = defineAsyncComponent(() => import('./HeavyChart.vue'));", "options": [{"k": "A", "t": "配合 <Suspense> 的 #fallback 插槽或 defineAsyncComponent 的 loadingComponent 展示占位"}, {"k": "B", "t": "用 v-if 包住普通 import 的组件即可实现代码分割"}, {"k": "C", "t": "defineAsyncComponent 会阻塞首屏渲染直到组件加载完"}, {"k": "D", "t": "异步组件不支持 loading 与错误态"}], "answer": "A", "explain": "defineAsyncComponent 返回异步组件包装器，配合动态 import 让打包工具拆出独立 chunk；展示占位有两种方式：外层 <Suspense> 提供 #fallback，或在 defineAsyncComponent 的对象配置里传 loadingComponent/errorComponent/delay/timeout。静态 import + v-if 只是延迟渲染，代码早就打进主包（B 错）；异步组件不阻塞首屏（C 错）。", "kaodian": "AI前端能力-语言与运行时-Vue3异步组件"}, {"no": 14, "type": "single", "body": "下列代码输出顺序是？", "code": "console.log(1);\nsetTimeout(() => console.log(2));\nPromise.resolve().then(() => console.log(3));\n(async () => { console.log(4); await null; console.log(5); })();\nconsole.log(6);", "options": [{"k": "A", "t": "1 4 6 2 3 5"}, {"k": "B", "t": "1 4 6 3 5 2"}, {"k": "C", "t": "1 4 6 5 3 2"}, {"k": "D", "t": "1 2 3 4 5 6"}], "answer": "B", "explain": "同步阶段依次输出 1、4（async 函数体在 await 前同步执行）、6。await null 之后的代码进入微任务队列，但它排在已注册的 Promise.then 之后，所以微任务阶段先 3 再 5。setTimeout 是宏任务，等微任务队列清空后才执行输出 2。最终 1 4 6 3 5 2。", "kaodian": "AI前端能力-语言与运行时-事件循环执行顺序"}, {"no": 15, "type": "single", "body": "某设置页有 4 个下拉框各 3 个取值（3^4=81 种组合），时间只够跑 10 条用例，最合理的方法是？", "code": "因子：主题(3) 字号(3) 语言(3) 时区(3)", "options": [{"k": "A", "t": "必须全量 81 条，少一条都不行"}, {"k": "B", "t": "随机抽 10 条即可"}, {"k": "C", "t": "用正交实验法/成对组合（pairwise）覆盖任意两因子的所有取值组合，用少量用例发现多数交互缺陷"}, {"k": "D", "t": "只测默认组合一条"}], "answer": "C", "explain": "实践表明多数组合缺陷由两个因子交互引起，pairwise/正交表能用十余条用例覆盖全部两因子组合，性价比极高（工具如 PICT、AllPairs）。只测默认（D）几乎没覆盖交互；全量（A）在因子多时爆炸不可行；随机抽（B）无法保证任意两因子组合都被覆盖，遗漏不可控。", "kaodian": "AI质量保障-软件测试理论与质量体系-正交与成对组合"}, {"no": 16, "type": "single", "body": "关于冒烟测试与验收测试的区别，下列正确的是？", "code": "流水线：构建 → 冒烟(5min) → 全量回归(40min) → 验收", "options": [{"k": "A", "t": "两者是同义词，只是叫法不同"}, {"k": "B", "t": "冒烟测试要求覆盖所有功能与边界"}, {"k": "C", "t": "验收测试由开发在本地执行即可"}, {"k": "D", "t": "冒烟是提测/构建后的快速可用性验证，决定是否值得继续深入测试；验收从用户与需求视角确认是否满足交付标准"}], "answer": "D", "explain": "冒烟测试是「门槛检查」：几分钟内跑通核心链路（能登录、能下单、关键页面不白屏），不通过则直接打回，避免浪费后续测试资源；范围小、速度快、通常自动化。验收测试站在需求与用户价值角度确认交付物是否可接受，通常有产品/业务方参与（UAT）。目的、范围、参与方都不同（A/B 错）；验收不应由开发自己在本地拍板（C 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-冒烟与验收测试"}, {"no": 17, "type": "single", "body": "自动化用例里到处是 `page.click('#login-btn')`，改版后大面积失败。最佳改造方向是？", "code": "// LoginPage.ts\nclass LoginPage {\n  constructor(private page: Page) {}\n  async login(u: string, p: string) { ... }\n}", "options": [{"k": "A", "t": "引入页面对象模式（POM），把选择器与操作封装到页面类，用例只调业务方法"}, {"k": "B", "t": "把所有选择器改成绝对 XPath 就稳定了"}, {"k": "C", "t": "每个用例各自复制一份选择器，互不影响最安全"}, {"k": "D", "t": "用 sleep 等页面稳定后再点击即可"}], "answer": "A", "explain": "POM 把「元素定位 + 页面操作」集中到页面类，选择器变更只改一处，用例层保持业务语义（login/搜索/下单），可读性与可维护性大幅提升；配合 data-testid 等稳定定位属性效果更好。绝对 XPath 恰恰是最脆弱的定位方式（B 错）；复制选择器会让改版时改到手软（C 错）；sleep 解决的是等待问题，与维护性无关（D 错）。", "kaodian": "AI质量保障-自动化测试-页面对象模式POM"}, {"no": 18, "type": "single", "body": "接口从 v1 升级到 v2 新增了必填字段，测试重点应包含？", "code": "// v1: {orderId}\n// v2: {orderId, channel}   channel 必填", "options": [{"k": "A", "t": "新增必填字段属于内部改动，不影响调用方"}, {"k": "B", "t": "验证老客户端（不传 channel）的兼容策略是否明确：是给默认值、还是明确报错并有升级引导"}, {"k": "C", "t": "只测 v2 新逻辑，v1 已废弃不用管"}, {"k": "D", "t": "直接下线 v1 即可，无需兼容测试"}], "answer": "B", "explain": "给已发布接口新增必填字段是破坏性变更（breaking change）。移动端有大量存量版本无法强升，必须明确兼容策略：服务端给默认值降级、或按版本号分流、或返回明确错误码并引导升级，并对老版本请求逐一验证。直接不管或强行下线（C/D）会造成线上大面积失败；A 的判断完全错误。", "kaodian": "AI质量保障-接口测试-接口版本兼容"}, {"no": 19, "type": "single", "body": "同一模块本月逃逸 8 个线上缺陷，最有价值的动作是？", "code": "缺陷分类：需求理解偏差 3 / 边界未覆盖 3 / 环境差异 2", "options": [{"k": "A", "t": "追责到具体个人并扣绩效"}, {"k": "B", "t": "增加测试人力，用例数翻倍"}, {"k": "C", "t": "做根因分析（如 5Why）并按类别落改进项：需求评审补齐、用例补边界、环境对齐生产配置"}, {"k": "D", "t": "把这 8 个缺陷修完即可，无需分析"}], "answer": "C", "explain": "缺陷逃逸的价值在于反哺流程。按类别归因后能得出针对性改进：需求理解偏差 → 需求澄清与用例评审拉上产品；边界未覆盖 → 用例设计补等价类/边界值并加进回归集；环境差异 → 测试环境配置与数据向生产对齐。只修不改（D）会重复踩坑；追责（A）会让缺陷被隐藏；无脑加人加用例（B）不解决根因还抬高维护成本。", "kaodian": "AI质量保障-软件测试理论与质量体系-缺陷根因分析"}, {"no": 20, "type": "single", "body": "用 AI 辅助代码评审，合理的定位是？", "code": "输入：diff + 项目规范 + 历史缺陷模式\n输出：可疑点清单（空指针、并发、SQL 注入、异常吞掉…）", "options": [{"k": "A", "t": "完全替代人工评审，AI 通过即可合并"}, {"k": "B", "t": "AI 只能检查代码格式，无法发现逻辑问题"}, {"k": "C", "t": "AI 评审结论必须全部照改，不得质疑"}, {"k": "D", "t": "作为人工评审前的一道过滤网，快速指出低级问题与可疑模式，人工聚焦架构与业务正确性"}], "answer": "D", "explain": "AI 评审的强项是覆盖面与一致性：空指针风险、异常被吞、资源未关闭、并发共享状态、SQL 拼接注入、规范违背这类模式化问题它很擅长，能把人工评审从「挑错字」解放到「看设计与业务正确性」。但它不了解完整业务上下文与历史约束，可能给出误报或错误建议，因此只能作为辅助，最终判断权在人（A/C 错）；它的能力也远超格式检查（B 错）。", "kaodian": "AI质量保障-AI辅助测试-AI辅助代码评审"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于常见限流算法，下列说法正确的有？（多选，多选、少选、错选均不得分）", "code": "场景：接口限 1000 QPS，允许一定突发", "options": [{"k": "A", "t": "令牌桶按固定速率发放令牌，桶内积累的令牌允许一定程度的突发流量"}, {"k": "B", "t": "漏桶以恒定速率处理请求，能强制平滑输出但不友好于突发"}, {"k": "C", "t": "固定窗口计数在窗口边界可能出现两倍瞬时流量，滑动窗口可缓解"}, {"k": "D", "t": "计数器限流精度最高，是高并发场景的首选"}], "answer": ["A", "B", "C"], "explain": "A 对：令牌桶（如 Guava RateLimiter）平时积累令牌，突发时可一次性取用，兼顾平滑与弹性。B 对：漏桶出水速率恒定，超出容量则丢弃，适合需要严格平滑的下游保护。C 对：固定窗口的经典缺陷是「临界双倍」（上一窗口末尾与下一窗口开头各打满），滑动窗口或滑动日志可缓解。D 错：简单计数器精度最差（正是 C 描述的问题），高并发更常用令牌桶/滑动窗口，分布式场景则用 Redis+Lua 或 Sentinel。", "kaodian": "AI后端能力-微服务与云原生层-限流算法对比"}, {"no": 2, "type": "multi", "body": "关于分布式 ID 生成方案，下列说法正确的有？（多选）", "code": "需求：全局唯一、趋势递增、高性能、不暴露业务量", "options": [{"k": "A", "t": "雪花算法依赖系统时钟，时钟回拨可能产生重复 ID，需要处理策略"}, {"k": "B", "t": "数据库号段模式（segment）批量取号缓存在内存，能显著降低 DB 压力"}, {"k": "C", "t": "UUID 无序且长度大，作为 MySQL 聚簇索引主键会加剧页分裂，性能不佳"}, {"k": "D", "t": "雪花算法（Snowflake）按 时间戳+机器位+序列号 生成 64 位 ID，趋势递增且本地生成无网络开销"}], "answer": ["A", "B", "C", "D"], "explain": "四项都对。D：Snowflake 本地计算无需远程调用，趋势递增对 A+ 树主键友好。A：时钟回拨是它最著名的坑，常见处理是等待、抛异常或切用备用序列（美团 Leaf、百度 UidGenerator 都有对应方案）。B：号段模式一次取一批（如 1000 个）在内存分配，兼顾性能与可靠性。C：UUID 随机无序会导致 InnoDB 主键插入位置随机、页分裂与碎片严重，且占 36 字节使二级索引膨胀。", "kaodian": "AI后端能力-微服务与云原生层-分布式ID生成"}, {"no": 3, "type": "multi", "body": "关于服务端日志规范与链路追踪，下列做法正确的有？（多选）", "code": "[2026-08-13 10:00:01] [traceId=a1b2c3] [orderId=1001] WARN 库存不足", "options": [{"k": "A", "t": "禁止打印身份证、手机号、密码、Token 等敏感信息，必要时脱敏"}, {"k": "B", "t": "为了排查方便，应在循环里逐条打印 INFO 级完整报文"}, {"k": "C", "t": "在入口生成 traceId 并通过 MDC/上下文透传，跨服务与异步线程也要传递"}, {"k": "D", "t": "关键业务日志应带上业务标识（订单号/用户号）便于按维度检索"}], "answer": ["A", "C", "D"], "explain": "C 对：traceId 是串起一次请求全链路的钥匙，异步/线程池场景要显式传递 MDC 上下文（否则丢失）。D 对：带业务标识才能从海量日志里按订单/用户捞出完整链路。A 对：日志泄露是常见安全与合规事故，敏感字段必须脱敏或不打。B 错：循环内打全量报文会造成日志暴涨、磁盘与采集链路被打满，还可能因同步写日志拖慢主流程——应聚合打印、采样或降级为 DEBUG。", "kaodian": "AI后端能力-微服务与云原生层-日志规范与链路追踪"}, {"no": 4, "type": "multi", "body": "防御 XSS，下列做法有效的有？（多选）", "code": "<div v-html=\"userInput\"></div>", "options": [{"k": "A", "t": "只要前端做了输入长度限制就足够安全"}, {"k": "B", "t": "默认使用文本插值（{{ }}）而非 v-html，让框架自动转义"}, {"k": "C", "t": "必须渲染富文本时用 DOMPurify 等库做白名单清洗"}, {"k": "D", "t": "服务端与前端双向校验/编码，并配置 CSP 限制可执行脚本来源"}], "answer": ["B", "C", "D"], "explain": "B 对：Vue/React 的默认插值会转义 HTML，v-html/dangerouslySetInnerHTML 才是 XSS 的高发入口。C 对：富文本场景无法完全禁用 HTML，只能用成熟库按白名单清洗标签与属性（尤其过滤 on* 事件与 javascript: 协议）。D 对：输出编码 + CSP 是纵深防御，能在漏网时限制脚本执行。A 错：长度限制与 XSS 无关，且前端校验可被绕过，服务端必须同样校验与编码。", "kaodian": "AI前端能力-前端生态-XSS防护"}, {"no": 5, "type": "multi", "body": "移动端 Retina 屏下 1px 边框显得偏粗，下列可行解法有？（多选）", "code": ".line { border-bottom: 1px solid #eee; }  /* DPR=2 实际渲染 2 物理像素 */", "options": [{"k": "A", "t": "用 transform: scaleY(0.5) 配合伪元素绘制细线"}, {"k": "B", "t": "用 border-width: 0.5px 并配合媒体查询按 DPR 区分"}, {"k": "C", "t": "用 box-shadow 或渐变背景模拟 0.5px 细线"}, {"k": "D", "t": "把 1px 直接改成 0px，视觉上更精致"}], "answer": ["A", "B", "C"], "explain": "A 对：伪元素画 1px 后整体 scaleY(0.5)，是兼容性最好的通用方案。B 对：iOS Safari 支持 0.5px，可用 -webkit-min-device-pixel-ratio 媒体查询按 DPR 下发不同宽度（Android 部分低版本会渲染为 0，需谨慎）。C 对：box-shadow/linear-gradient 也能模拟亚像素细线。D 错：0px 等于没有边框，直接改变了设计意图，不是解决方案。", "kaodian": "AI前端能力-前端基础与渲染引擎-移动端1px方案"}, {"no": 6, "type": "multi", "body": "让自动化测试结果可重复、不受执行顺序影响，下列做法正确的有？（多选）", "code": "失败特征：单跑通过，全量跑失败；换机器结果不同", "options": [{"k": "A", "t": "避免使用固定的共享账号/固定手机号，改为动态生成唯一数据"}, {"k": "B", "t": "时间、随机数、外部第三方依赖要可控（固定时钟、mock 外部服务）"}, {"k": "C", "t": "把用例按固定顺序编号执行，靠顺序保证数据依赖"}, {"k": "D", "t": "每条用例自备前置数据并在结束时清理，不依赖其它用例产生的数据"}], "answer": ["A", "B", "D"], "explain": "D/A 对：数据隔离是可重复性的根基，共享账号会在并行执行时互相踩踏。B 对：时间与随机性是 flaky 的常见来源（跨月/跨天边界、随机数据触发不同分支），第三方依赖不稳定则必须 mock 或用契约桩。C 错：靠顺序维持依赖会让用例无法并行、无法单跑、无法定位，是应当消除的反模式而非解法。", "kaodian": "AI质量保障-自动化测试-用例可重复性"}, {"no": 7, "type": "multi", "body": "关于质量度量指标的使用，下列说法正确的有？（多选）", "code": "候选指标：缺陷逃逸率 / 用例执行数 / 覆盖率 / 平均修复时长 / 线上故障数", "options": [{"k": "A", "t": "指标应服务于改进决策，而不是用于人员排名与追责"}, {"k": "B", "t": "用例执行条数越多说明质量越好，应作为核心 KPI"}, {"k": "C", "t": "应组合使用多个指标，单一指标容易被优化成数字游戏"}, {"k": "D", "t": "缺陷逃逸率、线上故障数更能反映真实交付质量"}], "answer": ["A", "C", "D"], "explain": "C 对：任何单一指标都会被针对性优化（古德哈特定律），需用一组互相制衡的指标。D 对：逃逸率与线上故障是结果性指标，直接对应用户感受。A 对：指标的目的是找改进点；一旦与考核强绑定，就会催生拆分用例、隐藏缺陷等行为。B 错：用例条数是过程性产出，可以靠拆分用例轻易注水，与质量无必然关系。", "kaodian": "AI质量保障-软件测试理论与质量体系-质量度量指标"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "Spring 的 @Transactional 默认只在抛出 RuntimeException 或 Error 时回滚，捕获了受检异常（如 IOException）并不会触发回滚，除非配置 rollbackFor。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "默认回滚规则是 unchecked 异常（RuntimeException 及其子类）与 Error。抛出受检异常（IOException、SQLException 等）时事务会正常提交，导致「明明报错了数据却写进去了」。解决办法：@Transactional(rollbackFor = Exception.class)。另一个高频坑是在方法内 try-catch 吞掉异常，事务同样不会回滚，需要手动 setRollbackOnly 或重新抛出。", "kaodian": "AI后端能力-应用框架层-事务回滚规则"}, {"no": 2, "type": "judge", "body": "Vue3 虽然用 Proxy 实现响应式，但通过索引给数组赋值(arr[0]=x)和给对象新增属性仍无法被侦测。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "Vue3 的 Proxy 能拦截数组索引赋值与对象新增属性，这些都是 Vue2（defineProperty）做不到的。", "kaodian": "AI前端能力-语言与运行时-Proxy对数组的侦听"}, {"no": 3, "type": "judge", "body": "CSS 中 `position: fixed` 的定位基准始终是浏览器视口，即使祖先元素设置了 transform 也不会受影响。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "通常 fixed 相对视口定位，但一旦祖先元素设置了 transform、filter、perspective、will-change、backdrop-filter 或 contain:paint 等属性，就会创建新的包含块，fixed 元素会相对该祖先定位，从而出现「固定定位失效」「弹窗跟着滚动」等经典问题。解决办法是把弹窗用 Teleport/portal 移到 body 下，或移除祖先上的 transform。", "kaodian": "AI前端能力-前端基础与渲染引擎-fixed包含块失效"}, {"no": 4, "type": "judge", "body": "探索性测试虽然强调即时设计与灵活发挥，但仍需要记录测试思路、覆盖区域与发现的问题，以便复现和沉淀。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "探索性测试的「无脚本」指的是不预先写死步骤，而不是不留痕迹。常用做法是基于章程（charter）限定探索范围与时间盒（session-based），过程中记录走过的路径、观察到的异常、待确认疑点。没有记录会导致缺陷无法复现、覆盖情况说不清、经验无法沉淀为回归用例。", "kaodian": "AI质量保障-软件测试理论与质量体系-探索性测试记录"}, {"no": 5, "type": "judge", "body": "自动化测试脚本属于测试资产，不是产品代码，因此无需代码评审、无需版本管理，也不必遵循编码规范。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "自动化脚本同样是需要长期维护的代码资产：不评审会积累重复选择器、无效断言、硬编码等待、脏数据未清理等问题；不做版本管理无法追溯用例与需求版本的对应关系；不遵循规范会让维护成本迅速超过收益，最终导致「自动化跑不动、干脆废弃」。它应与产品代码同等对待——评审、CI、重构一样不能少。", "kaodian": "AI质量保障-自动化测试-脚本工程化规范"}, {"no": 6, "type": "judge", "body": "一条设计良好的测试用例应包含明确的前置条件、操作步骤与预期结果，并且能够独立执行、结果可判定。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "用例的基本要素：唯一标识、前置条件（数据与环境）、明确步骤、可判定的预期结果（不能写「界面正常」这类主观描述）、以及优先级。独立执行意味着不依赖其它用例的残留数据，结果可判定意味着任何人执行都能得出相同结论——这也是用例能被自动化、能被他人接手的前提。", "kaodian": "AI质量保障-软件测试理论与质量体系-用例要素与独立性"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
