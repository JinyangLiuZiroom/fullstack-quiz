<script type="application/json" id="quizData">{"id": "vol16", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "对齐公司真实考法：<b>单选 / 多选 / 判断</b>，每题包含完整代码场景，问执行结果、补全代码、判断框架用法正误。<br>本卷共 <b>33 题</b>：单选 20（60 分）+ 多选 7（28 分）+ 判断 6（12 分）= 100 分。<br>难度：<b>实战细节型</b>，考点标签采用公司标准层级命名。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "backend", "questions": [{"no": 1, "type": "single", "body": "以下 Java 代码的输出依次是？", "code": "char c = 'A';                 // 'A' 的码点是 65\nSystem.out.println(c + 1);\nSystem.out.println((char) (c + 1));\nStringBuilder sb = new StringBuilder();\nsb.append(c + 1);\nSystem.out.println(sb.toString());", "options": [{"k": "A", "t": "66  /  B  /  66"}, {"k": "B", "t": "A1  /  B  /  A1"}, {"k": "C", "t": "66  /  B  /  B"}, {"k": "D", "t": "65  /  A  /  65"}], "answer": ["A"], "explain": "char 参与算术运算会发生二元数值提升，先转成 int 再运算：'A'(65) + 1 = 66，第一行打印 66。强转回 char 得到码点 66 对应的字符 'B'。sb.append(c + 1) 传入的已经是 int 66，命中 append(int) 重载，追加的是字符串 \"66\"（若写成 sb.append(c).append(1) 才是 \"A1\"）。记住：只要 char 出现在 + - * / 里就是数字运算，只有拼接 String 时才按字符处理。", "android": "Android 里解析 KeyEvent 的 keyCode、处理蓝牙/串口协议字节流时经常做 (char) 强转，忘了提升规则就会把 66 打成 'B' 或反过来，日志一看全是数字对不上。", "kaodian": "AI 后端能力 - 语言基础层 - 字符类型与运算提升"}, {"no": 2, "type": "single", "body": "以下代码编译并运行，main 方法打印什么？", "code": "public class Overload {\n    static void f(int a, int b)         { System.out.println(\"int,int\"); }\n    static void f(long a, long b)       { System.out.println(\"long,long\"); }\n    static void f(Integer a, Integer b) { System.out.println(\"Integer,Integer\"); }\n    static void f(int... a)             { System.out.println(\"varargs\"); }\n\n    public static void main(String[] args) {\n        f(1, 2);\n    }\n}", "options": [{"k": "A", "t": "int,int"}, {"k": "B", "t": "long,long"}, {"k": "C", "t": "Integer,Integer"}, {"k": "D", "t": "varargs（编译期歧义，运行时报错）"}], "answer": ["A"], "explain": "Java 重载解析分三个阶段，命中即止：① 不允许装箱、不允许可变参数，只做精确匹配和基本类型宽化；② 允许自动装箱/拆箱；③ 才考虑可变参数。f(1,2) 在第一阶段就命中 f(int,int)（精确匹配优先于宽化到 long）。如果删掉 f(int,int)，会走 f(long,long)（宽化优先于装箱）；再删则走 Integer 版本；varargs 永远是最后兜底。工程上不要同时提供 f(int,int) 和 f(int...)，调用方很难一眼看出走哪个。", "android": "和 Android 里 Log.d(String,String) 与 Log.d(String,String,Throwable) 的重载选择一样，全部在编译期静态决定；自己写工具类时重载太多会让调用方猜不到实际走哪个方法。", "kaodian": "AI 后端能力 - 语言基础层 - 可变参数与重载解析"}, {"no": 3, "type": "single", "body": "以下代码的运行结果是？", "code": "Object[] arr = new String[2];   // 数组协变：String[] 可以赋给 Object[]\narr[0] = \"ok\";\narr[1] = 123;                   // 往 String[] 里放 Integer\nSystem.out.println(arr[0]);", "options": [{"k": "A", "t": "正常打印 ok"}, {"k": "B", "t": "第 1 行编译报错：类型不兼容"}, {"k": "C", "t": "运行到第 3 行抛 ArrayStoreException"}, {"k": "D", "t": "第 3 行编译报错：无法把 int 放进 Object[]"}], "answer": ["C"], "explain": "Java 数组是协变的：只要 String 是 Object 的子类，String[] 就是 Object[] 的子类型，所以第 1 行合法。但 JVM 会在每次数组元素赋值时做运行时类型检查（aastore 指令），往实际类型为 String[] 的数组里存 Integer，抛 java.lang.ArrayStoreException。对比泛型集合：List<String> 不是 List<Object> 的子类型（泛型不变），编译期就把这类错误拦住了——这正是《Effective Java》建议\"列表优先于数组\"的核心理由。", "android": "和 Android 里把 View[] 当 Object[] 传进通用工具方法、再往里塞别的类型一样：编译过了却在运行时崩，且崩溃点离出错的赋值处很远；改用 List<View> 或泛型方法能在编译期拦截。", "kaodian": "AI 后端能力 - 语言基础层 - 数组协变与运行时类型检查"}, {"no": 4, "type": "single", "body": "以下代码依次打印什么？", "code": "TreeMap<Integer, String> m = new TreeMap<>();\nm.put(10, \"a\");\nm.put(20, \"b\");\nm.put(30, \"c\");\n\nSystem.out.println(m.floorKey(25));\nSystem.out.println(m.ceilingKey(25));\nSystem.out.println(m.headMap(20).size());\nSystem.out.println(m.subMap(10, true, 30, true).size());", "options": [{"k": "A", "t": "20 / 30 / 1 / 3"}, {"k": "B", "t": "30 / 20 / 2 / 3"}, {"k": "C", "t": "20 / 30 / 2 / 2"}, {"k": "D", "t": "10 / 30 / 1 / 2"}], "answer": ["A"], "explain": "TreeMap 实现了 NavigableMap，提供一整套区间导航 API：floorKey(25) 取\"不大于 25 的最大键\"= 20；ceilingKey(25) 取\"不小于 25 的最小键\"= 30（还有 lowerKey / higherKey 是严格小于/大于）。headMap(20) 默认不含上界，只剩 {10}，size = 1（headMap(20, true) 才是 2）。subMap(10, true, 30, true) 是闭区间，包含全部 3 个。注意这些视图都是原 map 的\"活视图\"，改视图会影响原 map。", "android": "类似 Android 里按时间戳找\"最接近的一帧/最近一次埋点\"，用 TreeMap 的 floor/ceiling 一行搞定，不用自己写二分查找；SparseArray 只能顺序找，数据量大且要区间查询时 TreeMap 更合适。", "kaodian": "AI 后端能力 - 语言基础层 - 有序映射区间查询"}, {"no": 5, "type": "single", "body": "以下代码的运行结果是？", "code": "Stream<String> s = Stream.of(\"a\", \"b\", \"c\");\nSystem.out.println(s.count());\nSystem.out.println(s.filter(x -> x.length() > 0).count());", "options": [{"k": "A", "t": "3 然后 3"}, {"k": "B", "t": "3 然后抛 IllegalStateException"}, {"k": "C", "t": "3 然后 0"}, {"k": "D", "t": "编译报错，Stream 不能重复赋值"}], "answer": ["B"], "explain": "Stream 是一次性管道：执行任意一个终止操作（count / collect / forEach / reduce…）之后，流就被标记为已消费（linkedOrConsumed），再次使用同一个 Stream 实例会抛 IllegalStateException: stream has already been operated upon or closed。需要多次遍历有两条路：① 先 collect(Collectors.toList()) 落地成集合，之后随便遍历；② 用 Supplier<Stream<T>> 每次现造一条新流。另外 IntStream/Stream 的 count() 在特定条件下会跳过中间操作直接取 size，但不影响\"已消费\"这个状态标记。", "android": "和 Android 里 InputStream / Cursor 读完就不能倒带一个道理，都是一次性游标；要复用得先读进内存（toList / 全量读到 List<Bean>），否则第二次访问直接异常。", "kaodian": "AI 后端能力 - 语言基础层 - Stream 流复用限制"}, {"no": 6, "type": "single", "body": "关于下面两把锁的差异，说法正确的是？", "code": "ReentrantLock lock = new ReentrantLock();      // 默认构造\nReentrantLock fair = new ReentrantLock(true);  // 公平锁\n\n// 竞争场景：10 个线程反复 lock() / unlock()", "options": [{"k": "A", "t": "默认是公平锁，严格按线程申请顺序获取，吞吐更高"}, {"k": "B", "t": "默认是非公平锁，锁释放瞬间新到线程可以直接抢占（插队），减少上下文切换，吞吐通常更高但可能饥饿"}, {"k": "C", "t": "公平锁吞吐更高，因为省掉了 CAS 抢锁的开销"}, {"k": "D", "t": "无论公平与否，tryLock() 都会严格进入 AQS 队列排队"}], "answer": ["B"], "explain": "new ReentrantLock() 默认非公平：某线程 unlock 的瞬间，刚到达的线程可以直接 CAS 抢到锁，而不必唤醒队首线程（barging）。这样省掉一次线程唤醒和上下文切换，吞吐明显更高，代价是队列中的线程可能长期抢不到锁（饥饿）。公平锁在 tryAcquire 里加了 hasQueuedPredecessors() 判断，有人排队就不抢，保证 FIFO，但每次都要唤醒，吞吐更低。特别注意 D 的坑：无参 tryLock() 的实现直接调 nonfairTryAcquire，即使是公平锁也会插队；只有 tryLock(timeout, unit) 才遵守公平策略。synchronized 则始终是非公平的。", "android": "对应 Android 主线程消息队列的直觉：严格 FIFO（公平）体验稳定但吞吐低，插入 IdleHandler / 屏障消息（非公平）能提高关键任务响应，但低优先级任务可能一直排不上——取舍逻辑完全一致。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 公平锁与非公平锁"}, {"no": 7, "type": "single", "body": "下面这个周期任务，任务体本身耗时 3 秒、调度周期设为 1 秒。前 4 次打印的相对秒数大致是？", "code": "ScheduledExecutorService ses = Executors.newScheduledThreadPool(1);\nlong t0 = System.currentTimeMillis();\n\nses.scheduleAtFixedRate(() -> {\n    System.out.println((System.currentTimeMillis() - t0) / 1000 + \"s\");\n    sleep(3000);                       // 任务耗时 3 秒\n}, 0, 1, TimeUnit.SECONDS);            // 周期 1 秒", "options": [{"k": "A", "t": "0s 1s 2s 3s"}, {"k": "B", "t": "0s 3s 6s 9s"}, {"k": "C", "t": "0s 4s 8s 12s"}, {"k": "D", "t": "0s 1s 4s 7s"}], "answer": ["B"], "explain": "scheduleAtFixedRate 的下一次触发点是\"上一次开始时间 + period\"，但同一个周期任务绝不会并发执行——上一次没跑完，下一次只能等。执行耗时 3s 大于周期 1s，于是退化成串行连续执行，间隔就是任务耗时：0s、3s、6s、9s。若换成 scheduleWithFixedDelay(…, 0, 1, SECONDS)，规则是\"上一次结束 + delay\"，间隔变成 3+1=4s，即 0s、4s、8s、12s（选项 C）。另一个必须记住的坑：调度线程池中周期任务一旦抛出未捕获异常，后续调度会被静默取消且不打印任何日志，任务体必须自己 try-catch 兜住。", "android": "相当于 Android 里两种轮询写法的区别：任务执行完再 handler.postDelayed(this, 1000) 是 fixedDelay；用 AlarmManager.setRepeating 按绝对时间点触发是 fixedRate。耗时任务放在主线程循环里，直接卡 UI。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 周期任务调度语义"}, {"no": 8, "type": "single", "body": "下面的代码执行后抛出异常，数据库中 order 表和 log 表的最终状态是？", "code": "@Service\npublic class OrderService {\n\n    @Autowired private OrderService self;   // 注入代理，避免自调用失效\n    @Autowired private OrderMapper orderMapper;\n    @Autowired private LogMapper   logMapper;\n\n    @Transactional(propagation = Propagation.REQUIRED)\n    public void create(Order o) {\n        orderMapper.insert(o);              // 写 order\n        self.writeLog(o.getId());           // 写 log\n        throw new RuntimeException(\"boom\"); // 触发回滚\n    }\n\n    @Transactional(propagation = Propagation.NOT_SUPPORTED)\n    public void writeLog(Long orderId) {\n        logMapper.insert(new Log(orderId));\n    }\n}", "options": [{"k": "A", "t": "order 与 log 都回滚，两张表都没有数据"}, {"k": "B", "t": "order 回滚，log 保留"}, {"k": "C", "t": "order 保留，log 回滚"}, {"k": "D", "t": "两条记录都保留"}], "answer": ["B"], "explain": "NOT_SUPPORTED 的语义是\"以非事务方式执行；如果当前存在事务，就把它挂起\"。writeLog 里的 insert 脱离了外层事务，走自动提交立刻落库；外层事务因 RuntimeException 回滚，只影响 order。这正是\"操作日志 / 埋点 / 审计即使主流程失败也要留痕\"的标准做法。七种传播行为对照记忆：REQUIRED（有则加入、无则新建，默认）、REQUIRES_NEW（挂起外层并开新事务，可独立提交回滚）、NOT_SUPPORTED（挂起外层且不用事务）、SUPPORTS（有则加入、无则非事务）、MANDATORY（必须有外层事务，否则抛 IllegalTransactionStateException）、NEVER（必须没有事务，否则抛异常）、NESTED（savepoint 嵌套，外层回滚会带上它）。", "android": "类似 Android 里主流程用 SQLite 事务批量写业务数据，而崩溃日志走独立通道单独落盘：主流程回滚了日志还得在，否则线上问题连现场都没有。", "kaodian": "AI 后端能力 - 框架与容器层 - 事务传播 NOT_SUPPORTED"}, {"no": 9, "type": "single", "body": "容器启动时，与 userService 这个 Bean 相关的三行日志，打印顺序是？", "code": "@Component\npublic class MyBpp implements BeanPostProcessor {\n    @Override\n    public Object postProcessBeforeInitialization(Object bean, String name) {\n        if (bean instanceof UserService) System.out.println(\"before:\" + name);\n        return bean;\n    }\n    @Override\n    public Object postProcessAfterInitialization(Object bean, String name) {\n        if (bean instanceof UserService) System.out.println(\"after:\" + name);\n        return bean;\n    }\n}\n\n@Component\npublic class UserService {\n    @PostConstruct\n    public void init() { System.out.println(\"postConstruct\"); }\n}", "options": [{"k": "A", "t": "before:userService → postConstruct → after:userService"}, {"k": "B", "t": "postConstruct → before:userService → after:userService"}, {"k": "C", "t": "before:userService → after:userService → postConstruct"}, {"k": "D", "t": "after:userService → before:userService → postConstruct"}], "answer": ["A"], "explain": "单个 Bean 的初始化流程是：实例化（构造器）→ 属性填充（依赖注入）→ Aware 系列回调 → postProcessBeforeInitialization → @PostConstruct / InitializingBean.afterPropertiesSet / init-method → postProcessAfterInitialization。@PostConstruct 本身就是由 CommonAnnotationBeanPostProcessor 这个 BPP 在 before 阶段触发的，所以夹在两个钩子中间。一个重要推论：AOP 代理由 AbstractAutoProxyCreator 在 after 阶段生成，因此在 @PostConstruct 里调用自己的 @Transactional / @Async 方法，此时代理还没织好、拿到的是原始对象，注解不会生效。", "android": "相当于 Android 里用 ASM/AspectJ 在 Activity onCreate 前后统一织入埋点与耗时统计：框架留好统一切入点，比在每个页面手写一遍初始化逻辑干净得多。", "kaodian": "AI 后端能力 - 框架与容器层 - 容器扩展点 BeanPostProcessor"}, {"no": 10, "type": "single", "body": "后端返回雪花 ID，H5 页面打印出的 id 与数据库不一致（末几位变成 0）。最合适的根治方案是？", "code": "// 后端\n@Data\npublic class OrderVO {\n    private Long id;      // 雪花 ID: 1789356712345678901（19 位）\n    private String orderNo;\n}\n\n// 前端\nconsole.log(res.data.id);   // 输出 1789356712345680000  ← 对不上", "options": [{"k": "A", "t": "后端把 id 字段类型从 Long 改成 int"}, {"k": "B", "t": "前端拿到后用 parseInt(res.data.id) 重新解析一次"}, {"k": "C", "t": "后端序列化时把 Long 转成 String：字段级 @JsonSerialize(using = ToStringSerializer.class)，或全局注册 SimpleModule 把 Long/long 映射为 ToStringSerializer"}, {"k": "D", "t": "数据库主键改回自增 int，避免出现大数字"}], "answer": ["C"], "explain": "JavaScript 的 Number 是 IEEE-754 双精度浮点，安全整数上限 Number.MAX_SAFE_INTEGER = 2^53-1 = 9007199254740991（16 位），19 位的雪花 ID 在 JSON.parse 的那一刻就已经被舍入，精度丢失发生在解析阶段，前端再怎么处理都救不回来，所以 B 无效。根治办法是让后端别把它当数字传：单字段加 @JsonSerialize(using = ToStringSerializer.class)，或用 Jackson2ObjectMapperBuilderCustomizer 全局把 Long.class / Long.TYPE 注册成 ToStringSerializer。A、D 属于削足适履，int 上限只有 21 亿、自增 ID 还会暴露业务量并影响分库分表。", "android": "Android 客户端用 Gson/Moshi 解析 long 不会丢精度，所以同一个接口 App 正常、H5 出错——这是 Android 转型做 H5 最容易踩的坑之一，联调时要专门拿大 ID 验一遍。", "kaodian": "AI 后端能力 - 框架与容器层 - JSON 长整型精度丢失"}, {"no": 11, "type": "single", "body": "关于 MyBatis-Plus IService 默认实现的 saveOrUpdate(entity)，描述正确的是？", "code": "User u = new User();\nu.setName(\"tom\");\nu.setAge(20);\nuserService.saveOrUpdate(u);   // 未设置主键\n\n// 另一种\nUser u2 = new User();\nu2.setId(1001L);\nu2.setAge(21);                 // name 为 null\nuserService.saveOrUpdate(u2);", "options": [{"k": "A", "t": "先按业务字段（如 name）查一次，存在就 update"}, {"k": "B", "t": "取实体主键值：为 null 直接 save；不为 null 则先 getById，查到走 updateById、查不到走 save"}, {"k": "C", "t": "底层直接执行 INSERT ... ON DUPLICATE KEY UPDATE，是数据库级原子操作"}, {"k": "D", "t": "总是先执行 update，影响行数为 0 时再 insert"}], "answer": ["B"], "explain": "ServiceImpl#saveOrUpdate 的源码逻辑很朴素：通过 TableInfo 拿到主键值，为 null 或 getById 查不到就 save，否则 updateById。三个必须知道的后果：① 它只认主键，不会按业务唯一键判断；② 会多一次 select，且\"查不到 → 并发 insert\"不是原子的，高并发下可能撞唯一索引报 DuplicateKeyException，真要原子 upsert 得用数据库的 ON DUPLICATE KEY UPDATE 或加分布式锁；③ 走 updateById 时默认更新策略是 NOT_NULL，u2 的 name 为 null 不会被更新成 NULL，想把字段显式置空必须用 LambdaUpdateWrapper().set(User::getName, null)。", "android": "对比 Android Room 的 @Insert(onConflict = OnConflictStrategy.REPLACE)：Room 那个是数据库级原子操作，而 MP 的 saveOrUpdate 是应用层\"先查后写\"，并发语义完全不等价，不能凭直觉套用。", "kaodian": "AI 后端能力 - 数据库与ORM层 - IService saveOrUpdate 语义"}, {"no": 12, "type": "single", "body": "执行下面的 SQL，查询结果和原因是？", "code": "CREATE TABLE t_user (\n  id   BIGINT PRIMARY KEY,\n  name VARCHAR(50)\n) DEFAULT CHARSET = utf8mb4 COLLATE = utf8mb4_general_ci;\n\nINSERT INTO t_user VALUES (1, 'Tom');\n\nSELECT COUNT(*) FROM t_user WHERE name = 'tom';", "options": [{"k": "A", "t": "0，MySQL 字符串比较永远区分大小写"}, {"k": "B", "t": "1，collation 后缀 _ci 表示 case insensitive，比较时不区分大小写"}, {"k": "C", "t": "报错，字符集与排序规则不匹配"}, {"k": "D", "t": "1，因为 MySQL 会隐式给两边套 LOWER() 后再比较"}], "answer": ["B"], "explain": "排序规则（collation）决定字符怎么比较和排序，后缀含义要背下来：_ci = case insensitive 不区分大小写、_cs = case sensitive 区分大小写、_bin = 按二进制逐字节比较（既区分大小写也区分重音）、_ai/_as = 不区分/区分重音。utf8mb4_general_ci 与 MySQL 8 默认的 utf8mb4_0900_ai_ci 都是 _ci，所以 'tom' 能匹配到 'Tom'。需要严格区分大小写的列（密码摘要、token、优惠券码、区分大小写的第三方编码）必须显式指定 utf8mb4_bin 或 utf8mb4_0900_as_cs。D 错在\"隐式 LOWER()\"——真写成 WHERE LOWER(name)='tom' 反而会让索引失效。另外还要注意：JOIN 两张 collation 不同的表会报 Illegal mix of collations 或导致索引用不上。", "android": "对应 Android SQLite 建列时加 COLLATE NOCASE。本地缓存表和服务端表的大小写策略不一致，就会出现\"App 里搜得到、H5 搜不到\"这种极难复现的 bug。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 排序规则与大小写敏感"}, {"no": 13, "type": "single", "body": "用 Redis List 做任务队列，消费端写法如下。关于这段用法，描述正确的是？", "code": "# 生产者\nLPUSH task:queue \"job-1\"\n\n# 消费者（伪代码）\nwhile (true) {\n    List<String> r = jedis.brpop(5, \"task:queue\");   // 阻塞最多 5 秒\n    if (r != null) {\n        handle(r.get(1));\n    }\n}", "options": [{"k": "A", "t": "brpop 本质是客户端空轮询，和 while 里写 rpop 完全等价，一样占 CPU"}, {"k": "B", "t": "阻塞发生在服务端不占客户端 CPU；队列为空时最多阻塞 5 秒后返回 nil，有数据时返回 [键名, 元素值] 两个元素"}, {"k": "C", "t": "多个消费者 brpop 同一个 key 时会各自拿到同一条消息，天然支持广播"}, {"k": "D", "t": "brpop 自带消息确认机制，消费者处理到一半崩溃后消息会自动回到队列"}], "answer": ["B"], "explain": "BRPOP 是服务端阻塞：客户端连接挂起在 Redis 侧，不做空转，比 while(rpop) + sleep 高效得多，也避免了轮询间隔带来的延迟。超时返回 nil；有数据时返回两个元素——键名和元素值，因为 BRPOP 支持同时监听多个 key（BRPOP k1 k2 0），必须告诉你命中的是哪个。C 错：List 是竞争消费，一条消息只会被一个消费者弹出，要广播得用 Pub/Sub（不持久）或 Stream 消费组。D 错：BRPOP 弹出即删除，没有 ack，handle 中崩溃消息就永久丢了；要可靠消费应改用 BLMOVE（原子搬到备份队列，处理完再删，即可靠队列模式）或直接上 Redis Stream / RabbitMQ / Kafka。", "android": "类似 Android 里用 BlockingQueue.poll(timeout, unit) 驱动的工作线程，语义几乎一一对应；区别是 Redis 这条队列跨进程跨机器，且同样没有 ack，可靠性得自己补。", "kaodian": "AI 后端能力 - 高并发与中间件层 - List 阻塞队列 BRPOP"}, {"no": 14, "type": "single", "body": "原图尺寸 800×400（宽高比 2:1），按下面样式渲染，最终视觉效果是？", "code": "<div class=\"box\"><img src=\"banner.jpg\"></div>\n\n<style>\n.box     { width: 200px; height: 200px; overflow: hidden; }\n.box img { width: 100%; height: 100%; object-fit: cover; }\n</style>", "options": [{"k": "A", "t": "图片被拉伸压扁成 200×200，比例失真"}, {"k": "B", "t": "等比缩放后完整显示，左右留白"}, {"k": "C", "t": "等比放大到铺满 200×200，左右超出部分被裁掉，比例不失真"}, {"k": "D", "t": "object-fit 对 img 无效，必须改用 background-size"}], "answer": ["C"], "explain": "object-fit 控制替换元素（img / video）的内容如何适配自身盒子：fill 是默认值（拉伸铺满，可能失真）；contain 等比缩放完整显示，可能留白；cover 等比缩放铺满盒子，超出部分被裁剪，不失真；none 保持原始尺寸；scale-down 取 none 与 contain 中更小的那个。本例 2:1 的图放进 1:1 的盒子，cover 会以高度为基准放大，左右各裁掉一部分。配合 object-position（默认 50% 50%）可以控制裁剪锚点，比如头像列表常用 object-position: top 保住人脸。", "android": "和 Android ImageView 的 scaleType 一一对应：fill ≈ FIT_XY，contain ≈ FIT_CENTER，cover ≈ CENTER_CROP，none ≈ CENTER；object-position 相当于自定义 matrix 平移。做 H5 列表页封面图时直接套 CENTER_CROP 的思路就对了。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - 替换元素填充方式 object-fit"}, {"no": 15, "type": "single", "body": "以下 JS 代码依次输出什么？", "code": "const n = 1234567.891;\n\nconsole.log(n.toLocaleString('zh-CN'));\nconsole.log(new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY' }).format(n));\nconsole.log(new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 0 }).format(n));", "options": [{"k": "A", "t": "1234567.891 / ¥1234567.89 / 1234568"}, {"k": "B", "t": "1,234,567.891 / ¥1,234,567.89 / 1,234,568"}, {"k": "C", "t": "1,234,567.89 / CNY 1234567.89 / 1234568"}, {"k": "D", "t": "1234567.891 / ¥1,234,567.891 / 1,234,567"}], "answer": ["B"], "explain": "toLocaleString 默认按 locale 加千分位分组，小数位遵循 maximumFractionDigits 默认值 3，所以保留 .891 得到 1,234,567.891。style: 'currency' 时小数位默认取该货币的标准精度（CNY 为 2 位），并带上 ¥ 符号，分组依然生效。maximumFractionDigits: 0 表示不要小数，按四舍五入进位得到 1,234,568，分组仍在（要关掉分组需显式 useGrouping: false）。工程建议：金额展示统一用 Intl.NumberFormat，不要自己写正则插逗号（负数、小数、科学计数法都容易出错）；金额计算则要用整数分或 decimal.js，别在浮点上做加减。", "android": "对应 Android 的 NumberFormat.getCurrencyInstance(Locale.CHINA) 和 DecimalFormat(\"#,##0.00\")。原则一致：存储与计算用最小单位整数（分），只在展示层做本地化格式化。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - 国际化数字与金额格式化"}, {"no": 16, "type": "single", "body": "以下代码执行后，控制台输出以及对内存的影响，正确的描述是？", "code": "let key = { id: 1 };\nconst wm = new WeakMap();\nconst m  = new Map();\n\nwm.set(key, 'weak');\nm.set(key, 'strong');\n\nkey = null;\nconsole.log(wm.size, m.size);", "options": [{"k": "A", "t": "打印 0 1，key 置空后 WeakMap 条目立即被清除"}, {"k": "B", "t": "打印 1 1，两者行为一致"}, {"k": "C", "t": "打印 undefined 1：WeakMap 没有 size 属性；其键是弱引用不阻止回收，而 Map 的强引用会让该对象一直无法被 GC"}, {"k": "D", "t": "打印 undefined undefined，Map 和 WeakMap 都没有 size"}], "answer": ["C"], "explain": "WeakMap 刻意不提供 size / keys() / values() / forEach 等枚举能力——垃圾回收时机不确定，暴露这些会让行为不可预测，所以 wm.size 是 undefined（不是报错）；Map 有 size，此时为 1。核心差异在引用强度：WeakMap 对键持弱引用，key = null 之后该对象没有其他强引用，可被 GC 回收，对应条目自动消失；Map 持强引用，会把对象长期钉在内存里，这就是典型的\"缓存导致内存泄漏\"。典型用途：给 DOM 节点挂私有数据、按对象缓存计算结果，节点销毁后自动释放，不用手动清理。", "android": "就是 Android 里 WeakReference / WeakHashMap 的 JS 版。用 static HashMap 缓存 Activity、View 会泄漏；前端用 Map 缓存已移除的 DOM 节点同样泄漏，换成 WeakMap 就自动解决。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - WeakMap 与弱引用"}, {"no": 17, "type": "single", "body": "关于下面这个 Vue3 自定义指令，描述正确的是？", "code": "// main.js\napp.directive('focus', {\n  mounted(el, binding) {\n    if (binding.value !== false) el.focus();\n  },\n  updated(el, binding) {\n    console.log(binding.value, binding.oldValue, binding.arg, binding.modifiers);\n  }\n});\n\n<!-- 模板 -->\n<input v-focus:input.trim=\"enabled\" />", "options": [{"k": "A", "t": "Vue3 指令钩子仍是 bind / inserted / update / componentUpdated / unbind"}, {"k": "B", "t": "Vue3 钩子改为与组件生命周期对齐：created / beforeMount / mounted / beforeUpdate / updated / beforeUnmount / unmounted；binding 可取 value、oldValue、arg（本例为 'input'）、modifiers（本例为 {trim:true}）"}, {"k": "C", "t": "自定义指令不支持参数和修饰符，只能接收一个绑定值"}, {"k": "D", "t": "mounted 钩子里拿不到真实 DOM，必须放到 nextTick 里才能 el.focus()"}], "answer": ["B"], "explain": "Vue3 把指令钩子重命名为与组件生命周期同名的一套，迁移映射是：bind → beforeMount、inserted → mounted、update / componentUpdated → beforeUpdate / updated、unbind → unmounted，另外新增 created（元素属性绑定前）。binding 对象提供 value（当前绑定值）、oldValue（仅 beforeUpdate / updated 有）、arg（冒号后的动态参数，这里是 'input'，还可写成 v-focus:[argName]）、modifiers（点号修饰符对象 {trim:true}）、instance（使用该指令的组件实例）、dir（指令定义对象）。mounted 时元素已插入父节点，可以直接操作 DOM。指令适合承载\"必须直接摸 DOM\"的横切逻辑：自动聚焦、v-permission 权限控制、图片懒加载、防重复点击、复制到剪贴板。", "android": "相当于给 View 写通用扩展或装饰器（Kotlin 的 View.setThrottleClick() 扩展函数、自定义 ViewBinding 逻辑），把\"每个页面都要重复写一遍的 View 操作\"抽成一处可复用的声明式能力。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 自定义指令"}, {"no": 18, "type": "single", "body": "组件里按下面两种方式取 Pinia 的 state，调用 store.inc() 之后，模板中 count 与 c2 的表现是？", "code": "const useCounter = defineStore('counter', {\n  state: () => ({ count: 0 }),\n  getters: { double: (s) => s.count * 2 },\n  actions: { inc() { this.count++ } }\n});\n\n// 组件中\nconst store = useCounter();\nconst { count } = store;                    // ① 直接解构\nconst { count: c2 } = storeToRefs(store);   // ② storeToRefs\n\nstore.inc();", "options": [{"k": "A", "t": "① 和 ② 都会随之更新"}, {"k": "B", "t": "① 不会更新（普通解构丢失响应式），② 会更新（storeToRefs 把 state/getters 包成 ref）"}, {"k": "C", "t": "① 会更新，② 不会"}, {"k": "D", "t": "两者都不会更新，必须额外用 computed 包一层"}], "answer": ["B"], "explain": "store 本质是一个 reactive 代理对象。直接解构等于在当时把属性\"取值\"出来赋给一个普通变量（0 这个数字），从此与 Proxy 再无关系，后续变更不会触发视图更新——这和解构 reactive 对象丢失响应式是同一个原理。storeToRefs 会遍历 store，把 state 和 getters 逐个用 toRef 包成 ref（自动跳过 actions 和非响应式属性），解构出来仍是 ref，在模板中自动解包、在 script 中用 .value 访问，因此保持响应式。补充：actions 是普通函数，不依赖 this 绑定之外的响应式，可以也应该直接解构 const { inc } = store。", "android": "类比 Android：把 LiveData / StateFlow 直接 .value 取出来存成一个字段，之后数据再变就收不到通知了；必须持有 Flow / LiveData 本身（相当于 ref）才能持续观察到变化。", "kaodian": "AI 前端能力 - 框架与组件 - Pinia 状态管理与解构"}, {"no": 19, "type": "single", "body": "关于下面这些 TypeScript 内置工具类型，说法【错误】的是？", "code": "interface User { id: number; name: string; age?: number; }\n\ntype A = Partial<User>;\ntype B = Required<User>;\ntype C = Pick<User, 'id' | 'name'>;\ntype D = Omit<User, 'age'>;\ntype E = Readonly<User>;", "options": [{"k": "A", "t": "A 把所有属性变为可选：{ id?: number; name?: string; age?: number }"}, {"k": "B", "t": "B 把所有属性变为必选，age 的类型变成 number（去掉了 undefined）"}, {"k": "C", "t": "本例中 C 与 D 的结构等价，都是 { id: number; name: string }"}, {"k": "D", "t": "E（Readonly）会递归地把嵌套对象内部的属性也变成只读"}], "answer": ["D"], "explain": "D 是错的：Readonly<T> 只作用于第一层（浅只读），嵌套对象内部的属性仍可修改；需要深只读得自己写递归条件类型 DeepReadonly<T>。其余三项都对：Partial / Required 是映射类型通过 ?/-? 增删可选修饰符实现；Pick<T,K> 挑选指定键，Omit<T,K> = Pick<T, Exclude<keyof T, K>> 排除指定键，本例中挑 id|name 和排除 age 结果确实一致。常用工具类型还有 Record<K,V>、Exclude/Extract、NonNullable<T>、ReturnType<F>、Parameters<F>、Awaited<T>。", "android": "解决的痛点和 Kotlin data class 一样：Kotlin 要做\"部分字段更新的 DTO\"得手写一个全字段可空的类，接口加字段时两处都要改还容易漏；TS 一个 Partial<User> 就完事，源类型改了衍生类型自动跟着变。", "kaodian": "AI 前端能力 - 工程化与网络 - TypeScript 内置工具类型"}, {"no": 20, "type": "single", "body": "关于 JUnit5 的测试实例生命周期，下面这段测试的输出与规则，正确的是？", "code": "class OrderServiceTest {\n\n    private int counter = 0;\n\n    @BeforeAll\n    static void initAll() { System.out.println(\"initAll\"); }\n\n    @BeforeEach\n    void init() { counter++; }\n\n    @Test void t1() { System.out.println(\"t1:\" + counter); }\n    @Test void t2() { System.out.println(\"t2:\" + counter); }\n}", "options": [{"k": "A", "t": "整个类只创建一个实例，counter 会累加，打印 t1:1 与 t2:2"}, {"k": "B", "t": "默认 Lifecycle.PER_METHOD，每个 @Test 前都新建测试类实例，两次都打印 1；@BeforeAll 必须是 static，除非在类上加 @TestInstance(Lifecycle.PER_CLASS)"}, {"k": "C", "t": "@BeforeAll 可以直接写成非 static 的实例方法，没有任何前提条件"}, {"k": "D", "t": "JUnit5 沿用 JUnit4 的 @BeforeClass / @Before 注解，代码根本编译不过"}], "answer": ["B"], "explain": "JUnit5 默认使用 Lifecycle.PER_METHOD：每个 @Test 执行前都会 new 一个测试类实例，成员变量天然隔离，所以 counter 在 t1、t2 中都是 1。这是框架层面为\"测试用例相互独立\"提供的保障。因为执行 @BeforeAll / @AfterAll 时实例还不存在，它们必须声明为 static；只有在类上标注 @TestInstance(TestInstance.Lifecycle.PER_CLASS) 让整个类共用一个实例时，才可以写成非 static（此时也要小心跨用例的状态污染）。注解迁移对照：@Before → @BeforeEach、@BeforeClass → @BeforeAll、@Ignore → @Disabled、@Test(expected=) → assertThrows、@RunWith → @ExtendWith。", "android": "和 Android 单测里每个 @Test 前重新构造 Presenter / ViewModel 是一个思路：不让上一个用例的脏状态串到下一个。共享成员状态的测试在 CI 上并行跑最容易出现\"本地过、流水线随机挂\"。", "kaodian": "AI 质量保障 - 自动化测试与工具 - JUnit5 测试实例生命周期"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "fe", "questions": [{"no": 21, "type": "multi", "body": "线上服务运行数天后 Full GC 频繁、老年代持续上涨，最终 OOM。以下哪些写法属于常见的 Java 内存泄漏源？（多选，多选、少选、错选均不得分）", "code": "// ①\nprivate static final Map<String, User> CACHE = new HashMap<>();\npublic void put(String k, User v) { CACHE.put(k, v); }      // 只增不删\n\n// ②\nprivate static final ThreadLocal<Context> CTX = new ThreadLocal<>();\npublic void handle() { CTX.set(new Context()); /* 用完没有 remove() */ }\n\n// ③\npublic void read() throws Exception {\n    InputStream in = new FileInputStream(\"a.txt\");\n    process(in);        // 这里抛异常就走不到 close\n    in.close();\n}\n\n// ④\nList<Integer> list = new ArrayList<>(1000);\nlist.clear();", "options": [{"k": "A", "t": "① 静态集合无界增长，其中的对象被 GC Roots 长期强引用"}, {"k": "B", "t": "② 线程池复用线程时 ThreadLocalMap 的 entry 不被清理，value 强引用对象无法回收"}, {"k": "C", "t": "③ 未用 try-with-resources，异常路径下流对象与底层文件句柄不释放"}, {"k": "D", "t": "④ clear() 之后元素引用未置空，1000 个元素会一直驻留内存"}], "answer": ["A", "B", "C"], "explain": "① 静态字段本身就是 GC Roots，无界缓存等于永久持有，必须换成有容量上限和淘汰策略的本地缓存（Caffeine、LinkedHashMap 实现的 LRU）或直接放 Redis 并设 TTL。② 线程池里的线程长期存活，ThreadLocalMap 的 key 是弱引用但 value 是强引用，不 remove 就一直挂在线程上，既泄漏又会串号（下一个请求读到上一个请求的上下文），标准写法是 try { ... } finally { CTX.remove(); }。③ 应改成 try (InputStream in = new FileInputStream(\"a.txt\")) { ... }，异常路径也能自动关闭，否则堆外的文件句柄同样会耗尽。④ 说法错误：ArrayList.clear() 会把 elementData 中每个槽位显式置为 null，元素可被回收，只是底层数组容量还在（想缩容用 trimToSize），不构成泄漏。排查手法：jmap -histo:live 看对象直方图、jcmd GC.heap_dump 导出后用 MAT 看支配树和到 GC Roots 的最短强引用链。", "android": "完全对应 Android 三大经典泄漏：static 字段持有 Context / View、非静态内部类 Handler 持有 Activity、Cursor / 流未关闭。只是工具从 LeakCanary 换成 MAT / Arthas，排查思路一模一样——找从 GC Roots 到目标对象的强引用链。", "kaodian": "AI 后端能力 - 语言基础层 - 内存泄漏典型场景"}, {"no": 22, "type": "multi", "body": "Spring Boot 项目需要把健康检查和运行指标暴露给 K8s 与 Prometheus，配置如下。以下理解正确的有哪些？（多选）", "code": "management:\n  endpoints:\n    web:\n      exposure:\n        include: health,info,metrics,prometheus\n  endpoint:\n    health:\n      show-details: when_authorized\n      probes:\n        enabled: true\n  server:\n    port: 9090", "options": [{"k": "A", "t": "默认情况下 Actuator 经 Web 暴露的端点很有限（health 等），env、beans、heapdump 等敏感端点必须显式 include 才能访问，且线上应配合鉴权保护"}, {"k": "B", "t": "开启 probes 后会提供 /actuator/health/liveness 与 /actuator/health/readiness，分别对应 K8s 的存活探针与就绪探针，语义不同不能混用"}, {"k": "C", "t": "management.server.port 单独设端口，可以让监控端口与业务端口隔离，只在内网放行、不对外暴露"}, {"k": "D", "t": "/actuator/prometheus 由 spring-boot-starter-actuator 自动提供，无需引入 micrometer-registry-prometheus 依赖"}], "answer": ["A", "B", "C"], "explain": "A 正确：Boot 2.x 起 Web 默认只暴露极少数端点，其余要显式 include；线上误开 /actuator/env、/actuator/configprops 会直接泄漏数据库密码和密钥，必须用 Spring Security 或网关规则挡住。B 正确：liveness 探针失败 K8s 会重启容器，readiness 探针失败只是把 Pod 从 Service 端点摘掉不再分流量，把慢依赖检查塞进 liveness 会导致\"依赖抖动 → 容器被反复重启\"的雪崩。C 正确：换独立端口后可只在内网 ACL / NetworkPolicy 放行监控采集。D 错误：/actuator/prometheus 端点由 micrometer-registry-prometheus 依赖注册，只加 starter-actuator 是没有这个端点的。补充：实现 HealthIndicator 接口即可自定义健康项，会自动聚合进 /actuator/health 的总状态。", "android": "相当于 App 内置的\"开发者选项 / 诊断页\"：平时藏起来，出问题时能一眼看到线程池、连接池、缓存命中率的实时状态；区别是服务端这套要对接监控系统做趋势图和告警，而不是靠人肉打开看。", "kaodian": "AI 后端能力 - 框架与容器层 - Actuator 端点与健康探针"}, {"no": 23, "type": "multi", "body": "订单库一主两从、应用侧做了读写分离。用户下单成功后立刻跳转\"我的订单\"，偶发查不到刚下的单。以下分析与方案正确的有哪些？（多选）", "code": "应用 --写--> Master --binlog--> Slave1 / Slave2 --读--> 应用\n\n现象：写入后 20ms 内读从库，偶尔读不到\n监控：Seconds_Behind_Master 在业务高峰会涨到几百毫秒甚至数秒", "options": [{"k": "A", "t": "MySQL 默认是异步复制，主库事务提交后不等从库确认就返回客户端，因此必然存在复制延迟窗口"}, {"k": "B", "t": "对\"写后立即读\"这类强一致场景，可以强制路由到主库（如动态数据源 @DS(\"master\")、ShardingSphere 的 HintManager 强制主库）"}, {"k": "C", "t": "半同步复制（semi-sync）让主库至少等待一个从库确认收到 relay log 再返回，能缩小丢失与延迟窗口，代价是写入性能下降"}, {"k": "D", "t": "把 binlog_format 从 ROW 改成 STATEMENT，主从延迟就会消失"}], "answer": ["A", "B", "C"], "explain": "A：异步复制下主库根本不关心从库进度，网络抖动、大事务、从库单线程回放都会把 Seconds_Behind_Master 拉大。B：这是最常用也最直接的兜底——把\"写后读\"的查询、或同一会话在写操作后的一段时间内强制走主库。C：semi-sync 只保证从库收到并写入 relay log（不保证已回放完成），是可用性与一致性的折中；另外 MySQL 5.7+ 可开并行复制（slave_parallel_workers + slave_parallel_type=LOGICAL_CLOCK）提升回放速度，从根上压小延迟。D 错误：binlog_format 决定的是日志内容形式（ROW 记录行前后镜像，STATEMENT 记录原始 SQL），STATEMENT 对 NOW()、UUID()、LIMIT 无 ORDER BY 等不确定语句并不安全，反而会造成主从数据不一致，跟延迟不是一回事。", "android": "和 App 端\"本地先写缓存、再异步同步服务端\"是同一类问题：提交后立刻刷新列表可能拿到旧数据。客户端常用\"本地乐观插入一条占位\"兜住体验，服务端这边则是强制读主库。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 主从复制与读写分离"}, {"no": 24, "type": "multi", "body": "订单超时关单用 Spring 的 @Scheduled 实现，服务扩到 3 个实例后同一笔订单被关了 3 次、发了 3 条通知。以下哪些方案能正确解决？（多选）", "code": "@Scheduled(cron = \"0 */5 * * * ?\")\npublic void closeTimeoutOrder() {\n    List<Order> list = orderMapper.selectTimeout();\n    list.forEach(this::close);      // 3 个实例同时在跑\n}", "options": [{"k": "A", "t": "引入 ShedLock，用数据库或 Redis 记录锁，保证同一时刻只有一个实例真正执行该任务"}, {"k": "B", "t": "接入 XXL-JOB / ElasticJob 等调度中心，由调度器决定路由到哪个执行器，并附带分片、失败重试、执行日志"}, {"k": "C", "t": "业务侧做幂等：用 UPDATE t_order SET status='已关闭' WHERE id=? AND status='待支付' 的条件更新，按影响行数判断本次是否真正关单，为 0 则不发通知"}, {"k": "D", "t": "把每个实例的 cron 错开几秒执行，就不会重复了"}], "answer": ["A", "B", "C"], "explain": "A：ShedLock 通过一条带唯一约束的锁记录加 lockAtMostFor / lockAtLeastFor 保证互斥，对代码侵入最小，适合任务不多的场景。B：调度中心是更完整的方案，支持路由策略（第一个 / 轮询 / 分片广播）、超时告警、失败重试、任务依赖，任务多时更好管理。C：幂等是最后一道防线——即使锁失效、GC 停顿导致锁过期、或消息重投，条件更新的影响行数为 0 就说明已被别人处理，直接跳过后续副作用（发通知、退库存）。实践中 A/B 与 C 要叠加使用，锁保证\"通常只跑一次\"，幂等保证\"跑多次也不出错\"。D 错误：错峰只是把冲突概率变小，一旦任务耗时超过错峰间隔照样重叠，属于典型的临时规避而非根治。", "android": "类似 Android WorkManager 用唯一任务名加 ExistingWorkPolicy.KEEP 保证同一任务不重复入队；差别在于这里的唯一性要跨进程跨机器，只能靠外部存储（DB / Redis）来做锁。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 分布式定时任务与互斥"}, {"no": 25, "type": "multi", "body": "网关服务用 Netty，JVM 设了 -Xmx2g，但容器 RSS 涨到 5G 被 OOMKilled，导出的堆 dump 却只有 1G。以下说法正确的有哪些？（多选）", "code": "ByteBuffer buf = ByteBuffer.allocateDirect(1024 * 1024);   // 堆外直接内存\n// JVM 参数：-Xmx2g -XX:MaxDirectMemorySize=512m\n\nfileChannel.transferTo(0, len, socketChannel);              // 零拷贝发送", "options": [{"k": "A", "t": "allocateDirect 分配的是堆外（直接）内存，不占 -Xmx，但受 -XX:MaxDirectMemorySize 限制，超限抛 OutOfMemoryError: Direct buffer memory"}, {"k": "B", "t": "DirectByteBuffer 依赖 Cleaner / 虚引用在其堆内对象被回收时才释放堆外内存；若堆内压力小迟迟不 GC，堆外内存就会持续堆积"}, {"k": "C", "t": "transferTo 属于零拷贝，可减少内核态与用户态之间的数据拷贝次数和上下文切换"}, {"k": "D", "t": "Java 进程的 RSS 基本等于 Java 堆，所以堆 dump 只有 1G 就说明监控数据有误"}], "answer": ["A", "B", "C"], "explain": "A / B 是堆外泄漏的经典模型：直接内存的生命周期挂在一个非常小的 DirectByteBuffer 堆内对象上，堆内对象小就很难触发 GC，堆外内存迟迟不释放——这也是 Netty 用引用计数 ReferenceCounted + 显式 release() 主动管理内存、而不依赖 GC 的原因。C：transferTo 底层走 sendfile，数据不必再经用户空间中转，大文件 / 大报文转发收益明显。D 错误：JVM 进程内存 = Java 堆 + Metaspace + 线程栈（每线程约 1M × 线程数）+ 代码缓存 + 直接内存 + JNI/native 分配 + GC 自身结构 + glibc arena 碎片。排查容器 OOMKilled 要用 NMT（-XX:NativeMemoryTracking=detail 配合 jcmd VM.native_memory summary）或 pmap，只盯堆 dump 会漏掉一大半。", "android": "和 Android 8.0 之后 Bitmap 像素数据放到 native 堆一个道理：Java 堆看着很干净，进程总内存却爆了，OOM 日志也不在 Java 堆上。排查同样要看 native 内存而不是只看 Java 堆快照。", "kaodian": "AI 后端能力 - 语言基础层 - 堆外内存与零拷贝"}, {"no": 26, "type": "multi", "body": "H5 后台系统需要实现\"在 A 标签页退出登录后，同域名下其他已打开的标签页也立刻跳登录页\"。以下哪些说法正确？（多选）", "code": "// 方案一：监听 storage 事件\nwindow.addEventListener('storage', (e) => {\n  if (e.key === 'token' && e.newValue === null) location.href = '/login';\n});\n\n// 方案二：BroadcastChannel\nconst ch = new BroadcastChannel('auth');\nch.onmessage = (e) => { if (e.data === 'logout') location.href = '/login'; };", "options": [{"k": "A", "t": "localStorage 的 storage 事件只在\"同源的其他标签页\"触发，发起修改的那个页面自身收不到，正好适合做跨页同步"}, {"k": "B", "t": "BroadcastChannel 可在同源的所有浏览上下文（标签页、iframe、Worker）之间广播，API 比 storage 事件更直观，但老浏览器需降级"}, {"k": "C", "t": "window.postMessage 用于当前页面与它持有引用的窗口/iframe（opener、frames、window.open 的返回值）之间通信，可跨域但接收方必须校验 event.origin"}, {"k": "D", "t": "sessionStorage 的变更同样会触发其他标签页的 storage 事件，所以用 sessionStorage 也能做跨页同步"}], "answer": ["A", "B", "C"], "explain": "A：storage 事件的设计目的就是\"通知别人\"，触发修改的页面收不到自己的事件，所以本页逻辑要自己额外处理。B：BroadcastChannel 是专门的同源广播通道，postMessage / onmessage 语义清晰，不用借 storage 打补丁；缺点是 IE 和部分旧 Safari 不支持，需要降级到 storage 事件。C：postMessage 适用于有窗口引用关系或跨域 iframe 的定向通信，安全要点是接收方必须校验 event.origin、发送方尽量指定具体 targetOrigin 而不是 '*'，否则容易被恶意页面注入或窃听。D 错误：sessionStorage 是\"标签页级\"隔离的，B 标签页压根看不到 A 标签页的 sessionStorage，自然也不会触发跨页 storage 事件。", "android": "对应 Android 里进程内用 LocalBroadcastManager / EventBus、跨进程用 AIDL 或广播：storage 事件 ≈ 应用内广播，postMessage ≈ 定向 IPC。安全注意点也一样——必须校验消息来源，防止被伪造消息劫持登录态。", "kaodian": "AI 前端能力 - 工程化与网络 - 跨窗口通信机制"}, {"no": 27, "type": "multi", "body": "线上 H5 偶发白屏，用户描述不清。要建立前端错误监控体系，以下做法正确的有哪些？（多选）", "code": "window.addEventListener('error', (e) => {\n  report({ type: 'js', msg: e.message, stack: e.error && e.error.stack });\n}, true);\n\nwindow.addEventListener('unhandledrejection', (e) => {\n  report({ type: 'promise', reason: e.reason });\n});\n\nwindow.addEventListener('pagehide', () => {\n  navigator.sendBeacon('/log', JSON.stringify(queue));\n});", "options": [{"k": "A", "t": "try/catch 抓不到异步回调与 Promise 中的异常，必须额外监听 unhandledrejection 才能覆盖未处理的 Promise 拒绝"}, {"k": "B", "t": "资源加载失败（img/script 404）不会冒泡到 window，只有在捕获阶段监听（addEventListener('error', handler, true)）才能捕获到"}, {"k": "C", "t": "页面卸载时用 navigator.sendBeacon 上报，浏览器会在后台可靠发送，不会因为页面关闭而被中断（普通异步 XHR 可能被丢弃）"}, {"k": "D", "t": "上线必须彻底关闭 sourcemap 生成，否则压缩后的堆栈永远无法还原"}], "answer": ["A", "B", "C"], "explain": "A：window.onerror 只能捕获同步执行栈中抛出的错误，Promise 内部 reject 又没有 catch 时走的是 unhandledrejection 事件，两者必须都监听。B：资源加载错误只在目标元素上触发且不冒泡，必须用捕获阶段（第三个参数传 true）或给元素单独绑 onerror；也正因如此，可以用 e.target 是否有 src/href 来区分\"资源错误\"和\"JS 运行时错误\"。C：sendBeacon 用 POST 把数据交给浏览器后台队列，页面关闭也会发出去，是卸载时上报的标准做法（fetch 加 keepalive: true 同理）；注意监听 pagehide / visibilitychange 比 beforeunload 在移动端更可靠。D 错误：正确姿势是\"生成 sourcemap 但不部署到公网\"——构建产物中的 .map 上传到 Sentry 等监控平台的私有存储用于还原堆栈，线上目录里删掉 .map 或去掉 sourceMappingURL 注释。完全不生成会导致压缩后的堆栈只有 a.b.c 这种混淆名，白屏根本定位不了。", "android": "对应 Android 的 Thread.setDefaultUncaughtExceptionHandler 加 Bugly / Crashlytics，以及混淆 mapping.txt 必须上传但绝不能打进 APK。sourcemap 的处置策略和 mapping 文件完全一致：留着还原，别泄漏。", "kaodian": "AI 前端能力 - 工程化与网络 - 前端异常监控与上报"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "test", "questions": [{"no": 28, "type": "judge", "body": "子类定义了与父类签名相同的 static 方法，属于方法重写（Override），运行时会按对象的实际类型进行动态分派。（判断）", "code": "class Parent { static String who() { return \"parent\"; } }\nclass Child extends Parent { static String who() { return \"child\"; } }\n\nParent p = new Child();\nSystem.out.println(p.who());   // 输出什么？", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "静态方法属于类而不属于实例，子类中同签名的 static 方法是\"隐藏（hiding）\"而不是\"重写（overriding）\"，在编译期就按引用的声明类型静态绑定。上面 p 的声明类型是 Parent，所以打印的是 parent，不是 child。同理，字段访问也是静态绑定（父子类同名字段按声明类型解析），只有实例方法才参与运行时多态分派。另外，通过实例引用去调用静态方法（p.who()）本身就是坏味道，IDE 会给出告警，正确写法是 Parent.who() / Child.who()。", "android": "Android 里工具类大量使用 static（DensityUtil.dp2px、SPUtils.get 之类），想通过继承\"重写\"其中某个 static 方法来做 Mock 或换实现是无效的；要多态就得改成实例方法配合接口注入，这也是它们难以单测的根本原因。", "kaodian": "AI 后端能力 - 语言基础层 - 静态方法隐藏与多态"}, {"no": 29, "type": "judge", "body": "Redis 6.0 引入的多线程只用于网络 I/O 的收发与协议解析，命令的实际执行仍由单线程串行完成，因此单个命令天然具备原子性。（判断）", "code": "# redis.conf\nio-threads 4\nio-threads-do-reads yes\n\n# 架构：多个 I/O 线程（收包/解析/回包） -> 单线程命令执行器 -> 内存数据结构", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Redis 6.0 的多线程只解决网络 I/O 这个瓶颈（读 socket、解析 RESP 协议、写回响应），命令执行链路依旧是单线程事件循环，所以内部数据结构不需要加锁，单条命令具备原子性。但要配套记住三点：① \"单命令原子\"不等于\"多命令组合原子\"，先 GET 判断再 SET 这种 check-then-set 必须用 Lua 脚本或 MULTI/EXEC 保证；② 单线程执行意味着一条慢命令会阻塞所有客户端——KEYS *、大 key 的 HGETALL/SMEMBERS、O(N) 的 SORT 都是生产禁区，应该用 SCAN 渐进遍历并拆分大 key；③ RDB 的 fork、AOF 后台刷盘、UNLINK 的异步删除本来就在其他线程或子进程中完成，与命令执行线程无关。", "android": "非常像 Android 的主线程模型：所有 UI 操作都在主线程串行执行，所以不用加锁，但只要有一个耗时操作就会卡住整个界面。Redis 的慢命令就等于\"在主线程里干重活\"，影响范围是所有连上来的客户端。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 线程模型与多线程 I/O"}, {"no": 30, "type": "judge", "body": "给元素同时设置 transition 并从 display:none 直接切到 display:block，过渡动画不会生效；需要改用 visibility/opacity，或先渲染再于下一帧修改动画属性。（判断）", "code": ".panel        { display: none;  opacity: 0; transition: opacity .3s; }\n.panel.show   { display: block; opacity: 1; }\n\n// JS 里一次性加 class\npanel.classList.add('show');   // 期望淡入，实际直接出现", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "display 是离散属性、不可参与过渡；而且从 none 切到 block 时元素刚刚被创建渲染盒，浏览器会把 display 与 opacity 的变更合并在同一帧计算样式，没有\"起始值 → 结束值\"这个过程，动画被直接跳过。常见解法：① 用 visibility + opacity 组合（visibility 可以配合 transition-delay 实现\"淡出后再隐藏\"）；② 先设 display:block，强制读一次布局属性（如 el.offsetHeight）触发同步重排，再加 .show；③ 用 requestAnimationFrame 把加 class 推到下一帧；④ 直接用 Vue 的 <Transition> 组件，它内部就是分帧加 class 的。补充：CSS 新特性 @starting-style 与 transition-behavior: allow-discrete 已开始支持 display 过渡，但兼容性还有限，生产上仍以前述方案为主。", "android": "和 Android 里 View.setVisibility(GONE → VISIBLE) 后立刻启动属性动画一样：必须等 View 完成一次测量布局（post 到下一帧或用 ViewTreeObserver 回调）动画才有正确起点，否则就是直接闪现出来。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - 过渡动画生效条件"}, {"no": 31, "type": "judge", "body": "HTTP/3 基于 UDP 之上的 QUIC 协议，从传输层解决了 HTTP/2 在 TCP 上的队头阻塞问题，并把 TLS 握手与连接握手合并从而降低建连延迟。（判断）", "code": "HTTP/1.1 : TCP  + 可选 TLS，连接可复用但请求仍串行（管线化基本没落地）\nHTTP/2   : TCP  + TLS，二进制分帧、多路复用（应用层不阻塞，但 TCP 层仍有队头阻塞）\nHTTP/3   : QUIC(UDP) + TLS1.3，stream 级独立重传；1-RTT 建连、恢复可 0-RTT；支持连接迁移", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "HTTP/2 在应用层做了多路复用，但底层还是一条 TCP 连接：一旦发生丢包，TCP 的有序交付语义会让所有 stream 一起等待重传，这就是\"TCP 队头阻塞\"，在弱网下 HTTP/2 甚至可能不如多条 HTTP/1.1 连接。HTTP/3 把传输层换成 UDP 之上的 QUIC，每条 stream 独立编号与重传，丢包只影响受害的那一条流。QUIC 内置 TLS1.3，把\"TCP 三次握手 + TLS 握手\"合并压缩到 1-RTT，会话恢复可做到 0-RTT。此外 QUIC 用 Connection ID 标识连接而非四元组，网络切换后连接不中断（连接迁移）。", "android": "移动端最有体感的正是连接迁移：Android App 在地铁、电梯里 Wi-Fi 与蜂窝频繁切换，基于四元组的 TCP 连接会断、要重连重试重传；QUIC 靠 Connection ID 保持会话不中断。Cronet（Chromium 网络栈）默认就启用 QUIC，很多大厂 App 用它替换 OkHttp 的默认传输就是为了这个。", "kaodian": "AI 前端能力 - 工程化与网络 - HTTP/3 与 QUIC"}, {"no": 32, "type": "judge", "body": "自动化测试用例之间应保持相互独立、可任意顺序单独执行；如果用例 B 依赖用例 A 产生的数据，只要在套件里保证 A 排在 B 前面即可，不算问题。（判断）", "code": "@Test void a_createOrder() { orderId = api.create(); }   // 产生数据\n@Test void b_payOrder()    { api.pay(orderId); }         // 依赖上一个用例", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "前半句对，后半句错。用例互相依赖会带来一连串问题：① 顺序不可控——JUnit5 默认不保证方法执行顺序（要显式加 @TestMethodOrder），CI 上并行执行更是乱序；② 失败放大——A 失败会导致 B 连带失败，一个根因产生一片红，定位噪音大；③ 无法单跑——回归时想只验证支付逻辑都跑不起来，必须带上前面一串。正确做法是每个用例自备前置数据（在 @BeforeEach 或用例内部通过 API / 工厂方法准备），执行完清理（@AfterEach 回滚或删除），这就是 FIRST 原则中的 Independent。确实需要串联的业务链路，应该写成\"一个完整的场景用例\"（一个 @Test 内跑完下单 → 支付 → 校验），而不是拆成互相依赖的多个用例。", "android": "和 Android Espresso UI 测试完全一样：上一个用例残留的登录态、未关闭的弹窗、脏数据库会让下一个用例莫名失败。所以每个用例前都要 clearData 或把 App 重置到确定状态，否则本地能过、流水线随机挂。", "kaodian": "AI 质量保障 - 自动化测试与工具 - 自动化用例独立性"}, {"no": 33, "type": "judge", "body": "为了让测试数据更真实，接口自动化测试可以直接连生产数据库读写，只要测试结束后记得把数据删掉就行。（判断）", "code": "# 反例配置\nspring:\n  datasource:\n    url: jdbc:mysql://prod-db:3306/order   # 自动化直连生产库", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "直连生产库跑自动化是高危做法：① 写操作会污染真实业务数据，而\"记得删掉\"的清理脚本本身就是风险点——WHERE 条件写漏一个就是删全表的生产事故；② 会触发真实的下游副作用，给真实用户发短信、推送、甚至扣款；③ 批量造数与压测会挤占生产库连接和 IO，影响线上性能；④ 违反数据安全与合规要求，手机号、身份证等敏感信息不应流入测试链路。正确做法：独立测试环境 + 独立数据库；基础数据用脱敏后的生产快照；用例数据用工厂 / 夹具（fixture）按需生成、用完即清；第三方依赖用 Mock、Stub 或对方提供的沙箱环境；确实要在生产验证的（如全链路压测）必须做影子库 / 影子表加流量染色，把测试流量与真实流量彻底隔离。", "android": "相当于拿正式包连线上后台做点击测试：一不小心就给真实用户发了推送、下了真实订单。Android 侧标准做法是用 buildType / productFlavor 区分环境和后台地址，服务端同理必须做环境隔离，绝不能让自动化脚本指向生产。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 测试环境与数据隔离"}]}]}</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
