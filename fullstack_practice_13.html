<!DOCTYPE html>

<title>全栈转型模拟自测卷</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2329; margin: 0; padding: 24px 24px 96px; line-height: 1.65; }
  .container { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: #646a73; font-size: 14px; margin-bottom: 4px; }
  .meta { background: #fff; border-radius: 10px; padding: 14px 18px; margin: 16px 0 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); font-size: 14px; color: #41464b; }
  .meta b { color: #1664ff; }
  .backlink { display:inline-block; margin: 4px 0 10px; color:#1664ff; text-decoration:none; font-size:14px; }
  .backlink:hover { text-decoration: underline; }
  .section { margin-top: 28px; }
  .section h2 { font-size: 18px; margin: 0 0 12px; padding-left: 10px; border-left: 4px solid #1664ff; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card.correct { box-shadow: 0 0 0 2px #52c41a inset, 0 1px 3px rgba(0,0,0,.06); }
  .card.wrong { box-shadow: 0 0 0 2px #ff4d4f inset, 0 1px 3px rgba(0,0,0,.06); }
  .q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .q-no { font-weight: 700; font-size: 15px; }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: 4px; font-weight: 600; }
  .tag-single { background: #e8f3ff; color: #1664ff; }
  .tag-multi  { background: #fff3e0; color: #d4860b; }
  .tag-judge  { background: #fde8f3; color: #c41d7f; }
  .tag-fill   { background: #e9f9ee; color: #1a9e4b; }
  .kaodian { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; background: #f0f2f5; color: #646a73; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-badge { font-size:12px; padding:2px 9px; border-radius:4px; font-weight:700; margin-left:auto; }
  .res-badge.ok { background:#e9f9ee; color:#1a9e4b; }
  .res-badge.no { background:#fff1f0; color:#ff4d4f; }
  .q-body { font-size: 15px; margin-bottom: 10px; }
  .code { background: #2b2f36; color: #e6e6e6; border-radius: 8px; padding: 12px 14px;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; overflow-x: auto; margin: 10px 0; white-space: pre; }
  .options { margin: 8px 0 4px; }
  .opt { display: flex; align-items:flex-start; gap:8px; padding: 9px 12px; border-radius: 8px; margin: 6px 0;
    background: #f7f8fa; border: 1.5px solid transparent; font-size: 14px; cursor: pointer; transition: all .12s; }
  .opt:hover { background: #eef2f7; }
  .opt .k { font-weight:700; color:#1664ff; min-width: 16px; }
  .opt.sel { background: #e8f3ff; border-color: #1664ff; }
  .opt.correct { background: #f0f9eb; border-color: #52c41a; }
  .opt.correct .k { color:#52c41a; }
  .opt.wrong { background: #fff1f0; border-color: #ff4d4f; }
  .opt.wrong .k { color:#ff4d4f; }
  .opt.locked { cursor: default; }
  .q-actions { margin-top: 10px; }
  .q-check { background:#1664ff; color:#fff; border:none; border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; font-weight:600; }
  .q-check:hover { background:#0e4fd8; }
  .card.graded .q-check { display:none; }
  .blank { border:none; border-bottom: 1.5px solid #1664ff; background:#f7f8fa; padding: 3px 8px; margin: 0 4px;
    font-size:14px; min-width: 120px; border-radius:4px 4px 0 0; }
  .blank.correct { border-bottom-color:#52c41a; background:#f0f9eb; }
  .blank.wrong { border-bottom-color:#ff4d4f; background:#fff1f0; }
  .answer { display: none; margin-top: 14px; padding: 14px; background: #f0f9eb;
    border-left: 4px solid #67c23a; border-radius: 6px; font-size: 14px; }
  .answer.show { display: block; }
  .answer .ans { font-weight: 700; color: #1a9e4b; margin-bottom: 8px; font-size: 15px; }
  .answer .label { font-weight: 700; }
  .footer { text-align: center; color: #9aa0a6; font-size: 13px; margin: 30px 0 10px; }
  .bar { position: fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #e5e6eb;
    box-shadow: 0 -2px 10px rgba(0,0,0,.05); padding: 10px 16px; display:flex; gap:10px; align-items:center; justify-content:center; z-index: 50; }
  .bar .prog { font-size: 14px; color:#41464b; margin-right: auto; }
  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }
  .bar .userbox a { color:#1664ff; cursor:pointer; text-decoration:none; }
  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }
  .result-panel.show { display:block; }
  .result-panel .score { font-size:30px; font-weight:800; color:#1664ff; }
  .result-panel .score small { font-size:15px; color:#646a73; font-weight:500; }
  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }
  .result-panel .wrongs a { display:inline-block; margin:3px 6px 3px 0; padding:2px 8px; background:#fff1f0; color:#ff4d4f; border-radius:4px; text-decoration:none; font-weight:600; }
  @media (max-width:600px) {
    body { padding: 12px 12px 100px; }
    .container { max-width: 100%; }
    h1 { font-size: 20px; }
    .meta { padding: 10px 12px; font-size: 13px; }
    .card { padding: 14px 12px; margin-bottom: 10px; }
    .q-body { font-size: 14px; }
    .code { font-size: 11px; padding: 10px 10px; }
    .opt { padding: 8px 10px; font-size: 13px; }
    .bar { padding: 8px 10px; gap: 6px; }
    .bar .prog { font-size: 12px; }
    .btn { padding: 7px 12px; font-size: 13px; }
    .section h2 { font-size: 16px; }
    .answer { font-size: 13px; }
  }
</style>

<script type="application/json" id="quizData">{"id": "vol13", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "InnoDB 中聚簇索引（Clustered Index）指？", "code": "-- InnoDB 主键即聚簇索引，数据行按主键顺序存于叶子节点\n-- 二级索引叶子存 主键值", "options": [{"k": "A", "t": "InnoDB 以主键构建聚簇索引，整行数据存于主键索引叶子，表即索引"}, {"k": "B", "t": "聚簇索引是把数据另存一份，索引只存指针"}, {"k": "C", "t": "MyISAM 也有聚簇索引"}, {"k": "D", "t": "聚簇索引与主键无关"}], "answer": "A", "explain": "InnoDB 中表数据按主键顺序组织，主键索引的叶子节点直接放整行（聚簇）。二级索引叶子存主键值，回表时需再到主键索引取行。MyISAM 是非聚簇（索引与数据分离）。B/C/D 错。", "kaodian": "AI后端能力-数据存储与ORM层-SQL聚簇索引"}, {"no": 2, "type": "single", "body": "Nacos 配置动态刷新，下列能实时生效的是？", "code": "@RefreshScope\n@RestController\npublic class CfgController {\n  @Value(\"${app.msg}\")\n  private String msg;   // 改 Nacos 配置后刷新生效\n}", "options": [{"k": "A", "t": "Nacos 只能管理服务发现不能管配置"}, {"k": "B", "t": "在 Bean 上加 @RefreshScope，@Value 注入的配置可在 Nacos 修改后动态刷新"}, {"k": "C", "t": "不加 @RefreshScope 也能自动刷新"}, {"k": "D", "t": "@Value 永远读取启动时的配置，无法刷新"}], "answer": "B", "explain": "Nacos 配置中心：@RefreshScope 标注的 Bean 在配置变更时会销毁重建，使 @Value/@ConfigurationProperties 拿到新值。缺 @RefreshScope 则还是旧值（C 错）。D 绝对化；Nacos 同时支持配置中心与服务发现（A 错）。", "kaodian": "AI后端能力-微服务与云原生层-Nacos动态刷新"}, {"no": 3, "type": "single", "body": "Spring 应用事件机制，下列用法正确的是？", "code": "@EventListener\npublic void onOrderPaid(OrderPaidEvent e) { /* 发通知 */ }\n// 发布\napplicationEventPublisher.publishEvent(new OrderPaidEvent(order));", "options": [{"k": "A", "t": "必须继承特定基类才能发布事件"}, {"k": "B", "t": "监听器无法获取事件参数"}, {"k": "C", "t": "用 ApplicationEventPublisher 发布事件，@EventListener 方法异步/同步接收处理"}, {"k": "D", "t": "事件只能同步处理，无法异步"}], "answer": "C", "explain": "Spring 事件：发布方注入 ApplicationEventPublisher.publishEvent(...)；消费方用 @EventListener 标注方法接收。配合 @Async 可异步处理（D 错）；事件对象任意 POJO（A 错）；方法参数即事件类型（B 错）。", "kaodian": "AI后端能力-应用框架层-Spring事件"}, {"no": 4, "type": "single", "body": "Redis 高级数据结构应用场景，下列对应正确的是？", "code": "// Bitmap：每日签到（位运算）\n// HyperLogLog：UV 去重估算\n// Geo：附近的人（经纬度）", "options": [{"k": "A", "t": "HyperLogLog 能精确去重不误差"}, {"k": "B", "t": "Bitmap 只能存字符串"}, {"k": "C", "t": "Geo 与 ZSET 无关"}, {"k": "D", "t": "Bitmap 适合海量二值统计（签到/在线），HyperLogLog 估算去重基数，Geo 做位置检索"}], "answer": "D", "explain": "Bitmap 用位存二值状态，极省空间（签到/在线，D 正确）；HyperLogLog 以极小内存估算基数但有一定误差（非精确，A 错）；Geo 底层基于 ZSET 实现（C 错）；Bitmap 存位非字符串（B 错）。", "kaodian": "AI后端能力-高并发与中间件层-Redis高级数据结构"}, {"no": 5, "type": "single", "body": "CopyOnWriteArrayList 适合的场景是？", "code": "// 读多写少\nList<String> list = new CopyOnWriteArrayList<>();\nlist.add(\"x\");  // 写时复制整个数组", "options": [{"k": "A", "t": "读远多于写（如配置监听列表），写时复制数组保证读无锁"}, {"k": "B", "t": "写多读少的高并发场景"}, {"k": "C", "t": "需要元素为 null 的列表"}, {"k": "D", "t": "替代 HashMap 存键值"}], "answer": "A", "explain": "CopyOnWriteArrayList 读无锁、写时复制整个底层数组，读性能高但写开销大，适合读多写少（如监听器列表）。写多场景会频繁复制性能差（B 错）；它不允许 null（C 错）；非 Map（D 错）。", "kaodian": "AI后端能力-语言与计算层-集合List"}, {"no": 6, "type": "single", "body": "ReentrantReadWriteLock 适合？", "code": "ReadWriteLock rw = new ReentrantReadWriteLock();\nrw.readLock().lock();    // 多读可并发\nrw.writeLock().lock();   // 写独占", "options": [{"k": "A", "t": "读锁是独占的"}, {"k": "B", "t": "读多写少：多个读锁可并发，写锁独占，提升并发读吞吐"}, {"k": "C", "t": "读写完全互斥，与 synchronized 一样"}, {"k": "D", "t": "写锁可被多个写线程同时持有"}], "answer": "B", "explain": "读写锁：读锁共享（多线程可同时读）、写锁独占（且写时不可读），适合读远多于写的缓存类场景。C 错（读可并发）；写锁独占（D 错）；读锁共享非独占（A 错）。", "kaodian": "AI后端能力-语言与计算层-读写锁ReentrantReadWriteLock"}, {"no": 7, "type": "single", "body": "MyBatis-Plus 代码生成器（AutoGenerator）的作用是？", "code": "// 配置数据源、包名、策略后运行\n// 自动生成 Entity/Mapper/Service/Controller 模板代码", "options": [{"k": "A", "t": "只能生成 Entity 不能生成其它层"}, {"k": "B", "t": "代码生成器会覆盖手写业务逻辑"}, {"k": "C", "t": "根据数据库表结构自动生成 Entity/Mapper/Service/Controller 等样板代码"}, {"k": "D", "t": "根据代码反向生成数据库表"}], "answer": "C", "explain": "MP 代码生成器（AutoGenerator / 新版 FastAutoGenerator）读表结构，按模板生成实体、Mapper、Service、Controller 等重复样板，提升效率。它正向生成（D 错）；可生成多层（A 错）；通常生成新文件、需谨慎避免覆盖（B 是风险非必然）。", "kaodian": "AI后端能力-数据存储与ORM层-MP代码生成器"}, {"no": 8, "type": "single", "body": "Vue3 组合式函数（Composables，如 useXxx）的作用是？", "code": "// useCounter.js\nexport function useCounter() {\n  const n = ref(0);\n  const inc = () => n.value++;\n  return { n, inc };\n}\n// 组件内复用", "options": [{"k": "A", "t": "组合式函数只能用在 App 根组件"}, {"k": "B", "t": "组合式函数不能返回响应式数据"}, {"k": "C", "t": "组合式函数等价于 CSS 类名"}, {"k": "D", "t": "把『状态+逻辑』封装成可复用的组合式函数，跨组件共享与组合"}], "answer": "D", "explain": "Composables（约定 use 前缀）把相关状态与逻辑抽成函数，在 setup 中调用即可复用（如 useCounter、useFetch），是 Vue3 逻辑复用的推荐方式。A/B/C 均错。", "kaodian": "AI前端能力-语言与运行时-Vue3 hooks"}, {"no": 9, "type": "single", "body": "CSS Grid 用 grid-template-areas 布局，下列正确的是？", "code": ".layout {\n  display: grid;\n  grid-template-areas: \"header header\" \"side main\";\n  grid-template-columns: 200px 1fr;\n}", "options": [{"k": "A", "t": "用命名区域字符串直观划分布局，子项用 grid-area 指定落位"}, {"k": "B", "t": "grid-template-areas 必须配合 flex 使用"}, {"k": "C", "t": "区域名不能重复"}, {"k": "D", "t": "grid-template-areas 只能定义一行"}], "answer": "A", "explain": "grid-template-areas 用字符串画出布局草图（同名区域跨格），子项用 grid-area: header 落位，直观易维护。它独立于 flex（B 错）；区域名可重复表示跨多格（C 错）；可定义多行（D 错）。", "kaodian": "AI前端能力-前端基础与渲染引擎-Grid布局进阶"}, {"no": 10, "type": "single", "body": "HTTP 协商缓存中 ETag 与 Last-Modified 的关系是？", "code": "// 首次\nETag: \"abc\"; Last-Modified: Wed, 01 Jan 2025\n// 再次请求带\nIf-None-Match: \"abc\"; If-Modified-Since: ...", "options": [{"k": "A", "t": "协商缓存完全不需要客户端发请求"}, {"k": "B", "t": "ETag 是内容指纹（更精确），Last-Modified 是时间；服务端比对未变则返回 304"}, {"k": "C", "t": "协商缓存命中时服务端返回 200 与全新内容"}, {"k": "D", "t": "ETag 可被客户端随意伪造决定缓存"}], "answer": "B", "explain": "协商缓存：客户端带 If-None-Match(ETag)/If-Modified-Since 询问，服务端比对未变返回 304（不传体），变了才 200+新内容。ETag 指纹比时间更准（秒级精度/内容变化）。C/D/A 错。", "kaodian": "AI前端能力-网络与BFF架构-HTTP协商缓存"}, {"no": 11, "type": "single", "body": "TypeScript 条件类型 T extends U ? X : Y 用于？", "code": "type Awaited<T> = T extends Promise<infer V> ? V : T;\ntype R = Awaited<Promise<string>>;  // string", "options": [{"k": "A", "t": "infer 用于声明变量而非提取类型"}, {"k": "B", "t": "条件类型不能嵌套"}, {"k": "C", "t": "根据类型是否满足约束，在类型层面做分支选择（常配合 infer 提取）"}, {"k": "D", "t": "条件类型只能在运行时判断"}], "answer": "C", "explain": "条件类型 `T extends U ? X : Y` 在类型系统做分支：满足 U 取 X 否则 Y，常配合 infer 提取内部类型（如 Awaited 提取 Promise 的值类型）。它是编译期类型运算，非运行时（D 错）；infer 正是提取（A 错）；可嵌套（B 错）。", "kaodian": "AI前端能力-语言与运行时-TS条件类型"}, {"no": 12, "type": "single", "body": "async/await 的本质是？", "code": "async function f() {\n  const r = await fetch('/api');   // 等 Promise\n  return r.json();\n}", "options": [{"k": "A", "t": "await 会让整个线程阻塞"}, {"k": "B", "t": "async 函数永远返回普通值而非 Promise"}, {"k": "C", "t": "async/await 与 Promise 无关"}, {"k": "D", "t": "await 暂停 async 函数执行直到 Promise settle，语法上像同步写异步，底层仍是 Promise"}], "answer": "D", "explain": "async/await 是 Promise 的语法糖：await 暂停当前 async 函数（让出事件循环）直到 Promise 完成，再以同步风格拿结果，不阻塞线程。async 函数返回 Promise（B 错）；底层就是 Promise（C 错）。", "kaodian": "AI前端能力-语言与运行时-async与await"}, {"no": 13, "type": "single", "body": "内容安全策略（CSP）的主要作用是？", "code": "// 响应头\nContent-Security-Policy: default-src 'self'; script-src 'self'", "options": [{"k": "A", "t": "通过白名单限制可加载的脚本/资源来源，缓解 XSS 与数据注入"}, {"k": "B", "t": "CSP 用于压缩 HTTP 响应"}, {"k": "C", "t": "CSP 能加密用户密码"}, {"k": "D", "t": "CSP 替代所有输入校验"}], "answer": "A", "explain": "CSP 用响应头指明资源（脚本/样式/图片等）的可信来源白名单，阻止从非法源加载恶意脚本，是 XSS 的深度防御手段。它不压缩（B）、不加密密码（C）、不替代输入校验（D，纵深防御仍需校验）。", "kaodian": "AI前端能力-前端生态-内容安全策略CSP"}, {"no": 14, "type": "single", "body": "下列浏览器存储方案对比，正确的是？", "code": "localStorage  // 持久、同域共享、~5MB、字符串\nsessionStorage // 仅当前标签页\ncookie         // 随请求头走、可设 HttpOnly\nindexedDB     // 结构化大容量异步", "options": [{"k": "A", "t": "IndexedDB 只能存字符串"}, {"k": "B", "t": "Cookie 随每次请求携带且可 HttpOnly 防 XSS 读；localStorage 持久同域；IndexedDB 存大量结构化数据"}, {"k": "C", "t": "Cookie 无法设置过期时间"}, {"k": "D", "t": "localStorage 随会话结束清除"}], "answer": "B", "explain": "Cookie 自动随请求头发送、可设 HttpOnly 防脚本读取、可过期；localStorage 持久（非会话级，D 错）；sessionStorage 才随标签页关闭清除；IndexedDB 存结构化数据且异步（A 错）；Cookie 可设过期（C 错）。", "kaodian": "AI前端能力-前端生态-存储方案对比"}, {"no": 15, "type": "single", "body": "应用安全测试的实践包括？", "code": "// SAST：静态代码扫描（如 SonarQube）\n// DAST：运行态黑盒扫描（如 AWVS）\n// 渗透：模拟攻击找漏洞", "options": [{"k": "A", "t": "安全测试只靠人工代码评审"}, {"k": "B", "t": "功能测试通过即代表安全无问题"}, {"k": "C", "t": "SAST 静态扫描 + DAST 动态扫描 + 渗透测试，多层次发现安全缺陷"}, {"k": "D", "t": "安全测试只在需求阶段做一次"}], "answer": "C", "explain": "安全测试分层：SAST（静态代码分析，左移）、DAST（运行态黑盒扫描）、渗透测试（模拟攻击）。需贯穿全生命周期（D 错）、结合工具与人工（A 错）、功能≠安全（B 错，业务逻辑漏洞功能测试发现不了）。", "kaodian": "AI质量保障-软件测试理论与质量体系-安全测试实践"}, {"no": 16, "type": "single", "body": "场景法/状态迁移法适用于？", "code": "// 如订单：待支付->已支付->已发货->完成/退款\n// 每条迁移边都是一条用例", "options": [{"k": "A", "t": "只适用于纯计算函数"}, {"k": "B", "t": "状态迁移法不考虑非法迁移"}, {"k": "C", "t": "场景法只能覆盖主成功路径"}, {"k": "D", "t": "对有明确状态流转的业务（订单/审批），按状态及迁移边设计用例覆盖合法与非法跳转"}], "answer": "D", "explain": "场景/状态迁移法针对状态机类业务（订单、工单）：把每个状态及合法/非法迁移边都作为用例，覆盖正常流转与异常跳转（含非法迁移，B 错）、成功与失败场景（C 错）。非仅纯计算（A 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-场景法状态迁移"}, {"no": 17, "type": "single", "body": "接口自动化测试框架（如 RestAssured/Postman/requests）的核心能力是？", "code": "// 组织用例、参数化、断言、生成报告、CI 集成\nrequests.post(url, json=p, headers=auth).json()['code'] == 0", "options": [{"k": "A", "t": "用代码/脚本发 HTTP 请求、做断言、参数化与生成报告，适合回归与契约校验"}, {"k": "B", "t": "接口自动化只能手工点 Postman 不能脚本化"}, {"k": "C", "t": "接口框架无法做断言"}, {"k": "D", "t": "接口自动化不需要 CI 集成"}], "answer": "A", "explain": "接口自动化框架以编程方式发请求、断言、参数化、出报告，并能接入 CI 做回归。B/C/D 都错：可脚本化、能断言、需 CI 集成。", "kaodian": "AI质量保障-接口测试-接口自动化框架"}, {"no": 18, "type": "single", "body": "测试数据脱敏（如手机号、身份证）的目的是？", "code": "// 生产数据导入测试库前脱敏\nphone = mask('13800001111')   // -> 138****1111\nidcard = mask('11010119900101XXXX')", "options": [{"k": "A", "t": "脱敏只针对密码字段"}, {"k": "B", "t": "在使用真实数据测试的同时保护用户隐私、满足合规（如个保法）"}, {"k": "C", "t": "脱敏是为了让数据更难读、增加测试难度"}, {"k": "D", "t": "测试环境用真实明文数据最准确，无需脱敏"}], "answer": "B", "explain": "测试数据脱敏：把生产数据导入测试环境前对手机号/身份证/银行卡等做掩码或替换，既保留数据分布又保护隐私、满足合规。明文进测试库（D）有泄露风险且违规；脱敏是多字段非仅密码（A 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试数据脱敏"}, {"no": 19, "type": "single", "body": "AI 辅助缺陷定位，正确的工作流是？", "code": "root = ai.locate(stack=trace, logs=logs, code=snippet)\n// 给出可疑文件/行/原因假设", "options": [{"k": "A", "t": "AI 只能看日志不能看代码"}, {"k": "B", "t": "AI 定位比工程师更权威，不可质疑"}, {"k": "C", "t": "把堆栈/日志/代码喂给 AI，由其缩小可疑范围并给出假设，工程师验证确认"}, {"k": "D", "t": "AI 给出的定位结论直接用于修复生产，无需确认"}], "answer": "C", "explain": "AI 辅助缺陷定位：融合堆栈+日志+代码，输出可疑点/原因假设，帮助工程师快速收敛范围；但最终确认与修复仍需人把关（D 错，直接改生产危险）。AI 可同时看日志与代码（A 错），结论应被质疑验证（B 错）。", "kaodian": "AI质量保障-AI辅助测试-AI辅助缺陷定位"}, {"no": 20, "type": "single", "body": "可测试性设计（Design for Testability）的做法包括？", "code": "// 用依赖注入替换硬依赖\n// 时间/随机用可注入的 Clock/Random 供测试固定\nclass Svc { Svc(Clock c){...} }", "options": [{"k": "A", "t": "所有逻辑写死在方法内最难测也最高效"}, {"k": "B", "t": "可测试性与架构无关"}, {"k": "C", "t": "只有 E2E 测试需要考虑可测试性"}, {"k": "D", "t": "通过依赖注入、可注入时钟/随机源、清晰边界，让代码易于被单元测试覆盖"}], "answer": "D", "explain": "可测试性设计：依赖注入解耦、把时间/随机/外部IO抽象为可注入（测试时固定值）、清晰模块边界，使单测可控可重复。写死硬依赖（A）、忽视架构（B）、只 E2E 考虑（C）都会让测试困难。", "kaodian": "AI质量保障-自动化测试-可测试性设计"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "Spring @Cacheable / @CacheEvict 的要点有？", "code": "@Cacheable(value=\"user\", key=\"#id\", unless=\"#result==null\")\npublic User get(Integer id) {...}\n@CacheEvict(value=\"user\", key=\"#id\", beforeInvocation=false)", "options": [{"k": "A", "t": "key 用 SpEL 按参数生成缓存键，unless 可排除不缓存的结果"}, {"k": "B", "t": "beforeInvocation=false 表示在方法执行后（成功）才清除缓存"}, {"k": "C", "t": "缓存注解需开启 @EnableCaching 且方法须经 Spring 代理调用"}, {"k": "D", "t": "缓存会跨 JVM 自动共享，无需额外配置"}], "answer": ["A", "B", "C"], "explain": "Spring Cache：key 用 SpEL（A）、unless 排除（如 null 不缓存）；@CacheEvict beforeInvocation=false 默认方法成功后才删（B）；需 @EnableCaching 且走代理（C）。D 错：默认基于 ConcurrentHashMap 本地缓存，跨 JVM 共享需接 Redis 等。", "kaodian": "AI后端能力-应用框架层-Spring缓存注解"}, {"no": 2, "type": "multi", "body": "Redis 分布式锁的正确实现要点有？", "code": "SET lock:key uuid NX EX 30   // 原子加锁带唯一值\n// 解锁用 Lua 保证『值匹配才删』\nif redis.call('get',KEYS[1])==ARGV[1] then return redis.call('del',KEYS[1]) end", "options": [{"k": "A", "t": "解锁必须用 Lua 脚本保证『值匹配才删除』，防止误删他人锁"}, {"k": "B", "t": "锁需设置过期时间避免持有者宕机死锁"}, {"k": "C", "t": "用 DEL key 直接删锁最安全"}, {"k": "D", "t": "加锁用 SET key value NX EX 原子命令，value 用唯一标识（如 UUID）标识持有者"}], "answer": ["A", "B", "D"], "explain": "分布式锁要点：① SET NX EX 原子加锁 + 唯一 value（D）；② 过期时间防死锁（B）；③ Lua 脚本校验 value 匹配才删，防误删别人锁（A）。C 错：直接 DEL 可能删掉他人刚获得的锁。", "kaodian": "AI后端能力-高并发与中间件层-分布式锁实现"}, {"no": 3, "type": "multi", "body": "数据库表设计良好实践包括？", "code": "// 合适的主键与索引\n// 字段类型最小化（如用 TINYINT 存状态）\n// 必要约束（NOT NULL/外键/唯一）", "options": [{"k": "A", "t": "用约束（NOT NULL/唯一/外键）保证数据一致性"}, {"k": "B", "t": "一律用 VARCHAR(255) 存所有字段最省事"}, {"k": "C", "t": "选合适主键（自增/雪花）并建立必要索引加速查询"}, {"k": "D", "t": "字段类型按需最小化（状态用 TINYINT 而非 BIGINT）节省空间"}], "answer": ["A", "C", "D"], "explain": "表设计：合理主键+索引（C）、类型最小化（D 省空间与比较开销）、约束保一致性（A）。B 错：盲目 VARCHAR(255) 浪费、丢失语义、索引效率低。", "kaodian": "AI后端能力-数据存储与ORM层-数据库表设计"}, {"no": 4, "type": "multi", "body": "Vue3 组合式函数（Composables）的优势有？", "code": "// useFetch / useMouse / useCounter 等\n// 逻辑与组件解耦，跨组件复用", "options": [{"k": "A", "t": "组合式函数只能包含一个 ref"}, {"k": "B", "t": "把状态+逻辑抽离，跨组件复用，避免 mixins 的命名冲突与来源不清"}, {"k": "C", "t": "组合式函数可组合嵌套，构建复杂逻辑"}, {"k": "D", "t": "相比 Options API，逻辑按功能聚合更易维护"}], "answer": ["B", "C", "D"], "explain": "Composables 把相关状态与逻辑聚合成函数，跨组件复用、可互相组合（B、C），逻辑按关注点聚合比 Options API 分散在各选项更易维护（D）。A 错：可含多个 ref/computed。", "kaodian": "AI前端能力-语言与运行时-组合式函数复用"}, {"no": 5, "type": "multi", "body": "首屏性能优化手段包括？", "code": "// 关键 CSS 内联、懒加载非首屏资源\n// 骨架屏、预连接、图片懒加载/压缩", "options": [{"k": "A", "t": "内联关键 CSS、异步加载其余，减少渲染阻塞"}, {"k": "B", "t": "图片懒加载与压缩、用现代格式（webp/avif）"}, {"k": "C", "t": "骨架屏提升感知性能，预连接（preconnect）加速关键域名"}, {"k": "D", "t": "首屏应加载全部资源保证完整"}], "answer": ["A", "B", "C"], "explain": "首屏优化：关键 CSS 内联、非关键异步（A）、图片懒加载/压缩/webp（B）、骨架屏+preconnect（C）。D 反了：应减少首屏资源而非全加载。", "kaodian": "AI前端能力-前端基础与渲染引擎-首屏优化"}, {"no": 6, "type": "multi", "body": "质量内建（Quality Built-in）在团队中的落地包括？", "code": "// 需求评审把关\n// TDD/单测同步写\n// CI 质量门禁\n// 结对/代码评 烟是版本提测后先跑的最小核心路径用例，用于快速判断版本是否可测，不能替代回归。", "kaodian": "AI质量保障-软件测试理论与质量体系-冒烟测试"}, {"no": 5, "type": "judge", "body": "回归测试（Regression）验证修改未引入新缺陷，重测（Retest）验证特定缺陷确已被修复，二者目的不同。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "回归测试检查改动是否波及旧功能；重测（确认测试）专验某条已修缺陷是否真的修复。前者广、后者窄，目的不同，不能混淆。描述正确。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归与重测"}, {"no": 6, "type": "judge", "body": "持续测试(Continuous Testing)是上线后的人工补测，与 CI/CD 流水线无关。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "持续测试是把自动化测试嵌入 CI/CD 流水线，每次提交自动执行。", "kaodian": "AI质量保障-CI/CD与质量门禁-持续测试"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
