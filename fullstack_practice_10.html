<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2329; margin: 0; padding: 24px 24px 96px; line-height: 1.65; }
  .container { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: #646a73; font-size: 14px; margin-bottom: 4px; }
  .meta { background: #fff; border-radius: 10px; padding: 14px 18px; margin: 16px 0 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); font-size: 14px; color: #41464b; }
  .meta b { color: #1664ff; }
  .backlink { display:inline-block; margin: 4px 0 10px; color:#1664ff; text-decoration:none; font-size:14px; }
  .backlink:hover { text-decoration: underline; }
  .section { margin-top: 28px; }
  .section h2 { font-size: 18px; margin: 0 0 12px; padding-left: 10px; border-left: 4px solid #1664ff; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card.correct { box-shadow: 0 0 0 2px #52c41a inset, 0 1px 3px rgba(0,0,0,.06); }
  .card.wrong { box-shadow: 0 0 0 2px #ff4d4f inset, 0 1px 3px rgba(0,0,0,.06); }
  .q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .q-no { font-weight: 700; font-size: 15px; }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: 4px; font-weight: 600; }
  .tag-single { background: #e8f3ff; color: #1664ff; }
  .tag-multi  { background: #fff3e0; color: #d4860b; }
  .tag-judge  { background: #fde8f3; color: #c41d7f; }
  .tag-fill   { background: #e9f9ee; color: #1a9e4b; }
  .kaodian { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; background: #f0f2f5; color: #646a73; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-badge { font-size:12px; padding:2px 9px; border-radius:4px; font-weight:700; margin-left:auto; }
  .res-badge.ok { background:#e9f9ee; color:#1a9e4b; }
  .res-badge.no { background:#fff1f0; color:#ff4d4f; }
  .q-body { font-size: 15px; margin-bottom: 10px; }
  .code { background: #2b2f36; color: #e6e6e6; border-radius: 8px; padding: 12px 14px;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; overflow-x: auto; margin: 10px 0; white-space: pre; }
  .options { margin: 8px 0 4px; }
  .opt { display: flex; align-items:flex-start; gap:8px; padding: 9px 12px; border-radius: 8px; margin: 6px 0;
    background: #f7f8fa; border: 1.5px solid transparent; font-size: 14px; cursor: pointer; transition: all .12s; }
  .opt:hover { background: #eef2f7; }
  .opt .k { font-weight:700; color:#1664ff; min-width: 16px; }
  .opt.sel { background: #e8f3ff; border-color: #1664ff; }
  .opt.correct { background: #f0f9eb; border-color: #52c41a; }
  .opt.correct .k { color:#52c41a; }
  .opt.wrong { background: #fff1f0; border-color: #ff4d4f; }
  .opt.wrong .k { color:#ff4d4f; }
  .opt.locked { cursor: default; }
  .q-actions { margin-top: 10px; }
  .q-check { background:#1664ff; color:#fff; border:none; border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; font-weight:600; }
  .q-check:hover { background:#0e4fd8; }

  .blank { border:none; border-bottom: 1.5px solid #1664ff; background:#f7f8fa; padding: 3px 8px; margin: 0 4px;
    font-size:14px; min-width: 120px; border-radius:4px 4px 0 0; }
  .blank.correct { border-bottom-color:#52c41a; background:#f0f9eb; }
  .blank.wrong { border-bottom-color:#ff4d4f; background:#fff1f0; }
  .answer { display: none; margin-top: 14px; padding: 14px; background: #f0f9eb;
    border-left: 4px solid #67c23a; border-radius: 6px; font-size: 14px; }
  .answer.show { display: block; }
  .answer .ans { font-weight: 700; color: #1a9e4b; margin-bottom: 8px; font-size: 15px; }
  .answer .label { font-weight: 700; }
  .answer .android { margin-top: 10px; padding: 10px 12px; background: #eef4ff; border-radius: 6px; color: #2a3a55; font-size: 13px; }
  .answer .android .label { color: #1664ff; }
  .footer { text-align: center; color: #9aa0a6; font-size: 13px; margin: 30px 0 10px; }
  .bar { position: fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #e5e6eb;
    box-shadow: 0 -2px 10px rgba(0,0,0,.05); padding: 10px 16px; display:flex; gap:10px; align-items:center; justify-content:center; z-index: 50; }
  .bar .prog { font-size: 14px; color:#41464b; margin-right: auto; }
  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }
  .bar .userbox a { color:#1664ff; cursor:pointer; text-decoration:none; }
  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }
  .result-panel.show { display:block; }
  .result-panel .score { font-size:30px; font-weight:800; color:#1664ff; }
  .result-panel .score small { font-size:15px; color:#646a73; font-weight:500; }
  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }
  .result-panel .wrongs a { display:inline-block; margin:3px 6px 3px 0; padding:2px 8px; background:#fff1f0; color:#ff4d4f; border-radius:4px; text-decoration:none; font-weight:600; }
  @media (max-width:600px) {
    body { padding: 12px 12px 100px; }
    .container { max-width: 100%; }
    h1 { font-size: 20px; }
    .meta { padding: 10px 12px; font-size: 13px; }
    .card { padding: 14px 12px; margin-bottom: 10px; }
    .q-body { font-size: 14px; }
    .code { font-size: 11px; padding: 10px 10px; }
    .opt { padding: 8px 10px; font-size: 13px; }
    .bar { padding: 8px 10px; gap: 6px; }
    .bar .prog { font-size: 12px; }
    .btn { padding: 7px 12px; font-size: 13px; }
    .section h2 { font-size: 16px; }
    .answer { font-size: 13px; }
    .answer .android { font-size: 12px; }
  }

<script type="application/json" id="quizData">{"id": "vol10", "title": "全栈转型模拟自测卷", "sub": "可答题 · 交卷判分 · 自动记录错题", "meta": "对齐公司真实考法：<b>单选 / 多选 / 判断</b>，每题包含完整代码场景，问执行结果、补全代码、判断框架用法正误。<br>本卷共 <b>33 题</b>：单选 20（60 分）+ 多选 7（28 分）+ 判断 6（12 分）= 100 分。<br>难度：<b>实战细节型</b>，考点标签采用公司标准层级命名。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "以下 Java 代码运行时会怎样？", "code": "Map<Integer, String> m = List.of(\"a\", \"b\", \"cc\").stream()\n    .collect(Collectors.toMap(String::length, s -> s));\nSystem.out.println(m.size());", "options": [{"k": "A", "t": "输出 2"}, {"k": "B", "t": "输出 3"}, {"k": "C", "t": "抛出 IllegalStateException（重复 key）"}, {"k": "D", "t": "编译错误"}], "answer": ["C"], "explain": "Collectors.toMap 默认使用 throwingMerger 合并函数，遇到重复 key 会抛 IllegalStateException: Duplicate key。这里 \"a\" 与 \"b\" 长度都是 1，key 冲突。需要显式提供合并函数 toMap(String::length, s -> s, (v1, v2) -> v2) 才能保留一个值。", "android": "类比 Android：用 Map 按 type 给 RecyclerView 分组时，若写 Map<Integer, Item> 而非 Map<Integer, List<Item>>，同 type 多条会互相覆盖或异常；应像 toMap 的 merge 函数那样显式合并成列表。", "kaodian": "AI 后端能力 - 语言基础层 - Java 集合/基础"}, {"no": 2, "type": "single", "body": "执行以下代码会发生什么？", "code": "List<Integer> list = new ArrayList<>(List.of(1, 2, 3, 4, 5));\nList<Integer> sub = list.subList(1, 3); // 视图 [2, 3]\nlist.add(6);\nSystem.out.println(sub.size());", "options": [{"k": "A", "t": "输出 2"}, {"k": "B", "t": "输出 3"}, {"k": "C", "t": "抛出 ConcurrentModificationException"}, {"k": "D", "t": "输出 1"}], "answer": ["C"], "explain": "subList 返回的是原 list 的视图（内部持有原 list 引用与偏移量），并非独立副本。原 list 发生结构性修改（add）后，视图的 modCount 与预期不一致，再访问 sub 时触发 fail-fast 抛 ConcurrentModificationException。需要独立副本应 new ArrayList<>(list.subList(...))。", "android": "类比 Android：对数据集做 subList 式\"视图\"后，原数据又被增删却没通知，再读子列表就会出错；应取不可变拷贝或重新 DiffUtil 计算。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息可靠性-Kafka"}, {"no": 3, "type": "single", "body": "关于 Java 类加载与初始化，下列说法正确的是？", "code": "Class<?> c1 = Class.forName(\"com.demo.User\");                   // ①\nClass<?> c2 = ClassLoader.getSystemClassLoader()\n                    .loadClass(\"com.demo.User\");              // ②", "options": [{"k": "A", "t": "① 和 ② 都会立即触发类的 <clinit>（静态初始化）"}, {"k": "B", "t": "① 触发初始化，② 仅加载（load）不初始化"}, {"k": "C", "t": "② 触发初始化，① 仅加载不初始化"}, {"k": "D", "t": "两者都不会触发初始化，只有 new 才初始化"}], "answer": ["B"], "explain": "Class.forName(name) 默认 initialize=true，会执行类初始化（<clinit>，即静态变量赋值与静态块）；ClassLoader.loadClass 只走到\"加载\"阶段，不触发当前类初始化（若父类未加载会先加载父类，但仍不初始化当前类）。JDBC 驱动注册正是靠 forName 触发 Driver 静态块完成注册。", "android": "类比 Android：PathClassLoader.loadClass 类似只\"加载\"；某些 SDK 在 Application.attachBaseContext 里主动 forName 某类去跑其 static 块——静态块里做重活会拖慢冷启动。", "kaodian": "AI 后端能力 - 语言基础层 - JVM 内存模型"}, {"no": 4, "type": "single", "body": "用 Semaphore 把并发数限制为 2，以下代码最多同时有多少个线程进入临界区？", "code": "Semaphore sem = new Semaphore(2);\nvoid work() throws InterruptedException {\n    sem.acquire();\n    try { /* 临界区 */ } finally { sem.release(); }\n}", "options": [{"k": "A", "t": "无限（Semaphore 不限流）"}, {"k": "B", "t": "最多 2 个"}, {"k": "C", "t": "最多 1 个"}, {"k": "D", "t": "最多 4 个"}], "answer": ["B"], "explain": "Semaphore(permits=2) 表示有 2 个许可，acquire 取走一个、release 归还一个，同时最多 2 个线程持有许可进入临界区，是典型并发限流/资源池手段。注意必须在 finally 里 release，否则许可泄漏最终耗尽。", "android": "类比 Android：OkHttp 的 maxRequestsPerHost 就是 Semaphore 限流；Glide 的线程池并发数限制同理——控制同时下载数防 OOM 与抢带宽。", "kaodian": "AI 后端能力 - 数据库与ORM层 - SQL 优化-EXPLAIN"}, {"no": 5, "type": "single", "body": "以下代码若任务 5 秒才返回，第 3 秒会发生什么？", "code": "Future<String> f = executor.submit(() -> {\n    Thread.sleep(5000);\n    return \"ok\";\n});\nString r = f.get(3, TimeUnit.SECONDS);", "options": [{"k": "A", "t": "返回 \"ok\""}, {"k": "B", "t": "第 3 秒抛 TimeoutException，任务继续在后台跑"}, {"k": "C", "t": "第 3 秒抛 TimeoutException 且任务被取消"}, {"k": "D", "t": "永久阻塞"}], "answer": ["B"], "explain": "get(timeout) 超时抛 TimeoutException，但不会取消任务（除非显式 f.cancel）。提交到线程池的任务仍会跑完，只是调用方不再等待。若要\"超时即中断\"，需配合 f.cancel(true) 向线程发中断，且任务代码要响应 InterruptedException。", "android": "类比 Android：Retrofit 的 call.timeout()/协程 withTimeout 类似——超时抛异常但底层请求可能仍在飞；真正取消得 call.cancel() 或协程 cancel 且任务可 cooperative 中断。", "kaodian": "AI 后端能力 - 框架与容器层 - 异步与线程池"}, {"no": 6, "type": "single", "body": "以下链式调用，当 supplyAsync 抛异常时，最终 result 是？", "code": "String result = CompletableFuture.supplyAsync(() -> {\n        throw new RuntimeException(\"boom\");\n    })\n    .handle((v, ex) -> ex != null ? \"fallback\" : v)\n    .join();", "options": [{"k": "A", "t": "\"boom\""}, {"k": "B", "t": "\"fallback\""}, {"k": "C", "t": "直接抛 RuntimeException"}, {"k": "D", "t": "null"}], "answer": ["B"], "explain": "handle(BiFunction) 无论正常还是异常都会执行，可恢复异常并返回兜底值；这里 ex != null 返回 \"fallback\"，所以 result = \"fallback\"，异常被\"吞掉并恢复\"。exceptionally 也能恢复但拿不到正常值，handle 两者皆可得。", "android": "类比 Android：协程的 catch + 返回默认值（网络失败返回缓存）与 handle 恢复语义一致；不要裸 try-catch 把异常吞成 null 导致 UI 拿到空。", "kaodian": "AI 前端能力 - 工程化与网络 - 前端路由模式"}, {"no": 7, "type": "single", "body": "一个请求先后经过：Servlet Filter、Spring Interceptor、@ControllerAdvice、@Aspect(环绕)。关于执行顺序，正确的是？", "code": null, "options": [{"k": "A", "t": "Filter → Interceptor → Aspect → Controller → ControllerAdvice"}, {"k": "B", "t": "ControllerAdvice → Filter → Interceptor → Aspect → Controller"}, {"k": "C", "t": "Aspect → Interceptor → Filter → Controller → ControllerAdvice"}, {"k": "D", "t": "Interceptor → Filter → Aspect → Controller → ControllerAdvice"}], "answer": ["A"], "explain": "由外到内：Servlet Filter（最外层，Servlet 规范）→ HandlerInterceptor（Spring MVC，DispatcherServlet 内）→ @Aspect 环绕（AOP 代理层，最贴近方法）→ Controller 方法。@ControllerAdvice 的 @ExceptionHandler 在 Controller 抛异常后、返回前拦截，处于\"出\"的一侧。整体是洋葱/同心圆模型。", "android": "类比 Android：OkHttp Interceptor 链（application → network 拦截器）正是洋葱模型；View 事件分发（Activity→Window→ViewGroup→View）也是由外到内再冒泡回来。", "kaodian": "AI 后端能力 - 框架与容器层 - AOP 环绕通知"}, {"no": 8, "type": "single", "body": "以下 Spring 接口，UserDTO 含 @NotBlank 字段，参数上的 @Valid 校验会生效吗？", "code": "@RestController\npublic class U {\n    @PostMapping(\"/u\")\n    public void create(@Valid @RequestBody UserDTO u) { ... }\n}", "options": [{"k": "A", "t": "一定生效，@Valid 写到哪都行"}, {"k": "B", "t": "生效，@RequestBody + @Valid 由 RequestResponseBodyMethodProcessor 触发校验"}, {"k": "C", "t": "不生效，必须改用 @Validated"}, {"k": "D", "t": "不生效，需手动在方法里调 Validator"}], "answer": ["B"], "explain": "@RequestBody 参数上的 @Valid（或 @Validated）由 RequestResponseBodyMethodProcessor 在反序列化后触发 Hibernate Validator 校验，约束违反抛 MethodArgumentNotValidException，被 @ControllerAdvice 捕获返回 400。注意：普通 @RequestParam 上的 JSR-303 校验需要在类上用 @Validated 开启 MethodValidationPostProcessor，并不是\"@Valid 写到哪都行\"。", "android": "类比 Android：类似用注解做入参校验，但 Android 没有运行时自动校验框架，得手动或用 kotlinx.serialization 约束——别指望注解自动拦非法入参。", "kaodian": "AI 后端能力 - 框架与容器层 - 参数校验"}, {"no": 9, "type": "single", "body": "关于 FactoryBean 与 BeanFactory，正确的是？", "code": null, "options": [{"k": "A", "t": "两者是同一个接口的不同名字"}, {"k": "B", "t": "BeanFactory 是 IoC 容器顶层接口；FactoryBean 是\"生产 Bean 的工厂 Bean\"，getObject() 返回真正对象"}, {"k": "C", "t": "从容器取 FactoryBean 本身需加 & 前缀，否则拿到的是它生产的对象"}, {"k": "D", "t": "B 和 C 都对"}], "answer": ["D"], "explain": "BeanFactory 是 Spring 容器根接口（getBean 等）；FactoryBean 是一种特殊 Bean，其 getObject() 返回被装配的真实对象。getBean(\"myFactoryBean\") 拿到的是产品对象，getBean(\"&myFactoryBean\") 才拿到 FactoryBean 本身。MyBatis 的 SqlSessionFactoryBean、Spring 的 ProxyFactoryBean 都用了它。", "android": "类比 Android：FactoryBean 像一个\"对象提供器\"（如 Hilt 的 @Provides 方法返回实例），BeanFactory 像全局的 ObjectGraph/ServiceLocator。", "kaodian": "AI 后端能力 - 框架与容器层 - Bean 工厂"}, {"no": 10, "type": "single", "body": "以下查询若数据库中存在 2 条 name='tom' 的记录，selectOne 会？", "code": "User u = userMapper.selectOne(\n    new QueryWrapper<User>().eq(\"name\", \"tom\"));", "options": [{"k": "A", "t": "返回第一条"}, {"k": "B", "t": "返回最后一条"}, {"k": "C", "t": "抛 TooManyResultsException"}, {"k": "D", "t": "返回 null"}], "answer": ["C"], "explain": "MyBatis-Plus 的 selectOne 预期唯一结果，若匹配到多行会抛 TooManyResultsException（BaseMapper 默认实现校验 size>1）。应改用 selectList 再取第一条，或在 SQL/唯一索引层面保证唯一。", "android": "类比 Android：Room 的 @Query(\"SELECT * FROM user WHERE name=:n\") User findOne() 若返回多条会抛 IllegalStateException；同理应返回 List 再取首条或保证 UNIQUE 约束。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis-Plus Wrapper"}, {"no": 11, "type": "single", "body": "以下分页查询在并发写入、且多行 score 相同的情况下，可能出现的问题是？", "code": "SELECT id, score FROM t ORDER BY score DESC LIMIT 10 OFFSET 0;   -- 第1页\nSELECT id, score FROM t ORDER BY score DESC LIMIT 10 OFFSET 10;  -- 第2页", "options": [{"k": "A", "t": "永远不重复，LIMIT/OFFSET 绝对安全"}, {"k": "B", "t": "当多行 score 相同时，翻页可能\"丢失或重复\"某些行"}, {"k": "C", "t": "OFFSET 越大查询越快"}, {"k": "D", "t": "ORDER BY 必须建索引否则报错"}], "answer": ["B"], "explain": "若多行 score 相同，数据库对同值行的返回顺序不保证稳定；翻页时若其间有写入或执行计划变化，同一行可能既出现在第1页又出现在第2页（重复），或丢失。解决：ORDER BY 后追加唯一列保证稳定排序（ORDER BY score DESC, id DESC），或用游标分页（WHERE score<? AND id<?）。", "android": "类比 Android：Paging3 按 score 排序翻页遇同分会重复/漏 item，故 key 必须稳定（加 id，或 RemoteMediator 用游标），否则 DiffUtil 闪烁。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis-Plus 分页"}, {"no": 12, "type": "single", "body": "对已有过期时间的 key 执行普通覆盖写 SET，会发生什么？", "code": "redis.set(\"k\", \"v1\", 60, TimeUnit.SECONDS); // 60s 过期\nredis.set(\"k\", \"v2\");                        // 普通覆盖写\nLong ttl = redis.getExpire(\"k\");", "options": [{"k": "A", "t": "ttl 仍为 60"}, {"k": "B", "t": "ttl 被清除（变为 -1，永不过期）"}, {"k": "C", "t": "ttl 重置为默认 60"}, {"k": "D", "t": "抛异常"}], "answer": ["B"], "explain": "Redis 的 SET 命令（覆盖写）会清除该 key 原有的 TTL，使其变为永久（-1）。要保留过期时间需使用 SET 的 KEEPTTL 选项（Redis 6.0+）或改用 SETEX。缓存覆盖更新时极易踩这个坑，导致\"本该过期的热 key 永驻内存\"引发内存上涨。", "android": "类比 Android：SharedPreferences.edit().putX().commit() 覆盖写不会动别的 key；但 LruCache 的 put 会刷新回收计数——\"覆盖写语义\"各缓存不同，别想当然。", "kaodian": "AI 质量保障 - 自动化测试与工具 - Mock 高级用法"}, {"no": 13, "type": "single", "body": "以下代码，点击内部按钮 child 时，三个监听器的执行顺序是？（addEventListener 第三参数为 useCapture）", "code": "parent.addEventListener('click', () => log('P'), true);   // 捕获\nchild.addEventListener('click',  () => log('C'), false);  // 冒泡\nparent.addEventListener('click', () => log('P2'), false); // 冒泡", "options": [{"k": "A", "t": "C → P → P2"}, {"k": "B", "t": "P → C → P2"}, {"k": "C", "t": "P2 → C → P → P2"}, {"k": "D", "t": "C → P2 → P"}], "answer": ["B"], "explain": "DOM 事件流分三阶段：捕获阶段（document→目标，useCapture=true 的监听器先跑）→ 目标阶段（target 上的监听器按注册顺序）→ 冒泡阶段（目标→document，useCapture=false 的监听器跑）。这里 parent 捕获(true) 先跑=P，目标 child 冒泡(false)=C，再 parent 冒泡(false)=P2。顺序 P → C → P2。", "android": "类比 Android：View 事件分发 dispatchTouchEvent（捕获，由外到内，onInterceptTouchEvent 可拦截）→ onTouchEvent（冒泡，由内到外）；捕获/冒泡两阶段与 DOM 完全一致。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - DOM 事件流"}, {"no": 14, "type": "single", "body": "在 Vue3 中，同一元素上同时使用 v-if 和 v-for，下列说法正确的是？", "code": null, "options": [{"k": "A", "t": "v-for 优先级高于 v-if，先循环再对每个 item 判断"}, {"k": "B", "t": "v-if 优先级高于 v-for，v-if 访问不到 v-for 的变量"}, {"k": "C", "t": "两者优先级相同，按书写顺序"}, {"k": "D", "t": "Vue3 会自动把它们合并优化"}], "answer": ["B"], "explain": "Vue3 中 v-if 的优先级高于 v-for（Vue2 相反）。因此同一元素上 v-if 无法访问 v-for 的 item 变量，且每次渲染都先判 v-if 再决定是否循环，语义与性能都错。正确做法：把 v-if 提到外层 <template v-for> 或用 computed 先过滤列表。", "android": "类比 Android：RecyclerView 的\"过滤\"应在 submitList 前用 List.filter 完成（computed 思维），别在 onBindViewHolder 里 if-return 假装过滤——既低效又打乱 position。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 v-if 与 v-for"}, {"no": 15, "type": "single", "body": "父 div 内只有浮动子元素，父 div 高度塌陷为 0。以下哪种方式不能撑开父元素高度？", "code": ".parent { }              /* 仅含 float 子元素 */\n.child  { float: left; }", "options": [{"k": "A", "t": "父设 overflow: hidden"}, {"k": "B", "t": "父设 display: flow-root"}, {"k": "C", "t": "父设 float: left"}, {"k": "D", "t": "给父加 position: relative"}], "answer": ["D"], "explain": "浮动元素脱离文档流导致父高度塌陷。触发 BFC（块级格式化上下文）可让父包含浮动：overflow:hidden、display:flow-root、float 自身、display:inline-block、position:absolute 都会触发 BFC。position:relative 不触发 BFC，无法撑高。", "android": "类比 Android：LinearLayout 里子 View 设 gone 或 weight 后高度计算异常，类似\"高度塌陷\"；用 ConstraintLayout 的 0dp+约束（等价于 BFC 包裹）才稳。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 定位与层叠"}, {"no": 16, "type": "single", "body": "Vue3 中以下 computed 用法，正确的是？", "code": "const full = computed({\n  get: () => first.value + ' ' + last.value,\n  set: (v) => { const [a, b] = v.split(' '); first.value = a; last.value = b; }\n});\nfull.value = 'Tom Li';", "options": [{"k": "A", "t": "报错，computed 只读不能赋值"}, {"k": "B", "t": "可赋值，set 被调用，first=\"Tom\" last=\"Li\""}, {"k": "C", "t": "赋值无效，full 仍为旧值"}, {"k": "D", "t": "报错，computed 不支持 get/set 对象写法"}], "answer": ["B"], "explain": "computed 支持 get/set 对象写法；读取走 get，赋值走 set。这里 full.value='Tom Li' 触发 set，拆出 first/last。若只写 computed(() => ...) 才是只读，赋值会告警。", "android": "类比 Android：Data Binding 的 @Bindable + setXxx 双向绑定，或 Kotlin 的 var full: String get()/set() —— computed 的 get/set 与自定义属性访问器完全一致。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 响应式"}, {"no": 17, "type": "single", "body": "需要服务端单向、持续向浏览器推送（如日志流、进度条），且希望用原生浏览器 API、断线自动重连，最合适的是？", "code": null, "options": [{"k": "A", "t": "WebSocket（双向全双工）"}, {"k": "B", "t": "SSE（EventSource，单向 + 自动重连）"}, {"k": "C", "t": "短轮询 setInterval fetch"}, {"k": "D", "t": "长轮询"}], "answer": ["B"], "explain": "SSE（Server-Sent Events）基于 HTTP，服务端单向推送，浏览器用 EventSource 接收，断线自动重连、原生支持、走普通 80/443 端口。WebSocket 是双向全双工，适合聊天；短轮询浪费请求。日志/进度这类单向流首选 SSE。", "android": "类比 Android：SSE≈EventSource，类似 Android 的 SSE 库或 okhttp 的 text/event-stream 流读；WebSocket≈Socket 长连；短轮询≈Handler 定时拉接口。", "kaodian": "AI 质量保障 - 缺陷定位与可观测性 - 可观测性三支柱"}, {"no": 18, "type": "single", "body": "用 JS 实现平滑动画（如元素持续位移），以下哪种方式更不易掉帧、性能更好？", "code": "// 方式A：每帧改 left\nfunction animA(){ el.style.left = (el.offsetLeft + 5) + 'px'; requestAnimationFrame(animA); }\n// 方式B：每帧改 transform\nfunction animB(){ el.style.transform = 'translateX(' + (x += 5) + 'px)'; requestAnimationFrame(animB); }", "options": [{"k": "A", "t": "方式A（改 left）更优，因为直接操作布局属性"}, {"k": "B", "t": "方式B（改 transform）更优，transform 可由合成线程处理，避免重排重绘"}, {"k": "C", "t": "两者性能完全一样"}, {"k": "D", "t": "requestAnimationFrame 比 setTimeout 更容易掉帧"}], "answer": ["B"], "explain": "改变 left/top 会触发重排(reflow)+重绘(repaint)，每帧都走主线程布局，量大易掉帧；改变 transform/opacity 可走 GPU 合成线程（不触发重排），且 requestAnimationFrame 对齐屏幕刷新率（约 60fps），比 setTimeout(16) 更稳。故动画优先 transform/opacity + rAF。", "android": "类比 Android：改 View 的 layout 参数(requestLayout)触发 measure/layout 全链路，相当于改 left；改 setTranslationX/alpha 走 RenderThread 合成层，相当于 transform/opacity；都用 Choreographer 对齐 VSYNC 帧信号。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 事件循环"}, {"no": 19, "type": "single", "body": "需要\"允许一定突发流量、平时平滑限流\"，应优先选哪个算法？", "code": null, "options": [{"k": "A", "t": "漏桶（Leaky Bucket，严格恒定输出）"}, {"k": "B", "t": "令牌桶（Token Bucket，桶里有令牌可突发）"}, {"k": "C", "t": "固定窗口计数"}, {"k": "D", "t": "滑动窗口"}], "answer": ["B"], "explain": "令牌桶：令牌按固定速率生成存入桶，桶有容量；请求需取令牌，桶满时积累的令牌允许短时突发。漏桶则强制恒定速率输出、超量直接丢弃，不允突发。固定/滑动窗口是计数类限流，突发控制弱。Guava RateLimiter 即令牌桶实现。", "android": "类比 Android：OkHttp 的令牌桶限流（maxRequestsPerHost）允许短时多连；严格限速上传用\"漏桶\"思路（固定 chunk 速率）防被服务端限流。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 限流算法"}, {"no": 20, "type": "single", "body": "应用频繁 Full GC 且最终抛 java.lang.OutOfMemoryError，jstat/jmap 显示老年代几乎占满、GC 后回收极少，最可能是？", "code": null, "options": [{"k": "A", "t": "栈溢出（StackOverflowError）"}, {"k": "B", "t": "堆内存泄漏（对象无法被 GC 回收）"}, {"k": "C", "t": "元空间不足（Metaspace）"}, {"k": "D", "t": "直接内存（Native Memory）耗尽"}], "answer": ["B"], "explain": "老年代占满、Full GC 几乎回收不掉 → 典型堆内存泄漏（如 static Map 缓存无限增长、未关闭资源持引用）。需 MAT/Heap Dump 分析支配树找 GC Roots 强引用。StackOverflowError 是栈深度异常非 OOM；Metaspace 满报 OOM: Metaspace；DirectMemory 满报 OOM: Direct buffer memory。", "android": "类比 Android：LeakCanary 抓的正是\"堆里本该回收的 Activity/Fragment 因静态/单例/匿名内部类被强引用\"——与服务端堆泄漏同源；用 Memory Profiler 看 retained size。", "kaodian": "AI 后端能力 - 语言基础层 - JVM 内存模型"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "关于 Kafka 消费并行度，下列说法正确的有？（多选）", "code": null, "options": [{"k": "A", "t": "一个消费组的并行度上限 = 主题分区数（分区数决定最多几个消费者同时消费）"}, {"k": "B", "t": "消费者数 > 分区数时，多余的消费者会空闲（分配不到分区）"}, {"k": "C", "t": "增加分区数可以提升消费并行度上限"}, {"k": "D", "t": "提高单消费者 max.poll.records 即可突破分区数限制实现更高并发"}], "answer": ["A", "B", "C"], "explain": "Kafka 的分配单位是分区，一个分区同一时刻只被组内一个消费者消费；所以并行度上限 = 分区数。消费者多于分区 → 冗余者 idle。增加分区可提升上限。max.poll.records 只控制单次拉取条数、单线程内处理，并不增加跨分区的并发。", "android": "类比 Android：ExoPlayer 的多轨/多线程下载分片数类似\"分区数\"上限；线程数超过分片数同样会有线程闲置。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 分区与保序"}, {"no": 22, "type": "multi", "body": "使用 @WebMvcTest 做 Web 层切片测试，下列说法正确的有？（多选）", "code": null, "options": [{"k": "A", "t": "只加载 Web 层相关 Bean（Controller、Filter、WebMvc 配置），不加载完整 ApplicationContext"}, {"k": "B", "t": "可用 @MockBean 把 Controller 依赖的 Service 替换成 Mock，避免连数据库"}, {"k": "C", "t": "会自动加载并初始化 DataSource / JPA Repository"}, {"k": "D", "t": "配合 MockMvc 可断言 HTTP 状态码、JSON 字段，无需真正启动容器"}], "answer": ["A", "B", "D"], "explain": "@WebMvcTest 是切片测试，只装配 Web 层（@Controller、@ControllerAdvice、WebMvcConfigurer 等），不加载 Service/Repository/DataSource（更轻快）。@MockBean 注入 Mock 替掉依赖。MockMvc 在\"不启动 Servlet 容器\"下模拟请求并断言。它会跳过 JPA/DataSource 自动配置（C 错）。", "android": "类比 Android：@WebMvcTest≈只测 ViewModel+UI 不启动整 App；@MockBean≈用 fake/mock 替掉 Repository；Espresso 才是真正起来 Activity 的集成测试。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 作用域与闭包"}, {"no": 23, "type": "multi", "body": "关于 MySQL EXPLAIN 的 Extra 列，下列说法正确的有？（多选）", "code": null, "options": [{"k": "A", "t": "Using index 表示覆盖索引，无需回表"}, {"k": "B", "t": "Using where 表示 MySQL 在存储引擎返回后，Server 层再做过滤"}, {"k": "C", "t": "Using filesort 一定意味着性能很差、必须消除"}, {"k": "D", "t": "Using index condition 表示使用了索引下推 ICP，减少回表"}], "answer": ["A", "B", "D"], "explain": "Using index = 覆盖索引（Extra 出现即不回表）；Using where = Server 层对引擎返回的行再过滤（常见于索引未完全覆盖过滤条件）；Using index condition = ICP，把 WHERE 条件下推到存储引擎层用索引判断，减少回表行数。Using filesort 只是内存/磁盘排序，小结果集上完全可接受，并非\"必须消除\"（C 太绝对）。", "android": "类比 Android：EXPLAIN Extra 像 Systrace 的火焰图标注——Using filesort 是\"某个耗时长标记\"但不一定卡；要结合数据量判断，别见 filesort 就panic重构。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 索引与最左前缀"}, {"no": 24, "type": "multi", "body": "跨服务（订单+库存+支付）要保证最终一致，可用的方案有？（多选）", "code": null, "options": [{"k": "A", "t": "本地消息表 + 轮询补偿（本地事务写消息，异步投递，失败重试）"}, {"k": "B", "t": "TCC（Try-Confirm-Cancel，三阶段，业务需实现空回滚/防悬挂）"}, {"k": "C", "t": "基于可靠消息队列（MQ 事务消息 / 最终一致性）"}, {"k": "D", "t": "2PC（XA）两阶段提交，强一致但锁资源久、可用性差"}], "answer": ["A", "B", "C", "D"], "explain": "四种都是常见分布式事务思路：本地消息表与 MQ 最终一致性（异步、最终一致、吞吐高）；TCC（业务侵入大、需实现 Confirm/Cancel 及空回滚防悬挂，强一致但复杂）；2PC/XA（强一致但协调者单点、长事务锁资源、可用性低）。按一致性要求/性能取舍。", "android": "类比 Android：本地消息表≈Room 里先写\"待同步队列表\"+WorkManager 重试；TCC≈先预留(冻结库存)再确认/取消；都是\"本地先落库+异步补偿\"的思路。", "kaodian": "AI 后端能力 - 框架与容器层 - 异步与线程池"}, {"no": 25, "type": "multi", "body": "前端发起带凭证的跨域请求（fetch 设 credentials: 'include'，携带 Cookie），下列说法错误的是？（多选）", "code": null, "options": [{"k": "A", "t": "服务端 Access-Control-Allow-Origin 可以设为 * 来放行"}, {"k": "B", "t": "服务端必须显式返回 Access-Control-Allow-Credentials: true"}, {"k": "C", "t": "服务端 Access-Control-Allow-Origin 必须精确等于请求源（不能是 *）"}, {"k": "D", "t": "简单请求也会触发预检（OPTIONS）"}], "answer": ["A", "D"], "explain": "带凭证（credentials）的跨域：Access-Control-Allow-Origin 必须是具体源、不能是 *，且需 Access-Control-Allow-Credentials: true（A 错、C 对、B 对）。预检 OPTIONS 只在\"非简单请求\"（自定义头/非 GET POST/特殊 Content-Type）时触发；简单请求（普通 GET 无自定头）不发预检（D 错）。", "android": "类比 Android：OkHttp 跨域/Cookie 同理——带 Cookie 的跨域需服务端精确源+Credentials；WebView 的 setAcceptThirdPartyCookies 也是\"精确控制跨站 Cookie\"。", "kaodian": "AI 前端能力 - 工程化与网络 - CORS 跨域"}, {"no": 26, "type": "multi", "body": "关于隐藏元素的三种方式，下列说法正确的有？（多选）", "code": null, "options": [{"k": "A", "t": "display:none 元素不占布局空间、不响应事件、transition 无效"}, {"k": "B", "t": "visibility:hidden 仍占布局空间，但不可点击/不可见"}, {"k": "C", "t": "opacity:0 元素仍占空间、可点击、可用 transition 做淡入淡出"}, {"k": "D", "t": "display:none 与 visibility:hidden 都完全无法被屏幕阅读器读取"}], "answer": ["A", "B", "C"], "explain": "display:none 完全移除渲染树（不占空间、不可点、transition 不起效）；visibility:hidden 保留占位、不可见不可点；opacity:0 保留占位、可见性为0但仍可点、可做过渡动画。D 错：visibility:hidden 元素仍可能被无障碍树部分暴露，且 opacity:0 通常仍可读，并非\"都完全无法被读取\"。", "android": "类比 Android：View.GONE≈display:none（不占空间）；View.INVISIBLE≈visibility:hidden（占位不可见）；alpha=0≈opacity:0（占位可点）。三者对应完全一致。", "kaodian": "AI 后端能力 - 语言基础层 - 并发与 volatile"}, {"no": 27, "type": "multi", "body": "为了让\"依赖当前时间\"的业务逻辑可单测，下列做法正确的有？（多选）", "code": null, "options": [{"k": "A", "t": "把 new Date() / System.currentTimeMillis() 包成 Clock/TimeProvider 接口注入"}, {"k": "B", "t": "测试中用固定时间替换 Clock，断言结果确定"}, {"k": "C", "t": "直接在代码里调用 LocalDateTime.now() 没关系，测试时改系统时钟"}, {"k": "D", "t": "用 PowerMock 桩掉静态时间方法也能测，但增加耦合与变慢"}], "answer": ["A", "B", "D"], "explain": "可测试性关键：时间/随机数/IO 等\"不确定性依赖\"应抽成可注入的抽象（Clock/TimeProvider），测试注入固定值使结果可断言（A/B）。改系统时钟（C）不可并行、不可靠。PowerMock 桩静态（D）能测但破坏封装、变慢，属无奈之举。", "android": "类比 Android：用 javax.inject.Provider<Clock> 或 Hilt 提供测试 Clock；Robolectric 的 ShadowSystemClock 也是注入固定时间——否则用例随\"运行时刻\"飘红。", "kaodian": "AI 后端能力 - 框架与容器层 - 可测试性设计"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 28, "type": "judge", "body": "InnoDB 中执行 DELETE 删除大量行后，表文件（.ibd）占用的磁盘空间会立即归还给操作系统。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "InnoDB 的 DELETE 只是把行标记为可复用（留下\"空洞/碎片\"），空间留在 .ibd 内供后续 INSERT 复用，并不会立即归还 OS。要真正收缩文件需用 OPTIMIZE TABLE / ALTER TABLE ... ENGINE=InnoDB 重建表。", "android": "类比 Android：SQLite 的 DELETE 同理不立即收缩 db 文件，需 VACUUM；RecyclerView 删除 item 也不回收 ViewHolder 内存，靠回收池复用。", "kaodian": "AI 前端能力 - 工程化与网络 - HTTP 方法语义"}, {"no": 29, "type": "judge", "body": "HTTP 规范中，GET 请求不可以携带请求体（body），若携带则服务端必然忽略。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "HTTP/1.1 规范（RFC 7231）只说 GET 语义上不应有 body、也不应对其产生副作用，但并未禁止携带 body；部分客户端/服务端/代理确实会忽略或拒绝，但\"必然忽略\"不成立。工程上 GET 带 body 不鼓励（缓存、代理、中间件兼容性差），复杂查询优先用 POST 或查询参数。", "android": "类比 Android：OkHttp 允许给 GET 请求加 RequestBody（技术上可行），但多数网关/服务端约定不读 GET 的 body，类似\"协议没禁但你最好别用\"。", "kaodian": "AI 前端能力 - 工程化与网络 - Axios params"}, {"no": 30, "type": "judge", "body": "CI 流水线中，只要单元测试通过、功能正常，就可以合并代码，无需设置覆盖率门槛或编译类型检查门禁。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "质量门禁应包含：编译/类型检查（tsc/kotlinc）通过、单测通过且覆盖率不低于阈值、静态扫描无致命问题。仅\"功能正常\"不够——未覆盖的代码可能藏回归；类型检查能拦低级错误。门禁是\"合并前的最后一道闸\"。", "android": "类比 Android：Android CI 需 ./gradlew lintKotlin + testDebugUnitTest + 覆盖率门槛，否则\"能跑\"不代表\"该合\"；如同 PR 卡 Lint/单测红线。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 回归测试"}, {"no": 31, "type": "judge", "body": "用 fetch 上传文件时，手动设置 headers:{'Content-Type':'multipart/form-data'} 比让浏览器自动设置更好，能避免 boundary 问题。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "multipart/form-data 必须在 Content-Type 里带 boundary 分隔符（如 multipart/form-data; boundary=----WebKit...），这个 boundary 由浏览器在发送时自动生成。手动写死 'multipart/form-data' 会丢失 boundary，服务端无法解析。正确做法：传 FormData 时完全不设置 Content-Type，让 fetch/XHR 自动带 boundary。", "android": "类比 Android：OkHttp 的 MultipartBody.Builder 自动加 boundary，别手动 addHeader(\"Content-Type\",\"multipart/form-data\") 否则丢 boundary；Retrofit @Multipart 同理由框架处理。", "kaodian": "AI 前端能力 - 工程化与网络 - Axios params"}, {"no": 32, "type": "judge", "body": "Java 中方法调用是\"值传递\"：对于对象参数，传递的是对象引用的副本，方法内把形参重新指向新对象不会影响调用方的原引用。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Java 只有值传递。基本类型传的是值的副本；对象类型传的是\"引用的值\"（指向同一对象的引用副本）。方法内通过形参修改对象内部状态会影响原对象（同一份数据），但把形参重新赋值（param = new X()）只改了副本，调用方引用不变。", "android": "类比 Android：Kotlin/Java 方法参数同样是值传递——把 Bitmap 引用传入方法后，在方法里让参数 = 另一个 Bitmap，调用方手里的引用不会变；但若改 bitmap.setHasAlpha(...) 则双方都看得到。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息可靠性-Kafka"}, {"no": 33, "type": "judge", "body": "SQL 中，NULL 与任何值（包括另一个 NULL）做 =、<>、> 等比较，结果都是 UNKNOWN（既非 true 也非 false），所以筛选 NULL 必须用 IS NULL / IS NOT NULL。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "SQL 是三值逻辑（TRUE/FALSE/UNKNOWN）。NULL 表示\"未知\"，NULL = NULL 结果是 UNKNOWN 而非 true，因此 WHERE col = NULL 永远筛不出行（应写 col IS NULL）。聚合函数（COUNT(*) 除外）会忽略 NULL；NOT IN (含 NULL 的子查询) 可能因 UNKNOWN 返回空结果，是经典坑。", "android": "类比 Android：SQLite 同样遵循三值逻辑，rawQuery 里用 = null 查不到，必须用 IS NULL；Room 的 @Query 也如此，别手滑写成 = NULL。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 聚合统计语义"}]}]}</script>

function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+q.no+'" data-no="'+q.no+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+q.no+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q.no==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=document.querySelector('.card[data-no="'+btn.dataset.no+'"]'); gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>

</body>
</html>
