<script type="application/json" id="quizData">{"id": "vol10", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "下列 SQL 因隐式类型转换导致索引失效的是？", "code": "-- phone 是 VARCHAR(20)\nSELECT * FROM user WHERE phone = 13800000000;\n-- 实际等价于\nSELECT * FROM user WHERE CAST(phone AS UNSIGNED) = 13800000000;", "options": [{"k": "A", "t": "phone 是字符串列，与数字比较触发隐式转换，索引失效走全表扫描"}, {"k": "B", "t": "数字与字符串比较 MySQL 会自动加索引提示"}, {"k": "C", "t": "隐式转换只影响结果不影响索引"}, {"k": "D", "t": "该查询一定能命中 phone 索引"}], "answer": "A", "explain": "当字符串列与数字比较时，MySQL 会对列做 CAST 函数转换（如 CAST(phone AS UNSIGNED)），等于在索引列上套了函数，导致该列索引失效、退化为全表扫描。应使用字符串字面量：phone = '13800000000'。", "kaodian": "AI后端能力-数据存储与ORM层-SQL隐式转换"}, {"no": 2, "type": "single", "body": "MyBatis-Plus 分页失效，最可能的原因是？", "code": "// 代码\nPage<User> p = userMapper.selectPage(new Page<>(1, 10), null);\n// 实际打印的 SQL 是 SELECT * FROM user（无 LIMIT）", "options": [{"k": "A", "t": "未注册分页插件（PaginationInnerInterceptor），MP 不会自动改写 LIMIT"}, {"k": "B", "t": "Page 对象构造参数传反了"}, {"k": "C", "t": "selectPage 方法名写错"}, {"k": "D", "t": "数据库不支持分页"}], "answer": "A", "explain": "MP 分页必须配置分页插件（PaginationInnerInterceptor，新版）并在拦截器链注册；缺它时 selectPage 只执行普通查询、不加 LIMIT，返回全部数据。这是分页失效最常见原因。", "kaodian": "AI后端能力-数据存储与ORM层-MP分页插件"}, {"no": 3, "type": "single", "body": "Spring 中 singleton 与 prototype Bean 的区别，正确的是？", "code": "@Scope(\"singleton\")  // 默认\n@Scope(\"prototype\")", "options": [{"k": "A", "t": "singleton 容器内唯一实例，prototype 每次获取都新建一个"}, {"k": "B", "t": "prototype 是默认作用域"}, {"k": "C", "t": "singleton Bean 每次注入都新建"}, {"k": "D", "t": "两者都随容器销毁而销毁"}], "answer": "A", "explain": "singleton（默认）整个容器共享一个实例；prototype 每次 getBean/注入都创建新实例，且容器不负责其销毁（需自行清理）。B 错（默认是 singleton）；C 反了；D prototype 容器不管理销毁。", "kaodian": "AI后端能力-应用框架层-SpringBean作用域"}, {"no": 4, "type": "single", "body": "Redis 发布订阅（Pub/Sub）的特点是？", "code": "JedisPubSub sub = new JedisPubSub(){ public void onMessage(String c,String m){...} };\njedis.subscribe(sub, \"news\");\njedis.publish(\"news\", \"hello\");", "options": [{"k": "A", "t": "消息发布后所有订阅该 channel 的客户端即时收到，但不持久化、离线丢失"}, {"k": "B", "t": "消息会持久化到磁盘，断线重连后能补收历史"}, {"k": "C", "t": "Pub/Sub 支持消费者组消费"}, {"k": "D", "t": "Pub/Sub 保证消息至少一次投递"}], "answer": "A", "explain": "Redis Pub/Sub 是广播式的即时消息：发布即推送给当前在线订阅者，不持久化、不积压，离线客户端错过即丢失。需持久化/重放应使用 Stream 或专业 MQ。B/C/D 均为 Stream/Kafka 特性。", "kaodian": "AI后端能力-高并发与中间件层-Redis发布订阅"}, {"no": 5, "type": "single", "body": "Kafka 要保证『不丢消息』，生产者侧关键配置是？", "code": "props.put(\"acks\", \"all\");\nprops.put(\"min.insync.replicas\", \"2\");\nprops.put(\"enable.idempotence\", \"true\");", "options": [{"k": "A", "t": "acks=all + 副本同步 + 幂等，保证写入被多数副本确认且不重复"}, {"k": "B", "t": "acks=0 最快且最安全"}, {"k": "C", "t": "只需 retries 即可保证不丢"}, {"k": "D", "t": "enable.idempotence 会降低吞吐但无助于不丢"}], "answer": "A", "explain": "不丢消息：acks=all 要求 Leader 等 ISR 全部确认；min.insync.replicas 保证有足够副本；enable.idempotence 防重试导致重复。acks=0 会丢（A 反）；仅 retries 不解决无确认问题。", "kaodian": "AI后端能力-高并发与中间件层-Kafka副本与ISR"}, {"no": 6, "type": "single", "body": "Java HashMap 在 JDK8 中，链表长度超过阈值会？", "code": "// 源码阈值\nstatic final int TREEIFY_THRESHOLD = 8;\n// 桶元素达 8 且表容量>=64 时链表转红黑树", "options": [{"k": "A", "t": "链表长度达 8 且表容量足够时转为红黑树，查询由 O(n) 降为 O(log n)"}, {"k": "B", "t": "链表长度无上限，永远不转换"}, {"k": "C", "t": "达到 8 立即转为数组"}, {"k": "D", "t": "转换阈值是固定 16"}], "answer": "A", "explain": "JDK8 HashMap：桶内链表长度 ≥ TREEIFY_THRESHOLD(8) 且 table 容量 ≥ 64 时，链表树化为红黑树，把最坏查询从 O(n) 降到 O(log n)，防止哈希碰撞攻击退化成链表。容量不足时先扩容不树化。", "kaodian": "AI后端能力-语言与计算层-集合HashMap"}, {"no": 7, "type": "single", "body": "RabbitMQ 实现『生产者到 Broker 不丢消息』，下列必要的是？", "code": "channel.confirmSelect();                 // 开启 confirm\nchannel.basicPublish(ex, rk, props, body);\n// 等待\nchannel.waitForConfirmsOrDie();", "options": [{"k": "A", "t": "开启 publisher confirm，并等待 Broker 确认收到"}, {"k": "B", "t": "仅设置消息持久化即可，无需 confirm"}, {"k": "C", "t": "使用 fanout 交换机自动确认"}, {"k": "D", "t": "confirm 只保证消费不丢，不保证发送不丢"}], "answer": "A", "explain": "生产者不丢：需开启 publisher confirm（channel.confirmSelect + 等待确认），确保消息确实到达 Broker。持久化只保证 Broker 宕机不丢磁盘消息，但若未确认到达就失败仍会丢。confirm 正是发送侧可靠性保证。", "kaodian": "AI后端能力-高并发与中间件层-RabbitMQ可靠投递"}, {"no": 8, "type": "single", "body": "Vue3 <script setup> 相比 Options API 的优势是？", "code": "// <script setup>\nconst count = ref(0);\nconst double = computed(() => count.value * 2);\n// 无需显式 return，编译期自动暴露", "options": [{"k": "A", "t": "组合式 API 在编译期把顶层绑定自动暴露给模板，代码更紧凑、类型推导更好"}, {"k": "B", "t": "script setup 必须手动 return 所有变量"}, {"k": "C", "t": "script setup 不支持 computed"}, {"k": "D", "t": "Options API 性能明显优于 script setup"}], "answer": "A", "explain": "<script setup> 是组合式 API 的语法糖：顶层声明自动暴露模板、无需 return，更好的 TS 类型推导、更少的样板代码。B/C/D 均错（它支持 computed、且非性能劣势）。", "kaodian": "AI前端能力-语言与运行时-Vue3组合式API"}, {"no": 9, "type": "single", "body": "CSS position: sticky 的行为是？", "code": "th { position: sticky; top: 0; }\n// 滚动时表头表现", "options": [{"k": "A", "t": "元素在跨越阈值前随文档滚动，之后相对视口『粘住』直到父容器滚出"}, {"k": "B", "t": "sticky 与 fixed 完全一样，脱离文档流"}, {"k": "C", "t": "sticky 只在动画中有效"}, {"k": "D", "t": "sticky 必须配合 display:flex"}], "answer": "A", "explain": "sticky 是相对+固定的混合：未达阈值时按正常流；到达 top:0 等阈值后相对视口固定，但仍受父容器边界约束（父容器滚出即不再粘）。它不脱离文档流（区别于 fixed），无需 flex。常用于表头/吸顶导航。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS定位"}, {"no": 10, "type": "single", "body": "用 AbortController 取消 Axios 请求，正确的是？", "code": "const ctrl = new AbortController();\naxios.get(url, { signal: ctrl.signal });\nctrl.abort();   // 触发取消", "options": [{"k": "A", "t": "把 ctrl.signal 传给请求配置，调用 ctrl.abort() 取消进行中的请求"}, {"k": "B", "t": "AbortController 只能取消 fetch，不能取消 axios"}, {"k": "C", "t": "取消后 axios 会返回成功而非异常"}, {"k": "D", "t": "signal 需放在 params 里"}], "answer": "A", "explain": "Axios 支持传入 AbortController 的 signal，调用 abort() 会中断请求并 reject（抛出 CanceledError）。B 错（axios 基于 fetch/XHR 均支持 signal）；C 取消会走 catch；D signal 在配置顶层非 params。", "kaodian": "AI前端能力-网络与BFF架构-Axios取消请求"}, {"no": 11, "type": "single", "body": "下列代码的输出是？", "code": "function outer() {\n  let arr = [];\n  for (var i = 0; i < 3; i++) {\n    arr.push(() => console.log(i));\n  }\n  return arr;\n}\nouter().forEach(f => f());", "options": [{"k": "A", "t": "0 1 2"}, {"k": "B", "t": "3 3 3"}, {"k": "C", "t": "undefined undefined undefined"}, {"k": "D", "t": "0 0 0"}], "answer": "B", "explain": "var 函数作用域无块级隔离，三个闭包共享同一个 i；循环结束 i=3，调用时打印的都是 3。经典闭包陷阱。改用 let（块级作用域）才会输出 0 1 2。", "kaodian": "AI前端能力-语言与运行时-JS闭包"}, {"no": 12, "type": "single", "body": "Promise.all 与 Promise.allSettled 的区别，正确的是？", "code": "Promise.all([a,b,c]);            // 任一 reject 立即 reject\nPromise.allSettled([a,b,c]);     // 全部完成后返回状态数组", "options": [{"k": "A", "t": "all 任一失败即整体 reject；allSettled 等都落定后返回每个的成功/失败状态"}, {"k": "B", "t": "allSettled 任一失败即整体 reject"}, {"k": "C", "t": "两者行为完全相同"}, {"k": "D", "t": "all 会忽略失败的 Promise"}], "answer": "A", "explain": "Promise.all 是『快速失败』：任一 reject 立即以该错误 reject。allSettled 等待所有 settle，返回 [{status:'fulfilled',value}|{status:'rejected',reason}]，适合需要知道每个结果成败的场景（如并行请求部分可失败）。", "kaodian": "AI前端能力-语言与运行时-Promise并发"}, {"no": 13, "type": "single", "body": "浏览器『关键渲染路径』指的是？", "code": "// 渲染前必须完成\nHTML -> DOM ; CSS -> CSSOM ; 合并 -> Render Tree -> Layout -> Paint", "options": [{"k": "A", "t": "从 HTML/CSS 到首次像素上屏所经历的建立 DOM/CSSOM/渲染树/布局/绘制的过程"}, {"k": "B", "t": "仅指 JavaScript 执行阶段"}, {"k": "C", "t": "只需下载 HTML 即可渲染，与 CSS 无关"}, {"k": "D", "t": "指用户点击到响应的时间"}], "answer": "A", "explain": "关键渲染路径（CRP）是浏览器把 HTML/CSS/JS 转为屏幕像素的关键步骤：构建 DOM 与 CSSOM、合成渲染树、布局(Layout)、绘制(Paint)、合成(Composite)。优化 CRP（减少阻塞资源）能加快首屏。", "kaodian": "AI前端能力-前端基础与渲染引擎-关键渲染路径"}, {"no": 14, "type": "single", "body": "前端路由 hash 模式与 history 模式的区别，正确的是？", "code": "// hash: /#/user    无需服务端配置\n// history: /user    需服务端 fallback 到 index.html", "options": [{"k": "A", "t": "hash 模式 URL 带 #、不向服务端发路由段请求、无需服务端配置；history 模式更美观但需服务端兜底"}, {"k": "B", "t": "history 模式完全不需要服务端配合"}, {"k": "C", "t": "hash 模式每次切换都会刷新页面"}, {"k": "D", "t": "两种模式底层实现完全相同"}], "answer": "A", "explain": "hash 模式用 # 后的片段标识路由，改变 hash 不触发整页刷新也不向服务端请求路径（天然兼容静态托管）；history 模式用真实路径更美观，但刷新/直链会向服务端请求该路径，需服务端把所有路由 fallback 到 index.html，否则 404。", "kaodian": "AI前端能力-前端生态-前端路由模式"}, {"no": 15, "type": "single", "body": "消费者驱动契约测试（如 Pact）的核心思想是？", "code": "// 消费者定义期望，生成契约\n// 提供者侧校验自身是否满足契约", "options": [{"k": "A", "t": "由消费者定义对接口的期望并生成契约，提供者侧 CI 校验是否满足，防止接口被改坏"}, {"k": "B", "t": "由提供者单方面定义接口，消费者被动接受"}, {"k": "C", "t": "契约测试就是普通端到端测试"}, {"k": "D", "t": "契约测试无需在 CI 中运行"}], "answer": "A", "explain": "CDC（消费者驱动契约）：消费者先写对接口的期望生成契约文件，提供者在 CI 中对照契约验证自己，能在联调前发现『提供者改了接口但消费者不知』的问题，比全链路 E2E 更轻量聚焦。", "kaodian": "AI质量保障-接口测试-契约测试"}, {"no": 16, "type": "single", "body": "等价类划分与边界值分析常用于？", "code": "// 输入年龄 18~60\n// 有效等价类: [18,60]\n// 边界: 17,18,60,61", "options": [{"k": "A", "t": "用最少的用例覆盖输入域：等价类取代表内取值，边界值补端点与邻域"}, {"k": "B", "t": "仅用于性能测试"}, {"k": "C", "t": "等价类越多用例越省"}, {"k": "D", "t": "边界值只取最小值"}], "answer": "A", "explain": "等价类划分把输入域分成若干类，每类取一代表即可，减少冗余；边界值分析针对『边界易错』补充端点及邻近值（如 17/18/60/61）。二者是黑盒用例设计基石，非性能测试。", "kaodian": "AI质量保障-软件测试理论与质量体系-等价类边界值"}, {"no": 17, "type": "single", "body": "Playwright 中拦截网络请求并 mock 响应，正确的是？", "code": "await page.route('**/api/user', route =>\n  route.fulfill({ status: 200, body: JSON.stringify({name:'mock'}) }));", "options": [{"k": "A", "t": "用 page.route 匹配 URL，route.fulfill 返回假数据，隔离后端依赖"}, {"k": "B", "t": "必须用第三方代理才能 mock"}, {"k": "C", "t": "route.fulfill 只能返回状态码不能返回 body"}, {"k": "D", "t": "mock 会污染真实后端数据库"}], "answer": "A", "explain": "Playwright 的 page.route + route.fulfill 可在浏览器层拦截请求并返回自定义响应，无需真实后端，适合隔离依赖、构造异常/边界场景。B/C/D 均错（无需代理、可带 body、不影响真实库）。", "kaodian": "AI质量保障-自动化测试-Playwright网络拦截"}, {"no": 18, "type": "single", "body": "测试数据准备（Test Data Preparation）的正确做法是？", "code": "// 用例前插入数据\nsetup: INSERT INTO t ... VALUES (...);\n// 用例后清理\nteardown: DELETE FROM t WHERE case_id='tc18';", "options": [{"k": "A", "t": "每个用例在 setup 构造所需数据、teardown 清理，保证可重复独立执行"}, {"k": "B", "t": "所有用例共用一份写死的生产库数据"}, {"k": "C", "t": "数据准备可有可无，直接跑就行"}, {"k": "D", "t": "清理步骤会拖慢测试应省略"}], "answer": "A", "explain": "良好测试数据实践：setup 注入用例专属数据、teardown 清理，确保用例可重复、独立、不互相污染。共用生产/写死数据会导致 flaky 与数据泄漏（B 错）；省略清理会累积脏数据（D 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试数据准备"}, {"no": 19, "type": "single", "body": "性能测试中，负载测试、压力测试、容量测试的区别，正确的是？", "code": "// 负载：预期并发下看表现\n// 压力：逐步加压到崩溃找拐点\n// 容量：确定最大支撑用户/吞吐", "options": [{"k": "A", "t": "负载测预期负载、压力测极限找拐点、容量确定最大支撑能力"}, {"k": "B", "t": "三者完全是一回事"}, {"k": "C", "t": "压力测试只测低并发"}, {"k": "D", "t": "容量测试不需要加压"}], "answer": "A", "explain": "负载测试：在预期并发下评估系统表现；压力测试：逐步加压至系统崩溃，找瓶颈拐点；容量测试：确定系统可支撑的最大用户数/吞吐量。三者目的递进不同。", "kaodian": "AI质量保障-软件测试理论与质量体系-性能测试类型"}, {"no": 20, "type": "single", "body": "用 AI 辅助生成测试用例时，合理的做法是？", "code": "cases = ai.generate(scenario=spec, count=10)\n// 这些用例的『预期结果』应如何对待？", "options": [{"k": "A", "t": "AI 生成用例的入参与步骤可参考，但预期结果须人工对照需求复核后再用"}, {"k": "B", "t": "AI 生成的用例可直接无脑加入回归套件"}, {"k": "C", "t": "AI 只能生成用例标题，不能生成步骤"}, {"k": "D", "t": "AI 生成用例越多越好，无需筛选"}], "answer": "A", "explain": "AI 能高效产出用例骨架（步骤、边界、异常），但预期结果必须人工对照需求/规格复核——AI 可能给出错误期望。生成后还需筛选与去重，而非直接照搬。", "kaodian": "AI质量保障-AI辅助测试-AI辅助用例生成"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "预防缓存雪崩（大量 key 同时失效/Redis 宕机）的手段有？", "code": "// 方案：TTL 加随机抖动\nexpire = base + random(0, 300);\n// 方案：多级缓存 + 限流 + 高可用集群", "options": [{"k": "A", "t": "给缓存过期时间加随机抖动，避免同一时刻集体失效"}, {"k": "B", "t": "Redis 高可用（主从/哨兵/集群）防止单点宕机全失效"}, {"k": "C", "t": "限流+熔断，防止击穿后请求把 DB 打垮"}, {"k": "D", "t": "把所有 key 设成永不过期最安全"}], "answer": ["A", "B", "C"], "explain": "雪崩是大量 key 同时失效或 Redis 宕机导致请求直击 DB。防护：① TTL 随机化错峰（A）；② 集群高可用（B）；③ 限流熔断保护 DB（C）。D 错：永不过期会导致数据永不更新、且 Redis 宕机仍全失效，并非安全。", "kaodian": "AI后端能力-高并发与中间件层-缓存雪崩"}, {"no": 2, "type": "multi", "body": "关于 ConcurrentHashMap（JDK8）下列说法正确的是？", "code": "// 读基本无锁，写用 CAS +  synchronized 锁桶头节点\nmap.put(\"k\", v);\nmap.computeIfAbsent(\"k\", k -> heavy());", "options": [{"k": "A", "t": "读操作基本无锁，性能高"}, {"k": "B", "t": "写操作对桶头节点加锁（synchronized），而非整表锁"}, {"k": "C", "t": "允许 key/value 为 null"}, {"k": "D", "t": "computeIfAbsent 回调中不要做耗时/递归操作，避免锁持有过久"}], "answer": ["A", "B", "D"], "explain": "JDK8 CHM：读无锁；写用 CAS + 对桶头节点 synchronized（细粒度，非整表锁，A、B 正确）；computeIfAbsent 在持有桶锁时执行回调，回调耗时/递归会长时间占锁（D 正确）。C 错：CHM 不允许 null key/value（歧义）。", "kaodian": "AI后端能力-语言与计算层-并发容器"}, {"no": 3, "type": "multi", "body": "Spring MVC 中下列注解用于绑定不同类型入参，正确的有？", "code": "@GetMapping(\"/u/{id}\")\npublic R get(@PathVariable Long id,\n             @RequestParam String name,\n             @RequestBody User u) {}", "options": [{"k": "A", "t": "@PathVariable 绑定 URL 路径变量"}, {"k": "B", "t": "@RequestParam 绑定查询参数 / 表单字段"}, {"k": "C", "t": "@RequestBody 绑定请求体（通常 JSON）并反序列化"}, {"k": "D", "t": "@RequestBody 只能接收表单格式"}], "answer": ["A", "B", "C"], "explain": "@PathVariable 取路径段（A）；@RequestParam 取 query/form 参数（B）；@RequestBody 将请求体（多为 JSON）反序列化为对象（C）。D 错：@RequestBody 通常对应 JSON/XML 等，表单用 @RequestParam/无注解。", "kaodian": "AI后端能力-应用框架层-SpringMVC参数绑定"}, {"no": 4, "type": "multi", "body": "常见前端性能优化手段有？", "code": "// 路由懒加载\nconst routes = [{ path:'/a', component: () => import('./A.vue') }];\n// 长列表虚拟滚动 / 防抖节流 / 资源缓存", "options": [{"k": "A", "t": "路由/组件懒加载，按需加载减小首包"}, {"k": "B", "t": "长列表虚拟滚动，只渲染可视区域"}, {"k": "C", "t": "防抖节流控制高频事件触发频率"}, {"k": "D", "t": "关闭浏览器缓存以强制每次拉最新"}], "answer": ["A", "B", "C"], "explain": "前端优化：懒加载减小首包（A）；虚拟列表降 DOM 量（B）；防抖节流降高频事件开销（C）。D 错：应『利用』强缓存/CDN 而非关闭缓存，关闭缓存反而更慢。", "kaodian": "AI前端能力-前端生态-前端性能优化手段"}, {"no": 5, "type": "multi", "body": "前端安全需要防范的攻击包括？", "code": "// XSS：恶意脚本注入\n// CSRF：借用户身份发请求\n// 防护：转义输出、CSP、CSRF Token、SameSite Cookie", "options": [{"k": "A", "t": "XSS（跨站脚本）：对用户输入转义、CSP 限制脚本来源"}, {"k": "B", "t": "CSRF（跨站请求伪造）：用 CSRF Token / SameSite Cookie 防御"}, {"k": "C", "t": "点击劫持：用 X-Frame-Options 阻止被 iframe 嵌套"}, {"k": "D", "t": "HTTPS 完全杜绝所有前端攻击"}], "answer": ["A", "B", "C"], "explain": "前端安全三件套：XSS（输入转义+CSP，A）、CSRF（Token+SameSite，B）、点击劫持（X-Frame-Options，C）。D 错：HTTPS 只解决传输加密，不防 XSS/CSRF 等应用层攻击。", "kaodian": "AI前端能力-前端生态-前端安全防护"}, {"no": 6, "type": "multi", "body": "接口测试按目标可划分为？", "code": "// 功能：正确返回\n// 性能：响应时间/吞吐\n// 安全：鉴权/越权\n// 契约：字段/格式一致", "options": [{"k": "A", "t": "功能测试：验证业务逻辑与返回正确"}, {"k": "B", "t": "性能测试：关注响应时间、并发、吞吐"}, {"k": "C", "t": "安全测试：鉴权、越权、注入等"}, {"k": "D", "t": "契约测试：校验接口字段/格式与约定一致"}], "answer": ["A", "B", "C", "D"], "explain": "接口测试多维度：功能（正确性）、性能（时延/吞吐）、安全（鉴权/越权/注入）、契约（字段格式符合约定）。四者互补，全选。", "kaodian": "AI质量保障-接口测试-接口测试类型"}, {"no": 7, "type": "multi", "body": "测试左移（Shift-Left）的具体活动包括？", "code": "// 需求阶段参与评审\n// 开发同时写单测\n// CI 自动跑质量门禁", "options": [{"k": "A", "t": "测试人员早期参与需求/设计评审，前置发现歧义"}, {"k": "B", "t": "开发阶段即写单元测试、TDD"}, {"k": "C", "t": "CI 中集成静态检查与质量门禁，问题早发现"}, {"k": "D", "t": "测试只在发布前集中执行最有效"}], "answer": ["A", "B", "C"], "explain": "测试左移：把测试活动前移到需求评审（A）、设计、编码（B 写单测/TDD）、CI 门禁（C），让缺陷尽早暴露、修复成本最低。D 错：集中后期测试是传统瀑布、成本最高。", "kaodian": "AI质量保障-软件测试理论与质量体系-测试左移活动"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "JVM 分代垃圾回收中，新对象优先在新生代（Young Gen）分配，经历多次 GC 仍存活的对象晋升到老年代。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "主流 JVM（如 G1/CMS 之前）采用分代假说：多数对象朝生夕死。新对象在新生代 Eden 分配，Minor GC 后存活者进入 Survivor，达到晋升年龄（默认 15）或 Survivor 放不下时晋升老年代。描述正确。", "kaodian": "AI后端能力-语言与计算层-JVMGC"}, {"no": 2, "type": "judge", "body": "BFC（块级格式化上下文）可以阻止外边距合并（margin collapse）并清除浮动。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "BFC 是一个独立的渲染区域：内部元素布局不影响外部，能阻止相邻块级元素的 margin 垂直合并，也能通过包含浮动元素（使其参与高度计算）来『清除浮动』。常见触发：overflow!=visible、display:flow-root、float、position:absolute。", "kaodian": "AI前端能力-前端基础与渲染引擎-BFC"}, {"no": 3, "type": "judge", "body": "Service Worker 可让 Web 应用在离线或弱网下仍可用，是 PWA（渐进式 Web 应用）的核心技术之一。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Service Worker 是运行在浏览器后台的脚本，能拦截网络请求、缓存资源，实现离线可用与消息推送，是 PWA 的基石之一（配合 manifest 实现可安装、离线优先）。描述正确。", "kaodian": "AI前端能力-前端生态-PWA"}, {"no": 4, "type": "judge", "body": "自动化测试金字塔建议：单元测试数量最多、接口/集成居中、UI 端到端最少。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "测试金字塔（Mike Cohn）主张：底层大量快速单元测试、中层适量集成/接口测试、顶层少量 UI E2E。道理是越往上层越慢越 flaky，应把多数保障放在又快又稳的单元测试上。", "kaodian": "AI质量保障-自动化测试-测试金字塔"}, {"no": 5, "type": "judge", "body": "缺陷逃逸率（Defect Escape Rate）= 线上/用户发现的缺陷数 ÷ 总缺陷数，越低说明内部质量保障越好。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "缺陷逃逸率衡量有多少缺陷『逃过』了内部测试到达生产，是质量门禁的重要度量。越低代表测试拦截能力越强、内建质量越好。是质量工程核心指标之一。", "kaodian": "AI质量保障-软件测试理论与质量体系-缺陷逃逸率"}, {"no": 6, "type": "judge", "body": "灰度发布（金丝雀）先把新版本放给少量用户，验证无问题再逐步放量，可降低发布风险。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "灰度/金丝雀发布：先小流量切新版本，监控关键指标，异常即回滚，稳定后逐步扩大比例。相比全量上线，能显著缩小故障爆炸半径、控制发布风险。是发布质量关键实践。", "kaodian": "AI质量保障-CI/CD与质量门禁-灰度发布"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
