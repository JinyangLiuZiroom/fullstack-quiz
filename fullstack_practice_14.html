<script type="application/json" id="quizData">{"id": "vol14", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "用 Redis Bitmap 做每日签到，下列统计本月签到天数的写法正确的是？", "code": "// 用户 1001，2026 年 8 月\nSETBIT sign:1001:202608 12 1   // 8月13日签到（偏移=日-1）\n// 统计本月签到天数 ?", "options": [{"k": "A", "t": "BITCOUNT sign:1001:202608"}, {"k": "B", "t": "STRLEN sign:1001:202608"}, {"k": "C", "t": "GETBIT sign:1001:202608"}, {"k": "D", "t": "SCARD sign:1001:202608"}], "answer": "A", "explain": "Bitmap 本质是 String，BITCOUNT 统计置为 1 的位数，正好等于签到天数。STRLEN 返回字节长度（≈天数/8，不是签到数）；GETBIT 必须带偏移且只查单天；SCARD 是 Set 命令，类型不匹配会报 WRONGTYPE。", "kaodian": "AI后端能力-高并发与中间件层-RedisBitmap"}, {"no": 2, "type": "single", "body": "下列 EXPLAIN 输出说明什么？", "code": "EXPLAIN SELECT id,name FROM t_user WHERE name='张三';\n+----+-------+------+---------+---------+------+----------+-------------+\n| id | type  | key  | key_len | rows    | ...  | filtered | Extra       |\n+----+-------+------+---------+---------+------+----------+-------------+\n|  1 | ALL   | NULL | NULL    | 998234  | ...  | 10.00    | Using where |", "options": [{"k": "A", "t": "没有可用索引，走全表扫描，约需扫描 99 万行后再用 WHERE 过滤"}, {"k": "B", "t": "type=ALL 表示走了全索引扫描，性能良好"}, {"k": "C", "t": "Using where 表示已用索引下推，无需优化"}, {"k": "D", "t": "key=NULL 表示主键索引生效"}], "answer": "A", "explain": "type=ALL 是全表扫描（最差级别，优于它的有 index/range/ref/eq_ref/const）；key=NULL 说明没有任何索引被选用；rows≈99万 是预估扫描行数；Extra=Using where 只是说 Server 层还要做条件过滤，不代表索引下推（那是 Using index condition）。优化方向：给 name 建索引。", "kaodian": "AI后端能力-数据存储与ORM层-EXPLAIN执行计划"}, {"no": 3, "type": "single", "body": "下列 @Scheduled 的执行时机是？", "code": "@Scheduled(cron = \"0 0/30 9-18 * * ?\")\npublic void syncOrder() { ... }", "options": [{"k": "A", "t": "每天 9:00 到 18:30 之间，每 30 分钟执行一次"}, {"k": "B", "t": "每天 9 点和 18 点各执行一次"}, {"k": "C", "t": "每 30 秒执行一次"}, {"k": "D", "t": "每月 30 号 9 点到 18 点执行"}], "answer": "A", "explain": "cron 六位为 秒 分 时 日 月 周。这里 秒=0、分=0/30（从 0 分开始每 30 分）、时=9-18（9 点到 18 点整点区间都命中），所以在 9:00、9:30 … 18:00、18:30 触发。注意 Spring 的 cron 不支持第七位年，周与日互斥需用 ?。", "kaodian": "AI后端能力-应用框架层-定时任务cron"}, {"no": 4, "type": "single", "body": "Kafka 生产者如下配置，可靠性表现是？", "code": "props.put(\"acks\", \"1\");\nprops.put(\"retries\", 3);\n// topic 副本数 3，min.insync.replicas=2", "options": [{"k": "A", "t": "只等 Leader 落盘就返回，Leader 宕机且未同步到 Follower 时会丢消息"}, {"k": "B", "t": "等所有 ISR 副本确认，不会丢消息"}, {"k": "C", "t": "完全不等确认，吞吐最高"}, {"k": "D", "t": "acks=1 时 min.insync.replicas 会强制升级为 all"}], "answer": "A", "explain": "acks=0 不等确认（最快最不可靠）；acks=1 只等 Leader 写入本地日志即返回，若此时 Leader 崩溃而数据未复制到 Follower，消息丢失；acks=all/-1 等 ISR 全部确认，配合 min.insync.replicas=2 才是高可靠。min.insync.replicas 只在 acks=all 时生效，不会反向提升 acks。", "kaodian": "AI后端能力-高并发与中间件层-Kafka生产者acks"}, {"no": 5, "type": "single", "body": "MyBatis-Plus 要拼 `status=1 AND (name like ? OR phone like ?)`，正确写法是？", "code": "LambdaQueryWrapper<User> w = new LambdaQueryWrapper<>();\nw.eq(User::getStatus, 1);\n// 补全 ?", "options": [{"k": "A", "t": "w.and(x -> x.like(User::getName, kw).or().like(User::getPhone, kw));"}, {"k": "B", "t": "w.like(User::getName, kw).or().like(User::getPhone, kw);"}, {"k": "C", "t": "w.or().like(User::getName, kw).like(User::getPhone, kw);"}, {"k": "D", "t": "w.eq(User::getName, kw).or(User::getPhone, kw);"}], "answer": "A", "explain": "MP 默认用 AND 连接，直接写 .like().or().like()（B）会生成 `status=1 AND name like ? OR phone like ?`，因 OR 优先级低导致条件被拆散、status 过滤失效。必须用 and(Consumer) 包一层生成括号：`status=1 AND (name like ? OR phone like ?)`。C 的 or() 位置错；D 的 or 不接受这种参数。", "kaodian": "AI后端能力-数据存储与ORM层-MP条件嵌套括号"}, {"no": 6, "type": "single", "body": "下列 Stream 代码输出是？", "code": "List<String> l = List.of(\"aa\",\"b\",\"cc\",\"d\");\nMap<Integer,List<String>> m = l.stream()\n    .collect(Collectors.groupingBy(String::length));\nSystem.out.println(m);", "options": [{"k": "A", "t": "{1=[b, d], 2=[aa, cc]}"}, {"k": "B", "t": "{2=[aa, cc], 1=[b, d]}"}, {"k": "C", "t": "{aa=2, b=1, cc=2, d=1}"}, {"k": "D", "t": "抛 IllegalStateException：key 重复"}], "answer": "A", "explain": "groupingBy 按分类函数结果分组，value 默认收集为 List。默认返回 HashMap，Integer 键 1、2 的哈希桶顺序使打印为 {1=[b, d], 2=[aa, cc]}。groupingBy 允许键重复（这就是它的用途），不会像 toMap 那样抛 IllegalStateException。", "kaodian": "AI后端能力-语言与计算层-StreamAPI分组"}, {"no": 7, "type": "single", "body": "RabbitMQ 手动确认模式下，`basicAck(deliveryTag, true)` 的含义是？", "code": "channel.basicConsume(queue, false, consumer);  // autoAck=false\n// 处理完成后\nchannel.basicAck(deliveryTag, true);", "options": [{"k": "A", "t": "批量确认：确认该 deliveryTag 及之前所有未确认的消息"}, {"k": "B", "t": "只确认当前这一条消息"}, {"k": "C", "t": "拒绝当前消息并重新入队"}, {"k": "D", "t": "开启自动确认模式"}], "answer": "A", "explain": "basicAck 第二个参数 multiple=true 表示批量确认（≤ 该 tag 的所有未确认消息一并确认），false 才是只确认当前一条。批量确认吞吐更高但一旦中间某条实际处理失败会被误确认导致丢消息。拒绝入队是 basicNack/basicReject 且 requeue=true。", "kaodian": "AI后端能力-高并发与中间件层-RabbitMQ手动确认"}, {"no": 8, "type": "single", "body": "Vue3 `<script setup>` 中声明 props 与事件的正确写法是？", "code": "<script setup lang=\"ts\">\n// 需要：接收 title(必填)，向父组件抛 close 事件\n<\/script>", "options": [{"k": "A", "t": "const props = defineProps<{title: string}>(); const emit = defineEmits<{(e:'close'):void}>();"}, {"k": "B", "t": "export default { props:['title'], emits:['close'] }"}, {"k": "C", "t": "import { props, emits } from 'vue'"}, {"k": "D", "t": "this.$props.title 与 this.$emit('close')"}], "answer": "A", "explain": "<script setup> 中用编译宏 defineProps / defineEmits，无需 import，支持纯类型声明。B 是 Options API 写法，与 script setup 混用会冗余；C 中 vue 并未导出 props/emits；D 的 this 在 setup 语境下为 undefined。", "kaodian": "AI前端能力-语言与运行时-Vue3defineProps"}, {"no": 9, "type": "single", "body": "下列 CSS 中 .box 的最终宽度是？", "code": ".box {\n  width: clamp(200px, 50%, 400px);\n}\n/* 父容器宽度 600px */", "options": [{"k": "A", "t": "300px"}, {"k": "B", "t": "200px"}, {"k": "C", "t": "400px"}, {"k": "D", "t": "600px"}], "answer": "A", "explain": "clamp(min, preferred, max) 取值规则：preferred 在 [min,max] 区间内就取 preferred。父容器 600px 的 50% = 300px，落在 200~400 之间，故为 300px。若父容器 300px 则 50%=150px < 200px，取 200px；父容器 1000px 时 50%=500px > 400px，取 400px。", "kaodian": "AI前端能力-前端基础与渲染引擎-CSS函数clamp"}, {"no": 10, "type": "single", "body": "Axios 需要「超时 3 秒 + 超时后自动重试 2 次」，下列做法正确的是？", "code": "const http = axios.create({ timeout: 3000 });\nhttp.interceptors.response.use(null, async err => {\n  const cfg = err.config;\n  // 补全重试逻辑 ?\n});", "options": [{"k": "A", "t": "在 config 上记录已重试次数，未超上限则 return http(cfg)，否则 return Promise.reject(err)"}, {"k": "B", "t": "在 response 成功拦截器里重试"}, {"k": "C", "t": "把 timeout 设为 0 即可自动重试"}, {"k": "D", "t": "重试要用 window.location.reload()"}], "answer": "A", "explain": "重试要写在响应错误拦截器里：给 err.config 挂一个计数字段（如 cfg.__retry），小于上限就 return 实例再次发起请求（返回 Promise 让调用方感知），否则 reject 把错误抛出。B 位置错（成功不需要重试）；timeout:0 是永不超时不是重试；D 会刷新整个页面，属于破坏性操作。", "kaodian": "AI前端能力-网络与BFF架构-Axios超时重试"}, {"no": 11, "type": "single", "body": "关于 TypeScript 的 `unknown` 与 `any`，下列正确的是？", "code": "let a: any = getData();\nlet u: unknown = getData();\na.foo();      // 1\nu.foo();      // 2", "options": [{"k": "A", "t": "1 编译通过（any 关闭检查），2 编译报错，需先做类型收窄或断言"}, {"k": "B", "t": "1 和 2 都编译通过"}, {"k": "C", "t": "1 报错，2 通过"}, {"k": "D", "t": "unknown 是 any 的别名，行为完全一致"}], "answer": "A", "explain": "any 会关闭类型检查，任何操作都放行（风险高）；unknown 是「类型安全的 any」，赋值可以任意但使用前必须收窄（typeof/instanceof/自定义类型守卫）或断言，否则报错。接收外部不可信数据（接口响应、JSON.parse）优先用 unknown。", "kaodian": "AI前端能力-语言与运行时-TSunknown与any"}, {"no": 12, "type": "single", "body": "下列代码输出是？", "code": "const obj = {\n  n: 1,\n  getA() { return this.n; },\n  getB: () => this.n\n};\nconsole.log(obj.getA(), obj.getB());", "options": [{"k": "A", "t": "1 undefined"}, {"k": "B", "t": "1 1"}, {"k": "C", "t": "undefined 1"}, {"k": "D", "t": "报错"}], "answer": "A", "explain": "普通方法 getA 的 this 由调用者决定，obj.getA() 中 this=obj，返回 1。箭头函数 getB 没有自己的 this，捕获定义时外层作用域的 this（模块/浏览器顶层通常是 undefined 或 window），拿不到 obj.n，因此为 undefined（严格模式下 this 为 undefined 会报错，模块顶层 this 是 undefined 时读属性也会抛错；非严格全局下得到 undefined）。", "kaodian": "AI前端能力-语言与运行时-this绑定与箭头函数"}, {"no": 13, "type": "single", "body": "需求：Tab 切换时保留组件内部输入状态，正确做法是？", "code": "<component :is=\"cur\" />\n<!-- 切走再切回，输入框内容丢了 -->", "options": [{"k": "A", "t": "用 <KeepAlive> 包裹动态组件，缓存实例避免销毁重建"}, {"k": "B", "t": "给组件加 v-show 就能保留状态"}, {"k": "C", "t": "把状态写到 data 里就自动保留"}, {"k": "D", "t": "用 v-if 配合 key 强制刷新"}], "answer": "A", "explain": "动态组件切换会销毁旧实例，内部状态随之丢失。<KeepAlive> 缓存组件实例（触发 onActivated/onDeactivated 而非 unmounted），状态得以保留，可用 include/exclude/max 控制缓存范围。v-show 只切 display 但 <component :is> 依然换实例；data 是实例级的，实例销毁就没了；v-if + key 恰恰是强制重建。", "kaodian": "AI前端能力-语言与运行时-Vue3KeepAlive"}, {"no": 14, "type": "single", "body": "下列关于 setTimeout 与 requestAnimationFrame 的说法正确的是？", "code": "setTimeout(() => move(), 16);\nrequestAnimationFrame(() => move());", "options": [{"k": "A", "t": "rAF 由浏览器在下一次重绘前调用，与屏幕刷新率同步，页面不可见时会暂停"}, {"k": "B", "t": "两者完全等价，rAF 只是语法糖"}, {"k": "C", "t": "setTimeout(fn,16) 能严格保证 60fps"}, {"k": "D", "t": "rAF 属于微任务，优先级高于 Promise"}], "answer": "A", "explain": "rAF 回调在每帧渲染前执行，频率跟随显示器刷新率（60Hz≈16.7ms，高刷屏更快），标签页隐藏时自动暂停省电，做动画比 setTimeout 更平滑。setTimeout 只是「不早于」指定时间执行，受任务队列拥塞影响会掉帧。rAF 不是微任务，它属于渲染流程中的回调阶段。", "kaodian": "AI前端能力-前端基础与渲染引擎-requestAnimationFrame"}, {"no": 15, "type": "single", "body": "登录接口规则：用户名/密码/验证码三者任一为空即失败；全对且账号未锁定才成功。用判定表法设计用例，最贴切的做法是？", "code": "条件：用户名非空? 密码非空? 验证码正确? 账号未锁定?\n动作：登录成功 / 提示缺参 / 提示验证码错 / 提示已锁定", "options": [{"k": "A", "t": "列出条件组合并合并等价规则，覆盖每条动作至少一次，剔除不可能组合"}, {"k": "B", "t": "枚举全部 2^4=16 组合，一条都不能合并"}, {"k": "C", "t": "只测全对的成功路径即可"}, {"k": "D", "t": "判定表只适合性能测试"}], "answer": "A", "explain": "判定表法适合多条件组合的逻辑判定：先列条件与动作，再枚举组合形成规则，然后合并等价规则（如任一参数为空都走同一提示，可归并）并剔除矛盾组合，保证每个动作被覆盖。全枚举（B）会用例爆炸且大量冗余；只测正向（C）漏掉全部异常分支；判定表是功能测试方法，不是性能方法。", "kaodian": "AI质量保障-软件测试理论与质量体系-判定表法"}, {"no": 16, "type": "single", "body": "H5 页面兼容性测试，覆盖策略最合理的是？", "code": "目标用户：iOS Safari / Android Chrome / 微信内置浏览器\n分辨率：360~430 宽，含刘海屏", "options": [{"k": "A", "t": "按真实用户占比选主流机型与浏览器组合，覆盖极端分辨率与安全区域，再抽样长尾"}, {"k": "B", "t": "只在开发者本机 Chrome 上验证即可"}, {"k": "C", "t": "必须覆盖市面全部机型才算完成"}, {"k": "D", "t": "兼容性问题都是后端引起的，不必前端测试"}], "answer": "A", "explain": "兼容性测试要基于真实数据做风险分层：主流机型/系统/浏览器（尤其微信 WebView 与系统 Safari 内核差异）必测，极端分辨率与刘海屏安全区（safe-area-inset）单独验证，长尾抽样兜底。只测本机（B）漏 WebView 差异；全量覆盖（C）成本不现实；渲染与 API 差异是端侧问题（D 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-兼容性测试"}, {"no": 17, "type": "single", "body": "下列 Playwright 用例的问题是？", "code": "test.beforeEach(async ({ page }) => {\n  await page.goto('/login');\n  await login(page, 'admin', '123456');\n});\ntest('改昵称', async ({ page }) => { /* 改成 A */ });\ntest('查昵称', async ({ page }) => { /* 断言是 A */ });", "options": [{"k": "A", "t": "两个用例通过共享账号数据形成依赖，单独跑或并行跑「查昵称」会失败"}, {"k": "B", "t": "beforeEach 不能写 goto"}, {"k": "C", "t": "Playwright 不支持多个 test"}, {"k": "D", "t": "必须用 beforeAll 才能登录"}], "answer": "A", "explain": "用例独立性被破坏：第二条用例依赖第一条改过的数据，一旦单独执行、乱序执行或并行执行就会失败（典型 flaky 来源）。正确做法是每条用例自备前置数据（API 造数或 fixture 初始化）并在结束时清理。beforeEach 里写 goto 与登录是常规做法（B/D 错），Playwright 当然支持多 test（C 错）。", "kaodian": "AI质量保障-自动化测试-Playwright用例依赖"}, {"no": 18, "type": "single", "body": "验证「支付下单接口幂等」的用例应怎么设计？", "code": "POST /api/order/pay\nHeader: Idempotency-Key: abc-123\nBody: {orderId: 1001, amount: 99}", "options": [{"k": "A", "t": "用同一 Idempotency-Key 重复提交多次，断言只产生一笔支付记录且响应一致"}, {"k": "B", "t": "换不同 Key 提交多次，断言产生多笔记录"}, {"k": "C", "t": "只调一次接口，断言返回 200"}, {"k": "D", "t": "幂等由前端按钮防抖保证，接口无需测试"}], "answer": "A", "explain": "幂等的定义是同一请求重复执行结果一致、副作用只发生一次。测试要点：相同幂等键并发/串行重复提交 → 只有一笔支付、金额不翻倍、响应体一致（或返回已处理状态）。B 测的是不同请求（本就该多笔）；只调一次（C）根本没验证幂等；前端防抖只是体验优化，无法防重放与网络重试（D 错）。", "kaodian": "AI质量保障-接口测试-幂等性验证"}, {"no": 19, "type": "single", "body": "下列缺陷单最大的问题是？", "code": "标题：页面有问题\n描述：我点了一下就不行了，你们看看\n环境：无\n步骤：无\n期望/实际：无", "options": [{"k": "A", "t": "缺少可复现步骤、环境信息与期望/实际结果，开发无法定位，会被打回"}, {"k": "B", "t": "标题太长"}, {"k": "C", "t": "没写修复方案，所以不合格"}, {"k": "D", "t": "缺陷单只要标题就够了"}], "answer": "A", "explain": "一份合格缺陷单必须包含：明确标题（模块+现象）、环境（版本/机型/账号）、可复现步骤（编号化）、期望结果 vs 实际结果、证据（截图/录屏/日志/traceId）、频率与严重级别。缺这些开发只能反复追问，拉长闭环。修复方案是开发职责，不是提单必填（C 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-缺陷报告规范"}, {"no": 20, "type": "single", "body": "让 AI 分析一轮回归的测试报告，最有价值的用法是？", "code": "输入：2000 条用例结果 + 失败堆栈 + 近 5 轮历史\n输出：?", "options": [{"k": "A", "t": "聚类失败原因、区分真实缺陷与环境/脚本问题、识别频繁 flaky 用例并给出优先处理建议"}, {"k": "B", "t": "直接把所有失败都判为产品缺陷提单"}, {"k": "C", "t": "让 AI 把失败用例标记为通过以提高通过率"}, {"k": "D", "t": "只让 AI 统计通过率数字"}], "answer": "A", "explain": "AI 处理大批量结果的优势在归并与分类：把 2000 条结果里的失败按堆栈/报错特征聚类，区分产品缺陷、环境抖动、脚本失效三类，结合历史轮次识别 flaky 高发用例，输出优先级建议。全判为缺陷（B）会产生大量无效单；改结果（C）是造假；只统计数字（D）浪费了 AI 的分析能力。", "kaodian": "AI质量保障-AI辅助测试-AI辅助测试报告分析"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于 Redis 内存淘汰策略（maxmemory-policy），下列说法正确的有？（多选，多选、少选、错选均不得分）", "code": "maxmemory 2gb\nmaxmemory-policy allkeys-lru", "options": [{"k": "A", "t": "allkeys-lru 在所有 key 中按最近最少使用淘汰，适合纯缓存场景"}, {"k": "B", "t": "volatile-lru 只淘汰设置了过期时间的 key，若无此类 key 会写入失败"}, {"k": "C", "t": "noeviction 达到上限后写命令直接返回错误，读命令仍可用"}, {"k": "D", "t": "allkeys-lru 能保证绝对不淘汰热点数据"}], "answer": ["A", "B", "C"], "explain": "A 对：allkeys-lru 全库 LRU，是缓存型实例首选。B 对：volatile-* 系列只在带 TTL 的 key 中挑选，如果没有可淘汰对象，写入会报 OOM 错误——所以「缓存与持久数据混存」时容易踩坑。C 对：noeviction 拒绝写、允许读。D 错：Redis 用的是近似 LRU（采样而非全量维护链表），且访问模式突变时热点仍可能被淘汰，需靠 allkeys-lfu 或业务预热缓解。", "kaodian": "AI后端能力-高并发与中间件层-Redis内存淘汰"}, {"no": 2, "type": "multi", "body": "关于 Spring Boot 自动配置，下列说法正确的有？（多选）", "code": "@SpringBootApplication\n// = @SpringBootConfiguration + @EnableAutoConfiguration + @ComponentScan", "options": [{"k": "A", "t": "自动配置类通过 META-INF/spring/...AutoConfiguration.imports（旧版 spring.factories）被加载"}, {"k": "B", "t": "@ConditionalOnMissingBean 让用户自定义 Bean 时自动配置退让"}, {"k": "C", "t": "@ConditionalOnClass 让类路径缺少某依赖时跳过对应自动配置"}, {"k": "D", "t": "自动配置一定先于用户自定义配置生效，无法覆盖"}], "answer": ["A", "B", "C"], "explain": "A 对：Boot 2.7 前用 spring.factories，2.7+ 改为 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports。B 对：这是「约定优于配置且可覆盖」的关键——用户声明了同类型 Bean，自动配置就不再注册。C 对：条件装配按类路径判断，没引依赖就不装。D 错：自动配置在用户配置之后处理，正是为了让用户能覆盖默认值。", "kaodian": "AI后端能力-应用框架层-SpringBoot自动配置"}, {"no": 3, "type": "multi", "body": "为 `WHERE tenant_id=? AND status=? ORDER BY create_time DESC` 设计联合索引，正确的有？（多选）", "code": "-- 高频查询，数据量 500 万\nSELECT id,title FROM t_task\nWHERE tenant_id=? AND status=? ORDER BY create_time DESC LIMIT 20;", "options": [{"k": "A", "t": "建 (tenant_id, status, create_time) 可同时命中等值过滤与排序，避免 filesort"}, {"k": "B", "t": "等值列放前、排序列放后，是联合索引设计的常见顺序原则"}, {"k": "C", "t": "把 id,title 也加进索引做成覆盖索引可进一步免回表"}, {"k": "D", "t": "建 (create_time, tenant_id, status) 效果更好，因为排序最重要"}], "answer": ["A", "B", "C"], "explain": "A/B 对：联合索引遵循最左前缀，等值条件列在前把范围缩小，最后一列用于有序输出，可让 ORDER BY 直接利用索引顺序，消除 Using filesort。C 对：把 SELECT 列并入索引形成覆盖索引，Extra 出现 Using index，省去回表 IO（代价是索引变大、写入变慢）。D 错：create_time 放最前会导致 tenant_id/status 无法走等值定位，扫描量暴增。", "kaodian": "AI后端能力-数据存储与ORM层-联合索引设计"}, {"no": 4, "type": "multi", "body": "关于前端图片性能优化，下列有效的手段有？（多选）", "code": "<img src=\"banner.png\" />  <!-- 2.4MB -->", "options": [{"k": "A", "t": "改用 WebP/AVIF 等现代格式，并用 <picture> 提供降级"}, {"k": "B", "t": "用 srcset + sizes 按设备像素比与视口下发不同尺寸"}, {"k": "C", "t": "非首屏图片加 loading=\"lazy\" 延迟加载"}, {"k": "D", "t": "只要把 img 的 width/height 用 CSS 缩小，实际下载体积就变小"}], "answer": ["A", "B", "C"], "explain": "A 对：WebP 普遍比 PNG/JPEG 小 25%~50%，AVIF 更优，用 <picture><source type> 做优雅降级。B 对：srcset/sizes 让浏览器按 DPR 与布局宽度选最合适的资源，避免手机下大图。C 对：原生懒加载零成本减少首屏请求。D 错：CSS 只影响渲染尺寸，原图字节数照样下载，还额外增加解码与内存开销；应该在服务端/构建期生成多尺寸。", "kaodian": "AI前端能力-前端生态-图片性能优化"}, {"no": 5, "type": "multi", "body": "关于 Vue3 组件 v-model，下列说法正确的有？（多选）", "code": "<!-- 父 -->\n<MyInput v-model=\"text\" v-model:count=\"n\" />", "options": [{"k": "A", "t": "默认 v-model 等价于 :modelValue 与 @update:modelValue"}, {"k": "B", "t": "支持多个具名 v-model，如 v-model:count 对应 count/update:count"}, {"k": "C", "t": "子组件可用 defineModel()（3.4+）简化读写"}, {"k": "D", "t": "子组件可以直接修改 props.modelValue 来通知父组件"}], "answer": ["A", "B", "C"], "explain": "A 对：Vue3 把 Vue2 的 value/input 改名为 modelValue/update:modelValue。B 对：具名 v-model 可以同时绑多个字段，互不干扰。C 对：3.4 起 defineModel() 返回可写 ref，内部赋值自动 emit，省去手写 computed get/set。D 错：props 单向数据流，直接改会触发警告且不会同步父级，必须 emit。", "kaodian": "AI前端能力-语言与运行时-Vue3组件v-model"}, {"no": 6, "type": "multi", "body": "下列哪些场景适合投入自动化测试？（多选）", "code": "待选：核心下单主流程 / 一次性运营活动页 / 100 组参数的接口校验 / UI 视觉细节主观评审", "options": [{"k": "A", "t": "长期稳定、回归频繁的核心业务主流程"}, {"k": "B", "t": "需要大量参数组合的接口校验，人工执行成本高"}, {"k": "C", "t": "构建后需要快速反馈的冒烟集合"}, {"k": "D", "t": "只上线一周的活动页 UI 视觉美观度评审"}], "answer": ["A", "B", "C"], "explain": "自动化的收益 = 执行频次 × 人工成本 − 维护成本。A/B/C 都满足高频执行且判定客观：核心主流程要每次回归、参数组合适合数据驱动、冒烟集合要求秒级反馈。D 不适合：生命周期极短（维护成本收不回）且「美观度」是主观判断，自动化无法可靠断言，更适合人工探索性测试或视觉回归工具辅助。", "kaodian": "AI质量保障-自动化测试-自动化投入判定"}, {"no": 7, "type": "multi", "body": "压测发现 TPS 上不去、P99 飙高，下列定位手段合理的有？（多选）", "code": "压测结果：并发 200 时 TPS 800，P99 2.3s，错误率 0.2%", "options": [{"k": "A", "t": "看服务端 CPU/内存/GC、线程池排队、DB 慢查询与连接池等待"}, {"k": "B", "t": "先确认压测机自身与网络不是瓶颈，避免误判"}, {"k": "C", "t": "用链路追踪定位耗时集中在哪一跳，再针对性优化"}, {"k": "D", "t": "直接把线程池核心数改成 1000，问题必然解决"}], "answer": ["A", "B", "C"], "explain": "A 对：先看资源与队列指标，判断是 CPU 密集、GC 停顿、锁竞争还是 DB 瓶颈。B 对：压测客户端带宽/CPU 打满或网络限速会造成假瓶颈，必须先自证清白。C 对：APM/Trace 能直接指出耗时最长的环节，避免盲猜。D 错：无脑加大线程数会导致上下文切换与内存暴涨，甚至把下游 DB 打死，反而更慢——扩容必须建立在瓶颈定位之后。", "kaodian": "AI质量保障-软件测试理论与质量体系-性能瓶颈定位"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "Redis 6.0 引入了多线程处理网络 IO，但命令的实际执行仍然是单线程串行的，因此单个命令天然具备原子性。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Redis 6.0 的 io-threads 只把 socket 读写与协议解析并行化，命令执行环节依旧由单一主线程串行处理，所以单条命令是原子的（这也是 INCR、SETNX 能当原子操作用的原因）。但要注意：多条命令组合不原子，需要 MULTI/EXEC 或 Lua 脚本来保证。", "kaodian": "AI后端能力-高并发与中间件层-Redis单线程模型"}, {"no": 2, "type": "judge", "body": "localStorage 的读写是同步 API，存取大字符串会阻塞主线程，因此不适合存放大量数据或高频写入。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "localStorage 是同步阻塞的，setItem/getItem 期间主线程被占用，存几 MB 的 JSON 会造成明显卡顿；同时它容量约 5MB、只能存字符串、同域共享。大量结构化数据应改用 IndexedDB（异步、容量大、支持索引），高频写入应做节流或批量合并。", "kaodian": "AI前端能力-前端生态-localStorage同步阻塞"}, {"no": 3, "type": "judge", "body": "CSS 选择器优先级中，`#id .cls p` 的权重低于内联 style，但高于 `.cls .cls2 p`；`!important` 会覆盖同层级的常规声明。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "权重按 (内联, id, 类/属性/伪类, 元素/伪元素) 比较：`#id .cls p` = (0,1,1,1)，`.cls .cls2 p` = (0,0,2,1)，先比 id 位 1>0，所以前者更高；内联 style 为 (1,0,0,0) 高于两者。!important 提升到更高优先层，能覆盖常规声明（多个 !important 之间再按权重与来源比较），但滥用会让样式难以维护。", "kaodian": "AI前端能力-前端基础与渲染引擎-选择器优先级计算"}, {"no": 4, "type": "judge", "body": "用例评审的主要目的是提前发现用例设计的遗漏与理解偏差，因此需求方与开发也应参与，而不是测试内部单方面自查。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "用例评审是测试左移的重要环节：产品参与可校正需求理解、开发参与能补充实现细节与边界（如异常分支、并发场景），从而在执行前消除遗漏与歧义，成本远低于上线后返工。只在测试内部自查容易延续同一套理解偏差。", "kaodian": "AI质量保障-软件测试理论与质量体系-用例评审"}, {"no": 5, "type": "judge", "body": "单元测试关注单个类或方法的内部逻辑并隔离外部依赖，集成测试关注多个组件（含 DB、MQ 等）协作时的真实行为，两者不能互相替代。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "单测用 mock/stub 隔离依赖，跑得快、定位准，适合覆盖分支与边界；集成测试连真实 DB/中间件，验证事务、SQL 映射、序列化、配置等只有集成后才暴露的问题。二者目标不同：单测全绿也可能因配置错误在集成时炸掉，反之集成测试无法高效覆盖所有分支。", "kaodian": "AI质量保障-自动化测试-单测与集成测试边界"}, {"no": 6, "type": "judge", "body": "只要单元测试行覆盖率达到 100%，就可以认为代码没有缺陷。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "覆盖率只说明「代码被执行过」，不说明「行为被正确断言」。100% 行覆盖仍可能漏掉分支/条件组合、边界值、并发时序、异常路径，甚至断言写成 console.log 这类假绿。覆盖率是必要的健康度指标，不是质量证明；应结合分支覆盖、变异测试与有效断言评估。", "kaodian": "AI质量保障-自动化测试-覆盖率局限"}]}]}</script>

function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;

  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';

  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
