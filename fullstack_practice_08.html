<script type="application/json" id="quizData">{"id": "vol08", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "某热点 key 在缓存过期瞬间被大量并发请求命中数据库，下列方案能正确防止缓存击穿的是？", "code": "// 逻辑过期方案：缓存不设 TTL，value 内嵌 expire 字段\nString getWithLogicalExpire(String key) {\n    RBucket<Obj> b = redisson.getBucket(key);\n    Obj v = b.get();\n    if (v != null && v.expire < System.currentTimeMillis()) {\n        // 获取互斥锁后异步重建，本次仍返回旧值\n        if (redisson.getLock(\"lock:\" + key).tryLock()) {\n            CompletableFuture.runAsync(() -> rebuild(key));\n        }\n    }\n    return v == null ? null : v.data;\n}", "options": [{"k": "A", "t": "缓存不设过期时间，靠后台定时任务统一刷新"}, {"k": "B", "t": "缓存 value 内嵌逻辑过期时间，过期后仅一个线程异步重建、其余返回旧值"}, {"k": "C", "t": "每次读取都先 delete 缓存再查库写回"}, {"k": "D", "t": "给 key 加随机 TTL 即可彻底解决"}], "answer": "B", "explain": "缓存击穿是单 key 热点过期瞬间的并发穿透。逻辑过期方案（B）不设物理 TTL，过期后由互斥锁保证只有一个线程重建，其余返回旧值，平滑无阻塞。A 无过期仍会雪崩；C 是 Cache-Aside 删除法不是击穿解法；D 随机 TTL 缓解雪崩非击穿。", "kaodian": "AI后端能力-高并发与中间件层-缓存击穿"}, {"no": 2, "type": "single", "body": "Kafka 生产者发送订单消息时希望『同一订单的创建与支付事件严格有序』，下列配置正确的是？", "code": "Properties p = new Properties();\np.put(\"partitioner.class\", \"org.apache.kafka.clients.producer.internals.DefaultPartitioner\");\n// 订单 id 作为消息 key 发送\nproducer.send(new ProducerRecord<>(\"order\", orderId, event));", "options": [{"k": "A", "t": "开启 enable.idempotence 就能跨分区保序"}, {"k": "B", "t": "不设置 key，让 round-robin 分配到不同分区"}, {"k": "C", "t": "用 orderId 作为消息 key，Kafka 按 key 哈希固定分区，同 key 落同一分区且分区内有序"}, {"k": "D", "t": "设置 acks=0 即可保证顺序"}], "answer": "C", "explain": "Kafka 只保证『分区内』有序。用业务 key（orderId）作为消息 key，相同 key 经默认分区器哈希到同一分区，从而同一订单事件在该分区内严格有序。B 跨分区无序；D/A 与顺序无直接关系（幂等解决重复而非顺序）。", "kaodian": "AI后端能力-高并发与中间件层-Kafka分区与顺序"}, {"no": 3, "type": "single", "body": "MyBatis-Plus 逻辑删除已全局开启，执行下列 deleteById 后数据库中实际发生的是？", "code": "// 实体字段\n@TableLogic\nprivate Integer deleted;\n// 调用\nuserMapper.deleteById(1L);", "options": [{"k": "A", "t": "改写为 UPDATE user SET deleted=1，不附加条件"}, {"k": "B", "t": "先 SELECT 再 UPDATE，两步完成"}, {"k": "C", "t": "物理删除该行（执行 DELETE FROM user WHERE id=1）"}, {"k": "D", "t": "改写为 UPDATE user SET deleted=1 WHERE id=1 AND deleted=0"}], "answer": "D", "explain": "开启 @TableLogic 后，MP 的删除方法被重写为逻辑删除：生成 UPDATE ... SET deleted=1 并自动追加未被删除的条件（deleted=0），不物理删数据。C 是未开启时的行为；A 遗漏条件不安全；B 错误。", "kaodian": "AI后端能力-数据存储与ORM层-MP逻辑删除"}, {"no": 4, "type": "single", "body": "下列 Spring 代码中 updateScore 上的 @Transactional 是否会生效？", "code": "@Service\npublic class OrderService {\n    public void place() {\n        updateScore(); // 同类内部调用\n    }\n    @Transactional\n    public void updateScore() { scoreMapper.incr(); }\n}", "options": [{"k": "A", "t": "不生效，同类内部自调用绕过代理，事务拦截器未被触发"}, {"k": "B", "t": "生效，Spring 通过字节码增强直接拦截内部调用"}, {"k": "C", "t": "仅当 place() 也加 @Transactional 时才生效"}, {"k": "D", "t": "生效，因为方法标注了 @Transactional"}], "answer": "A", "explain": "Spring 事务基于 AOP 代理，外部调用才经过代理拦截器。同类内部 this.updateScore() 直接调用目标方法，未走代理，故 @Transactional 失效。需将方法拆到另一个 Bean 或用自注入代理对象调用。", "kaodian": "AI后端能力-应用框架层-Spring事务自调用"}, {"no": 5, "type": "single", "body": "线程池队列已满且最大线程数也达到上限，新提交任务触发 CallerRunsPolicy，此时行为是？", "code": "new ThreadPoolExecutor(2, 4, 0L, TimeUnit.MILLISECONDS,\n    new ArrayBlockingQueue<>(2),\n    new ThreadPoolExecutor.CallerRunsPolicy());", "options": [{"k": "A", "t": "直接抛出 RejectedExecutionException"}, {"k": "B", "t": "由提交任务的调用线程（主线程）自己执行该任务"}, {"k": "C", "t": "静默丢弃最老的任务后入队"}, {"k": "D", "t": "丢弃当前任务且不抛异常"}], "answer": "B", "explain": "CallerRunsPolicy（调用者运行）在线程池和队列都满时，由提交任务的线程（如主线程）直接执行该 Runnable，起到负反馈限流作用，不丢弃任务也不抛异常。A 是 AbortPolicy；C 是 DiscardOldestPolicy；D 是 DiscardPolicy。", "kaodian": "AI后端能力-语言与计算层-线程池"}, {"no": 6, "type": "single", "body": "下表 user(id, name, age, city)，建立联合索引 idx_age_city(age, city)。下列查询能用上覆盖索引、无需回表的是？", "code": "SELECT age, city FROM user WHERE age = 25 AND city = 'BJ';\nSELECT * FROM user WHERE age = 25 AND city = 'BJ';", "options": [{"k": "A", "t": "两条都需要回表"}, {"k": "B", "t": "两条都能覆盖索引避免回表"}, {"k": "C", "t": "仅第一条（select 列均在索引中）能覆盖，第二条需要回表取其它列"}, {"k": "D", "t": "仅第二条能覆盖，第一条仍需回表"}], "answer": "C", "explain": "覆盖索引指查询所需列都包含在索引中，可直接从索引返回、不回表。idx_age_city 包含 age、city，第一条 SELECT age,city 全部命中即覆盖；第二条 SELECT * 还需 id 等其它列，必须回表。", "kaodian": "AI后端能力-数据存储与ORM层-SQL覆盖索引"}, {"no": 7, "type": "single", "body": "RabbitMQ 要让优先级高的消息先被消费，声明队列时必须配合的是？", "code": "Map<String, Object> args = new HashMap<>();\nargs.put(\"x-max-priority\", 10);\nchannel.queueDeclare(\"q\", true, false, false, args);\n// 发送时\nAMQP.BasicProperties props = new AMQP.BasicProperties.Builder()\n    .priority(8).build();", "options": [{"k": "A", "t": "需使用 fanout 交换机才能排序"}, {"k": "B", "t": "需开启 publisher confirm"}, {"k": "C", "t": "仅设置消息的 priority 属性即可，队列无需特殊声明"}, {"k": "D", "t": "队列必须用 x-max-priority 声明最大优先级，且发送消息带 priority 属性"}], "answer": "D", "explain": "RabbitMQ 优先级队列必须：① 队列声明时带 x-max-priority 指定上限；② 消息携带 priority 属性。两者缺一不可，否则消息按普通 FIFO 处理。与交换机类型、confirm 无关。", "kaodian": "AI后端能力-高并发与中间件层-RabbitMQ优先级队列"}, {"no": 8, "type": "single", "body": "Vue3 中 ref 与 reactive 的恰当选择，下列正确的是？", "code": "const a = ref(0);\nconst b = reactive({ count: 0 });\n// 模板中\n// {{ a }} 显示 0；{{ b.count }} 显示 0", "options": [{"k": "A", "t": "一律用 reactive，ref 仅用于模板 ref 引用 DOM"}, {"k": "B", "t": "ref 内部也是 reactive，基本类型也推荐用 reactive"}, {"k": "C", "t": "reactive 返回的对象解构后依然保持响应式"}, {"k": "D", "t": "基本类型用 ref，对象/数组用 reactive，二者响应原理相同"}], "answer": "D", "explain": "Vue3 中：基本类型用 ref（内部包一层 .value，模板自动解包）；对象/数组用 reactive（基于 Proxy）。D 正确。A/B 错误，ref 是响应式核心之一；C 错误，reactive 对象解构/展开会丢失响应式，需用 toRefs。", "kaodian": "AI前端能力-语言与运行时-ref与reactive辨析"}, {"no": 9, "type": "single", "body": "Flex 容器多根轴线时，下列属性起作用？", "code": "display: flex; flex-wrap: wrap;\n/* 容器高 300px，两行 item */\nalign-content: space-between;\nalign-items: center;", "options": [{"k": "A", "t": "align-items 控制多行整体分布"}, {"k": "B", "t": "align-content 控制多根轴线（多行）之间的分布，单行时无效果"}, {"k": "C", "t": "align-content 控制单行内 item 对齐"}, {"k": "D", "t": "justify-content 控制交叉轴多行分布"}], "answer": "B", "explain": "align-content 仅在 flex-wrap 产生多根轴线（多行）时生效，用于分配轴线间的剩余空间；单行时无效。align-items 才是控制每根轴线内 item 在交叉轴的对齐。A/C 描述反了；D 错误，justify-content 管主轴。", "kaodian": "AI前端能力-前端基础与渲染引擎-Flex对齐"}, {"no": 10, "type": "single", "body": "Axios 响应拦截器想统一处理 401 跳登录，下面写法正确的是？", "code": "axios.interceptors.response.use(\n  r => r,\n  err => {\n    if (err.response && err.response.status === 401) {\n      location.href = '/login';\n    }\n    return Promise.reject(err);\n  }\n);", "options": [{"k": "A", "t": "Axios 自动抛 401 不需要拦截"}, {"k": "B", "t": "在请求拦截器的 error 回调里处理"}, {"k": "C", "t": "在响应拦截器的失败回调中判断 err.response.status === 401"}, {"k": "D", "t": "用 axios.get 的第二个参数 onError 处理"}], "answer": "C", "explain": "401 是响应状态码，应在响应拦截器的错误回调（第二个参数）里读取 err.response.status 判断。B 请求阶段尚无响应；D Axios 无此参数；A 需手动处理。注意要 return Promise.reject 维持错误链。", "kaodian": "AI前端能力-网络与BFF架构-Axios拦截器"}, {"no": 11, "type": "single", "body": "下列 TypeScript 泛型约束写法，要求 T 必须有 length 属性，正确的是？", "code": "function longest<T extends { length: number }>(a: T, b: T): T {\n  return a.length >= b.length ? a : b;\n}", "options": [{"k": "A", "t": "function longest<T super { length: number }>(a:T,b:T):T"}, {"k": "B", "t": "function longest<T = { length: number }>(a:T,b:T):T"}, {"k": "C", "t": "function longest<T: { length: number }>(a:T,b:T):T"}, {"k": "D", "t": "function longest<T extends { length: number }>(a:T,b:T):T"}], "answer": "D", "explain": "TS 用 extends 子句约束泛型上限：<T extends {length:number}> 表示 T 必须至少拥有 length 属性。C 的冒号语法不存在；A super 用于条件类型推断位置非约束；B = 是默认类型非约束。", "kaodian": "AI前端能力-语言与运行时-TS泛型约束"}, {"no": 12, "type": "single", "body": "修改 DOM 的 width 触发浏览器下列哪类渲染开销？", "code": "el.style.width = '200px';   // 改宽\nel.style.color = 'red';      // 改色", "options": [{"k": "A", "t": "两者都只触发重绘，不重排"}, {"k": "B", "t": "两者都触发重排"}, {"k": "C", "t": "改 color 触发重排，改 width 仅重绘"}, {"k": "D", "t": "改 width 触发重排(Reflow)，改 color 仅触发重绘(Repaint)"}], "answer": "D", "explain": "改几何属性（width/height/位置）会触发重排（Reflow，重新计算布局）；改仅外观属性（color/background）只触发重绘（Repaint，不改布局）。重排必带重绘，开销更大。", "kaodian": "AI前端能力-前端基础与渲染引擎-重排重绘"}, {"no": 13, "type": "single", "body": "浏览器对下列请求发起『预检(Preflight)』OPTIONS 的是？", "code": "fetch('https://api.x.com/u', {\n  method: 'POST',\n  headers: { 'Content-Type': 'application/json', 'X-Token': 'abc' },\n  body: JSON.stringify({})\n});", "options": [{"k": "A", "t": "普通 GET 跨域请求"}, {"k": "B", "t": "带自定义请求头 X-Token 且 Content-Type 为 application/json 的非简单请求"}, {"k": "C", "t": "同源 POST 表单提交"}, {"k": "D", "t": "Content-Type 为 text/plain 的跨域请求"}], "answer": "B", "explain": "简单请求（GET/HEAD/POST + 仅允许的首部 + text/plain、multipart/form-data、application/x-www-form-urlencoded）不发预检。带自定义头 X-Token 且 Content-Type=application/json 属于非简单请求，浏览器先发 OPTIONS 预检确认服务器允许。", "kaodian": "AI前端能力-网络与BFF架构-CORS预检"}, {"no": 14, "type": "single", "body": "Vue3 中 computed 与 watch 的区别，正确的是？", "code": "const full = computed(() => user.first + user.last);\nwatch(() => user.first, (n, o) => console.log(n, o));", "options": [{"k": "A", "t": "二者完全等价，可互换"}, {"k": "B", "t": "computed 用于『派生值』（有返回值、可缓存），watch 用于『副作用』（无返回值、监听变化）"}, {"k": "C", "t": "computed 必须写异步逻辑，watch 不能异步"}, {"k": "D", "t": "watch 能返回新值给模板，computed 不能"}], "answer": "B", "explain": "computed 是带缓存的派生状态，必须有 return 且依赖不变不重算，适合模板展示；watch 用于响应变化执行副作用（请求、日志），无返回值。C/D/A 均错误。", "kaodian": "AI前端能力-语言与运行时-Vue3计算属性与侦听"}, {"no": 15, "type": "single", "body": "接口自动化测试中，仅断言 HTTP 状态码 200 但业务返回 {'code':500}，这属于？", "code": "resp = requests.post(url, json=payload)\nassert resp.status_code == 200   # 通过，但 resp.json()=={'code':500,'msg':'失败'}", "options": [{"k": "A", "t": "契约测试"}, {"k": "B", "t": "灰盒测试"}, {"k": "C", "t": "正确的断言写法"}, {"k": "D", "t": "假阳性（用例通过但接口实际业务失败）"}], "answer": "D", "explain": "HTTP 200 只表示传输层成功，业务 code=500 表示接口逻辑失败。只断言状态码会放过真实缺陷，造成『假阳性』——用例显示绿但实际有问题。正确做法是同时断言业务 code。", "kaodian": "AI质量保障-接口测试-接口断言"}, {"no": 16, "type": "single", "body": "回归测试挑选用例时，最合理的策略是？", "code": "// 变更：订单服务新增『优惠券叠加』逻辑\ncandidates = all_cases\nselected = filter_by(changed_modules + impact_analysis + history_fail_rate)", "options": [{"k": "A", "t": "只跑本次新增功能的用例"}, {"k": "B", "t": "按『变更模块 + 影响分析 + 历史高频失败』筛选相关用例，平衡成本与风险"}, {"k": "C", "t": "随机抽 20% 用例即可"}, {"k": "D", "t": "每次全量重跑所有用例，最保险"}], "answer": "B", "explain": "回归测试目标是用最小成本覆盖最大风险。合理做法是结合变更模块、影响面分析、历史失败率筛选用例，而非全量（慢）或只跑新功能（漏旧功能回归）或随机（不可控）。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归测试策略"}, {"no": 17, "type": "single", "body": "Playwright 中下列等待方式最稳健的是？", "code": "await page.getByRole('button', { name: '提交' }).click();\n// 而非\nawait page.waitForTimeout(3000);\nawait page.click('#submit');", "options": [{"k": "A", "t": "await page.waitForTimeout(3000) 硬等 3 秒最稳"}, {"k": "B", "t": "用 auto-waiting 的定位器语义点击，框架自动等元素可操作"}, {"k": "C", "t": "用 selector + 固定 sleep 组合"}, {"k": "D", "t": "直接 click 不等待"}], "answer": "B", "explain": "Playwright 定位器（getByRole 等）内置 auto-waiting：自动等待元素可见、稳定、可点击后再操作，比硬等 setTimeout 更稳健且快。A/C 的硬等易 flaky 且慢；D 可能点到未就绪元素。", "kaodian": "AI质量保障-自动化测试-Playwright自动等待"}, {"no": 18, "type": "single", "body": "CI 流水线中加入『单测覆盖率门禁』，下列作用正确的是？", "code": "# CI 步骤\n- name: test\n  run: mvn test && mvn jacoco:check -Djacoco.min=0.80", "options": [{"k": "A", "t": "替代人工代码评审"}, {"k": "B", "t": "保证代码无 bug"}, {"k": "C", "t": "强制单测覆盖率不低于阈值，低于则流水线失败，防止质量劣化"}, {"k": "D", "t": "自动生成测试用例"}], "answer": "C", "explain": "覆盖率门禁（jacoco:check）设定最低覆盖率阈值，未达标则 CI 失败，防止新代码拉低整体测试覆盖、倒逼写测试。它不保证无 bug（高覆盖≠无缺陷），也不能替代评审或自动生成用例。", "kaodian": "AI质量保障-CI/CD与质量门禁-单测覆盖率门禁"}, {"no": 19, "type": "single", "body": "用 AI 生成测试数据时，下列做法正确的是？", "code": "# 让 AI 根据接口定义生成入参\ngen = ai.generate(payload_schema)\n# 但预期结果由谁给？\nexpected = ???", "options": [{"k": "A", "t": "AI 生成的预期结果天然正确，无需复核"}, {"k": "B", "t": "完全不用 AI，纯手工"}, {"k": "C", "t": "AI 生成入参后，预期结果也完全由 AI 决定，直接用于断言"}, {"k": "D", "t": "AI 仅辅助生成入参/边界值，预期结果必须人工或依据规格复核后再断言"}], "answer": "D", "explain": "AI 可高效生成测试入参、边界值，但『预期结果』必须人工对照需求/规格复核——AI 可能臆造错误的期望，直接用会导致假阳性。C/A 危险；B 放弃提效。这是 AI 辅助测试的核心纪律。", "kaodian": "AI质量保障-AI辅助测试-AI辅助测试数据生成"}, {"no": 20, "type": "single", "body": "下列用 console.log 当断言的做法，问题是？", "code": "// 伪测试\nfunction testAdd() {\n  console.log(add(1, 2) === 3); // 打印 true\n}", "options": [{"k": "A", "t": "无自动判分，测试永远『通过』（不抛错），缺陷不会被发现（假绿）"}, {"k": "B", "t": "console.log 性能太差"}, {"k": "C", "t": "必须改成 console.error"}, {"k": "D", "t": "完全没有问题，打印 true 即通过"}], "answer": "A", "explain": "console.log 不会在结果错误时使测试失败（不抛 AssertionError），CI 视为通过，形成假绿，缺陷被掩盖。正确做法是用真实断言（assert/expect）让失败能被框架捕获并报红。", "kaodian": "AI质量保障-自动化测试-断言有效性"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于 Redisson 分布式锁，下列说法正确的有？", "code": "RLock lock = redisson.getLock(\"order:\" + id);\nlock.lock();                 // 未指定 leaseTime\n// 业务执行中...\nlock.unlock();", "options": [{"k": "A", "t": "未指定 leaseTime 时，Redisson 启动看门狗（watchdog）每 10s 续期，默认 30s 过期"}, {"k": "B", "t": "看门狗续期能保证业务没执行完锁不会提前过期"}, {"k": "C", "t": "unlock 必须由加锁线程调用，否则抛 IllegalMonitorState 异常"}, {"k": "D", "t": "看门狗续期是无限期的，业务卡死锁也永远不释放"}], "answer": ["A", "B", "C"], "explain": "Redisson 未指定 leaseTime 时启用 watchdog：默认 30s 过期、每 10s 续期，业务未结束锁不释放（A、B 正确）。unlock 需同线程，否则抛异常（C 正确）。D 错误：watchdog 仅在锁未被主动 unlock 且连接存活时续期，客户端宕机后锁会随过期自动释放，并非永远不释放。", "kaodian": "AI后端能力-高并发与中间件层-Redisson"}, {"no": 2, "type": "multi", "body": "Spring 事务传播行为中，下列说法正确的有？", "code": "@Transactional(propagation = Propagation.REQUIRED)\n@Transactional(propagation = Propagation.REQUIRES_NEW)", "options": [{"k": "A", "t": "REQUIRES_NEW：总是挂起当前事务，新建独立事务，内外事务互不影响"}, {"k": "B", "t": "REQUIRED 内方法抛异常，只要外层 catch 住就不会回滚"}, {"k": "C", "t": "REQUIRES_NEW 的内层事务提交/回滚独立于外层"}, {"k": "D", "t": "REQUIRED：若当前存在事务则加入，否则新建事务"}], "answer": ["A", "C", "D"], "explain": "REQUIRED 无则建、有则加入（D 正确）。REQUIRES_NEW 挂起外层、新建独立事务，内外互不影响（A、C 正确）。B 错误：REQUIRED 下内层抛异常默认会标记整个事务（含外层）回滚，即使外层 catch，若已标记 rollback-only 仍会回滚并抛 UnexpectedRollbackException。", "kaodian": "AI后端能力-应用框架层-Spring事务传播"}, {"no": 3, "type": "multi", "body": "Kafka 消费者实现『可靠消费、不丢不重』，下列做法正确的有？", "code": "// 关闭自动提交，处理成功后手动同步提交\nprops.put(\"enable.auto.commit\", \"false\");\n// 消费者\ntry { process(records); consumer.commitSync(); }\ncatch (Exception e) { /* 不提交，触发重平衡重投 */ }", "options": [{"k": "A", "t": "auto.commit=true 最可靠，无需手动处理"}, {"k": "B", "t": "位移提交与业务处理在同一事务边界，保证『处理成功才提交』"}, {"k": "C", "t": "关闭 enable.auto.commit，业务处理成功后手动 commitSync"}, {"k": "D", "t": "开启幂等生产者 + 消费者做幂等去重（如按 offset/业务唯一键）来防止重复"}], "answer": ["B", "C", "D"], "explain": "可靠消费：① 关自动提交，处理成功再手动提交位移（C 正确）；② 消费端做幂等（因重平衡/重试可能重复，D 正确）；③ 位移与业务在同一边界（B 正确）。A 错误：自动提交可能在业务失败前已提交，导致丢消息。", "kaodian": "AI后端能力-高并发与中间件层-Kafka消费位移与提交"}, {"no": 4, "type": "multi", "body": "Vue3 中会导致『响应式丢失』的写法有？", "code": "const state = reactive({ count: 0 });\nlet { count } = state;          // 解构成基本类型\nconst plain = { ...state };     // 展开\nconst arr = reactive([1, 2]);\nconst a = arr[0];               // 取基本类型元素", "options": [{"k": "A", "t": "直接 state.count++ 会丢失响应式"}, {"k": "B", "t": "对 reactive 对象解构/展开拿到基本类型后再修改，原对象不更新"}, {"k": "C", "t": "用 toRefs(state) 解构后修改，响应式保持"}, {"k": "D", "t": "从 reactive 数组取出基本类型元素 a 后改 a，数组不更新"}], "answer": ["B", "D"], "explain": "reactive 对象经解构/展开得到基本类型（count、plain.count）后，它们脱离了 Proxy，修改不会触发更新（B 正确）；从 reactive 数组取基本类型元素同理（D 正确）。C 的 toRefs 返回的是 ref，保持响应；A 直接改 state.count 正常响应。", "kaodian": "AI前端能力-语言与运行时-Vue3响应式丢失"}, {"no": 5, "type": "multi", "body": "解决浏览器跨域的常用方案有？", "code": "// 方案A：后端 CORS\nresponse.setHeader(\"Access-Control-Allow-Origin\", \"https://a.com\");\n// 方案B：开发代理\nserver.proxy = { '/api': { target: 'http://b.com', changeOrigin: true } };\n// 方案C：JSONP（仅 GET）", "options": [{"k": "A", "t": "后端配置 CORS 响应头允许指定源"}, {"k": "B", "t": "开发环境用 Vite/webpack devServer 代理转发，绕过同源限制"}, {"k": "C", "t": "把前端和后端部署到同一域名/端口下同源"}, {"k": "D", "t": "跨域是服务端限制，前端无法做任何处理"}], "answer": ["A", "B", "C"], "explain": "跨域是浏览器同源策略，解决方案：① 后端 CORS 头（A）；② 开发代理（devServer proxy 把请求转发到同源后端，B）；③ 部署同源（C）。D 错误，前端可通过代理、JSONP 等方式缓解。", "kaodian": "AI前端能力-网络与BFF架构-跨域解决方案"}, {"no": 6, "type": "multi", "body": "自动化用例出现 flaky（时过时败），有效的治理手段有？", "code": "# 现象：同一用例本地绿、CI 红，无代码改动\n# 排查方向\n- 依赖全局状态/测试顺序\n- 依赖真实外部服务响应时间\n- 数据未隔离（共用库）", "options": [{"k": "A", "t": "对外部依赖使用测试替身（Mock/Stub）或容器化隔离，固定响应"}, {"k": "B", "t": "每用例前用独立测试数据并清理，避免脏数据串扰"}, {"k": "C", "t": "直接把 flaky 用例标记为『忽略』或提高重试次数掩盖问题"}, {"k": "D", "t": "保证用例独立性：无依赖顺序、不共享可变全局状态"}], "answer": ["A", "B", "D"], "explain": "flaky 根因多为用例不独立、依赖不稳定外部服务、数据未隔离。治理：① 用例独立无顺序依赖（D）；② 外部依赖用替身/容器固定（A）；③ 数据隔离与清理（B）。C 只是掩盖，不治本。", "kaodian": "AI质量保障-自动化测试-flaky用例治理"}, {"no": 7, "type": "multi", "body": "测试替身（Test Double）的常见分类包括？", "code": "// Dummy：仅占位\n// Stub：返回预设值\n// Mock：验证调用行为\n// Spy：部分真实+部分打桩\n// Fake：轻量可用实现（如内存数据库）", "options": [{"k": "A", "t": "Mock（断言方法是否被按预期调用）"}, {"k": "B", "t": "Fake（如内存版数据库的可运行简化实现）"}, {"k": "C", "t": "Dummy（占位对象，满足编译/参数，不真正使用）"}, {"k": "D", "t": "Stub（返回预设响应，不验证交互）"}], "answer": ["A", "B", "C", "D"], "explain": "测试替身五类：Dummy 占位、Stub 预置返回值、Mock 验证交互行为、Spy 部分真实部分打桩、Fake 可运行的简化实现（如 H2 内存库）。题干列出的均属标准分类，全选。", "kaodian": "AI质量保障-自动化测试-测试替身分类"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "Spring 中 @Async 标注的方法，若被同一个 Bean 内部其它方法直接调用，异步依然会生效。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "@Async 基于 AOP 代理，同类内部调用（this.xxx()）绕过代理，不会提交到线程池，实际仍是同步执行。需跨 Bean 调用或自注入代理对象才能异步。", "kaodian": "AI后端能力-应用框架层-Spring异步失效"}, {"no": 2, "type": "judge", "body": "Vue3 模板中 v-for 的优先级高于 v-if，二者同元素时应避免混用。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Vue3 中 v-for 优先级高于 v-if（与 Vue2 相反）。同元素混用会导致 v-if 无法访问 v-for 变量且每轮重复判断，应改用 template 包裹或 computed 过滤。", "kaodian": "AI前端能力-语言与运行时-Vue3模板编译"}, {"no": 3, "type": "judge", "body": "浏览器的同源策略限制跨域访问，但服务端之间不存在同源限制，可自由互调。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "同源策略是浏览器的安全限制，约束的是『浏览器中运行的脚本』对跨源资源的访问。服务端到服务端的 HTTP 调用不受此限制（除非自身做鉴权/防火墙）。这也是为何前端常用 devServer 代理把跨域变同源。", "kaodian": "AI前端能力-网络与BFF架构-同源策略"}, {"no": 4, "type": "judge", "body": "用 AI 生成测试用例时，AI 给出的『预期结果』可直接作为断言依据，无需人工复核。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "AI 可能臆造或误解需求，给出错误的预期结果；直接断言会造成假阳性（用例绿但期望错）。预期结果必须人工或对照规格复核后再入断言。这是 AI 辅助测试的基本纪律。", "kaodian": "AI质量保障-AI辅助测试-AI生成用例复核"}, {"no": 5, "type": "judge", "body": "回归测试是指软件修改后，重新执行已有测试用例以确认改动没有引入新缺陷。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "回归测试（Regression Testing）定义：在代码变更（修复、新增、重构）后，重跑已有用例，确认旧功能未被破坏、未引入新缺陷。是持续集成中不可或缺的一环。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归测试定义"}, {"no": 6, "type": "judge", "body": "Playwright 用例之间可以共享可变状态，依赖执行顺序是允许的做法。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "用例应相互独立、不依赖执行顺序、不共享可变状态，否则会出现隐性耦合与不稳定（flaky）。", "kaodian": "AI质量保障-自动化测试-用例独立性"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
