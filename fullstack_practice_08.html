<script type="application/json" id="quizData">{"id": "vol08", "title": "全栈转型模拟自测卷", "sub": "可答题 · 交卷判分 · 自动记录错题", "meta": "对齐公司真实考法：<b>单选 / 多选 / 判断</b>，每题包含完整代码场景，问执行结果、补全代码、判断框架用法正误。<br>本卷共 <b>33 题</b>：单选 20（60 分）+ 多选 7（28 分）+ 判断 6（12 分）= 100 分。<br>难度：<b>实战细节型</b>，考点标签采用公司标准层级命名。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "以下金额计算代码的输出是？", "code": "BigDecimal a = new BigDecimal(0.1);\nBigDecimal b = BigDecimal.valueOf(0.1);\nSystem.out.println(a.equals(b));\nSystem.out.println(a.compareTo(b) == 0);", "options": [{"k": "A", "t": "true / true"}, {"k": "B", "t": "false / false"}, {"k": "C", "t": "false / true"}, {"k": "D", "t": "true / false"}], "answer": ["B"], "explain": "<code>new BigDecimal(0.1)</code> 接收的是 double 的<b>二进制近似值</b>（0.1000000000000000055511…），而 <code>BigDecimal.valueOf(0.1)</code> 内部走 <code>Double.toString</code> 得到精确的 \"0.1\"。两者数值本身就不相等，所以 equals 和 compareTo 都判不相等。金额务必用 <code>new BigDecimal(\"0.1\")</code> 字符串构造或 valueOf。另注意：即使数值相等，equals 还比较标度（scale），<code>new BigDecimal(\"1.0\")</code> 与 <code>new BigDecimal(\"1\")</code> equals 为 false、compareTo 为 0。", "android": "和 Android 里做支付/账单不用 float/double、改用分为单位的 long 或 BigDecimal 是同一个坑。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 响应式"}, {"no": 2, "type": "single", "body": "利用 LinkedHashMap 实现 LRU。以下代码输出的 key 顺序是？", "code": "Map<String, Integer> m = new LinkedHashMap<>(16, 0.75f, true); // accessOrder=true\nm.put(\"a\", 1);\nm.put(\"b\", 2);\nm.put(\"c\", 3);\nm.get(\"a\");\nm.put(\"d\", 4);\nSystem.out.println(m.keySet());", "options": [{"k": "A", "t": "[a, b, c, d]"}, {"k": "B", "t": "[b, c, a, d]"}, {"k": "C", "t": "[d, a, c, b]"}, {"k": "D", "t": "[a, d, c, b]"}], "answer": ["B"], "explain": "第三个构造参数 <code>accessOrder=true</code> 表示按<b>访问顺序</b>排列：每次 get/put 命中都会把该节点移到链表尾部。<code>get(\"a\")</code> 后顺序变为 b→c→a，再 put d 追加到尾部，得 [b, c, a, d]。配合重写 <code>removeEldestEntry</code> 即可实现容量淘汰的 LRU 缓存。", "android": "Android 的 <code>LruCache</code>（图片内存缓存）内部就是靠 accessOrder=true 的 LinkedHashMap 实现的。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 数据结构选型"}, {"no": 3, "type": "single", "body": "类 C 同时实现两个含同名 default 方法的接口，以下代码的结果是？", "code": "interface A { default String hi() { return \"A\"; } }\ninterface B { default String hi() { return \"B\"; } }\nclass C implements A, B { }", "options": [{"k": "A", "t": "编译通过，调用 hi() 输出 \"A\"（按 implements 声明顺序取第一个）"}, {"k": "B", "t": "编译通过，调用 hi() 输出 \"B\"（后者覆盖前者）"}, {"k": "C", "t": "编译错误，C 必须重写 hi() 解决冲突"}, {"k": "D", "t": "编译通过，运行时抛 IncompatibleClassChangeError"}], "answer": ["C"], "explain": "两个接口的 default 方法签名冲突（菱形问题），编译器无法决定继承哪个，直接<b>编译错误</b>。C 必须重写 <code>hi()</code>，重写时可用 <code>A.super.hi()</code> 显式指定复用某个接口的实现。", "android": "Kotlin 接口默认方法冲突时同样强制 override，并用 <code>super&lt;A&gt;.hi()</code> 指定，规则一致。", "kaodian": "AI 后端能力 - 框架与容器层 - 接口 default 方法"}, {"no": 4, "type": "single", "body": "以下 Stream 代码执行后，控制台输出什么？", "code": "Stream.of(1, 2, 3)\n      .filter(n -> {\n          System.out.println(\"filter: \" + n);\n          return n > 1;\n      });", "options": [{"k": "A", "t": "filter: 1 / filter: 2 / filter: 3"}, {"k": "B", "t": "filter: 2 / filter: 3"}, {"k": "C", "t": "什么都不输出"}, {"k": "D", "t": "抛 IllegalStateException"}], "answer": ["C"], "explain": "filter/map/peek 都是<b>中间操作</b>，是惰性求值的——只有遇到 <code>collect/forEach/count</code> 等<b>终结操作</b>时整条流水线才会真正执行。这里没有终结操作，lambda 一次都不会跑，控制台无输出。排查“Stream 里的日志怎么没打”时先看有没有终结操作。", "android": "和 Kotlin 的 <code>Sequence</code> 一样惰性：只写 <code>asSequence().map{...}</code> 不加 toList() 就什么都不执行。", "kaodian": "AI 后端能力 - 语言基础层 - Java 集合/基础"}, {"no": 5, "type": "single", "body": "定时任务每 1 秒调度一次，但任务本身耗时 2 秒。关于 scheduleAtFixedRate 的实际行为，正确的是？", "code": "ScheduledExecutorService ses = Executors.newSingleThreadScheduledExecutor();\nses.scheduleAtFixedRate(task, 0, 1, TimeUnit.SECONDS); // task 每次耗时 2 秒", "options": [{"k": "A", "t": "任务会并发重叠执行，同时有多个 task 在跑"}, {"k": "B", "t": "上一次执行结束后立即开始下一次，实际间隔约 2 秒，不会并发重叠"}, {"k": "C", "t": "严格每 1 秒触发一次，来不及执行的任务被直接丢弃"}, {"k": "D", "t": "第二次调度时抛 RejectedExecutionException"}], "answer": ["B"], "explain": "<code>scheduleAtFixedRate</code> 保证<b>同一任务不会并发执行</b>：若单次耗时超过周期，下一次会在上一次结束后立刻补跑（间隔被拉长为 2s），不会重叠也不会丢弃。而 <code>scheduleWithFixedDelay</code> 是“上一次结束后再等 delay 秒”，实际间隔 = 执行时间 + delay。任务耗时不稳定、怕挤压时选 fixedDelay。", "android": "类似 Handler <code>postDelayed</code> 递归自调（fixedDelay 语义）和固定 rate 的 Timer 的区别。", "kaodian": "AI 后端能力 - 框架与容器层 - Spring 事务调度"}, {"no": 6, "type": "single", "body": "调用以下方法 f(1)，程序会发生什么？", "code": "public int f(int n) {\n    return f(n + 1); // 没有终止条件\n}", "options": [{"k": "A", "t": "抛 OutOfMemoryError: Java heap space"}, {"k": "B", "t": "抛 StackOverflowError"}, {"k": "C", "t": "死循环，一直运行不报错"}, {"k": "D", "t": "编译错误：递归缺少终止条件"}], "answer": ["B"], "explain": "每次方法调用都在<b>虚拟机栈</b>压入一个栈帧，无限递归很快耗尽线程栈（默认约 512KB~1MB，由 -Xss 控制），抛 <code>StackOverflowError</code>。区分三类：堆放不下对象 → heap OOM；类元数据过多 → Metaspace OOM；栈帧过深 → StackOverflowError。编译器不检查递归终止条件。", "android": "Android 上 View 层级里 onMeasure 互相递归触发的也是 StackOverflowError，不是 OOM。", "kaodian": "AI 后端能力 - 语言基础层 - Java 基础"}, {"no": 7, "type": "single", "body": "Spring 事件机制。调用 register() 后，默认情况下控制台输出顺序是？", "code": "@Component\nclass UserService {\n    @Autowired ApplicationEventPublisher publisher;\n    public void register() {\n        System.out.println(\"1\");\n        publisher.publishEvent(new UserRegisteredEvent(this));\n        System.out.println(\"3\");\n    }\n}\n\n@Component\nclass EmailListener {\n    @EventListener\n    public void on(UserRegisteredEvent e) { System.out.println(\"2\"); }\n}", "options": [{"k": "A", "t": "1 3 2（监听器异步执行）"}, {"k": "B", "t": "1 2 3（监听器同步执行，在同一线程内）"}, {"k": "C", "t": "只输出 1 3，监听器不会触发"}, {"k": "D", "t": "输出顺序不确定"}], "answer": ["B"], "explain": "Spring 事件<b>默认是同步的</b>：publishEvent 会在当前线程内依次调用所有监听器，监听器执行完才返回，所以顺序是 1→2→3。且默认与发布方处于同一事务上下文，监听器抛异常会导致 register() 一起失败。要异步需在监听方法加 <code>@Async</code>（并 @EnableAsync）。", "android": "类似 EventBus 默认 POSTING 模式——在发送者线程同步回调，想切线程要指定 threadMode。", "kaodian": "AI 后端能力 - 框架与容器层 - 异步与线程池"}, {"no": 8, "type": "single", "body": "Spring Boot 条件装配如下，而配置文件中没有配置 feature.sms.enabled。结果是？", "code": "@Configuration\nclass SmsConfig {\n    @Bean\n    @ConditionalOnProperty(name = \"feature.sms.enabled\",\n                           havingValue = \"true\",\n                           matchIfMissing = false)\n    public SmsService smsService() { return new SmsService(); }\n}\n\n@Service\nclass OrderService {\n    @Autowired SmsService smsService; // 强依赖注入\n}", "options": [{"k": "A", "t": "SmsService 正常注册，应用正常启动"}, {"k": "B", "t": "SmsService 不注册，启动时因注入失败报 NoSuchBeanDefinitionException"}, {"k": "C", "t": "SmsService 注册但 smsService 字段为 null"}, {"k": "D", "t": "启动报错：缺少必需配置项 feature.sms.enabled"}], "answer": ["B"], "explain": "<code>matchIfMissing=false</code> 表示配置项<b>缺失时条件不成立</b>，Bean 不注册。而 OrderService 用 @Autowired 强依赖它，容器启动装配时找不到 Bean，抛 NoSuchBeanDefinitionException（表现为 required a bean of type ... that could not be found）。解法：配置该属性、matchIfMissing=true、或改为 <code>@Autowired(required=false)</code> / <code>ObjectProvider</code> 弱依赖。", "android": "类似 Dagger/Hilt 中 Module 没 provide 某依赖，编译期/启动期直接报 MissingBinding。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 组件通信"}, {"no": 9, "type": "single", "body": "MyBatis-Plus 条件构造器。当 name 为空字符串时，最终生成的 SQL 的 WHERE 条件是？", "code": "String name = \"\"; // 前端未填写\nLambdaQueryWrapper<User> qw = new LambdaQueryWrapper<>();\nqw.like(StringUtils.isNotBlank(name), User::getName, name)\n  .eq(User::getStatus, 1);\nuserMapper.selectList(qw);", "options": [{"k": "A", "t": "WHERE name LIKE '%%' AND status = 1"}, {"k": "B", "t": "WHERE status = 1"}, {"k": "C", "t": "WHERE name LIKE '%' AND status = 1"}, {"k": "D", "t": "抛异常：like 的值不能为空"}], "answer": ["B"], "explain": "wrapper 条件方法的第一个 boolean 参数是 <b>condition</b>：为 false 时该条件<b>直接不拼入 SQL</b>。isNotBlank(\"\") 为 false，like 被跳过，只剩 <code>status = 1</code>。这是 MP 替代 MyBatis <code>&lt;if test&gt;</code> 动态 SQL 的惯用写法，避免空串导致 <code>LIKE '%%'</code> 全表匹配。", "android": "类似构建 Room 动态查询时按参数是否为空拼 WHERE 片段，空条件直接不加。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis-Plus Wrapper"}, {"no": 10, "type": "single", "body": "表 t 上有联合索引 idx(a, b)。以下两条 SQL，哪条 EXPLAIN 会出现 Using filesort？", "code": "-- SQL1\nSELECT * FROM t WHERE a = 1 ORDER BY b;\n-- SQL2\nSELECT * FROM t WHERE a > 1 ORDER BY b;", "options": [{"k": "A", "t": "两条都不会"}, {"k": "B", "t": "两条都会"}, {"k": "C", "t": "SQL1 不会，SQL2 会"}, {"k": "D", "t": "SQL1 会，SQL2 不会"}], "answer": ["C"], "explain": "联合索引 (a,b) 中，b 只在 <b>a 相同的分组内</b>有序。SQL1 中 a 是等值条件，命中的记录内 b 天然有序，可直接按索引顺序返回，无需排序；SQL2 中 a 是范围条件，跨越多个 a 值，b 在整体上无序，MySQL 必须额外排序 → <code>Using filesort</code>。这是「等值可以利用后续列排序、范围会中断」的典型考法。", "android": "类似 SQLite 里 ORDER BY 能否走索引免排序的规则，范围扫描后排序列就失去有序性。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 索引与最左前缀"}, {"no": 11, "type": "single", "body": "两张表数据如下，执行 LEFT JOIN 后结果集共几行？", "code": "-- dept: id = 1, 2, 3\n-- emp:  id=101 dept_id=1, id=102 dept_id=1, id=103 dept_id=2\nSELECT d.id, e.id\nFROM dept d LEFT JOIN emp e ON d.id = e.dept_id;", "options": [{"k": "A", "t": "3 行"}, {"k": "B", "t": "4 行"}, {"k": "C", "t": "5 行"}, {"k": "D", "t": "6 行"}], "answer": ["B"], "explain": "LEFT JOIN 以左表为基准：dept 1 匹配 2 个员工 → 2 行；dept 2 匹配 1 个 → 1 行；dept 3 无匹配，<b>仍保留 1 行</b>（e.id 为 NULL）。共 2+1+1=4 行。注意两点：左表一行可因多匹配“膨胀”成多行；若把对右表的过滤写在 WHERE（如 <code>WHERE e.status=1</code>）会把 NULL 行过滤掉、退化成 INNER JOIN，应写在 ON 里。", "android": "和 Room @Relation 一对多展开后行数膨胀是一回事，统计时要先去重再 count。", "kaodian": "AI 后端能力 - 数据库与ORM层 - JOIN 语义"}, {"no": 12, "type": "single", "body": "Redis 作为纯缓存使用（所有 key 都允许被淘汰），内存达到 maxmemory 后希望优先淘汰最久未访问的 key。应配置哪种淘汰策略？", "code": "maxmemory 2gb\nmaxmemory-policy ?", "options": [{"k": "A", "t": "noeviction"}, {"k": "B", "t": "volatile-lru"}, {"k": "C", "t": "allkeys-lru"}, {"k": "D", "t": "allkeys-random"}], "answer": ["C"], "explain": "<code>allkeys-lru</code> 在<b>全部 key</b> 范围内按 LRU（近似）淘汰，最适合纯缓存场景。<code>volatile-lru</code> 只淘汰<b>设置了过期时间</b>的 key——若大量 key 没设 TTL，内存满时会退化成写入报错；<code>noeviction</code>（默认）内存满直接拒绝写命令；random 不考虑访问热度，命中率差。", "android": "和 Glide/LruCache 的内存上限+LRU 淘汰是同一思想，只是作用在缓存中间件层。", "kaodian": "AI 后端能力 - 语言基础层 - 并发与 volatile"}, {"no": 13, "type": "single", "body": "RabbitMQ 消费端做了如下设置（手动 ack）。basicQos(1) 的作用是？", "code": "channel.basicQos(1);\nchannel.basicConsume(queue, false /* autoAck=false */, consumer);", "options": [{"k": "A", "t": "限制该队列最多只能存 1 条消息"}, {"k": "B", "t": "消费者有 1 条消息未 ack 时，Broker 不再向它推送新消息，实现“能者多劳”的公平分发"}, {"k": "C", "t": "消息最多重试 1 次，之后进入死信队列"}, {"k": "D", "t": "每秒最多消费 1 条消息（限速）"}], "answer": ["B"], "explain": "<code>basicQos(prefetchCount)</code> 限制的是<b>未确认消息的最大数量</b>。默认 RabbitMQ 会把消息轮询平均预推给所有消费者，处理慢的消费者会积压大量未处理消息；设为 1 后，谁先 ack 谁才拿下一条，快的消费者自然消费更多，避免消息在慢消费者本地堆积。它不是队列容量、不是重试次数、也不是按时间的限速。", "android": "类似线程池用有界队列做背压：下游没消化完就不继续塞任务。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Kafka 分区消费"}, {"no": 14, "type": "single", "body": "以下 JavaScript 代码的输出是？", "code": "const arr = [10, 1, 5, 2];\narr.sort();\nconsole.log(arr);", "options": [{"k": "A", "t": "[1, 2, 5, 10]"}, {"k": "B", "t": "[1, 10, 2, 5]"}, {"k": "C", "t": "[10, 5, 2, 1]"}, {"k": "D", "t": "[10, 1, 5, 2]（sort 不改变原数组）"}], "answer": ["B"], "explain": "不传比较函数时，<code>sort()</code> 会把元素<b>转成字符串后按 Unicode 码位排序</b>：\"10\" &lt; \"2\"，所以得到 [1, 10, 2, 5]。数值排序必须传比较器 <code>arr.sort((a, b) =&gt; a - b)</code>。另外 sort 是<b>原地排序</b>，会修改原数组并返回同一引用。", "android": "Java 的 <code>Collections.sort</code> 对 Integer 是数值序，JS 默认却是字符串序——从 Android 转前端最容易踩的排序坑。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 执行结果"}, {"no": 15, "type": "single", "body": "以下代码的输出是？", "code": "const obj = { a: undefined, b: function () {}, c: NaN, d: 1 };\nconsole.log(JSON.stringify(obj));", "options": [{"k": "A", "t": "{\"a\":null,\"b\":null,\"c\":null,\"d\":1}"}, {"k": "B", "t": "{\"c\":null,\"d\":1}"}, {"k": "C", "t": "{\"c\":NaN,\"d\":1}"}, {"k": "D", "t": "抛 TypeError：undefined 无法序列化"}], "answer": ["B"], "explain": "<code>JSON.stringify</code> 序列化对象属性时：值为 <b>undefined 或函数的属性会被直接丢弃</b>（数组中则变 null）；<b>NaN/Infinity 会变成 null</b>（JSON 规范没有这些字面量）。所以输出 {\"c\":null,\"d\":1}。接口传参前打印一下序列化结果，可避免“字段莫名丢失”的联调问题。", "android": "Gson 默认也会跳过 null 字段（除非 serializeNulls），联调时“字段没传过去”常是序列化规则问题。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Redis 序列化"}, {"no": 16, "type": "single", "body": "导航栏样式如下。关于 position: sticky 的行为，正确的是？", "code": ".nav {\n    position: sticky;\n    top: 0;\n}", "options": [{"k": "A", "t": "等价于 fixed，始终固定在视口顶部"}, {"k": "B", "t": "未滚动到阈值前表现如常规流（类似 relative），滚动到距视口顶部 0 时吸附固定，且不会超出其父容器范围"}, {"k": "C", "t": "等价于 absolute，相对最近的定位祖先偏移"}, {"k": "D", "t": "必须配合 JS 监听 scroll 事件才能生效"}], "answer": ["B"], "explain": "sticky 是 relative 与 fixed 的混合体：正常时占据文档流位置随页面滚动，达到 <code>top/bottom</code> 等阈值后吸附；当<b>父容器滚出视口时它会跟着离开</b>（吸附范围被限制在父容器内）。常见失效原因：没设置 top 等阈值、祖先元素有 <code>overflow: hidden/auto</code>。纯 CSS 实现，无需 JS。", "android": "类似 RecyclerView 的吸顶效果（StickyHeader）/ CoordinatorLayout 折叠吸附，但 CSS 一行搞定。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 索引失效"}, {"no": 17, "type": "single", "body": "Vue 用 keep-alive 缓存标签页组件。从 TabA 切到 TabB 再切回 TabA 时，TabA 触发的生命周期是？", "code": "<keep-alive>\n  <component :is=\"currentTab\" />\n</keep-alive>", "options": [{"k": "A", "t": "重新走 created/mounted（组件被销毁重建）"}, {"k": "B", "t": "只触发 activated（组件实例被缓存，未销毁重建）"}, {"k": "C", "t": "触发 updated"}, {"k": "D", "t": "什么钩子都不触发"}], "answer": ["B"], "explain": "<code>keep-alive</code> 会缓存内部组件实例：切走时组件<b>不销毁</b>（触发 deactivated 而非 unmounted），切回时<b>不重建</b>（触发 activated 而非 created/mounted），组件内的表单输入、滚动位置等状态得以保留。需要在重新显示时刷新数据，应写在 activated 钩子里；可用 include/max 控制缓存范围与数量。", "android": "等价于 ViewPager 的 offscreenPageLimit 保留 Fragment 实例：切回时走 onResume 而不是重新 onCreate。", "kaodian": "AI 后端能力 - 框架与容器层 - Bean 生命周期"}, {"no": 18, "type": "single", "body": "关于 HTTP/2 相对 HTTP/1.1 的核心改进，下列说法正确的是？", "code": null, "options": [{"k": "A", "t": "HTTP/2 改用纯文本协议，可读性更好"}, {"k": "B", "t": "多路复用允许在单个 TCP 连接上并行交错传输多个请求/响应，解决了 HTTP/1.1 的队头阻塞（应用层）"}, {"k": "C", "t": "HTTP/2 要求浏览器对同一域名建立至少 6 个 TCP 连接"}, {"k": "D", "t": "HTTP/2 废弃了状态码和 Header"}], "answer": ["B"], "explain": "HTTP/2 采用<b>二进制分帧</b>，多个流（stream）在一条 TCP 连接上交错传输，实现多路复用，不再需要 HTTP/1.1 时代“同域 6 连接 + 雪碧图/域名分片”等优化手段；还带来 HPACK 头部压缩、服务器推送。注意：TCP 层的队头阻塞仍存在（丢包会阻塞整条连接），这正是 HTTP/3 改用 QUIC(UDP) 的原因。", "android": "OkHttp 对 HTTPS 默认协商 HTTP/2，同一 host 的并发请求复用一条连接，抓包能看到只有一个 socket。", "kaodian": "AI 后端能力 - 数据库与ORM层 - SQL 优化手段"}, {"no": 19, "type": "single", "body": "以下代码的输出是？", "code": "console.log(typeof foo);\nconsole.log(typeof bar);\n\nfunction foo() {}\nvar bar = function () {};", "options": [{"k": "A", "t": "function / function"}, {"k": "B", "t": "function / undefined"}, {"k": "C", "t": "undefined / undefined"}, {"k": "D", "t": "抛 ReferenceError"}], "answer": ["B"], "explain": "<b>函数声明</b>（function foo(){}）整体提升——声明和函数体都提前到作用域顶部，所以 typeof foo 是 \"function\"；<b>函数表达式</b>只提升变量名 bar（var 提升后值为 undefined），赋值留在原地，所以 typeof bar 是 \"undefined\"。若 bar 用 let/const 声明，则处于暂时性死区，typeof 会直接抛 ReferenceError。", "android": "Java/Kotlin 没有提升概念，方法在类加载时就完整可用——JS 的两种函数定义方式行为差异要单独记。", "kaodian": "AI 后端能力 - 框架与容器层 - Bean 作用域"}, {"no": 20, "type": "single", "body": "服务器对该请求返回了 404。以下 fetch 代码的输出是？", "code": "fetch('/api/not-exist')\n  .then(res => console.log('then', res.ok, res.status))\n  .catch(() => console.log('catch'));", "options": [{"k": "A", "t": "catch"}, {"k": "B", "t": "then false 404"}, {"k": "C", "t": "then true 404"}, {"k": "D", "t": "什么都不输出"}], "answer": ["B"], "explain": "fetch 的 Promise <b>只在网络层失败</b>（断网、DNS 失败、CORS 拦截）时才 reject；只要收到了 HTTP 响应——哪怕是 404/500——都会走 then。需要用 <code>res.ok</code>（status 在 200-299 才为 true）自行判断并抛错。这是 fetch 与 axios 的关键差异：axios 默认对非 2xx 直接 reject 进 catch。", "android": "OkHttp 同样如此：onResponse 里 404 也算“成功回调”，要自己查 <code>response.isSuccessful()</code>。", "kaodian": "AI 前端能力 - 工程化与网络 - CORS 跨域"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "Kafka 单机就能支撑数十万 TPS。下列哪些是 Kafka 高吞吐的关键设计？（多选、少选、错选均不得分）", "code": null, "options": [{"k": "A", "t": "消息在分区内顺序追加写磁盘，并充分利用操作系统页缓存"}, {"k": "B", "t": "消费端使用 sendfile 零拷贝，数据不经过用户态直接从页缓存发到网卡"}, {"k": "C", "t": "生产者按 batch.size/linger.ms 批量发送，并支持压缩（lz4/zstd 等）"}, {"k": "D", "t": "每条消息写入后都立即执行 fsync 强制刷盘，以此提升吞吐"}], "answer": ["A", "B", "C"], "explain": "A/B/C 是 Kafka 高吞吐三板斧：<b>顺序写 + 页缓存</b>让磁盘写接近内存速度；<b>零拷贝</b>省去内核态↔用户态来回拷贝；<b>批量 + 压缩</b>摊薄网络与 IO 开销。D 说反了——Kafka 默认<b>依赖页缓存异步刷盘</b>，靠多副本（replication）而不是每条 fsync 保证可靠性，每条都 fsync 会把吞吐拉垮。", "android": "顺序写+批量的思路和客户端日志 SDK 先写内存缓冲、攒批落盘再上报是一样的。", "kaodian": "AI 后端能力 - 框架与容器层 - 异步与线程池"}, {"no": 22, "type": "multi", "body": "关于以下 JVM 启动参数与线上调优，说法正确的有？（多选、少选、错选均不得分）", "code": "java -Xms4g -Xmx4g -Xss512k \\\n     -XX:+HeapDumpOnOutOfMemoryError \\\n     -XX:HeapDumpPath=/data/dump.hprof -jar app.jar", "options": [{"k": "A", "t": "-Xms 与 -Xmx 设为相同值，可避免堆动态扩容/收缩带来的性能抖动"}, {"k": "B", "t": "-Xss 设置每个线程的栈大小，调小它可以支持创建更多线程"}, {"k": "C", "t": "-Xmx 同时限制了 Metaspace 的上限"}, {"k": "D", "t": "-XX:+HeapDumpOnOutOfMemoryError 会在发生堆 OOM 时自动导出堆转储文件，便于事后用 MAT 分析"}], "answer": ["A", "B", "D"], "explain": "A 正确：初始堆=最大堆是服务端常规做法，省去运行期扩容的 GC 停顿。B 正确：栈大小与可创建线程数近似成反比。C 错误：Metaspace 在<b>本地内存</b>中，由 <code>-XX:MaxMetaspaceSize</code> 单独控制，与 -Xmx 无关。D 正确：这是线上 OOM 事后定位的标配参数，dump 文件可用 MAT/JProfiler 分析大对象与引用链。", "android": "相当于 Android 的 largeHeap+LeakCanary 组合：既控内存参数，又留出 OOM 现场分析手段。", "kaodian": "AI 后端能力 - 语言基础层 - JVM 内存模型"}, {"no": 23, "type": "multi", "body": "关于 Redis 事务（MULTI/EXEC）、pipeline 与 Lua 脚本，说法正确的有？（多选、少选、错选均不得分）", "code": "MULTI\nINCR stock\nLPUSH log \"deduct\"\nEXEC", "options": [{"k": "A", "t": "MULTI/EXEC 中某条命令执行时出错（如对 string 执行 LPUSH），其余命令仍会执行，Redis 不支持回滚"}, {"k": "B", "t": "pipeline 一次性打包发送多条命令，减少网络往返（RTT），但不保证这批命令原子执行"}, {"k": "C", "t": "Lua 脚本在 Redis 服务端原子执行，执行期间不会插入其他客户端的命令"}, {"k": "D", "t": "MULTI/EXEC 与 MySQL 事务一样，出错时可通过 ROLLBACK 回滚已执行的命令"}], "answer": ["A", "B", "C"], "explain": "A 正确：EXEC 后某条命令运行期出错只影响那一条，<b>已执行的不回滚</b>——Redis 作者认为回滚复杂且错误通常是编程错误。B 正确：pipeline 是纯客户端优化，命令之间可能插入其他客户端命令。C 正确：Lua 是 Redis 中实现“检查再执行”类原子逻辑（如分布式锁释放）的标准手段。D 错误：Redis 没有 ROLLBACK 能力（DISCARD 只能取消尚未 EXEC 的队列）。", "android": "SQLite 有真事务可回滚，Redis 的 MULTI 只是“命令打包”，语义完全不同，别混淆。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 分布式锁"}, {"no": 24, "type": "multi", "body": "支付回调接口可能被第三方重复通知多次。为保证接口幂等（重复调用不产生副作用），下列做法正确的有？（多选、少选、错选均不得分）", "code": "POST /pay/notify\n{ \"notifyId\": \"N20260728001\", \"orderNo\": \"O1001\", \"status\": \"SUCCESS\" }", "options": [{"k": "A", "t": "利用数据库唯一索引（如 notifyId 唯一约束），重复插入直接失败"}, {"k": "B", "t": "处理前用 Redis SET notifyId NX EX 或先查处理记录表，已处理过的通知直接返回成功"}, {"k": "C", "t": "更新订单时带状态机条件：UPDATE orders SET status='PAID' WHERE order_no=? AND status='UNPAID'，影响行数为 0 说明已处理过"}, {"k": "D", "t": "与第三方约定“只通知一次”，服务端无需做任何幂等处理"}], "answer": ["A", "B", "C"], "explain": "A（唯一索引兜底）、B（防重表/Redis 去重）、C（状态机条件更新）是幂等三件套，实战常组合使用：B 挡住大部分重复，A/C 做最终兜底。D 错误：网络超时重试是必然存在的，<b>幂等必须由服务端保证</b>，“调用方保证只发一次”在分布式环境下不可能可靠。", "android": "类似客户端防重复提交：按钮置灰只是体验优化，服务端幂等才是底线——两端思路一致。", "kaodian": "AI 后端能力 - 框架与容器层 - AOP 环绕通知"}, {"no": 25, "type": "multi", "body": "关于浏览器渲染中的回流（reflow/重排）与重绘（repaint），说法正确的有？（多选、少选、错选均不得分）", "code": "el.style.width = '200px';      // ①\nel.style.color = 'red';        // ②\nel.style.transform = 'translateX(100px)'; // ③\nconst h = el.offsetHeight;     // ④", "options": [{"k": "A", "t": "① 修改宽高等几何属性会触发回流，回流必然伴随重绘"}, {"k": "B", "t": "② 只修改颜色等外观属性，只触发重绘、不回流"}, {"k": "C", "t": "③ transform/opacity 动画可交给合成线程处理，通常不触发回流，性能最好"}, {"k": "D", "t": "④ 读取 offsetHeight 只是读操作，任何情况下都没有性能开销"}], "answer": ["A", "B", "C"], "explain": "A、B 是回流/重绘的基本分界：几何变化（宽高、位置、增删 DOM）→ 回流+重绘；纯外观（color、background）→ 仅重绘。C 正确：transform/opacity 走合成层（compositor），是 CSS 动画性能优化首选。D 错误：读取 offsetHeight/scrollTop 等布局属性会<b>强制同步布局</b>（forced synchronous layout）——若之前有未落地的样式修改，浏览器必须立刻回流才能给出准确值，读写交替循环是典型性能杀手。", "android": "回流≈requestLayout（重走 measure/layout），重绘≈invalidate（只 draw）——概念完全对得上。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - 前端性能优化"}, {"no": 26, "type": "multi", "body": "关于优秀单元测试应遵循的 FIRST 原则，说法正确的有？（多选、少选、错选均不得分）", "code": null, "options": [{"k": "A", "t": "Fast：单元测试应该毫秒级快速执行，太慢会导致没人愿意频繁跑"}, {"k": "B", "t": "Independent：用例之间不应相互依赖，任意顺序、单独执行结果都一致"}, {"k": "C", "t": "单元测试应连接真实数据库和真实第三方接口，越接近生产环境越好"}, {"k": "D", "t": "Repeatable：在任何环境（本地/CI）重复执行，结果都应一致，不依赖网络、时间等外部不确定因素"}], "answer": ["A", "B", "D"], "explain": "FIRST = Fast、Independent、Repeatable、Self-validating（自动判断通过与否，不靠人眼看日志）、Timely（及时编写）。C 违反了 Fast 与 Repeatable：依赖真实 DB/外部接口的属于<b>集成测试</b>的职责，单元测试应用 Mock/Stub/内存实现隔离外部依赖。", "android": "对应 Android 的本地 JVM 单测（test/）要快且稳，依赖真机环境的放 androidTest/ ——分层原则相同。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 单元测试原则"}, {"no": 27, "type": "multi", "body": "下单接口返回如下响应。关于接口测试的断言与用例设计，正确的有？（多选、少选、错选均不得分）", "code": "HTTP/1.1 200 OK\n\n{ \"code\": 500, \"msg\": \"库存不足\", \"data\": null }", "options": [{"k": "A", "t": "断言不能只看 HTTP 状态码，还必须校验响应体中的业务 code 和关键字段"}, {"k": "B", "t": "HTTP 返回 200 即代表业务成功，该用例应判定为通过"}, {"k": "C", "t": "除正向用例外，还应覆盖未登录(401)/无权限(403)、参数缺失与边界值等异常场景"}, {"k": "D", "t": "用同一订单号重复提交请求，验证服务端幂等处理，也属于接口测试应覆盖的场景"}], "answer": ["A", "C", "D"], "explain": "很多后端把业务失败包在 HTTP 200 里、用业务 code 表达结果（本例 code=500 库存不足），因此断言必须<b>两层都验</b>：传输层状态码 + 业务层 code/data 关键字段，B 的判法会漏掉所有业务失败缺陷。C、D 是接口测试用例设计的标准维度：鉴权、参数边界、幂等/重复提交。", "android": "客户端开发都懂：Retrofit onResponse 成功≠业务成功，还要看 body 里的 code——测试断言同理。", "kaodian": "AI 后端能力 - 框架与容器层 - 接口幂等"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 28, "type": "judge", "body": "SimpleDateFormat 是线程安全的，可以定义为静态常量供多线程共享使用。", "code": "private static final SimpleDateFormat SDF = new SimpleDateFormat(\"yyyy-MM-dd\");\n// 多个线程并发调用 SDF.format(date) / SDF.parse(str)", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "SimpleDateFormat 内部持有一个共享的 <code>Calendar</code> 实例，format/parse 都会先 setTime 修改它，多线程并发使用会出现<b>日期错乱或直接抛 NumberFormatException</b>，且问题偶发难排查。解决：每次 new、包 ThreadLocal，或直接改用 Java 8 的 <code>DateTimeFormatter</code>（不可变、线程安全）。", "android": "Android Lint 同样会警告 SimpleDateFormat 的问题；desugar 后也推荐用 java.time。", "kaodian": "AI 质量保障 - 缺陷定位与可观测性 - 线上排障"}, {"no": 29, "type": "judge", "body": "@SpringBootApplication 是一个组合注解，等价于同时标注 @SpringBootConfiguration(@Configuration)、@EnableAutoConfiguration 和 @ComponentScan。", "code": "@SpringBootApplication\npublic class App {\n    public static void main(String[] args) {\n        SpringApplication.run(App.class, args);\n    }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "三者分工：<code>@Configuration</code> 声明配置类；<code>@EnableAutoConfiguration</code> 根据类路径依赖自动装配（Boot 的核心魔法）；<code>@ComponentScan</code> 默认扫描<b>启动类所在包及其子包</b>——这也是为什么 Bean 放到启动类的上级/平级包会扫不到。", "android": "类似一个注解顶三个的“组合注解”，和 Kotlin 里用 typealias/组合注解简化配置一个思路。", "kaodian": "AI 后端能力 - 框架与容器层 - Spring Boot 启动"}, {"no": 30, "type": "judge", "body": "Redis 命令执行是单线程的，因此生产环境可以放心执行 KEYS * 遍历所有键，不会影响其他请求。", "code": "redis-cli> KEYS *   # 库中约 2000 万个 key", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "恰恰因为命令执行是单线程，一条 O(N) 的 <code>KEYS *</code> 在千万级 key 下会执行数秒，期间<b>所有其他请求全部被阻塞</b>，线上等同于短暂宕机。应使用 <code>SCAN</code> 游标分批遍历（增量、不阻塞）。同理要警惕大 key 的 DEL、HGETALL、SMEMBERS 等 O(N) 命令（删除大 key 可用 UNLINK 异步释放）。", "android": "相当于在主线程做全量数据库扫描——单线程模型下任何耗时操作都会卡住整个服务，和 ANR 一个道理。", "kaodian": "AI 后端能力 - 框架与容器层 - 异步与线程池"}, {"no": 31, "type": "judge", "body": "CSS 中 1rem 始终相对于根元素 html 的 font-size 计算；而 em 用于非 font-size 属性（如 width/padding）时，相对于当前元素自身的 font-size 计算。", "code": "html { font-size: 16px; }\n.box { font-size: 20px; width: 2rem; padding: 1em; }\n/* width = 32px, padding = 20px */", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "rem = root em，永远以 html 的 font-size 为基准（示例中 2rem=32px），因此适合做全局等比缩放（移动端 rem 适配方案的基础）。em 的基准分两种：设置 <b>font-size 本身</b>时相对<b>父元素</b>字号；设置其他属性时相对<b>自身</b>字号（示例中 padding: 1em = 20px）。em 嵌套会层层放大，维护性差，故现代布局多用 rem。", "android": "rem 类似 Android 的 sp/dp 由系统基准密度统一换算；em 则像相对父级的比例值，嵌套时会累积。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 单位与字体"}, {"no": 32, "type": "judge", "body": "Alpha 测试是在开发方场所、由内部人员或受邀用户在受控环境下进行的测试；Beta 测试是在用户的真实使用环境中、由最终用户自行进行的测试。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "两者都属于<b>验收测试</b>阶段：Alpha 在开发侧受控环境进行，问题可被开发人员现场记录与快速修复；Beta 在真实环境由真实用户使用，能暴露实验室覆盖不到的机型、网络、使用习惯问题，但反馈回收与修复周期更长。顺序上通常先 Alpha 后 Beta。", "android": "对应 Google Play 的内部测试轨道（Alpha/内测）与开放式测试轨道（Beta/公测），概念直接同源。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 测试用例设计"}, {"no": 33, "type": "judge", "body": "“测试左移”指把测试活动全部推迟到系统上线之后，通过线上监控和用户反馈来发现问题。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "说反了。<b>测试左移</b>（Shift-Left）是把测试活动<b>提前</b>：在需求评审、设计阶段就介入（评审可测性、提前写用例、接口契约先行、开发阶段单测/静态检查），缺陷发现越早修复成本越低。题干描述的“上线后靠监控、灰度、线上巡检发现问题”属于<b>测试右移</b>的实践——两者是互补关系，但概念不能颠倒。", "android": "类似客户端在 MR 阶段就跑 Lint+单测+UI 自动化（左移），上线后靠 Bugly/APM 监控兜底（右移）。", "kaodian": "AI 质量保障 - 自动化测试与工具 - 契约测试"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+q.no+'" data-no="'+q.no+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+q.no+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q.no==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=document.querySelector('.card[data-no="'+btn.dataset.no+'"]'); gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  ans.querySelector('.ans').textContent='答案：'+(q.type==='fill'? q.answerText : q.answer.join('、'));
  ans.classList.add('show');
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  if(!isAnswered(card)){ if(!confirm('本题还没作答，将按答错处理并展示答案。')) return; }
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
