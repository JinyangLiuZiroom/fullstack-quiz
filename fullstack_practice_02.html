<script>
const QUIZ = {"id": "vol02", "title": "全栈转型模拟自测卷", "sub": "可答题 · 交卷判分 · 自动记录错题", "meta": "题型对齐公司真实考法：<b>单选 / 多选 / 判断 / 填空</b>，给出代码片段或场景，问执行结果、补全代码、判断框架用法。<br>本卷共 <b>35 题</b>：后端 Java 20 + 前端 FE 10 + 测试 5（比例约 50% / 35% / 15%）。<br>难度：<b>实战细节型</b>。考点覆盖：集合/JVM/多线程、Spring 事务与 AOP、MyBatis、MySQL、Redis、Kafka/RabbitMQ、Vue/JS、HTTP、测试与 JUnit/Mockito。", "sections": [{"name": "一、后端 Java（20 题）", "cat": "backend", "questions": [{"no": 1, "type": "single", "body": "JDK 8 中 <code>ConcurrentHashMap</code> 的并发控制机制是？", "code": null, "options": [{"k": "A", "t": "沿用 JDK 7 的 Segment 分段锁"}, {"k": "B", "t": "CAS + synchronized 锁定 hash 桶的头节点"}, {"k": "C", "t": "全局 synchronized 锁整张表"}, {"k": "D", "t": "每个写操作都加 ReentrantLock"}], "answer": ["B"], "explain": "JDK 8 废弃了 Segment，改为\"数组 + 链表/红黑树\"，写操作先用 CAS 尝试，冲突时对目标桶的头节点加 synchronized（只锁一个桶，粒度更细）。并发度从 16（段数）提升到桶数量级。", "android": "类似你把\"全局大锁\"拆成\"按 key 哈希分桶的小锁\"，冲突范围更小、并发更高。"}, {"no": 2, "type": "multi", "body": "关于 <code>ThreadPoolExecutor</code> 线程池，正确的有：（多选）", "code": null, "options": [{"k": "A", "t": "corePoolSize 是核心线程数，默认常驻不回收"}, {"k": "B", "t": "任务超核心线程且队列满时，才创建非核心线程至 maximumPoolSize"}, {"k": "C", "t": "拒绝策略有 AbortPolicy / CallerRunsPolicy / DiscardPolicy / DiscardOldestPolicy"}, {"k": "D", "t": "submit() 返回 Future，可获取执行结果或异常"}], "answer": ["A", "B", "C", "D"], "explain": "任务提交顺序：核心线程 → 队列 → 非核心线程 → 拒绝策略。CallerRunsPolicy 让提交任务的线程自己执行（起到负反馈限流作用），生产常用。", "android": "类似你用 Executors.newFixedThreadPool / 自定义 ThreadPoolExecutor 处理并发任务，submit 拿 Future 和 FutureTask 一样。"}, {"no": 3, "type": "single", "body": "关于 JVM 运行时数据区，以下说法错误的是？", "code": null, "options": [{"k": "A", "t": "堆（Heap）存放对象实例，是 GC 主要区域"}, {"k": "B", "t": "方法区在 JDK 8 后是元空间（Metaspace），存类元数据"}, {"k": "C", "t": "虚拟机栈存放局部变量表、操作数栈、方法调用"}, {"k": "D", "t": "程序计数器（PC）是线程私有的，且最容易发生 OOM"}], "answer": ["D"], "explain": "程序计数器是<b>唯一不会 OOM</b> 的区域（它只存下一条指令地址，空间极小）。最易 OOM 的是堆（OutOfMemoryError: Java heap space）和元空间。", "android": "类似 ART 的堆（GC 主战场）vs 寄存器/PC，理解\"哪块内存会撑爆\"对排查 OOM 很关键。"}, {"no": 4, "type": "single", "body": "以下代码运行结果是？", "code": "List<String> list = new ArrayList<>();\nlist.add(\"a\"); list.add(\"b\"); list.add(\"c\");\nfor (String s : list) {\n    if (s.equals(\"a\")) list.remove(s);\n}\nSystem.out.println(list);", "options": [{"k": "A", "t": "[b, c]"}, {"k": "B", "t": "抛出 ConcurrentModificationException"}, {"k": "C", "t": "[a, b, c]"}, {"k": "D", "t": "编译错误"}], "answer": ["B"], "explain": "for-each 底层用 Iterator。list.remove() 会修改 modCount，而下一次 iterator.next() 校验 expectedModCount != modCount 即抛 ConcurrentModificationException（fail-fast）。正确做法：用 iterator.remove() 或普通 for 下标倒序删除。", "android": "类似你在遍历 ArrayList 时直接 remove，触发并发异常——遍历中改集合要经由迭代器。"}, {"no": 5, "type": "multi", "body": "关于 <code>ThreadLocal</code>，正确的有：（多选）", "code": null, "options": [{"k": "A", "t": "每个线程持有独立副本，避免共享变量竞争"}, {"k": "B", "t": "ThreadLocalMap 的 key 是弱引用（WeakReference），value 是强引用"}, {"k": "C", "t": "使用后若不 remove()，线程池场景下 value 可能一直不被回收，导致内存泄漏"}, {"k": "D", "t": "常用于 Web 请求中在同一线程内传递用户信息（如 Spring 的 RequestContextHolder）"}], "answer": ["A", "B", "C", "D"], "explain": "key 弱引用在 GC 后变 null，但 value（强引用）仍挂在 ThreadLocalMap 上；线程池线程复用不会销毁，value 便泄漏。务必在 finally 中 remove()。", "android": "类似 Looper/Thread 绑定的 Looper.myLooper()，也是\"线程级独立存储\"；不用了要清理。"}, {"no": 6, "type": "judge", "body": "synchronized 在 JDK 6 后存在锁升级：无锁 → 偏向锁 → 轻量级锁（自旋 CAS）→ 重量级锁（操作系统互斥量）。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "这就是 synchronized 性能大幅改善的原因——低竞争时用偏向/轻量级锁避免内核态切换，高竞争才膨胀为重量级锁。锁只可升级不可降级（偏向锁在 JDK 15 后默认关闭，但升级思想仍在）。", "android": "类似你根据竞争程度从\"无锁→自旋→阻塞等待\"逐步升级，避免一开始就进内核等待。"}, {"no": 7, "type": "fill", "body": "无锁并发下，<code>AtomicInteger</code> 等原子类依赖 CPU 的 【空1】 指令（Compare-And-Swap，比较并交换）实现原子更新；若 CAS 失败则<b>自旋重试</b>，直到成功（也可能存在 【空2】 问题——某线程长期抢不到）。", "code": null, "blanks": 2, "accept": [["cas", "compare-and-swap", "compareandswap"], ["aba"]], "answerText": "CAS（或 Compare-And-Swap）；ABA", "explain": "CAS 是\"读-改-写\"原子化的底层原语。ABA 指值从 A→B→A，CAS 误以为没变；可用 AtomicStampedReference 加版本号解决。", "android": "类似你用原子布尔做\"只初始化一次\"标志，底层就是 CAS；ABA 就像\"对象被换掉又换回来你没察觉\"。"}, {"no": 8, "type": "single", "body": "外层方法 A（<code>@Transactional</code>）调用同 Service 内方法 B（<code>@Transactional</code>，默认 REQUIRED），B 抛出异常，A 用 try-catch 捕获了 B 的异常。最终事务会？", "code": null, "options": [{"k": "A", "t": "不回滚，因为异常被 catch 了"}, {"k": "B", "t": "仍然回滚（B 抛异常已把事务标记为 rollback-only）"}, {"k": "C", "t": "只有 B 的改动回滚，A 其他改动提交"}, {"k": "D", "t": "编译不过"}], "answer": ["B"], "explain": "B 抛 RuntimeException 时，Spring 事务拦截器已把当前事务标记为 rollback-only。A 虽然 catch 住了，但事务在提交时发现 rollback-only 标记，仍会整体回滚并抛 UnexpectedRollbackException。这就是\"catch 了还是回滚\"的经典坑。", "android": "类似你在事务里子步骤失败，即使外层吞了异常，底层已打上\"必须回滚\"标记，最后提交阶段照样回滚。"}, {"no": 9, "type": "multi", "body": "以下哪些会导致 <code>@Transactional</code> 不回滚（事务失效或不回滚）？（多选）", "code": null, "options": [{"k": "A", "t": "方法抛出受检异常 IOException（默认只对 RuntimeException 回滚）"}, {"k": "B", "t": "方法声明为 final（CGLIB 无法代理 final 方法）"}, {"k": "C", "t": "方法为 private（AOP 不代理私有方法）"}, {"k": "D", "t": "异常被 catch 后未重新抛出（代理感知不到）"}], "answer": ["A", "B", "C", "D"], "explain": "四类都是真实失效场景。补充：要让受检异常也回滚需 <code>@Transactional(rollbackFor = Exception.class)</code>；AOP 基于子类/CGLIB 代理，final 方法无法被覆写也就无法织入事务逻辑。", "android": "类似你用字节码插桩做无痕埋点，final 方法插不进去——和 final 方法事务失效如出一辙。"}, {"no": 10, "type": "judge", "body": "Spring AOP 默认：被代理类有接口时用 JDK 动态代理，无接口时用 CGLIB；Spring Boot 2.x 起默认 <code>proxyTargetClass=true</code>（即优先 CGLIB 子类代理）。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "Spring Boot 2.x 把 <code>spring.aop.proxy-target-class</code> 默认设为 true，统一用 CGLIB。CGLIB 基于继承，所以 final 类/方法无法被代理——这也解释了第 9 题 B 选项。", "android": "类似你用动态代理（Proxy）需要接口，用 CGLIB 式子类代理则不需要——理解\"代理需可继承/可重写\"这个前提。"}, {"no": 11, "type": "fill", "body": "AOP 五种通知类型中，【空1】 通知功能最强，可在目标方法执行前后插入逻辑、甚至决定是否执行目标方法；【空2】 通知在目标方法抛出异常后才执行（用于统一异常记录）。", "code": null, "blanks": 2, "accept": [["around", "环绕", "@around"], ["afterthrowing", "异常", "@afterthrowing"]], "answerText": "@Around（环绕通知）；@AfterThrowing（异常通知）", "explain": "@Around 需要手动调用 ProceedingJoinPoint.proceed() 推进目标方法，可控制是否执行、重写返回值；其余四种是\"被动\"织入。执行顺序：@Around 前 → @Before → 目标 → @AfterReturning/@AfterThrowing → @After → @Around 后。", "android": "类似你用字节码插桩在方法前后埋点，@Around 就像\"拦截器能决定要不要真正执行原方法\"。"}, {"no": 12, "type": "single", "body": "MyBatis 中 <code>#{name}</code> 与 <code>${name}</code> 的区别，正确的是？", "code": null, "options": [{"k": "A", "t": "两者都预编译，无区别"}, {"k": "B", "t": "#{} 是字符串直接拼接，有 SQL 注入风险"}, {"k": "C", "t": "#{} 预编译占位符（? + 参数绑定），${} 是字符串拼接，有注入风险"}, {"k": "D", "t": "${} 预编译，#{} 拼接"}], "answer": ["C"], "explain": "#{} 会被替换为 ? 并由 PreparedStatement 设参，天然防 SQL 注入；${} 是直接把值拼进 SQL 文本，仅适用于\"动态表名/排序字段\"等无法用占位符的场景，且必须白名单校验。永远优先用 #{}。", "android": "相当于 SQLite 的 ? 占位符（防注入）vs 字符串拼接 SQL——拼接就是注入温床，和 ${} 一样危险。"}, {"no": 13, "type": "multi", "body": "关于 MyBatis 缓存，正确的有：（多选）", "code": null, "options": [{"k": "A", "t": "一级缓存基于 SqlSession，默认开启"}, {"k": "B", "t": "同一 SqlSession 内相同查询会命中一级缓存"}, {"k": "C", "t": "二级缓存基于 Mapper（namespace），需手动开启"}, {"k": "D", "t": "执行 update/delete 会清空对应一级、二级缓存"}], "answer": ["A", "B", "C", "D"], "explain": "一级缓存是 SqlSession 级（会话级），关闭会话或执行写操作即失效；二级缓存跨 SqlSession、按 namespace 共享，需在 mapper.xml 配 &lt;cache/&gt; 且实体可序列化。分布式部署下二级缓存易脏读，很多项目直接关掉。", "android": "类似 Room 的 @Query 结果缓存 / LruCache——一级缓存像单次 DB 连接的临时缓存，二级像全局内存缓存。"}, {"no": 14, "type": "judge", "body": "MyBatis 的 <code>&lt;resultMap&gt;</code> 中，<code>&lt;association&gt;</code> 用于\"一对一/多对一\"关联映射，<code>&lt;collection&gt;</code> 用于\"一对多\"关联映射。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "association 映射一个复杂对象属性（如 Order 里的 User），collection 映射一个集合属性（如 User 里的 List&lt;Order&gt;）。两者都解决\"多表关联结果映射成嵌套对象\"。", "android": "对应 Room 的 @Relation（一对一 vs 一对多），都是把扁平结果集拼成嵌套对象图。"}, {"no": 15, "type": "single", "body": "表 <code>user(id, name, age, city)</code>，InnoDB 有联合索引 <code>(name, age)</code>（id 为主键）。以下查询能\"利用索引且无需回表\"（覆盖索引）的是？", "code": null, "options": [{"k": "A", "t": "SELECT id, name, age FROM user WHERE name='Tom' AND age&gt;20"}, {"k": "B", "t": "SELECT * FROM user WHERE age=20"}, {"k": "C", "t": "SELECT name FROM user WHERE city='BJ'"}, {"k": "D", "t": "SELECT id FROM user WHERE age&gt;20"}], "answer": ["A"], "explain": "InnoDB 二级索引叶子节点自带主键 id。索引 (name, age) 的叶子已包含 id、name、age，A 查询所需列全在索引里 → 覆盖索引，不回表；且用到最左前缀 name。B/C/D 都缺最左列 name，索引失效、全表扫描。", "android": "类似你建了复合索引，只查索引包含的列就能\"索引覆盖\"避免查主表——把最常用查询列放进联合索引可省一次 IO。"}, {"no": 16, "type": "multi", "body": "关于 MySQL 事务的 ACID，对应正确的是：（多选）", "code": null, "options": [{"k": "A", "t": "原子性（Atomicity）：事务要么全做、要么全不做"}, {"k": "B", "t": "一致性（Consistency）：事务前后数据满足约束与业务规则"}, {"k": "C", "t": "隔离性（Isolation）：并发事务相互隔离、互不干扰"}, {"k": "D", "t": "持久性（Durability）：一旦提交，修改永久保存（即使宕机）"}], "answer": ["A", "B", "C", "D"], "explain": "四者定义均正确。原子性靠 undo log、持久性靠 redo log、隔离性靠锁 + MVCC、一致性是最终目标（由前三者共同保证）。", "android": "和 Room 事务的 atomic 概念一致——要么整批写入成功，要么一条都不落。"}, {"no": 17, "type": "fill", "body": "InnoDB 的行锁是<b>基于索引</b>实现的；若 <code>UPDATE/DELETE</code> 的 WHERE 条件<b>没有命中索引</b>，行锁会退化为 【空1】 锁，可能阻塞整张表。此外，<code>SELECT ... FOR UPDATE</code> 加的是 【空2】 锁（X 锁，排他）。", "code": null, "blanks": 2, "accept": [["表", "表锁"], ["排他", "x", "排它"]], "answerText": "表锁；排他（X）锁", "explain": "没有索引命中时 InnoDB 只能锁全表（这是\"明明加行锁却把整张表锁住\"的常见原因）。FOR UPDATE 加排他锁，其他事务既不能加锁读也不能写，直到本事务提交。", "android": "类似 SQLite 的 BEGIN EXCLUSIVE——没走索引的\"行锁\"退化成全局锁，并发直接跪。"}, {"no": 18, "type": "single", "body": "用 Redis 实现分布式锁，以下做法最不可取的是？", "code": null, "options": [{"k": "A", "t": "SET key value NX EX 30（原子加锁并设过期）"}, {"k": "B", "t": "用 Lua 脚本保证\"校验 value 归属 + 删除\"的原子性"}, {"k": "C", "t": "只用 SETNX 加锁，却忘记设置过期时间"}, {"k": "D", "t": "给锁 value 设唯一随机值，释放时校验归属"}], "answer": ["C"], "explain": "只 SETNX 不加过期，一旦持有锁的进程崩溃，锁永不释放 → 死锁，所有竞争者永久阻塞。正确做法：加锁即带过期（NX EX 原子），释放时用 Lua 校验 value 后删除，避免误删别人的锁。生产还常用 Redisson 看门狗自动续期。", "android": "类似你用文件锁/单例保活，若只\"占锁不设置超时\"，进程崩了锁就永远挂着——必须有超时兜底。"}, {"no": 19, "type": "judge", "body": "缓存穿透指大量请求查询\"数据库中也不存在\"的 key，缓存与 DB 都 miss，请求直击 DB；常用<b>布隆过滤器</b>拦截非法 key，或<b>缓存空值</b>短期标记来应对。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "注意区分三个概念：穿透（查不存在的 key）、击穿（热点 key 过期瞬间大量并发）、雪崩（大量 key 同时过期）。缓存空值要设较短 TTL 防止\"假数据\"长期占用；布隆过滤器能廉价判断\"key 是否可能存在\"。", "android": "类似你做接口缓存，恶意请求一堆不存在的 id 直冲数据库——本地布隆过滤器先挡一层，和后端思路完全一样。"}, {"no": 20, "type": "multi", "body": "关于消息队列（Kafka / RabbitMQ），正确的有：（多选）", "code": null, "options": [{"k": "A", "t": "Kafka 通过\"消费者位移 offset\"标记消费进度，自动提交可能丢消息，手动提交可做到至少一次（at-least-once）"}, {"k": "B", "t": "at-least-once 语义下，消费者处理失败重投可能导致<b>重复消费</b>，业务需做幂等"}, {"k": "C", "t": "RabbitMQ 有 direct / fanout / topic / headers 四种交换机，决定消息如何路由到队列"}, {"k": "D", "t": "消息队列可解耦、异步、削峰，但引入了消息丢失、重复、顺序等新问题"}], "answer": ["A", "B", "C", "D"], "explain": "MQ 三大价值+三大难题都要会。Kafka 默认自动提交 offset，处理到一半崩了会\"漏消费\"；手动提交+幂等消费是常见稳妥方案。幂等常靠\"唯一业务键 + 数据库唯一索引 / Redis 去重\"。", "android": "类似你接服务端推送/消息，重复推送要做幂等（同一订单号只处理一次）——和 MQ 重复消费完全一回事。"}]}, {"name": "二、前端 FE（10 题）", "cat": "fe", "questions": [{"no": 21, "type": "single", "body": "以下代码输出？", "code": "var a = {n:1};\nvar b = a;\na.x = a = {n:2};\nconsole.log(a.x, b.x);", "options": [{"k": "A", "t": "undefined, {n:2}"}, {"k": "B", "t": "{n:2}, undefined"}, {"k": "C", "t": "undefined, undefined"}, {"k": "D", "t": "{n:2}, {n:2}"}], "answer": ["A"], "explain": "赋值从右结合、左值先求：先求 a.x 的\"宿主对象\"（此时 a 还是旧对象 {n:1}），再算 a = {n:2} 把 a 指向新对象，最后把新对象赋给\"旧对象.x\"。所以旧对象（b 仍指向它）的 x = {n:2}，新 a 没有 x。故 a.x 为 undefined，b.x 为 {n:2}。", "android": "类似 Kotlin 里引用重指向和属性赋值的先后顺序坑——先确定\"给谁的属性赋值\"再重指向。"}, {"no": 22, "type": "multi", "body": "以下值用 <code>typeof</code> 判断，结果属于 <code>\"object\"</code> 的有：（多选）", "code": null, "options": [{"k": "A", "t": "[]（空数组）"}, {"k": "B", "t": "null"}, {"k": "C", "t": "{}（空对象）"}, {"k": "D", "t": "undefined"}], "answer": ["A", "B", "C"], "explain": "typeof [] = \"object\"、typeof {} = \"object\"、typeof null = \"object\"（历史遗留 bug），typeof undefined = \"undefined\"。所以 D 不是 object。判断数组要用 Array.isArray()，判断 null 用 === null。", "android": "类似 Kotlin 的 nullable：你以为 null 是一种特殊类型，其实 typeof 把它归进了 object——判空必须显式 === null。"}, {"no": 23, "type": "judge", "body": "<code>0.1 + 0.2 === 0.3</code> 在 JavaScript 中结果为 false（IEEE 754 双精度浮点精度丢失）。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "0.1、0.2 二进制无法精确表示，相加得 0.30000000000000004，故 === 0.3 为 false。涉及金额务必用整数分存储或 decimal.js，避免浮点误差。", "android": "类似 Java/Kotlin 里 float/double 算钱的不精确，金额一律用 BigDecimal / 整数分——前端同理。"}, {"no": 24, "type": "single", "body": "以下 async/await 代码输出顺序是？", "code": "async function f() {\n  console.log('a');\n  await null;\n  console.log('b');\n}\nconsole.log('1');\nf();\nconsole.log('2');", "options": [{"k": "A", "t": "1, a, 2, b"}, {"k": "B", "t": "1, a, b, 2"}, {"k": "C", "t": "a, 1, 2, b"}, {"k": "D", "t": "1, 2, a, b"}], "answer": ["A"], "explain": "async 函数同步执行到第一个 await 前（打印 a），遇到 await 把\"后续代码\"注册为<b>微任务</b>并立即返回。主线程继续：打印 1、调用 f、打印 2。当前宏任务结束后，微任务队列里的 b 才执行。故顺序 1,a,2,b。", "android": "类似 suspend 函数：跑到第一个挂起点前的代码同步跑完，挂起后的部分等调度——async/await 就是 JS 版的协程挂起。"}, {"no": 25, "type": "fill", "body": "浏览器端存储中，<code>localStorage</code> 容量约 【空1】，关闭标签页/浏览器<b>不会</b>清除；<code>sessionStorage</code> 仅在 【空2】 内有效，关闭标签页即被清除。两者都受<b>同源</b>限制。", "code": null, "blanks": 2, "accept": [["5mb", "5m", "5"], ["会话", "标签页", "session", "当前会话"]], "answerText": "5MB（约 5M）；同一标签页会话（当前会话）", "explain": "localStorage 持久、sessionStorage 会话级。二者都是同步 API、仅字符串、同源可读。大对象或跨标签页通信更推荐 IndexedDB / 状态管理。Cookie 容量仅约 4KB 且每次请求自动携带。", "android": "localStorage≈SharedPreferences（持久），sessionStorage≈Activity 级临时变量（关页即没）。"}, {"no": 26, "type": "judge", "body": "Vue 中 <code>computed</code> 有缓存（依赖不变不重算），<code>methods</code> 每次调用都执行；<code>watch</code> 适合处理异步或开销大的副作用（如监听输入调接口）。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "模板里多次引用 computed 只算一次（依赖收集 + 脏检查）；methods 每次渲染都调。需要\"派生状态\"用 computed，需要\"响应变化做动作\"用 watch。Vue 3 中 computed 基于 reactive 的依赖追踪。", "android": "computed≈LiveData 的 map/派生（有缓存、依赖变才重算）；watch≈观察 LiveData 变化触发副作用。"}, {"no": 27, "type": "multi", "body": "关于 Vue 中 <code>key</code> 的作用，正确的有：（多选）", "code": null, "options": [{"k": "A", "t": "在 v-for 中帮助 Diff 算法识别节点身份，提升复用效率"}, {"k": "B", "t": "用 index 作 key 在顺序不变时可行，但中间插入/删除可能引发状态错乱"}, {"k": "C", "t": "key 相同则尽量复用 DOM，key 不同则销毁重建"}, {"k": "D", "t": "每轮都用随机值作 key 会强制重建，降低性能"}], "answer": ["A", "B", "C", "D"], "explain": "key 是虚拟 DOM Diff 的\"身份证\"。用 index 当 key，列表重排时会导致输入框内容错位等经典 bug。应使用稳定的业务 id 作 key，避免随机值。", "android": "完全对应 RecyclerView 的 getItemId()/stableId——稳定的 id 让复用更准，用 position 当 id 会在删除/插入时错乱。"}, {"no": 28, "type": "single", "body": "Vue 父子组件嵌套时，以下生命周期执行顺序正确的是？", "code": null, "options": [{"k": "A", "t": "父 beforeCreate → 父 created → 父 beforeMount → 子 beforeCreate → 子 created → 子 beforeMount → 子 mounted → 父 mounted"}, {"k": "B", "t": "子 beforeCreate → 子 created → 父 beforeCreate → 父 created"}, {"k": "C", "t": "父 mounted 早于子 mounted"}, {"k": "D", "t": "顺序是随机的，没有固定规律"}], "answer": ["A"], "explain": "父组件先\"初始化\"到 beforeMount，然后才开始渲染并挂载子组件，子组件走完自己的完整挂载后，父组件才 mounted。记住：\"父先创建、子先挂载、父最后 mounted\"。", "android": "类似 Activity 里 add 子 Fragment：父 onCreate 先走，子 Fragment 的 onAttach/onCreate 在其后；父 onResume 通常最后。"}, {"no": 29, "type": "judge", "body": "HTTP 中 GET 参数在 URL（有长度限制、可被缓存/记录在日志），POST 参数在请求体（相对不被直接记录）；两者都不等于\"安全\"，明文传输都不安全，需 HTTPS 才加密。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "GET 适合幂等查询、可被书签/CDN 缓存；POST 适合提交、改动。安全靠 HTTPS（TLS）而非 GET/POST 本身。另：GET 不是\"更安全\"，密码放 URL 反而更糟。", "android": "你调后端接口：查询用 GET（参数拼 URL）、提交用 POST（放 body），但无论哪种都得走 HTTPS 才防中间人。"}, {"no": 30, "type": "fill", "body": "HTTP 状态码：【空1】 表示永久重定向（资源已迁移），【空2】 表示临时重定向；【空3】 表示资源未修改、可直接用本地缓存（Not Modified，配合缓存省流量）。", "code": null, "blanks": 3, "accept": [["301"], ["302"], ["304"]], "answerText": "301；302；304", "explain": "301 永久（搜索引擎更新收录）、302 临时（如登录后跳回）、304 是协商缓存命中（请求带 If-None-Match/If-Modified-Since，服务端比对你本地副本仍有效）。200 vs 304 是\"缓存是否生效\"的关键。", "android": "类似 Glide/OkHttp 的缓存：服务端返回 304 你就用本地图，省流量——和 HTTP 协商缓存一模一样。"}]}, {"name": "三、测试（5 题）", "cat": "test", "questions": [{"no": 31, "type": "single", "body": "以下属于<b>黑盒</b>测试方法的是？", "code": null, "options": [{"k": "A", "t": "语句覆盖"}, {"k": "B", "t": "路径覆盖"}, {"k": "C", "t": "等价类划分与边界值分析"}, {"k": "D", "t": "条件覆盖"}], "answer": ["C"], "explain": "黑盒关注\"输入→输出\"不关心内部实现，方法包括等价类划分、边界值、场景法、因果图等。A/B/D 是基于代码内部结构的<b>白盒</b>覆盖方法（通常由开发写单测完成）。", "android": "你测一个工具方法各分支是白盒；只按需求文档点 UI 验证结果是黑盒——等价类/边界值就是黑盒套路。"}, {"no": 32, "type": "multi", "body": "关于\"测试金字塔\"，正确的有：（多选）", "code": null, "options": [{"k": "A", "t": "底层是单元测试，数量最多、运行最快最稳定"}, {"k": "B", "t": "中层是集成测试（如测 Service + DB 联动）"}, {"k": "C", "t": "顶层是 UI / 端到端测试，数量少、慢、易碎"}, {"k": "D", "t": "健康形态应是\"多写单测、少写 E2E\""}], "answer": ["A", "B", "C", "D"], "explain": "金字塔强调底层单测占比最大、性价比最高。倒金字塔（全靠 UI 测试）会导致测试慢、易失败、维护贵。对全栈：后端单测 + 少量接口集成测试 + 极少 E2E。", "android": "你项目里 JUnit 单测多、Espresso UI 测试少，正是测试金字塔——别反过来堆 UI 测试。"}, {"no": 33, "type": "judge", "body": "Mockito 中 <code>when(mock.method()).thenReturn(x)</code> 用于\"打桩\"（stub，指定假返回值），<code>verify(mock).method()</code> 用于验证该方法是否按预期被调用。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "when/thenReturn 是\"给定行为\"（驱动型），verify 是\"验证行为\"（断言型）。配合 @Mock + @InjectMocks + @ExtendWith(MockitoExtension.class) 即可不连真数据库单测 Service 业务逻辑。", "android": "类似你用 MockWebServer 打桩返回固定 JSON、再 verify 某个请求确实发出——打桩+验证是单测标准动作。"}, {"no": 34, "type": "fill", "body": "TDD（测试驱动开发）的经典节奏是：先写一条会失败的测试（【空1】）→ 写最小实现让测试通过（【空2】）→ 在测试保护下重构代码（Refactor）。", "code": null, "blanks": 2, "accept": [["红", "red"], ["绿", "green"]], "answerText": "红（Red）；绿（Green）", "explain": "红→绿→重构（Red-Green-Refactor）。先让测试失败以确认它真的在测东西，再实现功能，最后在测试保护下优化。强调\"测试先行\"，而非写完代码补测试。", "android": "类似你先写 fail 的用例再实现逻辑，而不是功能写完才补测试——TDD 把测试当规格。"}, {"no": 35, "type": "single", "body": "代码覆盖率中的\"<b>分支覆盖（branch coverage）</b>\"指的是？", "code": null, "options": [{"k": "A", "t": "每一行代码都至少执行一次"}, {"k": "B", "t": "每一个判断的真/假分支都至少执行一次"}, {"k": "C", "t": "每一个方法都被调用过"}, {"k": "D", "t": "每一个类都被加载过"}], "answer": ["B"], "explain": "分支覆盖（判定覆盖）要求 if/else、三目、switch 的每个分支都走到，比\"语句覆盖\"更严格。还有条件覆盖、路径覆盖等更高标准。覆盖率 100% 也不代表没 bug，只是\"都被执行过\"。", "android": "类似你测一个登录方法，不只测成功分支，必须把\"密码错/账号锁/网络异常\"各分支都跑一遍才算覆盖。"}]}]};
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      html += '<div class="card" id="card-'+q.no+'" data-no="'+q.no+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+q.no+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span><span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q.no==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=document.querySelector('.card[data-no="'+btn.dataset.no+'"]'); gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  ans.querySelector('.ans').textContent='答案：'+(q.type==='fill'? q.answerText : q.answer.join('、'));
  ans.classList.add('show');
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  if(!isAnswered(card)){ if(!confirm('本题还没作答，将按答错处理并展示答案。')) return; }
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
