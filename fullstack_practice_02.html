<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2329; margin: 0; padding: 24px 24px 96px; line-height: 1.65; }
  .container { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: #646a73; font-size: 14px; margin-bottom: 4px; }
  .meta { background: #fff; border-radius: 10px; padding: 14px 18px; margin: 16px 0 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); font-size: 14px; color: #41464b; }
  .meta b { color: #1664ff; }
  .backlink { display:inline-block; margin: 4px 0 10px; color:#1664ff; text-decoration:none; font-size:14px; }
  .backlink:hover { text-decoration: underline; }
  .section { margin-top: 28px; }
  .section h2 { font-size: 18px; margin: 0 0 12px; padding-left: 10px; border-left: 4px solid #1664ff; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card.correct { box-shadow: 0 0 0 2px #52c41a inset, 0 1px 3px rgba(0,0,0,.06); }
  .card.wrong { box-shadow: 0 0 0 2px #ff4d4f inset, 0 1px 3px rgba(0,0,0,.06); }
  .q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .q-no { font-weight: 700; font-size: 15px; }

  .tag-single { background: #e8f3ff; color: #1664ff; }
  .tag-multi  { background: #fff3e0; color: #d4860b; }
  .tag-judge  { background: #fde8f3; color: #c41d7f; }
  .tag-fill   { background: #e9f9ee; color: #1a9e4b; }
  .kaodian { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; background: #f0f2f5; color: #646a73; max-width: 64%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-badge { font-size:12px; padding:2px 9px; border-radius:4px; font-weight:700; margin-left:auto; }
  .res-badge.ok { background:#e9f9ee; color:#1a9e4b; }
  .res-badge.no { background:#fff1f0; color:#ff4d4f; }
  .q-body { font-size: 15px; margin-bottom: 10px; }

    font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; overflow-x: auto; margin: 10px 0; white-space: pre; }
  .options { margin: 8px 0 4px; }
  .opt { display: flex; align-items:flex-start; gap:8px; padding: 9px 12px; border-radius: 8px; margin: 6px 0;
    background: #f7f8fa; border: 1.5px solid transparent; font-size: 14px; cursor: pointer; transition: all .12s; }
  .opt:hover { background: #eef2f7; }

  .opt.sel { background: #e8f3ff; border-color: #1664ff; }
  .opt.correct { background: #f0f9eb; border-color: #52c41a; }

  .opt.wrong { background: #fff1f0; border-color: #ff4d4f; }
  .opt.wrong .k { color:#ff4d4f; }
  .opt.locked { cursor: default; }
  .q-actions { margin-top: 10px; }
  .q-check { background:#1664ff; color:#fff; border:none; border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; font-weight:600; }
  .q-check:hover { background:#0e4fd8; }

  .blank { border:none; border-bottom: 1.5px solid #1664ff; background:#f7f8fa; padding: 3px 8px; margin: 0 4px;
    font-size:14px; min-width: 120px; border-radius:4px 4px 0 0; }
  .blank.correct { border-bottom-color:#52c41a; background:#f0f9eb; }
  .blank.wrong { border-bottom-color:#ff4d4f; background:#fff1f0; }
  .answer { display: none; margin-top: 14px; padding: 14px; background: #f0f9eb;
    border-left: 4px solid #67c23a; border-radius: 6px; font-size: 14px; }
  .answer.show { display: block; }
  .answer .ans { font-weight: 700; color: #1a9e4b; margin-bottom: 8px; font-size: 15px; }
  .answer .label { font-weight: 700; }
  .answer .android { margin-top: 10px; padding: 10px 12px; background: #eef4ff; border-radius: 6px; color: #2a3a55; font-size: 13px; }
  .answer .android .label { color: #1664ff; }
  .footer { text-align: center; color: #9aa0a6; font-size: 13px; margin: 30px 0 10px; }
  .bar { position: fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #e5e6eb;
    box-shadow: 0 -2px 10px rgba(0,0,0,.05); padding: 10px 16px; display:flex; gap:10px; align-items:center; justify-content:center; z-index: 50; }
  .bar .prog { font-size: 14px; color:#41464b; margin-right: auto; }
  .bar .userbox { font-size:13px; color:#646a73; margin-right: 8px; }
  .bar .userbox a { color:#1664ff; cursor:pointer; text-decoration:none; }
  .btn { border:none; border-radius:8px; padding: 9px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#1664ff; color:#fff; }
  .btn-primary:hover { background:#0e4fd8; }
  .btn-primary:disabled { background:#a9c4ff; cursor:not-allowed; }
  .btn-ghost { background:#f2f3f5; color:#41464b; }
  .btn-ghost:hover { background:#e5e6eb; }
  .result-panel { background:#fff; border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); display:none; }
  .result-panel.show { display:block; }
  .result-panel .score { font-size:30px; font-weight:800; color:#1664ff; }
  .result-panel .score small { font-size:15px; color:#646a73; font-weight:500; }
  .result-panel .line { margin-top:8px; font-size:14px; color:#41464b; }
  .result-panel .wrongs { margin-top:8px; font-size:14px; }
  .result-panel .wrongs a { display:inline-block; margin:3px 6px 3px 0; padding:2px 8px; background:#fff1f0; color:#ff4d4f; border-radius:4px; text-decoration:none; font-weight:600; }
  @media (max-width:600px) {
    body { padding: 12px 12px 100px; }
    .container { max-width: 100%; }
    h1 { font-size: 20px; }
    .meta { padding: 10px 12px; font-size: 13px; }
    .card { padding: 14px 12px; margin-bottom: 10px; }
    .q-body { font-size: 14px; }
    .code { font-size: 11px; padding: 10px 10px; }
    .opt { padding: 8px 10px; font-size: 13px; }
    .bar { padding: 8px 10px; gap: 6px; }
    .bar .prog { font-size: 12px; }
    .btn { padding: 7px 12px; font-size: 13px; }
    .section h2 { font-size: 16px; }
    .answer { font-size: 13px; }
    .answer .android { font-size: 12px; }
  }

<script type="application/json" id="quizData">{"id": "vol02", "title": "全栈转型模拟自测卷", "sub": "依据自如 AI 平台笔试认证模拟题范围命题：后端 Java（Spring Boot / MyBatis-Plus / Redis / RabbitMQ / Kafka / MySQL）、前端 H5（Vue3 / Axios / DevTools / CSS 布局）、质量保障（接口测试 / 回归测试 / 自动化 / CI）。每题含答案、知识点讲解与 Android 开发类比。", "meta": "题型：单选 20 题 x 3 分 + 多选 7 题 x 4 分 + 判断 6 题 x 2 分 = 100 分。无填空题。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "Spring 中希望每天早上 9 点执行任务，下列注解与配置正确的是？", "code": "@Scheduled(cron = \"0 0 9 * * ?\")\npublic void job() { ... }", "options": [{"k": "A", "t": "@Scheduled(cron = \"0 0 9 * * ?\")"}, {"k": "B", "t": "@Scheduled(fixedRate = \"0 0 9 * * ?\")"}, {"k": "C", "t": "@Scheduled(delay = 9)"}, {"k": "D", "t": "@Async(cron = \"0 0 9 * * ?\")"}], "answer": "A", "explain": "fixedRate/fixedDelay 接收毫秒数而非 cron 表达式；@Async 是异步执行注解，不负责定时。cron \"0 0 9 * * ?\" 表示每天 9:00:00 触发（秒 分 时 日 月 周）。注意周位用 ? 表示不指定，避免与日位冲突。", "android": "类比 Android：类似 AlarmManager 的 RTC_WAKEUP + 日历触发，cron 表达式就是一套跨平台的\"闹钟时刻\"描述。", "kaodian": "AI 后端能力 - 框架与容器层 - Spring 任务调度"}, {"no": 2, "type": "single", "body": "MyBatis-Plus 分页查询的正确用法是？", "code": "IPage<User> page = new Page<>(1, 10);\nuserMapper.selectPage(page, wrapper);", "options": [{"k": "A", "t": "直接 userMapper.selectList(wrapper).subList(0,10) 即分页"}, {"k": "B", "t": "配置分页拦截器后调用 selectPage(page, wrapper)"}, {"k": "C", "t": "PageHelper.startPage() 是 MyBatis-Plus 原生方法"}, {"k": "D", "t": "selectPage 返回 List，需手动包 IPage"}], "answer": "B", "explain": "MyBatis-Plus 分页必须注册 PaginationInnerInterceptor（或旧版 PaginationInterceptor）到 MySqlDialect，否则 selectPage 不会拼接 LIMIT，会查出全量。PageHelper 是另一款独立插件，不属于 MP。selectPage 直接返回 IPage，total/current 等由拦截器填充。", "android": "类比 Android：相当于 Room 的 PagingSource + PagingData，分页逻辑由库统一拦截 SQL 注入 LIMIT/OFFSET，而不是自己在内存里 subList。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis-Plus 分页"}, {"no": 3, "type": "single", "body": "基于 Redis 实现分布式锁，下列做法能避免\"误删他人锁\"的是？", "code": "SET lock:order  uuid  NX  PX  30000", "options": [{"k": "A", "t": "释放时直接 DEL lock:order"}, {"k": "B", "t": "用 UUID 作为 value，释放时先 GET 比对再 DEL，并用 Lua 保证原子性"}, {"k": "C", "t": "SET key val NX 后无需设置过期时间"}, {"k": "D", "t": "用 EXPIRE 分两步设置过期"}], "answer": "B", "explain": "只用 DEL 会在自己锁已过期、被别人持有新锁时误删他人锁。正确做法：value 存唯一标识（如 UUID/线程ID），释放时用 Lua 脚本先比对 value 再删除，保证\"判断+删除\"原子；NX 同时设过期（PX）避免宕机死锁。两步 EXPIRE 之间有窗口期，不原子。", "android": "类比 Android：类似用 SharedPreferences 做跨进程标记，必须带\"持有者 token\"才能安全清除，不能谁都能 DEL。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 分布式锁"}, {"no": 4, "type": "single", "body": "MySQL 在 RR 隔离级别下，对 id>10 加锁的范围，下列描述正确的是？", "code": "SELECT * FROM t WHERE id > 10 FOR UPDATE;", "options": [{"k": "A", "t": "只锁 id>10 已存在的行"}, {"k": "B", "t": "锁所有已存在行 + (10, +∞) 间隙，防止幻读"}, {"k": "C", "t": "完全不加锁，快照读"}, {"k": "D", "t": "只锁 id=10 这一行"}], "answer": "B", "explain": "RR 下 FOR UPDATE 是当前读，会对范围条件加 Next-Key Lock = 记录锁 + 间隙锁，覆盖 (10, 上确界] 区间，阻止其他事务插入 id>10 的新行（防幻读）。普通 SELECT 才是快照读不加锁。", "android": "类比 Android：类似对某个有序集合做\"区间冻结\"，不仅锁住现有元素，还锁住未来可能插入的空档。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 事务与锁"}, {"no": 5, "type": "single", "body": "Kafka 中，一个 topic 有 4 个分区、消费组内有 3 个消费者，则下列正确的是？", "code": "topic=order, partitions=4, consumers=3（同组）", "options": [{"k": "A", "t": "每个消费者分到 1 个分区，1 个分区无人消费"}, {"k": "B", "t": "每个消费者分到 4/3 个分区（可拆分）"}, {"k": "C", "t": "分区可再拆分，3 个消费者共享全部 4 分区"}, {"k": "D", "t": "分区数会随消费者数自动扩容为 3"}], "answer": "A", "explain": "Kafka 分区是消费并行度的最小单位，一个分区同一时刻只能被组内一个消费者消费。4 分区 3 消费者：分配为 2/1/1（或 2/2/0），总有 1 个分区被某个消费者独占，不存在\"半个分区\"。扩容消费者超过分区数则多余消费者空闲。", "android": "类比 Android：类似把下载任务切成 4 个分片，3 个线程各领若干分片，一个分片不会被两个线程同时写。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息队列-Kafka"}, {"no": 6, "type": "single", "body": "SpringBoot 中 @Async 方法未指定线程池时，默认线程池的问题是？", "code": "@Async\npublic void send() { ... }", "options": [{"k": "A", "t": "复用 Tomcat 业务线程，无额外开销"}, {"k": "B", "t": "默认 SimpleAsyncTaskExecutor 每次新建线程，无上限易 OOM"}, {"k": "C", "t": "默认使用 ForkJoinPool.commonPool"}, {"k": "D", "t": "默认线程池核心 200，安全"}], "answer": "B", "explain": "未自定义 Executor 时，Spring 用 SimpleAsyncTaskExecutor，它每次提交任务都 new Thread，不重用、不限制数量，高并发下线程数暴涨导致 OOM/上下文切换灾难。应自定义 ThreadPoolTaskExecutor 并 @Async(\"myExecutor\") 指定。", "android": "类比 Android：类似每次网络请求都 new Thread() 而不用线程池，主线程外疯狂建线程必崩。", "kaodian": "AI 后端能力 - 框架与容器层 - 异步与线程池"}, {"no": 7, "type": "single", "body": "MyBatis-Plus 逻辑删除的正确配置是？", "code": "@TableLogic\nprivate Integer deleted;", "options": [{"k": "A", "t": "仅靠 @TableLogic 即可，无需全局配置"}, {"k": "B", "t": "需配置 logic-delete-field 与逻辑值，查询自动追加 WHERE deleted=0"}, {"k": "C", "t": "逻辑删除会物理 DELETE 行"}, {"k": "D", "t": "@TableLogic 作用于 insert"}], "answer": "B", "explain": "逻辑删除需在 yml 配置 logic-delete-field（或字段上的 @TableLogic 自带值）与未删除/已删除代表值；MP 会在查询、更新时自动拼接 deleted=未删除值，删除时改为 UPDATE 置位，不物理删。不影响真实 DELETE。", "android": "类比 Android：类似本地消息\"已读/未读\"用标记位而非真正删除记录，回收站即逻辑删除。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis-Plus 逻辑删除"}, {"no": 8, "type": "single", "body": "缓存穿透（查询不存在的 key）的常规防护手段是？", "code": "缓存与 DB 都查不到的 key 被高频访问", "options": [{"k": "A", "t": "对查不到的结果也缓存空值（设短过期）或布隆过滤器"}, {"k": "B", "t": "直接去掉缓存，所有请求走 DB"}, {"k": "C", "t": "增大 Redis 内存即可"}, {"k": "D", "t": "把不存在的 key 写入数据库"}], "answer": "A", "explain": "缓存穿透=大量请求打向不存在的数据，缓存与 DB 都无，直接压垮 DB。防护：①缓存空值（设短 TTL，防止同 key 反复穿透）；②布隆过滤器在入口拦截肯定不存在的 key；③接口参数校验。与\"击穿/雪崩\"是不同的问题。", "android": "类比 Android：类似对非法 deep link 在路由层直接拦截，不让它反复进入 Activity 再崩溃。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存穿透防护"}, {"no": 9, "type": "single", "body": "下列 SQL 会导致联合索引 (a,b,c) 失效、无法走最左前缀的是？", "code": "SELECT * FROM t WHERE b = 1 AND c = 2;", "options": [{"k": "A", "t": "WHERE a=1 AND b=2（走索引）"}, {"k": "B", "t": "WHERE a=1 AND b>2 AND c=3（范围后 c 失效但 a,b 可用）"}, {"k": "C", "t": "WHERE b=1 AND c=2（缺 a，索引基本失效）"}, {"k": "D", "t": "WHERE a=1 ORDER BY b,c（走索引排序）"}], "answer": "C", "explain": "联合索引最左前缀原则：查询必须从最左列 a 开始才能有效利用。WHERE b=1 AND c=2 缺失 a，优化器一般无法使用 (a,b,c) 索引（除非全索引扫描或 Index Skip Scan，MySQL 默认不保证）。范围查询(>、<、like 'x%')会使后续列失效但仍可用前缀部分。", "android": "类比 Android：类似用 (姓氏,名字,手机号) 建的多级索引，只按名字查无法用姓氏那段索引加速。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 索引与最左前缀"}, {"no": 10, "type": "single", "body": "SpringBoot Bean 初始化完成、需要执行一次性启动逻辑，应使用的注解是？", "code": "@PostConstruct\npublic void init() { ... }", "options": [{"k": "A", "t": "@PreDestroy"}, {"k": "B", "t": "@PostConstruct（依赖注入后执行）"}, {"k": "C", "t": "@Before"}, {"k": "D", "t": "@Created"}], "answer": "B", "explain": "@PostConstruct 在依赖注入完成后、Bean 投入使用前执行一次，适合预热缓存/启动校验。@PreDestroy 是销毁钩子。二者是 JSR-250 标准注解，由 Spring 生命周期回调调用。", "android": "类比 Android：类似 Activity.onResume() 前的初始化时机，DI 完成后再做事。", "kaodian": "AI 后端能力 - 框架与容器层 - Bean 生命周期"}, {"no": 11, "type": "single", "body": "RabbitMQ 保证消息不丢失，生产端应开启？", "code": "channel.confirmSelect(); // publisher confirm", "options": [{"k": "A", "t": "仅开启 autoAck=true"}, {"k": "B", "t": "开启 publisher confirm + 消费端手动 ack + 队列/消息持久化"}, {"k": "C", "t": "只设置消息 TTL"}, {"k": "D", "t": "把队列设为 exclusive"}], "answer": "B", "explain": "可靠投递三件套：①生产端 publisher confirm 确认 broker 收到；②消息/队列 durable 持久化防宕机丢失；③消费端手动 ack（autoAck=false）处理完再回执。autoAck=true 会在投递即确认，处理失败即丢。exclusive 队列随连接关闭而删，不适合。", "android": "类比 Android：类似发消息既要本地落库（持久化），又要等服务端回执（confirm），且收到服务端处理成功才删本地。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息可靠性"}, {"no": 12, "type": "single", "body": "Vue3 中 computed 与 method 的区别，正确的是？", "code": "const full = computed(() => firstName.value + lastName.value);\nfunction fullFn() { return firstName.value + lastName.value; }", "options": [{"k": "A", "t": "二者都会每次重新计算，无区别"}, {"k": "B", "t": "computed 有缓存，依赖不变不重算；method 每次调用都执行"}, {"k": "C", "t": "computed 不能用于模板"}, {"k": "D", "t": "method 有依赖追踪缓存"}], "answer": "B", "explain": "computed 基于其响应式依赖做缓存，依赖未变多次访问返回同一结果不重算；method 每次渲染/调用都执行函数体。适合派生状态、过滤列表等。注意 computed 默认只读，需写用 get/set。", "android": "类比 Android：类似 LiveData 的 map 转换（有缓存与依赖追踪），而非每次 get 都重新计算。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 响应式"}, {"no": 13, "type": "single", "body": "CSS 中让元素宽高包含 border 与 padding（即设定 width=内容+padding+border），应设？", "code": "box-sizing: ?;", "options": [{"k": "A", "t": "box-sizing: content-box（默认，width 仅内容）"}, {"k": "B", "t": "box-sizing: border-box"}, {"k": "C", "t": "box-sizing: border-content"}, {"k": "D", "t": "box-sizing: padding-box（仅 IE 旧）"}], "answer": "B", "explain": "box-sizing: border-box 时 width/height 包含 content+padding+border，布局更易控；现代项目常在 *{box-sizing:border-box} 全局重置。content-box 是默认，width 仅指内容区。", "android": "类比 Android：类似 View 的 setIncludeFontPadding / 测量模式，决定 measuredWidth 是否含 padding。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - CSS 盒模型"}, {"no": 14, "type": "single", "body": "以下代码，输出顺序是？", "code": "console.log('A');\nsetTimeout(() => console.log('B'), 0);\nPromise.resolve().then(() => console.log('C'));\nconsole.log('D');", "options": [{"k": "A", "t": "A D C B"}, {"k": "B", "t": "A D B C"}, {"k": "C", "t": "A B C D"}, {"k": "D", "t": "D A C B"}], "answer": "A", "explain": "同步代码先执行：A、D。微任务（Promise.then）清空后才执行宏任务（setTimeout），故顺序 A D C B。事件循环：每轮先跑完所有微任务再取一个宏任务。", "android": "类比 Android：类似主线程 Looper 先处理同步消息，再处理 postDelayed（类似宏任务）与 IdleHandler 顺序差异。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - JS 事件循环"}, {"no": 15, "type": "single", "body": "Axios 请求拦截器（request interceptor）的典型用途是？", "code": "axios.interceptors.request.use(config => {\n  config.headers.Authorization = getToken();\n  return config;\n});", "options": [{"k": "A", "t": "在响应返回后修改 DOM"}, {"k": "B", "t": "统一注入 token、baseURL、loading 等"}, {"k": "C", "t": "替代响应拦截器处理错误"}, {"k": "D", "t": "只能在 Node 端使用"}], "answer": "B", "explain": "request 拦截器在请求发出前修改 config（加鉴权头、统一 baseURL、开启 loading）；response 拦截器处理响应与统一错误。二者构成 Axios 中间件链。", "android": "类比 Android：类似 OkHttp 的 Interceptor 链，addHeader(Authorization) 在最外层统一注入。", "kaodian": "AI 前端能力 - 工程化与网络 - Axios 拦截器"}, {"no": 16, "type": "single", "body": "浏览器 DevTools Network 面板中，Waterfall（瀑布图）用于查看？", "code": "请求列表中每行的彩色条", "options": [{"k": "A", "t": "接口返回的业务 data"}, {"k": "B", "t": "单个请求各阶段耗时（排队、DNS、TCP、TTFB、下载）"}, {"k": "C", "t": "页面内存占用"}, {"k": "D", "t": "Vue 组件树"}], "answer": "B", "explain": "Waterfall 展示每个请求的耗时分段：Queuing、Stalled、DNS Lookup、Initial connection、SSL、TTFB（首字节）、Content Download。用于定位慢请求瓶颈（如 TTFB 高=后端慢，Download 长=响应体大）。", "android": "类比 Android：类似 Android Studio Profiler 的 Network 视图，看每次请求各阶段耗时。", "kaodian": "AI 前端能力 - 工程化与网络 - 前端调试-DevTools"}, {"no": 17, "type": "single", "body": "浏览器对跨域请求发送\"预检\"（OPTIONS）的前提是？", "code": "fetch 携带自定义头 Authorization", "options": [{"k": "A", "t": "所有跨域请求都先发 OPTIONS"}, {"k": "B", "t": "非简单请求（如带自定义头、Content-Type 为 application/json、非 GET/POST）才预检"}, {"k": "C", "t": "只有 GET 才预检"}, {"k": "D", "t": "预检由后端主动发起"}], "answer": "B", "explain": "简单请求（GET/HEAD/POST 且 Content-Type 为 text/plain、application/x-www-form-urlencoded、multipart/form-data，无自定义头）直接发；否则（自定义头、JSON body、PUT/DELETE 等）浏览器先发 OPTIONS 预检，服务端返回允许的方法/头后才发真实请求。CORS 由服务端 Access-Control-* 响应头控制。", "android": "类比 Android：类似 OkHttp 跨域（非同源）接口需服务端在响应头放开，否则被拦。", "kaodian": "AI 前端能力 - 工程化与网络 - CORS 跨域"}, {"no": 18, "type": "single", "body": "接口测试中，\"HTTP 200\"与\"业务成功\"的关系是？", "code": "resp.code()=200, resp.body().code=50000", "options": [{"k": "A", "t": "HTTP 200 一定代表业务成功"}, {"k": "B", "t": "HTTP 200 只表示传输层成功，业务是否成功要看 body 里的业务码"}, {"k": "C", "t": "业务码 50000 会自动变 HTTP 500"}, {"k": "D", "t": "二者完全无关，不用看 HTTP 状态"}], "answer": "B", "explain": "HTTP 状态码描述传输/协议层结果；业务码（如 code=0 成功，非0 失败）描述领域结果。常见\"HTTP 200 + 业务 code=50000\"表示请求正常到达但业务失败。断言必须同时校验 HTTP 状态与业务码，否则漏报。", "android": "类比 Android：类似接口回调 onSuccess 只是网络通了，真正的错误在 result.code 里，必须双重判断。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 接口测试断言"}, {"no": 19, "type": "single", "body": "经典测试金字塔，正确的资源投入比例是？", "code": "单元测试 / 集成测试 / E2E UI 测试", "options": [{"k": "A", "t": "UI 测试最多，单元测试最少"}, {"k": "B", "t": "单元测试最多、集成次之、UI(E2E) 最少"}, {"k": "C", "t": "三者各占 1/3"}, {"k": "D", "t": "只写 E2E 即可"}], "answer": "B", "explain": "测试金字塔：底层单元测试数量最多（快、稳、便宜），中间集成测试，顶层 E2E/UI 测试最少（慢、脆、贵）。倒置（冰激凌筒）会导致反馈慢、维护成本高。", "android": "类比 Android：类似用 JVM 单元测试覆盖 Util/VM 逻辑（多），用 Espresso UI 测试只覆盖关键主流程（少）。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 测试金字塔"}, {"no": 20, "type": "single", "body": "回归测试中，对\"仅订单模块改动\"的版本，最合理的用例筛选策略是？", "code": "本次只改了 order-service", "options": [{"k": "A", "t": "全量重跑所有用例，最保险"}, {"k": "B", "t": "基于改动影响分析，优先跑受影响的订单相关用例 + 核心主流程冒烟"}, {"k": "C", "t": "只跑改动文件本身的单测，跳过集成"}, {"k": "D", "t": "不跑回归，等上线再测"}], "answer": "B", "explain": "回归测试应做影响分析（代码 diff、调用链、历史 bug 关联）来筛选用例，既保证覆盖又控制耗时；核心主流程冒烟必带。全量重跑成本高，完全不跑风险大。", "android": "类比 Android：类似发版前按改动模块跑对应测试用例集，而非每次都全量 instrumented 测试。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 回归测试"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于 Redis 与数据库缓存一致性，合理的方案有？（多选）", "code": "先更新 DB，再删缓存（Cache-Aside）", "options": [{"k": "A", "t": "更新 DB 后删除缓存（Cache-Aside），读时回填"}, {"k": "B", "t": "写时先删缓存再更 DB，可彻底避免不一致"}, {"k": "C", "t": "延迟双删：删缓存→更 DB→延迟再删缓存"}, {"k": "D", "t": "用 Canal 监听 binlog 异步删/更缓存"}], "answer": ["A", "C", "D"], "explain": "Cache-Aside（更新 DB 后删缓存，读未命中再回填）最常用；延迟双删降低并发窗口内脏数据被回填的概率；Canal 订阅 binlog 异步淘汰缓存解耦且可靠。B 错误：先删缓存再更 DB 期间若有其他线程来读，会回填旧值，仍可能不一致，并非\"彻底避免\"。", "android": "类比 Android：类似内存 LruCache 与磁盘 DB 同步，写 DB 成功后 invalidate 内存缓存，下次读再加载，而非强同步双写。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 缓存一致性"}, {"no": 2, "type": "multi", "body": "下列会导致 Spring @Transactional 事务不生效的场景有？（多选）", "code": "@Transactional 标注的方法", "options": [{"k": "A", "t": "方法是 private（CGLIB/动态代理无法代理）"}, {"k": "B", "t": "同类内部方法 self.method() 自调用（绕过代理）"}, {"k": "C", "t": "异常被 catch 吞掉未抛出"}, {"k": "D", "t": "方法抛出受检异常但 rollbackFor 未配置"}], "answer": ["A", "B", "C", "D"], "explain": "事务基于 AOP 代理：①private 方法不被代理；②同类自调用走 this 不经代理，事务不开启；③异常被 catch 不抛出则不会回滚；④默认只对 RuntimeException 回滚，抛出受检异常（且未 rollbackFor）不回滚。四者均会导致\"预期事务不生效\"。", "android": "类比 Android：类似 Room @Transaction 必须在 DAO 方法上、且经框架代理调用才生效，内部直接调不会开启。", "kaodian": "AI 后端能力 - 框架与容器层 - 事务失效场景"}, {"no": 3, "type": "multi", "body": "下列哪些情况会使 MySQL 联合索引 (a,b,c) 无法有效利用？（多选）", "code": "SELECT * FROM t WHERE ...", "options": [{"k": "A", "t": "WHERE b=1（跳过最左列 a）"}, {"k": "B", "t": "WHERE a=1 AND b LIKE '%x'（b 前缀模糊）"}, {"k": "C", "t": "WHERE a=1 AND DATE(create_time)=curdate()（对列用函数）"}, {"k": "D", "t": "WHERE a=1 AND b=2 AND c=3（完全匹配）"}], "answer": ["A", "B", "C"], "explain": "A 缺最左前缀索引失效；B 的 LIKE '%x' 前模糊使 b 无法走索引；C 对索引列套函数破坏有序性（应改写为范围比较）。D 完全命中索引，是最优用法。", "android": "类比 Android：类似用复合排序键查询，必须从第一级键开始匹配，跳级或函数变换都让索引失效。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 索引失效"}, {"no": 4, "type": "multi", "body": "Vue3 响应式系统中，下列会导致\"视图不更新\"的陷阱有？（多选）", "code": "const state = reactive({ list: [] })", "options": [{"k": "A", "t": "直接 state.newKey = 1 给 reactive 对象新增属性（未用 reactive 深层代理时旧版）"}, {"k": "B", "t": "把 reactive 对象解构/展开后丢失响应性，未用 toRefs"}, {"k": "C", "t": "用 ref 包裹对象后修改 .value.xxx"}, {"k": "D", "t": "数组通过 index 直接赋值 arr[0]=x（Vue3 已支持）"}], "answer": ["B"], "explain": "Vue3 的 reactive 基于 Proxy，已能拦截\"新增属性\"和\"数组下标赋值\"（A、D 在 Vue3 下都是响应的，不是陷阱）。真正的坑是 B：把 reactive 对象解构/展开成普通变量（如 const { list } = state）后，list 失去响应追踪，改它不触发更新——必须用 toRefs 保持引用。C 用 ref 包对象改 .value.xxx 也是响应的。", "android": "类比 Android：类似 LiveData 脱离 LifecycleOwner 后观察者收不到回调，引用关系错会导致\"更新了但界面不动\"。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 响应式陷阱"}, {"no": 5, "type": "multi", "body": "Kafka 保证\"消息不丢失\"的可选手段有？（多选）", "code": "producer / broker / consumer", "options": [{"k": "A", "t": "producer 配置 acks=all 且 retries"}, {"k": "B", "t": "topic 设置 replication.factor>=3 且 min.insync.replicas>=2"}, {"k": "C", "t": "consumer 先处理业务再提交 offset（手动 commit）"}, {"k": "D", "t": "producer 用 fire-and-forget 不等待任何回执"}], "answer": ["A", "B", "C"], "explain": "acks=all+retries 保证生产端写入 ISR 副本；多副本+min.insync.replicas 防单点丢失；消费端\"处理完再提交 offset\"避免处理前提交导致失败丢消息。D 的 fire-and-forget 不保证到达，会丢。", "android": "类比 Android：类似消息发送需服务端 ACK + 本地落库，消费端处理成功才删，三者齐备才不丢。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 消息可靠性-Kafka"}, {"no": 6, "type": "multi", "body": "编写单元测试（JUnit + Mockito）时，下列哪些做法合理？（多选）", "code": "@ExtendWith(MockitoExtension.class)", "options": [{"k": "A", "t": "对外部依赖（DB/HTTP/时间）用 mock 隔离，专注被测逻辑"}, {"k": "B", "t": "对纯函数/值对象直接调用，不 mock"}, {"k": "C", "t": "用 @Spy 部分 mock 真实对象以保留部分真实行为"}, {"k": "D", "t": "为了覆盖率，把私有方法也逐一 mock 验证内部实现"}], "answer": ["A", "B", "C"], "explain": "单元测试应 mock 外部依赖（DB/网络/时钟），对纯逻辑直接测；@Spy 可在保留真实行为的同时 stub 个别方法。D 错误：测试应面向行为/契约而非内部实现，过度 mock 私有方法会让测试 brittle、重构即碎。", "android": "类比 Android：类似用 Robolectric/mock 隔离 Context 与网络，只测 ViewModel 的业务分支，不测框架内部。", "kaodian": "AI 质量保障 - 自动化测试与工具 - 单元测试 Mock"}, {"no": 7, "type": "multi", "body": "实现跨服务\"最终一致性\"的分布式事务方案有？（多选）", "code": "订单/库存/账户 多服务", "options": [{"k": "A", "t": "TCC（Try-Confirm-Cancel）三阶段"}, {"k": "B", "t": "本地消息表 + MQ 异步投递"}, {"k": "C", "t": "Saga 长事务（正向+补偿）"}, {"k": "D", "t": "单体 DB 单事务（跨库不适用）"}], "answer": ["A", "B", "C"], "explain": "TCC、本地消息表+MQ、Saga 都是典型最终一致方案；2PC 是强一致但有锁资源缺点。D 单体单事务无法跨服务，不属于分布式事务方案。", "android": "类比 Android：类似多个本地模块间用\"事件+本地记录+重试补偿\"达成一致，而非一个同步锁。", "kaodian": "AI 后端能力 - 框架与容器层 - 分布式事务"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "@Transactional 标注在 private 方法上，Spring 也能正常开启事务。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "错误", "explain": "事务依赖 AOP 动态代理，private 方法无法被代理增强，标注无效，事务不生效。应置于 public 方法。", "android": "类比 Android：类似注解处理器只扫描 public 方法，private 方法上的注解被忽略。", "kaodian": "AI 后端能力 - 框架与容器层 - 事务失效场景"}, {"no": 2, "type": "judge", "body": "Redis 是单线程处理命令，因此分布式环境下无需任何锁机制。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "错误", "explain": "Redis 单线程只保证自身命令原子，不解决\"应用多实例并发改同一业务资源\"的竞态；分布式锁（SET NX）仍必要。", "android": "类比 Android：单线程主线程安全，不代表多进程/多实例共享资源无需同步。", "kaodian": "AI 后端能力 - 高并发与中间件层 - 分布式锁"}, {"no": 3, "type": "judge", "body": "Axios 发起 GET 请求时，配置项 params 会自动拼接到 URL 查询字符串。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "正确", "explain": "Axios 中 params 用于 GET 查询参数（拼到 URL ? 后），data 用于请求体（POST/PUT 等）。二者用途不同。", "android": "类比 Android：类似 Retrofit @Query（拼 URL）与 @Body（请求体）的区别。", "kaodian": "AI 前端能力 - 工程化与网络 - Axios params"}, {"no": 4, "type": "judge", "body": "Vue3 中 ref 包裹基本类型（如 ref(0)），模板里访问需写 count.value。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "错误", "explain": "在模板中 ref 会自动\"解包\"，直接写 {{ count }} 即可；只有在 <script> 逻辑里访问才需要 .value。题干说\"模板里需写 .value\"是错的。", "android": "类比 Android：类似 LiveData 在 DataBinding 中自动 getValue，代码里才需 .value。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 ref"}, {"no": 5, "type": "judge", "body": "MySQL 读未提交（READ UNCOMMITTED）隔离级别可以阻止脏读。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "错误", "explain": "读未提交是最高并发最低隔离，会读到其他事务未提交的脏数据；阻止脏读至少需\"读已提交（READ COMMITTED）\"。", "android": "类比 Android：类似读取一个正在被修改的共享变量，没加锁就会看到中间态（脏数据）。", "kaodian": "AI 后端能力 - 数据库与ORM层 - 事务隔离级别"}, {"no": 6, "type": "judge", "body": "接口自动化测试中，HTTP 状态码返回 200 即可判定用例通过。", "code": null, "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": "错误", "explain": "200 仅表示传输成功，业务是否成功要看响应体中的业务码（如 code=0）；还需校验关键字段。只看 200 会漏报业务失败。", "android": "类比 Android：类似网络回调 onSuccess 只代表通了，必须再判 result.code 才可算成功。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 接口测试断言"}]}]}</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+q.no+'" data-no="'+q.no+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+q.no+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q.no==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=document.querySelector('.card[data-no="'+btn.dataset.no+'"]'); gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  ans.querySelector('.ans').textContent='答案：'+(q.type==='fill'? q.answerText : q.answer.join('、'));
  ans.classList.add('show');
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  if(!isAnswered(card)){ if(!confirm('本题还没作答，将按答错处理并展示答案。')) return; }
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
