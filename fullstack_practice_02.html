  .footer { text-align: center; color: #9aa0a6; font-size: 13px; margin: 30px 0 10px; }

<script type="application/json" id="quizData">{"id": "vol02", "title": "全栈转型模拟自测卷", "sub": "可答题 · 交卷判分 · 自动记录错题", "meta": "对齐公司真实考法：<b>单选 / 多选 / 判断</b>，每题包含完整代码场景，问执行结果、补全代码、判断框架用法正误。<br>本卷共 <b>33 题</b>：单选 20（60 分）+ 多选 7（28 分）+ 判断 6（12 分）= 100 分。<br>难度：<b>实战细节型</b>，考点标签采用公司标准层级命名。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "在 Spring Boot 2.7 工程中有如下两个 Bean，均使用<b>构造器注入</b>互相依赖，<code>application.yml</code> 未做任何额外配置。执行 <code>mvn spring-boot:run</code> 启动，结果是？", "code": "@Service\npublic class OrderService {\n    private final UserService userService;\n    public OrderService(UserService userService) {\n        this.userService = userService;\n    }\n}\n\n@Service\npublic class UserService {\n    private final OrderService orderService;\n    public UserService(OrderService orderService) {\n        this.orderService = orderService;\n    }\n}", "options": [{"k": "A", "t": "正常启动，Spring 的三级缓存可以自动解决构造器循环依赖"}, {"k": "B", "t": "编译期报错，javac 会检测出类之间的循环引用"}, {"k": "C", "t": "启动失败，抛出循环依赖相关异常，日志提示可设置 spring.main.allow-circular-references=true"}, {"k": "D", "t": "启动成功，但两个字段都被注入为 null"}], "answer": ["C"], "explain": "考点：Spring 循环依赖的可解与不可解边界。<br>C 对：三级缓存能提前暴露的是<b>已经实例化但未填充属性</b>的早期引用，而构造器注入要求「对象创建那一刻依赖就必须就绪」，此时连实例都还没有，无法放入 singletonFactories，因此必然失败，抛 BeanCurrentlyInCreationException。且 Spring Boot 2.6 起默认 <code>spring.main.allow-circular-references=false</code>，即使是 setter/字段注入的循环依赖也会直接启动失败并给出该提示。<br>A 错：三级缓存只对<b>单例 + setter/字段注入</b>生效。<br>B 错：Java 类之间互相引用是完全合法的，编译不会报错，这是运行期容器装配问题。<br>D 错：final 字段必须在构造器中赋值，不存在注入 null 的中间态。<br>正确做法：用 @Lazy 打断、改字段注入并开启 allow-circular-references，或最好重构抽出第三个服务消除环。", "android": "类比 Android：像两个 Activity 在 onCreate 里互相 new 对方，必然栈溢出；Dagger/Hilt 遇到构造器循环依赖同样是编译或运行期直接报错，解法也是加 @Lazy 或 Provider<T> 延迟取值。", "kaodian": "AI 后端能力 - 框架与容器层 - Spring 循环依赖"}, {"no": 2, "type": "single", "body": "下面配置类注册了一个 Bean，同时实现了 <code>InitializingBean</code> 并声明了 <code>initMethod</code>。启动容器后控制台的打印顺序是？", "code": "public class LifeBean implements InitializingBean {\n    public LifeBean() { System.out.println(\"1-构造器\"); }\n\n    @Autowired\n    public void setDep(DepBean dep) { System.out.println(\"2-依赖注入\"); }\n\n    @PostConstruct\n    public void post() { System.out.println(\"3-PostConstruct\"); }\n\n    @Override\n    public void afterPropertiesSet() { System.out.println(\"4-afterPropertiesSet\"); }\n\n    public void customInit() { System.out.println(\"5-initMethod\"); }\n}\n\n@Configuration\npublic class BeanConfig {\n    @Bean(initMethod = \"customInit\")\n    public LifeBean lifeBean() { return new LifeBean(); }\n}", "options": [{"k": "A", "t": "1 → 2 → 3 → 4 → 5"}, {"k": "B", "t": "1 → 2 → 4 → 3 → 5"}, {"k": "C", "t": "1 → 3 → 2 → 4 → 5"}, {"k": "D", "t": "1 → 2 → 5 → 3 → 4"}], "answer": ["A"], "explain": "考点：Spring Bean 初始化阶段的固定次序。<br>A 对：完整链路是 实例化(构造器) → 属性填充/依赖注入 → Aware 接口回调 → BeanPostProcessor.postProcessBeforeInitialization（<b>@PostConstruct 正是由 CommonAnnotationBeanPostProcessor 在这一步触发</b>）→ InitializingBean.afterPropertiesSet() → 自定义 initMethod → postProcessAfterInitialization（AOP 代理在此织入）。<br>B 错：把 JSR-250 注解排到了接口回调之后，实际 @PostConstruct 一定<b>早于</b> afterPropertiesSet。<br>C 错：@PostConstruct 依赖注入完成后才执行，否则方法里用到的依赖会是 null。<br>D 错：initMethod 是三种初始化回调中<b>最后</b>执行的。<br>销毁阶段同理：@PreDestroy → DisposableBean.destroy() → destroyMethod。", "android": "类比 Android：Activity 的 onCreate → onStart → onResume 也是框架规定死的回调次序；@PostConstruct 相当于 onCreate 里「findViewById 之后」才能安全用 View，提前用必空指针。", "kaodian": "AI 后端能力 - 框架与容器层 - Bean 生命周期"}, {"no": 3, "type": "single", "body": "风控模块有一个 <code>RiskRule</code> 接口和两个实现类，服务里同时用集合与 Map 接收。关于下面代码的运行结果，正确的是？", "code": "public interface RiskRule { void check(Order o); }\n\n@Component @Order(2)\npublic class AmountRule implements RiskRule { ... }\n\n@Component @Order(1)\npublic class BlackListRule implements RiskRule { ... }\n\n@Service\npublic class RiskService {\n    @Autowired private List<RiskRule> rules;             // ①\n    @Autowired private Map<String, RiskRule> ruleMap;    // ②\n\n    public void run(Order o) {\n        rules.forEach(r -> r.check(o));\n        System.out.println(ruleMap.keySet());\n    }\n}", "options": [{"k": "A", "t": "① 启动失败：容器中存在两个候选 Bean，必须配合 @Qualifier 才能注入"}, {"k": "B", "t": "① 能注入两个实现，但顺序不确定，@Order 对集合注入不生效"}, {"k": "C", "t": "② 启动失败：注入 Map 类型必须使用 @Resource，@Autowired 不支持"}, {"k": "D", "t": "① 会注入全部 2 个实现且顺序为 BlackListRule、AmountRule；② 的 key 是 Bean 名称，value 是对应实例"}], "answer": ["D"], "explain": "考点：Spring 的集合/Map 依赖注入与排序规则。<br>D 对：当注入点是 <code>List&lt;T&gt;</code> 时，Spring 不是「按类型找唯一 Bean」而是「收集所有 T 类型的 Bean」，因此不会报 NoUniqueBeanDefinitionException；集合元素会按 @Order 值<b>升序</b>排列（也支持实现 Ordered 接口），所以 @Order(1) 的 BlackListRule 在前。注入 <code>Map&lt;String,T&gt;</code> 时 key 固定为 Bean 名称（这里是 amountRule、blackListRule）。<br>A 错：多实现恰恰是集合注入的典型用法，策略/责任链就靠它。<br>B 错：@Order（以及 @Priority、Ordered）对集合注入<b>是生效</b>的，这也是编排责任链顺序的标准手段。<br>C 错：@Autowired 完全支持 Map 注入，且只有 key 为 String 时才走「按名称收集」语义。<br>注意：@Order 只影响注入集合的顺序，不影响 Bean 的创建顺序（那是 @DependsOn 的职责）。", "android": "类比 Android：像用 ServiceLoader / Hilt 的 @IntoSet 一次性拿到所有拦截器实现，再按优先级串成 OkHttp 的 Interceptor 链，@Order 就是链上的排序权重。", "kaodian": "AI 后端能力 - 框架与容器层 - 依赖注入与集合注入"}, {"no": 4, "type": "single", "body": "自研 starter 里有一段自动配置，业务工程中又自己声明了同名同类型的 Bean。启动后容器中真正生效的 <code>redisTemplate</code> 是哪一个，为什么？", "code": "// ===== starter 中：META-INF/spring.factories 注册的自动配置类 =====\n@Configuration\npublic class RedisAutoConfiguration {\n    @Bean\n    @ConditionalOnMissingBean\n    public RedisTemplate<String, Object> redisTemplate(RedisConnectionFactory f) {\n        RedisTemplate<String, Object> t = new RedisTemplate<>();\n        t.setConnectionFactory(f);   // 默认 JdkSerializationRedisSerializer\n        return t;\n    }\n}\n\n// ===== 业务工程中 =====\n@Configuration\npublic class MyRedisConfig {\n    @Bean\n    public RedisTemplate<String, Object> redisTemplate(RedisConnectionFactory f) {\n        RedisTemplate<String, Object> t = new RedisTemplate<>();\n        t.setConnectionFactory(f);\n        t.setValueSerializer(new GenericJackson2JsonRedisSerializer());\n        return t;\n    }\n}", "options": [{"k": "A", "t": "starter 中的生效：自动配置由框架加载，优先级高于用户配置"}, {"k": "B", "t": "业务工程的生效：自动配置类在用户配置<b>之后</b>解析，@ConditionalOnMissingBean 发现同类型 Bean 已注册便跳过"}, {"k": "C", "t": "启动直接抛 BeanDefinitionOverrideException，必须显式开启 allow-bean-definition-overriding"}, {"k": "D", "t": "两个都会注册，按 Bean 名称 redisTemplate 与 myRedisTemplate 区分共存"}], "answer": ["B"], "explain": "考点：Spring Boot 自动配置的「兜底」语义与条件装配时机。<br>B 对：自动配置类通过 spring.factories / AutoConfiguration.imports 加载，被 <code>DeferredImportSelector</code> 延迟到<b>所有用户配置类解析完毕之后</b>再处理。此时业务的 redisTemplate 定义已在 BeanFactory 中，@ConditionalOnMissingBean 判定「已存在同类型 Bean」，自动配置的 @Bean 方法直接被跳过——这正是 starter「用户没配我才兜底」的设计。<br>A 错：优先级恰恰相反，用户自定义永远优先。<br>C 错：由于条件注解直接短路，根本没有第二个 BeanDefinition 被注册，不存在覆盖冲突；只有两个<b>普通</b> @Configuration 声明同名 Bean 才会触发该异常。<br>D 错：两处方法名都是 redisTemplate，@ConditionalOnMissingBean 默认按<b>类型</b>判断而非名称。<br>实战提醒：写 starter 时给每个 @Bean 加 @ConditionalOnMissingBean 是基本素养。", "android": "类比 Android：类似 Gradle 依赖里 library 提供的默认 AndroidManifest 组件，app module 声明同名组件时用 tools:replace 覆盖——库只做默认值，业务方永远有最终话语权。", "kaodian": "AI 后端能力 - 框架与容器层 - 自动配置与条件装配"}, {"no": 5, "type": "single", "body": "配置文件同时激活了两个 profile，配置类中有四个带 <code>@Profile</code> 的 Bean。启动后被注册进容器的是哪几个？", "code": "# application.yml\nspring:\n  profiles:\n    active: dev,local\n\n// ---------------- 配置类 ----------------\n@Configuration\npublic class EnvConfig {\n    @Bean @Profile(\"dev\")            public A a() { return new A(); }\n    @Bean @Profile(\"!prod\")          public B b() { return new B(); }\n    @Bean @Profile({\"test\",\"local\"}) public C c() { return new C(); }\n    @Bean @Profile(\"prod & !dev\")    public D d() { return new D(); }\n}", "options": [{"k": "A", "t": "只有 a"}, {"k": "B", "t": "a、b、c 三个"}, {"k": "C", "t": "a、b、c、d 四个都注册"}, {"k": "D", "t": "只有 b、c"}], "answer": ["B"], "explain": "考点：@Profile 表达式语义（多激活、取反、或、与）。<br>激活集合为 {dev, local}，逐个判定：<br>a：@Profile(\"dev\") —— dev 已激活 ✔<br>b：@Profile(\"!prod\") —— prod 未激活，取反成立 ✔<br>c：@Profile({\"test\",\"local\"}) —— 数组形式是<b>或</b>关系，命中 local ✔<br>d：@Profile(\"prod &amp; !dev\") —— 要求 prod 激活且 dev 未激活，两条都不满足 ✘<br>因此 B 对：最终注册 a、b、c 三个 Bean。<br>A 错：漏掉了 b 与 c，只看到 dev 却忽略了取反表达式与 local 的命中。<br>C 错：多算了 d，<code>prod &amp; !dev</code> 是「与」关系，prod 根本没激活。<br>D 错：少算了 a，dev 明确在激活列表中。<br>易错点：① 数组是 OR 不是 AND；② profile 表达式支持 <code>!</code>、<code>&amp;</code>、<code>|</code> 和括号，但 <code>&amp;</code> 与 <code>|</code> <b>不能混用</b>而不加括号，否则抛 IllegalArgumentException；③ spring.profiles.active 用逗号可同时激活多个。", "android": "类比 Android：等同 productFlavors + buildTypes 的组合矩阵，@Profile(\"!prod\") 就像「除 release 外都打开日志开关」的 BuildConfig 判断。", "kaodian": "AI 后端能力 - 框架与容器层 - Profile 多环境装配"}, {"no": 6, "type": "single", "body": "下单服务在事务方法里发布领域事件，监听器负责发短信。当金额校验失败抛异常回滚时，实际会发生什么？应如何修复？", "code": "@Service\npublic class OrderService {\n    @Autowired private ApplicationEventPublisher publisher;\n\n    @Transactional\n    public void createOrder(Order o) {\n        orderMapper.insert(o);\n        publisher.publishEvent(new OrderCreatedEvent(o.getId()));\n        if (o.getAmount().signum() < 0) {\n            throw new IllegalArgumentException(\"金额非法\");   // 触发回滚\n        }\n    }\n}\n\n@Component\npublic class SmsListener {\n    @EventListener\n    public void onCreated(OrderCreatedEvent e) {\n        smsService.send(e.getOrderId());   // 真实发短信\n    }\n}", "options": [{"k": "A", "t": "事务回滚，短信不会发出，因为监听器运行在同一事务中会被一起回滚"}, {"k": "B", "t": "事件根本不会被发布，事务未提交时 publishEvent 会被容器缓存起来"}, {"k": "C", "t": "@EventListener 默认异步执行，与事务无关，需加 @Async 才会变同步"}, {"k": "D", "t": "短信已经真实发出但订单数据回滚，造成不一致；应改用 @TransactionalEventListener(phase = AFTER_COMMIT)"}], "answer": ["D"], "explain": "考点：Spring 事件的同步语义与事务边界的错配。<br>D 对：<code>publishEvent</code> 默认是<b>同步阻塞</b>调用，监听器在 publishEvent 那一行就跑完了，此时事务尚未提交。短信是发往外部系统的<b>不可回滚副作用</b>，数据库回滚了短信却已送达，产生「订单不存在但用户收到通知」的脏体验。正确姿势是 <code>@TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)</code>，让监听逻辑挂到事务同步回调上，只在提交成功后才执行。<br>A 错：数据库能回滚，短信网关的调用回滚不了；且监听器虽在同一事务上下文，但外部 IO 不受事务管理。<br>B 错：publishEvent 是立即派发，没有缓存机制。<br>C 错：@EventListener <b>默认同步</b>，加 @Async 才变异步（且需 @EnableAsync）。<br>补充：AFTER_COMMIT 的监听器里再写数据库默认不会生效，需要 @Transactional(propagation = REQUIRES_NEW)。", "android": "类比 Android：像在数据库事务还没 setTransactionSuccessful 时就发了 LocalBroadcast/EventBus 通知 UI 刷新，事务一旦失败 UI 已经改了；正确做法是在 endTransaction 成功后再发通知。", "kaodian": "AI 后端能力 - 框架与容器层 - Spring 事件与事务同步"}, {"no": 7, "type": "single", "body": "支付客户端使用 Spring Retry，启动类已加 <code>@EnableRetry</code>。外部通过其它 Bean 调用 <code>payClient.pay(\"A1\")</code>，且远程始终失败。下列描述正确的是？", "code": "@Service\npublic class PayClient {\n\n    @Retryable(value = RemoteAccessException.class,\n               maxAttempts = 3,\n               backoff = @Backoff(delay = 1000, multiplier = 2))\n    public String pay(String bizNo) {\n        log.info(\"调用支付网关 {}\", bizNo);\n        throw new RemoteAccessException(\"网络抖动\");\n    }\n\n    @Recover\n    public String recover(RemoteAccessException e, String bizNo) {\n        return \"FALLBACK:\" + bizNo;\n    }\n}", "options": [{"k": "A", "t": "pay 共执行 4 次（1 次原始调用 + 3 次重试），最终返回 FALLBACK:A1"}, {"k": "B", "t": "pay 共执行 3 次，最终把 RemoteAccessException 抛给调用方，@Recover 不生效"}, {"k": "C", "t": "pay 共执行 3 次，重试间隔约 1s、2s，最终由 @Recover 兜底返回 FALLBACK:A1"}, {"k": "D", "t": "启动即报错，@Recover 方法签名与 @Retryable 方法不匹配"}], "answer": ["C"], "explain": "考点：@Retryable 的 maxAttempts 语义、退避策略与 @Recover 匹配规则。<br>C 对：<b>maxAttempts 是「总尝试次数」而不是「额外重试次数」</b>，3 表示首次 + 2 次重试 = 共执行 3 次。@Backoff(delay=1000, multiplier=2) 是指数退避，间隔依次约 1000ms、2000ms。三次都失败后，Spring Retry 在同一个 Bean 中寻找 @Recover 方法：要求<b>第一个参数是异常类型（可兼容），其余参数与原方法参数列表一致，返回值类型一致</b>——这里 (RemoteAccessException, String) → String 完全匹配，因此走兜底返回 FALLBACK:A1，调用方拿不到异常。<br>A 错：把 maxAttempts 误读成额外重试次数，这是最高频的踩坑。<br>B 错：@Recover 匹配成功就不会再往外抛；只有找不到匹配的 @Recover 时才抛出最后一次异常。<br>D 错：签名是合法的。<br>另需注意：@Retryable 基于 AOP 代理，<b>同类内部自调用同样失效</b>。", "android": "类比 Android：等同 OkHttp 的 retryOnConnectionFailure + 自定义 Interceptor 里的指数退避重试，@Recover 就是重试耗尽后返回本地缓存兜底数据，避免直接把异常抛到 UI 层。", "kaodian": "AI 后端能力 - 框架与容器层 - Spring Retry 重试机制"}, {"no": 8, "type": "single", "body": "现有切面切点如下，实际发现 <code>com.ziroom.service.UserService</code> 被增强了，但 <code>com.ziroom.service.impl.OrderServiceImpl</code> 没有被增强。要让<b>本包及所有子包</b>的方法都被切中，应改成哪个表达式？", "code": "@Aspect\n@Component\npublic class LogAspect {\n\n    @Pointcut(\"execution(* com.ziroom.service.*.*(..))\")   // 当前写法\n    public void pt() {}\n\n    @Before(\"pt()\")\n    public void before(JoinPoint jp) {\n        log.info(\"进入 {}\", jp.getSignature());\n    }\n}\n\n// 包结构\n// com.ziroom.service.UserService          → 被增强\n// com.ziroom.service.impl.OrderServiceImpl → 未被增强", "options": [{"k": "A", "t": "execution(* com.ziroom.service.*.*(..))"}, {"k": "B", "t": "execution(* com.ziroom.service..*.*(..))"}, {"k": "C", "t": "execution(* com.ziroom.service.**.*(..))"}, {"k": "D", "t": "execution(* com.ziroom.service.*.*())"}], "answer": ["B"], "explain": "考点：AspectJ 切点表达式中 <code>*</code> 与 <code>..</code> 的区别。<br>B 对：在包路径位置，<code>..</code> 表示「当前包及其任意层级子包」，<code>*</code> 只匹配<b>一级</b>名称。<code>com.ziroom.service..*.*(..)</code> 拆解为：返回值 <code>*</code> 任意 → 包 <code>com.ziroom.service..</code> 含子包 → 类 <code>*</code> 任意 → 方法 <code>*</code> 任意 → 参数 <code>(..)</code> 任意个任意类型。<br>A 错：即题目现状，<code>service.*</code> 只能匹配 service 包直属的类，匹配不到 impl 子包。<br>C 错：AspectJ 包位置<b>没有 <code>**</code> 通配语法</b>，跨层级必须用 <code>..</code>，写成 <code>**</code> 会解析异常或匹配不到。<br>D 错：<code>()</code> 表示<b>无参方法</b>，会把所有带参数的方法排除掉；表示任意参数必须写 <code>(..)</code>。<br>补充：<code>within(com.ziroom.service..*)</code> 也可达成同样的包级匹配，粒度是类而非方法签名。", "android": "类比 Android：像 ProGuard 规则里的 <code>-keep class com.x.**</code> 与 <code>-keep class com.x.*</code>，一个星号只管一层，想递归子包必须用递归通配符，写错了规则就悄悄不生效。", "kaodian": "AI 后端能力 - 框架与容器层 - AOP 切点表达式"}, {"no": 9, "type": "single", "body": "上线后前端反馈接口 <code>data</code> 恒为 null，但数据库明明有数据、日志也打印了耗时。查到如下环绕通知，问题出在哪？", "code": "@Around(\"@annotation(com.ziroom.anno.Log)\")\npublic Object around(ProceedingJoinPoint pjp) throws Throwable {\n    long s = System.currentTimeMillis();\n    pjp.proceed();\n    log.info(\"{} 耗时 {}ms\", pjp.getSignature().getName(),\n             System.currentTimeMillis() - s);\n    return null;                       // ← 注意这一行\n}\n\n@RestController\npublic class UserController {\n    @Log\n    @GetMapping(\"/user/{id}\")\n    public User getUser(@PathVariable Long id) {\n        return userMapper.selectById(id);   // 确实查到了对象\n    }\n}", "options": [{"k": "A", "t": "Controller 对外返回 null：@Around 的返回值就是目标方法对外暴露的返回值，必须 return pjp.proceed() 的结果"}, {"k": "B", "t": "不影响，@Around 的返回值只用于切面内部，目标方法的返回值会原样透传给调用方"}, {"k": "C", "t": "会抛出 NullPointerException，Spring 检测到环绕通知返回 null 会拦截报错"}, {"k": "D", "t": "编译错误：@Around 通知方法的返回类型必须声明为 void"}], "answer": ["A"], "explain": "考点：@Around 环绕通知对返回值的「接管」责任。<br>A 对：AOP 代理对象收到调用后，把控制权完全交给 @Around 方法，<b>调用方最终拿到的就是 @Around 的返回值</b>。<code>pjp.proceed()</code> 的结果如果被丢弃并 return null，真实数据就在切面里蒸发了。正确写法是 <code>Object result = pjp.proceed(); ... ; return result;</code>。这类 Bug 特别隐蔽——目标方法内的日志、SQL 全都正常，只有出口被截断。<br>B 错：环绕通知是代理链上的最外层，没有「原样透传」这回事，透传要靠自己 return。<br>C 错：返回 null 是完全合法的（void 方法本来就返回 null），Spring 不会报错，只是业务结果丢了。唯一会报错的情况是目标方法返回<b>基本类型</b>（如 int）而通知返回 null，此时拆箱会抛 NPE。<br>D 错：@Around 必须返回 Object（或兼容类型）并可声明 throws Throwable，声明成 void 反而会导致返回值恒为 null。", "android": "类比 Android：像自定义 View 重写 onTouchEvent 时忘了 return super.onTouchEvent(event) 而直接 return false，父类逻辑跑过了但结果没往上传，事件链就断在你这一层。", "kaodian": "AI 后端能力 - 框架与容器层 - AOP 环绕通知返回值"}, {"no": 10, "type": "single", "body": "报表服务在事务中调用了统计服务写流水日志，统计方法声明为 <code>NOT_SUPPORTED</code>。外层最后抛出运行时异常，数据库最终数据状态是？", "code": "@Service\npublic class ReportService {\n    @Autowired private StatService statService;\n\n    @Transactional(propagation = Propagation.REQUIRED)\n    public void doBiz(Order order) {\n        orderMapper.insert(order);        // ① 插入订单\n        statService.writeLog(order);      // ② 跨 Bean 调用\n        throw new RuntimeException(\"下游库存不足\");\n    }\n}\n\n@Service\npublic class StatService {\n    @Transactional(propagation = Propagation.NOT_SUPPORTED)\n    public void writeLog(Order order) {\n        logMapper.insert(new StatLog(order));   // ③ 插入统计流水\n    }\n}", "options": [{"k": "A", "t": "① 和 ③ 都被回滚，一条数据都不会留下"}, {"k": "B", "t": "① 保留，③ 被回滚"}, {"k": "C", "t": "① 被回滚，③ 保留下来"}, {"k": "D", "t": "抛出 TransactionSuspensionNotSupportedException，方法无法执行"}], "answer": ["C"], "explain": "考点：Propagation.NOT_SUPPORTED 的挂起语义。<br>C 对：NOT_SUPPORTED 表示「我不需要事务」——进入方法时 Spring 会把外层已存在的事务<b>挂起</b>（suspend，解绑当前线程的 ConnectionHolder），用一条<b>新的、自动提交</b>的连接执行 SQL，方法返回后再恢复外层事务。因此 ③ 的插入在 writeLog 返回时就已经独立提交，外层回滚管不到它；而 ① 属于外层事务，随异常一起回滚。<br>A 错：NOT_SUPPORTED 已脱离外层事务，不会被牵连回滚。<br>B 错：外层抛的是 RuntimeException（unchecked），默认触发回滚，① 必然回滚。<br>D 错：DataSourceTransactionManager 支持事务挂起，不会抛该异常。<br>对比记忆：REQUIRED 合并同一事务；REQUIRES_NEW 挂起外层并<b>新开一个事务</b>；NOT_SUPPORTED 挂起外层并<b>完全无事务</b>运行；NEVER 存在事务就直接抛异常。<br>另外别忘了：这里能生效的前提是<b>跨 Bean 调用</b>走了代理，同类内部调用则传播行为整体失效。", "android": "类比 Android：像在一个大的 SQLite 事务里，把埋点日志用另一个独立连接直接写盘——主流程失败回滚，埋点数据照样保留，因为它压根不在那个事务的作用域内。", "kaodian": "AI 后端能力 - 框架与容器层 - 事务传播行为"}, {"no": 11, "type": "single", "body": "MyBatis-Plus 中使用 <code>LambdaQueryWrapper</code> 拼接如下条件（<code>status=1</code>，<code>name</code> 传 \"张\"，<code>phone</code> 传 \"138\"），最终生成的 WHERE 子句是？", "code": "LambdaQueryWrapper<User> w = Wrappers.<User>lambdaQuery()\n        .eq(User::getStatus, 1)\n        .and(q -> q.like(User::getName, \"张\")\n                   .or()\n                   .eq(User::getPhone, \"138\"));\n\nList<User> list = userMapper.selectList(w);", "options": [{"k": "A", "t": "WHERE status = ? AND name LIKE ? OR phone = ?"}, {"k": "B", "t": "WHERE status = ? AND (name LIKE '%张%' OR phone = ?)"}, {"k": "C", "t": "WHERE (status = ? AND name LIKE '张%') OR phone = ?"}, {"k": "D", "t": "WHERE status = ? OR (name LIKE '%张%' AND phone = ?)"}], "answer": ["B"], "explain": "考点：Wrapper 的 and(Consumer) 嵌套括号与 like 默认模糊策略。<br>B 对：<code>and(q -&gt; ...)</code> 接收一个 Consumer，MP 会把内部拼出的条件<b>整体用一对小括号包住</b>，从而把 OR 的作用域限制在括号内，得到 <code>status = ? AND (name LIKE ? OR phone = ?)</code>。同时 <code>like()</code> 默认是<b>全模糊</b> <code>%张%</code>（likeLeft 为 %张、likeRight 为 张%）。<br>A 错：这正是<b>不加 and(Consumer) 直接链式 .or()</b> 的结果——SQL 中 AND 优先级高于 OR，会被解析成 <code>(status=1 AND name LIKE ...) OR phone=...</code>，把 status 过滤条件击穿，是线上「越权查到别人数据」的经典事故。<br>C 错：括号位置错误，且 like 不是右模糊。<br>D 错：顶层连接符是 AND 不是 OR。<br>牢记口诀：<b>OR 必须包在 and(...) 或 or(...) 的 Consumer 里</b>，否则条件优先级一定出问题。", "android": "类比 Android：像 Room 里手写 @Query 的 WHERE 条件忘了给 OR 加括号，本地筛选把「当前用户」的限制条件冲掉，一次查询把全表数据都拉到 RecyclerView 上。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis-Plus 条件构造器"}, {"no": 12, "type": "single", "body": "房源表 <code>t_house</code> 的 <code>tags</code> 列是 JSON 字符串，实体用 <code>JacksonTypeHandler</code> 映射为 <code>List&lt;String&gt;</code>。现象是 <code>insert</code> 写库正常（库里确实存成了 JSON），但 <code>selectById</code> 查回来 <code>tags</code> 恒为 null。原因是？", "code": "@Data\n@TableName(\"t_house\")                                  // ← 注意这里\npublic class House {\n    @TableId(type = IdType.ASSIGN_ID)\n    private Long id;\n\n    @TableField(typeHandler = JacksonTypeHandler.class)\n    private List<String> tags;                          // DB: varchar，内容 [\"近地铁\",\"精装\"]\n}\n\n// 写入正常\nhouseMapper.insert(house);\n// 读取异常\nHouse h = houseMapper.selectById(id);\nSystem.out.println(h.getTags());   // null", "options": [{"k": "A", "t": "JacksonTypeHandler 只实现了写入方向，读取必须自己写 ResultHandler"}, {"k": "B", "t": "必须在 XML 中手写 resultMap，注解方式的 typeHandler 在任何场景下都不生效"}, {"k": "C", "t": "@TableName 需要加 autoResultMap = true，MP 才会为该实体生成携带 typeHandler 的 ResultMap 用于结果集映射；否则查询侧不走 typeHandler"}, {"k": "D", "t": "字段类型必须声明为 String，MyBatis-Plus 不支持把列映射成集合类型"}], "answer": ["C"], "explain": "考点：MyBatis-Plus typeHandler 的「写生效、读不生效」经典坑。<br>C 对：写入时 MP 生成的 insert 语句会把 <code>#{tags,typeHandler=...}</code> 直接内联到 SQL 参数上，所以 setParameter 一定走 handler；但<b>查询结果映射</b>依赖 ResultMap，MP 默认给实体生成的是不带 typeHandler 的简单映射。只有 <code>@TableName(value = \"t_house\", autoResultMap = true)</code> 才会让 MP 自动构建包含各字段 typeHandler 的 ResultMap，getResult 时才会用 Jackson 反序列化回 List。这是官方文档明确要求的组合用法。<br>A 错：JacksonTypeHandler 完整实现了 BaseTypeHandler 的四个方法，读写都支持。<br>B 错：注解方式完全可用，前提就是 autoResultMap。<br>D 错：借助 typeHandler，MP 支持 List、Map、自定义对象与 JSON 列互转，这正是它的价值所在。<br>补充：自定义 SQL（@Select / XML）时 autoResultMap 不生效，需要在 XML 里显式指定 typeHandler。", "android": "类比 Android：等同 Room 的 @TypeConverter——只写了 List→String 的转换方法而漏了 String→List 的反向方法，写库正常、读出来全是 null，方向必须成对配齐。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis-Plus 类型处理器"}, {"no": 13, "type": "single", "body": "服务接入 Nacos 配置中心，配置如下。Nacos 上 <code>order-service-prod.yaml</code>、<code>order-service.yaml</code>、<code>common.yaml</code> 三个配置里都写了 <code>pay.timeout</code>，最终注入到应用里的是哪一个？", "code": "spring:\n  application:\n    name: order-service\n  profiles:\n    active: prod\n  cloud:\n    nacos:\n      config:\n        server-addr: 10.0.0.1:8848\n        file-extension: yaml\n        namespace: 7c9f-prod-ns\n        group: ORDER_GROUP\n        shared-configs:\n          - data-id: common.yaml\n            group: DEFAULT_GROUP\n            refresh: true\n\n# Nacos 中三份配置（均在 7c9f-prod-ns 命名空间下）\n# order-service-prod.yaml  →  pay.timeout: 5000\n# order-service.yaml       →  pay.timeout: 3000\n# common.yaml              →  pay.timeout: 1000", "options": [{"k": "A", "t": "common.yaml 的 1000，shared-configs 是全局共享配置，优先级最高"}, {"k": "B", "t": "order-service.yaml 的 3000，主配置一定压过带 profile 的配置"}, {"k": "C", "t": "三份都会加载但覆盖顺序随机，取值不确定，必须删掉其中两份才能保证结果稳定"}, {"k": "D", "t": "order-service-prod.yaml 的 5000，带 profile 后缀的 dataId 在三者中优先级最高"}], "answer": ["D"], "explain": "考点：Nacos 多份配置的加载与覆盖顺序，以及 namespace/group 的隔离维度。<br>D 对：Spring Cloud Alibaba 按「后加载覆盖先加载」的顺序依次拉取——<b>shared-configs（最低） → extension-configs → ${spring.application.name}.${file-extension} → ${spring.application.name}-${profile}.${file-extension}（最高）</b>。因此 order-service-prod.yaml 的 5000 生效。<br>A 错：shared-configs / extension-configs 定位是「多服务共享的兜底配置」，优先级最低，正因如此才能被各服务自身配置覆盖。<br>B 错：带 profile 的 dataId 优先级<b>高于</b>不带 profile 的主配置，这是多环境差异化的基础。<br>C 错：顺序是完全确定的，连 shared-configs 数组内部也有明确规则（数组中靠后的覆盖靠前的），不存在随机性。<br>再理清两个隔离维度：<b>namespace 用于环境隔离</b>（dev/test/prod 各一个，配置互不可见）；<b>group 用于业务线/项目隔离</b>。注意 shared-configs 里单独写了 group: DEFAULT_GROUP，说明共享配置可以跨 group 引用，但 namespace 必须一致。", "android": "类比 Android：像资源目录的覆盖优先级 values/ &lt; values-zh/ &lt; values-zh-rCN/，越具体的限定符越优先；namespace 则相当于不同的 applicationId（debug/release 完全隔离，互不串数据）。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Nacos 配置优先级与隔离"}, {"no": 14, "type": "single", "body": "下面 Vue3 <code>&lt;script setup&gt;</code> 组件中，从 <code>reactive</code> 对象里解构出了 <code>count</code>。点击一次按钮后，模板上依次渲染出的两个数字是？", "code": "<script setup>\nimport { reactive } from 'vue'\n\nconst state = reactive({ count: 0, name: 'AI 平台' })\nlet { count } = state          // ← 解构\n\nfunction add() {\n  count++          // ①\n  state.count++    // ②\n}\n<\/script>\n\n<template>\n  <div>{{ count }} / {{ state.count }}</div>\n  <button @click=\"add\">+1</button>\n</template>", "options": [{"k": "A", "t": "1 / 1"}, {"k": "B", "t": "0 / 1"}, {"k": "C", "t": "1 / 0"}, {"k": "D", "t": "0 / 0"}], "answer": ["B"], "explain": "考点：reactive 解构导致响应性丢失。<br>B 对：<code>reactive</code> 返回的是 Proxy，响应性依附在<b>「对象 + 属性访问」</b>这条链路上——只有通过 <code>state.count</code> 触发 Proxy 的 get/set 才会被追踪。解构语句 <code>let { count } = state</code> 只是把当时的原始值 0 <b>拷贝</b>到一个普通局部变量，此后 <code>count++</code> 与 Proxy 再无关系，既不会触发依赖收集也不会触发更新。因此模板里的 <code>{{ count }}</code> 停留在 0（它渲染的是首次求值快照），而 <code>state.count</code> 正常变为 1。<br>A 错：假设了解构后仍保持响应性，这是最常见的误判。<br>C 错：state.count 的自增走的是 Proxy 的 set，必然生效并触发重渲染，不可能停留在 0。<br>D 错：同上，第二个数字一定会变成 1。<br>正确写法：<code>const { count } = toRefs(state)</code> 或 <code>const count = toRef(state, 'count')</code>，模板中会自动解包为值；若只是想读快照则无所谓。同理，把 reactive 对象整体重新赋值（<code>state = {...}</code>）也会断开响应性，必须逐属性改或改用 <code>ref</code> + <code>.value</code> 整体替换。", "android": "类比 Android：像把 LiveData/StateFlow 的当前值 <code>flow.value</code> 取出来存进一个普通 var，之后改这个 var 界面当然不会刷新——必须持有可观察对象本身，而不是它某一刻的快照。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 响应式 reactive 解构"}, {"no": 15, "type": "single", "body": "下面 Vue3 代码用 <code>calcTimes</code> 统计 computed 的计算函数被真正执行的次数。第 ④ 行输出是多少？", "code": "import { ref, computed } from 'vue'\n\nconst price = ref(100)\nconst qty   = ref(2)\nlet calcTimes = 0\n\nconst total = computed(() => {\n  calcTimes++\n  return price.value * qty.value\n})\n\nconsole.log(total.value, total.value)   // ① 200 200\nprice.value = 100                        // ② 赋一个「相同」的值\nconsole.log(total.value)                 // ③ 200\nconsole.log(calcTimes)                   // ④ = ?", "options": [{"k": "A", "t": "1"}, {"k": "B", "t": "2"}, {"k": "C", "t": "3"}, {"k": "D", "t": "4"}], "answer": ["A"], "explain": "考点：computed 的惰性求值 + 缓存机制，以及 ref 的相同值短路。<br>A 对：分三步看。① 第一次访问 <code>total.value</code> 时 computed 处于 dirty 状态，执行计算函数一次（calcTimes=1）并缓存结果；同一行第二次访问直接命中缓存，<b>不再执行</b>。② <code>price.value = 100</code> 赋的是相同值，ref 的 setter 内部用 <code>Object.is(newVal, oldVal)</code> 比较，相等则<b>直接 return，不触发依赖失效</b>，computed 不会被标记为 dirty。③ 因此第三次访问仍命中缓存。最终 calcTimes = 1。<br>B 错：把「同一行访问两次 .value」误算成计算两次，忽略了缓存命中。<br>C 错：在 B 的误判基础上又认为「赋值必然触发重算」，忽略了 ref 的相同值短路。<br>D 错：把三次访问全部计为一次计算，完全没有考虑缓存机制。<br>关键差异：computed <b>有缓存</b>，依赖未变化时多次访问零开销；而模板里调用普通 method 每次重渲染都会重新执行，这正是列表页要用 computed 而非 method 做过滤/排序的原因。<br>补充：如果把 price 换成 <code>reactive({v:100})</code> 并赋相同值，同样因为 Proxy 的 set 里有相等判断而不触发。", "android": "类比 Android：像给 StateFlow 发射一个与当前值相等的元素——StateFlow 会做去重（等价于 distinctUntilChanged），下游收集者根本不会被唤醒，UI 也不会重绘。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 computed 缓存机制"}, {"no": 16, "type": "single", "body": "某大型配置面板为性能考虑用了 <code>shallowRef</code> 存放配置对象。关于下面两个函数触发视图更新的情况，描述正确的是？", "code": "import { shallowRef, triggerRef } from 'vue'\n\nconst cfg = shallowRef({ theme: 'dark', size: 14, nested: { a: 1 } })\n\nfunction change() {\n  cfg.value.theme = 'light'          // ① 修改内部属性\n}\n\nfunction replace() {\n  cfg.value = { ...cfg.value, theme: 'light' }   // ② 整体替换 .value\n}\n\n// 模板：<div>{{ cfg.theme }}</div>", "options": [{"k": "A", "t": "① 会触发更新，② 不会触发更新"}, {"k": "B", "t": "① 和 ② 都会触发更新，shallowRef 与 ref 在响应性上没有区别"}, {"k": "C", "t": "① 和 ② 都不会触发更新，shallowRef 包裹的对象是只读的，不允许修改"}, {"k": "D", "t": "① 不会触发视图更新，只有像 ② 那样整体替换 .value 才触发；若必须原地深层修改，可调用 triggerRef(cfg) 强制触发一次"}], "answer": ["D"], "explain": "考点：shallowRef 的浅层响应边界与 triggerRef 的用途。<br>D 对：<code>ref(obj)</code> 会把对象通过 <code>reactive</code> 做<b>深层</b>代理，任意层级属性变更都能追踪；而 <code>shallowRef</code> <b>只对 .value 本身的替换做追踪</b>，内部对象保持原始未代理状态。所以 ① 改 <code>cfg.value.theme</code> 不经过任何 Proxy，依赖不会被通知；② 触发 ref 的 set，正常更新。当确实需要原地大批量修改后再统一刷新时，用 <code>triggerRef(cfg)</code> 手动强制派发一次更新，这是「批量改完只渲染一次」的性能优化写法。<br>A 错：结论完全反了。<br>B 错：两者差别正在于代理深度，shallowRef 的存在意义就是<b>跳过大对象的深度递归代理开销</b>（如 ECharts 实例、大型表格数据、第三方库对象）。<br>C 错：shallowRef 不等于 readonly，内部属性完全可以修改，只是<b>改了不通知</b>；真正的只读要用 <code>readonly()</code> 包装。<br>配套记忆：<code>shallowReactive</code> 只代理第一层属性；<code>markRaw</code> 彻底排除代理；<code>triggerRef</code> 是 shallowRef 的手动逃生舱。", "android": "类比 Android：像给 RecyclerView 的数据源 List 原地改了某个 item 的字段却没调 notifyItemChanged——数据变了但没人通知，界面纹丝不动；triggerRef 就是那句手动的 notify。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 shallowRef 浅层响应"}, {"no": 17, "type": "single", "body": "下面 TypeScript 工具函数使用了泛型约束。关于 ① ② 两行的类型检查结果，正确的是？", "code": "function pick<T, K extends keyof T>(obj: T, key: K): T[K] {\n  return obj[key]\n}\n\nconst user = { id: 1, name: 'ziroom', vip: true }\n\nconst a = pick(user, 'name')   // ①\nconst b = pick(user, 'age')    // ②", "options": [{"k": "A", "t": "① 推断为 string；② 编译报错，类型 '\"age\"' 不能赋给 '\"id\" | \"name\" | \"vip\"'"}, {"k": "B", "t": "① 推断为 any；② 编译通过，运行时返回 undefined"}, {"k": "C", "t": "① 推断为 string | number | boolean；② 编译通过但值为 undefined"}, {"k": "D", "t": "① ② 都编译报错，泛型 T 没有显式传入时无法推断"}], "answer": ["A"], "explain": "考点：泛型约束 <code>K extends keyof T</code> + 索引访问类型 <code>T[K]</code> + 字面量类型推断。<br>A 对：调用时 TS 从实参反向推断 <code>T = { id: number; name: string; vip: boolean }</code>，于是 <code>keyof T = \"id\" | \"name\" | \"vip\"</code>。① 传入 'name'，K 被推断为字面量类型 <code>\"name\"</code>，返回值 <code>T[\"name\"]</code> 精确解析为 <b>string</b>——这正是索引访问类型的价值：返回值随 key 精准变化，而不是退化成联合类型。② 'age' 不在 keyof T 中，违反约束，<b>编译期</b>直接报错，把「取了不存在的字段」的 Bug 拦在上线前。<br>B 错：泛型推断成功，不会退化为 any。<br>C 错：若函数签名写成 <code>(obj: T, key: string): T[keyof T]</code> 才会得到联合类型；用 K 约束就能精确到单个。<br>D 错：TS 支持从参数<b>自动推断</b>泛型实参，绝大多数场景无需显式写 <code>pick&lt;User, 'name'&gt;(...)</code>。", "android": "类比 Android：等同 Kotlin 的 <code>fun &lt;T, R&gt; T.pick(prop: KProperty1&lt;T, R&gt;): R</code>——用类型系统保证「字段名必须真实存在且返回类型自动对齐」，把运行时的字段名笔误变成编译期错误。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - TypeScript 泛型约束"}, {"no": 18, "type": "single", "body": "下面 TypeScript 枚举代码，① ② ③ 三行的结果依次是？", "code": "enum Status {\n  PENDING,        // 未赋值\n  PAID = 10,\n  DONE            // 未赋值\n}\nconsole.log(Status.DONE)      // ①\nconsole.log(Status[10])       // ②\n\nenum Level {\n  LOW  = 'low',\n  HIGH = 'high'\n}\nconsole.log(Level['low'])     // ③", "options": [{"k": "A", "t": "2 / 'PAID' / 'LOW'"}, {"k": "B", "t": "11 / 'PAID' / 编译报错：字符串枚举没有反向映射，'low' 不是合法索引"}, {"k": "C", "t": "11 / undefined / 'LOW'"}, {"k": "D", "t": "2 / 10 / undefined"}], "answer": ["B"], "explain": "考点：数字枚举的自增规则与双向反向映射、字符串枚举的单向性。<br>B 对：① 数字枚举成员未显式赋值时<b>在前一个成员的值上加 1</b>，PENDING=0、PAID=10、DONE=<b>11</b>（不是回到 2）。② 数字枚举编译后会生成<b>双向映射</b>：<code>obj[obj[\"PAID\"]=10]=\"PAID\"</code>，所以 <code>Status[10]</code> 得到字符串 'PAID'。③ 字符串枚举<b>只生成正向映射</b>（Level.LOW → 'low'），没有 <code>obj['low']='LOW'</code>，且 TS 编译器会直接报错「元素隐式具有 any 类型，因为索引 'low' 不存在于类型 typeof Level」。<br>A 错：DONE 应为 11；且 Level['low'] 不存在。<br>C 错：Status[10] 有反向映射，不是 undefined。<br>D 错：DONE 不是 2，Status[10] 是名称不是数值。<br>实战建议：接口状态码优先用<b>字符串枚举</b>或 <code>const enum</code>/联合字面量类型，避免数字枚举的反向映射污染对象、以及插入新成员导致后续值整体位移的兼容性事故。", "android": "类比 Android：像 Java 里用 int 常量表示状态（IntDef），中间插一个常量就把后面所有数值挤位、旧版本客户端解析错乱；Kotlin 的 enum class 带名字更安全，等价于这里推荐的字符串枚举。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - TypeScript 枚举与反向映射"}, {"no": 19, "type": "single", "body": "租房平台「免押金」业务规则整理成如下判定表（<code>-</code> 表示无关项）。按判定表法，<b>未化简</b>的完整判定表共有多少条规则？按表中已合并的形式设计用例，最少需要多少条用例即可覆盖全部条件组合？", "code": "条件桩：\n  C1 芝麻分 >= 650\n  C2 已完成实名认证\n  C3 无历史违约记录\n\n已化简判定表：\n +------+----+----+----+------------+\n | 规则 | C1 | C2 | C3 |    动作    |\n +------+----+----+----+------------+\n |  1   | Y  | Y  | Y  |  免押金    |\n |  2   | Y  | Y  | N  |  付半押    |\n |  3   | Y  | N  | -  |  付全押    |\n |  4   | N  | -  | -  |  付全押    |\n +------+----+----+----+------------+", "options": [{"k": "A", "t": "完整 8 条规则；最少 4 条用例"}, {"k": "B", "t": "完整 6 条规则；最少 3 条用例"}, {"k": "C", "t": "完整 8 条规则；仍需 8 条用例，化简只是文档表述"}, {"k": "D", "t": "完整 3 条规则；最少 4 条用例"}], "answer": ["A"], "explain": "考点：判定表法的规则数计算与无关项化简。<br>A 对：判定表未化简时规则数 = 各条件桩取值数的<b>笛卡尔积</b>，3 个二值条件即 <code>2³ = 8</code> 条规则。表中用 <code>-</code>（无关项/don't care）做了合并：规则 3 覆盖 (Y,N,Y) 与 (Y,N,N) 共 2 种，规则 4 覆盖 C1=N 时的 4 种，加上规则 1、2 各 1 种，恰好 1+1+2+4 = 8，无重叠无遗漏。因此按化简后的 4 条规则各设计 1 条用例，即可覆盖全部 8 种输入组合，最少 <b>4 条</b>。<br>B 错：6 既不是 2³ 也不是表中规则数。<br>C 错：无关项合并的意义正是<b>用更少用例达到等效覆盖</b>——当 C1=N 时无论 C2/C3 取何值动作都相同，再拆成 4 条属于冗余用例。<br>D 错：混淆了「条件桩数量」与「规则数量」。<br>方法适用性：判定表法专治<b>多条件组合决定多种动作</b>的业务规则（风控、计费、权限），比等价类更能暴露条件间的交互缺陷；条件过多时（如 6 个条件 = 64 条）应先用因果图梳理约束再化简。", "android": "类比 Android：像整理「是否已登录 × 是否会员 × 是否有网」决定首页展示哪种 UI 状态的分支表——把 if-else 嵌套画成表，才能发现漏掉的组合分支。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 判定表法"}, {"no": 20, "type": "single", "body": "「租客在线签约」功能的业务流程如下。若采用<b>场景法</b>设计用例，要求覆盖「基本流走通一次 + 每个备选流各触发一次」，最少需要设计多少个场景用例？", "code": "基本流 A：选房 → 填写资料 → 人脸核身 → 支付首款 → 签约成功\n\n备选流 B1：资料校验失败       → 回到「填写资料」\n备选流 B2：人脸核身失败       → 连续 3 次后终止流程\n备选流 B3：支付超时           → 回到「支付首款」\n备选流 B4：房源已被他人锁定   → 直接终止流程", "options": [{"k": "A", "t": "1 个，只需覆盖基本流即可，备选流属于异常测试不在场景法范围内"}, {"k": "B", "t": "4 个，每个备选流一个用例"}, {"k": "C", "t": "5 个，基本流 1 个 + 每个备选流各 1 个"}, {"k": "D", "t": "16 个，4 个备选流是否触发的全部组合 2⁴"}], "answer": ["C"], "explain": "考点：场景法（用例场景/事件流）的覆盖准则。<br>C 对：场景法把系统行为抽象为<b>基本流（成功主路径）</b>与<b>备选流（分支、异常、重入路径）</b>，每条从入口走到出口的完整路径即一个「场景」。最基本的覆盖准则是「<b>基本流 1 条 + 每条备选流至少被走到 1 次</b>」，故 1 + 4 = <b>5 个</b>场景用例，例如：场景1 全流程成功；场景2 资料校验失败后修正再成功；场景3 人脸核身连续失败 3 次终止；场景4 支付超时后重新支付成功；场景5 提交时房源已被锁定终止。<br>A 错：备选流恰恰是场景法的核心产出，主要缺陷往往藏在分支与重入路径上。<br>B 错：漏掉了纯基本流这条最重要的冒烟路径。<br>D 错：场景法<b>不做全排列</b>，穷举组合是暴力法不是场景法；只有当多个备选流之间存在明确交互风险时，才追加少量「备选流组合场景」。<br>价值：场景法贴合真实用户行为，最容易发现<b>流程串联</b>类缺陷（状态回退、重复提交、中断后数据残留），与判定表法（管规则组合）互补使用。", "android": "类比 Android：像给一个下单页画完整的状态机图——正常提交、网络中断重试、被踢下线、返回键中途退出，每条路径都要真机跑一遍，只测 happy path 的 App 上线必炸。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 场景法用例设计"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 21, "type": "multi", "body": "关于下面 <code>@Scope(\"prototype\")</code> 原型 Bean 的行为，描述<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "@Component\n@Scope(\"prototype\")\npublic class TaskBean {\n    @PostConstruct public void init()    { System.out.println(\"init\"); }\n    @PreDestroy   public void destroy()  { System.out.println(\"destroy\"); }\n}\n\n@Service\npublic class Caller {\n    @Autowired private ApplicationContext ctx;\n\n    public void run() {\n        TaskBean a = ctx.getBean(TaskBean.class);\n        TaskBean b = ctx.getBean(TaskBean.class);\n        System.out.println(a == b);\n    }\n}", "options": [{"k": "A", "t": "a == b 输出 false，每次 getBean 都会创建一个全新实例"}, {"k": "B", "t": "两次创建都会执行 @PostConstruct，控制台共打印两次 init"}, {"k": "C", "t": "容器关闭时会分别对这两个实例回调 @PreDestroy，共打印两次 destroy"}, {"k": "D", "t": "原型 Bean 不会在容器启动时预实例化，只有真正获取（getBean / 被注入）时才创建"}], "answer": ["A", "B", "D"], "explain": "考点：prototype 作用域的创建时机与「半程管理」特性。<br>A 对：prototype 的定义就是每次请求都返回新实例，两个引用不相等。<br>B 对：每个新实例都要完整走一遍初始化流程（实例化 → 属性填充 → @PostConstruct → afterPropertiesSet → initMethod），所以 init 打印两次。<br>D 对：单例默认在 refresh() 阶段被 <code>preInstantiateSingletons()</code> 预先创建（除非标注 @Lazy），而 prototype <b>一律延迟到获取时才创建</b>。<br>C 错——本题关键陷阱：<b>Spring 对原型 Bean「只管生不管养」</b>。容器创建并完成初始化后就<b>不再持有该实例的引用</b>，因此销毁回调（@PreDestroy / DisposableBean）<b>不会</b>被触发，容器关闭时一次 destroy 也不会打印。如果原型 Bean 持有连接、文件句柄等资源，必须由调用方自行释放，或注册自定义 BeanPostProcessor 记录并清理，否则会造成资源泄漏。<br>补充坑：把 prototype 注入到 singleton 字段上，只会在单例创建时注入<b>一个</b>实例并被长期复用，原型语义失效。", "android": "类比 Android：像每次 startActivity 都是新实例（对应 prototype），但系统会回调 onDestroy；而 Spring 的原型 Bean 更像你手动 new 出来的对象——GC 之外没人替你收尾，close() 得自己调。", "kaodian": "AI 后端能力 - 框架与容器层 - Bean 作用域与销毁回调"}, {"no": 22, "type": "multi", "body": "同一个切面中声明了五种通知，目标方法内部会抛出 <code>RuntimeException</code>。关于 Spring AOP 通知类型的行为，描述<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "@Aspect\n@Component\npublic class LogAspect {\n    @Pointcut(\"execution(* com.ziroom.service..*.*(..))\")\n    public void pt() {}\n\n    @Before(\"pt()\")          public void before() {}\n    @AfterReturning(pointcut = \"pt()\", returning = \"ret\")\n                             public void afterReturning(Object ret) {}\n    @AfterThrowing(pointcut = \"pt()\", throwing = \"ex\")\n                             public void afterThrowing(Exception ex) {}\n    @After(\"pt()\")           public void after() {}\n    @Around(\"pt()\")\n    public Object around(ProceedingJoinPoint p) throws Throwable { return p.proceed(); }\n}\n\n// 目标方法\npublic Order create() { throw new RuntimeException(\"库存不足\"); }", "options": [{"k": "A", "t": "在 @AfterReturning 中修改返回对象的属性，调用方是看不到这些修改的"}, {"k": "B", "t": "目标方法抛异常时 @AfterThrowing 会执行，@AfterReturning 不会执行"}, {"k": "C", "t": "@After 类似 finally，无论目标方法正常返回还是抛出异常都会执行"}, {"k": "D", "t": "五种通知中只有 @Around 能够阻止目标方法执行、修改入参并替换返回值"}], "answer": ["B", "C", "D"], "explain": "考点：五种通知类型的触发条件与能力边界。<br>B 对：@AfterReturning 只在<b>正常返回</b>时触发（并可通过 returning 绑定返回值），@AfterThrowing 只在<b>抛出匹配类型异常</b>时触发（可用 throwing 绑定异常对象），二者互斥。<br>C 对：@After 是「最终通知」，语义等同 finally，两种结局都执行，适合做资源清理、MDC 清理、耗时收尾。<br>D 对：只有 @Around 持有 <code>ProceedingJoinPoint</code>，可以决定<b>是否调用 proceed()</b>（不调即拦截，常用于限流、缓存命中直接返回）、可以用 <code>proceed(Object[] args)</code> 替换入参、也可以包装或替换返回值；其余四种通知只能「旁观」，无法干预流程。<br>A 错：@AfterReturning 拿到的是与调用方<b>同一个对象引用</b>，修改其属性（如手机号脱敏、补充冗余字段）对调用方<b>完全可见</b>；它真正做不到的是「把 returning 参数重新指向另一个新对象」来替换返回值——那只会改变局部变量。这正是「字段脱敏可以用 @AfterReturning、包装统一响应体必须用 @Around」的原因。<br>顺序补充（Spring 5.2.7+ 同一切面内）：@Around 前置 → @Before → 目标 → @AfterReturning/@AfterThrowing → @After → @Around 后置（异常时 @Around 后置不执行）。", "android": "类比 Android：@Around 相当于 OkHttp 的 Interceptor（能改 Request、能不发请求直接返回缓存 Response），其余通知更像 EventListener 回调——只能观察 callStart/callEnd/callFailed，改不了请求本身。", "kaodian": "AI 后端能力 - 框架与容器层 - AOP 通知类型与能力边界"}, {"no": 23, "type": "multi", "body": "关于 Spring 解决单例循环依赖的三级缓存机制，下列说法<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "// DefaultSingletonBeanRegistry 中的三个 Map\nMap<String, Object> singletonObjects             = new ConcurrentHashMap<>(256); // 一级\nMap<String, Object> earlySingletonObjects        = new ConcurrentHashMap<>(16);  // 二级\nMap<String, ObjectFactory<?>> singletonFactories = new HashMap<>(16);            // 三级\n\n@Service public class A { @Autowired private B b; }\n@Service public class B { @Autowired private A a; }", "options": [{"k": "A", "t": "三级缓存能解决的是<b>单例作用域 + setter/字段注入</b>形式的循环依赖，A、B 最终都能被正常创建"}, {"k": "B", "t": "第三级缓存存放的是 ObjectFactory（lambda），作用是在真正需要时才生成早期引用，从而保证 AOP 代理对象与最终注入对象是同一个"}, {"k": "C", "t": "@Scope(\"prototype\") 的 Bean 之间循环依赖 Spring 无法解决，会直接抛出 BeanCurrentlyInCreationException"}, {"k": "D", "t": "如果把 A、B 都改成构造器注入，三级缓存同样可以解决，只是 Bean 的创建顺序会自动调整"}], "answer": ["A", "B", "C"], "explain": "考点：三级缓存的适用边界与设计动机。<br>A 对：核心前提是「<b>实例已经创建出来、只是属性还没填完</b>」。创建 A 时先 new 出 A 的空壳并把工厂放入三级缓存，填充属性发现要 B → 创建 B → B 填充时要 A → 从三级缓存拿到 A 的早期引用完成注入 → B 创建完成 → A 拿到 B 完成注入。<br>B 对：这是三级缓存<b>为什么不能只有两级</b>的关键。若直接把裸对象放二级缓存，当 A 需要被 AOP 代理时，B 注入的将是<b>未代理的原始对象</b>，而容器里最终是代理对象，同一个 Bean 出现两个版本。用 ObjectFactory 延迟到「真被循环引用时」再调用 <code>getEarlyBeanReference()</code> 提前生成代理，就保证了引用唯一。<br>C 对：prototype 不进单例池，Spring 无法缓存半成品，检测到循环即抛 BeanCurrentlyInCreationException。<br>D 错：构造器注入要求依赖在<b>实例化那一刻</b>就绪，此时对象还没 new 出来，压根没有「早期引用」可放入三级缓存，因此三级缓存<b>无能为力</b>，必然启动失败（这也是 Spring Boot 2.6+ 默认禁止循环依赖、同时又推荐构造器注入的原因——它能让设计缺陷在启动期就暴露）。破解只能靠 @Lazy 打断或重构解耦。", "android": "类比 Android：像两个 Presenter 互相持有对方——若在构造函数里传（构造器注入）必死循环；改成 new 完之后再 setXxx 互相赋值（setter 注入）就能成立，Spring 三级缓存做的就是这件事的自动化版本。", "kaodian": "AI 后端能力 - 框架与容器层 - 三级缓存与循环依赖原理"}, {"no": 24, "type": "multi", "body": "关于下面这段 MyBatis-Plus 条件构造器代码，说法<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "String city = request.getCity();     // 可能为空串或 null\nString day  = request.getDay();      // 用户可控入参\n\nLambdaQueryWrapper<Order> w = Wrappers.<Order>lambdaQuery()\n    .eq(Order::getStatus, status)\n    .eq(StringUtils.isNotBlank(city), Order::getCity, city)                  // ①\n    .apply(\"date_format(create_time,'%Y-%m-%d') = {0}\", day)                 // ②\n    .last(\"limit 10\");                                                        // ③\n\nList<Order> list = orderMapper.selectList(w);", "options": [{"k": "A", "t": "① 使用了带 condition 布尔参数的 eq 重载，city 为空时该条件不会被拼进 SQL，是动态查询的推荐写法"}, {"k": "B", "t": "若把 ① 改写成 eq(Order::getCity, null)，MP 会自动生成 city IS NULL 条件"}, {"k": "C", "t": "② 中的 {0} 会被转换成 JDBC 预编译占位符 ?，参数以绑定变量方式传入，可避免 SQL 注入；若改成字符串拼接 day 则存在注入风险"}, {"k": "D", "t": "③ last 拼接的内容<b>不会</b>被参数化处理，而是原样追加到 SQL 末尾，因此绝不能把用户输入直接传进去"}], "answer": ["A", "C", "D"], "explain": "考点：Wrapper 的 condition 重载、apply 占位符安全性、last 的原样拼接风险。<br>A 对：MP 几乎所有条件方法都有 <code>(boolean condition, ...)</code> 重载，condition 为 false 时该条件<b>整段不参与拼接</b>。这比在外面写 if 更简洁，是动态查询的标准写法。<br>C 对：<code>apply</code> 的 <code>{0}</code>、<code>{1}</code> 会被 MP 替换为 MyBatis 的 <code>#{...}</code> 预编译占位，走 PreparedStatement 绑定变量，天然防注入；而 <code>apply(\"... = '\" + day + \"'\")</code> 这种字符串拼接则是标准注入漏洞。<br>D 对：<code>last</code> 的设计就是「把这段字符串<b>原封不动</b>缀在 SQL 最后」，不做任何转义与参数化，官方明确警示存在注入风险；分页应优先用 <code>Page</code> 分页插件而不是 last(\"limit ...\")。另外 last 只能调用一次，多次调用后者覆盖前者。<br>B 错：<code>eq(Order::getCity, null)</code> 生成的是 <code>city = ?</code> 并绑定 null，而 SQL 中 <code>= NULL</code> 结果恒为 UNKNOWN，<b>永远匹配不到任何行</b>（SQL 三值逻辑的必然结果，不是 MP 的 bug）。要判空必须显式调用 <code>isNull(Order::getCity)</code>。<br>额外提醒：② 中对 create_time 使用了函数，会导致该列上的索引失效，生产环境应改写成 <code>create_time &gt;= ? AND create_time &lt; ?</code> 的范围查询。", "android": "类比 Android：等同 Room 里手拼 rawQuery 字符串 vs 用 ? 绑定参数——last() 就是那个危险的字符串拼接口子，能不用就不用。", "kaodian": "AI 后端能力 - 数据库与ORM层 - MyBatis-Plus Wrapper 安全用法"}, {"no": 25, "type": "multi", "body": "服务接入 Nacos 配置中心，在 Nacos 控制台修改 <code>pay.timeout</code> 与 <code>pay.channel</code> 并发布后，关于下面代码的动态刷新效果，说法<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "@RestController\n@RefreshScope\npublic class PayController {\n\n    @Value(\"${pay.timeout:3000}\")\n    private int timeout;                    // ①\n\n    @Value(\"${pay.channel}\")\n    private static String channel;          // ② 注意 static\n\n    @Autowired\n    private PayProps props;                 // ③\n}\n\n@Component\n@ConfigurationProperties(prefix = \"pay\")\n@Data\npublic class PayProps {\n    private Integer timeout;\n    private String  channel;\n}", "options": [{"k": "A", "t": "① 能够刷新：@RefreshScope 让该 Bean 在收到配置变更事件后销毁并在下次访问时重建，重建过程重新完成 @Value 注入"}, {"k": "B", "t": "② 不会刷新，而且从一开始就注入失败：Spring 不会向 static 字段注入 @Value，其值恒为 null，加 @RefreshScope 也无济于事"}, {"k": "C", "t": "只要在 Nacos 上发布了配置，容器内所有 @Value 字段都会自动感知新值，@RefreshScope 只是一个可选的性能优化"}, {"k": "D", "t": "③ 使用 @ConfigurationProperties 的 Bean 会由 ConfigurationPropertiesRebinder 自动重新绑定，无需额外标注 @RefreshScope"}], "answer": ["A", "B", "D"], "explain": "考点：Nacos / Spring Cloud 动态配置刷新的生效条件。<br>A 对：@RefreshScope 本质是一个作用域代理。配置变更时 Nacos 客户端发布 RefreshEvent，<code>RefreshScope.refreshAll()</code> 清空该作用域缓存并销毁旧实例，下次通过代理访问时重新走一遍完整创建流程，@Value 因此拿到新值。<br>B 对：@Value / @Autowired 基于 <b>AutowiredAnnotationBeanPostProcessor 对实例字段</b>的反射注入，static 属于类而非实例，Spring 会直接跳过（日志级别低时甚至无告警），字段恒为 null。想给静态字段赋值只能借助 setter 方法注入或在 @PostConstruct 中手动赋值。<br>D 对：@ConfigurationProperties 的 Bean 由 <code>ConfigurationPropertiesRebinder</code> 监听 EnvironmentChangeEvent 并执行 rebind，属性会被重新绑定——这正是<b>推荐用 @ConfigurationProperties 而非 @Value 承载动态配置</b>的原因（类型安全、批量刷新、不必处处加 @RefreshScope）。<br>C 错：普通单例 Bean 的 @Value 只在<b>创建时注入一次</b>，即使 Environment 里的值已经更新，已经注入到字段上的值也不会自动跟着变，必须靠 @RefreshScope 重建 Bean 或改用 @ConfigurationProperties 重绑定。<br>使用告警：@RefreshScope 刷新会重建 Bean 实例，若 Bean 内持有本地缓存、连接、定时任务或有状态计数，重建会丢状态甚至泄漏资源，应把动态配置抽到独立的轻量配置 Bean 中。", "android": "类比 Android：像远程配置（Remote Config）下发新值后，只有重新调用 getString() 的地方才拿到新配置；那些在 Application.onCreate 里读一次就缓存进静态字段的值，不重启进程永远是旧的。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Nacos 动态配置刷新"}, {"no": 26, "type": "multi", "body": "Vue3 中用 <code>watch</code> 侦听不同类型的数据源，下列关于四行代码行为的描述<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "import { reactive, ref, watch } from 'vue'\n\nconst state = reactive({ user: { name: 'a' }, count: 0 })\nconst num = ref(0)\n\nwatch(state.count, (v) => console.log('①', v))        // ①\nwatch(() => state.count, (v) => console.log('②', v)) // ②\nwatch(state, () => console.log('③'))                 // ③\nwatch(num, (v) => console.log('④', v))               // ④", "options": [{"k": "A", "t": "① 无效：state.count 取出来已经是一个普通 number，不是响应式引用，开发环境下 Vue 会打印「Invalid watch source」警告"}, {"k": "B", "t": "② 有效：用 getter 函数包一层是侦听 reactive 对象某个属性的正确写法"}, {"k": "C", "t": "③ 有效，且直接侦听一个 reactive 对象时会<b>隐式开启深层侦听</b>，修改 state.user.name 也会触发回调"}, {"k": "D", "t": "④ 无效：侦听 ref 必须写成 watch(() => num.value, ...)，直接传 ref 不会建立依赖"}], "answer": ["A", "B", "C"], "explain": "考点：watch 侦听源（source）的四种合法形式与常见误用。<br>合法的侦听源只有四类：<b>ref、reactive 对象、getter 函数、以及由它们组成的数组</b>。<br>A 对：<code>state.count</code> 在传参那一刻就<b>求值成了原始数字 0</b>，传给 watch 的是个 number 而非可追踪对象，Vue 无法建立依赖，开发环境会告警 <code>Invalid watch source</code>。这是新手最高频的错误。<br>B 对：用 <code>() =&gt; state.count</code> 包成 getter，Vue 在 effect 中执行它，访问属性时触发 Proxy 的 get 完成依赖收集，属性变化时重新求值并比较，是侦听「响应式对象某个属性」的标准解法。<br>C 对：<b>直接侦听 reactive 对象时 deep 会被隐式置为 true</b>（源码中对 isReactive(source) 有专门处理），因此深层属性变化也会触发；代价是深度遍历开销大，大对象上应改用 getter 精确侦听具体字段。<br>D 错：ref 本身就是合法侦听源，<code>watch(num, cb)</code> 完全有效，Vue 内部会自动读取其 <code>.value</code>；写成 getter 只是等价的另一种形式，并非必需。<br>再补一个细节：侦听 reactive 对象时回调里的 newValue 与 oldValue 是<b>同一个引用</b>（因为是原地修改），需要旧值快照必须自己深拷贝，或改用 getter 返回原始值。", "android": "类比 Android：像 observe 一个 LiveData 对象本身，而不是 observe 它当前的 value——传值进去等于传了个死数据，永远收不到后续更新。", "kaodian": "AI 前端能力 - 框架与组件 - Vue3 watch 侦听源"}, {"no": 27, "type": "multi", "body": "「退租结算」接口的需求如下。关于该接口的测试用例设计与断言方式，说法<b>正确</b>的有？（多选、少选、错选均不得分）", "code": "POST /api/lease/settle\nContent-Type: application/json\n\n入参：\n  leaseId    必填，合同号\n  endDate    必填，退租日期，不得早于起租日\n  deduction  选填，扣款金额，范围 0 ~ 99999.99（两位小数）\n\n业务规则：\n  仅当合同状态为 EFFECTIVE 时允许结算\n  结算金额 = 已付租金 - 实际消费 - deduction\n  结算成功后合同状态置为 SETTLED", "options": [{"k": "A", "t": "只要接口返回 HTTP 200 就可以判定用例通过，响应体中的业务字段无需断言"}, {"k": "B", "t": "「合同状态是否为 EFFECTIVE」与「endDate 是否合法」两个条件决定不同处理动作，可用判定表法组合出 4 条规则来设计用例"}, {"k": "C", "t": "必须设计幂等性用例：对同一个 leaseId 连续调用两次，第二次应返回明确的业务错误而不能二次扣款、二次改状态"}, {"k": "D", "t": "应覆盖 deduction 传 \"abc\"、传三位小数、传超出上限值等异常输入，验证参数校验与错误码是否符合接口文档"}], "answer": ["B", "C", "D"], "explain": "考点：接口测试的用例设计方法选择、幂等性验证与断言充分性。<br>B 对：两个二值条件组合共 2×2 = 4 条规则（状态有效+日期合法 → 结算成功；状态有效+日期非法 → 参数错误；状态无效+日期合法 → 业务拒绝；状态无效+日期非法 → 需明确校验优先级返回哪个错误）。<b>最后一条尤其有价值</b>，它能暴露「参数校验与业务校验孰先孰后」这类文档没写清的隐性缺陷，正是判定表法的强项。<br>C 对：结算涉及资金与状态流转，属于典型的<b>必须幂等</b>的写接口。网络重试、用户连点、MQ 重投都会造成重复调用，第二次必须依据状态机（已是 SETTLED）拒绝，否则重复扣款直接构成资损。<br>D 对：类型错误、精度越界、边界外取值都属于参数校验用例，需断言 HTTP 状态码 + 业务错误码 + 错误提示三者一致。<br>A 错：这是接口自动化最典型的「假通过」。很多框架在业务失败时仍返回 HTTP 200，而把失败信息放在 body 的 <code>code: 5001</code> 里，只断言状态码会让用例形同虚设。<b>断言必须下沉到响应体的业务字段</b>（code / data 关键值），资金类接口还应追加数据库落库校验（结算金额、合同状态），做到接口层与数据层双重断言。<br>顺带一提定级：若测出「重复结算导致二次扣款」，虽然触发路径不常见，但因造成资金损失且难以自动恢复，严重度应判为致命/严重级别，必须在本版本修复而不能顺延。", "android": "类比 Android：像客户端支付回调重试——服务端不幂等就会重复下单；测端到端时只看「请求没报错」远远不够，必须核对订单表最终只有一条记录、金额分文不差。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 接口用例设计与幂等验证"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 28, "type": "judge", "body": "阅读下面配置类。判断：由于设置了 <code>proxyBeanMethods = false</code>，<code>jdbcTemplate()</code> 内部调用 <code>dataSource()</code> 会真正再执行一次方法体、生成一个<b>新的、不受容器管理</b>的 HikariDataSource 实例，于是 jdbcTemplate 持有的连接池与容器中注册的 dataSource Bean 并不是同一个对象。", "code": "@Configuration(proxyBeanMethods = false)\npublic class AppConfig {\n\n    @Bean\n    public DataSource dataSource() {\n        HikariDataSource ds = new HikariDataSource();\n        ds.setJdbcUrl(\"jdbc:mysql://10.0.0.2:3306/ziroom\");\n        ds.setMaximumPoolSize(20);\n        return ds;\n    }\n\n    @Bean\n    public JdbcTemplate jdbcTemplate() {\n        return new JdbcTemplate(dataSource());   // ← 方法内直接调用另一个 @Bean 方法\n    }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：@Configuration 的 Full 模式与 Lite 模式（proxyBeanMethods）。<br>判断正确。<b>proxyBeanMethods = true（默认，Full 模式）</b>时，Spring 用 CGLIB 为配置类生成子类代理，拦截所有 @Bean 方法调用：发现容器中已有该 Bean 就直接返回容器实例，因此 <code>dataSource()</code> 在 jdbcTemplate() 里被调用时返回的是<b>同一个单例</b>，方法体不会重复执行。<br><b>proxyBeanMethods = false（Lite 模式）</b>时不生成代理，<code>dataSource()</code> 退化为一次普通的 Java 方法调用，方法体被真实执行，new 出第二个 HikariDataSource。这个对象没有经过容器注册，不参与生命周期管理、不会被 AOP 增强、销毁时也不会被关闭——对连接池而言意味着<b>多出一份连接资源且永不回收</b>，是典型的隐性泄漏。<br>正确写法：把依赖改为<b>方法参数注入</b> <code>public JdbcTemplate jdbcTemplate(DataSource ds) { return new JdbcTemplate(ds); }</code>，此时无论 Full 还是 Lite 模式，Spring 都会把容器中的单例作为参数传入，既安全又能省掉 CGLIB 代理的启动开销（Spring Boot 内置的自动配置类大量使用 Lite 模式正是为了加快启动）。", "android": "类比 Android：像在 Dagger 的 @Module 里不通过参数注入，而是在 provideX() 内部直接 new 一个 Retrofit——绕过了组件的单例作用域，最后 App 里飘着两个连接池，内存和 socket 双份消耗。", "kaodian": "AI 后端能力 - 框架与容器层 - @Configuration 代理模式"}, {"no": 29, "type": "judge", "body": "阅读下面事务代码。判断：因为外层已经用 <code>try-catch</code> 捕获了内层抛出的异常，所以 <code>main()</code> 能够正常提交，订单数据会成功写入数据库。", "code": "@Service\npublic class OrderService {\n    @Autowired private PointService pointService;\n\n    @Transactional\n    public void main(Order o) {\n        orderMapper.insert(o);\n        try {\n            pointService.addPoint(o.getUserId());   // 跨 Bean 调用，走代理\n        } catch (Exception e) {\n            log.warn(\"积分服务异常，已忽略\", e);       // 吞掉异常继续往下走\n        }\n    }\n}\n\n@Service\npublic class PointService {\n    @Transactional(propagation = Propagation.REQUIRED)\n    public void addPoint(Long uid) {\n        pointMapper.insert(new Point(uid, 10));\n        throw new RuntimeException(\"积分服务异常\");\n    }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：REQUIRED 传播下的「全局回滚标记」与 UnexpectedRollbackException。<br>判断错误。<code>Propagation.REQUIRED</code> 表示内层<b>加入外层已存在的事务</b>，两者共用同一个物理事务、同一个数据库连接，只是逻辑上分了两层。当 addPoint 抛出 RuntimeException 时，内层的事务拦截器在退出前会把该事务标记为 <b>rollback-only</b>（TransactionStatus.setRollbackOnly）。<br>外层虽然 catch 住了异常、代码正常走完，但在提交阶段 Spring 检查到 rollback-only 标记，会拒绝提交、执行整体回滚，并抛出 <code>UnexpectedRollbackException: Transaction rolled back because it has been marked as rollback-only</code>。最终<b>订单和积分一条都写不进去</b>，而且调用方还会收到一个意料之外的异常——这正是「try-catch 了却依然回滚」这类线上疑难问题的根因。<br>正确解法有两种：① 若积分失败<b>不应影响</b>主流程，把 addPoint 声明为 <code>Propagation.REQUIRES_NEW</code>，让它挂起外层、开独立事务，自己失败自己回滚，外层照常提交；② 若积分是弱依赖，直接改为异步消息（MQ）或事务提交后的 @TransactionalEventListener(AFTER_COMMIT) 触发，彻底解耦。<br>记忆要点：<b>同一物理事务内，任何一层标记回滚，全局就必须回滚，catch 也救不回来。</b>", "android": "类比 Android：像 SQLite 嵌套事务——内层 endTransaction 时没调 setTransactionSuccessful，外层无论如何努力，最终整个事务照样整体回滚，因为它们本来就是同一个事务。", "kaodian": "AI 后端能力 - 框架与容器层 - 事务回滚标记与传播"}, {"no": 30, "type": "judge", "body": "工程使用 Spring Cloud 2021.x + Spring Cloud Alibaba，依赖中<b>只引入了</b> <code>spring-cloud-starter-alibaba-nacos-config</code>，并把 Nacos 地址写在 <code>application.yml</code> 中。判断：这样配置可以正常从 Nacos 拉取远程配置，因为 application.yml 和 bootstrap.yml 是等价的。", "code": "<!-- pom.xml：仅此一个配置中心相关依赖 -->\n<dependency>\n  <groupId>com.alibaba.cloud</groupId>\n  <artifactId>spring-cloud-starter-alibaba-nacos-config</artifactId>\n</dependency>\n\n# application.yml\nspring:\n  application:\n    name: order-service\n  cloud:\n    nacos:\n      config:\n        server-addr: 10.0.0.1:8848\n        file-extension: yaml", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：Spring Cloud 2020.0 之后 bootstrap 上下文默认关闭。<br>判断错误。两者<b>不等价</b>，加载时机完全不同：<code>bootstrap.yml</code> 由独立的 Bootstrap 上下文<b>先于</b> application.yml 解析，配置中心的地址必须在这一阶段就绪，才来得及在应用上下文启动前把远程配置拉下来并加入 Environment。<br>关键变化：<b>从 Spring Cloud 2020.0 起，Bootstrap 上下文默认被禁用</b>。若只引 nacos-config 而把地址写在 application.yml 里，等到 application.yml 被解析时配置加载阶段其实已经过去了，客户端拿不到 server-addr，远程配置自然拉不下来，表现为 @Value 全部走默认值或启动报占位符无法解析。<br>两种正确做法：<br>① <b>沿用 bootstrap 方式</b>——额外引入 <code>spring-cloud-starter-bootstrap</code>，并把 spring.application.name 与 nacos config 相关配置移到 <code>bootstrap.yml</code>；<br>② <b>使用新的 Config Data 方式</b>——在 application.yml 中写 <code>spring.config.import: nacos:order-service.yaml?refresh=true</code>（可配合 <code>optional:</code> 前缀避免 Nacos 不可用时启动失败），这是官方推荐的新范式。<br>排查提示：遇到「本地能跑、上环境读不到配置」时，先确认 bootstrap starter 是否引入、配置写在了哪个文件。", "android": "类比 Android：像在 Application.onCreate 里初始化埋点 SDK，却把它需要的 AppKey 放在了首个 Activity 的 onCreate 里赋值——顺序颠倒，SDK 初始化那一刻永远拿到空值。", "kaodian": "AI 后端能力 - 高并发与中间件层 - Nacos 配置加载时机"}, {"no": 31, "type": "judge", "body": "阅读下面代码（启动类已加 <code>@EnableAsync</code>，asyncService 为跨 Bean 调用）。判断：<code>writePoint</code> 在独立线程中执行，事务上下文不会随线程传递，它会开启一条<b>全新的独立事务</b>；因此外层 <code>create</code> 回滚时积分数据不会被回滚，可能出现「订单没了、积分还在」的数据不一致。", "code": "@Service\npublic class OrderService {\n    @Autowired private AsyncService asyncService;\n\n    @Transactional\n    public void create(Order o) {\n        orderMapper.insert(o);\n        asyncService.writePoint(o.getUserId());   // 异步调用\n        throw new RuntimeException(\"库存不足\");     // 外层回滚\n    }\n}\n\n@Service\npublic class AsyncService {\n    @Async\n    @Transactional\n    public void writePoint(Long uid) {\n        pointMapper.insert(new Point(uid, 10));\n    }\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：@Async 的线程切换与事务上下文的 ThreadLocal 绑定。<br>判断正确。Spring 的声明式事务依赖 <code>TransactionSynchronizationManager</code>，它内部用 <b>ThreadLocal</b> 保存当前线程绑定的 ConnectionHolder 与事务状态。@Async 方法由 TaskExecutor 派发到<b>另一条线程</b>执行，新线程的 ThreadLocal 是空的，看不到调用方的事务上下文。<br>因此 writePoint 上的 @Transactional 会走「当前无事务 → REQUIRED → 新建事务」的分支，用另一条数据库连接开启独立事务并各自提交；外层 create 的回滚只作用于自己那条连接。加之异步调用是<b>非阻塞</b>的——create 抛异常时 writePoint 可能刚开始、可能已提交，结果甚至是不确定的，这让问题更难复现。<br>规避方案：① 把「发积分」改为在事务<b>提交成功后</b>再触发，用 <code>@TransactionalEventListener(phase = AFTER_COMMIT)</code>（可同时加 @Async 保持异步）；② 用可靠消息（本地消息表 / MQ 事务消息）保证最终一致；③ 若必须强一致，就<b>不要异步</b>，让它在同一事务内同步执行。<br>顺带记住 @Async 的另外三个坑：同类自调用失效、返回值只能是 void / Future / CompletableFuture、默认线程池 SimpleAsyncTaskExecutor <b>不复用线程</b>，生产必须自定义线程池。", "android": "类比 Android：像在 SQLite 事务里 post 一个任务到线程池写另一张表——子线程用的是另一个连接，主线程回滚了它照样落盘，最终两张表对不上。", "kaodian": "AI 后端能力 - 框架与容器层 - @Async 与事务上下文传递"}, {"no": 32, "type": "judge", "body": "阅读下面 TypeScript 代码。判断：① 行会编译报错，② 行可以编译通过，③ 行经过 <code>typeof</code> 类型收窄后也可以编译通过。", "code": "let a: unknown = 'hello'\nlet b: string = a            // ①\n\nlet c: any = 'hello'\nlet d: string = c            // ②\n\nif (typeof a === 'string') {\n  let e: string = a          // ③ 收窄后赋值\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "考点：unknown 与 any 的类型安全差异、类型收窄（narrowing）。<br>判断正确。<br>① 报错：<code>unknown</code> 是「类型安全版的 any」——<b>任何类型都可以赋值给 unknown，但 unknown 不能赋值给除 unknown / any 之外的任何类型</b>。这里 <code>let b: string = a</code> 会得到「不能将类型 'unknown' 分配给类型 'string'」的编译错误。<br>② 通过：<code>any</code> 直接<b>关闭类型检查</b>，可以双向自由赋值，也可以随意访问任意属性、调用任意方法。代价是把错误全部推迟到运行时，本质上是在类型系统上开了个洞。<br>③ 通过：TypeScript 的控制流分析会依据 <code>typeof a === 'string'</code> 这个类型守卫，在该分支内把 a 的类型<b>收窄</b>为 string，因此赋值合法。这正是 unknown 的正确用法——强制开发者在使用前先做类型判断。<br>实战建议：接口返回值、<code>JSON.parse()</code>、<code>catch (e)</code>（TS 4.4+ 的 <code>useUnknownInCatchVariables</code>）等来源不明的数据应标注为 unknown 而非 any，再配合 typeof / instanceof / <code>in</code> 运算符 / 自定义类型谓词 <code>(x): x is Foo</code> 收窄，让类型系统真正发挥防护作用。", "android": "类比 Android：unknown 像 Kotlin 的 <code>Any?</code>——必须先 <code>is</code> 判断智能转换才能用；any 则像 Java 里到处强转 Object，编译期一路绿灯，运行期 ClassCastException 等着你。", "kaodian": "AI 前端能力 - 前端基础与渲染引擎 - TypeScript unknown 与类型收窄"}, {"no": 33, "type": "judge", "body": "「房源筛选」功能有 3 个筛选因素，每个因素各有 3 个取值。判断：采用<b>正交实验法</b>设计测试用例时，必须覆盖 3×3×3 = 27 种全组合，才能保证任意两个因素的取值两两组合都被覆盖到。", "code": "被测功能：房源列表筛选\n\n因素 A 区域      ：朝阳 / 海淀 / 丰台\n因素 B 户型      ：一居 / 两居 / 三居\n因素 C 价格区间  ：3000以下 / 3000-6000 / 6000以上\n\n全组合数 = 3 × 3 × 3 = 27", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "考点：正交实验法（正交表 / Pairwise 组合测试）的目标与用例规模。<br>判断错误。27 是<b>全组合穷举</b>（笛卡尔积）的数量，而正交实验法的核心价值恰恰是<b>用远少于全组合的用例，达到「任意两因素的水平两两组合至少出现一次」的覆盖度</b>。<br>本例 3 因素 3 水平，选用正交表 <code>L9(3⁴)</code>（可容纳最多 4 个因素、每因素 3 水平，共 <b>9 行</b>），取其中 3 列分别对应 A/B/C，即 <b>9 条用例</b>即可满足两两组合覆盖，用例量降为全组合的三分之一。<br>正交表的两条数学性质保证了覆盖均衡：① <b>每列中各水平出现次数相同</b>（均匀分散）；② <b>任意两列的水平组合出现次数相同</b>（整齐可比）。<br>适用与局限：正交法适合<b>因素多、水平多、组合爆炸</b>且缺陷主要由「两两交互」引发的场景（配置项组合、多条件筛选、浏览器/OS 兼容矩阵）；它<b>不保证</b>三因素及以上的高阶交互被覆盖，对于强业务耦合的关键组合，应在正交用例基础上人工补充。工程上常用 PICT、AllPairs 等工具自动生成，无需手查正交表。<br>对照记忆：判定表法追求「规则完备」，正交法追求「用少量用例换取两两覆盖」，二者解决的问题不同。", "android": "类比 Android：像做机型兼容测试——厂商 × 系统版本 × 屏幕尺寸全组合上百种根本跑不完，实际是用 Pairwise 挑出十几台覆盖两两组合的机型，性价比最高。", "kaodian": "AI 质量保障 - 软件测试理论与质量体系 - 正交实验法"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+q.no+'" data-no="'+q.no+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+q.no+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div>'
            + '<div class="android"><span class="label">Android 类比：</span>'+q.android+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q.no==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=document.querySelector('.card[data-no="'+btn.dataset.no+'"]'); gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  ans.querySelector('.ans').textContent='答案：'+(q.type==='fill'? q.answerText : q.answer.join('、'));
  ans.classList.add('show');
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  if(!isAnswered(card)){ if(!confirm('本题还没作答，将按答错处理并展示答案。')) return; }
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
