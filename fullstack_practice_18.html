<script type="application/json" id="quizData">{"id": "vol18", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "本卷按真题思路重做（2026-08-13）：每题给代码/配置/日志片段，考读代码判行为/补全/规范正误。分布 后端11/前端11/测试11，知识点对齐认证考纲（11/11/11 均分）。", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "用 Canal 订阅 binlog 来维护缓存，这种方案的主要优点是？", "code": "MySQL binlog --> Canal --> MQ --> 缓存更新服务 --> Redis DEL/SET", "options": [{"k": "A", "t": "业务代码无需侵入缓存删除逻辑，以数据库变更为唯一事实来源，降低漏删风险"}, {"k": "B", "t": "能做到缓存与数据库强一致，完全没有延迟"}, {"k": "C", "t": "可以完全替代 Cache-Aside，不需要任何回源逻辑"}, {"k": "D", "t": "Canal 方案不需要考虑消息重复与顺序问题"}], "answer": "A", "explain": "binlog 订阅把「谁改了数据就负责删缓存」这件事从散落在各处的业务代码中抽离，统一由订阅端处理，避免某处忘记删缓存导致长期脏数据，也天然覆盖了直接改库、定时任务等旁路写入。但它仍是最终一致（存在 binlog 解析与消息投递延迟，B 错）；缓存未命中依然要回源查库（C 错）；消息可能重复投递、同一行的多次变更要保证顺序（按主键分区），必须设计幂等（D 错）。", "kaodian": "AI后端能力-高并发与中间件层-binlog订阅维护缓存"}, {"no": 2, "type": "single", "body": "存 emoji 表情时报错「Incorrect string value: '\\xF0\\x9F...'」，正确的解法是？", "code": "CREATE TABLE t_msg (\n  content VARCHAR(500)\n) DEFAULT CHARSET=utf8;", "options": [{"k": "A", "t": "改成 latin1 字符集能存更多字符"}, {"k": "B", "t": "把字符集改为 utf8mb4（并同步连接串与列级字符集），因为 MySQL 的 utf8 实际只支持 3 字节"}, {"k": "C", "t": "把 VARCHAR 长度加大即可"}, {"k": "D", "t": "在代码里把 emoji 过滤掉是唯一方案"}], "answer": "B", "explain": "MySQL 的 utf8 是历史遗留的 utf8mb3，每字符最多 3 字节，而 emoji 与部分生僻字属于 4 字节字符，因此插入失败。解法是把库/表/列字符集与连接字符集统一改为 utf8mb4（排序规则常用 utf8mb4_general_ci 或 utf8mb4_0900_ai_ci），注意索引长度限制（utf8mb4 下单列索引前缀最长 191 字符时用 767 字节限制的旧版本需留意）。加长度、过滤字符、换 latin1 都不解决根因。", "kaodian": "AI后端能力-数据存储与ORM层-字符集utf8mb4"}, {"no": 3, "type": "single", "body": "下列初始化方法的执行顺序是？", "code": "public class A implements InitializingBean {\n  @Autowired B b;\n  public A(){ System.out.println(\"1 构造\"); }\n  @PostConstruct public void init(){ System.out.println(\"2\"); }\n  public void afterPropertiesSet(){ System.out.println(\"3\"); }\n}", "options": [{"k": "A", "t": "2 → 1 → 3"}, {"k": "B", "t": "顺序不确定，取决于 Bean 名称"}, {"k": "C", "t": "1 构造 → 依赖注入 → 2 @PostConstruct → 3 afterPropertiesSet"}, {"k": "D", "t": "1 → 3 → 2"}], "answer": "C", "explain": "Spring Bean 生命周期：实例化（构造器，此时依赖还未注入，所以构造器里用 @Autowired 字段会 NPE）→ 属性填充（依赖注入）→ BeanNameAware 等回调 → @PostConstruct（由 CommonAnnotationBeanPostProcessor 处理）→ InitializingBean.afterPropertiesSet → 自定义 init-method。销毁时对应 @PreDestroy → DisposableBean.destroy。", "kaodian": "AI后端能力-应用框架层-Bean初始化顺序"}, {"no": 4, "type": "single", "body": "Kafka 消费者日志频繁出现 rebalance 且提交位移失败，最可能的原因是？", "code": "max.poll.records=500\nmax.poll.interval.ms=300000   // 5 分钟\n// 单条处理耗时 2s，一批 500 条 ≈ 1000s", "options": [{"k": "A", "t": "分区数太多导致的必然现象，无法避免"}, {"k": "B", "t": "session.timeout.ms 与处理耗时无关，不影响心跳"}, {"k": "C", "t": "只要把 max.poll.records 调大就能解决"}, {"k": "D", "t": "单批处理耗时超过 max.poll.interval.ms，协调者认为消费者失联而触发 rebalance"}], "answer": "D", "explain": "消费者必须在 max.poll.interval.ms 内再次调用 poll()，否则被判定为「处理卡死」而被踢出组并触发 rebalance，此时提交位移会抛 CommitFailedException。这里一批 500 条要 1000 秒，远超 300 秒。解法：减小 max.poll.records（如 50）、提高单条处理效率、把耗时逻辑异步化，或适当调大 max.poll.interval.ms。调大 max.poll.records 只会让批次更长、更容易超时（C 恰恰相反）。", "kaodian": "AI后端能力-高并发与中间件层-Kafka消费超时与rebalance"}, {"no": 5, "type": "single", "body": "希望所有 SQL 自动追加 `tenant_id = 当前租户`，MyBatis-Plus 中最合适的做法是？", "code": "// 目标：业务代码不写租户条件，框架自动注入", "options": [{"k": "A", "t": "注册 TenantLineInnerInterceptor（多租户插件），在 SQL 解析阶段自动追加租户条件"}, {"k": "B", "t": "在每个 Mapper 方法里手写 tenant_id 条件"}, {"k": "C", "t": "用 AOP 在 Service 层拼字符串改 SQL"}, {"k": "D", "t": "MyBatis-Plus 不支持这类能力"}], "answer": "A", "explain": "MP 的 MybatisPlusInterceptor 支持挂载多个 InnerInterceptor：TenantLineInnerInterceptor（多租户，自动改写 WHERE 与 INSERT 列）、PaginationInnerInterceptor（分页）、OptimisticLockerInnerInterceptor（乐观锁）、BlockAttackInnerInterceptor（防全表更新删除）。多租户由框架在 SQL 层统一处理，可靠且无侵入。手写条件（B）必然有人漏写；在 Service 层拼字符串改 SQL（C）极易出错并引入注入风险。", "kaodian": "AI后端能力-数据存储与ORM层-MP多租户插件"}, {"no": 6, "type": "single", "body": "下列 Optional 用法最推荐的是？", "code": "// 目标：user 可能为空，取其地址的城市，没有则返回「未知」", "options": [{"k": "A", "t": "把 Optional 作为实体类字段与方法参数广泛使用"}, {"k": "B", "t": "Optional.ofNullable(user).map(User::getAddr).map(Addr::getCity).orElse(\"未知\")"}, {"k": "C", "t": "if (opt.isPresent()) return opt.get().getAddr().getCity(); else return \"未知\";"}, {"k": "D", "t": "opt.get().getAddr().getCity()"}], "answer": "B", "explain": "Optional 的设计意图是用链式 map/flatMap/filter/orElse 表达「可能不存在」的计算流程，B 写法简洁且天然规避 NPE。C 虽然正确但退化成了 if-null 判断，还漏了 getAddr 可能为空。D 直接 get 会在空值时抛 NoSuchElementException，比 NPE 更糟。A 是反模式：Optional 不可序列化、作字段与参数会增加复杂度，官方建议只用作返回值。", "kaodian": "AI后端能力-语言与计算层-Optional最佳实践"}, {"no": 7, "type": "single", "body": "主线程需要等 3 个并行任务全部完成后再汇总，最合适的工具是？", "code": "ExecutorService pool = Executors.newFixedThreadPool(3);\n// 3 个任务分别查询 用户 / 订单 / 优惠券", "options": [{"k": "A", "t": "用 Thread.sleep(5000) 估算等待时间"}, {"k": "B", "t": "CyclicBarrier 只能用于一次性等待，不能复用"}, {"k": "C", "t": "CountDownLatch(3)，每个任务完成 countDown()，主线程 await() 等待归零"}, {"k": "D", "t": "Semaphore(3) 控制并发数即可实现等待全部完成"}], "answer": "C", "explain": "CountDownLatch 是一次性的「倒计时门闩」，适合「主线程等 N 个任务完成」，await 会阻塞至计数归零（记得把 countDown 放 finally，否则异常会导致永久阻塞，可用带超时的 await 兜底）。Semaphore 是限流许可，不表达完成语义（D 错）；sleep 估时不可靠（A 错）；CyclicBarrier 恰恰是可复用的（reset 后可再用），且语义是「多方互相等待」，B 说反了。也可用 CompletableFuture.allOf 更现代地实现。", "kaodian": "AI后端能力-语言与计算层-并发协作工具"}, {"no": 8, "type": "single", "body": "一个 10 万行的大表格数据只用于展示不需要响应式，如何避免深层代理带来的性能开销？", "code": "const rows = ref(hugeArray);   // 10 万行，每行 20 字段", "options": [{"k": "A", "t": "改成 reactive 就会更快"}, {"k": "B", "t": "把数据放进 computed 就不会被代理"}, {"k": "C", "t": "必须逐行 ref 包装才能提升性能"}, {"k": "D", "t": "用 shallowRef 或 markRaw 避免深度代理，仅在整体替换时触发更新"}], "answer": "D", "explain": "ref/reactive 会对对象做深层代理，10 万行 × 20 字段意味着大量 Proxy 与依赖收集开销。纯展示数据可用 shallowRef（只有 .value 整体替换才触发更新）或 markRaw（标记对象永不被代理），显著降低内存与初始化成本；配合虚拟滚动只渲染可见行效果更好。reactive 同样是深代理（A 错）；computed 依赖的源数据仍会被代理（B 错）；逐行 ref 只会更慢（C 错）。", "kaodian": "AI前端能力-语言与运行时-shallowRef与markRaw"}, {"no": 9, "type": "single", "body": "要让文本超过 2 行显示省略号，正确写法是？", "code": ".txt {\n  /* 补全 ? */\n}", "options": [{"k": "A", "t": "display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;"}, {"k": "B", "t": "white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"}, {"k": "C", "t": "只写 text-overflow: ellipsis 即可"}, {"k": "D", "t": "多行省略只能用 JS 截断字符串"}], "answer": "A", "explain": "多行省略的通用方案是 -webkit-line-clamp 组合（需同时设置 display:-webkit-box 与 -webkit-box-orient:vertical 与 overflow:hidden），主流浏览器均支持；现代规范也有 line-clamp 属性正在推进。B 是单行省略方案（nowrap 会让文本不换行）。text-overflow 必须配合 overflow:hidden 与宽度约束才生效（C 错）。JS 截断无法感知实际渲染宽度与字体，是下位方案（D 错）。", "kaodian": "AI前端能力-前端基础与渲染引擎-多行文本省略"}, {"no": 10, "type": "single", "body": "需求：服务端单向持续推送任务进度，客户端只接收不上行。最轻量合适的方案是？", "code": "// 服务端\nContent-Type: text/event-stream\ndata: {\"progress\": 42}", "options": [{"k": "A", "t": "用 iframe 长连接是现代推荐方案"}, {"k": "B", "t": "SSE（Server-Sent Events），基于 HTTP 长连接单向推送，浏览器自带断线重连"}, {"k": "C", "t": "WebSocket，因为它是唯一能推送的技术"}, {"k": "D", "t": "每 500ms 轮询一次接口，最省资源"}], "answer": "B", "explain": "SSE 基于普通 HTTP，单向（服务端→客户端）文本推送，EventSource API 自带自动重连与事件 ID 续传，实现与运维成本都低于 WebSocket，非常适合进度、通知、日志流这类只需下行的场景。WebSocket 适合双向高频交互（如聊天、协同编辑），能力更强但更重（C 的「唯一」错）。高频轮询浪费连接与带宽且有延迟（D 错）；iframe 长连接是被淘汰的老方案（A 错）。注意 SSE 在 HTTP/1.1 下受同域连接数限制。", "kaodian": "AI前端能力-网络与BFF架构-SSE与WebSocket选型"}, {"no": 11, "type": "single", "body": "下列 TS 函数类型声明的含义是？", "code": "function fmt(v: string): string;\nfunction fmt(v: number, digits?: number): string;\nfunction fmt(v: any, digits = 2): string { ... }", "options": [{"k": "A", "t": "实现签名 (v:any) 也可以被外部直接调用"}, {"k": "B", "t": "TypeScript 不支持函数重载"}, {"k": "C", "t": "函数重载：对外暴露两个签名供类型检查，实现签名不参与调用方类型推断"}, {"k": "D", "t": "重复定义，编译会报错"}], "answer": "C", "explain": "TS 的函数重载用多个声明签名描述不同调用形态，最后的实现签名必须兼容所有声明但不对外暴露——调用方只能匹配声明签名之一，所以 fmt('a', 2) 会报错（第一个签名不接受第二参数）。这样既保留了灵活调用，又保住了类型安全。实现签名不可直接调用（A 错）。也可用联合类型/泛型实现类似效果，重载更适合参数组合差异大的场景。", "kaodian": "AI前端能力-语言与运行时-TS函数重载"}, {"no": 12, "type": "single", "body": "下列代码输出是？", "code": "function P(){}\nconst p = new P();\nconsole.log(p.__proto__ === P.prototype,\n            P.prototype.__proto__ === Object.prototype,\n            p instanceof Object);", "options": [{"k": "A", "t": "true false true"}, {"k": "B", "t": "false true false"}, {"k": "C", "t": "true true false"}, {"k": "D", "t": "true true true"}], "answer": "D", "explain": "new 出的实例其 __proto__ 指向构造函数的 prototype，故第一项为 true。P.prototype 本身是普通对象，其 __proto__ 指向 Object.prototype，第二项 true。instanceof 沿原型链查找：p → P.prototype → Object.prototype，能找到 Object.prototype，故 p instanceof Object 为 true。原型链终点是 Object.prototype.__proto__ === null。", "kaodian": "AI前端能力-语言与运行时-原型链与instanceof"}, {"no": 13, "type": "single", "body": "要实现「元素出现在视口时自动加载图片」的自定义指令，最合适的钩子与 API 是？", "code": "app.directive('lazy', {\n  mounted(el, binding) { /* ? */ }\n});", "options": [{"k": "A", "t": "在 mounted 中用 IntersectionObserver 观察元素，进入视口后设置 src 并断开观察"}, {"k": "B", "t": "在 mounted 中监听 window scroll 并用 getBoundingClientRect 计算，性能最好"}, {"k": "C", "t": "在 created 钩子中操作 el，此时 DOM 已就绪"}, {"k": "D", "t": "自定义指令无法访问真实 DOM 元素"}], "answer": "A", "explain": "IntersectionObserver 由浏览器在合适时机异步回调，不阻塞主线程也不需要频繁计算布局，是懒加载/曝光埋点的标准 API；进入视口后设置 src 并 unobserve 释放资源。scroll + getBoundingClientRect 会触发同步布局计算（reflow），高频滚动时性能明显更差（B 错）。自定义指令的 created 钩子在元素属性绑定前调用，此时不宜依赖完整 DOM（C 错）；指令第一个参数就是真实元素（D 错）。", "kaodian": "AI前端能力-前端生态-IntersectionObserver懒加载"}, {"no": 14, "type": "single", "body": "父页面与同源 iframe 之间通信，规范做法是？", "code": "// 父页面\niframe.contentWindow.postMessage({type:'sync'}, 'https://a.example.com');", "options": [{"k": "A", "t": "同源 iframe 无法通信"}, {"k": "B", "t": "用 postMessage 发送并在接收端校验 event.origin 与消息结构，避免接收不可信来源的消息"}, {"k": "C", "t": "直接读写 iframe 内部 DOM 是唯一方式，postMessage 只适合跨域"}, {"k": "D", "t": "接收端无需校验 origin，浏览器会自动过滤"}], "answer": "B", "explain": "postMessage 是通用的窗口间通信机制（同源、跨域均适用），发送时应指定明确的 targetOrigin 而非 '*'，接收时必须校验 event.origin 与消息格式，否则任意页面都可以向你发消息触发逻辑（这是常见的前端安全漏洞）。浏览器不会替你做业务级过滤（D 错）。同源下虽然也能直接访问 contentDocument，但耦合度高、时序难控，postMessage 更可靠（C 错）。", "kaodian": "AI前端能力-前端生态-postMessage窗口通信"}, {"no": 15, "type": "single", "body": "需求：年龄必须在 18~60（含边界）之间。按边界值分析法，最应覆盖的取值是？", "code": "if (age < 18 || age > 60) return \"不符合\";", "options": [{"k": "A", "t": "只测 30（区间中值）"}, {"k": "B", "t": "只测 0 和 100"}, {"k": "C", "t": "17、18、19、59、60、61（上下点与内点）"}, {"k": "D", "t": "只测 18 和 60"}], "answer": "C", "explain": "边界值分析要覆盖边界及其两侧：下边界 18（有效）、17（无效离点）、19（有效内点），上边界 60（有效）、61（无效离点）、59（有效内点）。缺陷最常出现在 < 与 <=、> 与 >= 写错的位置，只测边界本身（D）无法暴露离点错误，只测中值（A）完全避开风险区，只测远离边界的极端值（B）也漏掉判定边界。实际还应补空值、非数字、负数等异常输入。", "kaodian": "AI质量保障-软件测试理论与质量体系-边界值分析取值"}, {"no": 16, "type": "single", "body": "关于「完成的定义（DoD）」与验收标准，下列理解正确的是？", "code": "DoD 示例：代码合并 + 单测通过 + 覆盖率≥70% + 用例执行完毕 + 无 P0/P1 遗留 + 文档更新", "options": [{"k": "A", "t": "DoD 就是需求验收标准，两者完全等价"}, {"k": "B", "t": "DoD 只由测试团队制定并执行"}, {"k": "C", "t": "DoD 会降低交付速度，应当避免使用"}, {"k": "D", "t": "DoD 是团队共识的可交付门槛，把质量要求前置成明确清单，避免「差不多能用」就算完成"}], "answer": "D", "explain": "DoD 是团队对「什么才叫做完」的统一约定，覆盖代码、测试、文档、部署等维度，作用是消除口头标准带来的扯皮与质量滑坡。它与验收标准（AC）不同：AC 描述某个具体需求要满足的业务条件，DoD 是适用于所有工作项的通用门槛（A 错）。DoD 应由团队共同制定并共同遵守（B 错）；短期看似增加约束，长期显著减少返工与线上问题（C 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-完成定义DoD"}, {"no": 17, "type": "single", "body": "CI 中给失败用例配置自动重试 2 次，正确的认识是？", "code": "retries: process.env.CI ? 2 : 0", "options": [{"k": "A", "t": "重试能降低偶发环境抖动带来的噪音，但必须统计「重试后才通过」的用例并治理，否则会掩盖真实缺陷"}, {"k": "B", "t": "重试次数越多越好，能显著提升质量"}, {"k": "C", "t": "配了重试就不会有 flaky 用例了"}, {"k": "D", "t": "重试会掩盖问题，因此任何情况下都不应使用"}], "answer": "A", "explain": "重试是务实的降噪手段（网络抖动、资源竞争、第三方短暂不可用确实存在），但它同时是一把双刃剑：真实的竞态缺陷可能因为重试通过而被漏掉。正确做法是开启重试同时记录 flaky 率与「首次失败、重试通过」的用例清单，定期专项治理，把 flaky 当缺陷对待。无限重试（B）只会拖长流水线并彻底掩盖问题；重试不消除 flaky 只是隐藏它（C 错）；完全禁止（D）会让噪音淹没有效信号。", "kaodian": "AI质量保障-自动化测试-失败重试策略"}, {"no": 18, "type": "single", "body": "接口自动化要覆盖「登录 → 下单 → 支付 → 查询订单」完整链路，设计上最合理的是？", "code": "token = login(); orderId = createOrder(token); pay(orderId); assertStatus(orderId, 'PAID')", "options": [{"k": "A", "t": "把 token 与 orderId 写死成固定值"}, {"k": "B", "t": "把链路封装成一个业务场景用例，内部按步骤串联并传递上下文，同时保留各接口的单接口用例"}, {"k": "C", "t": "拆成 4 个独立用例，靠执行顺序传递数据"}, {"k": "D", "t": "只做单接口测试，链路问题交给 UI 自动化"}], "answer": "B", "explain": "接口测试应分两层：单接口用例覆盖参数校验、异常码、边界；业务场景用例把多个接口串成一次完整流程，验证状态流转与数据一致性（这是单接口测试覆盖不到的）。场景用例内部自行传递上下文，保持自包含可重复。靠执行顺序传数据（C）破坏独立性且无法并行；只做单接口（D）漏掉状态流转缺陷；写死数据（A）无法重复执行。", "kaodian": "AI质量保障-接口测试-业务场景串联"}, {"no": 19, "type": "single", "body": "关于缺陷密度（Defect Density）指标，下列理解正确的是？", "code": "缺陷密度 = 缺陷数 / 规模（千行代码 或 功能点）", "options": [{"k": "A", "t": "缺陷密度是绝对客观指标，可直接用于团队排名"}, {"k": "B", "t": "缺陷密度只统计线上缺陷"}, {"k": "C", "t": "用于横向对比模块质量与识别高风险模块，但受规模统计口径与缺陷定级标准影响，需谨慎解读"}, {"k": "D", "t": "缺陷密度越高说明测试做得越差"}], "answer": "C", "explain": "缺陷密度能帮助定位「哪些模块单位规模上问题更多」，从而指导测试资源投放与重构优先级。但它对口径极其敏感：代码行数受语言与风格影响、功能点估算带主观性、缺陷是否含建议类也会改变结果，因此只适合同口径下的纵向趋势与横向相对比较。密度高常常说明测试有效发现了问题（D 因果颠倒）；用于排名会诱发少提缺陷的行为（A 错）；它可统计各阶段缺陷而非仅线上（B 错）。", "kaodian": "AI质量保障-软件测试理论与质量体系-缺陷密度"}, {"no": 20, "type": "single", "body": "让 AI 直接为一段业务代码生成单元测试，最大的风险是？", "code": "// AI 生成\nassertEquals(service.calc(100), service.calc(100));", "options": [{"k": "A", "t": "AI 生成的测试一定跑不通"}, {"k": "B", "t": "AI 生成的测试覆盖率必然低于人工"}, {"k": "C", "t": "AI 无法生成任何可用的测试代码"}, {"k": "D", "t": "AI 可能按「代码当前行为」写断言，把 bug 固化成期望值，或生成恒真断言造成虚假覆盖"}], "answer": "D", "explain": "这是 AI 生成测试最典型的陷阱：断言来源于对现有实现的观察而非需求规约，若实现本身有 bug，测试反而把错误行为锁死；示例中 assertEquals(f(x), f(x)) 是恒真断言，覆盖率上去了但什么都没验证。正确做法是让 AI 基于需求/验收标准生成用例，人工审核断言是否表达业务期望，并用变异测试等手段检验断言有效性。AI 生成的测试通常能跑通、覆盖率也可能很高，问题恰恰在「有效性」（A/B/C 错）。", "kaodian": "AI质量保障-AI辅助测试-AI生成断言风险"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于 Redis Cluster，下列说法正确的有？（多选，多选、少选、错选均不得分）", "code": "16384 个哈希槽，CRC16(key) mod 16384 决定归属节点", "options": [{"k": "A", "t": "多 key 操作要求所有 key 落在同一槽，否则报 CROSSSLOT 错误"}, {"k": "B", "t": "可用 hash tag（如 {user1001}:profile）强制相关 key 落到同一槽"}, {"k": "C", "t": "扩容时通过槽迁移实现，客户端会收到 MOVED/ASK 重定向"}, {"k": "D", "t": "Redis Cluster 支持跨节点事务与 Lua 脚本操作任意 key"}], "answer": ["A", "B", "C"], "explain": "A 对：MGET/MSET/Lua 多 key 操作必须同槽，跨槽直接报 CROSSSLOT。B 对：用花括号包住共同部分，只对 tag 内容做哈希，即可把关联 key 聚到同一槽（也要防止热点倾斜）。C 对：槽迁移期间客户端会收到 MOVED（已迁完）或 ASK（迁移中）重定向，智能客户端自动更新路由表。D 错：事务与 Lua 都受同槽限制，无法跨节点操作任意 key。", "kaodian": "AI后端能力-高并发与中间件层-RedisCluster哈希槽"}, {"no": 2, "type": "multi", "body": "关于 Spring Boot 外部化配置的优先级，下列说法正确的有？（多选）", "code": "java -jar app.jar --server.port=9090\n环境变量 SERVER_PORT=8081\napplication.yml: server.port=8080", "options": [{"k": "A", "t": "环境变量优先级高于 jar 包内的 application.yml"}, {"k": "B", "t": "application-{profile}.yml 优先级高于 application.yml"}, {"k": "C", "t": "jar 包内的配置文件优先级最高，外部无法覆盖"}, {"k": "D", "t": "命令行参数优先级高于环境变量与配置文件，本例最终端口是 9090"}], "answer": ["A", "B", "D"], "explain": "Spring Boot 的配置源按优先级从高到低大致是：命令行参数 > SPRING_APPLICATION_JSON > 系统属性 > 环境变量 > 外部 config 目录的配置文件 > jar 包内配置文件 > @PropertySource > 默认值。D/A/B 都符合这一顺序，profile 专属文件覆盖通用文件。C 完全反了——这套设计的目的正是让同一个包在不同环境用外部配置覆盖默认值。", "kaodian": "AI后端能力-微服务与云原生层-配置优先级"}, {"no": 3, "type": "multi", "body": "关于数据库连接池（如 HikariCP）参数配置，下列说法正确的有？（多选）", "code": "maximumPoolSize: 20\nconnectionTimeout: 30000\nmaxLifetime: 1800000\nidleTimeout: 600000", "options": [{"k": "A", "t": "maxLifetime 应略小于数据库/中间层的连接空闲回收时间，避免使用到已被服务端关闭的连接"}, {"k": "B", "t": "只要把 maximumPoolSize 调到 500，就能支撑 500 并发且延迟不变"}, {"k": "C", "t": "maximumPoolSize 并非越大越好，超过数据库处理能力会加剧竞争与上下文切换"}, {"k": "D", "t": "connectionTimeout 是获取连接的等待上限，超时抛异常而非无限等待"}], "answer": ["A", "C", "D"], "explain": "C 对：连接数应与数据库 CPU/IO 能力匹配，过大反而因锁竞争与调度开销降低吞吐（常用经验公式 core×2+磁盘数 起步再压测调优）。D 对：获取连接超时会快速失败，便于上层熔断降级，避免线程全部堆积在等连接上。A 对：这是「连接已被 MySQL wait_timeout 或中间件关闭却仍被复用」导致偶发 Connection reset 的标准解法。B 错：连接数不是并发能力的线性放大器，数据库会先被打爆。", "kaodian": "AI后端能力-数据存储与ORM层-连接池参数配置"}, {"no": 4, "type": "multi", "body": "SPA 站点需要改善 SEO 与首屏，下列方案有效的有？（多选）", "code": "现状：CSR 单页应用，爬虫抓到的 HTML 几乎为空", "options": [{"k": "A", "t": "在页面里堆砌大量隐藏关键词以提升排名"}, {"k": "B", "t": "改用 SSR（如 Nuxt/Next）在服务端输出完整 HTML"}, {"k": "C", "t": "对内容型页面用 SSG 预渲染成静态 HTML，配合 CDN 分发"}, {"k": "D", "t": "补齐语义化标签、title/description/结构化数据与 sitemap"}], "answer": ["B", "C", "D"], "explain": "B 对：SSR 让爬虫与首屏都能直接拿到有内容的 HTML，同时改善 LCP。C 对：文档、博客、落地页这类内容不常变的页面用 SSG 预渲染性价比最高。D 对：语义结构、meta 信息、结构化数据（JSON-LD）与 sitemap 是 SEO 的基础工程。A 错：关键词堆砌是黑帽手段，会被搜索引擎降权甚至封禁。", "kaodian": "AI前端能力-前端生态-SSR与SEO优化"}, {"no": 5, "type": "multi", "body": "前端发版后部分用户仍在跑旧代码、或出现「加载失败 chunk」的白屏，下列合理措施有？（多选）", "code": "dist/assets/index-a1b2c3.js   （内容哈希文件名）", "options": [{"k": "A", "t": "静态资源用内容哈希命名并配长期强缓存，入口 HTML 用协商缓存或不缓存"}, {"k": "B", "t": "监听动态 import 加载失败（chunk load error），提示或自动刷新到新版本"}, {"k": "C", "t": "发版时保留旧版本资源一段时间，避免正在浏览的用户请求已删除的 chunk"}, {"k": "D", "t": "把所有资源都设为强缓存一年，包括入口 HTML"}], "answer": ["A", "B", "C"], "explain": "A 对：内容哈希保证内容变则文件名变，可以放心长缓存；而入口 HTML 必须能及时更新，否则用户永远拿不到新的资源引用。B 对：旧 HTML 引用了已被删除的 chunk 会加载失败白屏，捕获后提示刷新是常见兜底。C 对：灰度/发版期间保留旧产物（或用多版本目录）能避免正在浏览的用户踩空。D 错：把入口 HTML 强缓存一年会导致用户长期无法更新，正是问题根源。", "kaodian": "AI前端能力-前端生态-前端发版与缓存策略"}, {"no": 6, "type": "multi", "body": "设计 CI 流水线阶段，下列安排合理的有？（多选）", "code": "提交 → ? → ? → ? → 部署预发", "options": [{"k": "A", "t": "再跑接口/集成测试，最后跑耗时最长的端到端 UI 测试"}, {"k": "B", "t": "按测试金字塔安排顺序，把快且稳的放前面，慢而脆的放后面"}, {"k": "C", "t": "把端到端 UI 测试放在最前面，先验证用户视角最重要"}, {"k": "D", "t": "先跑静态检查与单元测试（秒级到分钟级），快速反馈、失败即止"}], "answer": ["A", "B", "D"], "explain": "流水线设计的核心原则是「快速失败 + 分层反馈」：静态检查与单测最快，能在几分钟内拦住多数低级问题；接口/集成测试次之；端到端 UI 测试最慢最脆，放在后段或夜间。C 违反该原则：把最慢的放最前会让每次提交都要等很久才知道连编译都没过，严重拖慢开发节奏。", "kaodian": "AI质量保障-CI/CD与质量门禁-流水线阶段设计"}, {"no": 7, "type": "multi", "body": "验证数据埋点质量，下列测试要点正确的有？（多选）", "code": "埋点：{event:'order_pay', uid, orderId, amount, ts, channel}", "options": [{"k": "A", "t": "异常场景验证：断网重连后是否补传、退出 App 是否丢失、去重是否生效"}, {"k": "B", "t": "埋点属于数据团队职责，测试无需验证"}, {"k": "C", "t": "触发时机准确：该触发时不漏、不该触发时不误报、不重复上报"}, {"k": "D", "t": "字段完整且类型/取值符合埋点文档定义，关键字段不为空"}], "answer": ["A", "C", "D"], "explain": "埋点数据直接驱动业务决策，错漏会导致决策失真且往往很久才被发现。C 对：漏报、误报、重复上报是三类高频问题。D 对：字段与文档一致是数据可用的前提，缺失关键字段会让分析无法下钻。A 对：移动端弱网与进程退出场景的缓存补传与去重逻辑必须验证。B 错：埋点是需求的一部分，应纳入测试范围并有明确验收标准。", "kaodian": "AI质量保障-软件测试理论与质量体系-埋点数据质量测试"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "MySQL 的 AUTO_INCREMENT 主键在事务回滚、插入冲突或批量插入后可能出现空洞，因此不能假设自增 ID 一定连续。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "自增值的分配不随事务回滚而归还（为了避免并发下的锁竞争），因此事务回滚、唯一键冲突失败、REPLACE、批量插入的预分配（innodb_autoinc_lock_mode=2 时更明显）都会产生空洞。业务上不能用「ID 连续」来判断数据是否缺失，也不宜把自增 ID 当作对外暴露的业务单号（还会泄露业务量），应使用独立的单号生成器。", "kaodian": "AI后端能力-数据存储与ORM层-自增主键空洞"}, {"no": 2, "type": "judge", "body": "移动端浏览器中 click 事件不存在任何延迟问题。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "移动端 click 曾存在约 300ms 延迟（浏览器等待判断是否双击缩放），可用 viewport、touch 事件或 fastclick 等规避。", "kaodian": "AI前端能力-前端基础与渲染引擎-移动端点击延迟"}, {"no": 3, "type": "judge", "body": "使用 `<img loading=\"lazy\">` 后，浏览器会对所有图片延迟加载，包括首屏的主视觉图，因此首屏 LCP 一定会变好。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "给首屏关键图片（尤其是 LCP 元素）加 loading=\"lazy\" 会让它的加载被延后到布局计算之后，反而拖慢 LCP。正确做法是：首屏关键图用默认 eager 甚至加 fetchpriority=\"high\" 与 <link rel=\"preload\">，只对非首屏图片使用 lazy。另外浏览器对已在视口内的图片通常不会真正延迟，但「所有图片都 lazy 一定更好」的说法本身错误。", "kaodian": "AI前端能力-前端生态-图片懒加载与LCP"}, {"no": 4, "type": "judge", "body": "对于低复现率的偶发缺陷，应记录完整环境、操作路径、时间点与日志/traceId，并通过增加日志或埋点提升可观测性，而不是因为「复现不了」直接关单。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "偶发缺陷往往对应并发竞态、缓存不一致、弱网时序、内存泄漏等高危问题，恰恰是最需要重视的类型。处理方式：尽可能固化线索（机型/版本/账号/时间/traceId/录屏/日志），补充日志与监控埋点提升可观测性，用压力或循环脚本提升复现概率，必要时挂长期观察单。直接以「无法复现」关单，等于把风险留到线上放大。", "kaodian": "AI质量保障-软件测试理论与质量体系-偶发缺陷处理"}, {"no": 5, "type": "judge", "body": "评估自动化测试的投入产出（ROI）时，只需要计算「节省的人工执行时间」即可，不必考虑脚本编写与长期维护成本。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "自动化 ROI = 节省的人工执行成本 −（脚本开发成本 + 长期维护成本 + 环境与数据建设成本 + 排查 flaky 的成本）。忽略维护成本是自动化项目失败的首要原因：UI 频繁改版会让脚本维护量超过人工执行量，最终整套用例被废弃。因此选型时要评估被测对象的稳定性与用例的执行频次，优先自动化稳定且高频回归的部分。", "kaodian": "AI质量保障-自动化测试-自动化ROI评估"}, {"no": 6, "type": "judge", "body": "在代码提交阶段引入静态代码扫描（如 SonarQube、ESLint、SpotBugs）属于测试左移实践，能在缺陷成本最低时发现问题。", "code": "", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "缺陷发现越晚修复成本越高（需求阶段 1，编码阶段数倍，线上则可能上百倍）。静态扫描在提交/构建阶段自动识别空指针风险、资源泄漏、注入隐患、复杂度与坏味道，无需运行程序即可反馈，是测试左移的典型手段；配合质量门禁（新增代码问题数/覆盖率阈值）可防止债务累积。它与单测、代码评审、需求评审共同构成左移体系。", "kaodian": "AI质量保障-CI/CD与质量门禁-静态扫描左移"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+o.t+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+sec.name+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+q.kaodian+'">'+q.kaodian+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):q.body)+'</div>';
      if(q.code) html += '<div class="code">'+q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+q.explain+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
