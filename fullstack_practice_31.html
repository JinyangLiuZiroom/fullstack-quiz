<script type="application/json" id="quizData">{"id": "vol31", "title": "全栈转型模拟自测卷", "sub": "可答题 · 逐题判分 · 自动记录错题", "meta": "第 31 期 · 33 题（20单+7多+6判）· 11后端/11前端/11测试 · 均分对齐认证考 · 6 原型复刻（P1代码行为≈12 / P2逐条正误多选7 / P3配置日志找问题4 / P4流程用法4 / P5补全3 / P6计算3）· 每题均带真实可运行代码/配置/日志片段，考读代码判行为、找坑与补全", "sections": [{"name": "一、单选题（20 题 · 60 分）", "cat": "single", "questions": [{"no": 1, "type": "single", "body": "配置中心都没有配置 order.prefix 和 order.timeout，下面哪个描述正确？", "code": "@Configuration\npublic class Cfg {\n    @Value(\"${order.prefix:ORD-}\")   // 配置中心未配置 order.prefix\n    private String prefix;\n    @Value(\"${order.timeout:}\")      // 配置中心未配置 order.timeout，默认值留空\n    private String timeout;\n}", "options": [{"k": "A", "t": "prefix = \"ORD-\"，timeout = \"\"（空字符串），两个都不会抛异常"}, {"k": "B", "t": "prefix = null，timeout = null，因为都未配置"}, {"k": "C", "t": "两个都会抛 IllegalArgumentException，因为冒号后必须给非空默认值"}, {"k": "D", "t": "prefix = \"ORD-\"，timeout 抛异常因为默认值不能为空"}], "answer": ["A"], "explain": "@Value(\"${key:default}\") 在 key 缺失时回退到 default；default 可以是空字符串（timeout=\"\"），且不会抛异常（C、D 错）。只有完全没写默认值且 key 缺失时才会抛找不到属性的错（B 错）。", "kaodian": "AI后端能力-应用框架层-Value占位符默认与空串语义"}, {"no": 2, "type": "single", "body": "t_order 有该用户一条记录 id=5,status=2,amount=99，但 select 只选了 id 和 status 两列。控制台打印？", "code": "LambdaQueryWrapper<Order> w = new LambdaQueryWrapper<>();\nw.select(Order::getId, Order::getStatus).eq(Order::getUserId, 1001);\nOrder o = orderMapper.selectOne(w);\nSystem.out.println(o.getId() + \"|\" + o.getAmount());", "options": [{"k": "A", "t": "\"5|99\"（amount 照常从库里查出）"}, {"k": "B", "t": "\"5|null\"（amount 未被查，实体字段为 null）"}, {"k": "C", "t": "抛异常，因为 select 列数与实体字段数不一致"}, {"k": "D", "t": "\"5|0\"（Integer 默认值是 0）"}], "answer": ["B"], "explain": "MyBatis-Plus 只映射 select 指定的列；未查的 amount 在实体里是 Java 默认值 null（Integer 类型不是 0，D 错），不会抛异常（C 错）。", "kaodian": "AI后端能力-数据存储层-LambdaQueryWrapper列投影与null"}, {"no": 3, "type": "single", "body": "客户端 A 用 reqId=A1 加锁成功（TTL 30s）。10s 后 A 业务超时、锁自动过期；随后 B 用 reqId=B1 加锁成功。此刻 A 执行释放锁的 Lua 脚本（传入 ARGV[1]=A1），脚本返回？", "code": "-- 释放锁脚本\nif redis.call('get', KEYS[1]) == ARGV[1] then\n    return redis.call('del', KEYS[1])\nelse\n    return 0\nend", "options": [{"k": "A", "t": "删除 B 持有的锁并返回 1"}, {"k": "B", "t": "1（删除成功），因为 A 先拿锁理应由 A 释放"}, {"k": "C", "t": "抛异常，因为此时 KEYS[1] 已不存在"}, {"k": "D", "t": "0，当前锁 value 是 B1，与传入 A1 不等，脚本拒删"}], "answer": ["C"], "explain": "Lua 脚本在 Redis 内原子执行：先比较当前锁 value，只有与传入 reqId 相等才删除。此时锁已被 C 持有（value=C1），与 B1 不符，返回 0，避免误删别人的锁。", "kaodian": "AI后端能力-高并发与中间件层-Lua原子释放锁"}, {"no": 4, "type": "single", "body": "缓存统计窗口：总读 1000 次，命中 850 次，回源 150 次。缓存命中率（hit rate）约为？", "code": "int total = 1000, hit = 850;\ndouble rate = (double) hit / total;", "options": [{"k": "A", "t": "15%"}, {"k": "B", "t": "8.5%"}, {"k": "C", "t": "850%"}, {"k": "D", "t": "85%"}], "answer": ["D"], "explain": "命中率 = 命中数 / 总请求数 = 850 / 1000 = 0.85 = 85%。注意区分命中率（85%）与未命中率（15%），也别写成千分比。", "kaodian": "AI后端能力-高并发与中间件层-缓存命中率指标含义"}, {"no": 5, "type": "single", "body": "在 Nacos 控制台把 app.max-retry 从 3 改成 10 并发布后，下面打印仍然是 3，未生效。最可能原因？", "code": "@ConfigurationProperties(prefix = \"app\")\n@Component\npublic class AppProps {\n    private int maxRetry;            // 有 getter/setter\n}\n// 配置中心把 app.max-retry 从 3 改成 10，发布后\nSystem.out.println(props.getMaxRetry());  // 仍是 3", "options": [{"k": "A", "t": "缺 @RefreshScope，@ConfigurationProperties Bean 未纳入动态刷新作用域"}, {"k": "B", "t": "Nacos 配置中心未生效，应用读的是本地 application.yml"}, {"k": "C", "t": "maxRetry 字段没有 public setter 导致绑定失败"}, {"k": "D", "t": "@ConfigurationProperties 不支持动态刷新，必须改用 @Value"}], "answer": ["A"], "explain": "@ConfigurationProperties 配合 @RefreshScope 才能在配置变更时重建并刷新 Bean；只加前者，运行时不会重新绑定（C 错，有 setter；D 错，spring-cloud 支持前者动态刷新；B 错，其它配置能读到说明中心已连上）。", "kaodian": "AI后端能力-微服务与云原生层-Nacos配置刷新RefreshScope"}, {"no": 6, "type": "single", "body": "用 MyBatis-Plus 把 nick_name 更新为 NULL（MP 默认策略会忽略 null 字段），横线处哪种写法能让 SQL 真正生成 `SET nick_name = NULL`？", "code": "LambdaUpdateWrapper<User> w = new LambdaUpdateWrapper<>();\nw.eq(User::getId, 1001)\n .set(User::getNickName, null);   // 直接 set null 会被忽略吗？\nuserMapper.update(null, w);", "options": [{"k": "A", "t": "在实体类 nickName 字段加 @TableField(updateStrategy = FieldStrategy.ALWAYS) 后用 .set"}, {"k": "B", "t": "B 或 C 都行"}, {"k": "C", "t": "上面 .set(User::getNickName, null) 即可，MP 会生成 nick_name=null"}, {"k": "D", "t": "改用 .setSql(\"nick_name = null\")，绕过字段 null 判断直接拼 SQL"}], "answer": ["B"], "explain": "MP 默认 FieldStrategy 对 null 字段跳过，单纯 .set(null) 不生成该列（C 错）；用 setSql 直接拼 SQL，或字段标注 ALWAYS 策略让 .set 接受 null，二者都能让 nick_name 真正置空。", "kaodian": "AI后端能力-数据存储层-MP更新置NULL策略"}, {"no": 7, "type": "single", "body": "针对“热点 key 失效瞬间大量请求打到 DB（缓存击穿）”，在单实例（单 JVM）部署下，下面这段双重检查锁的做法正确吗？", "code": "public String getData(Long id) {\n    String v = redis.get(\"k:\" + id);\n    if (v == null) {\n        synchronized (this) {\n            v = redis.get(\"k:\" + id);   // 二次检查\n            if (v == null) {\n                v = db.load(id);\n                redis.setex(\"k:\" + id, 300, v);\n            }\n        }\n    }\n    return v;\n}", "options": [{"k": "A", "t": "错误，synchronized 前应再判一次 null 减少加锁次数"}, {"k": "B", "t": "正确，因为 synchronized 块内一定会回源并回填缓存"}, {"k": "C", "t": "正确，synchronized + 双重检查既保证只有一个线程回源，又避免锁粒度过大"}, {"k": "D", "t": "错误，synchronized 在单实例下不会生效，必须改用分布式锁"}], "answer": ["C"], "explain": "单实例下 synchronized 让同一时刻只有一个线程进入回源区，内部二次检查避免已回填的重复查库，是标准的缓存击穿应对（单体版）。D 错在“单实例不生效”——synchronized 在单 JVM 内是有效的；分布式多实例才需 SET NX EX 分布式锁。", "kaodian": "AI后端能力-高并发与中间件层-热点Key击穿双重检查"}, {"no": 8, "type": "single", "body": "下面代码依次打印什么？", "code": "const list = ref([1,2,3]);\nconst total = computed(() => {\n  console.log('calc');\n  return list.value.reduce((a,b)=>a+b, 0);\n});\nconsole.log(total.value);\nconsole.log(total.value);\nlist.value.push(4);\nconsole.log(total.value);", "options": [{"k": "A", "t": "只打印 1 次 \"calc\"（computed 永不重算）"}, {"k": "B", "t": "运行时直接报错"}, {"k": "C", "t": "打印 3 次 \"calc\"（每次读取 total.value 都重新执行）"}, {"k": "D", "t": "打印 \"calc\"、\"calc\" 不打印、\"calc\" 打印（首次计算，第二次命中缓存，push 后失效再算）"}], "answer": ["D"], "explain": "computed 有缓存且惰性：首次访问执行一次；第二次依赖未变直接返回缓存不重算；push 改变依赖后才再次计算。所以 \"calc\" 出现 1、不出现、再出现。", "kaodian": "AI前端能力-语言与运行时-Computed缓存与惰性"}, {"no": 9, "type": "single", "body": "容器宽 600px，三个子项 flex-grow 分别为 1/2/3、flex-basis 都是 0。子项最终宽度 A:B:C 约为？", "code": "<div style=\"display:flex; width:600px\">\n  <div style=\"flex:1 1 0\"></div>\n  <div style=\"flex:2 1 0\"></div>\n  <div style=\"flex:3 1 0\"></div>\n</div>", "options": [{"k": "A", "t": "100:200:300（按 grow 1:2:3 分配）"}, {"k": "B", "t": "200:200:200（三项均分剩余空间）"}, {"k": "C", "t": "1:2:3 像素（按 grow 绝对值当宽度）"}, {"k": "D", "t": "150:150:300（前两项均分剩余空间）"}], "answer": ["A"], "explain": "flex-basis:0 时各项初始主尺寸为 0，剩余空间 = 600px，按 grow 1:2:3 分配 → 100/200/300。grow 决定的是剩余空间的分配权重，不是绝对值。", "kaodian": "AI前端能力-前端基础与渲染引擎-FlexGrow弹性分配计算"}, {"no": 10, "type": "single", "body": "服务端错误地把 JSON 接口返回成纯文本 \"hello\"（Content-Type: text/plain），但前端 axios 仍按 responseType:\"json\" 请求。下面哪个正确？", "code": "axios.get('/api/user', { responseType: 'json' })\n  .then(r => console.log(r.data.name));\n// 服务端实际返回 Content-Type: text/plain; 内容是 \"hello\"", "options": [{"k": "A", "t": "axios 在收到非 JSON 内容类型时抛解析错误，r.data 仍是字符串"}, {"k": "B", "t": "因为请求设了 responseType:\"json\"，XHR 强制把响应当 JSON 解析，失败会抛 SyntaxError"}, {"k": "C", "t": "请求根本发不出去，因为 responseType 与服务器不一致"}, {"k": "D", "t": "axios 会自动把文本转成对象，r.data.name 取到 undefined（不报错）"}], "answer": ["B"], "explain": "responseType:\"json\" 让 XHR 尝试 JSON.parse 响应体；响应体 \"hello\" 不是合法 JSON，解析抛 SyntaxError，进入 catch（D、A 错在“不报错”，C 错在“发不出”）。", "kaodian": "AI前端能力-网络与BFF架构-Axios响应类型解析"}, {"no": 11, "type": "single", "body": "前端请求 /api/user/list 一直 404，但后端 /user/list 单独 curl 正常。Vite 代理配置如下，最可能？", "code": "server: {\n  proxy: {\n    '/api': { target: 'http://localhost:8080' }  // 没写 rewrite\n  }\n}\n// 前端请求 /api/user/list，后端路由是 /user/list（无 /api 前缀）", "options": [{"k": "A", "t": "target 写错成 https 导致证书错误"}, {"k": "B", "t": "后端需要 /api 前缀，是前端少写了 /api"}, {"k": "C", "t": "代理把请求原样转发为 http://localhost:8080/api/user/list，后端无 /api 前缀路由 → 404"}, {"k": "D", "t": "跨域问题，浏览器拦截了请求"}], "answer": ["C"], "explain": "Vite proxy 默认把匹配的 /api 前缀一并转发；后端没有 /api 路由就 404。解决：加 rewrite: p => p.replace(/^\\/api/,\"\") 去掉前缀，或后端加前缀。", "kaodian": "AI前端能力-前端生态-Vite代理路径重写"}, {"no": 12, "type": "single", "body": "上面 s.count++ 之后，视图会更新吗？", "code": "const state = reactive({ count: 0 });\nstate.count++;            // 响应式，视图更新\nlet s = state;\ns = { count: 99 };        // 重新赋值一个新对象\ns.count++;                // 视图会更新吗？", "options": [{"k": "A", "t": "会，因为 reactive 对象的所有引用都自动是响应式的"}, {"k": "B", "t": "编译时报错，不能把 reactive 赋给普通变量"}, {"k": "C", "t": "会，因为 s 最初指向 reactive 对象，引用关系保留响应式"}, {"k": "D", "t": "不会，s 被重新赋值为普通对象，脱离了 reactive 代理，后续修改不再响应式"}], "answer": ["D"], "explain": "reactive 返回的是 Proxy 代理；重新赋值 s={count:99} 让 s 指向普通对象，不再受代理追踪，修改不触发更新。应保持同一代理：用 ref 或 Object.assign(state,{count:99})。", "kaodian": "AI前端能力-语言与运行时-响应式丢失reactive重赋值"}, {"no": 13, "type": "single", "body": "上面 401 无感刷新逻辑中，横线处应填哪一行才能真正“用新 token 重发原请求”？", "code": "axios.interceptors.response.use(\n  r => r,\n  async err => {\n    if (err.response?.status === 401 && !err.config._retry) {\n      err.config._retry = true;\n      await refreshToken();            // 拿到新 token\n      /* ______ */                     // 用新 token 重发原请求\n      return axios(err.config);\n    }\n    return Promise.reject(err);\n  }\n);", "options": [{"k": "A", "t": "err.config.headers.Authorization = `Bearer ${getToken()}`;"}, {"k": "B", "t": "setToken(getNewToken());  // 只更新存储，不改本次请求头"}, {"k": "C", "t": "err.response.headers.Authorization = getToken();"}, {"k": "D", "t": "return axios.request(err.config);  // 不修改 header"}], "answer": ["A"], "explain": "必须先把新 token 写回 err.config.headers，再 axios(err.config) 重发，原请求才会带新 token。仅更新存储（B）或改 response（C）都不影响重发；D 不刷新 header。", "kaodian": "AI前端能力-网络与BFF架构-Axios响应拦截器无感刷新"}, {"no": 14, "type": "single", "body": "前端用 fetch 带自定义头 X-App-Id 和 credentials，后端当前响应头配置后前端仍报错。正确做法是？", "code": "fetch('/api/data', { headers: { 'X-App-Id': 'web' }, credentials: 'include' });\n// 后端当前响应头：\nAccess-Control-Allow-Origin: *\nAccess-Control-Allow-Credentials: true", "options": [{"k": "A", "t": "把自定义头 X-App-Id 改为标准头免预检"}, {"k": "B", "t": "跨域拦截，需要后端放开 Origin 才能访问"}, {"k": "C", "t": "把 Allow-Origin 从 * 改为具体源，带凭据时不能为 *"}, {"k": "D", "t": "预检响应只需返回 Allow-Origin 即可通过"}], "answer": ["B"], "explain": "带 credentials:include 的跨域请求，Access-Control-Allow-Origin 不能为 *，必须是具体源，且预检响应需返回 Access-Control-Allow-Headers 含 X-App-Id、Access-Control-Allow-Methods、Access-Control-Allow-Credentials:true。", "kaodian": "AI前端能力-网络与BFF架构-跨域凭据请求预检"}, {"no": 15, "type": "single", "body": "上面测试用例在“余额不足导致支付业务失败（HTTP 仍返回 200、body.code=1）”时，测试会？", "code": "// 接口约定：code=0 成功，code≠0 业务失败\nconst r = await axios.post('/api/pay', payload);\nexpect(r.status).toBe(200);   // 只断言 HTTP 状态", "options": [{"k": "A", "t": "抛异常，因为响应体含 code=1"}, {"k": "B", "t": "随机，取决于网络"}, {"k": "C", "t": "通过（假阳性），因为只判了 HTTP 200，没判业务 code"}, {"k": "D", "t": "失败，因为 HTTP 200 代表业务一定成功"}], "answer": ["C"], "explain": "很多接口把业务失败放在 HTTP 200 + 业务 code 字段，只断言 status 会漏掉业务错误，造成假绿（假通过）。应同时断言 r.data.code === 0。", "kaodian": "AI质量保障-接口测试-HTTP状态码与业务code断言"}, {"no": 16, "type": "single", "body": "CI 里 `tsc --noEmit` 通过，但下一步 `vite build` 报错找不到 ./Comp.vue。最可能？", "code": "// CI 脚本\n- run: npx tsc --noEmit\n- run: npx vite build\n// tsc 通过，vite build 报：Could not resolve './Comp.vue' ...", "options": [{"k": "A", "t": "tsc 和 vite 用不同 tsconfig，所以结果必然相反"}, {"k": "B", "t": "一定是 vite 版本太低不支持 .vue"}, {"k": "C", "t": "tsc --noEmit 本来就会忽略所有 import 错误"}, {"k": "D", "t": "tsc 只做类型检查不过问模块解析，vite 按真实路径加载；Comp.vue 文件名大小写或路径实际不符"}], "answer": ["D"], "explain": "tsc --noEmit 只检查类型，import \"./Comp.vue\" 在类型层面由 shims-vue.d.ts 声明成 any 而不解析真实文件；vite 构建时按真实路径加载，文件名大小写/路径不符就报找不到。", "kaodian": "AI质量保障-CICD与质量门禁-tsc类型检查与构建差异"}, {"no": 17, "type": "single", "body": "上面第二行点击 .result，但 .result 是点击 submit 后才异步出现的元素。Playwright 默认行为是？", "code": "await page.click('#submit');\nawait page.locator('.result').click();  // 结果异步渲染", "options": [{"k": "A", "t": "自动等待元素出现并可点击后再点，无需 sleep"}, {"k": "B", "t": "直接跳过该点击不执行任何操作"}, {"k": "C", "t": "因元素异步出现，必须加 waitForTimeout 才稳"}, {"k": "D", "t": "立即点击并在元素未出现时抛 TimeoutError"}], "answer": ["A"], "explain": "Playwright 的 locator 操作内置 auto-wait，自动轮询直到元素可见、稳定、可操作；硬等 sleep 反而不稳健且易 flaky。", "kaodian": "AI质量保障-自动化测试-PlaywrightLocator自动等待"}, {"no": 18, "type": "single", "body": "横线处应填哪一行来断言 divide(1,0) 抛出 ArithmeticException？", "code": "@Test\nvoid testDivideByZero() {\n    Calculator c = new Calculator();\n    /* ______ */                          // 断言 divide(1,0) 抛 ArithmeticException\n}", "options": [{"k": "A", "t": "try { c.divide(1,0); } catch (Exception e) { Assertions.assertTrue(e instanceof ArithmeticException); }"}, {"k": "B", "t": "Assertions.assertThrows(ArithmeticException.class, () -> c.divide(1, 0));"}, {"k": "C", "t": "Assertions.assertEquals(ArithmeticException.class, c.divide(1,0));"}, {"k": "D", "t": "Assertions.expectThrows(ArithmeticException.class, c.divide(1,0));"}], "answer": ["B"], "explain": "JUnit5 用 Assertions.assertThrows(expectedType, executable) 断言 lambda 中抛出的异常；C 类型不匹配，D 方法名错（应为 assertThrows），A 虽能判但写法繁琐且若未抛会漏测。", "kaodian": "AI质量保障-自动化测试-JUnit5异常断言"}, {"no": 19, "type": "single", "body": "本次发布只修改了“优惠券计算”模块，回归测试应该怎么选？", "code": "// 本次只改了“优惠券计算”模块\n// 回归用例库有 200 条，全跑太慢", "options": [{"k": "A", "t": "完全不跑回归，因为改动很小"}, {"k": "B", "t": "只跑冒烟，不跑任何优惠券相关用例"}, {"k": "C", "t": "只跑与优惠券计算直接相关的用例，并补跑其下游依赖链路（如订单、支付）的冒烟，而非全量 200 条"}, {"k": "D", "t": "200 条全跑，确保零遗漏"}], "answer": ["C"], "explain": "回归测试应基于“变更影响分析”圈定范围：直接受影响模块 + 其依赖/被依赖链路，优先跑这些，再辅以核心冒烟；全量太慢、完全不跑易漏。", "kaodian": "AI质量保障-软件测试理论与质量体系-回归用例精选策略"}, {"no": 20, "type": "single", "body": "本版本发布前发现缺陷 40 个并全部修复，发布后线上用户又发现 10 个漏测缺陷。缺陷逃逸率（Defect Escape Rate）约为？", "code": "// 测试发现 40，全部修复\n// 线上新发现 10 个漏测缺陷", "options": [{"k": "A", "t": "10 / 40 = 25%"}, {"k": "B", "t": "40 / (40 + 10) ≈ 80%"}, {"k": "C", "t": "10 / 10 = 100%"}, {"k": "D", "t": "10 / (40 + 10) ≈ 20%"}], "answer": ["D"], "explain": "逃逸率 = 线上发现的缺陷数 / (测试发现数 + 线上发现数) = 10 / 50 = 20%，衡量测试有效性。", "kaodian": "AI质量保障-质量工程-线上缺陷逃逸率"}]}, {"name": "二、多选题（7 题 · 28 分）", "cat": "multi", "questions": [{"no": 1, "type": "multi", "body": "关于 RabbitMQ 消息可靠投递的“三环节”，判断下列各项是否正确：", "code": "// 1. 生产者 -> Broker：开启 confirm 确认\nspring.rabbitmq.publisher-confirm-type=correlated\n// 2. Broker 持久化：队列与消息都 durable\n// 3. 消费者 -> Broker：手动 ack，处理完再 basicAck\nchannel.basicConsume(q, false, deliverCallback, cancelCb);", "options": [{"k": "A", "t": "开启 publisher-confirm 后，消息只要发到 Broker 内存即回调 ack，无需队列持久化也能保证不丢"}, {"k": "B", "t": "队列和消息都设置 durable，即使 Broker 重启消息也不丢"}, {"k": "C", "t": "消费者用自动 ack（autoAck=true）即可，无需手动 basicAck"}, {"k": "D", "t": "只有三个环节都做对，才能端到端不丢消息；任一环节漏掉都有丢消息风险"}], "answer": ["B", "D"], "explain": "1) confirm 只说明 Broker 已收到，是否持久化还要看 durable（A 错）；2) 队列+消息都 durable 才能扛重启（B 对）；3) autoAck 在投递即 ack，处理失败就丢（C 错），必须手动 ack；综上三者缺一不可（D 对）。", "kaodian": "AI后端能力-高并发与中间件层-RabbitMQ端到端可靠投递"}, {"no": 2, "type": "multi", "body": "给定表 t_user(idx_name(name), idx_age(age))，判断下列查询是否命中索引：", "code": "-- 1. SELECT * FROM t_user WHERE name = 'tom';\n-- 2. SELECT * FROM t_user WHERE LEFT(name,3) = 'tom';\n-- 3. SELECT * FROM t_user WHERE name LIKE '%tom%';\n-- 4. SELECT * FROM t_user WHERE age + 1 = 25;", "options": [{"k": "A", "t": "语句1命中 idx_name（最左前缀匹配等值）"}, {"k": "B", "t": "语句2命中索引，因为仍是对 name 列做函数计算"}, {"k": "C", "t": "语句3命中 idx_name，因为 LIKE 都走索引"}, {"k": "D", "t": "语句4不会命中 idx_age，因为对索引列做了运算"}], "answer": ["A", "D"], "explain": "1) 等值命中 idx_name（A 对）；2) 对列套函数 LEFT() 使索引失效（B 错）；3) 前模糊 %tom% 不走索引（C 错）；4) 对索引列 age 做运算 age+1 使索引失效（D 对）。", "kaodian": "AI后端能力-数据存储层-索引失效场景"}, {"no": 3, "type": "multi", "body": "判断下列哪些情形会导致 @Transactional 不生效或不回滚：", "code": "@Service\npublic class S {\n    @Transactional public void a() { b(); }\n    @Transactional public void b() { /* ... */ }\n    public void c() { b(); }             // 同类 this 调用\n    @Transactional private void d() { }  // private\n}", "options": [{"k": "A", "t": "同类内部 this 调用带 @Transactional 的方法（自调用）——事务不生效"}, {"k": "B", "t": "方法是 private，Spring AOP 代理无法拦截——事务不生效"}, {"k": "C", "t": "异常被方法内 catch 后没有重新抛出——事务不回滚"}, {"k": "D", "t": "抛出受检异常（Exception 但非 RuntimeException）且未配 rollbackFor——默认不回滚"}], "answer": ["A", "B", "C", "D"], "explain": "A) 自调用绕过代理，@Transactional 不生效；B) private 方法不被代理拦截；C) 吞掉异常导致不会触发回滚；D) Spring 默认只对 RuntimeException/Error 回滚，受检异常需配 rollbackFor。四种都是典型事务失效/不回滚场景。", "kaodian": "AI后端能力-应用框架层-Transactional失效情形"}, {"no": 4, "type": "multi", "body": "判断下列关于 Vue3 响应式“丢失”的说法哪些正确：", "code": "const state = reactive({ n: 1 });\nlet { n } = state;           // 解构\nconst plain = { ...state };  // 展开\nstate.n = 2;", "options": [{"k": "A", "t": "解构出的 n 失去响应式，后续 state.n 变化不会同步到 n"}, {"k": "B", "t": "展开运算符浅拷贝得到的 plain 与原 state 共享同一响应式代理，修改 plain.n 会影响 state"}, {"k": "C", "t": "用 toRefs(state) 解构得到的 ref，访问 .value 始终跟随 state.n"}, {"k": "D", "t": "reactive 对象重新整体赋值（state = {...}）会保持响应式"}], "answer": ["A", "C"], "explain": "A) 解构是值拷贝，n 脱离代理失去响应式（对）；B) 展开得到的是普通对象，不共享响应式（错）；C) toRefs 为每个属性建 ref，保持连接（对）；D) 重新赋值让 state 指向普通对象，脱离代理（错）。", "kaodian": "AI前端能力-语言与运行时-响应式丢失陷阱"}, {"no": 5, "type": "multi", "body": "判断下列哪些用 Chrome DevTools 定位 500 错误的做法正确：", "code": "// 前端请求 /api/order 返回 500\n// Network 面板该请求：Status 500，Response 里有 {\"msg\":\"NullPointer\"}\n// Headers 里 Request URL = /api/order，Method = POST", "options": [{"k": "A", "t": "在 Network 面板点开该请求，看 Response 标签可直接看到后端返回的错误信息"}, {"k": "B", "t": "看 Headers 标签的 Request Headers 能确认前端实际发出的 URL、Method、参数"}, {"k": "C", "t": "500 一定是前端代码写错，DevTools 看后端响应没用"}, {"k": "D", "t": "用 Console 面板只能看 JS 报错，无法看到这次 HTTP 请求的 500 详情"}], "answer": ["A", "B"], "explain": "A) Network 的 Response 标签展示服务端返回体，是定位 500 的首要位置（对）；B) Headers 的 Request 部分可核对前端实际发出的 URL/Method/参数（对）；C) 500 是服务端错误，看响应有用（错）；D) Console 也会打印失败请求，但 Network 才是看详情处（错）。", "kaodian": "AI前端能力-前端生态-DevTools定位500"}, {"no": 6, "type": "multi", "body": "团队用 AI 生成了一批测试用例，判断下列哪些是评审时必须核对的：", "code": "// AI 生成示例\ntest('login', () => {\n  expect(login('', '')).toBe(true);  // AI 擅自假设空密码能登录\n});", "options": [{"k": "A", "t": "预期结果是否由人工确认，不能盲信 AI 给的“期望”"}, {"k": "B", "t": "断言是否真实可执行、不依赖未定义的变量/环境"}, {"k": "C", "t": "AI 生成的用例必然覆盖所有边界，无需补充"}, {"k": "D", "t": "业务规则假设（如空密码能否登录）是否与需求一致"}], "answer": ["A", "B", "D"], "explain": "A) AI 给的“期望”可能是错的，必须人工确认（对）；B) 断言要可执行、不依赖未定义变量（对）；C) AI 不保证覆盖边界，仍需人工补（错）；D) 业务假设要与需求对齐（对）。", "kaodian": "AI质量保障-AI辅助测试-AI生成测试评审要点"}, {"no": 7, "type": "multi", "body": "判断下列哪些属于 CI 质量门禁（Quality Gate）的合理组成：", "code": "// 流水线门禁配置\nstages:\n  - unit-test (覆盖率 >= 80%)\n  - tsc --noEmit\n  - sonar 扫描 (新增 bloc 为 0)", "options": [{"k": "A", "t": "单元测试覆盖率阈值（如 >=80%）未达标则阻断合并"}, {"k": "B", "t": "类型检查 tsc --noEmit 失败则阻断"}, {"k": "C", "t": "静态扫描（Sonar）发现严重漏洞/坏味道超阈值则阻断"}, {"k": "D", "t": "质量门禁只需要在上线后人工检查，CI 不需要卡"}], "answer": ["A", "B", "C"], "explain": "质量门禁应在 CI 自动卡点：覆盖率阈值（A）、类型检查（B）、静态扫描（C）未达标即阻断合并，而非事后人工（D 错）。", "kaodian": "AI质量保障-CICD与质量门禁-质量门禁构成"}]}, {"name": "三、判断题（6 题 · 12 分）", "cat": "judge", "questions": [{"no": 1, "type": "judge", "body": "生产者往 topic（3 分区）发送订单事件且未指定 key。判断题：Kafka 能保证“同一个 topic 内所有消息严格按发送顺序被消费者消费”。", "code": "kafkaTemplate.send(\"order-topic\", orderEvent);  // 未设 key，按轮询分散到 3 个分区", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "Kafka 只保证分区内有序；未指定 key 时消息按轮询分散到不同分区，跨分区不保证全局顺序。要保证同业务键有序需指定相同 key。", "kaodian": "AI后端能力-高并发与中间件层-Kafka分区内有序"}, {"no": 2, "type": "judge", "body": "在 Vue3 的同一节点上同时使用 v-if 和 v-for，v-if 的优先级更高。", "code": "<li v-for=\"u in users\" v-if=\"u.active\" :key=\"u.id\">{{ u.name }}</li>", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "Vue3 中 v-if 优先级高于 v-for（与 Vue2 相反）；同一节点同时用二者，v-if 无法访问 v-for 的变量，应避免。推荐外层 template v-for 包内层 v-if。", "kaodian": "AI前端能力-前端基础与渲染引擎-vif与vfor优先级"}, {"no": 3, "type": "judge", "body": "跨域限制是浏览器实施的同源策略；服务端与不同源的服务之间直接发起 HTTP 请求并不受此限制。", "code": "// 后端服务直接调用第三方 API，不经过浏览器\nRestTemplate.getForObject(\"https://other.com/api\", String.class);", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "同源策略是浏览器端安全机制，保护用户；服务端到服务端的调用没有“源”概念，不受 CORS 限制（CORS 报文也是由浏览器在客户端校验的）。", "kaodian": "AI前端能力-网络与BFF架构-跨域是浏览器策略"}, {"no": 4, "type": "judge", "body": "在自动化测试里，用 console.log 打印实际值代替断言（expect），也能算通过测试。", "code": "test('add', () => {\n  console.log(add(1, 2));  // 打印 3，但没有 expect\n});", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["错误"], "explain": "没有断言的“测试”永远不会失败，属于假绿；必须用 expect/assert 显式断言预期，测试才有判定意义。", "kaodian": "AI质量保障-软件测试理论与质量体系-ConsoleLog不能替代断言"}, {"no": 5, "type": "judge", "body": "单元测试应当“小而快、相互独立”，不依赖数据库、网络等外部状态。", "code": "@Test\nvoid shouldAdd() {\n    assertEquals(3, new Calc().add(1, 2));  // 不连库、不联网\n}", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "单元测试聚焦最小代码单元，应可重复、独立、毫秒级；外部依赖用 Mock/Stub 隔离，避免共享状态导致顺序依赖与 flaky。", "kaodian": "AI质量保障-软件测试理论与质量体系-单元测试独立性"}, {"no": 6, "type": "judge", "body": "测试金字塔主张：底层单元测试数量最多，越往上的端到端（E2E）测试数量越少。", "code": "// 推荐结构（数量）\n// 单元测试  >>>  集成测试  >  端到端测试", "options": [{"k": "正确", "t": "正确"}, {"k": "错误", "t": "错误"}], "answer": ["正确"], "explain": "金字塔结构（单元 > 集成 > E2E）保证快速反馈与低成本；倒金字塔（E2E 过多）会导致慢、脆、难维护。", "kaodian": "AI质量保障-软件测试理论与质量体系-金字塔测试策略"}]}]}</script>
<script>
window.QUIZ = JSON.parse(document.getElementById('quizData').textContent);
</script>

<script>
const norm = s => (s||'').toString().toLowerCase()
  .replace(/[\s'"`\u2018\u2019\u201c\u201d（）()\[\]{}·.,，。；;:：\-_/\\]/g,'');
const esc = s => (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function optHtml(o){ return '<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'+esc(o.t)+'</span></div>'; }
function fillBody(body){ let i=0; return body.replace(/【空\d+】/g, ()=>'<input class="blank" data-i="'+(i++)+'" autocomplete="off">'); }

function renderQuiz(){
  document.getElementById('quizTitle').textContent = QUIZ.title;
  document.getElementById('quizSub').textContent = QUIZ.sub;
  document.getElementById('quizMeta').innerHTML = QUIZ.meta;
  let html='';
  let gno=1; // 全局题号，保证 id/data-no/锚点唯一（JSON 内各 section 的 no 可能重复）
  QUIZ.sections.forEach(sec=>{
    html += '<div class="section"><h2>'+esc(sec.name)+'</h2>';
    sec.questions.forEach(q=>{
      q._gno=gno; // 绑定全局题号，供 qByNo 等按编号查找
      const tagCls={single:'tag-single',multi:'tag-multi',judge:'tag-judge',fill:'tag-fill'}[q.type];
      const tagTxt={single:'单选',multi:'多选',judge:'判断',fill:'填空'}[q.type];
      const kao = q.kaodian ? '<span class="kaodian" title="'+esc(q.kaodian)+'">'+esc(q.kaodian)+'</span>' : '';
      html += '<div class="card" id="card-'+gno+'" data-no="'+gno+'" data-type="'+q.type+'">';
      html += '<div class="q-head"><span class="q-no">'+gno+'.</span><span class="tag '+tagCls+'">'+tagTxt+'</span>'+kao+'<span class="res-badge" style="display:none"></span></div>';
      html += '<div class="q-body">'+(q.type==='fill'?fillBody(q.body):esc(q.body))+'</div>';
      if(q.code) html += '<div class="code">'+esc(q.code)+'</div>';
      if(q.type==='single'||q.type==='multi'||q.type==='judge'){
        html += '<div class="options">'+q.options.map(optHtml).join('')+'</div>';
      }
      html += '<div class="answer"><div class="ans"></div><div><span class="label">讲解：</span>'+esc(q.explain)+'</div></div>';
      if(q.type==='multi'||q.type==='fill'){
        html += '<div class="q-actions"><button class="q-check" data-no="'+q.no+'">核对本题</button></div>';
      }
      html += '</div>';
      gno++;
    });
    html += '</div>';
  });
  document.getElementById('quizRoot').innerHTML = html;
  bindOptions();
  updateProgress();
  renderUserBox();
  loadRecord().then(rec=>{ if(rec && rec.done){ restore(rec); } });
}

let submitted=false;
function allQ(){ return QUIZ.sections.flatMap(s=>s.questions); }
function qByNo(no){ return allQ().find(q=>q._gno==no); }

function bindOptions(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const card=opt.closest('.card');
      if(card.classList.contains('graded')) return;
      const type=card.dataset.type;
      if(type==='multi'){ opt.classList.toggle('sel'); updateProgress(); }
      else { card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel');
             if(type==='single'||type==='judge') gradeCard(card); }
    });
  });
  document.querySelectorAll('.blank').forEach(b=> b.addEventListener('input', updateProgress));
  document.querySelectorAll('.q-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const card=btn.closest('.card'); if(card) gradeCard(card); });
  });
}
function getUserAnswer(card){
  const type=card.dataset.type;
  if(type==='fill'){ return [...card.querySelectorAll('.blank')].map(b=>b.value.trim()); }
  return [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
}
function isAnswered(card){
  const ua=getUserAnswer(card);
  if(card.dataset.type==='fill') return ua.some(v=>v!=='');
  return ua.length>0;
}
function updateProgress(){
  const cards=[...document.querySelectorAll('.card')];
  const graded=cards.filter(c=>c.classList.contains('graded')).length;
  document.getElementById('prog').innerHTML='已核对 <b>'+graded+'</b> / '+cards.length+' 题 · 当前 <b>'+correctCount+'</b> 分';
}
function judge(q, ua){
  if(q.type==='fill'){
    if(ua.length<q.blanks) return false;
    for(let i=0;i<q.blanks;i++){
      const v=norm(ua[i]); if(!v) return false;
      const ok=q.accept[i].some(kw=> v.includes(norm(kw)) || norm(kw).includes(v));
      if(!ok) return false;
    }
    return true;
  }
  const a=[...q.answer].sort().join(','); const b=[...ua].sort().join(',');
  return a===b;
}
let correctCount=0, finalized=false;
function revealCard(card,q,ua,ok){
  card.classList.add(ok?'correct':'wrong');
  const badge=card.querySelector('.res-badge');
  badge.style.display='inline-block';
  badge.className='res-badge '+(ok?'ok':'no');
  badge.textContent=ok?'✔ 答对':'✘ 答错';
  if(q.type==='fill'){
    if(ua){
      card.querySelectorAll('.blank').forEach((b,i)=>{
        const v=norm(b.value); const good=v && q.accept[i].some(kw=> v.includes(norm(kw))||norm(kw).includes(v));
        b.classList.add(good?'correct':'wrong'); b.disabled=true;
      });
    } else { card.querySelectorAll('.blank').forEach(b=>b.disabled=true); }
  } else {
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('locked');
      const k=o.dataset.k; const chosen=o.classList.contains('sel');
      if(q.answer.includes(k)) o.classList.add('correct');
      else if(chosen) o.classList.add('wrong');
    });
  }
  const ans=card.querySelector('.answer');
  if(ans){
    let ansText='';
    if(q.type==='fill'){ ansText = (q.answerText!==undefined)? q.answerText : (Array.isArray(q.answer)? q.answer.join('、') : ''); }
    else { const arr = Array.isArray(q.answer)? q.answer : (q.answer!=null? String(q.answer).split('') : []); ansText = arr.join('、'); }
    const ansEl=ans.querySelector('.ans');
    if(ansEl) ansEl.textContent='答案：'+ansText;
    ans.classList.add('show');
  }
}
function gradeCard(card){
  if(card.classList.contains('graded')) return;
  const q=qByNo(card.dataset.no); const ua=getUserAnswer(card);
  // 未作答也直接展示答案（不再用 confirm 阻断：部分浏览器/WebView 会静默拒绝 confirm，导致答案永远不显示）
  const ok=judge(q,ua);
  revealCard(card,q,ua,ok);
  card.classList.add('graded');
  if(ok) correctCount++;
  updateProgress();
  if(document.querySelectorAll('.card.graded').length===document.querySelectorAll('.card').length) finalize();
}
function finalize(){
  if(finalized) return; finalized=true;
  const cards=[...document.querySelectorAll('.card')];
  const wrong=cards.filter(c=>!c.classList.contains('correct')).map(c=>+c.dataset.no);
  showResult(correctCount, cards.length, wrong);
  const answersMap={}; cards.forEach(c=>answersMap[c.dataset.no]=getUserAnswer(c));
  saveRecord({done:true, score:correctCount, total:cards.length, wrong:wrong, answers:answersMap});
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function submit(){
  if(finalized) return;
  const cards=[...document.querySelectorAll('.card')];
  const ungraded=cards.filter(c=>!c.classList.contains('graded'));
  if(ungraded.length>0){
    if(!confirm('还有 '+ungraded.length+' 题未核对，将按当前作答判分（未作答计为错）。确定交卷？')) return;
    ungraded.forEach(gradeCard);
  }
  finalize();
}
function showResult(correct,total,wrong){
  const p=document.getElementById('resultPanel'); p.classList.add('show');
  let h='<div class="score">'+correct+' <small>/ '+total+' 分</small></div>';
  h+='<div class="line">正确率 '+Math.round(correct/total*100)+'%\u3000\u00b7\u3000答对 '+correct+' 题，答错 '+wrong.length+' 题</div>';
  if(wrong.length){
    h+='<div class="wrongs"><b>错题：</b>'+wrong.map(n=>'<a href="#card-'+n+'">第 '+n+' 题</a>').join('')+'</div>';
    h+='<div class="line" style="color:#9aa0a6">错题已记录'+(QB&&QB.isLogin()?'到后台数据库':'到本机浏览器')+'。</div>';
  } else { h+='<div class="line" style="color:#52c41a;font-weight:700">满分！全部答对 \ud83c\udf89</div>'; }
  p.innerHTML=h;
}
let onlyWrong=false;
function toggleOnlyWrong(){
  onlyWrong=!onlyWrong;
  document.getElementById('onlyWrongBtn').textContent = onlyWrong?'显示全部':'只看错题';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (onlyWrong && !c.classList.contains('wrong')) ? 'none':'';
  });
}
function redo(){
  if(!confirm('重做本卷？将清除本卷作答记录并重新开始。')) return;
  if(QB && QB.isLogin()){
    // 后端记录由下次提交覆盖；这里直接前端重置
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  } else {
    localStorage.removeItem('fsp:'+QUIZ.id);
    location.reload();
  }
}
// ---- 后端优先 / localStorage 兜底 ----
async function saveRecord(rec){
  if(QB && QB.isLogin()){
    try{
      await QB.apiPost('/api/records', {
        volId: QUIZ.id, score: rec.score, total: rec.total,
        wrong: rec.wrong, answers: JSON.stringify(rec.answers||{})
      });
      return;
    }catch(e){ /* 后端失败降级 */ }
  }
  localStorage.setItem('fsp:'+QUIZ.id, JSON.stringify(rec));
}
async function loadRecord(){
  if(QB && QB.isLogin()){
    try{
      const rv = await QB.apiGet('/api/records/'+QUIZ.id);
      if(rv) return { done:true, score:rv.score, total:rv.total, wrong: JSON.parse(rv.wrong||'[]'), answers: JSON.parse(rv.answers||'{}') };
    }catch(e){ /* 降级 */ }
  }
  try{ return JSON.parse(localStorage.getItem('fsp:'+QUIZ.id)); }catch(e){ return null; }
}
function restore(saved){
  finalized=true;
  document.querySelectorAll('.card').forEach(card=>{
    const q=qByNo(card.dataset.no); const ok=!saved.wrong.includes(Number(q.no));
    revealCard(card,q,null,ok);
    card.classList.add('graded');
    if(ok) correctCount++;
  });
  showResult(saved.score, saved.total, saved.wrong);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('onlyWrongBtn').style.display='inline-block';
  document.getElementById('prog').innerHTML='本卷已完成 \u00b7 得分 <b>'+saved.score+'</b>/'+saved.total;
}
function renderUserBox(){
  const box=document.getElementById('userBox');
  if(QB && QB.isLogin()){
    box.innerHTML='用户：'+QB.user()+' \u00b7 <a id="logoutLink">登出</a>';
    document.getElementById('logoutLink').onclick=()=>{ QB.clear(); location.reload(); };
  } else {
    box.innerHTML='<a id="loginLink">登录 / 注册</a>（记录可同步到后台）';
    document.getElementById('loginLink').onclick=()=>{ QB.showLogin(()=>location.reload()); };
  }
}
renderQuiz();
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('onlyWrongBtn').addEventListener('click', toggleOnlyWrong);
</script>
